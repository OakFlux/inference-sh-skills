name: Huajin Capital filings archive v2 20261012
on:
  push:
    paths:
      - '.github/workflows/build-huajin-capital-000532-filings-v2-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Build archive
        shell: bash
        run: python scripts/build_huajin_capital_000532_filings_20261012.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: huajin-capital-000532-filings-20261012
          path: 华金资本_000532_2020-2025年报及最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
