name: Probe Hangzhou Thermal Power IPO reports 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-hangzhou-thermal-ipo-reports-20261004.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_hangzhou_thermal_ipo_reports_20261004.py
