name: Build ST Gudi official filings package 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/st-gudi-filings-package-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build and validate package
        run: python scripts/build_st_gudi_filings_20261004.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: st-gudi-002694-filings-20261004
          path: ST顾地_002694_2020-2025年报_2026最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
