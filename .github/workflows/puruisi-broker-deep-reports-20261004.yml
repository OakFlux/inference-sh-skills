name: Build Puruisi broker deep reports 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puruisi-broker-deep-reports-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build verified package
        run: python scripts/build_puruisi_broker_deep_reports_20261004.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: puruisi-301257-broker-deep-reports-20261004
          path: 普蕊斯_301257_券商深度报告_3份_20261004.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
