name: List Jinlang long reports 2019-2026

on:
  push:
    paths:
      - '.github/workflows/list-jinlang-long-reports-2019-2026.yml'
      - 'scripts/list_jinlang_long_reports_2019_2026.py'
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: List long reports
        run: python scripts/list_jinlang_long_reports_2019_2026.py
