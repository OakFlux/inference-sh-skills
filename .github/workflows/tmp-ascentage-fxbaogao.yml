name: Temporary Ascentage FXBaogao discovery
on:
  push:
    branches: ['tmp/ascentage-reports-20260828']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch report pages and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          for id in 4682729 3702828; do
            for page in detail view; do
              curl -L --fail --show-error --silent --compressed --connect-timeout 15 --max-time 90 --retry 2 \
                --user-agent "$UA" "https://www.fxbaogao.com/${page}?id=${id}" -o "diagnostics/${page}_${id}.html" || true
            done
            curl -L --fail --show-error --silent --compressed --connect-timeout 15 --max-time 90 --retry 2 \
              --user-agent "$UA" "https://www.fxbaogao.com/detail/${id}" -o "diagnostics/detailpath_${id}.html" || true
          done
          python - <<'PY'
          import html,re,urllib.parse,urllib.request
          from pathlib import Path
          urls=set()
          for p in Path('diagnostics').glob('*.html'):
              text=p.read_text(encoding='utf-8',errors='ignore')
              base='https://www.fxbaogao.com/'
              for u in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
                  full=urllib.parse.urljoin(base,html.unescape(u))
                  urls.add(full)
          Path('diagnostics/js_urls.txt').write_text('\n'.join(sorted(urls)),encoding='utf-8')
          for i,u in enumerate(sorted(urls)):
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/'})
                  b=urllib.request.urlopen(req,timeout=60).read()
                  Path(f'diagnostics/js_{i:03d}.js').write_bytes(b)
              except Exception as e:
                  with open('diagnostics/errors.txt','a',encoding='utf-8') as f:f.write(f'{u}\t{e!r}\n')
          PY
          grep -RIEo 'https?[^"<> ]+\.pdf([^"<> ]*)?|https?[^"<> ]+(download|file|view|report|pdf)[^"<> ]*|/[A-Za-z0-9_./?=&:%${}+-]*(download|file|view|report|pdf)[A-Za-z0-9_./?=&:%${}+-]*' diagnostics \
            | sort -u > diagnostics/candidate_urls.txt || true
          grep -RInE '4682729|3702828|report-image|public\.fxbaogao|download|pdf|view\?|/api/' diagnostics \
            > diagnostics/relevant_lines.txt || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ascentage-fxbaogao-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
