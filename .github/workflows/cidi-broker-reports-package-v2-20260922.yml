name: Build corrected CIDI broker reports package 20260922
on:
  push:
    paths:
      - '.github/workflows/cidi-broker-reports-package-v2-20260922.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Correct verified report page count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_cidi_broker_reports_package.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"pages": 68,', '"pages": 70,', 1)
          s = s.replace('20260115_68页.pdf', '20260115_70页.pdf', 1)
          s = s.replace('2026年1月15日，68页', '2026年1月15日，70页', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install PDF and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow img2pdf pypdf
      - name: Download, compile, and validate reports
        run: python scripts/build_cidi_broker_reports_package.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cidi-03881-broker-deep-reports-2-corrected
          path: 希迪智驾_03881_券商深度报告_2份_20260922.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
