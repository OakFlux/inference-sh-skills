name: Build Everbright Securities 601788 reports ZIP 20260927

on:
  push:
    paths:
      - '.github/workflows/everbright-securities-601788-reports-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from datetime import datetime
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          STOCK = '601788'
          COMPANY = '光大证券'
          FULL_COMPANY = '光大证券股份有限公司'
          AS_OF = '2026-09-27'
          PACKAGE = '光大证券_601788.SH_2020-2025年报及最新季报'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)
          VERIFY = Path('_verify')
          VERIFY.mkdir(exist_ok=True)

          session = requests.Session()
          retry = Retry(
              total=6,
              connect=6,
              read=6,
              status=6,
              backoff_factor=1.2,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': f'https://data.eastmoney.com/notices/stock/{STOCK}.html',
          })

          def clean_title(value: str) -> str:
              value = re.sub(r'<[^>]+>', '', value or '')
              value = value.replace('&nbsp;', '').replace('&#32;', '')
              return re.sub(r'\s+', '', value)

          def parse_date(value: str) -> datetime:
              text = str(value or '')
              match = re.search(r'(20\d{2})[-/](\d{1,2})[-/](\d{1,2})', text)
              if match:
                  y, m, d = map(int, match.groups())
                  return datetime(y, m, d)
              return datetime(1900, 1, 1)

          rows: list[dict] = []
          endpoint = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          for page in range(1, 16):
              params = {
                  'page_size': 100,
                  'page_index': page,
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': STOCK,
              }
              response = session.get(endpoint, params=params, timeout=(30, 120))
              print('ANNOUNCEMENT_API', page, response.status_code, len(response.content), flush=True)
              response.raise_for_status()
              data = response.json()
              batch = ((data.get('data') or {}).get('list') or (data.get('data') or {}).get('data') or data.get('list') or [])
              rows.extend(batch)
              if len(batch) < 100:
                  break
              time.sleep(0.25)

          normalized: list[dict] = []
          seen_codes: set[str] = set()
          for row in rows:
              title = clean_title(str(row.get('title') or row.get('notice_title') or row.get('announcement_title') or ''))
              art_code = str(row.get('art_code') or row.get('info_code') or row.get('infoCode') or row.get('announcement_id') or '')
              date = str(row.get('notice_date') or row.get('display_time') or row.get('date') or '')
              if not title or not art_code or art_code in seen_codes:
                  continue
              seen_codes.add(art_code)
              normalized.append({'title': title, 'art_code': art_code, 'date': date, 'raw': row})

          (VERIFY / 'announcement_candidates.json').write_text(
              json.dumps(normalized, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('NORMALIZED_COUNT', len(normalized), flush=True)

          exclusions = (
              '摘要', '英文版', '审计报告', '内部控制', '社会责任', '环境、社会', 'ESG',
              '董事会工作', '监事会工作', '提示性公告', '取消', '更正公告', '问询函',
              '回复', '专项说明', '核查意见', '财务报表', '业绩快报', '业绩预告',
          )

          def is_full_report(title: str) -> bool:
              return not any(term in title for term in exclusions)

          def annual_candidates(year: int) -> list[dict]:
              marker = f'{year}年年度报告'
              candidates = []
              for row in normalized:
                  title = row['title']
                  if marker not in title or not is_full_report(title):
                      continue
                  score = 0
                  exact_patterns = [
                      rf'^{COMPANY}[:：]?{year}年年度报告(?:\(修订版\)|（修订版）|修订版|修订稿)?$',
                      rf'^{FULL_COMPANY}{year}年年度报告(?:\(修订版\)|（修订版）|修订版|修订稿)?$',
                  ]
                  if any(re.fullmatch(p, title) for p in exact_patterns):
                      score += 100
                  if any(term in title for term in ('修订版', '修订稿', '更新版')):
                      score += 25
                  if COMPANY in title:
                      score += 10
                  candidates.append((score, parse_date(row['date']), row))
              candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
              return [item[2] for item in candidates]

          selected: list[dict] = []
          for year in range(2020, 2026):
              candidates = annual_candidates(year)
              if not candidates:
                  related = [r['title'] for r in normalized if str(year) in r['title'] and '年度报告' in r['title']]
                  raise RuntimeError(f'未找到{year}年完整年度报告；相关标题：{related}')
              row = candidates[0]
              selected.append({
                  'kind': 'annual',
                  'year': year,
                  'filename': f'{year - 2019:02d}_光大证券_{year}年年度报告.pdf',
                  'expected_terms': [COMPANY, str(year), '年度报告'],
                  'min_pages': 80,
                  'min_bytes': 500_000,
                  'row': row,
              })

          quarter_regex = re.compile(r'(20\d{2})年(?:第一|第三|一|三)季度报告')
          quarter_candidates: list[tuple[datetime, int, dict]] = []
          for row in normalized:
              title = row['title']
              match = quarter_regex.search(title)
              if not match or not is_full_report(title):
                  continue
              score = 0
              if re.fullmatch(rf'(?:{COMPANY}[:：]?|{FULL_COMPANY})20\d{{2}}年(?:第一|第三|一|三)季度报告', title):
                  score += 100
              if COMPANY in title:
                  score += 10
              quarter_candidates.append((parse_date(row['date']), score, row))
          if not quarter_candidates:
              raise RuntimeError('未找到任何正式季度报告。')
          quarter_candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
          quarter_row = quarter_candidates[0][2]
          qmatch = quarter_regex.search(quarter_row['title'])
          qyear = int(qmatch.group(1))
          if '第三' in qmatch.group(0) or '三季度' in qmatch.group(0):
              qlabel = f'{qyear}年第三季度报告'
              qterm = '第三季度报告'
          else:
              qlabel = f'{qyear}年第一季度报告'
              qterm = '第一季度报告'
          selected.append({
              'kind': 'quarter',
              'year': qyear,
              'filename': f'07_光大证券_{qlabel}.pdf',
              'expected_terms': [COMPANY, str(qyear), qterm],
              'min_pages': 8,
              'min_bytes': 100_000,
              'row': quarter_row,
          })

          print('SELECTED', json.dumps([
              {'filename': doc['filename'], 'title': doc['row']['title'], 'date': doc['row']['date'], 'art_code': doc['row']['art_code']}
              for doc in selected
          ], ensure_ascii=False, indent=2), flush=True)

          def mirror_urls(art_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{art_code}_1.pdf',
              ]

          def download_pdf(doc: dict, dest: Path) -> str:
              errors = []
              for url in mirror_urls(doc['row']['art_code']):
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(
                              url,
                              headers={'Referer': 'https://data.eastmoney.com/'},
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 600),
                          ) as response:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, response.status_code,
                                    response.headers.get('Content-Type'), response.headers.get('Content-Length'), url, flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          data = tmp.read_bytes()
                          if len(data) < doc['min_bytes'] or not data.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF bytes={len(data)} head={data[:32]!r}')
                          tmp.replace(dest)
                          return url
                      except Exception as exc:
                          tmp.unlink(missing_ok=True)
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt)
              raise RuntimeError(f'下载失败 {dest.name}: {errors}')

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for idx, doc in enumerate(selected):
              dest = OUT / doc['filename']
              source_url = download_pdf(doc, dest)

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf校验失败 {dest.name}: {check.stderr[-1500:]}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'页数异常 {dest.name}: {pages} < {doc["min_pages"]}')

              text_path = VERIFY / f'{idx:02d}.txt'
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(pages, 25)), str(dest), str(text_path)],
                  capture_output=True,
                  text=True,
              )
              sample = text_path.read_text(encoding='utf-8', errors='ignore') if text_path.exists() else ''
              compact = re.sub(r'\s+', '', sample)
              missing = [term for term in doc['expected_terms'] if term not in compact]
              if missing:
                  raise RuntimeError(f'文件身份文本校验失败 {dest.name}，缺少：{missing}')

              render_base = VERIFY / f'{idx:02d}_first_page'
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '90', str(dest), str(render_base)],
                  capture_output=True,
                  text=True,
              )
              png = Path(str(render_base) + '.png')
              if render.returncode != 0 or not png.exists() or png.stat().st_size < 10_000:
                  raise RuntimeError(f'首页渲染失败 {dest.name}: {render.stderr[-1000:]}')

              data = dest.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'检测到重复PDF：{dest.name}')
              seen_hashes.add(digest)

              record = {
                  'filename': dest.name,
                  'kind': doc['kind'],
                  'announcement_title': doc['row']['title'],
                  'announcement_date': doc['row']['date'],
                  'art_code': doc['row']['art_code'],
                  'download_source': '东方财富公告PDF镜像（对应交易所公开披露文件）',
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 7:
              raise RuntimeError(f'文件数量异常：{len(records)}，预期7')

          readme = [
              f'{FULL_COMPANY}（{STOCK}.SH）2020—2025年年度报告及最新季报',
              f'整理与核验日期：{AS_OF}',
              '',
              '收录口径：2020、2021、2022、2023、2024、2025年度完整年度报告正文，以及截至整理日公告日期最新的正式第一季度/第三季度报告。',
              f'本次自动识别的最新季报：{qlabel}。',
              '已排除：年度报告摘要、英文版、单独审计报告、监管问询回复、专项说明、业绩快报、半年报及其他附件。',
              'PDF下载来源为东方财富公告PDF镜像，内容对应上市公司在交易所公开披露的原始公告文件。',
              '核验项目：PDF文件头、文件大小、页数、公司名称与报告期文本、qpdf结构、首页渲染、SHA-256及ZIP CRC。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f'{index}. {record["filename"]}',
                  f'   公告标题：{record["announcement_title"]}',
                  f'   公告日期：{record["announcement_date"]}',
                  f'   页数：{record["pages"]}；大小：{record["bytes"] / 1048576:.2f} MB',
                  f'   下载来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records), encoding='utf-8'
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC失败：{bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 7:
                  raise RuntimeError(f'ZIP内PDF数量异常：{len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size,
                hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: everbright-securities-601788-reports-20260927
          path: 光大证券_601788.SH_2020-2025年报及最新季报.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
