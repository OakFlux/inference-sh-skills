name: Discover public CIDI broker report assets 20260922
on:
  push:
    paths:
      - '.github/workflows/cidi-broker-report-discovery-20260922.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 playwright
          python -m playwright install chromium
      - name: Discover report assets
        run: python scripts/discover_cidi_broker_reports.py
      - name: Upload discovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: cidi-broker-report-discovery
          path: cidi_broker_discovery
          if-no-files-found: error
          retention-days: 7
