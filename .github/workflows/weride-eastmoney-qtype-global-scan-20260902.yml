name: Scan Eastmoney qTypes for WeRide reports

on:
  push:
    paths:
      - '.github/workflows/weride-eastmoney-qtype-global-scan-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Scan exact publication dates across report qTypes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from io import BytesIO

          import requests
          from pypdf import PdfReader

          session=requests.Session(); session.trust_env=False
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'}
          endpoint='https://reportapi.eastmoney.com/report/list'
          dates=['2025-08-22','2025-11-14','2025-12-26','2026-01-08','2026-01-09','2026-01-12','2026-02-11','2026-02-12']
          markers=['文远知行','WERIDE','WRD.O','WRD.US','00800','0800.HK','知行全球','L4智驾先行者','ROBOTAXI全球布局','海外ROBOTAXI快速扩张','全球L4自动驾驶领导者','L4平台型公司']
          found={}
          for date in dates:
              for qtype in range(0,11):
                  for page in range(1,21):
                      params={'pageNo':page,'pageSize':100,'qType':qtype,'beginTime':date,'endTime':date,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','code':''}
                      try:
                          r=session.get(endpoint,params=params,headers=headers,timeout=(15,90))
                          r.raise_for_status(); payload=r.json(); rows=payload.get('data') or []
                          hits=payload.get('hits'); total=payload.get('TotalPage')
                          if page==1: print('META',date,qtype,'hits',hits,'pages',total,'rows',len(rows),flush=True)
                          for row in rows:
                              raw=json.dumps(row,ensure_ascii=False)
                              compact=re.sub(r'\s+','',raw).upper()
                              if any(re.sub(r'\s+','',m).upper() in compact for m in markers):
                                  key=str(row.get('infoCode') or raw); found[key]=row
                                  print('MATCH',date,qtype,page,json.dumps(row,ensure_ascii=False),flush=True)
                          if not rows or (total and page>=int(total)): break
                      except Exception as exc:
                          print('ERROR',date,qtype,page,repr(exc),flush=True); break
          print('FOUND_COUNT',len(found),flush=True)
          for key,row in found.items():
              info=str(row.get('infoCode') or '')
              keep={k:row.get(k) for k in ('infoCode','title','publishDate','orgSName','orgName','researcher','stockName','stockCode','attachPages','attachSize','reportType','encodeUrl')}
              print('FOUND',json.dumps(keep,ensure_ascii=False),flush=True)
              if info.startswith('AP'):
                  for prefix in ('H3','H2'):
                      url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                      try:
                          pdf=session.get(url,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=(20,180))
                          print('PDF',info,prefix,pdf.status_code,len(pdf.content),pdf.headers.get('content-type'),flush=True)
                          if pdf.status_code==200 and pdf.content.startswith(b'%PDF-'):
                              print('PDF_OK',url,len(PdfReader(BytesIO(pdf.content),strict=False).pages),flush=True); break
                      except Exception as exc: print('PDF_ERR',info,prefix,repr(exc),flush=True)
          PY
