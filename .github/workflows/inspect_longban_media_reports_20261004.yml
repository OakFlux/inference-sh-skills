name: Inspect Longban Media broker reports

on:
  push:
    paths:
      - '.github/workflows/inspect_longban_media_reports_20261004.yml'
      - 'tools/inspect_longban_media_reports_20261004.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python tools/inspect_longban_media_reports_20261004.py
      - uses: actions/upload-artifact@v4
        with:
          name: longban-media-report-inventory
          path: longban_media_report_inventory.json
          if-no-files-found: error
          retention-days: 3
