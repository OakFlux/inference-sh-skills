name: Inspect Eastmoney HK rating APIs for Sany International

on:
  push:
    paths:
      - '.github/workflows/eastmoney-hk-rating-inspect-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Fetch page and scripts
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('em_hk_rating'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          page_url='https://hk.eastmoney.com/rating.html?code=00631'
          hdr={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'}
          r=s.get(page_url,headers=hdr,timeout=(30,180),allow_redirects=True)
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
          r.raise_for_status(); r.encoding=r.apparent_encoding or 'utf-8'; text=r.text
          (out/'page.html').write_text(text,encoding='utf-8')
          soup=BeautifulSoup(text,'html.parser')
          scripts=[]
          for sc in soup.find_all('script',src=True):
            u=urljoin(r.url,html.unescape(sc['src'])); scripts.append(u)
          print('SCRIPTS',json.dumps(scripts,ensure_ascii=False,indent=2),flush=True)
          inline_hits=[]
          for pat in [r'.{0,300}(?:api|rating|report|research|00631|ajax|datacenter).{0,600}',r'["\']([^"\']*(?:api|rating|report|research|datacenter)[^"\']*)["\']']:
            for m in re.finditer(pat,text,flags=re.I|re.S):
              v=m.group(0)
              if v not in inline_hits:inline_hits.append(v)
              if len(inline_hits)>=500:break
            if len(inline_hits)>=500:break
          (out/'inline_hits.txt').write_text('\n\n---\n\n'.join(inline_hits),encoding='utf-8')
          assets=[]
          for i,u in enumerate(scripts,1):
            try:
              rr=s.get(u,headers={**hdr,'Referer':r.url},timeout=(30,180),allow_redirects=True)
              print('SCRIPT',i,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),flush=True)
              if rr.status_code!=200 or len(rr.content)>15_000_000:continue
              data=rr.content; (out/f'script_{i:03d}.js').write_bytes(data)
              try: st=rr.text
              except Exception: continue
              hits=[]
              for pat in [
                r'.{0,400}(?:api|rating|report|research|00631|datacenter|ajax|hkdata).{0,800}',
                r'["\']([^"\']*(?:api|rating|report|research|datacenter|ajax)[^"\']*)["\']',
              ]:
                for m in re.finditer(pat,st,flags=re.I|re.S):
                  v=m.group(0)
                  if v not in hits:hits.append(v)
                  if len(hits)>=1000:break
                if len(hits)>=1000:break
              if hits:
                (out/f'script_{i:03d}_hits.txt').write_text('\n\n---\n\n'.join(hits),encoding='utf-8')
                print('HITS',i,'\n'.join(hits[:80])[:50000],flush=True)
              assets.append({'url':u,'status':rr.status_code,'length':len(data),'hits':len(hits)})
            except Exception as e:
              print('SCRIPT_ERR',u,repr(e),flush=True)
          (out/'manifest.json').write_text(json.dumps({'page':r.url,'scripts':scripts,'assets':assets},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: eastmoney-hk-rating-inspection
          path: em_hk_rating/
          if-no-files-found: error
          retention-days: 7
