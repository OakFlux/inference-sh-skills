name: Probe Kaichuang 600097 broker reports 20261014
on:
  push:
    paths:
      - '.github/workflows/probe-kaichuang-600097-broker-reports-20261014.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect public report page
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://www.p5w.net/stock/lzft/gsyj/200907/t2440284.htm'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=120)
          r.raise_for_status(); r.encoding=r.apparent_encoding or 'utf-8'
          soup=BeautifulSoup(r.text,'html.parser')
          print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
          for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              if '.pdf' in href.lower() or '附件' in text or '研发中心' in text:
                  print('LINK',json.dumps({'text':text,'href':href},ensure_ascii=False),flush=True)
          PY
