name: Diagnose Qiming old broker report sources 20260929

on:
  push:
    paths:
      - '.github/workflows/diag-qiming-old-broker-reports-20260929.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect report pages and links
        run: |
          python - <<'PY'
          import json, re, html
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'}
          urls=[
            'https://www.cgws.com/cczq/ggdt/ccyj/201606/t20160608_83594.html',
            'https://www.futunn.com/stock/002232-SZ/news/reports',
            'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=002232&t1=all',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=002232&t1=all',
            'https://webf10.gw.com.cn/SZ/B16/SZ002232_B16.html',
          ]
          for url in urls:
            print('\n===URL===',url,flush=True)
            try:
              r=s.get(url,headers=h,timeout=60,allow_redirects=True,verify=True)
              print('STATUS',r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
              text=r.text
              print('HEAD',text[:1000].replace('\n',' '),flush=True)
              links=[]
              for m in re.finditer(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',text,re.I):
                raw=html.unescape(m.group(1)); full=urljoin(r.url,raw)
                if any(k in full.lower() for k in ['pdf','download','attach','report','83594','002232']): links.append(full)
              print('LINKS',json.dumps(list(dict.fromkeys(links))[:300],ensure_ascii=False,indent=2),flush=True)
              for pat in ['车联网战略全启动','车联网布局加速推进','启明信息','pdf','attachment','附件']:
                pos=text.find(pat)
                if pos>=0: print('AROUND',pat,text[max(0,pos-500):pos+1500].replace('\n',' '),flush=True)
            except Exception as e:
              print('ERROR',repr(e),flush=True)
          PY
