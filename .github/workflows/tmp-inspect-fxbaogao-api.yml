name: Inspect Fxbaogao report API

on:
  push:
    branches:
      - tmp/shenzhen-international-browser-package-20260831

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python .github/scripts/inspect_fxbaogao_api.py
