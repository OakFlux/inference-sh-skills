name: Probe FXBaogao viewer pages 20261012

on:
  push:
    branches:
      - xingdesheng-broker-reports-20261012
    paths:
      - '.github/workflows/probe-fxbaogao-view-pages-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Probe public viewer pages
        run: python scripts/probe_fxbaogao_view_pages_20261012.py
