name: Crawl Hibor for Baida Group reports

on:
  push:
    paths:
      - '.github/workflows/crawl-hibor-baida-reports-20261012.yml'
      - 'scripts/crawl_hibor_baida_reports_20261012.py'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Crawl report archives
        run: python scripts/crawl_hibor_baida_reports_20261012.py
