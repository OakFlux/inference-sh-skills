name: Probe CMBI archive for Guangshen Railway

on:
  push:
    branches:
      - chatgpt-china-gas-broker-reports-20260905
    paths:
      - '.github/workflows/probe-guangshen-cmbi-archive-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_guangshen_cmbi_archive_20260905.py
      - uses: actions/upload-artifact@v4
        with:
          name: guangshen-cmbi-probe-20260905
          path: guangshen-cmbi-probe.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
