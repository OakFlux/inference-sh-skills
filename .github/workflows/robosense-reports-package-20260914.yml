name: Package RoboSense annual reports and latest periodic filings

on:
  push:
    paths:
      - '.github/workflows/robosense-reports-package-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pymupdf

      - name: Query HKEX, validate, and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import pymupdf
          import requests

          AS_OF = '2026-09-14'
          COMPANY_ZH = '速腾聚创科技有限公司'
          COMPANY_TRAD = '速騰聚創科技有限公司'
          COMPANY_EN = 'RoboSense Technology Co., Ltd'
          STOCK_CODE = '02498.HK'
          STOCK_ID = '1000211551'
          ROOT_NAME = '速腾聚创_全部年报及最新定期报告_截至2026-09-14'
          ROOT = Path(ROOT_NAME)
          WORK = Path('_robosense_work')
          RENDERS = WORK / 'renders'
          OUTZIP = Path('RoboSense_All_Annual_Reports_Latest_Periodic_Filings_2026-09-14.zip')
          for p in (ROOT, WORK, RENDERS):
              p.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'application/json,text/plain,application/pdf,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,zh-TW;q=0.8,en;q=0.6',
              'Referer': 'https://www1.hkexnews.hk/search/titlesearch.xhtml',
              'Connection': 'close',
          }

          def compact(value: str) -> str:
              return re.sub(r'[^0-9A-Z\u3400-\u9FFF]+', '', str(value).upper())

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def parse_result(payload):
              if isinstance(payload, list):
                  if all(isinstance(x, dict) for x in payload):
                      return payload
                  for x in payload:
                      found = parse_result(x)
                      if found:
                          return found
              if isinstance(payload, dict):
                  for key in ('result', 'data', 'rows', 'items'):
                      if key in payload:
                          value = payload[key]
                          if isinstance(value, str):
                              try:
                                  value = json.loads(value)
                              except Exception:
                                  pass
                          found = parse_result(value)
                          if found:
                              return found
                  for value in payload.values():
                      found = parse_result(value)
                      if found:
                          return found
              return []

          def hkex_search(lang: str) -> list[dict]:
              endpoint = 'https://www1.hkexnews.hk/search/titleSearchServlet.do'
              params = {
                  'sortDir': '0',
                  'sortByOptions': 'DateTime',
                  'category': '0',
                  'market': 'SEHK',
                  'stockId': STOCK_ID,
                  'documentType': '-1',
                  'fromDate': '20230101',
                  'toDate': '20260914',
                  'title': '',
                  'searchType': '1',
                  't1code': '-2',
                  't2Gcode': '-2',
                  't2code': '-2',
                  'rowRange': '500',
                  'lang': lang,
              }
              r = session.get(endpoint, params=params, headers=HEADERS, timeout=(30, 180))
              print('SEARCH', lang, r.status_code, len(r.content), r.url, flush=True)
              r.raise_for_status()
              try:
                  raw = r.json()
              except Exception:
                  raw = json.loads(r.text.lstrip('\ufeff'))
              rows = parse_result(raw)
              if not rows:
                  raise RuntimeError(f'Unable to parse HKEX response for {lang}')
              normalized = []
              for row in rows:
                  title = str(row.get('TITLE') or row.get('title') or row.get('HEADLINE') or row.get('headline') or '')
                  link = str(row.get('FILE_LINK') or row.get('fileLink') or row.get('link') or row.get('URL') or row.get('url') or '')
                  release = str(row.get('RELEASE_TIME') or row.get('releaseTime') or row.get('DATE_TIME') or row.get('dateTime') or row.get('DATE') or row.get('date') or '')
                  category = str(row.get('DOCUMENT_TYPE') or row.get('documentType') or row.get('CATEGORY') or row.get('category') or '')
                  if link:
                      link = urljoin('https://www1.hkexnews.hk', link)
                  normalized.append({
                      'title': title,
                      'link': link,
                      'release': release,
                      'category': category,
                      'lang': lang,
                      'raw': row,
                  })
              print('ROWS', lang, len(normalized), flush=True)
              for row in normalized:
                  n = compact(row['title'])
                  if any(x in n for x in (
                      '2023ANNUALREPORT','2024ANNUALREPORT','2025ANNUALREPORT',
                      '2023年報','2024年報','2025年報','2023年度報告','2024年度報告','2025年度報告',
                      'INTERIMREPORT2026','2026INTERIMREPORT','2026年中期報告',
                      'INTERIMRESULTSANNOUNCEMENTFORTHESIXMONTHSENDEDJUNE302026','2026中期業績',
                      'FIRSTQUARTEROF2026','2026第一季度','2026首季度'
                  )):
                      print('CANDIDATE', json.dumps({k: row[k] for k in ('lang','release','title','link','category')}, ensure_ascii=False), flush=True)
              return normalized

          rows = hkex_search('en') + hkex_search('zh')

          def language_bonus(row: dict) -> int:
              link = row['link'].lower()
              return 80 if row['lang'] == 'zh' or '_c.pdf' in link else 0

          def annual_score(row: dict, year: int) -> int:
              n = compact(row['title'])
              score = 0
              if str(year) in n and any(x in n for x in ('ANNUALREPORT','年報','年度報告','年报','年度报告')):
                  score += 600
              if any(x in n for x in ('ANNUALRESULTS','年度業績','年度业绩','ESG','ENVIRONMENTAL','CIRCULAR','摘要')):
                  score -= 500
              if row['link'].lower().endswith('.pdf') or '.pdf?' in row['link'].lower():
                  score += 40
              return score + language_bonus(row)

          def interim_score(row: dict) -> int:
              n = compact(row['title'])
              score = 0
              if '2026' not in n:
                  return -999
              if any(x in n for x in ('INTERIMREPORT','中期報告','中期报告')) and not any(x in n for x in ('RESULTS','業績','业绩')):
                  score += 900
              elif any(x in n for x in ('INTERIMRESULTS','中期業績','中期业绩')):
                  score += 650
              if 'JUNE302026' in n or '2026年6月30日' in n:
                  score += 100
              if row['link'].lower().endswith('.pdf') or '.pdf?' in row['link'].lower():
                  score += 40
              return score + language_bonus(row)

          def q1_score(row: dict) -> int:
              n = compact(row['title'])
              score = 0
              if '2026' not in n:
                  return -999
              if any(x in n for x in ('FIRSTQUARTER','FIRSTTHREEMONTHS','第一季度','首季度','截至2026年3月31日止三個月','截至2026年3月31日止三个月')):
                  score += 750
              if any(x in n for x in ('UNAUDITEDFINANCIALRESULTS','未經審核財務業績','未经审核财务业绩','QUARTERLYRESULTS')):
                  score += 150
              if row['link'].lower().endswith('.pdf') or '.pdf?' in row['link'].lower():
                  score += 40
              return score + language_bonus(row)

          def select_best(label: str, scorer) -> dict:
              ranked = sorted(rows, key=scorer, reverse=True)
              best = ranked[0]
              best_score = scorer(best)
              print('SELECT', label, best_score, json.dumps({k: best[k] for k in ('lang','release','title','link','category')}, ensure_ascii=False), flush=True)
              if best_score < 500 or not best['link']:
                  raise RuntimeError(f'Unable to select {label}')
              return best

          annuals = {year: select_best(f'annual-{year}', lambda row, y=year: annual_score(row, y)) for year in (2023, 2024, 2025)}
          latest_interim = select_best('latest-interim-2026', interim_score)
          latest_q1 = select_best('latest-quarter-2026-q1', q1_score)

          interim_title_norm = compact(latest_interim['title'])
          interim_is_full = any(x in interim_title_norm for x in ('INTERIMREPORT','中期報告','中期报告')) and not any(x in interim_title_norm for x in ('RESULTS','業績','业绩'))

          configs = []
          for seq, year in enumerate((2023, 2024, 2025), 1):
              row = annuals[year]
              configs.append({
                  'filename': f'{seq:02d}_速腾聚创_{year}年年度报告_完整版.pdf',
                  'document_type': f'{year}年年度报告',
                  'year': str(year),
                  'title': row['title'],
                  'release': row['release'],
                  'url': row['link'],
                  'lang': row['lang'],
                  'min_pages': 100,
                  'type_markers': ('ANNUALREPORT','年報','年度報告','年报','年度报告'),
              })

          configs.append({
              'filename': '04_速腾聚创_2026年中期报告_最新完整定期报告.pdf' if interim_is_full else '04_速腾聚创_2026年中期业绩公告_最新定期财务披露.pdf',
              'document_type': '2026年中期报告' if interim_is_full else '2026年中期业绩公告',
              'year': '2026',
              'title': latest_interim['title'],
              'release': latest_interim['release'],
              'url': latest_interim['link'],
              'lang': latest_interim['lang'],
              'min_pages': 50 if interim_is_full else 20,
              'type_markers': ('INTERIMREPORT','中期報告','中期报告') if interim_is_full else ('INTERIMRESULTS','中期業績','中期业绩'),
          })
          configs.append({
              'filename': '05_速腾聚创_2026年第一季度未经审核财务业绩_最新严格季度报告.pdf',
              'document_type': '2026年第一季度未经审核财务业绩公告',
              'year': '2026',
              'title': latest_q1['title'],
              'release': latest_q1['release'],
              'url': latest_q1['link'],
              'lang': latest_q1['lang'],
              'min_pages': 10,
              'type_markers': ('FIRSTQUARTER','第一季度','首季度','UNAUDITEDFINANCIALRESULTS','未經審核財務業績','未经审核财务业绩'),
          })

          def url_variants(url: str) -> list[str]:
              out = [url]
              if 'www1.hkexnews.hk' in url:
                  out.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              return list(dict.fromkeys(out))

          def download_pdf(url: str) -> tuple[bytes, str]:
              errors = []
              for candidate in url_variants(url):
                  for attempt in range(1, 4):
                      try:
                          r = session.get(candidate, headers={**HEADERS, 'Accept': 'application/pdf,*/*'}, timeout=(30, 900), allow_redirects=True)
                          print('GET', attempt, r.status_code, len(r.content), r.headers.get('content-type'), candidate, flush=True)
                          if r.status_code == 200 and r.content.startswith(b'%PDF-') and len(r.content) > 50000:
                              return r.content, str(r.url)
                          errors.append(f'{candidate}: {r.status_code}/{len(r.content)}')
                      except Exception as exc:
                          errors.append(f'{candidate}: {type(exc).__name__}: {exc}')
                      time.sleep(attempt)
              raise RuntimeError('PDF download failed: ' + ' | '.join(errors[-10:]))

          def validate_pdf(path: Path, cfg: dict) -> dict:
              data = path.read_bytes()
              if not data.startswith(b'%PDF-'):
                  raise RuntimeError(f'{path.name}: invalid PDF signature')
              doc = pymupdf.open(str(path))
              pages = len(doc)
              if pages < cfg['min_pages']:
                  doc.close()
                  raise RuntimeError(f'{path.name}: page count {pages} < {cfg["min_pages"]}')
              sample = sorted(set(list(range(min(45, pages))) + [pages // 2, pages - 1]))
              text = '\n'.join(doc.load_page(i).get_text('text') for i in sample)
              norm = compact(text)
              identities = (
                  COMPANY_ZH, COMPANY_TRAD, COMPANY_EN, 'ROBOSENSE',
                  'STOCKCODE02498', '股份代號02498', '股份代码02498', '2498',
              )
              if not any(compact(x) in norm for x in identities):
                  doc.close()
                  raise RuntimeError(f'{path.name}: company identity marker missing')
              if cfg['year'] not in norm:
                  doc.close()
                  raise RuntimeError(f'{path.name}: year marker {cfg["year"]} missing')
              if not any(compact(x) in norm for x in cfg['type_markers']):
                  doc.close()
                  raise RuntimeError(f'{path.name}: document type marker missing')
              rendered = []
              for page_no in sorted(set((0, pages // 2, pages - 1))):
                  pix = doc.load_page(page_no).get_pixmap(matrix=pymupdf.Matrix(0.9, 0.9), alpha=False)
                  image = RENDERS / f'{path.stem}_page_{page_no + 1:04d}.png'
                  pix.save(str(image))
                  if pix.width < 400 or pix.height < 400 or image.stat().st_size < 3000:
                      doc.close()
                      raise RuntimeError(f'{path.name}: render validation failed on page {page_no + 1}')
                  rendered.append({'page': page_no + 1, 'width': pix.width, 'height': pix.height, 'bytes': image.stat().st_size})
              doc.close()
              q = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError(f'{path.name}: qpdf check failed: {q.stderr[-1000:]}')
              return {
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'qpdf_return_code': q.returncode,
                  'rendered_pages': rendered,
              }

          records = []
          seen = set()
          for cfg in configs:
              data, actual_url = download_pdf(cfg['url'])
              path = ROOT / cfg['filename']
              path.write_bytes(data)
              meta = validate_pdf(path, cfg)
              if meta['sha256'] in seen:
                  raise RuntimeError(f'Duplicate report content: {path.name}')
              seen.add(meta['sha256'])
              record = {
                  'filename': cfg['filename'],
                  'document_type': cfg['document_type'],
                  'hkex_title': cfg['title'],
                  'report_year': cfg['year'],
                  'release_time': cfg['release'],
                  'language': '繁体中文' if cfg['lang'] == 'zh' or '_c.pdf' in actual_url.lower() else '英文',
                  'official_url': actual_url,
                  **meta,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 5:
              raise RuntimeError(f'Expected 5 PDFs, got {len(records)}')

          with (ROOT / '来源与校验清单.csv').open('w', encoding='utf-8-sig', newline='') as f:
              fields = ['序号','文件名','文档类型','港交所标题','报告年度','发布日期','语言','页数','文件大小_字节','SHA256','官方来源']
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for idx, r in enumerate(records, 1):
                  writer.writerow({
                      '序号': idx,
                      '文件名': r['filename'],
                      '文档类型': r['document_type'],
                      '港交所标题': r['hkex_title'],
                      '报告年度': r['report_year'],
                      '发布日期': r['release_time'],
                      '语言': r['language'],
                      '页数': r['pages'],
                      '文件大小_字节': r['bytes'],
                      'SHA256': r['sha256'],
                      '官方来源': r['official_url'],
                  })

          manifest = {
              'company': COMPANY_ZH,
              'traditional_name': COMPANY_TRAD,
              'english_name': COMPANY_EN,
              'stock_code': STOCK_CODE,
              'listing_date': '2024-01-05',
              'as_of_date': AS_OF,
              'annual_report_years': [2023, 2024, 2025],
              'latest_periodic_financial_disclosure': records[3]['document_type'],
              'latest_strict_quarterly_disclosure': records[4]['document_type'],
              'note': '速腾聚创于2024年1月上市，因此上市以来可独立取得的完整年度报告为2023、2024及2025年度。为避免“最新季报”口径歧义，同时收录最新中期披露及2026年第一季度未经审核财务业绩公告。',
              'files': records,
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records), encoding='utf-8')

          readme = [
              f'{COMPANY_ZH}（{STOCK_CODE}）官方披露文件',
              f'资料核对日期：{AS_OF}',
              '',
              '收录范围：',
              '1. 2023、2024、2025年度完整年度报告；',
              f'2. {records[3]["document_type"]}，作为截至核对日最新定期财务披露；',
              '3. 2026年第一季度未经审核财务业绩公告，作为最新严格意义上的季度报告。',
              '',
              '速腾聚创于2024年1月5日在香港联交所上市，因此没有2022年度及更早的上市公司独立年报。',
              '香港上市公司通常以年度及中期报告为主要定期报告；速腾聚创另行自愿披露季度未经审核财务业绩，因此本包同时保留最新中期披露与最新严格季度披露。',
              '',
              f'共{len(records)}份PDF，合计{sum(r["pages"] for r in records)}页，PDF总大小{sum(r["bytes"] for r in records) / 1048576:.2f} MB。',
              '',
              '文件清单：',
          ]
          for idx, r in enumerate(records, 1):
              readme.extend([
                  f'{idx}. {r["filename"]}',
                  f'   类型：{r["document_type"]}',
                  f'   港交所标题：{r["hkex_title"]}',
                  f'   发布日期：{r["release_time"]}',
                  f'   语言：{r["language"]}',
                  f'   页数：{r["pages"]}',
                  f'   大小：{r["bytes"] / 1048576:.2f} MB',
                  f'   SHA-256：{r["sha256"]}',
                  '',
              ])
          readme.append('校验项目：PDF文件头、公司名称/股份代码、报告年度、文档类型、页数、qpdf结构、首页/中间页/末页渲染、SHA-256及ZIP CRC。')
          (ROOT / 'README_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')

          with zipfile.ZipFile(OUTZIP, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      zf.write(path, str(path))
          with zipfile.ZipFile(OUTZIP, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdf_count = sum(name.lower().endswith('.pdf') for name in zf.namelist())
              if pdf_count != 5:
                  raise RuntimeError(f'Expected 5 PDFs in ZIP, got {pdf_count}')

          print('FINAL_ZIP', OUTZIP, OUTZIP.stat().st_size, sha256_file(OUTZIP), flush=True)
          print('TOTAL_PAGES', sum(r['pages'] for r in records), flush=True)
          print('PDF_COUNT', len(records), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: robosense-reports-package-20260914
          path: RoboSense_All_Annual_Reports_Latest_Periodic_Filings_2026-09-14.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: robosense-validation-diagnostics
          path: _robosense_work/
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 6
