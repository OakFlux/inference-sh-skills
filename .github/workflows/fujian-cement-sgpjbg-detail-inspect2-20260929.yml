name: Inspect Fujian Cement SGPJBG details 20260929
on:
  push:
    paths:
      - '.github/workflows/fujian-cement-sgpjbg-detail-inspect2-20260929.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect pages
        run: |
          python -m pip install --quiet beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls = {
              '4582': 'https://www.sgpjbg.com/baogao/4582.html',
              '4580': 'https://www.sgpjbg.com/baogao/4580.html',
          }
          Path('details').mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://www.sgpjbg.com/','Accept-Language':'zh-CN,zh;q=0.9'})
          for rid, url in urls.items():
              r = s.get(url, timeout=(30,120), allow_redirects=True)
              text = r.text
              Path('details/' + rid + '.html').write_text(text, encoding='utf-8')
              print('PAGE', rid, r.status_code, len(r.content), r.url, flush=True)
              soup = BeautifulSoup(text, 'html.parser')
              print('TITLE', rid, soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
              for tag in soup.find_all(True):
                  for key, value in tag.attrs.items():
                      if isinstance(value, list):
                          value = ' '.join(str(x) for x in value)
                      value = str(value)
                      probe = (key + ' ' + value).lower()
                      if any(word in probe for word in ['pdf', 'download', 'fileroot', 'attachment', 'fileurl', 'downurl', 'viewer']):
                          print('ATTR', rid, tag.name, key, value[:3000], flush=True)
              for line in text.splitlines():
                  probe = line.lower()
                  if any(word in probe for word in ['.pdf', 'download', 'fileroot', 'fileurl', 'downurl', 'pdfurl', 'attachment']):
                      print('LINE', rid, line[:5000], flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fujian-cement-sgpjbg-detail-html-20260929
          path: details
          retention-days: 7
          if-no-files-found: error
