name: Temporary Daan Gene exact title search

on:
  push:
    branches:
      - tmp/download-daan-gene-reports-20260829
    paths:
      - .github/workflows/tmp-daan-gene-exact-search.yml

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Search exact report titles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/html
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote, urlparse, parse_qs, unquote
          import html, json, re, urllib.request

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          titles=[
              '达安基因 深度报告 分子诊断行业待爆发 龙头达安笑傲江湖',
              '达安基因 前瞻性布局基因诊断行业',
              '达安基因 关注公司的战略布局和长期投资价值',
              '达安基因 后疫情时代新冠筛查从严 下半年业绩持续受益',
              '达安基因 上半年业绩超预期 公司发展迎里程碑拐点',
              '达安基因 三季度业绩超预期 产能扩建有望延续新冠优势',
          ]
          engines={
              'so360':'https://www.so.com/s?q={q}',
              'sogou':'https://www.sogou.com/web?query={q}',
              'bingcn':'https://cn.bing.com/search?q={q}&count=50',
              'brave':'https://search.brave.com/search?q={q}&source=web',
              'google':'https://www.google.com/search?q={q}&num=50&hl=zh-CN',
              'baidu':'https://www.baidu.com/s?wd={q}&rn=50',
          }
          records=[]
          for ename,tpl in engines.items():
              for qi,title in enumerate(titles):
                  queries=[f'"{title}"', f'"{title}" PDF', f'{title} 研报 下载']
                  for qj,q in enumerate(queries):
                      url=tpl.format(q=quote(q))
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
                      try:
                          raw=urllib.request.urlopen(req,timeout=90).read()
                          text=raw.decode('utf-8','replace')
                      except Exception as exc:
                          Path(f'diagnostic/html/{ename}_{qi}_{qj}.error').write_text(repr(exc),encoding='utf-8')
                          continue
                      Path(f'diagnostic/html/{ename}_{qi}_{qj}.html').write_text(text,encoding='utf-8')
                      hrefs=[]
                      for m in re.finditer(r'href=["\']([^"\']+)["\']',text,re.I):
                          h=html.unescape(m.group(1)).replace('&amp;','&')
                          if h.startswith('//'): h='https:'+h
                          p=urlparse(h)
                          qs=parse_qs(p.query)
                          for key in ['url','u','r','target','redirect','uddg']:
                              if key in qs and qs[key]:
                                  v=unquote(qs[key][0])
                                  if v.startswith('http'): h=v
                          if h.startswith('http'): hrefs.append(h)
                      # Also collect literal URLs from page source.
                      hrefs += [html.unescape(x).replace('&amp;','&') for x in re.findall(r'https?://[^"<>\s]+',text)]
                      seen=set()
                      for h in hrefs:
                          h=h.rstrip(').,;\'"')
                          if h in seen: continue
                          seen.add(h)
                          low=h.lower()
                          if any(d in low for d in ['9fzt','nxny','dfcfw','eastmoney','hangyan','sdyanbao','sgpjbg','fxbaogao','report','yanbao','pdf','research','stockstar','futunn','jrj.com','cnstock','hexun','163.com','sohu.com','sina.com.cn','qq.com','baogaobox','book118','doc88','wenku.baidu']):
                              records.append({'engine':ename,'title':title,'query':q,'url':h})

          out=[];seen=set()
          for r in records:
              u=r['url']
              if u in seen: continue
              seen.add(u);out.append(r)
          Path('diagnostic/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          with open('diagnostic/results.tsv','w',encoding='utf-8') as f:
              f.write('engine\ttitle\tquery\turl\n')
              for r in out:
                  f.write('\t'.join([r['engine'],r['title'],r['query'],r['url'].replace('\t',' ')])+'\n')
          print('RESULTS',len(out))
          print(Path('diagnostic/results.tsv').read_text(encoding='utf-8')[:120000])
          PY

      - name: Upload exact-search results
        uses: actions/upload-artifact@v4
        with:
          name: daan-gene-exact-search-results
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
