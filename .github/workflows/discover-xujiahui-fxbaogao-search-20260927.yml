name: Discover Xujiahui fxbaogao search 20260927

on:
  push:
    paths:
      - '.github/workflows/discover-xujiahui-fxbaogao-search-20260927.yml'
      - 'scripts/discover_xujiahui_fxbaogao_search_20260927.py'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          playwright install chromium --with-deps
      - name: Search fxbaogao
        run: python scripts/discover_xujiahui_fxbaogao_search_20260927.py
      - name: Upload discovery files
        uses: actions/upload-artifact@v4
        with:
          name: xujiahui-fxbaogao-search
          path: xujiahui_fxbaogao_search
          if-no-files-found: always
          retention-days: 7
