name: Temporary Meikang Bio reports package

on:
  push:
    branches:
      - tmp-meikang-bio-reports-20260829

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf

      - name: Query announcements, download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/package_meikang.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK = "300439"
          COMPANY = "美康生物"
          API = "https://np-anotice-stock.eastmoney.com/api/security/ann"
          OUT = Path("dist")
          DOCS = OUT / "美康生物_300439_2020-2025年报_2026年最新半年报"
          DOCS.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Accept-Encoding": "gzip, deflate",
              "Referer": f"https://data.eastmoney.com/notices/stock/{STOCK}.html",
          })

          def compact(value: Any) -> str:
              return re.sub(r"\s+", "", str(value or "")).replace("（", "(").replace("）", ")")

          def fetch_page(page: int) -> list[dict[str, Any]]:
              params = {
                  "sr": "-1",
                  "page_size": "100",
                  "page_index": str(page),
                  "ann_type": "A",
                  "client_source": "web",
                  "stock_list": STOCK,
                  "f_node": "0",
                  "s_node": "0",
              }
              errors: list[str] = []
              for attempt in range(6):
                  try:
                      response = session.get(API, params=params, timeout=(30, 180))
                      print("API", page, response.status_code, len(response.content), response.url)
                      response.raise_for_status()
                      payload = response.json()
                      data = payload.get("data") or {}
                      rows = data.get("list") or data.get("announcements") or []
                      if not isinstance(rows, list):
                          raise RuntimeError(f"Unexpected API rows: {type(rows)}; payload keys={payload.keys()}")
                      if rows:
                          print("API_SAMPLE", json.dumps(rows[0], ensure_ascii=False)[:1800])
                      return rows
                  except Exception as exc:
                      errors.append(repr(exc))
                      if attempt < 5:
                          time.sleep(min(2 ** attempt, 12))
              raise RuntimeError(f"Unable to query Eastmoney page {page}: {errors}")

          announcements: list[dict[str, Any]] = []
          seen: set[str] = set()
          oldest_year = 9999
          for page in range(1, 31):
              rows = fetch_page(page)
              if not rows:
                  break
              page_years: list[int] = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  code = str(row.get("art_code") or row.get("article_code") or row.get("id") or "")
                  if not code or code in seen:
                      continue
                  seen.add(code)
                  announcements.append(row)
                  date_value = str(row.get("notice_date") or row.get("noticeDate") or "")
                  match = re.search(r"(20\d{2})", date_value)
                  if match:
                      page_years.append(int(match.group(1)))
              if page_years:
                  oldest_year = min(oldest_year, min(page_years))
              print("PAGE_ROWS", page, len(rows), "TOTAL", len(announcements), "OLDEST", oldest_year)
              if page_years and min(page_years) <= 2019:
                  break
              time.sleep(0.35)

          if not announcements:
              raise RuntimeError("No Eastmoney announcements returned")

          def title_of(row: dict[str, Any]) -> str:
              return str(row.get("title") or row.get("announcement_title") or row.get("announcementTitle") or "").strip()

          def art_code_of(row: dict[str, Any]) -> str:
              return str(row.get("art_code") or row.get("article_code") or row.get("id") or "").strip()

          def date_of(row: dict[str, Any]) -> str:
              value = str(row.get("notice_date") or row.get("noticeDate") or row.get("display_time") or "").strip()
              match = re.search(r"20\d{2}-\d{2}-\d{2}", value)
              return match.group(0) if match else value[:10]

          for row in announcements:
              title = title_of(row)
              if "年度报告" in title or "半年度报告" in title:
                  print("CANDIDATE", date_of(row), art_code_of(row), title)

          excluded_common = (
              "摘要", "英文版", "审计报告", "环境", "ESG", "社会责任", "问询", "回复",
              "董事会", "监事会", "股东大会", "业绩说明会", "专项报告", "鉴证报告",
          )

          def revision_score(title: str) -> int:
              normalized = compact(title)
              return int(any(token in normalized for token in ("更新版", "更新后", "修订版", "修订", "修正", "更正")))

          annual_by_year: dict[int, dict[str, Any]] = {}
          for row in announcements:
              title = compact(title_of(row))
              match = re.search(r"(20\d{2})年年度报告", title)
              if not match or any(token in title for token in excluded_common):
                  continue
              year = int(match.group(1))
              if year not in range(2020, 2026):
                  continue
              current = annual_by_year.get(year)
              score = (revision_score(title), date_of(row), art_code_of(row))
              if current is None:
                  annual_by_year[year] = row
              else:
                  current_title = compact(title_of(current))
                  current_score = (revision_score(current_title), date_of(current), art_code_of(current))
                  if score > current_score:
                      annual_by_year[year] = row

          missing = [year for year in range(2020, 2026) if year not in annual_by_year]
          if missing:
              raise RuntimeError(f"Missing annual reports: {missing}")

          half_candidates: list[tuple[tuple[int, int, str, str], dict[str, Any]]] = []
          for row in announcements:
              title = compact(title_of(row))
              match = re.search(r"(20\d{2})年半年度报告", title)
              if not match or any(token in title for token in excluded_common):
                  continue
              year = int(match.group(1))
              half_candidates.append(((year, revision_score(title), date_of(row), art_code_of(row)), row))

          if not half_candidates:
              raise RuntimeError("No full semiannual report found")
          half_candidates.sort(key=lambda item: item[0], reverse=True)
          half_year = half_candidates[0][0][0]
          half_row = half_candidates[0][1]
          if half_year != 2026:
              raise RuntimeError(f"Latest full semiannual report is {half_year}: {title_of(half_row)}")

          selections: list[tuple[str, dict[str, Any], str, int, int]] = []
          for year in range(2020, 2026):
              row = annual_by_year[year]
              suffix = "_更新版" if revision_score(title_of(row)) else ""
              selections.append((f"美康生物_300439_{year}年年度报告{suffix}.pdf", row, "年度报告", 100, year))
          selections.append(("美康生物_300439_2026年半年度报告.pdf", half_row, "半年度报告", 50, 2026))

          print("SELECTIONS")
          for filename, row, kind, _, year in selections:
              print("SELECT", kind, year, filename, date_of(row), art_code_of(row), title_of(row))

          def candidate_pdf_urls(row: dict[str, Any]) -> list[str]:
              art_code = art_code_of(row)
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{art_code}_1.PDF",
                  f"http://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf",
              ]
              unique: list[str] = []
              for url in urls:
                  if url not in unique:
                      unique.append(url)
              return unique

          def validate_pdf(path: Path, minimum_pages: int, expected_year: int) -> tuple[int, int, str]:
              raw_head = path.read_bytes()[:16]
              size = path.stat().st_size
              if size < 100_000 or not raw_head.startswith(b"%PDF-"):
                  raise RuntimeError(f"Invalid PDF size={size} head={raw_head!r}")
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < minimum_pages:
                  raise RuntimeError(f"Unexpectedly short PDF: {pages} pages, minimum={minimum_pages}")
              text_parts: list[str] = []
              for page in reader.pages[:16]:
                  try:
                      text_parts.append(page.extract_text() or "")
                  except Exception:
                      pass
              sample = re.sub(r"\s+", "", "".join(text_parts))
              if COMPANY not in sample and "Medicalsystem" not in sample:
                  print("WARNING company name not extracted", path.name)
              if str(expected_year) not in sample:
                  print("WARNING expected year not extracted", expected_year, path.name)
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return size, pages, digest.hexdigest()

          def download_pdf(row: dict[str, Any], destination: Path, minimum_pages: int, expected_year: int) -> tuple[str, int, int, str]:
              errors: list[str] = []
              for url in candidate_pdf_urls(row):
                  for attempt in range(5):
                      try:
                          with session.get(
                              url,
                              headers={
                                  "Referer": f"https://data.eastmoney.com/notices/detail/{STOCK}/{art_code_of(row)}.html",
                                  "Accept": "application/pdf,application/octet-stream,*/*",
                              },
                              timeout=(30, 600),
                              stream=True,
                              allow_redirects=True,
                          ) as response:
                              print("DOWNLOAD", response.status_code, response.url, response.headers.get("content-type"), response.headers.get("content-length"))
                              response.raise_for_status()
                              with destination.open("wb") as output:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          output.write(chunk)
                              final_url = response.url
                          size, pages, digest = validate_pdf(destination, minimum_pages, expected_year)
                          return final_url, size, pages, digest
                      except Exception as exc:
                          destination.unlink(missing_ok=True)
                          errors.append(f"{url} attempt {attempt + 1}: {exc!r}")
                          if attempt < 4:
                              time.sleep(min(2 ** attempt, 10))
              raise RuntimeError("; ".join(errors))

          manifest = [
              "美康生物科技股份有限公司（300439.SZ）",
              "资料范围：2020—2025年年度报告全文及2026年半年度报告全文。",
              "版本规则：排除摘要、英文版、审计报告和其他非目标公告；同一报告存在更新、修订或更正版本时优先采用后续版本。",
              "文件来源：东方财富上市公司公告PDF镜像，公告内容为交易所披露文件。",
              "",
          ]

          for filename, row, kind, minimum_pages, expected_year in selections:
              destination = DOCS / filename
              used_url, size, pages, digest = download_pdf(row, destination, minimum_pages, expected_year)
              manifest.extend([
                  filename,
                  f"  文件类型：{kind}",
                  f"  公告标题：{title_of(row)}",
                  f"  披露日期：{date_of(row)}",
                  f"  东方财富公告代码：{art_code_of(row)}",
                  f"  页数：{pages}",
                  f"  文件大小：{size} bytes",
                  f"  SHA-256：{digest}",
                  f"  PDF来源：{used_url}",
                  "",
              ])
              print("OK", filename, pages, size, used_url)

          (DOCS / "资料清单与来源.txt").write_text("\n".join(manifest), encoding="utf-8")

          final_zip = OUT / "美康生物_300439_2020-2025年报_2026年最新半年报.zip"
          with zipfile.ZipFile(final_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(DOCS.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(final_zip, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != 7:
                  raise RuntimeError(f"Expected 7 PDFs, got {pdfs}")

          print(f"FINAL_ZIP={final_zip}")
          print(f"ZIP_SIZE={final_zip.stat().st_size}")
          print("CONTENTS")
          for path in sorted(DOCS.iterdir()):
              if path.suffix.lower() == ".pdf":
                  reader = PdfReader(str(path), strict=False)
                  print(path.name, path.stat().st_size, len(reader.pages))
              else:
                  print(path.name, path.stat().st_size)
          PY
          python /tmp/package_meikang.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: meikang-bio-reports-final-zip
          path: dist/美康生物_300439_2020-2025年报_2026年最新半年报.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
