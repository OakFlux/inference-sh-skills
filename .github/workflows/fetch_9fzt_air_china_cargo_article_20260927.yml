name: Fetch 9fzt Air China Cargo article
on:
  push:
    paths:
      - '.github/workflows/fetch_9fzt_air_china_cargo_article_20260927.yml'
      - 'tools/fetch_9fzt_air_china_cargo_article_20260927.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/fetch_9fzt_air_china_cargo_article_20260927.py
      - uses: actions/upload-artifact@v4
        with:
          name: 9fzt-air-china-cargo-article
          path: |
            9fzt_air_china_cargo_article.html
            9fzt_air_china_cargo_article.txt
            9fzt_air_china_cargo_candidates.json
          if-no-files-found: error
          retention-days: 3
