name: Package Shenzhen International public-reading reports

on:
  push:
    branches:
      - tmp/shenzhen-international-public-reading-package-20260831

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install browser, HTML and PDF tools
        run: |
          python -m pip install --quiet requests beautifulsoup4 playwright pypdf pymupdf
          python -m playwright install --with-deps chromium
      - name: Build, verify and package reports
        run: python .github/scripts/run_shenzhen_international_static_public_reports_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: shenzhen-international-public-reports
          path: 深圳国际_券商深度报告_3份_公开阅读版PDF.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
