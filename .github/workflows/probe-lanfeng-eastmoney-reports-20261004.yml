name: Probe Lanfeng Eastmoney reports 20261004

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_lanfeng_eastmoney_reports_20261004.py'
      - '.github/workflows/probe-lanfeng-eastmoney-reports-20261004.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Probe Eastmoney report API and PDFs
        run: python scripts/probe_lanfeng_eastmoney_reports_20261004.py
