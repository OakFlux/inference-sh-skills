name: Discover Xujiahui Sina reports 20260927

on:
  push:
    paths:
      - '.github/workflows/discover-xujiahui-sina-reports-20260927.yml'
      - 'scripts/discover_xujiahui_sina_reports_20260927.py'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Discover reports
        run: python scripts/discover_xujiahui_sina_reports_20260927.py
      - name: Upload discovery files
        uses: actions/upload-artifact@v4
        with:
          name: xujiahui-sina-report-discovery
          path: xujiahui_sina_discovery
          if-no-files-found: error
          retention-days: 7
