name: Scan Eastmoney narrow windows for Zhongsheng

on:
  push:
    paths:
      - '.github/workflows/zhongsheng-eastmoney-narrow-pages-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Scan every API page and test matched PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import json,re,time
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from io import BytesIO
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          END='https://reportapi.eastmoney.com/report/list'
          WINDOWS=[
            ('2019-03-26','2019-03-31'),
            ('2024-11-24','2024-11-29'),
            ('2025-01-24','2025-01-29'),
            ('2025-09-06','2025-09-11'),
            ('2025-12-10','2025-12-16'),
          ]
          NEEDLES=['中升控股','zhongsheng','00881','881 hk','汽车综合服务龙头','汽车经销商龙头基本面','发力汽车后市场','底部反转在即','全力打造高端汽车服务品牌']

          def sess():
            s=requests.Session(); s.trust_env=False
            s.headers.update({'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Referer':'https://data.eastmoney.com/report/'})
            return s
          def page(begin,end,qtype,p):
            s=sess(); params={'pageNo':p,'pageSize':100,'code':'','qType':qtype,'beginTime':begin,'endTime':end,'_':int(time.time()*1000)+p+qtype*1000}
            for a in range(4):
              try:
                r=s.get(END,params=params,timeout=(15,90)); r.raise_for_status(); o=r.json()
                rows=o.get('data') or []
                return p,rows if isinstance(rows,list) else [],int(o.get('TotalPage') or 0)
              except Exception as e:
                if a==3: raise
                time.sleep(a+1)

          matches={}
          for begin,end in WINDOWS:
            for q in (0,1,2):
              p,rows,total=page(begin,end,q,1)
              print('WINDOW',begin,end,'Q',q,'TOTAL',total,'ROWS1',len(rows),flush=True)
              allrows=list(rows)
              if total>1:
                with ThreadPoolExecutor(max_workers=min(12,total-1)) as ex:
                  futs=[ex.submit(page,begin,end,q,n) for n in range(2,total+1)]
                  for f in as_completed(futs):
                    n,rs,_=f.result(); allrows.extend(rs); print('PAGE',begin,end,q,n,len(rs),flush=True)
              for row in allrows:
                raw=json.dumps(row,ensure_ascii=False)
                compact=re.sub(r'\s+',' ',raw).lower()
                if any(n.lower() in compact for n in NEEDLES):
                  info=str(row.get('infoCode') or row.get('infocode') or '')
                  key=info or raw
                  matches[key]=row
                  print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)

          valid=[]
          for key,row in matches.items():
            info=str(row.get('infoCode') or row.get('infocode') or '')
            if not info.startswith('AP'): continue
            for prefix in ('H3','H2','H1'):
              u=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
              try:
                s=sess(); r=s.get(u,headers={'Accept':'application/pdf,*/*','Referer':'https://data.eastmoney.com/'},timeout=(20,180),allow_redirects=True)
                print('PDFTRY',info,prefix,r.status_code,r.headers.get('content-type'),len(r.content),r.url,r.content[:8],flush=True)
                if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100000:
                  rd=PdfReader(BytesIO(r.content),strict=False); pages=len(rd.pages)
                  text=''
                  for i in range(min(5,pages)):
                    try:text+=(rd.pages[i].extract_text() or '')+'\n'
                    except Exception:pass
                  rec={'infoCode':info,'title':row.get('title'),'date':row.get('publishDate'),'org':row.get('orgSName') or row.get('orgName'),'pages':pages,'bytes':len(r.content),'url':r.url,'identity':any(x.lower() in text.lower() for x in ('中升控股','zhongsheng','881 hk','00881')),'row':row}
                  valid.append(rec); print('VALID',json.dumps(rec,ensure_ascii=False),flush=True); break
              except Exception as e:print('PDFERR',info,prefix,repr(e),flush=True)
          result={'matches':list(matches.values()),'valid':valid}
          Path('zhongsheng_eastmoney_narrow.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL',json.dumps({'match_count':len(matches),'valid_count':len(valid)},ensure_ascii=False),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: zhongsheng-eastmoney-narrow-20260904
          path: zhongsheng_eastmoney_narrow.json
          if-no-files-found: error
          retention-days: 7
