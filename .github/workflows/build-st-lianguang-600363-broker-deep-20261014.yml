name: Build ST Lianguang 600363 broker deep archive 20261014
on:
  push:
    paths:
      - '.github/workflows/build-st-lianguang-600363-broker-deep-20261014.yml'
      - 'scripts/build_st_lianguang_600363_broker_deep_archive_20261014.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Patch 2026 metadata fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_st_lianguang_600363_broker_deep_archive_20261014.py')
          text = path.read_text(encoding='utf-8')
          old = '\n'.join([
              '        if not metadata:',
              '            raise RuntimeError(f"Missing Eastmoney metadata for {target[\'info_code\']}")',
          ])
          new = '\n'.join([
              '        if not metadata:',
              '            metadata = {',
              '                "stockCode": CODE,',
              '                "stockName": HISTORICAL_NAME,',
              '                "orgName": target["broker_full"],',
              '                "orgSName": target["broker"],',
              '                "publishDate": target["report_date"],',
              '                "infoCode": target["info_code"],',
              '                "attachPages": 0,',
              '                "attachSize": 0,',
              '                "researcher": target.get("analyst_hint") or "",',
              '                "emRatingName": target.get("rating_hint") or "",',
              '                "sRatingName": target.get("rating_hint") or "",',
              '                "title": target["title_hint"],',
              '                "metadata_fallback": True,',
              '            }',
              '            log("METADATA_FALLBACK", json.dumps(metadata, ensure_ascii=False))',
          ])
          if old not in text:
              raise RuntimeError('Expected metadata fallback block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build archive
        shell: bash
        run: |
          python scripts/build_st_lianguang_600363_broker_deep_archive_20261014.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: st-lianguang-600363-broker-deep-20261014
          path: ST联光_600363_券商深度报告_2份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
