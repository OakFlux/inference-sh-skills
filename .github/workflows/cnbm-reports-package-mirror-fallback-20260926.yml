name: Build CNBM reports package mirror fallback 20260926
on:
  push:
    paths:
      - '.github/workflows/cnbm-reports-package-mirror-fallback-20260926.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install document tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Create mirror-only runtime builder
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          src = Path('scripts/build_cnbm_reports_package_20260926.py').read_text(encoding='utf-8')
          src = re.sub(
              r'KNOWN_ARTICLES = \{.*?\n\}\n\n# Discover additional article URLs',
              'KNOWN_ARTICLES = {y: [] for y in range(2020, 2026)}\n\n# Discover additional article URLs',
              src,
              flags=re.S,
          )
          src = re.sub(
              r'seed_pages = \[.*?\n\]\nfor seed in seed_pages:',
              'seed_pages = []\nfor seed in seed_pages:',
              src,
              flags=re.S,
          )
          Path('scripts/_build_cnbm_reports_mirror_runtime.py').write_text(src, encoding='utf-8')
          PY
      - name: Build and validate package
        run: python scripts/_build_cnbm_reports_mirror_runtime.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: cnbm-03323-2020-2025-reports-mirror-final
          path: 中国建材_03323_2020-2025年报_2026最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
