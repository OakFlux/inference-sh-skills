name: Scan Sihuan PDF sources

on:
  push:
    branches:
      - tmp/sihuan-pharma-reports-20260902

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python .github/scripts/scan_sihuan_pdf_sources.py
