name: Debug HKEX title search for UEG

on:
  push:
    paths:
      - '.github/workflows/ueg-hkex-debug-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe HKEX search payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          endpoint = 'https://www1.hkexnews.hk/search/titleSearchServlet.do'
          base = {
              'sortDir': '0', 'sortByOptions': 'DateTime',
              'category': '0', 'market': 'SEHK', 'stockId': '943',
              'documentType': '-1', 'fromDate': '20210101', 'toDate': '20210630',
              'title': '', 'searchType': '1', 'rowRange': '200',
          }
          headers = {
              'User-Agent': ua,
              'Accept': 'application/json,text/plain,*/*',
              'Referer': 'https://www1.hkexnews.hk/search/titlesearch.xhtml',
              'X-Requested-With': 'XMLHttpRequest',
          }
          variants = [
              {'t1code': '40000', 't2Gcode': '-2', 't2code': '-2'},
              {'t1code': '-2', 't2Gcode': '-2', 't2code': '-2'},
              {'t1code': '40000', 't2Gcode': '40200', 't2code': '-2'},
              {'t1code': '40000', 't2Gcode': '40200', 't2code': '40202'},
          ]
          for lang in ('en', 'zh'):
              for i, extra in enumerate(variants, 1):
                  params = {**base, **extra, 'lang': lang}
                  r = s.get(endpoint, params=params, headers=headers, timeout=(20, 120))
                  print('\n=== API', lang, i, r.status_code, r.headers.get('content-type'), len(r.content), r.url, '===', flush=True)
                  print(r.text[:12000], flush=True)
                  try:
                      obj = r.json()
                      print('JSON_TYPE', type(obj).__name__, flush=True)
                      if isinstance(obj, dict):
                          print('JSON_KEYS', list(obj.keys()), flush=True)
                          value = obj.get('result')
                          print('RESULT_TYPE', type(value).__name__, flush=True)
                          if isinstance(value, str):
                              print('RESULT_STR', value[:12000], flush=True)
                              try:
                                  parsed = json.loads(value)
                                  print('INNER_TYPE', type(parsed).__name__, flush=True)
                                  print('INNER_JSON', json.dumps(parsed, ensure_ascii=False)[:12000], flush=True)
                              except Exception as exc:
                                  print('INNER_JSON_ERROR', repr(exc), flush=True)
                  except Exception as exc:
                      print('JSON_ERROR', repr(exc), flush=True)

          html_url = 'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=943&from=20210101&to=20210630'
          r = s.get(html_url, headers={'User-Agent': ua, 'Accept': 'text/html,*/*'}, timeout=(20, 120))
          print('\n=== HTML', r.status_code, r.headers.get('content-type'), len(r.content), r.url, '===', flush=True)
          print(r.text[:20000], flush=True)
          soup = BeautifulSoup(r.text, 'html.parser')
          for a in soup.find_all('a', href=True):
              href = a.get('href', '')
              text = a.get_text(' ', strip=True)
              if 'pdf' in href.lower() or 'report' in text.lower() or 'annual' in text.lower() or '年報' in text:
                  print('ANCHOR', repr(text), repr(href), flush=True)
          PY
