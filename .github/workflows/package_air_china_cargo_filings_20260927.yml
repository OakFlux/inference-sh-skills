name: Package Air China Cargo filings

on:
  push:
    paths:
      - '.github/workflows/package_air_china_cargo_filings_20260927.yml'
      - 'tools/package_air_china_cargo_filings_20260927.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet 'httpx[http2]' pypdf

      - name: Download validate and package filings
        run: python tools/package_air_china_cargo_filings_20260927.py

      - name: Upload package and validation previews
        uses: actions/upload-artifact@v4
        with:
          name: air-china-cargo-filings-all-annual-prospectus-latest
          path: |
            国货航_001391_所有年报_招股说明书及最新季报.zip
            air_china_cargo_filings_result.json
            _previews_air_china_cargo_filings/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
