name: Diagnose Zhongchuan Keji 600072 broker reports 20261004

on:
  push:
    paths:
      - '.github/workflows/diag-zhongchuan-keji-600072-reports-20261004.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query Eastmoney and Sina report archives
        run: |
          python - <<'PY'
          import json, re, requests
          from html import unescape

          s=requests.Session(); s.trust_env=False
          h={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept':'application/json,text/plain,*/*',
            'Content-Type':'application/json',
          }
          body={
            'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,
            'beginTime':'2008-01-01','endTime':'2026-10-04','code':'600072',
            'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''
          }
          r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers=h,timeout=90)
          print('EASTMONEY',r.status_code,len(r.content),flush=True)
          r.raise_for_status(); obj=r.json(); rows=obj.get('data') or []
          print('META',obj.get('hits'),obj.get('TotalPage'),len(rows),flush=True)
          for row in rows:
            slim={k:row.get(k) for k in ['title','orgSName','publishDate','stockName','stockCode','infoCode','researcher','ratingName','ratingChange','column']}
            print('REPORT',json.dumps(slim,ensure_ascii=False,default=str),flush=True)
          for row in rows:
            info=str(row.get('infoCode') or '')
            title=str(row.get('title') or '')
            if not info: continue
            if not any(k in title for k in ['深度','首次覆盖','公司研究','重组','风电','龙头','价值','研究','资产注入','整体上市']):
              continue
            url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
            try:
              p=s.get(url,headers={'User-Agent':h['User-Agent'],'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=90,stream=True,allow_redirects=True)
              head=next(p.iter_content(32),b'')
              print('PDF_PROBE',info,p.status_code,p.headers.get('content-type'),p.headers.get('content-length'),p.url,repr(head[:16]),flush=True)
              p.close()
            except Exception as e:
              print('PDF_ERROR',info,repr(e),flush=True)

          hs={'User-Agent':h['User-Agent'],'Accept-Language':'zh-CN,zh;q=0.9'}
          for page in range(1,8):
            url=f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=600072&t1=all&p={page}'
            rr=s.get(url,headers=hs,timeout=60); rr.encoding=rr.apparent_encoding or 'gbk'; text=rr.text
            print('\nSINA_PAGE',page,rr.status_code,len(rr.content),flush=True)
            trs=re.findall(r'<tr[^>]*>(.*?)</tr>',text,re.I|re.S); count=0
            for tr in trs:
              m=re.search(r'vReport_Show/kind/search/rptid/(\d+)/index\.phtml[^>]*>(.*?)</a>',tr,re.I|re.S)
              if not m: continue
              rid=m.group(1); title=re.sub(r'<[^>]+>','',unescape(m.group(2))); title=re.sub(r'\s+',' ',title).strip()
              cells=[re.sub(r'\s+',' ',re.sub(r'<[^>]+>','',unescape(c))).strip() for c in re.findall(r'<td[^>]*>(.*?)</td>',tr,re.I|re.S)]
              print('SINA_REPORT',rid,'|',title,'|',' | '.join(cells),flush=True); count+=1
            print('SINA_COUNT',count,flush=True)
            if count==0: break
          PY
