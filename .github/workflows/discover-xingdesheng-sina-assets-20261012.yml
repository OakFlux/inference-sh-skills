name: Discover Xingdesheng Sina report assets 20261012

on:
  push:
    branches:
      - xingdesheng-broker-reports-20261012
    paths:
      - '.github/workflows/discover-xingdesheng-sina-assets-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Discover report assets
        run: python scripts/discover_xingdesheng_sina_report_assets_20261012.py
