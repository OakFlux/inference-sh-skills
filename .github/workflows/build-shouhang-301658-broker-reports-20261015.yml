name: Build Shouhang 301658 broker reports 20261015
on:
  push:
    paths:
      - '.github/workflows/build-shouhang-301658-broker-reports-20261015.yml'
      - 'scripts/build_shouhang_301658_broker_reports_20261015.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Build archive
        shell: bash
        run: |
          python scripts/build_shouhang_301658_broker_reports_20261015.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: shouhang-301658-broker-reports-20261015
          path: shouhang_xinneng_301658_broker_reports_2.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
