name: Diagnose Guiyang Bank reports 20261016

on:
  push:
    branches:
      - guiyang-bank-broker-reports-20261016
    paths:
      - .github/workflows/diagnose-guiyang-bank-reports-20261016.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf
      - name: Inspect API records and PDFs
        run: |
          python - <<'PY'
          import io, json, re, time, requests
          from pypdf import PdfReader

          API='https://reportapi.eastmoney.com/report/list'
          params={
              'cb':'datatable','pageSize':'100','beginTime':'2000-01-01','endTime':'2026-10-16',
              'pageNo':'1','fields':'','qType':'0','orgCode':'','author':'','code':'601997','rcode':'',
              'p':'1','pageNum':'1','pageNumber':'1'
          }
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=601997'}
          r=requests.get(API,params=params,headers=headers,timeout=120)
          print('API',r.status_code,r.url,len(r.content))
          text=r.text.strip()
          m=re.match(r'^[^(]+\((.*)\)\s*;?$',text,re.S)
          if m: text=m.group(1)
          data=json.loads(text)
          rows=data.get('data') or []
          print('ROW_COUNT',len(rows),'TOTAL_PAGE',data.get('TotalPage'))
          for idx,row in enumerate(rows,1):
              keep={k:row.get(k) for k in [
                  'stockCode','stockName','title','orgSName','orgName','publishDate','attachPages',
                  'infoCode','researcher','author','emRatingName','sRatingName','ratingName'
              ]}
              print('\nROW',idx,json.dumps(keep,ensure_ascii=False))
              info=str(row.get('infoCode') or '')
              for prefix in ('H3','H2'):
                  url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf?{int(time.time()*1000)}.pdf='
                  try:
                      pr=requests.get(url,headers={**headers,'Referer':f'https://data.eastmoney.com/report/info/{info}.html'},timeout=120)
                      payload=pr.content
                      print('PDF_TRY',prefix,pr.status_code,pr.headers.get('content-type'),len(payload),pr.url)
                      if payload.startswith(b'%PDF-'):
                          try:
                              pages=len(PdfReader(io.BytesIO(payload),strict=False).pages)
                          except Exception as e:
                              pages=f'ERROR:{e!r}'
                          print('PDF_OK',prefix,'PAGES',pages,'HEAD',payload[:8])
                          break
                  except Exception as e:
                      print('PDF_ERROR',prefix,repr(e))
          PY
