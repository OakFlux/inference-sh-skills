name: Search Eastmoney for Sany International reports

on:
  push:
    paths:
      - '.github/workflows/eastmoney-search-sany-international-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Query search APIs and pages
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup

          out=Path('em_search_sany'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          hdr={'User-Agent':ua,'Accept':'application/json,text/plain,*/*','Referer':'https://so.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'}
          queries=['三一国际','三一重装国际','00631','0631.HK','SANY HEAVY EQUIPMENT INTERNATIONAL']
          responses=[]
          for q in queries:
            urls=[
              ('suggest_adapter','https://searchadapter.eastmoney.com/api/suggest/get',{'input':q,'type':'6','token':'D43BF722C8E33BDC906FB84D85E326E8','count':'100'}),
              ('suggest_api','https://searchapi.eastmoney.com/api/suggest/get',{'input':q,'type':'6','token':'D43BF722C8E33BDC906FB84D85E326E8','count':'100'}),
              ('search_web','https://search-api-web.eastmoney.com/search/jsonp',{'keyword':q,'type':'researchReport','client':'web','clientType':'web','clientVersion':'curr','param':'{"researchReport":{"pageIndex":1,"pageSize":100}}'}),
            ]
            for name,url,params in urls:
              try:
                r=s.get(url,params=params,headers=hdr,timeout=(30,180),allow_redirects=True)
                print('API',q,name,r.status_code,len(r.content),r.url,r.text[:1000],flush=True)
                rec={'query':q,'name':name,'url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type'),'text':r.text}
                responses.append(rec)
                (out/f'{len(responses):03d}_{name}.txt').write_text(r.text,encoding='utf-8')
              except Exception as e:
                print('API_ERROR',q,name,repr(e),flush=True)
                responses.append({'query':q,'name':name,'error':repr(e)})

            for scheme in ('https','http'):
              url=f'{scheme}://so.eastmoney.com/Yanbao/s?KeyWord={quote(q)}'
              try:
                r=s.get(url,headers={'User-Agent':ua,'Accept':'text/html,*/*','Referer':'https://www.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'},timeout=(30,180),allow_redirects=True)
                print('PAGE',q,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                r.encoding=r.apparent_encoding or 'utf-8'; text=r.text
                (out/f'{len(responses)+1:03d}_page.html').write_text(text,encoding='utf-8')
                soup=BeautifulSoup(text,'html.parser')
                links=[]
                for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split())
                  href=a['href']
                  if any(k in (label+' '+href).lower() for k in ('三一国际','三一重装','00631','report','yanbao','infocode','research')):
                    links.append({'label':label,'href':href})
                scripts=[sc.get('src') for sc in soup.find_all('script',src=True)]
                rec={'query':q,'name':'search_page','url':r.url,'status':r.status_code,'length':len(r.content),'links':links,'scripts':scripts,'matches':re.findall(r'(?:infoCode|infocode|AP\d{15,}|AS\d{15,})[^\"\'<>\s]{0,100}',text,flags=re.I)[:500]}
                responses.append(rec)
                print('PAGE_REC',json.dumps(rec,ensure_ascii=False,indent=2)[:50000],flush=True)
                break
              except Exception as e:
                print('PAGE_ERROR',q,scheme,repr(e),flush=True)
          (out/'responses.json').write_text(json.dumps(responses,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eastmoney-search-sany-international
          path: em_search_sany/
          if-no-files-found: error
          retention-days: 7
