name: Inspect Changying Precision report inventory
on:
  push:
    paths:
      - '.github/workflows/inspect_changying_report_inventory_20260928.yml'
      - 'tools/inspect_changying_report_inventory_20260928.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python tools/inspect_changying_report_inventory_20260928.py
      - uses: actions/upload-artifact@v4
        with:
          name: changying-report-inventory
          path: changying_report_inventory.json
          if-no-files-found: error
          retention-days: 3
