name: Inspect Sina Ren Zixing reports

on:
  push:
    paths:
      - '.github/workflows/inspect_sina_renzixing_reports_20261004.yml'
      - 'tools/inspect_sina_renzixing_reports_20261004.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/inspect_sina_renzixing_reports_20261004.py
      - uses: actions/upload-artifact@v4
        with:
          name: sina-renzixing-report-list
          path: sina_renzixing_report_list.json
          if-no-files-found: error
          retention-days: 3
