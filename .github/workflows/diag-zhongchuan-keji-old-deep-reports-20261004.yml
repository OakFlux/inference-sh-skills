name: Locate old Zhongchuan Keji deep reports 20261004

on:
  push:
    paths:
      - '.github/workflows/diag-zhongchuan-keji-old-deep-reports-20261004.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Scan narrow Eastmoney date windows
        run: |
          python - <<'PY'
          import json, requests, time

          windows=[
            ('2017-07-24','2017-07-28','有里有面有平台'),
            ('2016-07-03','2016-07-08','新定位 新钢构'),
            ('2023-04-10','2023-04-16','优质风电资产有望注入'),
          ]
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*','Content-Type':'application/json'}
          found={}
          for begin,end,needle in windows:
            print('\nWINDOW',begin,end,needle,flush=True)
            for page in range(1,50):
              body={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':begin,'endTime':end,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              for attempt in range(1,5):
                try:
                  r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers=h,timeout=90)
                  r.raise_for_status(); obj=r.json(); break
                except Exception as e:
                  print('REQUEST_RETRY',begin,page,attempt,repr(e),flush=True); time.sleep(attempt*2)
              else:
                continue
              rows=obj.get('data') or []; total=int(obj.get('TotalPage') or 0)
              print('PAGE',page,'META',obj.get('hits'),total,len(rows),flush=True)
              for row in rows:
                blob=' '.join(str(row.get(k) or '') for k in ['title','stockName','stockCode','orgSName','researcher'])
                if row.get('stockCode')=='600072' or '中船科技' in blob or '钢构工程' in blob or needle in blob:
                  info=str(row.get('infoCode') or blob); found[info]=row
                  print('MATCH',json.dumps(row,ensure_ascii=False,default=str),flush=True)
              if not rows or page>=total: break
          print('\nFOUND',len(found),flush=True)
          for info,row in found.items():
            print('RESULT',info,json.dumps(row,ensure_ascii=False,default=str),flush=True)
            if info.startswith('AP'):
              url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              try:
                p=s.get(url,headers={'User-Agent':h['User-Agent'],'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=90,stream=True,allow_redirects=True)
                head=next(p.iter_content(32),b'')
                print('PDF_PROBE',info,p.status_code,p.headers.get('content-type'),p.headers.get('content-length'),p.url,repr(head[:16]),flush=True)
                p.close()
              except Exception as e:
                print('PDF_ERROR',info,repr(e),flush=True)
          PY
