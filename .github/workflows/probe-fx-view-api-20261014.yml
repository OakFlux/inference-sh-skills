name: Probe FX view API 20261014

on:
  push:
    paths:
      - '.github/workflows/probe-fx-view-api-20261014.yml'
      - 'scripts/probe_fx_view_api_20261014.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Probe viewer bundles
        run: python scripts/probe_fx_view_api_20261014.py | tee fx_view_api_probe.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fx-view-api-probe-20261014
          path: |
            fx_view_api_probe/
            fx_view_api_probe.log
          if-no-files-found: error
          retention-days: 30
