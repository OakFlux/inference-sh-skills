name: Probe Mengguli broker reports 20261004

on:
  push:
    paths:
      - '.github/workflows/probe-mengguli-broker-reports-20261004.yml'
      - 'scripts/probe_mengguli_broker_reports_20261004.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Probe report pages
        run: python scripts/probe_mengguli_broker_reports_20261004.py
