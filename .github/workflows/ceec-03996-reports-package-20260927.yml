name: Build China Energy Engineering 2020-2025 reports package 20260927
on:
  push:
    paths:
      - '.github/workflows/ceec-03996-reports-package-20260927.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Download validate and package reports
        run: python scripts/build_ceec_03996_reports_20260927.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ceec-03996-601868-2020-2025-annual-2026-latest-reports
          path: 中国能源建设_03996_601868_2020-2025年报_2026最新定期报告.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
