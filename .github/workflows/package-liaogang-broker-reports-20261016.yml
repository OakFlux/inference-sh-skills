name: Package Liaogang broker reports 20261016

on:
  push:
    branches:
      - liaogang-broker-reports-20261016
    paths:
      - .github/workflows/package-liaogang-broker-reports-20261016.yml
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf

      - name: Prepare Liaogang report packager
        run: |
          mkdir -p scripts
          curl -L --fail --retry 4 \
            https://raw.githubusercontent.com/OakFlux/inference-sh-skills/tiantan-broker-reports-20261016/scripts/package_tiantan_broker_reports_20261016.py \
            -o scripts/package_liaogang_broker_reports_20261016.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/package_liaogang_broker_reports_20261016.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('北京天坛生物制品股份有限公司', '辽宁港口股份有限公司'),
              ('天坛生物', '辽港股份'),
              ('600161', '601880'),
              ('dist_tiantan_broker', 'dist_liaogang_broker'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Download, validate, and package reports
        run: python scripts/package_liaogang_broker_reports_20261016.py

      - name: Show package summary
        run: cat dist_liaogang_broker/package_summary.json

      - name: Verify packaged PDF count
        run: |
          python - <<'PY'
          import glob, zipfile
          paths = glob.glob('dist_liaogang_broker/*.zip')
          assert len(paths) == 1, paths
          with zipfile.ZipFile(paths[0]) as zf:
              assert zf.testzip() is None
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              assert 2 <= len(pdfs) <= 3, pdfs
          print(paths[0], len(pdfs))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: liaogang-601880-broker-reports-20261016
          path: |
            dist_liaogang_broker/*.zip
            dist_liaogang_broker/package_summary.json
          if-no-files-found: error
          retention-days: 30
