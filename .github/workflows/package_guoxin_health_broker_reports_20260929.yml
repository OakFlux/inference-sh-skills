name: Package Guoxin Health broker reports

on:
  push:
    paths:
      - '.github/workflows/package_guoxin_health_broker_reports_20260929.yml'
      - 'tools/package_guoxin_health_broker_reports_20260929.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pillow
      - name: Download, validate and package reports
        run: python tools/package_guoxin_health_broker_reports_20260929.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: guoxin-health-000503-broker-reports-3
          path: |
            国新健康_000503_券商研究报告_3份.zip
            guoxin_health_broker_reports_result.json
            _previews_guoxin_health_broker_reports/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
