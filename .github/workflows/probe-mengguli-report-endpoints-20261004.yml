name: Probe Mengguli report endpoints 20261004

on:
  push:
    paths:
      - '.github/workflows/probe-mengguli-report-endpoints-20261004.yml'
      - 'scripts/probe_mengguli_report_endpoints_20261004.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Probe endpoints
        run: python scripts/probe_mengguli_report_endpoints_20261004.py
