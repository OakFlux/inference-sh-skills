name: Build Solex official broker reports 20261014

on:
  push:
    paths:
      - '.github/workflows/build-solex-official-broker-reports-20261014.yml'
      - 'scripts/build_solex_official_broker_reports_20261014.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        run: python scripts/build_solex_official_broker_reports_20261014.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: solex-official-broker-reports-20261014
          path: 松霖科技_603992_券商研究报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
