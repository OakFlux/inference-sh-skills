name: Discover official REPT BATTERO annual prospectus and interim documents

on:
  push:
    paths:
      - '.github/workflows/rept-battero-official-doc-discovery-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Query HKEX and company IR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, unquote
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('discovery'); OUT.mkdir(exist_ok=True)
          s=requests.Session()
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          H={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9,zh-CN;q=0.8','X-Requested-With':'XMLHttpRequest','Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml'}

          def get(url, **kw):
            for i in range(4):
              try:
                r=s.get(url,headers={**H,**kw.pop('headers',{})},timeout=(20,120),allow_redirects=True,**kw)
                print('GET',r.status_code,len(r.content),r.url,flush=True)
                if r.status_code==200:return r
              except Exception as e: print('ERR',url,repr(e),flush=True)
              time.sleep(i+1)
            raise RuntimeError(url)

          def all_urls(obj):
            raw=html.unescape(json.dumps(obj,ensure_ascii=False)).replace('\\/','/')
            vals=[]
            for pat in [r'https?://[^"\'<>\s]+',r'/listedco/listconews/[^"\'<>\s]+',r'/app/sehk/[^"\'<>\s]+']:
              for u in re.findall(pat,raw,re.I):
                u=unquote(u).rstrip('),;]')
                if u.startswith('/'):u=urljoin('https://www1.hkexnews.hk',u)
                if u not in vals:vals.append(u)
            return vals

          def flatten(obj):
            out=[]
            if isinstance(obj,list):
              for x in obj: out+=flatten(x)
            elif isinstance(obj,dict):
              out.append(obj)
              for v in obj.values():
                if isinstance(v,(list,dict)):out+=flatten(v)
                elif isinstance(v,str) and len(v)>2 and v[0] in '[{':
                  try:out+=flatten(json.loads(v))
                  except:pass
            return out

          endpoint='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          queries=[]
          titles=['','PROSPECTUS','GLOBAL OFFERING','ANNUAL REPORT','INTERIM RESULTS','招股章程','全球發售','年報','中期業績']
          for lang in ['en','zh']:
            for title in titles:
              params={
                'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':'1000209973',
                'documentType':'-1','fromDate':'20230101','toDate':'20260902','title':title,'searchType':'1',
                't1code':'-2','t2Gcode':'-2','t2code':'-2','rowRange':'500','lang':lang,
              }
              try:
                r=get(endpoint,params=params)
                try:data=r.json()
                except:data={'raw':r.text}
                queries.append({'lang':lang,'title':title,'url':r.url,'data':data})
              except Exception as e: queries.append({'lang':lang,'title':title,'error':repr(e)})
          (OUT/'hkex_queries.json').write_text(json.dumps(queries,ensure_ascii=False,indent=2),encoding='utf-8')

          candidates=[]
          keys=['PROSPECTUS','GLOBAL OFFERING','ANNUAL REPORT','INTERIM RESULTS','2023','2024','2025','2026','招股','全球發售','年報','年度報告','中期業績','中期结果','中期結果']
          for q in queries:
            for row in flatten(q.get('data')):
              txt=json.dumps(row,ensure_ascii=False)
              if any(k.upper() in txt.upper() for k in keys):
                candidates.append({'query':{'lang':q.get('lang'),'title':q.get('title')},'row':row,'urls':all_urls(row)})
          (OUT/'hkex_candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')

          pages=[
            'https://www.reptbattero.com/investor-relations-financial-information/',
            'https://www.reptbattero.com/investor-relations/',
            'https://www.reptbattero.com/investor-relations-announcements-and-circulars/',
            'https://www.reptbattero.com/wp-json/wp/v2/search?search=prospectus&per_page=100',
            'https://www.reptbattero.com/wp-json/wp/v2/search?search=annual%20report&per_page=100',
            'https://www.reptbattero.com/wp-json/wp/v2/search?search=interim%20results&per_page=100',
            'https://www1.hkexnews.hk/listedco/listconews/sehk/2023/1218/2023113001520.htm',
          ]
          company=[]
          for url in pages:
            try:
              r=get(url,headers={'Referer':'https://www.reptbattero.com/'})
              text=r.text
              links=[]
              soup=BeautifulSoup(text,'html.parser')
              for tag in soup.find_all(['a','iframe','script','link']):
                for attr in ['href','src','data-href','data-url','data-file','data-src']:
                  v=tag.get(attr)
                  if v:
                    v=urljoin(r.url,html.unescape(v))
                    if v not in links:links.append(v)
              links += [u for u in all_urls(text) if u not in links]
              company.append({'requested':url,'final':r.url,'status':r.status_code,'length':len(r.content),'links':links,'snippet':text[:20000]})
            except Exception as e: company.append({'requested':url,'error':repr(e)})
          (OUT/'company_pages.json').write_text(json.dumps(company,ensure_ascii=False,indent=2),encoding='utf-8')

          summary=[]
          for c in candidates:
            txt=json.dumps(c['row'],ensure_ascii=False)
            summary.append({'text':txt[:1200],'urls':c['urls']})
          for p in company:
            for u in p.get('links',[]):
              if any(k in u.lower() for k in ['pdf','prospect','annual','interim','hkexnews','wp-content']):
                summary.append({'page':p.get('final'),'url':u})
          (OUT/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('CANDIDATES',len(candidates),'SUMMARY',len(summary),flush=True)
          PY

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: rept-battero-official-doc-discovery
          path: discovery/
          if-no-files-found: error
          retention-days: 7
