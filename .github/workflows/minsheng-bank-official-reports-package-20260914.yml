name: Package China Minsheng Bank official reports

on:
  push:
    paths:
      - '.github/workflows/minsheng-bank-official-reports-package-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import html
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from pypdf import PdfReader

          CODE = '600016'
          COMPANY = '中国民生银行股份有限公司'
          SHORT = '民生银行'
          AS_OF = '2026-09-14'
          PACKAGE = '民生银行_2020-2025年报及最新定期报告_截至2026-09-14'
          OUT = Path(PACKAGE)
          WORK = Path('_work')
          PREVIEW = WORK / 'preview'
          FINAL_ZIP = Path(PACKAGE + '.zip')
          OUT.mkdir(exist_ok=True)
          PREVIEW.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          api_headers = {
              'User-Agent': ua,
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Origin': 'https://www.cninfo.com.cn',
              'Referer': 'https://www.cninfo.com.cn/',
              'X-Requested-With': 'XMLHttpRequest',
          }
          pdf_headers = {
              'User-Agent': ua,
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://www.cninfo.com.cn/',
          }

          def compact(text):
              return re.sub(r'[^0-9A-Z\u3400-\u9FFF]+', '', str(text).upper())

          def clean_title(value):
              value = html.unescape(str(value or ''))
              value = re.sub(r'<[^>]+>', '', value)
              value = re.sub(r'\s+', '', value.replace('\u3000', ' ')).strip()
              for prefix in (COMPANY, SHORT):
                  for sep in ('：', ':'):
                      if value.startswith(prefix + sep):
                          value = value[len(prefix + sep):]
              return value

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def ann_time(row):
              try:
                  return int(row.get('announcementTime') or row.get('announcementDate') or 0)
              except Exception:
                  return 0

          def discover_org_id():
              endpoint = 'https://www.cninfo.com.cn/new/information/topSearch/query'
              for keyword in (SHORT, CODE, COMPANY):
                  for method in ('post', 'get'):
                      try:
                          if method == 'post':
                              r = session.post(endpoint, data={'keyWord': keyword, 'maxNum': 30}, headers=api_headers, timeout=(20, 120))
                          else:
                              r = session.get(endpoint, params={'keyWord': keyword, 'maxNum': 30}, headers=api_headers, timeout=(20, 120))
                          print('TOPSEARCH', method, keyword, r.status_code, len(r.content), flush=True)
                          if r.status_code != 200:
                              continue
                          data = r.json()
                          if isinstance(data, dict):
                              for key in ('data', 'result', 'records', 'keyBoardList'):
                                  if isinstance(data.get(key), list):
                                      data = data[key]
                                      break
                              else:
                                  data = [data]
                          for row in data or []:
                              code = str(row.get('code') or row.get('secCode') or row.get('stockCode') or '')
                              name = str(row.get('zwjc') or row.get('secName') or row.get('name') or '')
                              org = row.get('orgId') or row.get('orgid')
                              if org and (code == CODE or SHORT in name):
                                  print('ORG_ID', org, json.dumps(row, ensure_ascii=False), flush=True)
                                  return str(org)
                      except Exception as exc:
                          print('TOPSEARCH ERROR', method, keyword, repr(exc), flush=True)
              return ''

          ORG_ID = discover_org_id()
          print('RESOLVED ORG_ID', ORG_ID, flush=True)

          def query_cninfo(se_date, category='', searchkey=''):
              merged = {}
              endpoints = (
                  'https://www.cninfo.com.cn/new/hisAnnouncement/query',
                  'http://www.cninfo.com.cn/new/hisAnnouncement/query',
              )
              stock_values = []
              if ORG_ID:
                  stock_values.append(f'{CODE},{ORG_ID}')
              stock_values += [CODE, '']
              for stock_value in stock_values:
                  for endpoint in endpoints:
                      seen_signatures = set()
                      for page in range(1, 41):
                          payload = {
                              'pageNum': str(page),
                              'pageSize': '30',
                              'column': 'sse',
                              'tabName': 'fulltext',
                              'plate': 'sh',
                              'stock': stock_value,
                              'searchkey': searchkey if stock_value else (searchkey or SHORT),
                              'secid': '',
                              'category': category,
                              'trade': '',
                              'seDate': se_date,
                              'sortName': '',
                              'sortType': '',
                              'isHLtitle': 'true',
                          }
                          try:
                              r = session.post(endpoint, data=payload, headers=api_headers, timeout=(25, 180))
                              print('QUERY', endpoint, stock_value, se_date, category, payload['searchkey'], page, r.status_code, len(r.content), flush=True)
                              r.raise_for_status()
                              data = r.json()
                              rows = data.get('announcements') or []
                              filtered = [x for x in rows if str(x.get('secCode') or '') == CODE or SHORT in str(x.get('secName') or '')]
                              signature = tuple(str(x.get('announcementId') or x.get('adjunctUrl')) for x in filtered)
                              if signature and signature in seen_signatures:
                                  print('REPEATED PAGE; STOP', page, flush=True)
                                  break
                              if signature:
                                  seen_signatures.add(signature)
                              for row in filtered:
                                  key = str(row.get('announcementId') or row.get('adjunctUrl') or row.get('announcementTitle'))
                                  merged[key] = row
                              total = int(data.get('totalAnnouncement') or data.get('totalRecordNum') or 0)
                              if not rows or (total and page * 30 >= total):
                                  break
                          except Exception as exc:
                              print('QUERY ERROR', endpoint, stock_value, se_date, category, page, repr(exc), flush=True)
                              break
                      if merged:
                          break
                  if merged:
                      break
              return list(merged.values())

          rows_map = {}
          windows = [
              ('2021-01-01~2021-06-30', 'category_ndbg_szsh', ''),
              ('2022-01-01~2022-06-30', 'category_ndbg_szsh', ''),
              ('2023-01-01~2023-06-30', 'category_ndbg_szsh', ''),
              ('2024-01-01~2024-06-30', 'category_ndbg_szsh', ''),
              ('2025-01-01~2025-06-30', 'category_ndbg_szsh', ''),
              ('2026-01-01~2026-06-30', 'category_ndbg_szsh', ''),
              ('2026-07-01~2026-09-14', 'category_bndbg_szsh', ''),
              ('2026-03-01~2026-05-31', 'category_yjdbg_szsh', ''),
          ]
          for se_date, category, searchkey in windows:
              result = query_cninfo(se_date, category, searchkey)
              if not result:
                  result = query_cninfo(se_date, '', SHORT)
              for row in result:
                  key = str(row.get('announcementId') or row.get('adjunctUrl') or row.get('announcementTitle'))
                  rows_map[key] = row

          rows = list(rows_map.values())
          print('UNIQUE ROWS', len(rows), flush=True)
          for row in sorted(rows, key=ann_time):
              title = clean_title(row.get('announcementTitle'))
              if any(x in title for x in ('年度报告', '半年度报告', '季度报告')):
                  print('CANDIDATE', json.dumps({
                      'title': title,
                      'time': row.get('announcementTime'),
                      'url': row.get('adjunctUrl'),
                      'id': row.get('announcementId'),
                      'size': row.get('adjunctSize'),
                  }, ensure_ascii=False), flush=True)

          def forbidden(title):
              return any(x in title for x in (
                  '摘要', '英文版', '英文', '审计报告', '社会责任', '可持续发展',
                  '环境、社会及管治', 'ESG', '更正公告', '提示性公告', '取消', '关于',
              ))

          def choose_report(year, kind):
              candidates = []
              for row in rows:
                  title = clean_title(row.get('announcementTitle'))
                  if forbidden(title):
                      continue
                  if kind == 'annual':
                      ok = f'{year}年年度报告' in title and '半年度' not in title
                  elif kind == 'semi':
                      ok = f'{year}年半年度报告' in title
                  elif kind == 'q1':
                      ok = (f'{year}年第一季度报告' in title or f'{year}年一季度报告' in title)
                  else:
                      ok = False
                  if ok:
                      candidates.append(row)
              if not candidates:
                  return None
              def score(row):
                  title = clean_title(row.get('announcementTitle'))
                  exact = 4 if title in (
                      f'{year}年年度报告', f'{year}年半年度报告',
                      f'{year}年第一季度报告', f'{year}年一季度报告',
                  ) else 0
                  revised = 2 if any(x in title for x in ('更正后', '修订版', '更新后', '变更后')) else 0
                  try:
                      size = int(row.get('adjunctSize') or 0)
                  except Exception:
                      size = 0
                  return (exact + revised, size, ann_time(row))
              return sorted(candidates, key=score, reverse=True)[0]

          annuals = {year: choose_report(year, 'annual') for year in range(2020, 2026)}
          missing = [year for year, row in annuals.items() if row is None]
          if missing:
              raise RuntimeError(f'Missing annual reports: {missing}')
          semi = choose_report(2026, 'semi')
          q1 = choose_report(2026, 'q1')
          if semi is None:
              raise RuntimeError('2026 semi-annual report not found')
          if q1 is None:
              raise RuntimeError('2026 first-quarter report not found')

          selected = []
          seq = 1
          for year in range(2020, 2026):
              selected.append({
                  'year': year,
                  'kind': '年度报告',
                  'filename': f'{seq:02d}_民生银行_{year}年年度报告.pdf',
                  'row': annuals[year],
                  'min_pages': 150,
              })
              seq += 1
          selected.append({
              'year': 2026,
              'kind': '半年度报告（最新完整定期报告）',
              'filename': f'{seq:02d}_民生银行_2026年半年度报告_最新完整定期报告.pdf',
              'row': semi,
              'min_pages': 80,
          })
          seq += 1
          selected.append({
              'year': 2026,
              'kind': '第一季度报告（最新严格季度报告）',
              'filename': f'{seq:02d}_民生银行_2026年第一季度报告_最新严格季度报告.pdf',
              'row': q1,
              'min_pages': 5,
          })

          def source_url(row):
              value = str(row.get('adjunctUrl') or '').strip()
              if not value:
                  raise RuntimeError('Missing adjunctUrl')
              if value.startswith('http://') or value.startswith('https://'):
                  return value
              return urljoin('https://static.cninfo.com.cn/', value.lstrip('/'))

          def download(url, path):
              errors = []
              candidates = [url]
              if url.startswith('https://'):
                  candidates.append(url.replace('https://', 'http://', 1))
              for candidate in candidates:
                  for attempt in range(1, 4):
                      try:
                          r = session.get(candidate, headers=pdf_headers, timeout=(30, 1200), allow_redirects=True)
                          print('GET PDF', candidate, r.status_code, r.headers.get('content-type'), len(r.content), flush=True)
                          if r.status_code == 200 and r.content.startswith(b'%PDF-') and len(r.content) > 30000:
                              path.write_bytes(r.content)
                              return r.url
                          errors.append(f'{candidate}: {r.status_code}/{len(r.content)}')
                      except Exception as exc:
                          errors.append(f'{candidate}: {type(exc).__name__}: {exc}')
                      time.sleep(attempt)
              raise RuntimeError('PDF download failed: ' + ' | '.join(errors[-10:]))

          def extract_probe(path, page_count):
              reader = PdfReader(str(path))
              indices = list(range(min(50, page_count))) + list(range(max(0, page_count - 4), page_count))
              text = []
              for idx in sorted(set(indices)):
                  try:
                      text.append(reader.pages[idx].extract_text() or '')
                  except Exception as exc:
                      print('TEXT WARNING', path.name, idx + 1, repr(exc), flush=True)
              joined = '\n'.join(text)
              if len(compact(joined)) < 500:
                  txt = path.with_suffix('.txt')
                  run = subprocess.run(
                      ['pdftotext', '-f', '1', '-l', str(min(60, page_count)), str(path), str(txt)],
                      capture_output=True, text=True,
                  )
                  if run.returncode == 0 and txt.exists():
                      joined += '\n' + txt.read_text(encoding='utf-8', errors='ignore')
              return joined

          def validate(path, item):
              with path.open('rb') as f:
                  if f.read(5) != b'%PDF-':
                      raise RuntimeError('PDF signature missing')
              reader = PdfReader(str(path))
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Page count too small: {pages} < {item["min_pages"]}')
              norm = compact(extract_probe(path, pages))
              identities = (COMPANY, SHORT, 'CHINAMINSHENGBANKINGCORP', 'CHINAMINSHENGBANK')
              if not any(compact(x) in norm for x in identities):
                  raise RuntimeError('Company identity missing')
              if str(item['year']) not in norm:
                  raise RuntimeError(f'Year marker missing: {item["year"]}')
              if item['kind'] == '年度报告':
                  markers = ('年度报告', 'ANNUALREPORT')
              elif '半年度报告' in item['kind']:
                  markers = ('半年度报告', 'INTERIMREPORT', 'SEMIANNUALREPORT')
              else:
                  markers = ('第一季度报告', '一季度报告', 'FIRSTQUARTERREPORT')
              if not any(compact(x) in norm for x in markers):
                  raise RuntimeError(f'Report type marker missing: {item["kind"]}')
              check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError('qpdf failed: ' + check.stderr[-800:])
              for label, page_no in (('first', 1), ('last', pages)):
                  prefix = PREVIEW / f'{path.stem}_{label}'
                  render = subprocess.run(
                      ['pdftoppm', '-f', str(page_no), '-singlefile', '-png', '-r', '72', str(path), str(prefix)],
                      capture_output=True, text=True,
                  )
                  image = Path(str(prefix) + '.png')
                  if render.returncode != 0 or not image.exists() or image.stat().st_size < 1000:
                      raise RuntimeError(f'{label} page render failed: {render.stderr[-500:]}')
              return {
                  'pages': pages,
                  'bytes': path.stat().st_size,
                  'sha256': sha256(path),
              }

          records = []
          for item in selected:
              row = item['row']
              destination = OUT / item['filename']
              requested = source_url(row)
              final = download(requested, destination)
              meta = validate(destination, item)
              record = {
                  'sequence': len(records) + 1,
                  'filename': item['filename'],
                  'year': item['year'],
                  'report_type': item['kind'],
                  'announcement_title': clean_title(row.get('announcementTitle')),
                  'announcement_time': row.get('announcementTime'),
                  'announcement_id': row.get('announcementId'),
                  'source_url': final,
                  **meta,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 8:
              raise RuntimeError(f'Expected 8 PDFs, got {len(records)}')
          if len({r['sha256'] for r in records}) != len(records):
              raise RuntimeError('Duplicate PDF content detected')

          with (OUT / '来源与校验清单.csv').open('w', encoding='utf-8-sig', newline='') as f:
              fields = ['序号', '文件名', '报告期', '报告类型', '公告标题', '公告时间戳', '页数', '文件大小_字节', 'SHA256', '官方来源地址', '公告ID']
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for r in records:
                  writer.writerow({
                      '序号': r['sequence'],
                      '文件名': r['filename'],
                      '报告期': r['year'],
                      '报告类型': r['report_type'],
                      '公告标题': r['announcement_title'],
                      '公告时间戳': r['announcement_time'],
                      '页数': r['pages'],
                      '文件大小_字节': r['bytes'],
                      'SHA256': r['sha256'],
                      '官方来源地址': r['source_url'],
                      '公告ID': r['announcement_id'],
                  })

          manifest = {
              'company': COMPANY,
              'short_name': SHORT,
              'stock_code': '600016.SH',
              'cninfo_org_id': ORG_ID,
              'as_of_date': AS_OF,
              'annual_report_years': list(range(2020, 2026)),
              'latest_complete_periodic_report': '2026年半年度报告',
              'latest_strict_quarterly_report': '2026年第一季度报告',
              'files': records,
          }
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{r['sha256']}  {r['filename']}" for r in records) + '\n',
              encoding='utf-8',
          )

          lines = [
              f'{COMPANY}（{SHORT}，600016.SH）',
              '2020-2025年年度报告及最新定期财务报告',
              f'资料核对日期：{AS_OF}',
              '',
              '一、收录内容',
              '1. 2020年至2025年完整年度报告，共6份。',
              '2. 2026年半年度报告，作为截至核对日最新完整定期财务报告。',
              '3. 2026年第一季度报告，作为截至核对日最新严格季度报告。',
              '',
              '二、口径说明',
              '截至2026年9月14日，2026年第三季度报告尚未发布；因此严格“季报”口径下最新文件为2026年第一季度报告。',
              '为保留更新的财务信息，本包同时收录2026年半年度报告。',
              '未收录年度报告摘要、英文版、ESG/社会责任报告或单独审计附件。',
              '',
              '三、校验',
              '逐份检查PDF文件头、公司名称、报告年度、报告类型、页数、qpdf结构、首尾页渲染及SHA-256。',
              '',
              '四、文件明细',
          ]
          for r in records:
              lines.append(f"{r['sequence']:02d}. {r['filename']}｜{r['pages']}页｜{r['bytes']}字节｜SHA-256 {r['sha256']}")
          (OUT / 'README_CN.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          with zipfile.ZipFile(FINAL_ZIP, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in sorted(OUT.rglob('*')):
                  if path.is_file():
                      zf.write(path, path.as_posix())

          print('FINAL_ZIP', FINAL_ZIP.name, FINAL_ZIP.stat().st_size, sha256(FINAL_ZIP), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: minsheng-bank-reports-20260914
          path: 民生银行_2020-2025年报及最新定期报告_截至2026-09-14.zip
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
