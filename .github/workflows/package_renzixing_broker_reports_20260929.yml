name: Package Renzixing broker reports

on:
  push:
    paths:
      - '.github/workflows/package_renzixing_broker_reports_20260929.yml'
      - 'tools/package_renzixing_broker_reports_20260929.py'
      - 'tools/patch_renzixing_preview_validation_20260929.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf
      - name: Patch preview validation
        run: python tools/patch_renzixing_preview_validation_20260929.py
      - name: Build and validate package
        run: python tools/package_renzixing_broker_reports_20260929.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: renzixing-300311-broker-reports-2
          path: |
            任子行_300311_券商研究报告_2份.zip
            renzixing_broker_reports_result.json
            _previews_renzixing_broker_reports/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
