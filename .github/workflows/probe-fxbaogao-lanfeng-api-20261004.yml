name: Probe Fxbaogao Lanfeng API 20261004

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_fxbaogao_lanfeng_api_20261004.py'
      - '.github/workflows/probe-fxbaogao-lanfeng-api-20261004.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: python -m pip install --quiet requests
      - name: Probe report endpoints
        run: python scripts/probe_fxbaogao_lanfeng_api_20261004.py
      - name: Upload API responses
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-lanfeng-api-20261004
          path: out/fxbaogao_lanfeng_api
          if-no-files-found: error
          retention-days: 7
