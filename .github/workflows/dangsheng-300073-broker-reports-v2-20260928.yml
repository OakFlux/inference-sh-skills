name: Build Dangsheng Technology 300073 broker reports package v2 20260928

on:
  push:
    paths:
      - '.github/workflows/dangsheng-300073-broker-reports-v2-20260928.yml'
      - 'scripts/run_dangsheng_300073_broker_reports_v2_20260928.py'
      - 'scripts/build_dangsheng_300073_broker_reports_20260928.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package broker reports
        run: python scripts/run_dangsheng_300073_broker_reports_v2_20260928.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dangsheng-300073-broker-reports-v2-20260928
          path: 当升科技_300073_券商深度报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
