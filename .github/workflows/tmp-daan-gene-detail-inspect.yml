name: Temporary Daan Gene report detail inspector

on:
  push:
    branches:
      - tmp/download-daan-gene-reports-20260829
    paths:
      - .github/workflows/tmp-daan-gene-detail-inspect.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch report detail pages and inspect metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/pages diagnostic/assets
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          ids=(
            508957738559
            491555679136
            494494626475
            616814232209
            648229670402
            684425869377
            657799781946
          )
          for id in "${ids[@]}"; do
            url="https://www.9fzt.com/detail/sz_002030_10_${id}.html"
            curl -L --compressed --retry 5 --retry-all-errors --connect-timeout 30 --max-time 180 \
              -A "$UA" -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.8' \
              -D "diagnostic/pages/${id}.headers" "$url" -o "diagnostic/pages/${id}.html" || true
          done

          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import html as htmllib, json, re, urllib.request

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          summaries=[]; assets=[]; urls=[]; contexts=[]
          for p in sorted(Path('diagnostic/pages').glob('*.html')):
              text=p.read_text(errors='replace')
              id=p.stem
              title_match=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
              title=htmllib.unescape(re.sub('<[^>]+>',' ',title_match.group(1))).strip() if title_match else ''
              next_obj=None
              m=re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',text,re.I|re.S)
              if m:
                  try: next_obj=json.loads(htmllib.unescape(m.group(1)))
                  except Exception: pass
              summaries.append({'id':id,'size':p.stat().st_size,'title':title,'next_data':next_obj})
              base=f'https://www.9fzt.com/detail/sz_002030_10_{id}.html'
              for mm in re.finditer(r'(?:href|src)=["\']([^"\']+)["\']',text,re.I):
                  u=htmllib.unescape(mm.group(1))
                  full=urljoin(base,u)
                  if full.startswith('http'):
                      urls.append({'id':id,'url':full})
                      if '.js' in full: assets.append(full)
              for needle in ['pdf','PDF','download','下载','attachment','fileUrl','sourceUrl','原文','研报','reportId','report']:
                  start=0
                  while True:
                      pos=text.find(needle,start)
                      if pos<0: break
                      contexts.append({'id':id,'needle':needle,'context':text[max(0,pos-1000):pos+2500]})
                      start=pos+len(needle)
                      if len(contexts)>3000: break
                  if len(contexts)>3000: break

          assets=list(dict.fromkeys(assets))[:200]
          for i,u in enumerate(assets):
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':UA,'Referer':'https://www.9fzt.com/'})
                  raw=urllib.request.urlopen(req,timeout=60).read()
                  if len(raw)>5_000_000: raw=raw[:5_000_000]
                  Path(f'diagnostic/assets/{i:03d}.txt').write_bytes(raw)
                  Path(f'diagnostic/assets/{i:03d}.url').write_text(u,encoding='utf-8')
              except Exception as exc:
                  Path(f'diagnostic/assets/{i:03d}.error').write_text(repr(exc),encoding='utf-8')

          asset_hits=[]
          patterns=[
              r'https?://[^"\'<>\s]+',
              r'/api/[^"\'<>\s]+',
              r'[A-Za-z0-9_./?&=%-]*(?:pdf|download|attachment|report/detail|research)[A-Za-z0-9_./?&=%-]*',
          ]
          for p in Path('diagnostic/assets').glob('*.txt'):
              text=p.read_text(errors='replace')
              for pat in patterns:
                  for m in re.finditer(pat,text,re.I):
                      hit=m.group(0)
                      if any(k in hit.lower() for k in ['pdf','download','attachment','report','research']):
                          asset_hits.append({'file':p.name,'hit':hit[:1500]})
              for needle in ['508957738559','reportId','sourceUrl','fileUrl','pdfUrl','downloadUrl','article.html']:
                  start=0
                  while True:
                      pos=text.find(needle,start)
                      if pos<0: break
                      asset_hits.append({'file':p.name,'needle':needle,'context':text[max(0,pos-1500):pos+3500]})
                      start=pos+len(needle)
                      if len(asset_hits)>5000: break
                  if len(asset_hits)>5000: break

          Path('diagnostic/summaries.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('diagnostic/urls.json').write_text(json.dumps(urls,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('diagnostic/contexts.json').write_text(json.dumps(contexts[:3000],ensure_ascii=False,indent=2),encoding='utf-8')
          Path('diagnostic/assets.json').write_text(json.dumps(assets,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('diagnostic/asset_hits.json').write_text(json.dumps(asset_hits[:5000],ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARIES')
          print(json.dumps(summaries,ensure_ascii=False,indent=2)[:80000])
          print('URLS',len(urls),'ASSETS',len(assets),'CONTEXTS',len(contexts),'ASSET_HITS',len(asset_hits))
          print(json.dumps(asset_hits[:200],ensure_ascii=False,indent=2)[:80000])
          PY

      - name: Upload detail diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: daan-gene-detail-diagnostic
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
