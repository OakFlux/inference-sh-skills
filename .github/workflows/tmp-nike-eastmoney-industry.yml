name: Temporary Nike Eastmoney industry report recovery

on:
  push:
    branches:
      - tmp/download-nike-reports-20260830
    paths:
      - .github/workflows/tmp-nike-eastmoney-industry.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Query industry report catalog and download originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output diagnostics previews
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import hashlib,json,os,re,subprocess,tempfile,urllib.parse

          API='https://reportapi.eastmoney.com/report/list'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          DATES=['2025-09-19','2025-12-18','2025-12-19','2025-07-03','2025-07-04','2025-03-24','2025-06-30','2025-10-08','2023-12-28']
          TERMS=['nike','耐克','全球体育用品品牌','望远镜系列','专业功能品牌','单季营收正增长','fy2025q4','fy2025q3','fy2026q1']
          out=Path('output');diag=Path('diagnostics');pre=Path('previews')

          def fetch(day,page,qtype):
              params={'pageNo':str(page),'pageSize':'100','code':'*','industryCode':'*','industry':'*',
                      'rating':'*','ratingChange':'*','beginTime':day,'endTime':day,'fields':'',
                      'qType':str(qtype),'orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              url=API+'?'+urllib.parse.urlencode(params)
              fd,name=tempfile.mkstemp(prefix='nikeind_',suffix='.json');os.close(fd);p=Path(name)
              try:
                  cmd=['curl','--http1.1','-L','--fail','--silent','--show-error','--retry','6','--retry-all-errors',
                       '--connect-timeout','20','--max-time','180','-A',UA,'-e','https://data.eastmoney.com/report/',
                       '-H','Accept-Encoding: identity',url,'-o',str(p)]
                  r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  if r.returncode: raise RuntimeError(r.stderr[-600:])
                  s=p.read_text(encoding='utf-8',errors='ignore').strip()
                  if s.startswith('datatable(') and s.endswith(')'):s=s[len('datatable('):-1]
                  elif s and s[0] not in '[{' and '(' in s and s.endswith(')'):s=s[s.find('(')+1:s.rfind(')')]
                  return json.loads(s),url
              finally:p.unlink(missing_ok=True)

          matches=[];seen=set()
          for day in DATES:
              for qtype in [1,2,3,0]:
                  try:obj,url=fetch(day,1,qtype)
                  except Exception as e:print('ERR',day,qtype,repr(e));continue
                  data=obj.get('data') or []
                  pages=int(obj.get('TotalPage') or obj.get('totalPage') or 1)
                  print('FIRST',day,'QTYPE',qtype,'HITS',obj.get('hits'),'ROWS',len(data),'PAGES',pages)
                  for page in range(1,pages+1):
                      if page>1:
                          try:obj,url=fetch(day,page,qtype);data=obj.get('data') or []
                          except Exception as e:print('PAGE_ERR',day,qtype,page,repr(e));continue
                      for r in data:
                          hay=(str(r.get('title') or '')+' '+json.dumps(r,ensure_ascii=False)).lower()
                          if any(t in hay for t in TERMS):
                              key=str(r.get('infoCode') or json.dumps(r,ensure_ascii=False,sort_keys=True))
                              if key in seen:continue
                              seen.add(key);rr=dict(r);rr['_day']=day;rr['_qtype']=qtype;matches.append(rr)
                              print('MATCH',json.dumps({k:rr.get(k) for k in ['publishDate','orgSName','title','infoCode','attachPages','reportType','industryName']},ensure_ascii=False))
          diag.joinpath('matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')

          recovered=[]
          for i,r in enumerate(matches,1):
              info=str(r.get('infoCode') or '')
              if not info:continue
              urls=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/{info}.pdf']
              for url in urls:
                  tmp=out/f'tmp_{i:02d}.pdf'
                  cmd=['curl','--http1.1','-L','--fail','--silent','--show-error','--retry','6','--retry-all-errors',
                       '--connect-timeout','25','--max-time','600','--compressed','-A',UA,'-e','https://data.eastmoney.com/report/',
                       '-H','Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',url,'-o',str(tmp)]
                  p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  print('TRY',info,'RC',p.returncode,'SIZE',tmp.stat().st_size if tmp.exists() else 0,'URL',url,'ERR',p.stderr[-200:])
                  if p.returncode==0 and tmp.exists() and tmp.stat().st_size>25000 and tmp.read_bytes()[:4]==b'%PDF':
                      inf=subprocess.check_output(['pdfinfo',str(tmp)],text=True,errors='replace')
                      m=re.search(r'^Pages:\s*(\d+)',inf,re.M);pages=int(m.group(1)) if m else 0
                      txt=diag/f'{info}.txt';subprocess.run(['pdftotext','-f','1','-l',str(min(5,pages)),str(tmp),str(txt)],check=False)
                      text=txt.read_text(errors='replace') if txt.exists() else '';compact=''.join(text.split()).lower()
                      if not any(t.replace(' ','') in compact for t in ['nike','耐克']):
                          print('MISMATCH',info,pages,text[:500]);tmp.unlink(missing_ok=True);continue
                      broker=re.sub(r'[^A-Za-z0-9_-]+','_',str(r.get('orgSName') or 'Broker'))
                      date=str(r.get('publishDate') or r.get('_day') or '')[:10].replace('-','')
                      final=out/f'{i:02d}_Nike_{broker}_{date}_{pages}p.pdf';tmp.replace(final)
                      subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','90',str(final),str(pre/f'{i:02d}_first')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      subprocess.run(['pdftoppm','-f',str(pages),'-singlefile','-png','-r','90',str(final),str(pre/f'{i:02d}_last')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      rec=dict(r);rec.update({'pages_actual':pages,'filename':final.name,'source_url':url,'size_bytes':final.stat().st_size,'sha256':hashlib.sha256(final.read_bytes()).hexdigest()})
                      recovered.append(rec);print('RECOVERED',json.dumps({k:rec.get(k) for k in ['publishDate','orgSName','title','infoCode','pages_actual','filename']},ensure_ascii=False));break
                  tmp.unlink(missing_ok=True)
          diag.joinpath('recovered.json').write_text(json.dumps(recovered,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RECOVERED_COUNT',len(recovered))
          PY
          find output diagnostics previews -type f -printf '%p\t%s\n' | sort | tail -100

      - name: Upload recovered reports
        uses: actions/upload-artifact@v4
        with:
          name: nike-eastmoney-industry-reports
          path: |
            output/
            diagnostics/
            previews/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
