name: Discover Sihuan broker reports

on:
  push:
    branches:
      - tmp/sihuan-pharma-reports-20260902

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python .github/scripts/discover_sihuan_reports.py
