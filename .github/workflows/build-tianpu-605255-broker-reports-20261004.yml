name: Build Tianpu 605255 broker reports 20261004

on:
  push:
    paths:
      - '.github/workflows/build-tianpu-605255-broker-reports-20261004.yml'
      - 'scripts/build_tianpu_605255_broker_reports_20261004.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        run: python scripts/build_tianpu_605255_broker_reports_20261004.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tianpu-605255-broker-reports
          path: 天普股份_605255_券商研究报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
