name: Package Wufang Optoelectronics broker research 20260929

on:
  push:
    paths:
      - '.github/workflows/wufang-optoelectronics-002962-broker-package-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          PACKAGE = '五方光电_002962_券商深度报告_2份'
          OUT = Path(PACKAGE)
          OUT.mkdir(exist_ok=True)
          VERIFY = Path('_verify')
          VERIFY.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_国金证券_摄像头创新不止_滤光片高景气持续_2019-09-25.pdf',
                  'title': '摄像头创新不止，滤光片高景气持续',
                  'institution': '国金证券',
                  'researcher': '樊志远',
                  'date': '2019-09-25',
                  'info_code': 'AP201909251367534136',
                  'report_type': '公司深度报告',
                  'min_pages': 20,
                  'identity_terms': ['五方光电', '滤光片'],
              },
              {
                  'filename': '02_东吴证券_光学行业景气度全面提升_含五方光电独立章节_2020-07-21.pdf',
                  'title': '技术创新+多领域需求扩展，光学行业景气度全面提升',
                  'institution': '东吴证券',
                  'researcher': '王平阳、王少南',
                  'date': '2020-07-21',
                  'info_code': 'AP202007211393135665',
                  'report_type': '电子行业深度报告（含五方光电独立章节）',
                  'min_pages': 40,
                  'identity_terms': ['五方光电', '光学行业'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=6,
              connect=6,
              read=6,
              status=6,
              backoff_factor=1.2,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=6, pool_maxsize=6))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept-Encoding': 'identity',
              'Referer': 'https://data.eastmoney.com/',
          })

          def download_pdf(doc: dict, dest: Path) -> str:
              errors: list[str] = []
              for prefix in ('H3', 'H2', 'H1'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{doc["info_code"]}_1.pdf'
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                                  'Accept-Encoding': 'identity',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 600),
                          ) as response:
                              print('DOWNLOAD', dest.name, prefix, attempt, response.status_code, response.headers.get('Content-Length'), flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as handle:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          data = tmp.read_bytes()
                          if len(data) < 200_000 or not data.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF bytes={len(data)}, header={data[:12]!r}')
                          tmp.replace(dest)
                          return url
                      except Exception as exc:
                          tmp.unlink(missing_ok=True)
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt)
              raise RuntimeError(f'{dest.name} download failed: {errors}')

          records: list[dict] = []
          seen_hashes: set[str] = set()

          for index, doc in enumerate(docs, start=1):
              dest = OUT / doc['filename']
              source_url = download_pdf(doc, dest)

              structure = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if structure.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {structure.stderr[-2000:]}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'{dest.name}: page count {pages} < {doc["min_pages"]}')

              text_path = VERIFY / f'{index:02d}.txt'
              extraction = subprocess.run(
                  ['pdftotext', str(dest), str(text_path)],
                  capture_output=True,
                  text=True,
              )
              text = text_path.read_text(encoding='utf-8', errors='ignore') if text_path.exists() else ''
              compact = re.sub(r'\s+', '', text)
              missing = [term for term in doc['identity_terms'] if term not in compact]
              if missing:
                  raise RuntimeError(f'{dest.name}: identity text missing {missing}; pdftotext={extraction.returncode}')

              if index == 2 and not re.search(r'五方光电.{0,80}(专业光学镀膜|002962)', compact):
                  raise RuntimeError(f'{dest.name}: dedicated Wufang Optoelectronics section not confirmed')

              render_prefix = VERIFY / f'{index:02d}_page1'
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '90', str(dest), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              png = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not png.exists() or png.stat().st_size < 10_000:
                  raise RuntimeError(f'{dest.name}: first-page render failed: {render.stderr[-1000:]}')

              data = dest.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in seen_hashes:
                  raise RuntimeError(f'duplicate PDF: {dest.name}')
              seen_hashes.add(sha256)

              record = {
                  'filename': dest.name,
                  'title': doc['title'],
                  'institution': doc['institution'],
                  'researcher': doc['researcher'],
                  'publish_date': doc['date'],
                  'report_type': doc['report_type'],
                  'info_code': doc['info_code'],
                  'pages': pages,
                  'bytes': len(data),
                  'pdf_url': source_url,
                  'sha256': sha256,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '五方光电（002962.SZ）券商深度研究报告精选（2份）',
              '整理与核验日期：2026-09-29',
              '',
              '收录口径：',
              '1. 国金证券21页公司深度报告，直接覆盖五方光电。',
              '2. 东吴证券43页光学行业深度报告，内含五方光电独立章节。',
              '3. 未采用3页新股询价简报或短篇业绩点评凑数。',
              '',
              '核验：PDF文件头、文件大小、页数、公司名称与章节文本、qpdf结构、首页渲染、SHA-256及ZIP CRC。',
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          for number, record in enumerate(records, start=1):
              readme.extend([
                  f'{number}. {record["title"]}',
                  f'   类型：{record["report_type"]}',
                  f'   机构：{record["institution"]}；研究员：{record["researcher"]}；发布日期：{record["publish_date"]}',
                  f'   文件：{record["filename"]}；页数：{record["pages"]}；大小：{record["bytes"] / 1048576:.2f} MB',
                  f'   PDF来源：{record["pdf_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'ZIP PDF count {len(pdfs)} != 2')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wufang-optoelectronics-002962-broker-research-20260929
          path: 五方光电_002962_券商深度报告_2份.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
