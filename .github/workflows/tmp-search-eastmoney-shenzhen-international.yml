name: Search Shenzhen International report index

on:
  push:
    branches:
      - tmp/shenzhen-international-browser-package-20260831

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python .github/scripts/search_eastmoney_shenzhen_international_dates.py
