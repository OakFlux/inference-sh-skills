name: Package Qijing Machinery broker reports 20261021

on:
  push:
    branches:
      - qijing-machinery-broker-reports-20261021
    paths:
      - scripts/package_qijing_machinery_broker_reports_20261021.py
      - .github/workflows/package-qijing-machinery-broker-reports-20261021.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf

      - name: Download validate and package reports
        run: python scripts/package_qijing_machinery_broker_reports_20261021.py

      - name: Show package summary
        run: cat dist/package_summary.json

      - name: Verify packaged PDF count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('dist/package_summary.json').read_text(encoding='utf-8'))
          assert summary['pdf_count'] == 2, summary
          print(summary)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: qijing-machinery-603677-broker-reports-20261021
          path: |
            dist/*.zip
            dist/package_summary.json
          if-no-files-found: error
          retention-days: 30
