name: Query Eastmoney report index v2 for China Energy Engineering 20260927
on:
  push:
    paths:
      - '.github/workflows/ceec-eastmoney-full-report-index-v2-20260927.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch report index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/stock.jshtml?stockcode=601868',
            'Accept':'application/json,text/javascript,*/*;q=0.01',
          })
          url='https://reportapi.eastmoney.com/report/list'
          callback='datatable7539582'
          all_rows=[]
          for page in range(1,8):
            params={
              'cb':callback,
              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
              'beginTime':'2017-01-01','endTime':'2026-09-27','pageNo':str(page),'fields':'',
              'qType':'0','orgCode':'','code':'601868','rcode':'','p':str(page),
              'pageNum':str(page),'pageNumber':str(page),'_':str(int(time.time()*1000)),
            }
            r=s.get(url,params=params,timeout=(10,60))
            print('PAGE',page,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'BYTES',len(r.content),'URL',r.url,flush=True)
            print(r.text[:300],flush=True)
            r.raise_for_status()
            text=r.text.strip()
            prefix=callback+'('
            if text.startswith(prefix) and text.endswith(')'):
              text=text[len(prefix):-1]
            j=json.loads(text)
            rows=j.get('data') or []
            print('HITS',j.get('hits'),'TOTALPAGE',j.get('TotalPage'),'ROWS',len(rows),flush=True)
            for row in rows:
              print('REPORT',json.dumps({k:row.get(k) for k in ('infoCode','publishDate','title','orgSName','researcher','attachPages','stockCode','stockName','emRatingName')},ensure_ascii=False),flush=True)
            all_rows.extend(rows)
            if not rows or page >= int(j.get('TotalPage') or 1): break
            time.sleep(.4)
          Path('ceec_eastmoney_full_index.json').write_text(json.dumps(all_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ceec-eastmoney-full-report-index-v2
          path: ceec_eastmoney_full_index.json
          retention-days: 7
