name: Trigger China Resources Power report packaging

on:
  push:
    branches:
      - tmp/cr-power-reports-20260904
    paths:
      - '.github/workflows/tmp-trigger-cr-power.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch packaging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tmp-package-cr-power-reports.yml/dispatches" \
            -d '{"ref":"tmp/cr-power-reports-20260904"}'
