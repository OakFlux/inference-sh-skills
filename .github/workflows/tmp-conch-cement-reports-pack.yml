name: Temporary Conch Cement reports package

on:
  push:
    branches:
      - tmp-conch-cement-reports-20260829

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/package_conch.py <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          STOCK = "600585"
          COMPANY_CN = "海螺水泥"
          COMPANY_EN = "ANHUI CONCH"
          ANNUAL_INDEX = "https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/600585/page_type/ndbg.phtml"
          HALF_ID = 12547712
          HALF_FALLBACK_DATE = "2026-08-26"

          ANNUAL_FALLBACK_DATES = {
              2020: "2021-03-26",
              2021: "2022-03-26",
              2022: "2023-03-28",
              2023: "2024-03-20",
              2024: "2025-03-25",
              2025: "2026-03-25",
          }

          OUT = Path("dist")
          DOCS = OUT / "海螺水泥_600585_2020-2025年报_2026年最新半年报"
          DOCS.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Accept-Encoding": "gzip, deflate",
          })

          def decode_html(raw: bytes) -> str:
              for encoding in ("utf-8", "gb18030", "gbk"):
                  try:
                      return raw.decode(encoding)
                  except UnicodeDecodeError:
                      pass
              return raw.decode("utf-8", errors="replace")

          def request_bytes(url: str, *, referer: str | None = None, attempts: int = 5) -> tuple[bytes, str]:
              errors: list[str] = []
              for attempt in range(attempts):
                  try:
                      headers = {}
                      if referer:
                          headers["Referer"] = referer
                      response = session.get(url, headers=headers, timeout=(30, 300), allow_redirects=True)
                      print("GET", response.status_code, len(response.content), response.url)
                      response.raise_for_status()
                      return response.content, response.url
                  except Exception as exc:
                      errors.append(repr(exc))
                      if attempt < attempts - 1:
                          time.sleep(min(2 ** attempt, 12))
              raise RuntimeError(f"Unable to fetch {url}: {errors}")

          index_raw, index_final_url = request_bytes(ANNUAL_INDEX)
          index_soup = BeautifulSoup(decode_html(index_raw), "html.parser")

          annual_candidates: dict[int, list[tuple[tuple[int, int], int, str]]] = {}
          for anchor in index_soup.find_all("a", href=True):
              title = " ".join(anchor.get_text(" ", strip=True).split())
              href = html.unescape(unquote(str(anchor["href"]))).strip()
              if "年度报告" not in title or any(token in title for token in ("摘要", "审计", "環境", "环境", "ESG", "社会责任", "股东大会")):
                  continue
              year_match = re.search(r"(20\d{2})", title)
              id_match = re.search(r"[?&]id=(\d+)", href)
              if not year_match or not id_match:
                  continue
              year = int(year_match.group(1))
              if year not in range(2020, 2026):
                  continue
              identifier = int(id_match.group(1))
              revision_score = int(any(token in title for token in ("修订", "修正", "更正", "更新")))
              annual_candidates.setdefault(year, []).append(((revision_score, identifier), identifier, title))

          annual_items: list[tuple[str, int, str, str, int, int]] = []
          for year in range(2020, 2026):
              candidates = annual_candidates.get(year, [])
              if not candidates:
                  raise RuntimeError(f"No complete annual report link found for {year}; index={index_final_url}")
              candidates.sort(key=lambda item: item[0], reverse=True)
              _, identifier, title = candidates[0]
              print("SELECT ANNUAL", year, identifier, title)
              annual_items.append((
                  f"海螺水泥_600585_{year}年年度报告.pdf",
                  identifier,
                  ANNUAL_FALLBACK_DATES[year],
                  title,
                  100,
                  year,
              ))

          items = annual_items + [(
              "海螺水泥_600585_2026年半年度报告.pdf",
              HALF_ID,
              HALF_FALLBACK_DATE,
              "2026年半年度报告",
              50,
              2026,
          )]

          def detail_url(identifier: int) -> str:
              return f"https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={identifier}&stockid={STOCK}"

          def derived_pdf_url(identifier: int, date_text: str) -> str:
              year, month, _ = date_text.split("-")
              month = str(int(month))
              return (
                  "https://file.finance.sina.com.cn/211.154.219.97:9494/"
                  f"MRGG/CNSESH_STOCK/{year}/{year}-{month}/{date_text}/{identifier}.PDF"
              )

          def discover_pdf_urls(identifier: int, fallback_date: str) -> tuple[list[str], str, str]:
              page = detail_url(identifier)
              raw, final_page_url = request_bytes(page)
              text = decode_html(raw)
              soup = BeautifulSoup(text, "html.parser")
              page_title = " ".join((soup.title.get_text(" ", strip=True) if soup.title else "").split())
              disclosed_date = fallback_date
              match = re.search(r"公告日期\s*[:：]\s*(20\d{2}-\d{2}-\d{2})", text)
              if match:
                  disclosed_date = match.group(1)

              urls: list[str] = []
              for anchor in soup.find_all("a", href=True):
                  label = " ".join(anchor.get_text(" ", strip=True).split())
                  href = html.unescape(unquote(str(anchor["href"]))).strip()
                  if "下载公告" not in label and "file.finance.sina.com.cn" not in href:
                      continue
                  if href.startswith("//"):
                      href = "https:" + href
                  elif href.startswith("/"):
                      href = urljoin(final_page_url, href)
                  if href.startswith("http://file.finance.sina.com.cn"):
                      href = "https://" + href[len("http://"):]
                  if href.startswith("http") and href not in urls:
                      urls.append(href)

              for date_value in (disclosed_date, fallback_date):
                  fallback = derived_pdf_url(identifier, date_value)
                  if fallback not in urls:
                      urls.append(fallback)

              print("DISCOVER", identifier, disclosed_date, page_title, urls)
              return urls, page_title, disclosed_date

          def validate_pdf(path: Path, minimum_pages: int, expected_year: int) -> tuple[int, int, str]:
              raw_head = path.read_bytes()[:16]
              size = path.stat().st_size
              if size < 100_000 or not raw_head.startswith(b"%PDF-"):
                  raise RuntimeError(f"Invalid PDF {path.name}: size={size}, head={raw_head!r}")

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < minimum_pages:
                  raise RuntimeError(f"Unexpectedly short PDF {path.name}: {pages} pages")

              parts: list[str] = []
              for page in reader.pages[:16]:
                  try:
                      parts.append(page.extract_text() or "")
                  except Exception:
                      pass
              sample = re.sub(r"\s+", "", "".join(parts)).upper()
              if COMPANY_CN not in sample and COMPANY_EN not in sample:
                  print("WARNING company name not extracted", path.name)
              if str(expected_year) not in sample:
                  print("WARNING expected year not extracted", expected_year, path.name)

              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return size, pages, digest.hexdigest()

          def download_one(filename: str, identifier: int, fallback_date: str, minimum_pages: int, expected_year: int) -> tuple[str, int, int, str, str, str]:
              destination = DOCS / filename
              urls, page_title, disclosed_date = discover_pdf_urls(identifier, fallback_date)
              errors: list[str] = []
              referer = detail_url(identifier)

              for url in urls:
                  variants = [url]
                  if url.startswith("https://"):
                      variants.append("http://" + url[len("https://"):])
                  for candidate in variants:
                      for attempt in range(4):
                          try:
                              with session.get(
                                  candidate,
                                  headers={"Referer": referer, "Accept": "application/pdf,application/octet-stream,*/*"},
                                  timeout=(30, 600),
                                  stream=True,
                                  allow_redirects=True,
                              ) as response:
                                  print("DOWNLOAD", identifier, response.status_code, response.url, response.headers.get("content-type"), response.headers.get("content-length"))
                                  response.raise_for_status()
                                  with destination.open("wb") as output:
                                      for chunk in response.iter_content(1024 * 1024):
                                          if chunk:
                                              output.write(chunk)
                                  final_url = response.url
                              size, pages, digest = validate_pdf(destination, minimum_pages, expected_year)
                              return final_url, size, pages, digest, page_title, disclosed_date
                          except Exception as exc:
                              destination.unlink(missing_ok=True)
                              errors.append(f"{candidate} attempt {attempt + 1}: {exc!r}")
                              if attempt < 3:
                                  time.sleep(min(2 ** attempt, 8))
              raise RuntimeError("; ".join(errors))

          manifest = [
              "安徽海螺水泥股份有限公司（600585.SH / 00914.HK）",
              "资料范围：2020—2025年年度报告全文及2026年半年度报告全文。",
              "版本规则：排除年度报告摘要、审计报告、ESG/环境报告等非目标文件。",
              "来源：新浪财经上市公司公告镜像；PDF内容为上市公司正式披露文件。",
              "",
          ]

          for filename, identifier, fallback_date, document_title, minimum_pages, expected_year in items:
              used_url, size, pages, digest, page_title, disclosed_date = download_one(
                  filename,
                  identifier,
                  fallback_date,
                  minimum_pages,
                  expected_year,
              )
              manifest.extend([
                  filename,
                  f"  文件类型：{document_title}",
                  f"  公告详情ID：{identifier}",
                  f"  披露日期：{disclosed_date}",
                  f"  公告页面标题：{page_title}",
                  f"  页数：{pages}",
                  f"  文件大小：{size} bytes",
                  f"  SHA-256：{digest}",
                  f"  PDF来源：{used_url}",
                  f"  公告详情页：{detail_url(identifier)}",
                  "",
              ])
              print("OK", filename, pages, size, used_url)

          (DOCS / "资料清单与来源.txt").write_text("\n".join(manifest), encoding="utf-8")

          final_zip = OUT / "海螺水泥_600585_2020-2025年报_2026年最新半年报.zip"
          with zipfile.ZipFile(final_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(DOCS.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(final_zip, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != 7:
                  raise RuntimeError(f"Expected 7 PDFs, got {pdfs}")

          print(f"FINAL_ZIP={final_zip}")
          print(f"ZIP_SIZE={final_zip.stat().st_size}")
          print("CONTENTS")
          for path in sorted(DOCS.iterdir()):
              if path.suffix.lower() == ".pdf":
                  reader = PdfReader(str(path), strict=False)
                  print(path.name, path.stat().st_size, len(reader.pages))
              else:
                  print(path.name, path.stat().st_size)
          PY
          python /tmp/package_conch.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: conch-cement-reports-final-zip
          path: dist/海螺水泥_600585_2020-2025年报_2026年最新半年报.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
