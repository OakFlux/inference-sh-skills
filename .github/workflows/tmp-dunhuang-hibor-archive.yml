name: Dunhuang Hibor archive scan
on:
  push:
    branches: ['tmp/dunhuang-hibor-archive-20260829']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan monthly archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          for month in 201008 201108 201109 201701; do
            curl --http1.1 -L --fail --silent --show-error --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 180 --user-agent "$UA" \
              --header 'Accept-Encoding: identity' \
              "https://p.hibor.com.cn/archiver/${month}.html" -o "out/${month}.html"
          done
          python - <<'PY'
          import html,json,re
          from pathlib import Path
          rows=[]
          for p in sorted(Path('out').glob('*.html')):
              raw=p.read_bytes()
              texts=[raw.decode(e,'ignore') for e in ('utf-8','gb18030','gbk')]
              text=max(texts,key=lambda s:s.count('敦煌种业'))
              for href,label in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  label=re.sub(r'<[^>]+>',' ',html.unescape(label))
                  label=re.sub(r'\s+',' ',label).strip()
                  if '敦煌种业' in label:
                      rows.append({'month':p.stem,'label':label,'href':html.unescape(href)})
          Path('out/matches.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCHES',len(rows))
          for row in rows: print(json.dumps(row,ensure_ascii=False))
          PY
      - name: Upload matches
        uses: actions/upload-artifact@v4
        with:
          name: dunhuang-hibor-archive-matches
          path: out/matches.json
          retention-days: 2
