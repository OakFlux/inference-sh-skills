name: Temporary Kede CNC report downloader

on:
  push:
    branches:
      - tmp/download-kede-reports-20260827
    paths:
      - .github/workflows/tmp-kede-download.yml

jobs:
  download-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Query, download and verify reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previews
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests

          OUT = Path('output')
          PREV = Path('previews')
          API = 'https://reportapi.eastmoney.com/report/list'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/plain,*/*',
          }
          params = {
              'industryCode': '*', 'pageSize': '100', 'industry': '*',
              'rating': '*', 'ratingChange': '*',
              'beginTime': '2020-01-01', 'endTime': '2030-01-01',
              'pageNo': '1', 'fields': '', 'qType': '0',
              'orgCode': '', 'code': '688305', 'rcode': '',
              'p': '1', 'pageNum': '1', 'pageNumber': '1',
          }
          resp = requests.get(API, params=params, headers=HEADERS, timeout=60)
          resp.raise_for_status()
          payload = resp.json()
          records = payload.get('data')
          if isinstance(records, dict):
              records = records.get('data') or records.get('list') or records.get('records')
          if not isinstance(records, list):
              result = payload.get('result', {}) if isinstance(payload, dict) else {}
              records = result.get('data') or result.get('list') or []
          if not isinstance(records, list):
              raise RuntimeError(f'Unexpected API payload keys: {list(payload)[:20]}')

          def get(rec, *names):
              for name in names:
                  value = rec.get(name)
                  if value not in (None, ''):
                      return value
              return ''

          catalog = []
          for rec in records:
              catalog.append({
                  'title': str(get(rec, 'title', 'reportTitle', 'name')),
                  'org': str(get(rec, 'orgName', 'orgSName', 'orgCode')),
                  'date': str(get(rec, 'publishDate', 'date', 'publishTime')),
                  'infoCode': str(get(rec, 'infoCode', 'info_code', 'infocode')),
                  'author': str(get(rec, 'researcher', 'author', 'researcherName')),
              })
          (OUT / '东方财富研报目录_科德数控.json').write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          targets = [
              {
                  'keyword': '高端五轴破壁前行',
                  'filename': '01_东海证券_科德数控_高端五轴破壁前行自主技术尽显锋芒_20240518.pdf',
                  'expected_org': '东海',
              },
              {
                  'keyword': '高端五轴领航人',
                  'filename': '02_海通证券_科德数控_高端五轴领航人加速应用拓展出海_20240929.pdf',
                  'expected_org': '海通',
              },
              {
                  'keyword': '五轴数控机床国产化急先锋',
                  'filename': '03_安信证券_科德数控_五轴数控机床国产化急先锋_20230912.pdf',
                  'expected_org': '',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': HEADERS['User-Agent'],
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })
          downloaded = []
          errors = []

          for target in targets:
              matches = [r for r in catalog if target['keyword'] in r['title']]
              if target['expected_org']:
                  org_matches = [r for r in matches if target['expected_org'] in r['org']]
                  if org_matches:
                      matches = org_matches
              if not matches:
                  errors.append(f"未找到：{target['keyword']}")
                  continue
              rec = matches[0]
              info_code = rec['infoCode']
              if not info_code:
                  errors.append(f"缺少infoCode：{rec['title']}")
                  continue
              url = f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf'
              dest = OUT / target['filename']
              try:
                  with session.get(url, stream=True, timeout=180) as r:
                      r.raise_for_status()
                      with dest.open('wb') as f:
                          for chunk in r.iter_content(chunk_size=1024 * 1024):
                              if chunk:
                                  f.write(chunk)
                  if dest.stat().st_size < 10000:
                      raise RuntimeError(f'文件过小：{dest.stat().st_size} bytes')
                  if dest.read_bytes()[:4] != b'%PDF':
                      raise RuntimeError('不是PDF文件')
                  info = subprocess.check_output(['pdfinfo', str(dest)], text=True, errors='replace')
                  page_match = re.search(r'^Pages:\s+(\d+)', info, flags=re.M)
                  pages = int(page_match.group(1)) if page_match else 0
                  if pages < 10:
                      raise RuntimeError(f'页数不足：{pages}')
                  stem = dest.stem
                  subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '90', str(dest), str(PREV / f'{stem}_first')], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  subprocess.run(['pdftoppm', '-f', str(pages), '-singlefile', '-png', '-r', '90', str(dest), str(PREV / f'{stem}_last')], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  sha256 = hashlib.sha256(dest.read_bytes()).hexdigest()
                  downloaded.append({**rec, 'url': url, 'file': dest.name, 'pages': pages, 'bytes': dest.stat().st_size, 'sha256': sha256})
              except Exception as exc:
                  errors.append(f"下载失败：{rec['title']}：{exc}")
                  dest.unlink(missing_ok=True)
              time.sleep(1.2)

          if len(downloaded) < 2:
              raise RuntimeError('少于2份可用深度报告。\n' + '\n'.join(errors))

          lines = ['科德数控（688305.SH）券商深度报告', '']
          for idx, item in enumerate(downloaded, 1):
              lines += [
                  f"{idx}. {item['org']}：《{item['title']}》",
                  f"   日期：{item['date'][:10]}；页数：{item['pages']}页；分析师：{item['author'] or '未标注'}。",
                  f"   文件：{item['file']}",
                  f"   来源：{item['url']}",
                  f"   SHA256：{item['sha256']}",
                  '',
              ]
          lines += [
              '核验说明：以上PDF均检查文件头、实际页数，并成功渲染首页与末页。',
              '仅供研究资料整理，不构成投资建议。',
          ]
          if errors:
              lines += ['', '未纳入候选：'] + [f'- {e}' for e in errors]
          (OUT / '报告清单与核验说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (OUT / '下载元数据.json').write_text(json.dumps(downloaded, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(downloaded, ensure_ascii=False, indent=2))
          print('\n'.join(errors))
          PY
          (cd output && sha256sum ./*.pdf > SHA256SUMS.txt)
          ls -lh output

      - name: Upload verified original PDFs
        uses: actions/upload-artifact@v4
        with:
          name: kede-cnc-broker-deep-reports
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
