name: Inspect Baogaobox Air China Cargo report
on:
  push:
    paths:
      - '.github/workflows/inspect_baogaobox_air_china_cargo_20260927.yml'
      - 'tools/inspect_baogaobox_air_china_cargo_20260927.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/inspect_baogaobox_air_china_cargo_20260927.py
      - uses: actions/upload-artifact@v4
        with:
          name: baogaobox-air-china-cargo-inventory
          path: baogaobox_air_china_cargo_inventory.json
          if-no-files-found: error
          retention-days: 3
