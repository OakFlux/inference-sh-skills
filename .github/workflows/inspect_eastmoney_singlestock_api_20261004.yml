name: Inspect Eastmoney single stock report API

on:
  push:
    paths:
      - '.github/workflows/inspect_eastmoney_singlestock_api_20261004.yml'
      - 'tools/inspect_eastmoney_singlestock_api_20261004.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python tools/inspect_eastmoney_singlestock_api_20261004.py
      - uses: actions/upload-artifact@v4
        with:
          name: eastmoney-singlestock-api-excerpts
          path: eastmoney_singlestock_api_excerpts.json
          if-no-files-found: error
          retention-days: 3
