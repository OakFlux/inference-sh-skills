name: Inspect Longban Sina prospectus

on:
  push:
    paths:
      - '.github/workflows/inspect_longban_sina_prospectus_20261004.yml'
      - 'tools/inspect_longban_sina_prospectus_20261004.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/inspect_longban_sina_prospectus_20261004.py
