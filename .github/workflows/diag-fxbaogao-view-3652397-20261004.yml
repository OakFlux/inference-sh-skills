name: Inspect public report viewer 3652397

on:
  push:
    paths:
      - '.github/workflows/diag-fxbaogao-view-3652397-20261004.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect viewer metadata and page images
        run: |
          python - <<'PY'
          import html, json, re, requests
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'}
          urls=['https://fxbaogao.com/detail/3652397','https://fxbaogao.com/view?id=3652397','https://m.fxbaogao.com/detail/3652397']
          for url in urls:
            print('\n===',url,'===',flush=True)
            r=s.get(url,headers=h,timeout=90,allow_redirects=True); r.encoding=r.apparent_encoding or r.encoding or 'utf-8'; text=r.text
            print('STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'),flush=True)
            pats=[r'3652397-\d+\.(?:png|jpg|jpeg)',r'report-image/[^"\'<> ]+',r'pageCount[^,}<]{0,80}',r'totalPage[^,}<]{0,80}',r'pages?[^,}<]{0,80}',r'docId[^,}<]{0,80}',r'/api/[^"\'<> ]+',r'/_next/data/[^"\'<> ]+']
            for pat in pats:
              vals=list(dict.fromkeys(re.findall(pat,text,re.I)))
              print('PATTERN',pat,'COUNT',len(vals),json.dumps(vals[:100],ensure_ascii=False),flush=True)
            scripts=[]
            for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I):
              scripts.append(urljoin(r.url,html.unescape(m.group(1))))
            print('SCRIPTS',json.dumps(scripts,ensure_ascii=False,indent=2),flush=True)
            for marker in ['__NEXT_DATA__','report-image','3652397-1.png','view?id=3652397','docId','pageCount','totalPage']:
              pos=text.find(marker)
              if pos>=0: print('AROUND',marker,re.sub(r'\s+',' ',text[max(0,pos-1200):pos+5000]),flush=True)
          # probe likely sequential public images
          for n in [1,2,3,4,5,10,15,20,25,30,35,40,45,50]:
            url=f'https://public.fxbaogao.com/report-image/2023/04/13/3652397-{n}.png'
            try:
              r=s.get(url,headers=h,timeout=45,allow_redirects=True,stream=True)
              head=next(r.iter_content(32),b'')
              print('IMAGE_PROBE',n,r.status_code,r.headers.get('content-type'),r.headers.get('content-length'),r.url,repr(head[:16]),flush=True)
              r.close()
            except Exception as e: print('IMAGE_ERROR',n,repr(e),flush=True)
          PY
