name: Probe Kerry Properties report API

on:
  push:
    branches:
      - chatgpt-kerry-properties-broker-reports-20260906
    paths:
      - '.github/workflows/probe-kerry-properties-reportapi-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_kerry_properties_reportapi_20260906.py
      - uses: actions/upload-artifact@v4
        with:
          name: kerry-properties-reportapi-probe-20260906
          path: |
            kerry-reportapi-results.json
            kerry-reportapi-pdfs/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
