name: Package Taier broker reports

on:
  push:
    paths:
      - '.github/workflows/package_taier_broker_reports_20260929.yml'
      - 'tools/package_taier_broker_reports_20260929.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf
      - name: Build and validate package
        run: python tools/package_taier_broker_reports_20260929.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: taier-002347-broker-reports-3
          path: |
            泰尔股份_002347_券商研究报告_3份.zip
            taier_broker_reports_result.json
            _previews_taier_broker_reports/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
