name: Package Shenzhen International broker reports

on:
  push:
    branches:
      - tmp/shenzhen-international-broker-reports-20260831

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v4

      - name: Install PDF and image tools
        run: python -m pip install --quiet requests beautifulsoup4 pillow pypdf pymupdf img2pdf

      - name: Download public pages, build, verify and package reports
        run: python .github/scripts/list_shenzhen_international_reports.py

      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shenzhen-international-broker-reports
          path: 深圳国际_券商深度报告_3份_完整PDF.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
