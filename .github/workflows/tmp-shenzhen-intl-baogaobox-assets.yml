name: Temporary inspect Baogaobox Shenzhen International report assets

on:
  push:
    branches:
      - tmp/download-shenzhen-international-reports-20260831
    paths:
      - .github/workflows/tmp-shenzhen-intl-baogaobox-assets.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect report pages, scripts and public attachment URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages scripts assets diagnostic
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          from urllib.parse import urljoin
          import hashlib, html, json, re, subprocess

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          targets=[
              ('caitong_2026','https://www.baogaobox.com/reports/260120000091348.html'),
              ('shenwan_2025','https://www.baogaobox.com/reports/250622000064665.html'),
              ('guohai_2024','https://www.baogaobox.com/reports/240301000008748.html'),
              ('other_2024','https://www.baogaobox.com/reports/240810000027437.html'),
          ]
          all_urls=[];script_urls=[];manifest=[]
          def fetch(url,out,referer='https://www.baogaobox.com/'):
              cmd=['curl','--http1.1','-L','--silent','--show-error','--retry','6','--retry-all-errors',
                   '--retry-delay','1','--connect-timeout','20','--max-time','240','--compressed','-A',UA,
                   '-e',referer,'-H','Accept-Encoding: identity',url,'-o',str(out),
                   '-w','%{url_effective}\t%{http_code}\t%{content_type}']
              return subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
          for name,url in targets:
              out=Path('pages')/f'{name}.bin';p=fetch(url,out,url)
              print('FETCH',name,'RC',p.returncode,'SIZE',out.stat().st_size if out.exists() else 0,'META',p.stdout,'ERR',p.stderr[-500:])
              if p.returncode or not out.exists():manifest.append({'name':name,'url':url,'error':p.stderr[-1000:]});continue
              body=out.read_bytes();text=None;enc=None
              for e in ['utf-8','gb18030','gbk','big5','latin1']:
                  try:text=body.decode(e);enc=e;break
                  except Exception:pass
              if text is None:continue
              text=html.unescape(text).replace('\\/','/').replace('\\u002F','/').replace('\\u0026','&')
              hp=out.with_suffix('.html');out.unlink();hp.write_text(text,encoding='utf-8')
              title='';m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
              if m:title=' '.join(re.sub(r'<[^>]+>',' ',m.group(1)).split())
              print('TITLE',name,title)
              scripts=[]
              for src in re.findall(r'<script[^>]+src\s*=\s*["\']([^"\']+)["\']',text,re.I):
                  full=urljoin(url,src)
                  if full not in scripts:scripts.append(full)
                  if full not in script_urls:script_urls.append(full)
              found=[]
              patterns=[
                  r'''(?:href|src|data-src|data-original|data-url|data-file|data-pdf|url|file|fileurl|pdfurl|downloadurl|previewurl|sourceurl|imgurl|imageurl|ossurl)\s*[:=]\s*["']([^"']+)["']''',
                  r'''https?://[^\s"'<>]+''',r'''//[^\s"'<>]+''',
                  r'''[^\s"'<>]+\.(?:pdf|zip|png|jpg|jpeg|webp)(?:\?[^\s"'<>]*)?''',
              ]
              for pat in patterns:
                  for v in re.findall(pat,text,re.I):
                      if isinstance(v,tuple):v=v[0]
                      v=v.strip().replace('&amp;','&')
                      if not v or v.startswith(('javascript:','#','data:')):continue
                      try:full=urljoin(url,v)
                      except Exception:continue
                      if full not in found:found.append(full)
              interesting=[]
              for u in found:
                  low=u.lower()
                  if any(k in low for k in ['260120000091348','250622000064665','240301000008748','240810000027437','pdf','download','down','file','attach','preview','report','document','oss','cos','zy.baogaobox','api']):
                      interesting.append(u)
                      if u not in all_urls:all_urls.append(u)
              for u in interesting[:600]:print('PAGE_URL',name,u[:3000])
              for n,line in enumerate(text.splitlines(),1):
                  low=line.lower()
                  if any(k in low for k in ['260120000091348','250622000064665','240301000008748','240810000027437','download','pdfurl','fileurl','preview','attachment','reportid','documentid','oss','cos','zy.baogaobox','api/','__next_data__']):
                      plain=' '.join(re.sub(r'<[^>]+>',' ',line).split())
                      print('LINE',name,n,plain[:4500],line[:4500])
              manifest.append({'name':name,'url':url,'encoding':enc,'title':title,'size':len(body),'scripts':scripts,'interesting':interesting})

          script_manifest=[]
          for i,u in enumerate(script_urls,1):
              out=Path('scripts')/f'{i:03d}.js';p=fetch(u,out,'https://www.baogaobox.com/')
              print('SCRIPT',i,'RC',p.returncode,'SIZE',out.stat().st_size if out.exists() else 0,'URL',u,'ERR',p.stderr[-300:])
              if p.returncode or not out.exists():out.unlink(missing_ok=True);continue
              text=out.read_text(encoding='utf-8',errors='ignore').replace('\\/','/').replace('\\u002F','/').replace('\\u0026','&')
              hits=[]
              for pat in [r'''https?://[^\s"'<>]+''',r'''//[^\s"'<>]+''',r'''/[A-Za-z0-9_./?=&%{}:-]*(?:download|pdf|file|preview|report|document|api|attach)[A-Za-z0-9_./?=&%{}:-]*''']:
                  for v in re.findall(pat,text,re.I):
                      if isinstance(v,tuple):v=v[0]
                      try:full=urljoin(u,v)
                      except Exception:continue
                      if any(k in full.lower() for k in ['pdf','download','file','preview','report','document','api','attach','baogaobox']):
                          if full not in hits:hits.append(full)
                          if full not in all_urls:all_urls.append(full)
              for h in hits[:400]:print('SCRIPT_URL',i,h[:3000])
              for keyword in ['download','pdfUrl','fileUrl','previewUrl','reportId','documentId','attachment','zy.baogaobox','oss','cos','api/']:
                  pos=0;count=0
                  while True:
                      pos=text.lower().find(keyword.lower(),pos)
                      if pos<0 or count>=30:break
                      print('CONTEXT',i,keyword,text[max(0,pos-700):min(len(text),pos+1700)].replace('\n',' ')[:2600])
                      pos+=len(keyword);count+=1
              script_manifest.append({'url':u,'size':out.stat().st_size,'hits':hits})
          Path('diagnostic/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('diagnostic/scripts.json').write_text(json.dumps(script_manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('diagnostic/candidates.txt').write_text('\n'.join(all_urls)+'\n',encoding='utf-8')

          probes=[]
          for i,u in enumerate(all_urls[:4000],1):
              low=u.lower()
              if not any(k in low for k in ['260120000091348','250622000064665','240301000008748','240810000027437','.pdf','.zip','download','file','attach','preview','report','document','api']):continue
              out=Path('assets')/f'{i:04d}.bin';p=fetch(u,out,'https://www.baogaobox.com/')
              if p.returncode or not out.exists():out.unlink(missing_ok=True);probes.append({'url':u,'ok':False,'error':p.stderr[-300:]});continue
              b=out.read_bytes();kind='other';ext='.bin'
              if b[:4]==b'%PDF':kind='pdf';ext='.pdf'
              elif b[:4]==b'PK\x03\x04':kind='zip';ext='.zip'
              elif b[:8]==b'\x89PNG\r\n\x1a\n':kind='png';ext='.png'
              elif b[:3]==b'\xff\xd8\xff':kind='jpg';ext='.jpg'
              elif b[:4]==b'RIFF' and b[8:12]==b'WEBP':kind='webp';ext='.webp'
              elif b[:1] in [b'{',b'[']:kind='json';ext='.json'
              if kind in ['pdf','zip','png','jpg','webp','json'] and len(b)>200:
                  final=out.with_suffix(ext);out.rename(final)
                  rec={'url':u,'ok':True,'kind':kind,'size':len(b),'file':str(final),'meta':p.stdout,'sha256':hashlib.sha256(b).hexdigest()}
                  print('ASSET',i,kind,len(b),p.stdout,u);probes.append(rec)
              else:
                  preview=b[:600].decode('utf-8','replace');out.unlink(missing_ok=True)
                  probes.append({'url':u,'ok':False,'kind':kind,'size':len(b),'meta':p.stdout,'preview':preview})
          Path('diagnostic/probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          find pages scripts assets diagnostic -type f -printf '%p\t%s\n' | sort | tail -200

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: shenzhen-international-baogaobox-assets
          path: |
            pages/
            scripts/
            assets/
            diagnostic/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
