name: Query older Mengtaigaoxin broker reports

on:
  push:
    paths:
      - '.github/workflows/mengtaigaoxin-older-report-query-20260830.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Query exact report titles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests

          s = requests.Session()
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json;charset=UTF-8',
              'Origin': 'https://www.sdyanbao.com',
              'Referer': 'https://www.sdyanbao.com/',
              'Device': '1',
              'X-Token': '',
          }
          queries = [
              '国内丙纶长丝龙头',
              '募投扩产助力成长',
              '丙纶长丝业绩增长',
              '研发锂电隔膜新材料',
              '丙纶长丝行业领跑者',
              '双基地强势进军碳纤维',
              '蒙泰高新 海通证券',
          ]
          all_rows = []
          seen = set()
          for q in queries:
              for page in (1, 2, 3):
                  body = {'keyword': q, 'page': page, 'pageSize': 100, 'opFrom': 1}
                  try:
                      r = s.post('https://api.sdyanbao.com/api/file/search', headers=headers, json=body, timeout=60)
                      print('QUERY', q, page, r.status_code, len(r.content), flush=True)
                      obj = r.json()
                  except Exception as e:
                      print('ERROR', q, page, repr(e), flush=True)
                      continue
                  data = obj.get('data') if isinstance(obj, dict) else None
                  files = data.get('files') if isinstance(data, dict) else []
                  if not isinstance(files, list):
                      continue
                  for item in files:
                      text = json.dumps(item, ensure_ascii=False, default=str)
                      stock = item.get('stock') if isinstance(item.get('stock'), dict) else {}
                      if '蒙泰高新' not in text and str(stock.get('code') or '') != '300876':
                          continue
                      key = str(item.get('id') or item.get('data_source_uuid') or text)
                      if key in seen:
                          continue
                      seen.add(key)
                      row = {
                          'id': item.get('id'),
                          'name': item.get('name'),
                          'page_count': item.get('page_count'),
                          'time_text': item.get('time_text'),
                          'file_size': item.get('file_size'),
                          'original_id': item.get('original_id'),
                          'data_source_uuid': item.get('data_source_uuid'),
                          'share_url': item.get('share_url'),
                          'page_url': item.get('page_url'),
                          'organization': item.get('organization'),
                          'researcher': item.get('researcher'),
                          'type': item.get('type'),
                          'stock': item.get('stock'),
                      }
                      all_rows.append(row)
                      print('MATCH', json.dumps(row, ensure_ascii=False), flush=True)
          with open('older_reports.json', 'w', encoding='utf-8') as f:
              json.dump(all_rows, f, ensure_ascii=False, indent=2)
          print('TOTAL', len(all_rows), flush=True)
          PY
      - name: Upload query output
        uses: actions/upload-artifact@v4
        with:
          name: mengtaigaoxin-older-report-query
          path: older_reports.json
          if-no-files-found: error
          retention-days: 3
