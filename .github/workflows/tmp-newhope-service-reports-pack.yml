name: Temporary New Hope Service reports package

on:
  push:
    branches:
      - tmp-newhope-service-reports-20260828

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Query HKEX, download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/package_newhope_service.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          import zipfile
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from typing import Any
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          CODE = "03658"
          COMPANY_CN = "新希望服务"
          COMPANY_TRAD = "新希望服務"
          COMPANY_EN = "NEW HOPE SERVICE"

          OUT = Path("dist")
          WORK = Path("work")
          DOCS = OUT / "新希望服务_03658_所有年报_招股说明书_最新半年期报告"
          WORK.mkdir(parents=True, exist_ok=True)
          DOCS.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept-Language": "zh-HK,zh;q=0.9,en;q=0.8",
              "Accept-Encoding": "gzip, deflate",
          })

          SEARCH_API = "https://www1.hkexnews.hk/search/titleSearchServlet.do"
          SEARCH_PAGE = "https://www1.hkexnews.hk/search/titlesearch.xhtml"

          def parse_rows(payload: Any) -> list[dict[str, Any]]:
              obj = payload
              if isinstance(obj, dict) and isinstance(obj.get("result"), str):
                  obj = json.loads(obj["result"])
              elif isinstance(obj, dict) and "result" in obj:
                  obj = obj["result"]
              if isinstance(obj, list):
                  return [x for x in obj if isinstance(x, dict)]
              if isinstance(obj, dict):
                  for key in ("data", "records", "items", "result"):
                      value = obj.get(key)
                      if isinstance(value, list):
                          return [x for x in value if isinstance(x, dict)]
              raise RuntimeError(f"Unexpected HKEX response shape: {type(obj)} {str(obj)[:500]}")

          def field(row: dict[str, Any], *names: str) -> str:
              for name in names:
                  if name in row and row[name] is not None:
                      return str(row[name]).strip()
                  lower = name.lower()
                  for key, value in row.items():
                      if str(key).lower() == lower and value is not None:
                          return str(value).strip()
              return ""

          def norm_code(value: Any) -> str:
              digits = re.sub(r"\D", "", str(value or ""))
              return digits.zfill(5)[-5:] if digits else ""

          def hkex_query(start: str, end: str, *, lang: str, category: int = 0, row_range: int = 5000) -> list[dict[str, Any]]:
              params = {
                  "sortDir": "0",
                  "sortByOptions": "DateTime",
                  "category": str(category),
                  "market": "SEHK",
                  "stockId": "-1",
                  "documentType": "-1",
                  "fromDate": start,
                  "toDate": end,
                  "title": "",
                  "searchType": "1",
                  "t1code": "40000",
                  "t2Gcode": "-2",
                  "t2code": "-1",
                  "rowRange": str(row_range),
                  "lang": lang,
              }
              response = session.get(
                  SEARCH_API,
                  params=params,
                  headers={"Accept": "application/json", "Referer": SEARCH_PAGE},
                  timeout=120,
              )
              print("QUERY", response.status_code, len(response.content), response.url)
              response.raise_for_status()
              rows = parse_rows(response.json())
              matched = [row for row in rows if norm_code(field(row, "STOCK_CODE", "stockCode")) == CODE]
              print("ROWS", len(rows), "MATCHED", len(matched))
              return matched

          def iter_chunks(start: str, end: str, days: int = 10):
              current = datetime.strptime(start, "%Y%m%d").date()
              finish = datetime.strptime(end, "%Y%m%d").date()
              while current <= finish:
                  chunk_end = min(current + timedelta(days=days - 1), finish)
                  yield current.strftime("%Y%m%d"), chunk_end.strftime("%Y%m%d")
                  current = chunk_end + timedelta(days=1)

          records: list[dict[str, Any]] = []
          seen_links: set[str] = set()

          def collect_window(start: str, end: str, *, lang: str, category: int = 0) -> None:
              for chunk_start, chunk_end in iter_chunks(start, end):
                  for row in hkex_query(chunk_start, chunk_end, lang=lang, category=category):
                      title = field(row, "TITLE", "title")
                      link = field(row, "FILE_LINK", "fileLink", "LINK")
                      if not title or not link or link in seen_links:
                          continue
                      seen_links.add(link)
                      copy = dict(row)
                      copy["_TITLE"] = title
                      copy["_LINK"] = link
                      copy["_LANG"] = "中文" if lang == "zh" else "英文"
                      records.append(copy)

          # Annual-report filing seasons for fiscal years 2021-2025.
          annual_windows = [
              ("20220315", "20220515"),
              ("20230315", "20230515"),
              ("20240315", "20240515"),
              ("20250315", "20250515"),
              ("20260315", "20260515"),
          ]
          for start, end in annual_windows:
              collect_window(start, end, lang="zh")

          # IPO documents and latest interim periods.
          collect_window("20210501", "20210620", lang="zh", category=0)
          collect_window("20210501", "20210620", lang="zh", category=1)
          collect_window("20250801", "20251015", lang="zh")
          collect_window("20260801", "20260828", lang="zh")

          CN_YEAR_TOKENS = {
              2020: ("二零二零", "二〇二〇"),
              2021: ("二零二一", "二〇二一"),
              2022: ("二零二二", "二〇二二"),
              2023: ("二零二三", "二〇二三"),
              2024: ("二零二四", "二〇二四"),
              2025: ("二零二五", "二〇二五"),
              2026: ("二零二六", "二〇二六"),
          }

          def compact(text: str) -> str:
              return re.sub(r"\s+", "", text or "")

          def detect_year(text: str) -> int | None:
              s = compact(text)
              match = re.search(r"20\d{2}", s)
              if match:
                  return int(match.group(0))
              for year, tokens in CN_YEAR_TOKENS.items():
                  if any(token in s for token in tokens):
                      return year
              return None

          def file_url(row: dict[str, Any]) -> str:
              link = row["_LINK"]
              if link.startswith("http://") or link.startswith("https://"):
                  return link
              return urljoin("https://www1.hkexnews.hk/", link.lstrip("/"))

          def record_date(row: dict[str, Any]) -> str:
              return field(row, "DATE_TIME", "dateTime", "DATE")

          def select_annuals(source: list[dict[str, Any]]) -> dict[int, dict[str, Any]]:
              chosen: dict[int, dict[str, Any]] = {}
              for row in source:
                  title = row["_TITLE"]
                  s = compact(title)
                  upper = s.upper()
                  if not ("年報" in s or "年度報告" in s or "ANNUALREPORT" in upper):
                      continue
                  if any(token in s for token in ("業績", "业绩", "摘要", "環境", "环境", "可持續", "可持续", "通函")):
                      continue
                  if any(token in upper for token in ("RESULTS", "ESG", "SUSTAINABILITY", "CIRCULAR")):
                      continue
                  year = detect_year(title)
                  if year not in range(2021, 2026):
                      continue
                  score = (1 if row["_LANG"] == "中文" else 0, record_date(row))
                  current = chosen.get(year)
                  if current is None or score > (1 if current["_LANG"] == "中文" else 0, record_date(current)):
                      chosen[year] = row
              return chosen

          annuals = select_annuals(records)
          missing_years = [year for year in range(2021, 2026) if year not in annuals]
          if missing_years:
              print("MISSING CHINESE ANNUALS", missing_years, "-- searching English filings")
              for start, end in annual_windows:
                  collect_window(start, end, lang="EN")
              annuals = select_annuals(records)
              missing_years = [year for year in range(2021, 2026) if year not in annuals]
          if missing_years:
              raise RuntimeError(f"Missing annual reports for years {missing_years}")
          print("ANNUALS", {year: annuals[year]["_TITLE"] for year in sorted(annuals)})

          def choose_half(source: list[dict[str, Any]]) -> tuple[dict[str, Any], str, str, int]:
              formal_2026: list[dict[str, Any]] = []
              results_2026: list[dict[str, Any]] = []
              older_formal: list[dict[str, Any]] = []
              for row in source:
                  title = row["_TITLE"]
                  s = compact(title)
                  upper = s.upper()
                  if any(token in s for token in ("摘要", "英文版")):
                      continue
                  year = detect_year(title)
                  formal = "中期報告" in s or "半年度報告" in s or "INTERIMREPORT" in upper
                  results = "中期業績" in s or "中期业绩" in s or "INTERIMRESULT" in upper or ("SIXMONTHSENDED" in upper and "2026" in upper)
                  if year == 2026 and formal:
                      formal_2026.append(row)
                  elif year == 2026 and results:
                      results_2026.append(row)
                  elif formal and year is not None:
                      older_formal.append(row)
              rank = lambda row: (1 if row["_LANG"] == "中文" else 0, record_date(row))
              if formal_2026:
                  row = sorted(formal_2026, key=rank, reverse=True)[0]
                  return row, "正式2026年中期报告", "新希望服务_03658_2026年中期报告.pdf", 25
              if results_2026:
                  row = sorted(results_2026, key=rank, reverse=True)[0]
                  return row, "2026年中期业绩公告（含六个月财务报表）", "新希望服务_03658_2026年中期业绩公告_含六个月财务报表.pdf", 8
              if older_formal:
                  row = sorted(older_formal, key=lambda r: (detect_year(r["_TITLE"]) or 0, *rank(r)), reverse=True)[0]
                  year = detect_year(row["_TITLE"]) or 0
                  return row, f"截至检索日最新正式中期报告（{year}年）", f"新希望服务_03658_{year}年中期报告.pdf", 25
              raise RuntimeError("No interim report or interim-results filing found")

          try:
              half_row, half_kind, half_filename, half_min_pages = choose_half(records)
          except RuntimeError:
              collect_window("20260801", "20260828", lang="EN")
              collect_window("20250801", "20251015", lang="EN")
              half_row, half_kind, half_filename, half_min_pages = choose_half(records)
          print("HALF", half_kind, half_row["_TITLE"], file_url(half_row))

          prospectus_records: list[dict[str, Any]] = []
          for row in records:
              title = row["_TITLE"]
              s = compact(title)
              upper = s.upper()
              if any(token in s for token in ("申請表格", "申请表格")) or "APPLICATIONFORM" in upper:
                  continue
              if any(token in s for token in ("全球發售", "全球发售", "招股章程", "招股說明書")) or "GLOBALOFFERING" in upper or "PROSPECTUS" in upper:
                  prospectus_records.append(row)
          if not prospectus_records:
              collect_window("20210501", "20210620", lang="EN", category=0)
              collect_window("20210501", "20210620", lang="EN", category=1)
              for row in records:
                  title = row["_TITLE"]
                  s = compact(title)
                  upper = s.upper()
                  if any(token in s for token in ("申請表格", "申请表格")) or "APPLICATIONFORM" in upper:
                      continue
                  if any(token in s for token in ("全球發售", "全球发售", "招股章程", "招股說明書")) or "GLOBALOFFERING" in upper or "PROSPECTUS" in upper:
                      prospectus_records.append(row)
          if not prospectus_records:
              raise RuntimeError("No prospectus filing found")

          def download(url: str, path: Path, *, referer: str | None = None) -> str:
              errors: list[str] = []
              for attempt in range(4):
                  try:
                      headers = {"Accept": "application/pdf,application/octet-stream,text/html,*/*"}
                      if referer:
                          headers["Referer"] = referer
                      with session.get(url, headers=headers, timeout=300, stream=True, allow_redirects=True) as response:
                          response.raise_for_status()
                          with path.open("wb") as output:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      output.write(chunk)
                          return response.url
                  except Exception as exc:
                      path.unlink(missing_ok=True)
                      errors.append(repr(exc))
                      if attempt < 3:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"Failed download {url}: {errors}")

          def pdf_info(path: Path, sample_pages: int = 10) -> tuple[int, str, str]:
              raw = path.read_bytes()
              if len(raw) < 100_000 or not raw.startswith(b"%PDF-"):
                  raise RuntimeError(f"Invalid PDF {path.name}: {len(raw)} bytes head={raw[:12]!r}")
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              parts: list[str] = []
              for page in reader.pages[:sample_pages]:
                  try:
                      parts.append(page.extract_text() or "")
                  except Exception:
                      pass
              sample = re.sub(r"\s+", " ", " ".join(parts)).strip()
              return pages, sample, hashlib.sha256(raw).hexdigest()

          prospectus_candidates: list[tuple[tuple[int, int, int, int], Path, str]] = []
          seen_candidate_urls: set[str] = set()
          index = 0
          for row in prospectus_records:
              entry_url = file_url(row)
              links: list[tuple[str, str]] = []
              if entry_url.lower().endswith(".pdf"):
                  links.append((row["_TITLE"], entry_url))
              else:
                  try:
                      response = session.get(entry_url, timeout=90)
                      response.raise_for_status()
                      soup = BeautifulSoup(response.text, "html.parser")
                      for anchor in soup.find_all("a", href=True):
                          child_title = " ".join(anchor.get_text(" ", strip=True).split())
                          child_url = urljoin(response.url, anchor["href"])
                          if child_url.lower().endswith(".pdf"):
                              links.append((child_title, child_url))
                  except Exception as exc:
                      print("PROSPECTUS PAGE ERROR", entry_url, repr(exc))
              for child_title, child_url in links:
                  if child_url in seen_candidate_urls:
                      continue
                  seen_candidate_urls.add(child_url)
                  index += 1
                  temp = WORK / f"prospectus_{index:03d}.pdf"
                  try:
                      final_url = download(child_url, temp, referer=entry_url)
                      pages, sample, digest = pdf_info(temp)
                  except Exception as exc:
                      print("PROSPECTUS CANDIDATE ERROR", child_url, repr(exc))
                      continue
                  text = (row["_TITLE"] + " " + child_title + " " + sample).lower()
                  company_score = int(any(token.lower() in text for token in (COMPANY_CN, COMPANY_TRAD, COMPANY_EN, "new hope service")))
                  prospectus_score = int(any(token.lower() in text for token in ("招股", "prospectus", "global offering", "全球發售")))
                  language_score = 1 if row["_LANG"] == "中文" else 0
                  score = (company_score, prospectus_score, language_score, pages)
                  prospectus_candidates.append((score, temp, final_url))
                  print("PROSPECTUS", score, child_title, pages, temp.stat().st_size, final_url)

          if not prospectus_candidates:
              raise RuntimeError("No downloadable prospectus candidate")
          prospectus_candidates.sort(key=lambda item: (item[0], item[1].stat().st_size), reverse=True)
          prospectus_score, prospectus_temp, prospectus_source = prospectus_candidates[0]
          prospectus_pages, prospectus_sample, prospectus_digest = pdf_info(prospectus_temp)
          if prospectus_pages < 150:
              raise RuntimeError(f"Selected prospectus too short: {prospectus_pages} pages, score={prospectus_score}")
          prospectus_path = DOCS / "新希望服务_03658_全球发售招股章程_2021.pdf"
          prospectus_path.write_bytes(prospectus_temp.read_bytes())

          manifest = [
              "新希望服务控股有限公司（03658.HK）",
              "资料范围：上市后全部完整年度报告、最终全球发售招股章程，以及截至2026-08-28最新半年期财务披露。",
              f"年度报告年份：{', '.join(str(y) for y in sorted(annuals))}。",
              f"最新半年期文件口径：{half_kind}。",
              "来源：香港交易所披露易（HKEXnews）官方文件；优先采用中文版本。",
              "版本规则：排除年度业绩公告、摘要、ESG/可持续发展报告和申请表格。",
              "",
          ]

          def save_report(filename: str, row: dict[str, Any], kind: str, minimum_pages: int, expected_year: int | None) -> None:
              path = DOCS / filename
              final_url = download(file_url(row), path, referer=SEARCH_PAGE)
              pages, sample, digest = pdf_info(path)
              if pages < minimum_pages:
                  raise RuntimeError(f"Unexpectedly short {kind}: {filename} has {pages} pages")
              if not any(token.lower() in sample.lower() for token in (COMPANY_CN, COMPANY_TRAD, COMPANY_EN, "new hope service")):
                  print("WARNING company name not extracted", filename)
              if expected_year is not None and str(expected_year) not in sample and not any(token in sample for token in CN_YEAR_TOKENS.get(expected_year, ())):
                  print("WARNING year not extracted", expected_year, filename)
              manifest.extend([
                  filename,
                  f"  港交所标题：{row['_TITLE']}",
                  f"  文件类型：{kind}",
                  f"  语言版本：{row['_LANG']}",
                  f"  页数：{pages}",
                  f"  文件大小：{path.stat().st_size} bytes",
                  f"  SHA-256：{digest}",
                  f"  官方来源：{final_url}",
                  "",
              ])
              print("OK", filename, pages, path.stat().st_size, final_url)

          for year in range(2021, 2026):
              save_report(f"新希望服务_03658_{year}年年度报告.pdf", annuals[year], f"{year}年年度报告", 60, year)
          save_report(half_filename, half_row, half_kind, half_min_pages, detect_year(half_row["_TITLE"]))

          prospectus_raw = prospectus_path.read_bytes()
          manifest.extend([
              prospectus_path.name,
              "  文件类型：最终全球发售招股章程",
              f"  页数：{prospectus_pages}",
              f"  文件大小：{len(prospectus_raw)} bytes",
              f"  SHA-256：{hashlib.sha256(prospectus_raw).hexdigest()}",
              f"  官方来源：{prospectus_source}",
              "",
          ])
          (DOCS / "资料清单与港交所官方来源.txt").write_text("\n".join(manifest), encoding="utf-8")

          half_year = detect_year(half_row["_TITLE"])
          half_label = f"{half_year}年最新半年期报告" if half_year else "最新半年期报告"
          final_zip = OUT / f"新希望服务_03658_所有年报_招股说明书_{half_label}.zip"
          with zipfile.ZipFile(final_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(DOCS.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(final_zip, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != 7:
                  raise RuntimeError(f"Expected 7 PDFs, got {pdfs}")

          print(f"FINAL_ZIP={final_zip}")
          print(f"ZIP_SIZE={final_zip.stat().st_size}")
          print(f"HALF_KIND={half_kind}")
          print("CONTENTS")
          for path in sorted(DOCS.iterdir()):
              print(path.name, path.stat().st_size)
          PY
          python /tmp/package_newhope_service.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: newhope-service-reports-final-zip
          path: dist/新希望服务_03658_所有年报_招股说明书_*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
