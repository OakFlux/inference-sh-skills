name: Temporary verified Conch Cement deep report package

on:
  push:
    branches:
      - tmp/download-conch-cement-reports-20260829
    paths:
      - .github/workflows/tmp-conch-cement-download.yml

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download and verify original PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previews
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'

          download_pdf() {
            local url="$1"
            local dest="$2"
            local pages="$3"
            local expected="$4"
            local stem="$5"
            curl -L --fail --retry 6 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 --max-time 600 --compressed \
              -A "$UA" -e 'https://data.eastmoney.com/report/' \
              -H 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8' \
              "$url" -o "output/$dest"
            test -s "output/$dest"
            test "$(head -c 4 "output/$dest")" = '%PDF'
            actual=$(pdfinfo "output/$dest" | awk '/^Pages:/ {print $2}')
            test "$actual" -eq "$pages"
            pdftotext -f 1 -l 3 "output/$dest" "previews/${stem}_text.txt"
            grep -q "$expected" "previews/${stem}_text.txt"
            pdftoppm -f 1 -singlefile -png -r 100 "output/$dest" "previews/${stem}_first" >/dev/null 2>&1
            pdftoppm -f "$pages" -singlefile -png -r 100 "output/$dest" "previews/${stem}_last" >/dev/null 2>&1
            test -s "previews/${stem}_first.png"
            test -s "previews/${stem}_last.png"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202210171579207390_1.pdf' \
            '01_BOC_International_Conch_Cement_Deep_Report_20221017_45p.pdf' \
            45 '珍惜优质资产' 'boc_2022'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202109131515967876_1.pdf' \
            '02_Pacific_Securities_Conch_Cement_Deep_Report_20210913_24p.pdf' \
            24 '政策预期升温' 'pacific_2021'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201905301332890931_1.pdf' \
            '03_Lianxun_Yuekai_Conch_Cement_Deep_Report_20190530_25p.pdf' \
            25 '需求复苏确定' 'lianxun_2019'

          cat > output/报告清单与核验说明.txt <<'EOF'
海螺水泥（600585.SH / 00914.HK）券商深度报告，共3份

1. 中银证券，2022-10-17，45页
   《珍惜优质资产与历史最低PB》
   类型：公司深度报告；围绕行业供需、成本优势、现金流、估值和产业链扩张进行系统分析。

2. 太平洋证券，2021-09-13，24页
   《政策预期升温，价值有望重估》
   类型：公司深度报告；重点讨论水泥周期、区域格局、盈利弹性及价值重估逻辑。

3. 联讯证券（现粤开证券），2019-05-30，25页
   《需求复苏确定，成本优势领先》
   类型：公司深度报告；系统分析需求周期、成本壁垒、区域布局及盈利预测。

三份均为原始、完整、可检索PDF，不是网页正文、摘要或预览页重制文件。
已核验PDF文件头、实际页数、首页标题文字，并成功渲染首页与末页。
仅供研究资料整理，不构成投资建议。
EOF

          (cd output && sha256sum ./*.pdf > SHA256SUMS.txt)
          ls -lh output previews

      - name: Upload verified original reports
        uses: actions/upload-artifact@v4
        with:
          name: conch-cement-broker-deep-reports-3
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
