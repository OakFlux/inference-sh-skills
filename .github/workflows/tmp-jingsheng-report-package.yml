name: Temporary Jingsheng Equipment brokerage report package

on:
  push:
    branches:
      - tmp/download-jingsheng-reports-20260830
    paths:
      - .github/workflows/tmp-jingsheng-report-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pypdf requests

      - name: Download and validate original PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output verify
          cat > /tmp/download_verify.py <<'PY'
          import hashlib
          import io
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          OUT = Path('output')
          VERIFY = Path('verify')
          OUT.mkdir(exist_ok=True)
          VERIFY.mkdir(exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'broker': '东吴证券',
                  'date': '2023-04-17',
                  'title': '碳化硅及半导体级单晶炉领先供应商，绑定大客户实现快速增长',
                  'info_code': 'AP202304171585508558',
                  'expected_pages': 38,
                  'filename': '01_东吴证券_碳化硅及半导体级单晶炉领先供应商_绑定大客户实现快速增长_20230417_38页.pdf',
                  'type': '公司深度研究',
              },
              {
                  'order': 2,
                  'broker': '国信证券',
                  'date': '2023-04-25',
                  'title': '半导体晶体生长头部企业',
                  'info_code': 'AP202304251585789275',
                  'expected_pages': 16,
                  'filename': '02_国信证券_半导体晶体生长头部企业_20230425_16页.pdf',
                  'type': '公司研究',
              },
              {
                  'order': 3,
                  'broker': '华金证券',
                  'date': '2023-04-02',
                  'title': '新股覆盖研究：晶升股份',
                  'info_code': 'AP202304011585020651',
                  'expected_pages': 11,
                  'filename': '03_华金证券_新股覆盖研究_晶升股份_20230402_11页.pdf',
                  'type': '新股覆盖研究',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/688478.html',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          manifest = []
          for report in reports:
              url = f"https://pdf.dfcfw.com/pdf/H3_{report['info_code']}_1.pdf"
              content = None
              final_url = None
              errors = []
              for attempt in range(1, 7):
                  try:
                      response = session.get(url, timeout=(30, 240), allow_redirects=True)
                      if response.status_code == 200 and response.content.startswith(b'%PDF-') and len(response.content) > 100_000:
                          content = response.content
                          final_url = response.url
                          break
                      errors.append(f"attempt {attempt}: HTTP {response.status_code}, type={response.headers.get('content-type')}, bytes={len(response.content)}")
                  except Exception as exc:
                      errors.append(f"attempt {attempt}: {exc!r}")
                  time.sleep(attempt * 2)
              if content is None:
                  raise RuntimeError(f"下载失败：{report['title']}；{' | '.join(errors)}")

              path = OUT / report['filename']
              path.write_bytes(content)
              reader = PdfReader(io.BytesIO(content), strict=False)
              pages = len(reader.pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(f"页数不符：{path.name}，预期{report['expected_pages']}页，实际{pages}页")
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception:
                      raise RuntimeError(f"PDF被加密且无法读取：{path.name}")

              extracted_parts = []
              for pageno in range(min(8, pages)):
                  try:
                      extracted_parts.append(reader.pages[pageno].extract_text() or '')
                  except Exception as exc:
                      extracted_parts.append(f'[extract error: {exc}]')
              extracted = '\n'.join(extracted_parts)
              compact = re.sub(r'\s+', '', extracted)
              if not ('晶升股份' in compact or '688478' in compact or '南京晶升' in compact):
                  raise RuntimeError(f"公司身份核验失败：{path.name}")

              sha256 = hashlib.sha256(content).hexdigest()
              subprocess.run([
                  'pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120',
                  str(path), str(VERIFY / f"{report['order']:02d}_page1")
              ], check=True)
              subprocess.run([
                  'pdftoppm', '-f', str(pages), '-singlefile', '-png', '-r', '90',
                  str(path), str(VERIFY / f"{report['order']:02d}_last_page")
              ], check=True)
              (VERIFY / f"{report['order']:02d}_text.txt").write_text(extracted, encoding='utf-8')

              manifest.append({
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'type': report['type'],
                  'pages': pages,
                  'bytes': len(content),
                  'source_url': final_url,
                  'info_code': report['info_code'],
                  'sha256': sha256,
                  'identity_check': '通过：前8页识别到晶升股份、688478或南京晶升',
              })

          lines = [
              '晶升股份（688478.SH）券商研究报告清单与核验说明',
              '',
              '本压缩包包含3份从公开PDF地址取得的券商研究报告原文件。',
              '已核验PDF文件头、实际页数、公司名称/证券代码、加密状态，并成功渲染首页和末页。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              lines.extend([
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   类型：{item['type']}；日期：{item['date']}；页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   公开PDF：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  f"   身份核验：{item['identity_check']}",
                  '',
              ])
          lines.append('资料仅供研究参考，不构成投资建议。')

          (OUT / '报告清单与核验说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          with (OUT / 'SHA256SUMS.txt').open('w', encoding='utf-8') as fh:
              for item in manifest:
                  fh.write(f"{item['sha256']}  {item['filename']}\n")
          (VERIFY / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          python /tmp/download_verify.py | tee verify/run.log
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          find verify -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload verified report package
        uses: actions/upload-artifact@v4
        with:
          name: jingsheng-broker-reports-3
          path: output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jingsheng-broker-reports-verification
          path: verify/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
