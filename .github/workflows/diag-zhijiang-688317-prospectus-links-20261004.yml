name: Locate Zhijiang Bio formal prospectus PDF 20261004

on:
  push:
    paths:
      - '.github/workflows/diag-zhijiang-688317-prospectus-links-20261004.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect Sina issue pages and links
        run: |
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests

          s = requests.Session(); s.trust_env = False
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9',
          }
          urls = [
              'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688317.phtml',
              'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688317.phtml?type=1',
              'https://stock.finance.sina.com.cn/stock/go.php/vISSUE_RaiseExplanation/stockid/688317.phtml',
          ]
          for url in urls:
              print('\n===', url, '===', flush=True)
              try:
                  r = s.get(url, headers=headers, timeout=90, allow_redirects=True)
                  enc = r.apparent_encoding or r.encoding or 'gbk'
                  r.encoding = enc
                  text = r.text
                  print('STATUS', r.status_code, r.headers.get('content-type'), len(r.content), r.url, 'ENC', enc, flush=True)
                  title = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
                  print('TITLE', re.sub(r'<[^>]+>', '', title.group(1)).strip() if title else '', flush=True)
                  links = []
                  for m in re.finditer(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, re.I):
                      raw = html.unescape(m.group(1))
                      full = urljoin(r.url, raw)
                      if any(k in full.lower() for k in ['pdf', 'raiseexplanation', 'issue', 'download', 'file.finance', '688317']):
                          links.append(full)
                  print('LINKS', json.dumps(list(dict.fromkeys(links)), ensure_ascii=False, indent=2), flush=True)
                  for pat in ['2021-01-12', '招股说明书', '首次公开发行股票并在科创板上市招股说明书', 'RaiseExplanationDetail', '.PDF', '.pdf']:
                      for m in re.finditer(re.escape(pat), text, re.I):
                          print('AROUND', pat, re.sub(r'\s+', ' ', text[max(0, m.start()-1200):m.start()+3500]), flush=True)
              except Exception as exc:
                  print('ERROR', repr(exc), flush=True)
          PY
