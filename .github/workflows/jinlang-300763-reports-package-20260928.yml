name: Build Jinlang Technology 300763 reports package 20260928

on:
  push:
    paths:
      - '.github/workflows/jinlang-300763-reports-package-20260928.yml'
      - 'scripts/build_jinlang_300763_reports_20260928.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        run: python scripts/build_jinlang_300763_reports_20260928.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jinlang-300763-reports-2020-2026
          path: 锦浪科技_300763_2020-2025年报_2026最新定期报告.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
