name: Temporary Jiuqi exact Sdyanbao probe

on:
  push:
    branches:
      - tmp/download-jiuqi-software-reports-20260829
    paths:
      - .github/workflows/tmp-jiuqi-exact-sdy-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print exact matches and test full public page sequences
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/','Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'})
          queries=['内生外延把握行业发展大方向','司机驿站价值再解读','执行力再证明','物流信息化金融支付闭环接近完成','久其软件']
          all_matches=[]
          for q in queries:
              payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
              r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=90)
              print('\nQUERY',q,'HTTP',r.status_code,'LEN',len(r.content))
              r.raise_for_status(); data=(r.json().get('data') or {}); files=data.get('files') or []
              print('TOTAL',data.get('total'),'COUNT',len(files))
              for f in files:
                  row={
                      'id':f.get('id'),'name':f.get('name'),'date':f.get('time_text'),'pages':f.get('page_count'),
                      'size':f.get('file_size'),'type':(f.get('type') or {}).get('name'),
                      'organization':(f.get('organization') or {}).get('name'),'stock':f.get('stock'),
                      'uuid':f.get('data_source_uuid'),'data_source':f.get('data_source'),
                      'original_id':f.get('original_id'),'page_url':f.get('page_url'),'share_url':f.get('share_url'),
                      'summary':str(f.get('summary') or '')[:500],
                  }
                  print('ROW',json.dumps(row,ensure_ascii=False))
                  blob=' '.join(str(row.get(k) or '') for k in ['name','organization','stock','summary'])
                  if ('久其软件' in blob or '002279' in blob or
                      any(x in str(row['name'] or '') for x in ['内生外延','司机驿站','执行力再证明','物流信息化'])):
                      all_matches.append(row)

          # Check every public page image for candidate rows up to declared page count.
          seen=set()
          for row in all_matches:
              oid=row.get('original_id')
              root=row.get('page_url')
              pages=int(row.get('pages') or 0)
              key=(oid,root,pages)
              if key in seen: continue
              seen.add(key)
              print('\nCANDIDATE',json.dumps(row,ensure_ascii=False))
              if not root or pages<=0: continue
              ok=[]; bad=[]
              for i in range(pages):
                  u=root.rstrip('/')+f'/{i}.png'
                  try:
                      x=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/'},timeout=45)
                      valid=x.status_code==200 and x.content[:8]==b'\x89PNG\r\n\x1a\n' and len(x.content)>10000
                      (ok if valid else bad).append({'i':i,'status':x.status_code,'bytes':len(x.content),'head':x.content[:8].hex()})
                  except Exception as e: bad.append({'i':i,'err':repr(e)})
              print('PAGE_CHECK',json.dumps({'name':row.get('name'),'declared':pages,'ok':len(ok),'bad':bad[:20]},ensure_ascii=False))
          PY
