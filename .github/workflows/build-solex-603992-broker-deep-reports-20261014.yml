name: Build Solex 603992 broker deep reports 20261014

on:
  push:
    paths:
      - '.github/workflows/build-solex-603992-broker-deep-reports-20261014.yml'
      - 'scripts/build_solex_603992_broker_deep_reports_20261014.py'
      - 'scripts/build_solex_603992_broker_deep_reports_20261014_v2.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests pypdf

      - name: Download validate and package broker reports
        id: build
        continue-on-error: true
        run: |
          python scripts/build_solex_603992_broker_deep_reports_20261014_v2.py > solex_broker_build.log 2>&1
          status=$?
          cat solex_broker_build.log
          exit $status

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solex-603992-broker-report-diagnostics-20261014
          path: |
            solex_broker_build.log
            _solex_broker_report_debug/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      - name: Upload final ZIP
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: solex-603992-broker-deep-reports-20261014
          path: 松霖科技_603992_券商深度报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
