name: Broad Sdyanbao search for Tianfulong report

on:
  push:
    paths:
      - '.github/workflows/tianfulong-sdyanbao-broad-search.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search by title series, authors, institution and content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, time
          base='https://api.sdyanbao.com'
          H={'User-Agent':'Mozilla/5.0 Chrome/150 Safari/537.36','Accept':'application/json, text/plain, */*','Content-Type':'application/json;charset=UTF-8','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/','Device':'1','opFrom':'1'}
          terms=['注册制新股纵览','新股纵览','彭文玉','任奕璇','AHP得分','再生涤短产能规模靠前企业','天富龙']
          for term in terms:
            for only in (1,0):
              for page in range(1,11):
                payload={'pageNum':page,'pageSize':100,'type':0,'keyword':term,'sort':0,'onlyTitle':only,'startTime':'2025-07-01','endTime':'2025-08-10','orgName':'','industry':'','id':''}
                r=requests.post(base+'/api/file/search',headers=H,json=payload,timeout=(30,180)); print('\nREQ',term,'only',only,'page',page,'status',r.status_code,'bytes',len(r.content),flush=True); r.raise_for_status(); o=r.json(); d=o.get('data') or {}; rows=d.get('files') or []
                print('TOTAL',d.get('total'),'ROWS',len(rows),flush=True)
                for row in rows:
                  blob=json.dumps(row,ensure_ascii=False)
                  if any(k in blob for k in ['天富龙','彭文玉','任奕璇','国内差别化和再生涤短产能规模靠前企业']): print('MATCH',blob,flush=True)
                if len(rows)<100: break
                time.sleep(.2)
          PY
