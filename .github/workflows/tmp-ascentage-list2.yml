name: Temporary Ascentage Eastmoney list2 retrieval

on:
  push:
    branches:
      - 'tmp/ascentage-reports-20260828'

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p reports diagnostics

      - name: Query Eastmoney individual-stock report API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API = 'https://reportapi.eastmoney.com/report/list2'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          headers = {
              'User-Agent': UA,
              'Referer': 'https://data.eastmoney.com/report/',
              'Origin': 'https://data.eastmoney.com',
              'Content-Type': 'application/json;charset=UTF-8',
              'Accept': 'application/json, text/plain, */*',
          }

          code_variants = ['06855', '6855', 'HK06855', '06855.HK', '6855.HK', '116.06855', '*']
          ranges = [
              ('2025-01-26', '2025-01-28'),
              ('2025-01-13', '2025-01-15'),
              ('2024-10-09', '2024-10-11'),
              ('2024-07-14', '2024-07-16'),
              ('2023-05-06', '2023-05-09'),
              ('2023-01-01', '2025-02-01'),
          ]

          all_records = []
          seen_requests = set()
          for code in code_variants:
              for begin, end in ranges:
                  # Avoid an unnecessarily broad wildcard query.
                  if code == '*' and (begin, end) == ('2023-01-01', '2025-02-01'):
                      continue
                  for page in range(1, 21):
                      payload = {
                          'pageSize': 100,
                          'pageNo': page,
                          'p': page,
                          'pageNum': page,
                          'pageNumber': page,
                          'beginTime': begin,
                          'endTime': end,
                          'code': code,
                          'industryCode': '*',
                          'rating': None,
                          'ratingChange': None,
                          'orgCode': None,
                          'rcode': '',
                      }
                      key = (code, begin, end, page)
                      if key in seen_requests:
                          continue
                      seen_requests.add(key)
                      body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
                      req = urllib.request.Request(API, data=body, headers=headers, method='POST')
                      out = Path(f'diagnostics/list2_{re.sub(r"[^A-Za-z0-9]+", "_", code)}_{begin}_{end}_p{page}.json')
                      try:
                          raw = urllib.request.urlopen(req, timeout=90).read().decode('utf-8', 'ignore')
                          out.write_text(raw, encoding='utf-8')
                          data = json.loads(raw)
                      except Exception as e:
                          out.with_suffix('.error.txt').write_text(repr(e), encoding='utf-8')
                          break
                      batch = data.get('data') or []
                      all_records.extend(batch)
                      total_page = int(data.get('TotalPage') or data.get('totalPage') or 0)
                      if not batch or (total_page and page >= total_page) or len(batch) < 100:
                          break
                      time.sleep(0.2)

          # Deduplicate by infoCode/encodeUrl and preserve the fullest record.
          dedup = {}
          for r in all_records:
              rid = str(r.get('infoCode') or r.get('encodeUrl') or '')
              if not rid:
                  rid = json.dumps(r, ensure_ascii=False, sort_keys=True)
              dedup[rid] = r
          records = list(dedup.values())
          Path('diagnostics/all_records.json').write_text(
              json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          def haystack(r):
              return ' '.join(str(r.get(k, '')) for k in (
                  'title', 'stockName', 'stockCode', 'orgSName', 'industryName', 'author'
              ))

          matches = [r for r in records if any(x.lower() in haystack(r).lower() for x in (
              '亚盛医药', 'Ascentage', '06855', '6855'
          ))]
          Path('diagnostics/matches.json').write_text(
              json.dumps(matches, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          with open('diagnostics/matches.tsv', 'w', encoding='utf-8') as f:
              for r in matches:
                  f.write('\t'.join(str(r.get(k, '')) for k in (
                      'publishDate', 'orgSName', 'title', 'stockName', 'stockCode', 'infoCode', 'encodeUrl'
                  )) + '\n')

          # Select the best 2-3 deep reports in preferred order.
          preferences = [
              ('细胞凋亡赛道领军者', '01_东吴证券_亚盛医药_细胞凋亡赛道领军者_加速迈向全球化_2025-01-27.pdf'),
              ('血液瘤创新药细分龙头', '02_国海证券_亚盛医药_血液瘤创新药细分龙头_加速国际化布局_2025-01-14.pdf'),
              ('厚积薄发', '03_海通国际_亚盛医药_厚积薄发_逐步迈向全球化Biopharma_2024-10-10.pdf'),
              ('国际化进程加速', '04_广发证券_亚盛医药_国际化进程加速_全球临床顺利推进_2024-07-15.pdf'),
              ('小荷才露尖尖角', '05_西南证券_亚盛医药_小荷才露尖尖角_细胞凋亡赛道大有可为_2023-05-07.pdf'),
          ]
          selected = []
          used = set()
          for keyword, outname in preferences:
              hit = next((r for r in matches if keyword in str(r.get('title', ''))), None)
              if hit:
                  rid = str(hit.get('infoCode') or hit.get('encodeUrl') or '')
                  if rid and rid not in used:
                      selected.append((hit, outname))
                      used.add(rid)
              if len(selected) >= 3:
                  break

          with open('diagnostics/selected.tsv', 'w', encoding='utf-8') as f:
              for r, outname in selected:
                  f.write(f"{outname}\t{r.get('infoCode','')}\t{r.get('encodeUrl','')}\t{r.get('title','')}\n")

          for r, outname in selected:
              ids = [str(r.get('infoCode') or '').strip(), str(r.get('encodeUrl') or '').strip()]
              ids = [x for x in ids if x]
              downloaded = None
              used_url = None
              for rid in ids:
                  candidates = [
                      f'https://pdf.dfcfw.com/pdf/H3_{rid}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H2_{rid}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{rid}.pdf',
                      f'https://pdf.dfcfw.com/pdf/H2_{rid}.pdf',
                  ]
                  for url in candidates:
                      try:
                          req = urllib.request.Request(url, headers={
                              'User-Agent': UA,
                              'Referer': 'https://data.eastmoney.com/',
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                          })
                          b = urllib.request.urlopen(req, timeout=180).read()
                          if b.startswith(b'%PDF-') and len(b) > 100000:
                              downloaded = b
                              used_url = url
                              break
                      except Exception:
                          pass
                  if downloaded is not None:
                      break
              if downloaded is None:
                  with open('diagnostics/download_failures.txt', 'a', encoding='utf-8') as f:
                      f.write(f"{outname}\t{r.get('infoCode','')}\t{r.get('encodeUrl','')}\t{r.get('title','')}\n")
                  continue
              Path('reports', outname).write_bytes(downloaded)
              with open('diagnostics/downloads.tsv', 'a', encoding='utf-8') as f:
                  f.write(f'{outname}\t{used_url}\t{len(downloaded)}\n')

          Path('diagnostics/report_count.txt').write_text(
              str(len(list(Path('reports').glob('*.pdf')))), encoding='utf-8'
          )
          PY

      - name: Verify downloaded PDFs and build manifest
        shell: bash
        run: |
          set -euo pipefail
          count="$(find reports -maxdepth 1 -type f -name '*.pdf' | wc -l)"
          if [ "$count" -ge 2 ]; then
            {
              echo '亚盛医药（06855.HK）券商深度报告来源与校验'
              echo
              for f in reports/*.pdf; do
                test "$(head -c 5 "$f")" = '%PDF-'
                pages="$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')"
                bytes="$(stat -c '%s' "$f")"
                pdftotext -f 1 -l 3 "$f" - | grep -Eiq '亚盛医药|Ascentage|06855|6855'
                echo "文件：$(basename "$f")"
                echo "页数：$pages"
                echo "大小：$bytes 字节"
                echo "SHA-256：$(sha256sum "$f" | awk '{print $1}')"
                echo
              done
            } > reports/来源与校验.txt
          fi

      - name: Upload verified reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascentage-list2-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload list2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascentage-list2-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
