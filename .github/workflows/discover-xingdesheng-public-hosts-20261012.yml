name: Discover Xingdesheng public report hosts 20261012

on:
  push:
    branches:
      - xingdesheng-broker-reports-20261012
    paths:
      - '.github/workflows/discover-xingdesheng-public-hosts-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Inspect report hosts
        run: python scripts/discover_xingdesheng_public_report_hosts_20261012.py
