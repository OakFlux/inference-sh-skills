name: Build Huajin Capital broker archive v2 20261012
# Trigger revision 3: use ReportLab CID font
on:
  push:
    paths:
      - '.github/workflows/build-huajin-capital-000532-broker-archive-v2-20261012.yml'
      - 'scripts/build_huajin_capital_000532_broker_archive_20261012.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 pillow reportlab pypdf
      - name: Patch Chinese font registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_huajin_capital_000532_broker_archive_20261012.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from reportlab.pdfbase.ttfonts import TTFont',
              'from reportlab.pdfbase.cidfonts import UnicodeCIDFont',
          )
          start = text.index('FONT_PATH_CANDIDATES = [')
          end = text.index('\n\n\ndef get(', start)
          replacement = 'pdfmetrics.registerFont(UnicodeCIDFont("STSong-Light"))'
          text = text[:start] + replacement + text[end:]
          text = text.replace('fontName="CJK"', 'fontName="STSong-Light"')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build archive
        shell: bash
        run: |
          python scripts/build_huajin_capital_000532_broker_archive_20261012.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: huajin-capital-000532-broker-archive-20261012
          path: 华金资本_000532_券商深度研究资料_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
