name: Build Fujian Cement official filings package 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fujian-cement-filings-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build verified ZIP package
        run: python scripts/run_fujian_cement_filings_v3_20260929.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fujian-cement-600802-filings-v3-20260929
          path: 福建水泥_600802_2020-2025年报_2026最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
# trigger: corrected SSE fallback wrapper
