name: Inspect Guoxin Health filings

on:
  push:
    paths:
      - '.github/workflows/inspect_guoxin_health_filings_20260929.yml'
      - 'tools/inspect_guoxin_health_filings_20260929.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python tools/inspect_guoxin_health_filings_20260929.py
      - uses: actions/upload-artifact@v4
        with:
          name: guoxin-health-filings-inspection
          path: guoxin_health_filings_inspection.json
          if-no-files-found: error
          retention-days: 3
