name: Discover Qijing Machinery broker reports 20261021

on:
  push:
    branches:
      - qijing-machinery-broker-reports-20261021
    paths:
      - scripts/discover_qijing_machinery_broker_reports_20261021.py
      - .github/workflows/discover-qijing-machinery-broker-reports-20261021.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Discover reports
        run: python scripts/discover_qijing_machinery_broker_reports_20261021.py

      - name: Show summary
        run: cat discovery_qijing_603677/summary.json

      - name: Upload discovery catalog
        uses: actions/upload-artifact@v4
        with:
          name: qijing-machinery-603677-broker-report-catalog-20261021
          path: discovery_qijing_603677/
          if-no-files-found: error
          retention-days: 30
