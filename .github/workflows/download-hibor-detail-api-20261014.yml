name: Download Hibor detail API resources 20261014
on:
  push:
    paths:
      - '.github/workflows/download-hibor-detail-api-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  download:
    runs-on: ubuntu-24.04
    steps:
      - name: Download detail responses
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'}
          for label,ncid,referer in [
            ('178938','066cd115-245c-4102-828c-c37119ac3647','https://www.hibor.com.cn/data/c579f2b23849ad8c2e3f0e2ebe4a6f7f.html'),
            ('182952','197faef3-b9ec-476b-988a-59a013b5a219','https://www.hibor.com.cn/data/3461a4dd219fa77381b748e3df7b8697.html'),
          ]:
              rr=s.post('https://www.hibor.com.cn/hiborweb/DocDetail/NewContent',data={'ncid':ncid},headers={**h,'Referer':referer},timeout=90)
              rr.raise_for_status()
              Path(f'{label}_post.html').write_bytes(rr.content)
              print(label,rr.status_code,rr.headers.get('content-type'),len(rr.content),flush=True)
          PY
      - name: Upload resources
        uses: actions/upload-artifact@v4
        with:
          name: hibor-detail-responses-20261014
          path: '*_post.html'
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
