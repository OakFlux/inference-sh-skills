name: Temporary Nike broker report catalog

on:
  push:
    branches:
      - tmp/download-nike-reports-20260830
    paths:
      - .github/workflows/tmp-nike-report-catalog.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Search public report catalogs and web indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          from urllib.parse import urlencode, quote
          import json, re, subprocess, urllib.request, xml.etree.ElementTree as ET

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          out=Path('diagnostic')

          # Fxbaogao public metadata search.
          fx_api='https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          all_fx=[]
          for kw in ['耐克','Nike','NKE','NIKE公司','耐克公司']:
              for page in range(1,6):
                  body=json.dumps({'keywords':kw,'pageIndex':page,'pageSize':100,'order':2,'nop':-1},ensure_ascii=False).encode('utf-8')
                  req=urllib.request.Request(fx_api,data=body,headers={'User-Agent':UA,'Content-Type':'application/json'},method='POST')
                  try:
                      raw=urllib.request.urlopen(req,timeout=90).read().decode('utf-8','replace')
                  except Exception as e:
                      print('FX_ERR',kw,page,repr(e)); break
                  Path(f'diagnostic/fx_{quote(kw,safe="")}_{page}.json').write_text(raw,encoding='utf-8')
                  obj=json.loads(raw)
                  rows=(obj.get('data') or {}).get('dataList') or []
                  for r in rows:
                      rr=dict(r); rr['_keyword']=kw; all_fx.append(rr)
                  if len(rows)<100: break
          seen={};
          for r in all_fx:
              k=str(r.get('docId') or r.get('id') or json.dumps(r,sort_keys=True,ensure_ascii=False))
              seen[k]=r
          fx=list(seen.values())
          fx.sort(key=lambda r:(r.get('pubTime') or 0,r.get('pageNum') or 0),reverse=True)
          out.joinpath('fxbaogao_results.json').write_text(json.dumps(fx,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FX_COUNT',len(fx))
          for r in fx[:100]:
              print('FX',json.dumps({k:r.get(k) for k in ['docId','title','orgName','pageNum','pubTime','fileName','fileUrl','downloadUrl']},ensure_ascii=False))

          # Bing RSS searches for public PDF/report pages.
          queries=[
              '耐克 券商 深度报告 PDF',
              'Nike 耐克 公司深度 研报 PDF',
              '耐克 首次覆盖 报告 券商',
              'Nike NKE equity research report filetype:pdf',
              'Nike company report broker PDF',
              '耐克 研究报告 华泰 中金 招银 国际 PDF',
              'site:pdf.dfcfw.com 耐克 OR Nike',
              'site:reportify.cn Nike 耐克 研报',
              'site:hangyan.co 耐克 Nike 报告',
              'site:sgpjbg.com 耐克 Nike 券商',
          ]
          bing=[]
          for qi,q in enumerate(queries,1):
              url='https://www.bing.com/search?'+urlencode({'q':q,'format':'rss','count':'50'})
              p=Path(f'diagnostic/bing_{qi}.xml')
              cmd=['curl','--http1.1','-L','--fail','--silent','--show-error','--retry','4','--retry-all-errors','--connect-timeout','20','--max-time','120','-A',UA,'-H','Accept-Encoding: identity',url,'-o',str(p)]
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              print('BING_FETCH',qi,r.returncode,p.stat().st_size if p.exists() else 0,r.stderr[-300:])
              if r.returncode or not p.exists(): continue
              try:
                  root=ET.fromstring(p.read_bytes())
                  for item in root.findall('.//item'):
                      title=(item.findtext('title') or '').strip()
                      link=(item.findtext('link') or '').strip()
                      desc=(item.findtext('description') or '').strip()
                      row={'query':q,'title':title,'link':link,'description':desc}
                      bing.append(row)
                      if any(k.lower() in (title+' '+desc+' '+link).lower() for k in ['nike','耐克','nke']):
                          print('BING',json.dumps(row,ensure_ascii=False))
              except Exception as e:
                  print('BING_PARSE_ERR',qi,repr(e))
          out.joinpath('bing_results.json').write_text(json.dumps(bing,ensure_ascii=False,indent=2),encoding='utf-8')

          # Probe a few known public research databases' search pages.
          urls=[
              'https://www.fxbaogao.com/search?keyword='+quote('耐克'),
              'https://www.sgpjbg.com.cn/search?keyword='+quote('耐克'),
              'https://www.sgpjbg.com/search?keyword='+quote('Nike'),
              'https://www.hangyan.co/search?keyword='+quote('耐克'),
              'https://www.baogaobox.com/search?keyword='+quote('耐克'),
              'https://www.reportify.cn/search?q='+quote('耐克'),
          ]
          for i,u in enumerate(urls,1):
              p=Path(f'diagnostic/site_{i}.html')
              cmd=['curl','--http1.1','-L','--silent','--show-error','--retry','3','--retry-all-errors','--connect-timeout','20','--max-time','120','-A',UA,'-H','Accept-Encoding: identity',u,'-o',str(p)]
              r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              print('SITE_FETCH',i,r.returncode,p.stat().st_size if p.exists() else 0,u,r.stderr[-200:])
              if p.exists():
                  body=p.read_bytes()
                  text=None
                  for enc in ['utf-8','gb18030','latin1']:
                      try: text=body.decode(enc); break
                      except Exception: pass
                  if text:
                      for line in text.splitlines():
                          plain=' '.join(re.sub(r'<[^>]+>',' ',line).split())
                          if any(k.lower() in plain.lower() for k in ['耐克','nike','nke']) and plain:
                              print('SITE_LINE',i,plain[:2500])

          PY

      - name: Upload catalog diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nike-broker-report-catalog
          path: diagnostic/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
