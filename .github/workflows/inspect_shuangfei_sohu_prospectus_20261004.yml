name: Inspect Shuangfei Sohu prospectus
on:
  push:
    paths:
      - '.github/workflows/inspect_shuangfei_sohu_prospectus_20261004.yml'
      - 'tools/inspect_shuangfei_sohu_prospectus_20261004.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/inspect_shuangfei_sohu_prospectus_20261004.py
      - uses: actions/upload-artifact@v4
        with:
          name: shuangfei-sohu-prospectus-inspection
          path: shuangfei_sohu_prospectus.json
          if-no-files-found: error
          retention-days: 3
