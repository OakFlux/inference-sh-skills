name: Package verified Biyi Micro broker reports

on:
  push:
    branches:
      - tmp/biyi-broker-reports-20260830

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: python -m pip install --quiet requests pypdf pymupdf

      - name: Download, verify, and package reports
        run: python .github/scripts/package_biyi_broker_reports.py

      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: biyi-broker-reports
          path: 必易微_券商深度报告_3份_完整PDF.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
