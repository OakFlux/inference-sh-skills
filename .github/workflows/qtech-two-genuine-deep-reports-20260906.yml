name: Package two genuine Q Technology deep research reports 20260906

on:
  push:
    paths:
      - '.github/workflows/qtech-two-genuine-deep-reports-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pymupdf

      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from pypdf import PdfReader

          PACKAGE = '丘钛科技_券商深度报告_完整PDF_2份'
          out = Path(PACKAGE)
          work = Path('_qtech_two_deep_work')
          renders = work / 'renders'
          out.mkdir(exist_ok=True)
          work.mkdir(exist_ok=True)
          renders.mkdir(exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'broker': '开源证券',
                  'date': '2025-03-10',
                  'title': '手机光学驱动利润弹性，汽车及XR提振估值',
                  'report_type': '港股公司首次覆盖报告',
                  'authors': '吴柳燕、张可',
                  'rating': '买入（首次覆盖）',
                  'expected_pages': 18,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202503101644231408_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202503101644231408_1.pdf?download=1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP202503101644231408_1.pdf',
                  ],
                  'referers': [
                      'https://data.eastmoney.com/report/zw_stock.jshtml?infocode=AP202503101644231408',
                      'https://data.eastmoney.com/report/',
                      'https://www.baidu.com/',
                  ],
              },
              {
                  'order': 2,
                  'broker': '广发证券',
                  'date': '2017-04-18',
                  'title': '丘钛科技公司深度报告',
                  'report_type': '公司深度报告',
                  'authors': '见原报告',
                  'rating': '见原报告',
                  'expected_pages': 27,
                  'urls': [
                      'https://img3.gelonghui.com/pdf201704/pdf20170418112710548.pdf',
                      'http://img3.gelonghui.com/pdf201704/pdf20170418112710548.pdf',
                  ],
                  'referers': [
                      'https://www.gelonghui.com/',
                      'https://www.baidu.com/',
                  ],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          base_headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Connection': 'close',
          }

          def fetch_pdf(cfg):
              errors = []
              for url in cfg['urls']:
                  for referer in cfg['referers']:
                      for attempt in range(1, 5):
                          try:
                              headers = {**base_headers, 'Referer': referer}
                              r = session.get(url, headers=headers, timeout=(30, 300), allow_redirects=True)
                              print('GET', cfg['broker'], attempt, r.status_code, len(r.content), r.headers.get('content-type'), url, 'referer', referer, flush=True)
                              if r.status_code == 200 and r.content.startswith(b'%PDF-') and len(r.content) > 100000:
                                  return r.content, str(r.url), referer
                              errors.append(f'{url} :: {referer} :: HTTP {r.status_code}/{len(r.content)}')
                          except Exception as exc:
                              errors.append(f'{url} :: {referer} :: {repr(exc)}')
                          time.sleep(min(2 * attempt, 8))
              raise RuntimeError(' | '.join(errors[-12:]))

          def extract_opening_text(path: Path, limit: int = 10) -> str:
              reader = PdfReader(str(path), strict=False)
              parts = []
              for page in reader.pages[:min(limit, len(reader.pages))]:
                  try:
                      parts.append(page.extract_text() or '')
                  except Exception:
                      pass
              return '\n'.join(parts)

          def validate(path: Path, cfg):
              data = path.read_bytes()
              if not data.startswith(b'%PDF-'):
                  raise RuntimeError('Invalid PDF signature')
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != cfg['expected_pages']:
                  raise RuntimeError(f'Page count mismatch for {cfg["broker"]}: {pages} vs {cfg["expected_pages"]}')
              text = extract_opening_text(path)
              compact = re.sub(r'\s+', '', text).lower()
              if not any(term in compact for term in ('丘钛科技', '丘鈦科技', 'qtechnology', '01478', '1478hk')):
                  raise RuntimeError(f'Company identity not found for {cfg["broker"]}')
              q = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError('qpdf check failed: ' + q.stderr[-1000:])
              doc = pymupdf.open(str(path))
              sample_pages = sorted(set([0, pages // 2, pages - 1]))
              rendered = []
              for pno in sample_pages:
                  pix = doc.load_page(pno).get_pixmap(matrix=pymupdf.Matrix(1.2, 1.2), alpha=False)
                  rp = renders / f'{cfg["order"]:02d}_{pno + 1:03d}.png'
                  pix.save(str(rp))
                  if rp.stat().st_size < 8000 or pix.width < 500 or pix.height < 600:
                      raise RuntimeError(f'Render check failed on page {pno + 1}')
                  rendered.append({'page': pno + 1, 'width': pix.width, 'height': pix.height, 'bytes': rp.stat().st_size})
              doc.close()
              return {
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'rendered_pages': rendered,
                  'opening_text_preview': re.sub(r'\s+', ' ', text)[:1500],
              }

          records = []
          seen_hashes = set()
          for cfg in reports:
              data, source_url, referer = fetch_pdf(cfg)
              safe_title = re.sub(r'[\\/:*?"<>|\s]+', '_', cfg['title']).strip('_')[:65]
              filename = f"{cfg['order']:02d}_{cfg['broker']}_{safe_title}_{cfg['date'].replace('-', '')}.pdf"
              path = out / filename
              path.write_bytes(data)
              checks = validate(path, cfg)
              if checks['sha256'] in seen_hashes:
                  raise RuntimeError('Duplicate PDF files detected')
              seen_hashes.add(checks['sha256'])
              record = {
                  'filename': filename,
                  'broker': cfg['broker'],
                  'title': cfg['title'],
                  'date': cfg['date'],
                  'report_type': cfg['report_type'],
                  'authors': cfg['authors'],
                  'rating': cfg['rating'],
                  'source_url': source_url,
                  'successful_referer': referer,
                  **checks,
              }
              records.append(record)
              print('VALIDATED', json.dumps({k: record[k] for k in ('broker','title','date','pages','bytes','sha256','source_url')}, ensure_ascii=False), flush=True)

          lines = [
              '丘钛科技（01478.HK）券商深度报告',
              '',
              '本包包含2份可离线打开的完整原始券商PDF，不含网页链接、快捷方式、二维码、摘要卡片或摘录版。',
              '',
          ]
          for i, r in enumerate(records, 1):
              lines += [
                  f"{i}. {r['broker']}：《{r['title']}》",
                  f"   日期：{r['date']}；类型：{r['report_type']}；作者：{r['authors']}；评级：{r['rating']}",
                  f"   实际页数：{r['pages']}页；文件大小：{r['bytes']/1048576:.2f} MB",
                  f"   来源：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          lines += [
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页/中间页/末页渲染、SHA-256及ZIP CRC。',
              '报告观点、评级、预测和目标价均对应历史发布时点，不构成当前投资建议。',
          ]
          (out / '报告清单与核验说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as zf:
              for p in sorted(out.iterdir()):
                  zf.write(p, arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failed: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'Expected 2 PDFs, found {len(pdfs)}')
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDFS', len(records), 'PAGES', sum(x['pages'] for x in records), flush=True)
          print('MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: qtech-two-genuine-deep-reports-final
          path: 丘钛科技_券商深度报告_完整PDF_2份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtech-two-genuine-deep-reports-diagnostics
          path: _qtech_two_deep_work/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6
