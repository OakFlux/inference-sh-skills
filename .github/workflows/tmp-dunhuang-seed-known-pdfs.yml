name: Temporary Dunhuang Seed verified PDF package

on:
  push:
    branches:
      - 'tmp/dunhuang-seed-known-pdfs-20260829'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF validation tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Download, validate, render-check and package reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reports diagnostics/renders
          cat > /tmp/package.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import urllib.parse
          import zipfile
          from pathlib import Path

          from pypdf import PdfReader

          DIST = Path('dist')
          REPORTS = DIST / 'reports'
          RENDERS = Path('diagnostics/renders')
          REPORTS.mkdir(parents=True, exist_ok=True)
          RENDERS.mkdir(parents=True, exist_ok=True)
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'

          items = [
              {
                  'doc_id': 191417,
                  'date': '2023-05-18',
                  'broker': '西南证券',
                  'title': '公司深度报告：积极布局种业振兴，国企改革稳步推进',
                  'pdf_path': 'report/2023/05/18/191417.pdf',
                  'expected_pages': 21,
                  'type': '公司深度报告',
              },
              {
                  'doc_id': 40314,
                  'date': '2011-08-03',
                  'broker': '长江证券',
                  'title': '调研报告：看好先锋系列继续扩张，期待母公司经营调整',
                  'pdf_path': 'report/2011/08/03/40314.pdf',
                  'expected_pages': 7,
                  'type': '公司调研报告',
              },
              {
                  'doc_id': 3951,
                  'date': '2009-06-17',
                  'broker': '国海证券',
                  'title': '公司迎来快速发展',
                  'pdf_path': 'report/2009/06/17/3951.pdf',
                  'expected_pages': 9,
                  'type': '公司研究报告',
              },
          ]

          def safe(value: str, limit: int = 90) -> str:
              value = re.sub(r'[\\/:*?"<>|\r\n]+', '_', value)
              value = re.sub(r'\s+', '', value).strip(' ._')
              return (value or '敦煌种业公司研究报告')[:limit]

          def fetch(url: str, output: Path, referer: str) -> tuple[bool, str, str]:
              output.unlink(missing_ok=True)
              proc = subprocess.run([
                  'curl', '--http1.1', '--location', '--fail', '--silent', '--show-error',
                  '--retry', '7', '--retry-all-errors', '--retry-delay', '1',
                  '--connect-timeout', '20', '--max-time', '300',
                  '--user-agent', UA,
                  '--referer', referer,
                  '--header', 'Accept-Encoding: identity',
                  '--header', 'Accept: application/pdf,application/octet-stream,*/*',
                  '--output', str(output),
                  '--write-out', '%{url_effective}',
                  url,
              ], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              return proc.returncode == 0, proc.stderr[-1500:], proc.stdout.strip()

          results = []
          temp = DIST / '_candidate.pdf'

          for index, item in enumerate(items, 1):
              title_name = urllib.parse.quote(item['title'] + '.pdf')
              sources = [
                  'https://public.fxbaogao.com/' + item['pdf_path'],
                  'https://www.fxbaogao.com/download?id=' + str(item['doc_id']) + '&name=' + title_name,
              ]
              errors = []
              accepted = False
              for source in sources:
                  ok, error, effective = fetch(
                      source,
                      temp,
                      'https://www.fxbaogao.com/detail/' + str(item['doc_id']),
                  )
                  if not ok:
                      errors.append({'url': source, 'error': error})
                      continue
                  try:
                      raw = temp.read_bytes()
                      if len(raw) < 100_000 or not raw.startswith(b'%PDF-'):
                          raise RuntimeError(f'not PDF: {len(raw)} bytes, head={raw[:40]!r}')
                      reader = PdfReader(str(temp), strict=False)
                      pages = len(reader.pages)
                      if pages != item['expected_pages']:
                          raise RuntimeError(f'page mismatch: expected {item["expected_pages"]}, got {pages}')
                      text_parts = []
                      for page in reader.pages[:min(15, pages)]:
                          try:
                              text_parts.append(page.extract_text() or '')
                          except Exception:
                              pass
                      compact = re.sub(r'\s+', '', ' '.join(text_parts))
                      if '敦煌种业' not in compact and '600354' not in compact:
                          raise RuntimeError('company identity not found')
                      digest = hashlib.sha256(raw).hexdigest()
                      filename = (
                          f'{item["date"]}_{safe(item["broker"],24)}_'
                          f'{safe(item["title"])}_{pages}页.pdf'
                      )
                      destination = REPORTS / filename
                      destination.write_bytes(raw)

                      for page_no, label in ((1, 'first'), (pages, 'last')):
                          prefix = RENDERS / f'{index:02d}_{label}'
                          subprocess.run([
                              'pdftoppm', '-f', str(page_no), '-l', str(page_no),
                              '-png', '-r', '140', str(destination), str(prefix),
                          ], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      images = list(RENDERS.glob(f'{index:02d}_*.png'))
                      if len(images) < 2 or any(image.stat().st_size < 10_000 for image in images):
                          raise RuntimeError('render verification failed')

                      record = {
                          **item,
                          'filename': filename,
                          'pages': pages,
                          'size': len(raw),
                          'sha256': digest,
                          'source_url': source,
                          'effective_url': effective,
                      }
                      results.append(record)
                      print('VALIDATED', json.dumps(record, ensure_ascii=False))
                      accepted = True
                      break
                  except Exception as exc:
                      errors.append({'url': source, 'effective': effective, 'error': repr(exc)})
                  finally:
                      temp.unlink(missing_ok=True)
              if not accepted:
                  raise RuntimeError(f'Failed to validate doc {item["doc_id"]}: {errors}')

          manifest = [
              '敦煌种业（600354）券商公司研究报告资料包',
              '收录1份公司深度报告、1份公司调研报告、1份公司研究报告。',
              '三份均为公开静态路径取得的原始PDF，不是网页打印版、图片拼接版或内容重制版。',
              '已核验PDF文件头、公司名称、实际页数和SHA-256，并渲染检查首页与末页。',
              '公开深度覆盖较少，后两份历史报告篇幅分别为7页和9页。',
              '资料仅供研究参考，请遵守原报告版权声明和使用限制。',
              '',
          ]
          for i, item in enumerate(results, 1):
              manifest += [
                  f'{i}. {item["title"]}',
                  f'   类型：{item["type"]}',
                  f'   券商：{item["broker"]}',
                  f'   日期：{item["date"]}',
                  f'   页数：{item["pages"]}',
                  f'   文件：{item["filename"]}',
                  f'   SHA-256：{item["sha256"]}',
                  f'   公开来源：{item["effective_url"] or item["source_url"]}',
                  '',
              ]
          (REPORTS / '资料清单与校验信息.txt').write_text('\n'.join(manifest), encoding='utf-8')
          Path('diagnostics/results.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')

          final_zip = DIST / '敦煌种业_券商深度及公司研究报告_3份_完整原始PDF.zip'
          with zipfile.ZipFile(final_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(REPORTS.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(final_zip, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure: {bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'PDF count mismatch: {pdfs}')
          print('FINAL_ZIP', final_zip, final_zip.stat().st_size)
          PY
          python /tmp/package.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dunhuang-seed-verified-original-pdfs
          path: dist/敦煌种业_券商深度及公司研究报告_3份_完整原始PDF.zip
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunhuang-seed-verified-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
