name: Temporary New Hope Service Fxbaogao API detail

on:
  push:
    branches:
      - tmp/download-newhope-service-reports-20260828
    paths:
      - .github/workflows/tmp-newhope-fxbaogao-api-detail.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Query public report detail endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          get() {
            local name="$1"; local url="$2"
            echo "$url" > "diagnostic/${name}.url"
            curl -L --compressed --retry 4 --retry-all-errors --connect-timeout 30 --max-time 180 \
              -A "$UA" -e 'https://www.fxbaogao.com/detail/5488726' -H 'Accept: application/json,*/*' \
              -D "diagnostic/${name}.headers" "$url" -o "diagnostic/${name}.body" || true
          }
          get detail0 'https://api.fxbaogao.com/mofoun/report/searchReportData/detail/anon?chartId=5488726&needParas=0'
          get detail1 'https://api.fxbaogao.com/mofoun/report/searchReportData/detail/anon?chartId=5488726&needParas=1'
          get preview 'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId=5488726'
          get download_cfg 'https://api.fxbaogao.com/mofoun/report/report/getReportDownloadConfig'
          get domain_switch 'https://api.fxbaogao.com/mofoun/common/bizSwitch/forDomainSwitch'
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          for p in sorted(Path('diagnostic').glob('*.body')):
              raw=p.read_bytes()
              print('\n===== ',p.name,len(raw),' bytes =====')
              print(raw[:50000].decode('utf-8','replace'))
              try:
                  obj=json.loads(raw)
                  Path(str(p)+'.pretty.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
              except Exception: pass
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: newhope-fxbaogao-api-detail
          path: diagnostic/
          retention-days: 1
          if-no-files-found: error
