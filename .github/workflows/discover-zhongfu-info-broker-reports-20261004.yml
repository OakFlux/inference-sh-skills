name: Discover Zhongfu Information broker reports 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-zhongfu-info-broker-reports-20261004.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pypdf
      - run: python scripts/discover_zhongfu_info_broker_reports_20261004.py
