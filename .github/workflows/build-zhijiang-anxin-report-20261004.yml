name: Build verified Zhijiang Anxin report PDF 20261004

on:
  push:
    paths:
      - '.github/workflows/build-zhijiang-anxin-report-20261004.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Download available public report pages and build PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, time
          import requests
          from PIL import Image
          from pypdf import PdfReader

          out = Path('output'); pages = out / 'pages'; renders = out / 'renders'
          pages.mkdir(parents=True, exist_ok=True); renders.mkdir(parents=True, exist_ok=True)
          base = 'https://public.fxbaogao.com/report-image/2019/09/04/1408531-{}.png'
          session = requests.Session(); session.trust_env = False
          headers = {'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/detail/1408531'}
          downloaded=[]
          for index in range(1, 20):
              url=base.format(index)
              r=session.get(url,headers=headers,timeout=90)
              print('PAGE',index,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),flush=True)
              if r.status_code==200 and r.content[:8]==b'\x89PNG\r\n\x1a\n' and len(r.content)>10000:
                  path=pages/f'{index:03d}.png'; path.write_bytes(r.content); downloaded.append(path)
              elif downloaded:
                  break
              time.sleep(0.05)
          if len(downloaded) < 2:
              raise RuntimeError(f'only {len(downloaded)} pages downloaded')
          images=[]
          for path in downloaded:
              im=Image.open(path)
              if im.mode!='RGB': im=im.convert('RGB')
              images.append(im.copy())
          pdf=out/'20190902_安信证券_之江生物_公开可得版.pdf'
          images[0].save(pdf,save_all=True,append_images=images[1:],resolution=150.0)
          for im in images: im.close()
          subprocess.run(['qpdf','--check',str(pdf)],check=True)
          reader=PdfReader(str(pdf)); count=len(reader.pages)
          if count != len(downloaded): raise RuntimeError((count,len(downloaded)))
          for page,label in [(1,'first'),(count,'last')]:
              prefix=renders/label
              subprocess.run(['pdftoppm','-f',str(page),'-l',str(page),'-r','100','-png','-singlefile',str(pdf),str(prefix)],check=True)
              png=Path(str(prefix)+'.png')
              if not png.exists() or png.stat().st_size<3000: raise RuntimeError('render failed')
          h=hashlib.sha256(pdf.read_bytes()).hexdigest()
          meta={'title':'之江生物（834839）：专注分子诊断领域，产品被WHO批准纳入官方采购名录','broker':'安信证券','author':'诸海滨','date':'2019-09-02','available_pages':count,'bytes':pdf.stat().st_size,'sha256':h,'source_page':'https://www.fxbaogao.com/detail/1408531','scope_note':'由公开可访问页面图像合成；是否等同原报告全部页数须以原发布方为准'}
          (out/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('META',json.dumps(meta,ensure_ascii=False),flush=True)
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: zhijiang-anxin-report
          path: output
          compression-level: 0
          retention-days: 7
