name: Build Xiangrikui 300111 filings 20261012

on:
  push:
    paths:
      - '.github/workflows/build-xiangrikui-300111-filings-20261012.yml'
      - 'scripts/build_xiangrikui_300111_filings_20261012.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        run: python scripts/build_xiangrikui_300111_filings_20261012.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xiangrikui-300111-filings-20261012
          path: 向日葵_300111_2020-2025年报_2026最新季报及半年报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
