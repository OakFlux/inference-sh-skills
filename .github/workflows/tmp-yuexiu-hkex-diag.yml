name: Temporary Yuexiu HKEX diagnostics

on:
  push:
    branches:
      - tmp-yuexiu-reports-20260827

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect filtered HKEX searches
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          tests=[
            ('annual_all','https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&from=20210401&lang=EN&market=SEHK&stockId=201&t1code=40000&t2Gcode=-1&t2code=40100&to=20260531'),
            ('annual_2021','https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&from=20220401&lang=EN&market=SEHK&stockId=201&t1code=40000&t2Gcode=-1&t2code=40100&to=20220531'),
            ('interim_2025_guess','https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&from=20250901&lang=EN&market=SEHK&stockId=201&t1code=40000&t2Gcode=-1&t2code=40200&to=20251031'),
            ('interim_2025_all','https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&from=20250901&lang=EN&market=SEHK&stockId=201&to=20251031'),
          ]
          for name,url in tests:
            r=s.get(url,timeout=60)
            print('\nTEST',name,'STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url)
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              if 'annual report' in text.lower() or 'interim report' in text.lower():
                print(' REPORT',repr(text),href)
          PY
