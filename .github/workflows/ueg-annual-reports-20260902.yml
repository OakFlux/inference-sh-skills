name: Package United Energy Group annual reports

on:
  push:
    paths:
      - '.github/workflows/ueg-annual-reports-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from pypdf import PdfReader

          COMPANY_CN = '联合能源集团'
          COMPANY_EN = 'UNITED ENERGY GROUP LIMITED'
          CODE = '00467.HK'
          STOCK_ID = '943'
          PACKAGE = '联合能源集团_00467HK_2020-2025年报及最新财务披露'
          OUT = Path(PACKAGE)
          WORK = Path('_ueg_annual_work')
          PREVIEW = WORK / 'preview'

          for path in (OUT, WORK):
              if path.exists():
                  shutil.rmtree(path)
          OUT.mkdir(parents=True)
          PREVIEW.mkdir(parents=True)

          zip_path = Path(f'{PACKAGE}.zip')
          zip_path.unlink(missing_ok=True)
          Path('FINAL_ZIP_SHA256.txt').unlink(missing_ok=True)

          session = requests.Session()
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          search_headers = {
              'User-Agent': ua,
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/search/titlesearch.xhtml',
              'X-Requested-With': 'XMLHttpRequest',
          }
          pdf_headers = {
              'User-Agent': ua,
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8',
          }

          def compact(value: str) -> str:
              return re.sub(r'[^A-Z0-9\u4e00-\u9fff]+', '', value.upper())

          def chinese_year(year: int) -> str:
              digits = '零一二三四五六七八九'
              return ''.join(digits[int(ch)] for ch in str(year))

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def parse_result(response: requests.Response) -> list[dict]:
              payload = response.json()
              result = payload.get('result', []) if isinstance(payload, dict) else payload
              if isinstance(result, str):
                  result = json.loads(result)
              if not isinstance(result, list):
                  raise RuntimeError(f'Unexpected HKEX result type: {type(result).__name__}')
              return [row for row in result if isinstance(row, dict)]

          def hkex_rows(from_date: str, to_date: str, t1code: str, lang: str) -> list[dict]:
              endpoint = 'https://www1.hkexnews.hk/search/titleSearchServlet.do'
              params = {
                  'sortDir': '1',
                  'sortByOptions': 'DateTime',
                  'category': '0',
                  'market': 'SEHK',
                  'stockId': STOCK_ID,
                  'documentType': '-1',
                  'fromDate': from_date,
                  'toDate': to_date,
                  'title': '',
                  'searchType': '1',
                  't1code': t1code,
                  't2Gcode': '-2',
                  't2code': '-2',
                  'rowRange': '200',
                  'lang': lang,
              }
              errors = []
              for attempt in range(1, 5):
                  try:
                      response = session.get(endpoint, params=params, headers=search_headers, timeout=(30, 240))
                      print('HKEX_SEARCH', from_date, to_date, t1code, lang, response.status_code, len(response.content), response.url, flush=True)
                      response.raise_for_status()
                      rows = parse_result(response)
                      for row in rows:
                          row['_lang'] = lang
                      print('HKEX_ROWS', from_date, to_date, t1code, lang, len(rows), flush=True)
                      return rows
                  except Exception as exc:
                      errors.append(repr(exc))
                      time.sleep(2 * attempt)
              raise RuntimeError(f'HKEX search failed: {errors[-4:]}')

          def source_from_row(row: dict) -> dict:
              link = html.unescape(str(row.get('FILE_LINK') or '')).strip()
              if not link:
                  raise RuntimeError(f'HKEX row has no FILE_LINK: {row}')
              if link.startswith('/'):
                  link = urljoin('https://www1.hkexnews.hk', link)
              return {
                  'url': link,
                  'title': html.unescape(str(row.get('TITLE') or '')).strip(),
                  'release_time': str(row.get('DATE_TIME') or '').strip(),
                  'file_info': str(row.get('FILE_INFO') or '').strip(),
                  'language': '繁体中文' if row.get('_lang') == 'zh' else '英文',
                  'hkex_news_id': str(row.get('NEWS_ID') or '').strip(),
              }

          def annual_sources(year: int) -> list[dict]:
              selected = []
              for lang in ('zh', 'en'):
                  rows = hkex_rows(f'{year + 1}0101', f'{year + 1}0630', '40000', lang)
                  for row in rows:
                      title = compact(html.unescape(str(row.get('TITLE') or '')))
                      long_text = compact(html.unescape(str(row.get('LONG_TEXT') or '')))
                      is_annual = (
                          'ANNUALREPORT' in title
                          or title.endswith('年報')
                          or title.endswith('年报')
                          or '[ANNUALREPORT]' in long_text
                          or '[年報]' in long_text
                          or '[年报]' in long_text
                      )
                      if not is_annual:
                          continue
                      if lang == 'en' and str(year) not in title:
                          continue
                      selected.append(source_from_row(row))
              if not selected:
                  raise RuntimeError(f'No annual report found for {year}')
              print('ANNUAL_SOURCES', year, json.dumps(selected, ensure_ascii=False), flush=True)
              return selected

          def latest_interim_sources() -> list[dict]:
              selected = []
              for lang in ('zh', 'en'):
                  for row in hkex_rows('20260801', '20260902', '-2', lang):
                      title = compact(html.unescape(str(row.get('TITLE') or '')))
                      english_match = 'INTERIMRESULTS' in title and '2026' in title
                      chinese_match = ('中期業績' in title or '中期业绩' in title) and chinese_year(2026) in title
                      if english_match or chinese_match:
                          selected.append(source_from_row(row))
              if not selected:
                  raise RuntimeError('No 2026 interim-results announcement found')
              print('INTERIM_SOURCES', json.dumps(selected, ensure_ascii=False), flush=True)
              return selected

          def latest_quarter_sources() -> list[dict]:
              selected = []
              for lang in ('zh', 'en'):
                  for row in hkex_rows('20260101', '20260228', '-2', lang):
                      title = compact(html.unescape(str(row.get('TITLE') or '')))
                      english_match = all(term in title for term in ('OPERATIONALUPDATE', 'FOURTHQUARTER', '2025'))
                      chinese_match = (
                          ('第四季度' in title or '第四季' in title)
                          and chinese_year(2025) in title
                          and any(term in title for term in ('營運資料更新', '营运资料更新', '經營更新', '经营更新', '營運更新', '营运更新'))
                      )
                      if english_match or chinese_match:
                          selected.append(source_from_row(row))
              if not selected:
                  raise RuntimeError('No 2025 fourth-quarter operational update found')
              print('QUARTER_SOURCES', json.dumps(selected, ensure_ascii=False), flush=True)
              return selected

          def fetch_pdf(url: str) -> tuple[bytes, str]:
              errors = []
              for attempt in range(1, 5):
                  for referer in ('https://www1.hkexnews.hk/', 'https://www.hkexnews.hk/'):
                      try:
                          response = session.get(
                              url,
                              headers={**pdf_headers, 'Referer': referer},
                              timeout=(30, 900),
                              allow_redirects=True,
                          )
                          print('PDF_GET', url, response.status_code, response.headers.get('content-type'), len(response.content), response.url, flush=True)
                          if response.status_code == 200 and response.content.startswith(b'%PDF-') and len(response.content) > 50000:
                              return response.content, response.url
                          errors.append(f'{response.status_code}/{len(response.content)}')
                      except Exception as exc:
                          errors.append(repr(exc))
                  time.sleep(2 * attempt)
              raise RuntimeError('; '.join(errors[-8:]))

          def extract_text(path: Path, pages: int) -> str:
              texts = []
              reader = PdfReader(str(path), strict=False)
              for page in reader.pages[:min(60, pages)]:
                  try:
                      texts.append(page.extract_text() or '')
                  except Exception as exc:
                      print('PYPDF_TEXT_WARNING', path.name, repr(exc), flush=True)
              process = subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(60, pages)), str(path), '-'],
                  capture_output=True,
              )
              if process.stdout:
                  texts.append(process.stdout.decode('utf-8', errors='replace'))
              return '\n'.join(texts)

          def validate_pdf(path: Path, expected_year: int, kind: str, min_pages: int) -> dict:
              with path.open('rb') as handle:
                  if handle.read(5) != b'%PDF-':
                      raise RuntimeError('PDF signature missing')

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < min_pages:
                  raise RuntimeError(f'only {pages} pages; expected at least {min_pages}')

              normalized = compact(extract_text(path, pages))
              company_markers = (
                  compact(COMPANY_EN),
                  'UNITEDENERGYGROUP',
                  compact('聯合能源集團'),
                  compact('联合能源集团'),
              )
              if not any(marker in normalized for marker in company_markers):
                  raise RuntimeError('company identity missing from extracted text')

              year_markers = (str(expected_year), chinese_year(expected_year))
              if not any(marker in normalized for marker in year_markers):
                  raise RuntimeError(f'year {expected_year} missing from extracted text')

              if kind == '年度报告':
                  type_markers = ('ANNUALREPORT', '年報', '年报', '年度報告', '年度报告')
              elif kind == '中期业绩公告':
                  type_markers = ('INTERIMRESULTS', '中期業績', '中期业绩', 'SIXMONTHSENDED30JUNE')
              else:
                  type_markers = ('OPERATIONALUPDATE', 'FOURTHQUARTER', '第四季度', '第四季', '營運資料更新', '营运资料更新')
              if not any(marker in normalized for marker in type_markers):
                  raise RuntimeError(f'{kind} marker missing from extracted text')

              check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed: {check.stderr[-800:]}')

              for label, page_no in (('first', 1), ('last', pages)):
                  prefix = PREVIEW / f'{path.stem}_{label}'
                  subprocess.run(
                      ['pdftoppm', '-f', str(page_no), '-singlefile', '-png', '-r', '80', str(path), str(prefix)],
                      check=True,
                      capture_output=True,
                  )
                  rendered = Path(str(prefix) + '.png')
                  if not rendered.exists() or rendered.stat().st_size < 1000:
                      raise RuntimeError(f'{label}-page render verification failed')

              return {
                  'pages': pages,
                  'bytes': path.stat().st_size,
                  'sha256': sha256(path),
              }

          def obtain(expected_year: int, kind: str, filename_prefix: str, sources: list[dict], min_pages: int) -> dict:
              errors = []
              seen_urls = set()
              for index, source in enumerate(sources, 1):
                  url = source['url']
                  if url in seen_urls:
                      continue
                  seen_urls.add(url)
                  temp = WORK / f'{filename_prefix}_{index}.pdf'
                  try:
                      pdf_bytes, final_url = fetch_pdf(url)
                      temp.write_bytes(pdf_bytes)
                      meta = validate_pdf(temp, expected_year, kind, min_pages)
                      filename = f'{filename_prefix}_{meta["pages"]}页.pdf'
                      destination = OUT / filename
                      shutil.copy2(temp, destination)
                      record = {
                          'filename': filename,
                          'period': expected_year,
                          'report_type': kind,
                          'language': source['language'],
                          'hkex_title': source['title'],
                          'release_time': source['release_time'],
                          'hkex_news_id': source['hkex_news_id'],
                          'listed_file_size': source['file_info'],
                          'requested_url': url,
                          'source_url': final_url,
                          **meta,
                      }
                      print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)
                      return record
                  except Exception as exc:
                      errors.append(f'{url}: {exc}')
                      print('REJECTED', expected_year, kind, url, repr(exc), flush=True)
                      temp.unlink(missing_ok=True)
              raise RuntimeError(f'All candidates failed for {filename_prefix}:\n' + '\n'.join(errors))

          records = []
          for sequence, year in enumerate(range(2020, 2026), 1):
              records.append(
                  obtain(
                      expected_year=year,
                      kind='年度报告',
                      filename_prefix=f'{sequence:02d}_{COMPANY_CN}_{year}年年度报告',
                      sources=annual_sources(year),
                      min_pages=100,
                  )
              )

          records.append(
              obtain(
                  expected_year=2026,
                  kind='中期业绩公告',
                  filename_prefix=f'07_{COMPANY_CN}_2026年中期业绩公告_截至2026年6月30日',
                  sources=latest_interim_sources(),
                  min_pages=20,
              )
          )

          records.append(
              obtain(
                  expected_year=2025,
                  kind='季度经营更新',
                  filename_prefix=f'08_{COMPANY_CN}_2025年第四季度经营更新',
                  sources=latest_quarter_sources(),
                  min_pages=3,
              )
          )

          if len(records) != 8:
              raise RuntimeError(f'Expected 8 verified PDFs, got {len(records)}')
          if len({record['sha256'] for record in records}) != 8:
              raise RuntimeError('Duplicate PDF detected')

          with (OUT / '来源与校验清单.csv').open('w', encoding='utf-8-sig', newline='') as handle:
              fields = [
                  '序号', '文件名', '报告期', '报告类型', '语言', '港交所披露标题', '披露时间',
                  '页数', '文件大小_字节', 'SHA256', '港交所原始PDF地址', 'HKEX_NEWS_ID'
              ]
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for index, record in enumerate(records, 1):
                  writer.writerow({
                      '序号': index,
                      '文件名': record['filename'],
                      '报告期': record['period'],
                      '报告类型': record['report_type'],
                      '语言': record['language'],
                      '港交所披露标题': record['hkex_title'],
                      '披露时间': record['release_time'],
                      '页数': record['pages'],
                      '文件大小_字节': record['bytes'],
                      'SHA256': record['sha256'],
                      '港交所原始PDF地址': record['source_url'],
                      'HKEX_NEWS_ID': record['hkex_news_id'],
                  })

          explanation = [
              f'{COMPANY_CN}（United Energy Group Limited，{CODE}）',
              '2020—2025年年度报告及最新财务披露资料包',
              '',
              '一、收录文件',
          ]
          for index, record in enumerate(records, 1):
              explanation.append(
                  f"{index}. {record['filename']}｜{record['report_type']}｜{record['language']}｜{record['pages']}页｜披露时间：{record['release_time']}"
              )
          explanation += [
              '',
              '二、“最新季报”的口径说明',
              '联合能源集团为香港联交所主板上市公司，并无按A股口径强制发布第一季度、第三季度财务报告的常规定期披露安排。',
              '截至2026年9月2日，最新正式财务披露为2026年8月31日发布的截至2026年6月30日止六个月中期业绩公告，本包将其作为最新财务定期披露收录。',
              '公司最近一份明确按季度发布的经营资料为2026年1月30日披露的2025年第四季度经营更新，本包亦同时收录，以覆盖季度经营口径。',
              '',
              '三、核验项目',
              '每份PDF均已核对文件头、公司名称、报告期、报告类型、实际页数、qpdf结构、首页与末页渲染、SHA-256及重复文件。',
              '压缩包已执行ZIP CRC完整性检查。所有PDF均来自香港交易所披露易原始文件。',
              '',
              '资料仅供研究使用，版权归联合能源集团及香港交易所相关披露平台所有，不构成投资建议。',
          ]
          (OUT / '资料包说明.txt').write_text('\n'.join(explanation), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{record['sha256']}  {record['filename']}\n" for record in records),
              encoding='utf-8',
          )

          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 8:
                  raise RuntimeError(f'ZIP contains {len(pdf_names)} PDFs instead of 8')

          bundle_sha = sha256(zip_path)
          Path('FINAL_ZIP_SHA256.txt').write_text(f'{bundle_sha}  {zip_path.name}\n', encoding='utf-8')
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, bundle_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: ueg-annual-reports-20260902-final
          path: |
            联合能源集团_00467HK_2020-2025年报及最新财务披露.zip
            FINAL_ZIP_SHA256.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
