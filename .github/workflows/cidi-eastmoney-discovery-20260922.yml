name: Discover CIDI reports on Eastmoney 20260922
on:
  push:
    paths:
      - '.github/workflows/cidi-eastmoney-discovery-20260922.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Query Eastmoney report interfaces
        run: python scripts/discover_cidi_eastmoney_reports.py
      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: cidi-eastmoney-discovery
          path: cidi_eastmoney_discovery
          if-no-files-found: error
          retention-days: 7
