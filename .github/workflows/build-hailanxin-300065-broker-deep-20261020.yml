name: Build Hailanxin 300065 broker deep archive 20261020
on:
  push:
    paths:
      - '.github/workflows/build-hailanxin-300065-broker-deep-20261020.yml'
      - 'scripts/build_hailanxin_300065_broker_deep_archive_20261020.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Build archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_hailanxin_300065_broker_deep_archive_20261020.py')
          text = p.read_text(encoding='utf-8')
          old = 'str(min(6, pages))'
          if old not in text:
              raise RuntimeError('Expected opening-page extraction expression not found')
          p.write_text(text.replace(old, 'str(pages)', 1), encoding='utf-8')
          PY
          python scripts/build_hailanxin_300065_broker_deep_archive_20261020.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: hailanxin-300065-broker-deep-20261020
          path: hailanxin_300065_broker_deep_reports_3.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
