name: Build Hailanxin 300065 broker deep archive 20261020
on:
  push:
    paths:
      - '.github/workflows/build-hailanxin-300065-broker-deep-20261020.yml'
      - 'scripts/build_hailanxin_300065_broker_deep_archive_20261020.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Build archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_hailanxin_300065_broker_deep_archive_20261020.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'str(min(6, pages))': 'str(pages)',
              '"info_code": "AP202209071578123195"': '"info_code": "AP202111231530676079"',
              '"report_date": "2022-09-07"': '"report_date": "2021-11-23"',
              '"broker": "中航证券"': '"broker": "东吴证券"',
              '"broker_full": "中航证券有限公司"': '"broker_full": "东吴证券股份有限公司"',
              '"analysts": "张超"': '"analysts": "侯宾"',
              '"title": "军品UDC齐发力，海中娇兰可期盛放"': '"title": "海兰信：海洋硬科技领军者，双向布局UDC及海洋娱乐，业绩加速拐点或将至"',
              '"filename_title": "军品UDC齐发力，海中娇兰可期盛放"': '"filename_title": "海洋硬科技领军者，双向布局UDC及海洋娱乐"',
              '"title_tokens": ["军品UDC齐发力", "海中娇兰可期盛放"]': '"title_tokens": ["海洋硬科技领军者", "双向布局UDC及海洋娱乐"]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'Expected builder text not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python scripts/build_hailanxin_300065_broker_deep_archive_20261020.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: hailanxin-300065-broker-deep-20261020
          path: hailanxin_300065_broker_deep_reports_3.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
