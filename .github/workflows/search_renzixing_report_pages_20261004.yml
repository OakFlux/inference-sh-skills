name: Search Ren Zixing report pages

on:
  push:
    paths:
      - '.github/workflows/search_renzixing_report_pages_20261004.yml'
      - 'tools/search_renzixing_report_pages_20261004.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/search_renzixing_report_pages_20261004.py
      - uses: actions/upload-artifact@v4
        with:
          name: renzixing-public-report-search
          path: renzixing_public_report_search.json
          if-no-files-found: error
          retention-days: 3
