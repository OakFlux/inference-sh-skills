name: Temporary verified Vipshop report package

on:
  push:
    branches:
      - tmp/download-vipshop-reports-20260828
    paths:
      - .github/workflows/tmp-vipshop-final-public-pages.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils python3-pil
          python3 -m pip install --quiet img2pdf pypdf

      - name: Download and assemble reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work previews
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'

          build_report() {
            base_url="$1"
            page_count="$2"
            outfile="$3"
            stem="$4"
            d="work/$stem"
            mkdir -p "$d"
            for i in $(seq 0 $((page_count-1))); do
              dest=$(printf '%s/%03d.png' "$d" "$i")
              curl -L --fail --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 30 --max-time 300 --compressed -A "$UA" -e 'https://www.sdyanbao.com/' "${base_url}/${i}.png" -o "$dest"
              test -s "$dest"
              python3 -c 'import sys; from PIL import Image; im=Image.open(sys.argv[1]); im.verify(); assert im.width>=700 and im.height>=900, im.size' "$dest"
            done
            test "$(find "$d" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq "$page_count"
            img2pdf "$d"/*.png -o "output/$outfile"
            test "$(head -c 4 "output/$outfile")" = '%PDF'
            actual=$(pdfinfo "output/$outfile" | awk '/^Pages:/ {print $2}')
            test "$actual" -eq "$page_count"
            pdftoppm -f 1 -singlefile -png -r 90 "output/$outfile" "previews/${stem}_first" >/dev/null 2>&1
            pdftoppm -f "$page_count" -singlefile -png -r 90 "output/$outfile" "previews/${stem}_last" >/dev/null 2>&1
            test -s "previews/${stem}_first.png"
            test -s "previews/${stem}_last.png"
          }

          build_report 'https://oss.sdyanbao.com/page/2023/12/28/910564' 15 '01_CMS_Vipshop_Anticyclical_Value_20231227_15p_Public_Pages.pdf' 'cms_2023'
          build_report 'https://oss.sdyanbao.com/page/2022/10/24/376288' 18 '02_CMS_Vipshop_Initiation_20221023_18p_Public_Pages.pdf' 'cms_2022'
          build_report 'https://oss.sdyanbao.com/page/2022/9/15/360681' 21 '03_SPDBI_Vipshop_Initiation_20220909_21p_Public_Pages.pdf' 'spdbi_2022'

          {
            echo 'Vipshop (VIPS.US) broker research reports - 3 files'
            echo
            echo '1. China Merchants Securities, 2023-12-27, 15 pages'
            echo '   Vipshop Update: Anticyclical flash-sale model and durable differentiated value.'
            echo '   Company deep/update; rating: Strong Buy (maintained).'
            echo
            echo '2. China Merchants Securities, 2022-10-23, 18 pages'
            echo '   Vipshop: Leading flash-sale e-commerce platform with durable platform value.'
            echo '   Company deep initiation; rating: Overweight.'
            echo
            echo '3. SPDB International, 2022-09-09, 21 pages'
            echo '   Vipshop: Can a value stock return to growth?' 
            echo '   Company initiation; rating: Hold.'
            echo
            echo 'File note:'
            echo '- These PDFs were assembled in original page order from publicly accessible full-page preview images.'
            echo '- They contain all listed pages, but are rasterized public-preview editions rather than original vector PDFs.'
            echo '- Every page image was decoded successfully; PDF headers/page counts were checked; first and last pages rendered successfully.'
            echo '- For personal research use only. Not investment advice.'
          } > output/README.txt

          (cd output && sha256sum ./*.pdf > SHA256SUMS.txt)
          python3 -c 'from pathlib import Path; from pypdf import PdfReader; [(print(p.name,len(PdfReader(str(p)).pages),p.stat().st_size)) for p in Path("output").glob("*.pdf")]'
          ls -lh output previews

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vipshop-broker-reports-3-public-pages
          path: |
            output/
            previews/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
