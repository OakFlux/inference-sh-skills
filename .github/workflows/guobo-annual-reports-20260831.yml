name: Package Guobo annual and latest periodic reports

on:
  push:
    paths:
      - '.github/workflows/guobo-annual-reports-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf
          python -m pip install --quiet pypdf beautifulsoup4

      - name: Discover, download, verify and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          STOCK_CODE = '688375'
          COMPANY_KEYWORDS = ('国博电子', '南京国博电子股份有限公司')
          PACKAGE = '国博电子_2020-2025年报及最新季报'
          out = Path(PACKAGE)
          out.mkdir(parents=True, exist_ok=True)
          work = Path('_guobo_periodic_work')
          work.mkdir(exist_ok=True)
          previews = work / 'previews'
          previews.mkdir(exist_ok=True)

          session = requests.Session()
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          html_headers = {
              'User-Agent': ua,
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          }
          pdf_headers = {
              'User-Agent': ua,
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          }

          def fetch(url: str, *, headers: dict, attempts: int = 7, timeout=(30, 360)) -> requests.Response:
              last = None
              for attempt in range(attempts):
                  try:
                      response = session.get(url, headers=headers, timeout=timeout, allow_redirects=True)
                      print('GET', url, response.status_code, response.headers.get('content-type'), len(response.content), flush=True)
                      if response.status_code == 200 and response.content:
                          return response
                      last = RuntimeError(f'HTTP {response.status_code}, {len(response.content)} bytes')
                  except Exception as exc:
                      last = exc
                  time.sleep(2 * (attempt + 1))
              raise RuntimeError(f'Unable to fetch {url}: {last}')

          def decode_html(response: requests.Response) -> str:
              for encoding in ('gb18030', 'gbk', 'utf-8'):
                  try:
                      text = response.content.decode(encoding)
                      if '国博' in text or '年度报告' in text or '半年度报告' in text or '招股说明书' in text:
                          return text
                  except Exception:
                      pass
              response.encoding = response.apparent_encoding or 'utf-8'
              return response.text

          def parse_sina_listing(page_type: str) -> list[dict]:
              url = f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK_CODE}/page_type/{page_type}.phtml'
              response = fetch(url, headers={**html_headers, 'Referer': 'https://money.finance.sina.com.cn/'}, timeout=(25, 150))
              text = decode_html(response)
              soup = BeautifulSoup(text, 'html.parser')
              rows = []
              seen = set()
              for anchor in soup.find_all('a', href=True):
                  label = ' '.join(anchor.get_text(' ', strip=True).split())
                  href = urljoin(response.url, html.unescape(anchor['href']))
                  if 'vCB_AllBulletinDetail.php' not in href:
                      continue
                  if '国博' not in label:
                      continue
                  key = (label, href)
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append({'title': label, 'detail_url': href})
              print('SINA_LIST', page_type, json.dumps(rows, ensure_ascii=False), flush=True)
              return rows

          def extract_sina_pdf(detail_url: str) -> str:
              response = fetch(detail_url, headers={**html_headers, 'Referer': 'https://money.finance.sina.com.cn/'}, timeout=(25, 180))
              text = decode_html(response)
              patterns = [
                  r'https?://file\.finance\.sina\.com\.cn/[^\"\'<>\s]+?\.PDF',
                  r'https?:\\/\\/file\.finance\.sina\.com\.cn\\/[^\"\'<>\s]+?\.PDF',
              ]
              candidates = []
              for pattern in patterns:
                  for match in re.findall(pattern, text, flags=re.I):
                      candidate = html.unescape(match).replace('\\/', '/')
                      if candidate not in candidates:
                          candidates.append(candidate)
              if not candidates:
                  soup = BeautifulSoup(text, 'html.parser')
                  for anchor in soup.find_all('a', href=True):
                      href = urljoin(response.url, html.unescape(anchor['href']))
                      if 'file.finance.sina.com.cn' in href and href.lower().endswith('.pdf'):
                          candidates.append(href)
              if not candidates:
                  raise RuntimeError(f'No Sina PDF link found in {detail_url}')
              print('SINA_PDF', detail_url, candidates, flush=True)
              return candidates[0]

          annual_rows = parse_sina_listing('ndbg')
          half_rows = parse_sina_listing('zqbg')

          targets: list[dict] = []

          # Pre-listing supplement: the prospectus includes audited 2020 and 2021 financial data.
          prospectus_detail = 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?CompanyCode=80336711&gather=1&id=8363603.PDF'
          targets.append({
              'year': '2020-2021',
              'type': '招股说明书（含经审计财务资料）',
              'source_url': extract_sina_pdf(prospectus_detail),
              'min_pages': 300,
              'filename': '00_国博电子_首次公开发行招股说明书_含2020-2021年经审计财务资料.pdf',
              'validation_terms': ('招股说明书', '2020', '2021'),
          })

          for year in range(2022, 2026):
              pattern = re.compile(fr'{year}年?年度报告')
              exact = [
                  row for row in annual_rows
                  if pattern.search(row['title']) and '摘要' not in row['title'] and '图文版' not in row['title']
              ]
              if not exact:
                  raise RuntimeError(f'Sina listing missing full {year} annual report')
              targets.append({
                  'year': year,
                  'type': '年度报告',
                  'source_url': extract_sina_pdf(exact[0]['detail_url']),
                  'min_pages': 100,
                  'filename': f'{year-2021:02d}_国博电子_{year}年年度报告.pdf',
                  'validation_terms': (str(year), '年度报告'),
              })

          half_pattern = re.compile(r'2026年?半年度报告')
          latest_half = [
              row for row in half_rows
              if half_pattern.search(row['title']) and '摘要' not in row['title'] and '图文版' not in row['title']
          ]
          if not latest_half:
              raise RuntimeError('Sina listing missing full 2026 half-year report')
          targets.append({
              'year': 2026,
              'type': '半年度报告',
              'source_url': extract_sina_pdf(latest_half[0]['detail_url']),
              'min_pages': 60,
              'filename': '05_国博电子_2026年半年度报告.pdf',
              'validation_terms': ('2026', '半年度报告'),
          })

          print('TARGETS', json.dumps(targets, ensure_ascii=False, indent=2), flush=True)

          records = []
          for target in targets:
              filename = target['filename']
              dest = out / filename
              pdf_bytes = b''
              used_url = ''

              original_url = target['source_url']
              source_urls = [original_url]
              if original_url.startswith('http://'):
                  source_urls.append('https://' + original_url[len('http://'):])

              for url in source_urls:
                  for referer in (
                      'https://money.finance.sina.com.cn/',
                      'https://www.sse.com.cn/',
                      'https://www.cninfo.com.cn/',
                  ):
                      try:
                          response = fetch(
                              url,
                              headers={**pdf_headers, 'Referer': referer},
                              attempts=4,
                              timeout=(30, 900),
                          )
                      except Exception as exc:
                          print('PDF_FETCH_ERROR', url, referer, repr(exc), flush=True)
                          continue
                      if response.content.startswith(b'%PDF-'):
                          pdf_bytes = response.content
                          used_url = url
                          break
                  if pdf_bytes:
                      break

              if not pdf_bytes:
                  raise RuntimeError(f'Failed to download {filename}')
              dest.write_bytes(pdf_bytes)

              reader = PdfReader(str(dest))
              pages = len(reader.pages)
              if pages < int(target['min_pages']):
                  raise RuntimeError(f'{filename} is unexpectedly short: {pages} pages')

              text = '\n'.join((page.extract_text() or '') for page in reader.pages[:30])
              compact = re.sub(r'\s+', '', text)
              if not any(keyword in compact for keyword in COMPANY_KEYWORDS) and STOCK_CODE not in compact:
                  raise RuntimeError(f'Company identity validation failed for {filename}')
              for term in target['validation_terms']:
                  if term not in compact:
                      raise RuntimeError(f'Validation term {term!r} missing in {filename}')

              subprocess.run(['qpdf', '--check', str(dest)], check=True, capture_output=True)
              first_prefix = previews / f'{filename}_first'
              last_prefix = previews / f'{filename}_last'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '90', str(dest), str(first_prefix)],
                  check=True,
                  capture_output=True,
              )
              subprocess.run(
                  ['pdftoppm', '-f', str(pages), '-singlefile', '-png', '-r', '90', str(dest), str(last_prefix)],
                  check=True,
                  capture_output=True,
              )
              if not Path(str(first_prefix) + '.png').exists() or not Path(str(last_prefix) + '.png').exists():
                  raise RuntimeError(f'Render verification failed for {filename}')

              date_match = re.search(r'/(20\d{2}-\d{2}-\d{2})/', used_url)
              disclosure_date = date_match.group(1) if date_match else ''
              digest = hashlib.sha256(pdf_bytes).hexdigest()
              record = {
                  'filename': filename,
                  'year': target['year'],
                  'report_type': target['type'],
                  'pages': pages,
                  'bytes': len(pdf_bytes),
                  'sha256': digest,
                  'source_url': used_url,
                  'disclosure_date': disclosure_date,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 6:
              raise RuntimeError(f'Expected 6 reports, got {len(records)}')
          if len({record['sha256'] for record in records}) != 6:
              raise RuntimeError('Duplicate report files detected')

          lines = [
              '国博电子（688375.SH）报告包',
              '',
              '名称核对：市场中不存在证券简称“国富电子”；本包按唯一有效近似匹配“国博电子（688375）”整理。',
              '公司于2022年7月22日在科创板上市，故不存在2020年、2021年上市公司年度报告。',
              '本包以首次公开发行招股说明书补充2020—2021年经审计财务资料，并收录2022—2025年完整年度报告及2026年半年度报告。',
              '',
          ]
          for record in records:
              lines.extend([
                  f"- {record['filename']}｜{record['pages']}页｜披露日期：{record['disclosure_date']}",
                  f"  SHA-256：{record['sha256']}",
              ])
          lines.extend([
              '',
              '核验项目：PDF文件头和结构、实际页数、公司名称/证券代码、报告年份和类型、首页与末页渲染、文件哈希、ZIP CRC。',
          ])
          (out / '报告清单与核验说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(
              ''.join(f"{record['sha256']}  {record['filename']}\n" for record in records),
              encoding='utf-8',
          )

          zip_path = Path(f'{PACKAGE}.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 6:
                  raise RuntimeError(f'ZIP contains {len(pdfs)} PDFs instead of 6')
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: guobo-periodic-reports-final
          path: |
            国博电子_2020-2025年报及最新季报/
            国博电子_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
