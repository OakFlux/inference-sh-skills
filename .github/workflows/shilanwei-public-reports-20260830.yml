name: Download public Shilanwei research reports

on:
  push:
    paths:
      - '.github/workflows/shilanwei-public-reports-20260830.yml'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          out = Path('shilanwei_reports')
          out.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/pdf,*/*;q=0.8',
          }

          reports = [
              {
                  'organization': '第一上海证券',
                  'title': '国产功率半导体IDM龙头，硅基、SiC与高端模拟三线并进，功率涨价与AI电源打开成长空间',
                  'date': '2026-05-27',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202605271822912799_1.pdf',
                  'filename': '01_第一上海证券_士兰微_国产功率半导体IDM龙头_2026-05-27.pdf',
              },
              {
                  'organization': '国信证券',
                  'title': '全球份额稳步提升，碳化硅与高端模拟集成电路芯片产能加速布局',
                  'date': '2026-06-03',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202606031823199527_1.pdf',
                  'filename': '02_国信证券_士兰微_全球份额稳步提升_2026-06-03.pdf',
              },
          ]

          downloaded = []
          for item in reports:
              last_error = None
              content = b''
              for attempt in range(6):
                  try:
                      response = session.get(item['url'], headers=headers, timeout=(30, 180))
                      print('GET', item['url'], response.status_code, response.headers.get('content-type'), len(response.content), flush=True)
                      response.raise_for_status()
                      if not response.content.startswith(b'%PDF-'):
                          raise RuntimeError(f'not a PDF: {response.content[:80]!r}')
                      content = response.content
                      break
                  except Exception as exc:
                      last_error = exc
                      time.sleep(2 * (attempt + 1))
              if not content:
                  raise RuntimeError(f"failed to download {item['title']}: {last_error}")

              path = out / item['filename']
              path.write_bytes(content)
              reader = PdfReader(str(path))
              page_count = len(reader.pages)
              sha256 = hashlib.sha256(content).hexdigest()
              if page_count < 3:
                  raise RuntimeError(f'unexpectedly short report: {path} pages={page_count}')
              downloaded.append({**item, 'pages': page_count, 'bytes': len(content), 'sha256': sha256})
              print('SAVED', json.dumps(downloaded[-1], ensure_ascii=False), flush=True)

          lines = [
              '士兰微（600460）券商研究报告',
              '',
          ]
          for index, item in enumerate(downloaded, 1):
              lines.extend([
                  f"{index}. {item['organization']}：《{item['title']}》",
                  f"   发布日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  '',
              ])
          lines.append('资料仅供研究参考，版权归原研究机构及作者所有，不构成投资建议。')
          (out / '报告清单.txt').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(downloaded, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = Path('士兰微_券商深度报告_2份_公开完整版.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=path.name)
          print('ZIP', zip_path, zip_path.stat().st_size, flush=True)
          PY
      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: shilanwei-public-reports
          path: |
            shilanwei_reports/
            士兰微_券商深度报告_2份_公开完整版.zip
          if-no-files-found: error
          retention-days: 30
