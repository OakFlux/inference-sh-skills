name: Inspect Jiejia Weichuang yearly reports

on:
  push:
    paths:
      - '.github/workflows/inspect_jiejiaweic_yearly_reports_20260928.yml'
      - 'tools/inspect_jiejiaweic_yearly_reports_20260928.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python tools/inspect_jiejiaweic_yearly_reports_20260928.py
      - uses: actions/upload-artifact@v4
        with:
          name: jiejiaweic-yearly-report-inventory
          path: jiejiaweic_yearly_report_inventory.json
          if-no-files-found: error
          retention-days: 3
