name: Temporary Kingsignal broker report package

on:
  push:
    branches:
      - tmp/download-kingsignal-reports-20260829
    paths:
      - .github/workflows/tmp-kingsignal-package.yml

permissions:
  contents: read

jobs:
  download-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pypdf requests

      - name: Download, validate, render and package original PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output verify
          cat > /tmp/download_verify.py <<'PY'
          import hashlib
          import io
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          OUT = Path('output')
          VERIFY = Path('verify')
          OUT.mkdir(exist_ok=True)
          VERIFY.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '民生证券',
                  'date': '2019-04-25',
                  'title': '产品结构升级，5G领域前景可期',
                  'info_code': 'AP201904251322478978',
                  'expected_pages': 5,
                  'filename': '01_民生证券_产品结构升级_5G领域前景可期_20190425_5页.pdf',
                  'type': '公司年报点评',
              },
              {
                  'broker': '民生证券',
                  'date': '2018-12-06',
                  'title': '通讯+军工双线发力，业绩有望快速增长',
                  'info_code': 'AP201812061262067233',
                  'expected_pages': 4,
                  'filename': '02_民生证券_通讯加军工双线发力_业绩有望快速增长_20181206_4页.pdf',
                  'type': '公司研究报告',
              },
              {
                  'broker': '西南证券',
                  'date': '2017-08-29',
                  'title': '多元产品布局，业绩稳步增长',
                  'info_code': 'AP201708290836055304',
                  'expected_pages': 5,
                  'filename': '03_西南证券_多元产品布局_业绩稳步增长_20170829_5页.pdf',
                  'type': '公司中报点评',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          manifest = []
          for index, report in enumerate(reports, 1):
              url = f"https://pdf.dfcfw.com/pdf/H3_{report['info_code']}_1.pdf"
              print(f'DOWNLOAD {index}: {url}')
              response = None
              last_error = None
              for attempt in range(1, 7):
                  try:
                      response = session.get(url, timeout=(30, 240), allow_redirects=True)
                      print(' attempt', attempt, 'status', response.status_code,
                            'bytes', len(response.content), 'type', response.headers.get('content-type'),
                            'final', response.url)
                      if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 50_000:
                          break
                      last_error = RuntimeError(
                          f'invalid response status={response.status_code}, bytes={len(response.content)}, head={response.content[:30]!r}'
                      )
                  except Exception as exc:
                      last_error = exc
                  time.sleep(attempt * 2)
              else:
                  raise RuntimeError(f"Unable to download {report['filename']}: {last_error}")

              content = response.content
              path = OUT / report['filename']
              path.write_bytes(content)

              reader = PdfReader(io.BytesIO(content), strict=False)
              pages = len(reader.pages)
              print(' pages', pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(
                      f"Page mismatch for {report['filename']}: expected {report['expected_pages']}, got {pages}"
                  )

              extracted_parts = []
              for pageno in range(min(5, pages)):
                  try:
                      extracted_parts.append(reader.pages[pageno].extract_text() or '')
                  except Exception as exc:
                      extracted_parts.append(f'[extract error: {exc}]')
              extracted = '\n'.join(extracted_parts)
              compact = re.sub(r'\s+', '', extracted)
              if not ('金信诺' in compact or '300252' in compact):
                  raise RuntimeError(f"Identity verification failed for {report['filename']}")

              sha256 = hashlib.sha256(content).hexdigest()
              (VERIFY / f'{index:02d}_first_pages_text.txt').write_text(extracted, encoding='utf-8')
              subprocess.run([
                  'pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120',
                  str(path), str(VERIFY / f'{index:02d}_page1')
              ], check=True)
              subprocess.run([
                  'pdftoppm', '-f', str(pages), '-singlefile', '-png', '-r', '90',
                  str(path), str(VERIFY / f'{index:02d}_last_page')
              ], check=True)

              manifest.append({
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'type': report['type'],
                  'pages': pages,
                  'source_url': response.url,
                  'info_code': report['info_code'],
                  'bytes': len(content),
                  'sha256': sha256,
                  'identity_check': '通过：文件可识别“金信诺”或“300252”',
              })

          lines = [
              '金信诺（300252.SZ）券商研究报告清单与核验说明',
              '',
              '本压缩包包含3份公开可直接取得的券商PDF原文件。',
              '公开数据库中可直接下载的金信诺公司研究原始PDF较少，现有文件篇幅为4至5页，属于公司研究或财报点评，而非20页以上的长篇深度报告。',
              '所有文件均已核验PDF文件头、实际页数、公司名称/股票代码，并成功渲染首页和末页。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              lines.extend([
                  f"{i}. {item['broker']}｜{item['date']}｜{item['title']}",
                  f"   类型：{item['type']}；页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   公开PDF：{item['source_url']}",
                  f"   SHA256：{item['sha256']}",
                  f"   身份核验：{item['identity_check']}",
                  '',
              ])
          lines.extend([
              '另经核验，海通证券2017年首次覆盖报告《打造信号互联解决方案供应商》和东北证券2023年首次覆盖动态点评《股份回购彰显信心，卫星通信打造新曲线》确实存在，但未找到无需登录或授权即可取得的完整原始PDF，因此未用摘要网页代替。',
              '',
              '资料仅供研究参考，不构成投资建议。',
          ])
          (OUT / '报告清单与核验说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (VERIFY / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          with (OUT / 'SHA256SUMS.txt').open('w', encoding='utf-8') as fh:
              for item in manifest:
                  fh.write(f"{item['sha256']}  {item['filename']}\n")

          print('MANIFEST')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          python /tmp/download_verify.py | tee verify/run.log
          ls -lh output verify

      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: kingsignal-broker-reports-3
          path: output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: kingsignal-broker-reports-verification
          path: verify/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
