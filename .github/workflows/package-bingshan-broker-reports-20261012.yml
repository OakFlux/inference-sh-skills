name: Package Bingshan broker reports 20261012

on:
  push:
    branches:
      - bingshan-broker-reports-20261012
    paths:
      - scripts/package_bingshan_broker_reports_20261012.py
      - .github/workflows/package-bingshan-broker-reports-20261012.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Download, validate, and package reports
        run: python scripts/package_bingshan_broker_reports_20261012.py

      - name: Show package summary
        if: always()
        run: |
          find output -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true
          cat output/package_summary.json 2>/dev/null || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bingshan-000530-broker-reports-20261012
          path: |
            output/*.zip
            output/package_summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
