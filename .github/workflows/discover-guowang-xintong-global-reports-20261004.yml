name: Discover Guowang Xintong global reports 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-guowang-xintong-global-reports-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/discover_guowang_xintong_global_reports_20261004.py
