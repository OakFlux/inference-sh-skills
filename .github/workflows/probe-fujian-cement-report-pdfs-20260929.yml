name: Probe Fujian Cement legacy report PDFs 20260929
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fujian-cement-report-pdfs-20260929.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pypdf
      - run: python scripts/probe_fujian_cement_report_pdfs_20260929.py
