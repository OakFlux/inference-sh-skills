name: Temporary Daan Gene FX report discovery

on:
  push:
    branches:
      - 'tmp/daan-gene-fxbaogao-20260829'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect FX report search and detail APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cat > /tmp/fx.py <<'PY'
          from __future__ import annotations
          import html,json,re,subprocess,urllib.parse
          from pathlib import Path
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          urls=[
            'https://www.fxbaogao.com/detail/5482070',
            'https://www.fxbaogao.com/detail/4810852',
            'https://www.fxbaogao.com/search?keyword=%E8%BE%BE%E5%AE%89%E5%9F%BA%E5%9B%A0',
            'https://www.fxbaogao.com/search?q=%E8%BE%BE%E5%AE%89%E5%9F%BA%E5%9B%A0',
            'https://www.fxbaogao.com/search/%E8%BE%BE%E5%AE%89%E5%9F%BA%E5%9B%A0',
            'https://www.fxbaogao.com/?keyword=%E8%BE%BE%E5%AE%89%E5%9F%BA%E5%9B%A0',
          ]
          def curl(url,path,referer=None):
            cmd=['curl','--http1.1','-L','--silent','--show-error','--retry','5','--retry-all-errors','--retry-delay','1','--connect-timeout','20','--max-time','180','--user-agent',UA,'--header','Accept-Encoding: identity']
            if referer:cmd+=['--referer',referer]
            cmd += [url,'-o',str(path)]
            p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
            return p.returncode,p.stderr[-1000:]
          pages=[];scripts=[];candidate_urls=[]
          for i,u in enumerate(urls):
            p=Path(f'diagnostics/page_{i}.html');rc,err=curl(u,p)
            raw=p.read_bytes() if p.exists() else b''
            text=raw.decode('utf-8','ignore');norm=html.unescape(text.replace('\\/','/'))
            tm=re.search(r'<title>(.*?)</title>',norm,re.I|re.S);title=re.sub(r'<[^>]+>','',tm.group(1)).strip() if tm else ''
            for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',norm,re.I):scripts.append(urllib.parse.urljoin(u,html.unescape(s)))
            for x in re.findall(r'(?:href|src|action)=["\']([^"\']+)',norm,re.I):
              full=urllib.parse.urljoin(u,html.unescape(x))
              if any(k in full.lower() for k in ['pdf','download','file','report','search','api','detail']):candidate_urls.append(full)
            for x in re.findall(r'https?://[^"\'<>\s]+',norm,re.I):
              x=urllib.parse.unquote(x).rstrip('),;]')
              if any(k in x.lower() for k in ['pdf','download','file','report','search','api','detail']):candidate_urls.append(x)
            relevant=[]
            for line in norm.splitlines():
              if re.search(r'达安基因|download|pdf|fileurl|file_url|reporturl|api|search|5482070|4810852|__NEXT_DATA__',line,re.I):relevant.append(re.sub(r'\s+',' ',line)[:5000])
            pages.append({'url':u,'rc':rc,'size':len(raw),'title':title,'error':err,'relevant':relevant[:1000]})
          scripts=list(dict.fromkeys(scripts));candidate_urls=list(dict.fromkeys(candidate_urls))
          Path('diagnostics/pages.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('diagnostics/candidates.txt').write_text('\n'.join(candidate_urls),encoding='utf-8')
          print('PAGES',[(x['url'],x['rc'],x['size'],x['title']) for x in pages]);print('SCRIPTS',len(scripts))
          for i,u in enumerate(scripts[:100]):
            p=Path(f'diagnostics/script_{i}.js');rc,err=curl(u,p,urls[0]);print('SCRIPT',i,rc,p.stat().st_size if p.exists() else 0,u)
          hits=[];script_urls=[]
          pat=re.compile(r'pdf|download|fileUrl|file_url|reportUrl|search|detail|api/|graphql|达安基因',re.I)
          for p in Path('diagnostics').glob('script_*.js'):
            t=p.read_text(encoding='utf-8',errors='ignore')
            for m in pat.finditer(t):
              a=max(0,m.start()-800);b=min(len(t),m.end()+1800);hits.append(f'===== {p.name} =====\n{t[a:b]}')
              if len(hits)>800:break
            for u in re.findall(r'https?://[^"\'<>\s]+',t,re.I):
              if any(k in u.lower() for k in ['pdf','download','file','report','search','api']):script_urls.append(u.rstrip('),;]'))
          Path('diagnostics/script_hits.txt').write_text('\n\n'.join(hits),encoding='utf-8')
          Path('diagnostics/script_urls.txt').write_text('\n'.join(dict.fromkeys(script_urls)),encoding='utf-8')
          PY
          python /tmp/fx.py

      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daan-gene-fxbaogao-discovery
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
