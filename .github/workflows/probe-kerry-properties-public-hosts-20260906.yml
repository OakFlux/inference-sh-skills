name: Probe Kerry Properties public report hosts

on:
  push:
    branches:
      - chatgpt-kerry-properties-broker-reports-20260906
    paths:
      - '.github/workflows/probe-kerry-properties-public-hosts-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_kerry_properties_public_hosts_20260906.py
      - uses: actions/upload-artifact@v4
        with:
          name: kerry-properties-public-host-probe-20260906
          path: |
            kerry-public-host-results.json
            kerry-public-host-probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
