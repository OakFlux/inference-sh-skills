name: Capture paginated Xujiahui fxbaogao results 20260927

on:
  push:
    paths:
      - '.github/workflows/capture-xujiahui-fxbaogao-pages-20260927.yml'
      - 'scripts/capture_xujiahui_fxbaogao_pages_20260927.py'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          playwright install chromium --with-deps
      - name: Capture pages
        run: python scripts/capture_xujiahui_fxbaogao_pages_20260927.py
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: xujiahui-fxbaogao-pages
          path: xujiahui_fxbaogao_pages
          if-no-files-found: error
          retention-days: 7

# Trigger after registration.
