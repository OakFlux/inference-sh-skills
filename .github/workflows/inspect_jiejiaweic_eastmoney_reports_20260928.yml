name: Package Jiejia Weichuang broker reports

on:
  push:
    paths:
      - '.github/workflows/inspect_jiejiaweic_eastmoney_reports_20260928.yml'
      - 'tools/package_jiejiaweic_broker_reports_20260928.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download, validate and package reports
        run: python tools/package_jiejiaweic_broker_reports_20260928.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: jiejiaweic-300724-broker-deep-reports-3
          path: |
            捷佳伟创_300724_券商深度报告_3份.zip
            jiejiaweic_broker_reports_result.json
            _previews_jiejiaweic_broker_reports/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
