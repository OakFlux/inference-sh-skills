name: Build Geer Software official filings package 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/geer-software-filings-package-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build verified ZIP package
        run: python scripts/run_geer_software_filings_20261012.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: geer-software-603232-filings-package-20261012
          path: 格尔软件_603232_2020-2025年报_最新季报_截至20261012.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
