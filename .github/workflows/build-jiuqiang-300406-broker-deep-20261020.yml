name: Build Jiuqiang 300406 broker deep archive 20261020
on:
  push:
    paths:
      - '.github/workflows/build-jiuqiang-300406-broker-deep-20261020.yml'
      - 'scripts/build_jiuqiang_300406_broker_deep_archive_20261020.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Build archive
        shell: bash
        run: python scripts/build_jiuqiang_300406_broker_deep_archive_20261020.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: jiuqiang-300406-broker-deep-20261020
          path: jiuqiang_biotech_300406_broker_deep_reports_3.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
