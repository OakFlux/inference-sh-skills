name: Package verified Guangwei broker reports

on:
  push:
    branches: [tmp/guangwei-broker-reports-20260830]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pypdf pymupdf
      - run: python .github/scripts/package_guangwei_broker_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: guangwei-broker-reports
          path: 光威复材_券商深度报告_3份_完整PDF.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
