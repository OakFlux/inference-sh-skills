name: Probe TransThera prospectus link

on:
  push:
    paths:
      - '.github/workflows/transthera-prospectus-link-probe-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe listing document page
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          pages = [
            'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0613/2025061300065_c.htm',
            'https://www.hkexnews.hk/listedco/listconews/sehk/2025/0613/2025061300065_c.htm',
            'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0613/2025061300066.htm',
            'https://www.hkexnews.hk/listedco/listconews/sehk/2025/0613/2025061300066.htm',
          ]
          out=[]
          for page in pages:
            for ua in ['curl/8.5.0','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36']:
              try:
                r=requests.get(page,headers={'User-Agent':ua,'Accept':'text/html,*/*','Referer':'https://www1.hkexnews.hk/'},timeout=30,allow_redirects=True)
                print('PAGE',page,'UA',ua,r.status_code,len(r.content),r.url,flush=True)
                rec={'page':page,'ua':ua,'status':r.status_code,'bytes':len(r.content),'final':r.url,'links':[]}
                if r.status_code==200:
                  soup=BeautifulSoup(r.content,'html.parser')
                  for a in soup.find_all('a',href=True):
                    href=urljoin(r.url,a['href'])
                    text=' '.join(a.get_text(' ',strip=True).split())
                    if '.pdf' in href.lower() or 'prospect' in text.lower() or '招股' in text or '全球' in text:
                      rec['links'].append({'text':text,'href':href})
                      print('LINK',repr(text),href,flush=True)
                out.append(rec)
              except Exception as e:
                print('ERROR',page,ua,type(e).__name__,e,flush=True)
                out.append({'page':page,'ua':ua,'error':repr(e)})
          open('transthera_prospectus_probe.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: transthera-prospectus-link-probe
          path: transthera_prospectus_probe.json
          retention-days: 1
