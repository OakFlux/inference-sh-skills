name: Inspect Shuangxiang Great Wisdom B16 20261014

on:
  push:
    branches:
      - shuangxiang-broker-reports-20261014
    paths:
      - scripts/inspect_shuangxiang_gw_b16_20261014.py
      - .github/workflows/inspect-shuangxiang-gw-b16-20261014.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - run: python scripts/inspect_shuangxiang_gw_b16_20261014.py
