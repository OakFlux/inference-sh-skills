name: Inspect 9fzt Air China Cargo report viewer

on:
  push:
    paths:
      - '.github/workflows/inspect_9fzt_report_viewer_20260927.yml'
      - 'tools/inspect_9fzt_report_viewer_20260927.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/inspect_9fzt_report_viewer_20260927.py
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-9fzt-air-china-cargo-report-viewer
          path: inspect_9fzt_report_viewer.json
          if-no-files-found: error
          retention-days: 3
