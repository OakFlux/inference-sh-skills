name: Inspect Ren Zixing Sina report pages

on:
  push:
    paths:
      - '.github/workflows/inspect_renzixing_sina_show_pages_20261004.yml'
      - 'tools/inspect_renzixing_sina_show_pages_20261004.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/inspect_renzixing_sina_show_pages_20261004.py
      - uses: actions/upload-artifact@v4
        with:
          name: renzixing-sina-show-pages
          path: |
            renzixing_sina_show_pages.json
            _renzixing_sina_pages/*
          if-no-files-found: error
          retention-days: 3
