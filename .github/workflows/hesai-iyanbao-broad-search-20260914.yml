name: Search broader iYanbao index for Hesai reports

on:
  push:
    branches:
      - tmp/hesai-broker-reports-20260914
    paths:
      - '.github/workflows/hesai-iyanbao-broad-search-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/hesai-broker-reports-20260914
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Search broad keywords
        shell: bash
        run: |
          set -euo pipefail
          rm -rf broad_search
          mkdir -p broad_search
          python - <<'PY'
          from pathlib import Path
          import json, urllib.parse, time, re
          import requests
          from bs4 import BeautifulSoup

          kws=[
            '激光雷达龙头','全球车载激光雷达龙头','量产降本','HESAI 深度','HSAI 深度','禾赛 深度报告',
            '禾赛科技 深度报告','激光雷达 深度报告','禾赛 HSAI','Hesai Inc','机器人 第二成长曲线',
            '从汽车智驾到机器人','双轨革命','禾赛 交银国际','禾赛 国海证券','禾赛 中邮证券',
            '禾赛 华兴证券','禾赛 华西证券','禾赛 华创证券','禾赛 开源证券','全球激光雷达',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          out=[]; unique={}
          for idx,kw in enumerate(kws,1):
              for page in range(1,6):
                  candidates=[
                    'https://www.iyanbao.com/search?keyword='+urllib.parse.quote(kw)+f'&page={page}',
                    'https://www.iyanbao.com/search?keyword='+urllib.parse.quote(kw)+f'&pageIndex={page}',
                  ]
                  best=None
                  for url in candidates:
                      item={'keyword':kw,'page':page,'url':url}
                      try:
                          r=s.get(url,timeout=60,allow_redirects=True)
                          text=r.content.decode(r.apparent_encoding or 'utf-8',errors='ignore')
                          soup=BeautifulSoup(text,'html.parser'); tag=soup.find('script',id='__NEXT_DATA__')
                          rows=[]; total=None
                          if tag and tag.string:
                              data=json.loads(tag.string); pp=data.get('props',{}).get('pageProps',{})
                              total=pp.get('searchTotal'); rows=pp.get('searchList') or []
                          slim=[]
                          for x in rows:
                              if not isinstance(x,dict): continue
                              inst=x.get('institution'); inst=inst.get('value') if isinstance(inst,dict) else inst
                              rec={'id':x.get('id'),'title':x.get('title'),'institution':inst,'pages':x.get('pages'),'publishTimestamp':x.get('publishTimestamp'),'pdfUrl':x.get('pdfUrl'),'reportType':x.get('reportType')}
                              slim.append(rec)
                              if rec['id']: unique[str(rec['id'])]=rec
                          item.update({'status':r.status_code,'size':len(r.content),'searchTotal':total,'results':slim})
                          best=item
                          if slim: break
                      except Exception as e: item['error']=repr(e); best=item
                  out.append(best)
                  print('\nQUERY',kw,'PAGE',page,'status',best.get('status'),'total',best.get('searchTotal'),'count',len(best.get('results',[])))
                  for x in best.get('results',[]):
                      marker='***' if re.search(r'禾赛|hesai|hsai|02525',json.dumps(x,ensure_ascii=False),re.I) else ''
                      print(marker,x)
                  if page>1 and not best.get('results'): break
                  if best.get('searchTotal') is not None and page*10>=int(best.get('searchTotal') or 0): break
                  time.sleep(.25)
          Path('broad_search/results.json').write_text(json.dumps({'queries':out,'unique':list(unique.values())},ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n=== ALL HESAI MATCHES ===')
          for x in unique.values():
              if re.search(r'禾赛|hesai|hsai|02525',json.dumps(x,ensure_ascii=False),re.I): print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hesai-iyanbao-broad-search-20260914
          path: broad_search
          retention-days: 3
