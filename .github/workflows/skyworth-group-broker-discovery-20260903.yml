name: Discover Skyworth Group broker research PDFs

on:
  push:
    paths:
      - '.github/workflows/skyworth-group-broker-discovery-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Search public sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import time
          from io import BytesIO
          from urllib.parse import parse_qs, quote_plus, unquote, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          session = requests.Session()
          session.trust_env = False
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36'
          H = {'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7'}
          PDF_H = {'User-Agent': UA, 'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8', 'Referer': 'https://data.eastmoney.com/'}

          def compact(value):
              return re.sub(r'\s+', '', str(value or '')).lower()

          def get(url, **kwargs):
              headers = dict(H)
              headers.update(kwargs.pop('headers', {}))
              return session.get(url, headers=headers, timeout=kwargs.pop('timeout', (20, 150)), allow_redirects=True, **kwargs)

          def company_match(text):
              n = compact(text)
              return any(x in n for x in ('创维集团', '創維集團', 'skyworthgroup', '00751', '0751.hk', '751.hk')) and not (
                  '创维数字' in n and '创维集团' not in n and '創維集團' not in n
              )

          def probe_pdf(url, label=''):
              try:
                  r = get(url, headers=PDF_H, timeout=(25, 300))
                  print('PDF_GET', label, r.status_code, len(r.content), r.headers.get('content-type'), r.url, flush=True)
                  if r.status_code != 200 or not r.content.startswith(b'%PDF-') or len(r.content) < 100000:
                      return
                  reader = PdfReader(BytesIO(r.content), strict=False)
                  pages = len(reader.pages)
                  chunks = []
                  for p in reader.pages[:min(10, pages)]:
                      try:
                          chunks.append(p.extract_text() or '')
                      except Exception as exc:
                          print('TEXT_WARN', label, repr(exc), flush=True)
                  front = '\n'.join(chunks)
                  print('PDF_OK', json.dumps({
                      'label': label, 'pages': pages, 'bytes': len(r.content), 'url': r.url,
                      'company_ok': company_match(front),
                      'research_ok': any(x in compact(front) for x in ('证券研究报告','證券研究報告','公司研究','首次覆盖','首次覆蓋','equityresearch','研究报告')),
                      'front': re.sub(r'\s+', ' ', front)[:1800],
                  }, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('PDF_ERR', label, url, repr(exc), flush=True)

          print('=== EASTMONEY GLOBAL DATE WINDOWS ===', flush=True)
          windows = [
              ('2022-09-12','2022-09-15'),
              ('2026-01-20','2026-01-23'),
              ('2025-03-25','2025-03-31'),
              ('2025-06-01','2025-06-30'),
              ('2023-01-01','2023-01-15'),
              ('2021-01-01','2021-12-31'),
              ('2020-01-01','2020-12-31'),
          ]
          found_rows = {}
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          for begin, end in windows:
              for qtype in (0, 1):
                  for page in range(1, 8):
                      params = {
                          'pageNo': page, 'pageSize': 500, 'qType': qtype,
                          'beginTime': begin, 'endTime': end,
                          'industryCode': '*', 'rating': '*', 'ratingChange': '*',
                      }
                      try:
                          r = get(endpoint, params=params, headers={'Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*'})
                          print('EM', begin, end, qtype, page, r.status_code, len(r.content), flush=True)
                          r.raise_for_status()
                          payload = r.json(); rows = payload.get('data') or []
                          for row in rows:
                              raw = json.dumps(row, ensure_ascii=False)
                              if company_match(raw):
                                  info = str(row.get('infoCode') or row.get('id') or raw)
                                  found_rows[info] = row
                                  print('EM_MATCH', json.dumps({k:row.get(k) for k in ('infoCode','title','publishDate','orgSName','orgName','researcher','stockName','stockCode','attachPages','attachSize','emRatingName','reportType','encodeUrl')}, ensure_ascii=False), flush=True)
                          if not rows or len(rows) < 500:
                              break
                      except Exception as exc:
                          print('EM_ERR', begin, end, qtype, page, repr(exc), flush=True)
                          break

          for info, row in found_rows.items():
              if str(info).startswith('AP'):
                  for prefix in ('H3','H2'):
                      probe_pdf(f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf', f'EM_{info}_{prefix}')

          print('\n=== SEARCH ENGINES ===', flush=True)
          queries = [
              '"创维集团" "家电行业领军者" PDF',
              '"创维集团" "分布式光伏开启第二成长曲线" PDF',
              '"创维集团" "首次覆盖" PDF',
              '"创维集团" "公司深度" PDF',
              '"创维集团" 00751 研报 PDF',
              '"创维集团" 天风证券 PDF',
              '"创维集团" 中金公司 研报 PDF',
              '"Skyworth Group" equity research PDF',
              'site:pdf.dfcfw.com/pdf "创维集团"',
              'site:img3.gelonghui.com/pdf "创维集团"',
              'site:research.bocomgroup.com "Skyworth" pdf',
              'site:firstshanghai.com.hk "Skyworth" pdf',
          ]
          discovered_urls = set()
          for query in queries:
              print('\nQUERY', query, flush=True)
              engines = [
                  'https://html.duckduckgo.com/html/?q=' + quote_plus(query),
                  'https://www.bing.com/search?q=' + quote_plus(query),
                  'https://www.google.com/search?q=' + quote_plus(query),
              ]
              for engine in engines:
                  try:
                      r = get(engine, timeout=(20, 120))
                      print('SEARCH', engine.split('/')[2], r.status_code, len(r.content), r.url, flush=True)
                      text = html.unescape(r.text).replace('\\/', '/')
                      soup = BeautifulSoup(text, 'lxml')
                      for a in soup.find_all('a', href=True):
                          href = a['href']
                          if href.startswith('//duckduckgo.com/l/?'):
                              qs = parse_qs(urlparse('https:' + href).query)
                              href = unquote((qs.get('uddg') or [''])[0])
                          elif href.startswith('/url?'):
                              qs = parse_qs(urlparse(href).query)
                              href = unquote((qs.get('q') or [''])[0])
                          elif href.startswith('/'):
                              href = urljoin(r.url, href)
                          if href.startswith('http'):
                              low = href.lower()
                              if any(x in low for x in ('.pdf','nxny.com','sdyanbao.com','sgpjbg.com','360why.com','vzkoo.com','baogaobox.com','reportify','dfcfw.com','gelonghui.com')):
                                  discovered_urls.add(href)
                                  print('LINK', href[:1800], flush=True)
                      for pattern in (
                          r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',
                          r'https?://pdf\.dfcfw\.com/[^"\'<>\s]+',
                          r'AP\d{15,24}',
                      ):
                          for m in re.findall(pattern, text, flags=re.I):
                              if isinstance(m, tuple): m = m[0]
                              if m.startswith('AP'):
                                  for prefix in ('H3','H2'):
                                      discovered_urls.add(f'https://pdf.dfcfw.com/pdf/{prefix}_{m}_1.pdf')
                              else:
                                  discovered_urls.add(m.rstrip(').,;]'))
                  except Exception as exc:
                      print('SEARCH_ERR', engine, repr(exc), flush=True)
                  time.sleep(.2)

          print('\n=== KNOWN/SOURCE PAGES ===', flush=True)
          source_pages = [
              'https://www.sgpjbg.com/baogao/98867.html',
              'https://www.nxny.com/stock/stock_00751/',
              'https://www.nxny.com/stock/stock_0751/',
              'https://www.360why.com/search/?q=%E5%88%9B%E7%BB%B4%E9%9B%86%E5%9B%A2',
          ]
          for url in source_pages:
              try:
                  r = get(url, timeout=(20, 180))
                  print('PAGE', r.status_code, len(r.content), r.url, flush=True)
                  text = html.unescape(r.text).replace('\\/', '/')
                  print('PAGE_TITLE', BeautifulSoup(text,'lxml').title.get_text(' ',strip=True) if BeautifulSoup(text,'lxml').title else '', flush=True)
                  for value in re.findall(r'https?://[^"\'<>\s]+', text, flags=re.I):
                      value = value.rstrip(').,;]')
                      if '.pdf' in value.lower() or 'download' in value.lower():
                          discovered_urls.add(value)
                          print('PAGE_LINK', value[:1800], flush=True)
                  for m in re.findall(r'(?:view_|detail/)(\d{5,9})', text, flags=re.I):
                      print('PAGE_REPORT_ID', url, m, flush=True)
                  if company_match(text):
                      for m in re.finditer(r'.{0,300}(?:创维集团|創維集團|Skyworth Group).{0,800}', text, flags=re.I|re.S):
                          print('PAGE_CTX', re.sub(r'\s+',' ',m.group(0))[:1400], flush=True)
              except Exception as exc:
                  print('PAGE_ERR', url, repr(exc), flush=True)

          print('\n=== PROBE ALL DISCOVERED PDF URLS ===', flush=True)
          for url in sorted(discovered_urls):
              if '.pdf' in url.lower():
                  probe_pdf(url, 'SEARCH')
          print('DISCOVERED_URL_COUNT', len(discovered_urls), flush=True)
          PY
