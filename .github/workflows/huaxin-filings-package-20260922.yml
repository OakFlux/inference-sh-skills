name: Run Zhongxin Saike official filings package 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/huaxin-filings-package-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build verified ZIP package
        run: python scripts/run_zhongxin_saike_filings_20260929.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zhongxin-saike-002912-filings-final-20260929
          path: 中新赛克_002912_2020-2025年报_2026最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

# Script syntax corrected; this commit starts the validated package build.
