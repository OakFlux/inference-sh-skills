name: Package Zhongyu Energy 03633 official reports

on:
  push:
    paths:
      - '.github/workflows/package_zhongyu_energy_reports_20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from pypdf import PdfReader

          CODE = '03633'
          TARGET_YEARS = list(range(2020, 2026))
          PACKAGE = '中裕能源_03633_2020-2025年报及2026年中期报告'
          OUT = Path(PACKAGE)
          WORK = Path('_work')
          PREVIEWS = WORK / 'previews'
          OUT.mkdir(exist_ok=True)
          PREVIEWS.mkdir(parents=True, exist_ok=True)

          BASE = 'https://www1.hkexnews.hk'
          STOCK_URLS = [
              f'{BASE}/ncms/script/eds/activestock_sehk_c.json',
              f'{BASE}/ncms/script/eds/inactivestock_sehk_c.json',
          ]
          SEARCH_URL = f'{BASE}/search/titleSearchServlet.do'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': UA,
              'Accept-Language': 'zh-HK,zh;q=0.9,en;q=0.7',
              'Referer': 'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=zh',
          })

          def compact(value: str) -> str:
              return re.sub(r'\s+', '', value or '').upper()

          def strip_html(value: str) -> str:
              text = html.unescape(value or '')
              text = re.sub(r'<br\s*/?>', ' ', text, flags=re.I)
              text = re.sub(r'<[^>]+>', '', text)
              return ' '.join(text.split())

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()

          def request_json(url: str, *, params=None):
              errors = []
              for attempt in range(1, 7):
                  try:
                      response = session.get(
                          url,
                          params=params,
                          headers={'Accept': 'application/json,text/plain,*/*'},
                          timeout=(30, 180),
                          allow_redirects=True,
                      )
                      print('JSON_GET', attempt, response.status_code, len(response.content), response.url, flush=True)
                      if response.status_code == 200:
                          return response.json()
                      errors.append(f'{response.status_code}/{len(response.content)}')
                  except Exception as exc:
                      errors.append(repr(exc))
                  time.sleep(min(attempt * 2, 10))
              raise RuntimeError(f'JSON request failed: {url}: ' + ' | '.join(errors[-12:]))

          def extract_rows(payload):
              if isinstance(payload, list):
                  return payload
              if not isinstance(payload, dict):
                  return []
              for key in ('stockInfo', 'stockList', 'stocks', 'data', 'result', 'records', 'rows', 'announcements'):
                  value = payload.get(key)
                  if isinstance(value, list):
                      return value
                  if isinstance(value, str):
                      try:
                          parsed = json.loads(value)
                          if isinstance(parsed, list):
                              return parsed
                      except Exception:
                          pass
              return []

          def first_text(row, keys):
              for key in keys:
                  value = row.get(key)
                  if isinstance(value, (str, int, float)) and str(value).strip():
                      return str(value).strip()
              return ''

          def normalize_code(raw: str) -> str:
              digits = re.sub(r'\D', '', raw or '')
              if len(digits) <= 4:
                  return digits.zfill(5)
              return digits[-5:]

          stock_id = ''
          company_name = ''
          stock_diagnostics = []
          for stock_url in STOCK_URLS:
              payload = request_json(stock_url)
              rows = extract_rows(payload)
              stock_diagnostics.append({'url': stock_url, 'row_count': len(rows)})
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  code = first_text(row, ('stockCode','STOCK_CODE','stock_code','code','CODE','c'))
                  if normalize_code(code) != CODE:
                      continue
                  stock_id = first_text(row, ('stockId','STOCK_ID','stock_id','id','ID','i'))
                  company_name = strip_html(first_text(row, ('stockName','STOCK_NAME','name','NAME','longName','n')))
                  print('STOCK_MATCH', json.dumps(row, ensure_ascii=False), flush=True)
                  break
              if stock_id:
                  break
          if not stock_id:
              raise RuntimeError(f'Could not resolve HKEX stockId for {CODE}')
          print('RESOLVED', CODE, stock_id, company_name, flush=True)

          def query_category(t2code: str):
              params = {
                  'lang': 'zh',
                  'category': '0',
                  'market': 'SEHK',
                  'stockId': stock_id,
                  'searchType': '1',
                  'documentType': '-1',
                  't1code': '40000',
                  't2Gcode': '-2',
                  't2code': t2code,
                  'fromDate': '20190101',
                  'toDate': '20260926',
                  'MB-Daterange': '0',
                  'rowRange': '500',
                  'sortByOptions': 'DateTime',
                  'sortDir': '0',
              }
              payload = request_json(SEARCH_URL, params=params)
              rows = extract_rows(payload)
              parsed = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  file_type = first_text(row, ('FILE_TYPE','fileType','file_type'))
                  if file_type and file_type.upper() != 'PDF':
                      continue
                  code_payload = first_text(row, ('STOCK_CODE','stockCode','stock_code'))
                  tokens = {normalize_code(x) for x in re.split(r'[,;，\s<>/br]+', strip_html(code_payload)) if re.search(r'\d', x)}
                  if tokens and CODE not in tokens:
                      continue
                  title = strip_html(first_text(row, ('TITLE','title','LONG_TEXT','longText')))
                  link = first_text(row, ('FILE_LINK','fileLink','url'))
                  raw_date = first_text(row, ('DATE_TIME','RELEASE_TIME','dateTime','releaseTime'))
                  if not title or not link:
                      continue
                  if link.startswith('http://') or link.startswith('https://'):
                      url = link
                  else:
                      url = urljoin(BASE + '/', link)
                  match = re.search(r'(20\d{2})[-/](\d{1,2})[-/](\d{1,2})', raw_date)
                  if match:
                      filing_date = f'{int(match.group(1)):04d}-{int(match.group(2)):02d}-{int(match.group(3)):02d}'
                  else:
                      parts = raw_date.split()[0].split('/') if raw_date else []
                      if len(parts) == 3 and all(p.isdigit() for p in parts):
                          filing_date = f'{int(parts[2]):04d}-{int(parts[1]):02d}-{int(parts[0]):02d}'
                      else:
                          filing_date = ''
                  parsed.append({
                      'title': title,
                      'url': url,
                      'filing_date': filing_date,
                      'raw_date': raw_date,
                      'category': t2code,
                      'row': row,
                  })
              return parsed

          annual_rows = query_category('40100')
          interim_rows = query_category('40200')
          print('ANNUAL_ROWS', json.dumps([{k:r[k] for k in ('title','url','filing_date')} for r in annual_rows], ensure_ascii=False, indent=2), flush=True)
          print('INTERIM_ROWS', json.dumps([{k:r[k] for k in ('title','url','filing_date')} for r in interim_rows], ensure_ascii=False, indent=2), flush=True)
          (WORK / 'discovery.json').write_text(json.dumps({
              'stock_code': CODE,
              'stock_id': stock_id,
              'company_name': company_name,
              'stock_diagnostics': stock_diagnostics,
              'annual_rows': annual_rows,
              'interim_rows': interim_rows,
          }, ensure_ascii=False, indent=2), encoding='utf-8')

          def title_year(title: str):
              match = re.search(r'(20\d{2})', title)
              if match:
                  return int(match.group(1))
              cn_map = {'零':'0','〇':'0','一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9'}
              match = re.search(r'([零〇一二三四五六七八九]{4})年', title)
              if match:
                  return int(''.join(cn_map[c] for c in match.group(1)))
              return None

          def is_full_report(row, kind):
              text = compact(row['title'])
              reject = ('通知信函','發佈通知','发布通知','展示文件','業績公告','业绩公告','業績','业绩','摘要','SUMMARY','NOTIFICATION','NOTICE')
              if any(compact(token) in text for token in reject):
                  return False
              if kind == 'annual':
                  return any(compact(token) in text for token in ('年報','年报','年度報告','年度报告','ANNUALREPORT'))
              return any(compact(token) in text for token in ('中期報告','中期报告','INTERIMREPORT','半年報','半年度报告'))

          annual_candidates = [r for r in annual_rows if is_full_report(r, 'annual')]
          interim_candidates = [r for r in interim_rows if is_full_report(r, 'interim')]

          selected = []
          for year in TARGET_YEARS:
              exact = [r for r in annual_candidates if title_year(r['title']) == year]
              if not exact:
                  exact = []
                  for row in annual_candidates:
                      if not row['filing_date']:
                          continue
                      filing_year = int(row['filing_date'][:4])
                      filing_month = int(row['filing_date'][5:7])
                      inferred = filing_year - 1 if filing_month <= 7 else filing_year
                      if inferred == year:
                          exact.append(row)
              if not exact:
                  raise RuntimeError(f'No full annual report candidate for {year}')
              exact.sort(key=lambda r: (1 if any(x in compact(r['title']) for x in ('修訂','修订','更正','補充','补充')) else 0, r['filing_date']), reverse=True)
              chosen = exact[0]
              selected.append({'year': year, 'kind': '年度报告', **chosen})

          latest_interim = [r for r in interim_candidates if title_year(r['title']) == 2026]
          if not latest_interim:
              latest_interim = [r for r in interim_candidates if r['filing_date'].startswith('2026-')]
          if not latest_interim:
              raise RuntimeError('No 2026 full interim report candidate found')
          latest_interim.sort(key=lambda r: r['filing_date'], reverse=True)
          selected.append({'year': 2026, 'kind': '中期报告', **latest_interim[0]})

          def download_pdf(url: str):
              errors = []
              variants = [url]
              parsed = urlparse(url)
              if parsed.netloc == 'www1.hkexnews.hk':
                  variants.append(url.replace('://www1.hkexnews.hk/', '://www.hkexnews.hk/'))
              for attempt in range(1, 7):
                  for candidate_url in variants:
                      for referer in ('https://www1.hkexnews.hk/', 'https://www.hkexnews.hk/', 'https://www.zhongyugas.com/'):
                          try:
                              response = session.get(
                                  candidate_url,
                                  headers={
                                      'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                                      'Referer': referer,
                                  },
                                  timeout=(30, 900),
                                  allow_redirects=True,
                              )
                              print('PDF_GET', attempt, response.status_code, len(response.content), response.url, flush=True)
                              if response.status_code == 200 and response.content.startswith(b'%PDF-') and len(response.content) > 50000:
                                  return response
                              errors.append(f'{response.status_code}/{len(response.content)} {candidate_url}')
                          except Exception as exc:
                              errors.append(repr(exc))
                  time.sleep(min(attempt * 2, 10))
              raise RuntimeError('PDF download failed: ' + ' | '.join(errors[-18:]))

          def extract_sample(path: Path) -> str:
              chunks = []
              try:
                  reader = PdfReader(str(path), strict=False)
                  for page in reader.pages[:min(35, len(reader.pages))]:
                      try:
                          chunks.append(page.extract_text() or '')
                      except Exception:
                          pass
              except Exception:
                  pass
              try:
                  result = subprocess.run(
                      ['pdftotext', '-f', '1', '-l', '35', str(path), '-'],
                      capture_output=True,
                      text=True,
                      timeout=180,
                  )
                  chunks.append(result.stdout or '')
              except Exception:
                  pass
              return compact('\n'.join(chunks))

          def validate_pdf(path: Path, index: int, year: int, kind: str):
              if path.read_bytes()[:5] != b'%PDF-':
                  raise RuntimeError(f'{path}: missing PDF header')
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              minimum_pages = 45 if kind == '年度报告' else 25
              if pages < minimum_pages:
                  raise RuntimeError(f'{path}: page count {pages} below {minimum_pages}')
              qpdf = subprocess.run(['qpdf','--check',str(path)], capture_output=True, text=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f'{path}: qpdf check failed: {qpdf.stderr[-1500:]}')
              sample = extract_sample(path)
              markers = ('中裕能源','中裕能源控股','中裕燃氣','中裕燃气','ZHONGYUENERGY','ZHONGYUGAS','03633','3633')
              company_ok = any(compact(x) in sample for x in markers)
              chinese_year = {
                  2020:'二零二零', 2021:'二零二一', 2022:'二零二二', 2023:'二零二三',
                  2024:'二零二四', 2025:'二零二五', 2026:'二零二六',
              }[year]
              year_ok = str(year) in sample or chinese_year in sample
              if not company_ok:
                  print('TEXT_WARNING company marker not extractable; relying on exact HKEX metadata', path, flush=True)
              if not year_ok:
                  print('TEXT_WARNING year marker not extractable; relying on exact HKEX metadata', path, flush=True)
              for label, page_number in (('first',1), ('last',pages)):
                  prefix = PREVIEWS / f'{index:02d}_{label}'
                  subprocess.run(
                      ['pdftoppm','-f',str(page_number),'-singlefile','-png','-r','72',str(path),str(prefix)],
                      check=True,
                      capture_output=True,
                      timeout=180,
                  )
                  image = Path(str(prefix) + '.png')
                  if not image.exists() or image.stat().st_size < 1000:
                      raise RuntimeError(f'{path}: render failed for {label} page')
              return {
                  'pages': pages,
                  'bytes': path.stat().st_size,
                  'sha256': sha256(path),
                  'company_text_verified': company_ok,
                  'year_text_verified': year_ok,
              }

          manifest = []
          seen_hashes = set()
          for index, item in enumerate(selected, 1):
              filename = f'{index:02d}_中裕能源_{item["year"]}年年度报告.pdf' if item['kind'] == '年度报告' else f'{index:02d}_中裕能源_2026年中期报告_截至2026年6月30日.pdf'
              response = download_pdf(item['url'])
              temp = WORK / f'{index:02d}.pdf'
              temp.write_bytes(response.content)
              meta = validate_pdf(temp, index, item['year'], item['kind'])
              if meta['sha256'] in seen_hashes:
                  raise RuntimeError(f'Duplicate PDF detected: {filename}')
              seen_hashes.add(meta['sha256'])
              shutil.copy2(temp, OUT / filename)
              record = {
                  'filename': filename,
                  'company': '中裕能源控股有限公司',
                  'stock_code': '03633.HK',
                  'report_year': item['year'],
                  'report_type': item['kind'],
                  'hkex_title': item['title'],
                  'filing_date': item['filing_date'],
                  'source_url': response.url,
                  **meta,
              }
              manifest.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(manifest) != 7:
              raise RuntimeError(f'Expected 7 reports, got {len(manifest)}')

          readme = [
              '中裕能源控股有限公司（03633.HK）定期报告资料包',
              '',
              '内容：2020—2025年完整年度报告，共6份；截至2026年6月30日止六个月的2026年完整中期报告，共1份。',
              '口径说明：港股公司通常按年度和半年度披露定期财务报告，中裕能源当前最新正式定期报告为2026年中期报告，因此以该报告对应用户所称“最新季报”。',
              '',
          ]
          for item in manifest:
              readme.extend([
                  f"- {item['filename']}",
                  f"  港交所标题：{item['hkex_title']}",
                  f"  披露日期：{item['filing_date']}｜页数：{item['pages']}｜大小：{item['bytes']} bytes",
                  f"  官方来源：{item['source_url']}",
                  f"  SHA-256：{item['sha256']}",
              ])
          readme.extend([
              '',
              '核验项目：PDF文件头、港交所证券代码与标题元数据、报告年份、页数、qpdf结构检查、首页与末页渲染、文件去重、SHA-256及ZIP CRC。',
              f'制作时间：{datetime.utcnow().isoformat(timespec="seconds")}Z',
          ])
          (OUT / '报告清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          archive = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as bundle:
              for file in sorted(OUT.rglob('*')):
                  if file.is_file():
                      bundle.write(file, arcname=f'{OUT.name}/{file.relative_to(OUT)}')
          with zipfile.ZipFile(archive) as bundle:
              bad = bundle.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdfs = [name for name in bundle.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 7:
                  raise RuntimeError(f'Archive contains {len(pdfs)} PDFs, expected 7')
              print('ZIP_MEMBERS', json.dumps(bundle.namelist(), ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', archive.name, archive.stat().st_size, sha256(archive), flush=True)
          PY

      - name: Upload final archive
        uses: actions/upload-artifact@v4
        with:
          name: zhongyu-energy-03633-reports-20260926
          path: 中裕能源_03633_2020-2025年报及2026年中期报告.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
