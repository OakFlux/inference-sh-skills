name: Build ST Gudi broker reports package 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-st-gudi-broker-reports-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build verified ZIP package
        run: python scripts/build_st_gudi_broker_reports_20261004.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: st-gudi-002694-broker-reports-2-20261004
          path: '*ST顾地_002694_券商研究报告_2份_20261004.zip'
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
