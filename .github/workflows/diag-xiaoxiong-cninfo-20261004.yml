name: Diagnose Xiaoxiong CNInfo filings 20261004
on:
  push:
    paths:
      - '.github/workflows/diag-xiaoxiong-cninfo-20261004.yml'
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query official CNInfo archive
        shell: bash
        run: |
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          h={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Accept':'application/json, text/javascript, */*; q=0.01',
            'Accept-Language':'zh-CN,zh;q=0.9',
            'Referer':'https://www.cninfo.com.cn/new/disclosure/stock?stockCode=002959',
            'Origin':'https://www.cninfo.com.cn',
            'X-Requested-With':'XMLHttpRequest',
          }
          org=''
          for u in ['https://www.cninfo.com.cn/new/data/szse_stock.json','https://www.cninfo.com.cn/new/data/szse_stock.json?_=1']:
            try:
              r=s.get(u,headers=h,timeout=45); print('STOCKLIST',u,r.status_code,len(r.content),r.text[:200],flush=True)
              data=r.json(); rows=data.get('stockList') or data.get('data') or data
              for x in rows:
                code=str(x.get('code') or x.get('stockCode') or '')
                if code=='002959':
                  print('STOCK_ROW',json.dumps(x,ensure_ascii=False),flush=True)
                  org=str(x.get('orgId') or x.get('orgid') or x.get('id') or '')
              if org: break
            except Exception as e: print('STOCKLIST_ERROR',repr(e),flush=True)
          stocks=[]
          if org: stocks.append('002959,'+org)
          stocks += ['002959,gfbj002959','002959,gssz0002959','002959,sz','002959','']
          seen=set()
          for stock in stocks:
            if stock in seen: continue
            seen.add(stock)
            print('\nTRY_STOCK',repr(stock),flush=True)
            for page in range(1,8):
              form={
                'pageNum':str(page),'pageSize':'100','column':'szse','tabName':'fulltext','plate':'sz',
                'stock':stock,'searchkey':'','secid':'','category':'','trade':'',
                'seDate':'2020-01-01~2026-10-04','sortName':'','sortType':'','isHLtitle':'true'
              }
              try:
                r=s.post('https://www.cninfo.com.cn/new/hisAnnouncement/query',headers=h,data=form,timeout=75)
                print('QUERY',repr(stock),page,r.status_code,r.headers.get('content-type'),len(r.content),r.text[:120],flush=True)
                r.raise_for_status(); data=r.json(); rows=data.get('announcements') or []
                print('META',data.get('totalAnnouncement'),data.get('totalpages'),len(rows),flush=True)
                for x in rows:
                  title=str(x.get('announcementTitle') or '').replace('<em>','').replace('</em>','')
                  if any(k in title for k in ['2020年年度报告','2021年年度报告','2022年年度报告','2023年年度报告','2024年年度报告','2025年年度报告','2026年第一季度报告','2026年一季度报告','2026年半年度报告']):
                    print('MATCH',json.dumps({k:x.get(k) for k in ['announcementTitle','announcementTime','adjunctUrl','announcementId','secCode','secName','orgId']},ensure_ascii=False,default=str),flush=True)
                if not rows or page >= int(data.get('totalpages') or 1): break
              except Exception as e:
                print('QUERY_ERROR',repr(e),flush=True); break
            if stock and page and rows:
              pass
          PY
