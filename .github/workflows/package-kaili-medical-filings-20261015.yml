name: Package Kaili Medical filings 20261015

on:
  push:
    branches:
      - kaili-medical-filings-20261015
    paths:
      - scripts/package_kaili_medical_filings_20261015.py
      - .github/workflows/package-kaili-medical-filings-20261015.yml
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf
      - name: Download, validate, and package filings
        run: python scripts/package_kaili_medical_filings_20261015.py
      - name: Show package summary
        run: cat dist_kaili_medical_filings/package_summary.json
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kaili-medical-300633-filings-20261015
          path: |
            dist_kaili_medical_filings/*.zip
            dist_kaili_medical_filings/package_summary.json
          if-no-files-found: error
          retention-days: 30
