name: Search wider Eastmoney date ranges for Zotye reports 20260929

on:
  push:
    paths:
      - '.github/workflows/diag-zotye-eastmoney-wide-date-ranges-20260929.yml'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Search nearby publication dates
        run: |
          python - <<'PY'
          import json, requests
          ranges=[('2017-02-15','2017-04-15'),('2017-10-01','2017-11-05')]
          needles=['众泰','金马股份','从模仿到原创','传统汽车和新能源汽车','自主品牌后起之秀','收购剑走偏锋','OPPO','VIVO']
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/json','Content-Type':'application/json'}
          found={}
          for begin,end in ranges:
            for page in range(1,15):
              body={'pageSize':500,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':begin,'endTime':end,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers=h,timeout=75)
              print('QUERY',begin,end,page,r.status_code,len(r.content),flush=True)
              r.raise_for_status(); data=r.json(); rows=data.get('data') or []
              print('META',data.get('hits'),data.get('TotalPage'),len(rows),flush=True)
              for row in rows:
                blob=' '.join(str(row.get(k) or '') for k in ('title','stockName','stockCode','orgSName','researcher'))
                if row.get('stockCode')=='000980' or any(n in blob for n in needles):
                  info=str(row.get('infoCode') or '')
                  found[info or blob]=row
                  print('MATCH',json.dumps(row,ensure_ascii=False,default=str),flush=True)
              if not rows or page>=int(data.get('TotalPage') or 1): break
          print('FOUND_COUNT',len(found),flush=True)
          for info,row in found.items():
            print('RESULT',info,json.dumps(row,ensure_ascii=False,default=str),flush=True)
            if info.startswith('AP'):
              url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              p=s.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/pdf'},timeout=120,stream=True)
              head=next(p.iter_content(32),b'')
              print('PDF',info,p.status_code,p.headers.get('content-type'),p.headers.get('content-length'),repr(head[:16]),flush=True)
              p.close()
          PY
