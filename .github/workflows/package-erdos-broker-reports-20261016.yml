name: Package Erdos broker reports 20261016

on:
  push:
    branches:
      - erdos-broker-reports-20261016
    paths:
      - scripts/package_erdos_broker_reports_20261016.py
      - .github/workflows/package-erdos-broker-reports-20261016.yml
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf
      - name: Download, validate, and package reports
        run: python scripts/package_erdos_broker_reports_20261016.py
      - name: Show package summary
        run: cat dist_erdos_broker/package_summary.json
      - name: Verify packaged PDF count
        run: |
          python - <<'PY'
          import glob, zipfile
          paths = glob.glob('dist_erdos_broker/*.zip')
          assert len(paths) == 1, paths
          with zipfile.ZipFile(paths[0]) as zf:
              assert zf.testzip() is None
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              assert 2 <= len(pdfs) <= 3, pdfs
          print(paths[0], len(pdfs))
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: erdos-600295-broker-reports-20261016
          path: |
            dist_erdos_broker/*.zip
            dist_erdos_broker/package_summary.json
          if-no-files-found: error
          retention-days: 30
