name: Temporary verified Sany Renewable Energy filings package

on:
  push:
    branches:
      - tmp/download-sany-renewable-filings-20260830
    paths:
      - .github/workflows/tmp-sany-filings-package.yml

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip

      - name: Download and verify regulatory filings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previews package diagnostic
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import datetime as dt
          import hashlib
          import json
          import re
          import subprocess

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          OUTPUT = Path('output')
          PREVIEWS = Path('previews')
          PACKAGE = Path('package')
          DIAG = Path('diagnostic')

          filings = [
              {
                  'art_code': 'AN202604221821459812',
                  'filename': '01_Sany_Renewable_Energy_2025_Annual_Report.pdf',
                  'title': '三一重能2025年年度报告',
                  'date': '2026-04-23',
                  'category': '年度报告全文',
                  'needles': ['三一重能', '2025年年度报告'],
                  'min_pages': 50,
              },
              {
                  'art_code': 'AN202504281663932161',
                  'filename': '02_Sany_Renewable_Energy_2024_Annual_Report.pdf',
                  'title': '三一重能2024年年度报告',
                  'date': '2025-04-29',
                  'category': '年度报告全文',
                  'needles': ['三一重能', '2024年年度报告'],
                  'min_pages': 50,
              },
              {
                  'art_code': 'AN202404291631617457',
                  'filename': '03_Sany_Renewable_Energy_2023_Annual_Report.pdf',
                  'title': '三一重能2023年年度报告',
                  'date': '2024-04-30',
                  'category': '年度报告全文',
                  'needles': ['三一重能', '2023年年度报告'],
                  'min_pages': 50,
              },
              {
                  'art_code': 'AN202304281586091355',
                  'filename': '04_Sany_Renewable_Energy_2022_Annual_Report.pdf',
                  'title': '三一重能2022年年度报告',
                  'date': '2023-04-29',
                  'category': '年度报告全文',
                  'needles': ['三一重能', '2022年年度报告'],
                  'min_pages': 50,
              },
              {
                  'art_code': 'AN202206161572568507',
                  'filename': '05_Sany_Renewable_Energy_IPO_Prospectus_20220617.pdf',
                  'title': '三一重能首次公开发行股票并在科创板上市招股说明书',
                  'date': '2022-06-17',
                  'category': '正式上市招股说明书',
                  'needles': ['三一重能', '招股说明书'],
                  'min_pages': 200,
              },
              {
                  'art_code': 'AN202604221821459767',
                  'filename': '06_Sany_Renewable_Energy_2026_Q1_Report.pdf',
                  'title': '三一重能2026年第一季度报告',
                  'date': '2026-04-23',
                  'category': '最新季度报告',
                  'needles': ['三一重能', '2026年第一季度报告'],
                  'min_pages': 10,
              },
              {
                  'art_code': 'AN202608271828550441',
                  'filename': '07_Sany_Renewable_Energy_2026_H1_Report_Supplement.pdf',
                  'title': '三一重能2026年半年度报告',
                  'date': '2026-08-28',
                  'category': '最新半年度报告（补充）',
                  'needles': ['三一重能', '2026年半年度报告'],
                  'min_pages': 40,
              },
          ]

          def download_pdf(record: dict, index: int) -> tuple[Path, str]:
              code = record['art_code']
              attempts = [
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf?{record["date"].replace("-", "")}.pdf=',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{record["date"].replace("-", "")}.pdf=',
              ]
              temp = OUTPUT / f'temp_{index:02d}.pdf'
              for url in attempts:
                  temp.unlink(missing_ok=True)
                  cmd = [
                      'curl', '--http1.1', '-L', '--fail', '--silent', '--show-error',
                      '--retry', '10', '--retry-all-errors', '--retry-delay', '2',
                      '--connect-timeout', '30', '--max-time', '1200', '--compressed',
                      '-A', UA, '-e', 'https://data.eastmoney.com/notices/stock/688349.html',
                      '-H', 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                      url, '-o', str(temp),
                  ]
                  proc = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  size = temp.stat().st_size if temp.exists() else 0
                  magic = temp.read_bytes()[:8] if temp.exists() else b''
                  print('TRY', code, 'RC', proc.returncode, 'SIZE', size, 'MAGIC', magic, 'URL', url, 'ERR', proc.stderr[-300:])
                  if proc.returncode == 0 and size > 25000 and magic[:4] == b'%PDF':
                      return temp, url
              raise RuntimeError(f'Unable to download valid PDF for {code}')

          verified = []
          for index, record in enumerate(filings, start=1):
              temp, source_url = download_pdf(record, index)
              pdfinfo = subprocess.check_output(['pdfinfo', str(temp)], text=True, errors='replace')
              match = re.search(r'^Pages:\s*(\d+)', pdfinfo, re.M)
              pages = int(match.group(1)) if match else 0
              if pages < int(record['min_pages']):
                  raise RuntimeError(f'{record["title"]}: only {pages} pages, expected at least {record["min_pages"]}')

              text_file = DIAG / f'{record["art_code"]}.txt'
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(20, pages)), str(temp), str(text_file)],
                  check=True,
              )
              text = text_file.read_text(encoding='utf-8', errors='replace')
              compact = ''.join(text.split())
              for needle in record['needles']:
                  if ''.join(needle.split()) not in compact:
                      raise RuntimeError(f'{record["title"]}: verification text not found: {needle}')

              final_pdf = OUTPUT / record['filename']
              temp.replace(final_pdf)

              for page_no, tag in [(1, 'first'), (pages, 'last')]:
                  target = PREVIEWS / f'{index:02d}_{tag}'
                  subprocess.run(
                      ['pdftoppm', '-f', str(page_no), '-singlefile', '-png', '-r', '90', str(final_pdf), str(target)],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  )
                  png = Path(str(target) + '.png')
                  if not png.exists() or png.stat().st_size < 8000:
                      raise RuntimeError(f'{record["title"]}: {tag}-page render failed')

              digest = hashlib.sha256(final_pdf.read_bytes()).hexdigest()
              item = dict(record)
              item.update({
                  'pages': pages,
                  'size_bytes': final_pdf.stat().st_size,
                  'sha256': digest,
                  'source_url': source_url,
              })
              verified.append(item)
              print('VERIFIED', json.dumps(item, ensure_ascii=False))

          manifest = {
              'company': '三一重能股份有限公司',
              'stock_code': '688349.SH',
              'generated_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'annual_reports': [r for r in verified if r['category'] == '年度报告全文'],
              'prospectus': [r for r in verified if r['category'] == '正式上市招股说明书'],
              'latest_quarterly_report': [r for r in verified if r['category'] == '最新季度报告'],
              'latest_half_year_report_supplement': [r for r in verified if '补充' in r['category']],
              'files': verified,
          }
          (PACKAGE / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          readme = [
              '三一重能（688349.SH）定期报告及招股说明书资料包',
              '',
              '本资料包包含上市后全部年度报告（2022-2025）、正式上市招股说明书、',
              '2026年第一季度报告，以及更新披露的2026年半年度报告补充件。',
              '未收录年度报告摘要、半年度报告摘要或招股说明书申报稿/上会稿/注册稿。',
              '',
          ]
          for i, r in enumerate(verified, start=1):
              readme.extend([
                  f'{i}. {r["title"]}',
                  f'   披露日期：{r["date"]}',
                  f'   类别：{r["category"]}',
                  f'   实际页数：{r["pages"]}',
                  f'   文件名：{r["filename"]}',
                  f'   公告代码：{r["art_code"]}',
                  '',
              ])
          readme.extend([
              '核验说明：所有PDF均已检查文件头、实际页数和首页标题文字；',
              '每份PDF的首页与末页均已成功渲染，ZIP附带SHA-256校验值。',
              '仅供公开信息整理和研究使用。',
          ])
          (PACKAGE / '报告清单与核验说明.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (PACKAGE / 'SHA256SUMS.txt').write_text(
              '\n'.join(f'{r["sha256"]}  {r["filename"]}' for r in verified) + '\n',
              encoding='utf-8',
          )
          for r in verified:
              (PACKAGE / r['filename']).write_bytes((OUTPUT / r['filename']).read_bytes())

          print('FINAL_COUNT', len(verified))
          for r in verified:
              print('FINAL', r['category'], r['date'], r['pages'], r['filename'])
          PY

          (cd package && zip -q -9 ../Sany_Renewable_Energy_Annual_Reports_Prospectus_Latest_Reports.zip ./*)
          unzip -t Sany_Renewable_Energy_Annual_Reports_Prospectus_Latest_Reports.zip
          ls -lh output package previews Sany_Renewable_Energy_Annual_Reports_Prospectus_Latest_Reports.zip

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: sany-renewable-energy-annual-reports-prospectus-latest-reports
          path: |
            Sany_Renewable_Energy_Annual_Reports_Prospectus_Latest_Reports.zip
            output/*.pdf
            package/manifest.json
            package/报告清单与核验说明.txt
            package/SHA256SUMS.txt
            previews/*.png
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
