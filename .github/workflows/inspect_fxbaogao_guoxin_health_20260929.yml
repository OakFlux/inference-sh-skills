name: Inspect FxBaogao Guoxin Health source

on:
  push:
    paths:
      - '.github/workflows/inspect_fxbaogao_guoxin_health_20260929.yml'
      - 'tools/inspect_fxbaogao_guoxin_health_20260929.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/inspect_fxbaogao_guoxin_health_20260929.py
      - uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-guoxin-health-inspection
          path: |
            fxbaogao_guoxin_health_inspection.json
            fxbaogao_guoxin_health_page.html
          if-no-files-found: error
          retention-days: 3
