name: Discover official WeRide filings

on:
  push:
    paths:
      - '.github/workflows/weride-discover-official-filings-20260902-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect IR, SEC and HKEX links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re, time
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          s = requests.Session()
          base_headers = {
              'User-Agent': ua,
              'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8',
          }

          pages = [
              'https://ir.weride.ai/financials-filings/annual-reports',
              'https://ir.weride.ai/node/6571',
              'https://ir.weride.ai/zh-hant/node/6571',
              'https://ir.weride.ai/node/7836',
              'https://ir.weride.ai/node/7851',
              'https://ir.weride.ai/node/9276',
              'https://ir.weride.ai/news-releases/news-release-details/accelerating-european-expansion-through-proven-asset-light-model',
              'https://asia.tools.euroland.com/tools/pressreleases/?companycode=HK-WERIDE&lang=en-GB',
          ]

          for page in pages:
              try:
                  r = s.get(page, headers={**base_headers, 'Accept':'text/html,application/xhtml+xml,*/*'}, timeout=(20,120), allow_redirects=True)
                  print('\n=== PAGE', page, r.status_code, r.headers.get('content-type'), len(r.content), r.url, '===', flush=True)
                  print('TITLE', BeautifulSoup(r.text, 'html.parser').title.get_text(' ', strip=True) if '<html' in r.text.lower() and BeautifulSoup(r.text, 'html.parser').title else '', flush=True)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = urljoin(r.url, a['href'])
                      label = ' '.join(a.get_text(' ', strip=True).split())
                      hay = (href + ' ' + label).lower()
                      if any(k in hay for k in ['pdf', 'download', 'prospectus', 'annual report', 'earnings release', '20-f', '424b', 'hkex', 'listedco/listconews']):
                          print('LINK', repr(label), href, flush=True)
                  for m in sorted(set(re.findall(r'https?://[^"\'<>\s\\]+', r.text))):
                      if any(k in m.lower() for k in ['.pdf', 'prospectus', 'listedco/listconews', 'hkexnews']):
                          print('URLMATCH', m[:2000], flush=True)
              except Exception as exc:
                  print('PAGE_ERROR', page, repr(exc), flush=True)

          # HKEX stock prefix lookup.
          prefix_urls = [
              'https://www1.hkexnews.hk/search/prefix.do?callback=cb&lang=EN&type=A&name=0800&market=SEHK',
              'https://www1.hkexnews.hk/search/prefix.do?callback=cb&lang=ZH&type=A&name=0800&market=SEHK',
              'https://www1.hkexnews.hk/search/prefix.do?callback=cb&lang=EN&type=A&name=00800&market=SEHK',
          ]
          stock_ids = set()
          for url in prefix_urls:
              try:
                  r = s.get(url, headers={**base_headers, 'Accept':'application/javascript,application/json,*/*', 'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en'}, timeout=(20,120))
                  print('\n=== PREFIX', r.status_code, len(r.content), r.url, '===', flush=True)
                  print(r.text[:10000], flush=True)
                  for sid in re.findall(r'"stockId"\s*:\s*"?([0-9]+)', r.text):
                      stock_ids.add(sid)
              except Exception as exc:
                  print('PREFIX_ERROR', url, repr(exc), flush=True)
          print('STOCK_IDS', sorted(stock_ids), flush=True)

          # Try HKEX title search with each discovered stock id plus common fallbacks.
          stock_ids.update(['800', '00800'])
          endpoint = 'https://www1.hkexnews.hk/search/titleSearchServlet.do'
          for sid in sorted(stock_ids):
              for lang in ['EN','ZH']:
                  payloads = [
                      {
                          'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK',
                          'stockId':sid,'documentType':'-1','fromDate':'20251019','toDate':'20260902',
                          'title':'','searchType':'1','t1code':'-2','t2Gcode':'-2','t2code':'-2',
                          'rowRange':'200','lang':lang,
                      },
                      {
                          'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK',
                          'stockId':sid,'documentType':'-1','fromDate':'20251019','toDate':'20260902',
                          'title':'','searchType':'1','rowRange':'200','lang':lang,
                      },
                  ]
                  for payload in payloads:
                      try:
                          r = s.post(endpoint, data=payload, headers={**base_headers, 'Accept':'application/json,text/plain,*/*', 'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8', 'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en', 'X-Requested-With':'XMLHttpRequest'}, timeout=(20,120))
                          print('\n=== TITLESEARCH sid', sid, 'lang', lang, 'status', r.status_code, 'len', len(r.content), '===', flush=True)
                          print(r.text[:100000], flush=True)
                      except Exception as exc:
                          print('TITLESEARCH_ERROR', sid, lang, repr(exc), flush=True)
          PY
