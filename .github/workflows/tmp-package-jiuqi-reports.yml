name: Package verified Jiuqi Software reports

on:
  push:
    branches:
      - tmp/jiuqi-reports-20260829

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf

      - name: Run verified packaging script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          import textwrap

          source_url = "https://raw.githubusercontent.com/OakFlux/inference-sh-skills/e78cdf29c3a2721979d2ee1a81123fbf0a37dee3/.github/workflows/tmp-package-foxit-reports.yml"
          response = requests.get(source_url, timeout=120)
          response.raise_for_status()
          workflow = response.text

          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError("Unable to extract embedded Python packaging script")

          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = textwrap.dedent(block)

          replacements = [
              ("foxit_verified_package", "jiuqi_verified_package"),
              ('STOCK_ID = "688095"', 'STOCK_ID = "002279"'),
              ('COMPANY = "福建福昕软件开发股份有限公司"', 'COMPANY = "北京久其软件股份有限公司"'),
              ('SHORT_NAME = "福昕软件"', 'SHORT_NAME = "久其软件"'),
              ("福建福昕软件开发股份有限公司", "北京久其软件股份有限公司"),
              ("福昕软件", "久其软件"),
              ('"foxit"', '"jiuqi"'),
              ("688095.SH", "002279.SZ"),
              ('f"{STOCK_ID}.SH"', 'f"{STOCK_ID}.SZ"'),
              ("static.sse.com.cn", "static.szse.cn"),
          ]
          for old, new in replacements:
              code = code.replace(old, new)

          required_tokens = [
              'STOCK_ID = "002279"',
              'COMPANY = "北京久其软件股份有限公司"',
              'SHORT_NAME = "久其软件"',
              '久其软件_2020-2025年报_2026年最新半年报_完整PDF.zip',
          ]
          missing = [token for token in required_tokens if token not in code]
          if missing:
              raise RuntimeError(f"Required replacements missing: {missing}")

          exec(compile(code, "jiuqi_packaging.py", "exec"), {"__name__": "__main__"})
          PY

      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jiuqi-reports-final
          path: 久其软件_2020-2025年报_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
