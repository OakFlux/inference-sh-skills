name: Test Longban Sina attachment

on:
  push:
    paths:
      - '.github/workflows/test_longban_sina_attachment_20261004.yml'
      - 'tools/test_longban_sina_attachment_20261004.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/test_longban_sina_attachment_20261004.py
