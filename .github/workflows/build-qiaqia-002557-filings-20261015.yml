name: Build Qiaqia 002557 filings archive 20261015
on:
  push:
    paths:
      - '.github/workflows/build-qiaqia-002557-filings-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Prepare Qiaqia builder
        shell: bash
        run: |
          git fetch --depth=1 origin task-mayinglong-600993-filings-20261015:refs/remotes/origin/task-mayinglong-600993-filings-20261015
          git show origin/task-mayinglong-600993-filings-20261015:scripts/build_mayinglong_600993_filings_20261015.py > scripts/build_qiaqia_002557_filings_20261015.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_qiaqia_002557_filings_20261015.py')
          t = p.read_text(encoding='utf-8')
          replacements = {
              'CODE = "600993"': 'CODE = "002557"',
              'COMPANY = "马应龙"': 'COMPANY = "洽洽食品"',
              'FULL_COMPANY = "马应龙药业集团股份有限公司"': 'FULL_COMPANY = "洽洽食品股份有限公司"',
              'WORK_ROOT = ROOT / "_build_mayinglong_600993"': 'WORK_ROOT = ROOT / "_build_qiaqia_002557"',
              'ZIP_PATH = ROOT / "mayinglong_600993_2020_2025_annual_reports_latest_quarter.zip"': 'ZIP_PATH = ROOT / "qiaqia_food_002557_2020_2025_annual_reports_latest_quarter.zip"',
              '"sse", "shmb"': '"szse", "szmb"',
              '"sse", ""': '"szse", ""',
          }
          for old, new in replacements.items():
              if old not in t:
                  raise RuntimeError(f'Missing expected text: {old}')
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Build archive
        shell: bash
        run: |
          python scripts/build_qiaqia_002557_filings_20261015.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: qiaqia-002557-filings-20261015
          path: qiaqia_food_002557_2020_2025_annual_reports_latest_quarter.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
