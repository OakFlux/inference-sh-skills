name: Package Kaili Medical broker reports 20261015

on:
  push:
    branches:
      - kaili-medical-broker-reports-20261015
    paths:
      - scripts/package_kaili_medical_broker_reports_20261015.py
      - .github/workflows/package-kaili-medical-broker-reports-20261015.yml
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf
      - name: Download, validate, and package reports
        run: python scripts/package_kaili_medical_broker_reports_20261015.py
      - name: Show package summary
        run: cat dist_kaili_broker/package_summary.json
      - name: Verify packaged PDF count
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          zips = list(Path('dist_kaili_broker').glob('*.zip'))
          assert len(zips) == 1, zips
          with zipfile.ZipFile(zips[0]) as zf:
              assert zf.testzip() is None
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              assert len(pdfs) == 3, pdfs
          print(zips[0], pdfs)
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kaili-medical-300633-broker-reports-20261015
          path: |
            dist_kaili_broker/*.zip
            dist_kaili_broker/package_summary.json
          if-no-files-found: error
          retention-days: 30
