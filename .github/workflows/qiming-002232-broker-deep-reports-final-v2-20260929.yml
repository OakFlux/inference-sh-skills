name: Build Qiming Information broker deep reports final v2 20260929

on:
  push:
    paths:
      - '.github/workflows/qiming-002232-broker-deep-reports-final-v2-20260929.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Replace unavailable report source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_qiming_002232_broker_deep_reports_final_20260929.py')
          text = path.read_text(encoding='utf-8')
          old = '''    {
              "date": "2016-05-05",
              "broker": "长城证券",
              "broker_aliases": ["长城证券", "长城研究"],
              "title": "车联网战略全启动，云服务拓展新空间——启明信息（002232）公司深度报告",
              "filename": "20160505_长城证券_车联网战略全启动_云服务拓展新空间.pdf",
              "url": "https://www.cgws.com/cczq/ggdt/ccyj/201606/P020160608525303437879.pdf",
              "page_url": "https://www.cgws.com/cczq/ggdt/ccyj/201606/t20160608_83594.html",
              "source": "长城证券官网原始附件",
              "authors": "周伟佳、赵悦媛",
              "min_pages": 10,
          },'''
          new = '''    {
              "date": "2009-11-11",
              "broker": "江南证券",
              "broker_aliases": ["江南证券", "江南证券研究所"],
              "title": "从产业的角度全面认识——启明信息公司研究",
              "filename": "20091111_江南证券_从产业的角度全面认识.pdf",
              "url": "https://www.p5w.net/stock/lzft/gsyj/200911/P020091111538313890404.pdf",
              "page_url": "https://www.p5w.net/stock/lzft/gsyj/200911/t2666347.htm",
              "source": "全景网原始研报附件（江南证券研究所）",
              "authors": "未署名",
              "min_pages": 10,
          },'''
          if old not in text:
              raise RuntimeError('expected CGWS report block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/build_qiming_002232_broker_deep_reports_final_20260929.py

      - name: Download validate and package reports
        run: python scripts/build_qiming_002232_broker_deep_reports_final_20260929.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qiming-002232-broker-deep-reports-final-v2
          path: 启明信息_002232_券商深度报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
