name: Temporary Yuexiu Chinese HKEX diagnostics

on:
  push:
    branches:
      - tmp-yuexiu-zhdiag-20260827

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect Chinese HKEX searches
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-HK,zh;q=0.9,en;q=0.8'})
          tests=[
            ('annual','https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&from=20210401&lang=ZH&market=SEHK&stockId=201&t1code=40000&t2Gcode=-1&t2code=40100&to=20260531'),
            ('interim','https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&from=20250901&lang=ZH&market=SEHK&stockId=201&t1code=40000&t2Gcode=-1&t2code=40200&to=20251031'),
          ]
          for name,url in tests:
            r=s.get(url,timeout=60)
            print('\nTEST',name,'STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url)
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              low=text.lower()
              if any(k in text for k in ['年報','年度報告','中期報告']) or 'annual report' in low or 'interim report' in low:
                print(' REPORT',repr(text),href)
          PY
