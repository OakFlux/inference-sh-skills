name: Temporary Kingsignal Hibor search probe

on:
  push:
    branches:
      - tmp/download-kingsignal-reports-20260829
    paths:
      - .github/workflows/tmp-kingsignal-hibor-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect Hibor pages and search endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html, json, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6',
          })

          urls=[
            'https://wt.hibor.com.cn/docdetail_1815214.html',
            'https://wt.hibor.com.cn/',
            'https://www.hibor.com.cn/',
          ]
          for url in urls:
            print('\n===== FETCH',url,'=====')
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('HTTP',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url)
              text=r.text
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              print('FORMS',len(soup.find_all('form')))
              for form in soup.find_all('form'):
                print('FORM',form.get('action'),form.get('method'),str(form)[:3000].replace('\n',' '))
              for tag in soup.find_all(['a','script','iframe','embed','object','source','input']):
                blob=str(tag)
                low=blob.lower()
                if any(k in low for k in ['search','keyword','query','pdf','download','docdetail','浏览报告原文','报告原文']):
                  print('TAG',blob[:2500].replace('\n',' '))
              for needle in ['search','keyword','docdetail','download','pdf','1815214','报告原文']:
                poss=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
                print('NEEDLE',needle,'COUNT',len(poss))
                for p in poss[:10]: print('CTX',text[max(0,p-1200):p+3500].replace('\n',' ')[:4700])
              scripts=[]
              for tag in soup.find_all('script',src=True):
                scripts.append(urllib.parse.urljoin(r.url,tag['src']))
              for jsurl in scripts[:60]:
                try:
                  rr=s.get(jsurl,timeout=60)
                  jt=rr.text
                  if any(k in jt.lower() for k in ['search','keyword','download','pdf','docdetail']):
                    print('\nSCRIPT',jsurl,rr.status_code,len(rr.content))
                    for needle in ['search','keyword','download','pdf','docdetail']:
                      p=jt.lower().find(needle)
                      if p>=0: print('JSCTX',needle,jt[max(0,p-1200):p+3500].replace('\n',' ')[:4700])
                except Exception as e: print('SCRIPT_ERR',jsurl,repr(e))
            except Exception as e: print('FETCH_ERR',repr(e))

          keyword='金信诺 打造信号互联解决方案供应商'
          candidates=[
            'https://wt.hibor.com.cn/search?key='+urllib.parse.quote(keyword),
            'https://wt.hibor.com.cn/search.aspx?key='+urllib.parse.quote(keyword),
            'https://wt.hibor.com.cn/search.html?keyword='+urllib.parse.quote(keyword),
            'https://wt.hibor.com.cn/Doc/Search.aspx?key='+urllib.parse.quote(keyword),
            'https://wt.hibor.com.cn/report/search?keyword='+urllib.parse.quote(keyword),
            'https://www.hibor.com.cn/search?key='+urllib.parse.quote(keyword),
            'https://www.hibor.com.cn/Search/?key='+urllib.parse.quote(keyword),
            'https://www.hibor.com.cn/microns_1.html?key='+urllib.parse.quote(keyword),
          ]
          for url in candidates:
            print('\n===== SEARCH TRY',url,'=====')
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('HTTP',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url)
              text=html.unescape(r.text)
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for a in soup.find_all('a',href=True):
                label=a.get_text(' ',strip=True)
                full=urllib.parse.urljoin(r.url,a['href'])
                blob=label+' '+full
                if any(k in blob for k in ['金信诺','打造信号','300252','海通证券']):
                  print('RESULT',label[:1000],full[:1500])
              for pat in [r'docdetail_\d+\.html',r'https?://[^\s"\'<>]+\.pdf[^\s"\'<>]*']:
                for hit in list(dict.fromkeys(re.findall(pat,text,re.I)))[:100]: print('MATCH',hit)
              print(text[:1500].replace('\n',' '))
            except Exception as e: print('TRY_ERR',repr(e))
          PY
