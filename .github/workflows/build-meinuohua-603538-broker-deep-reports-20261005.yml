name: Build Meinuohua 603538 broker deep reports 20261005

on:
  push:
    paths:
      - '.github/workflows/build-meinuohua-603538-broker-deep-reports-20261005.yml'
      - 'scripts/build_meinuohua_603538_broker_deep_reports_20261005.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        run: python scripts/build_meinuohua_603538_broker_deep_reports_20261005.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: meinuohua-603538-broker-deep-reports-20261005
          path: 美诺华_603538_券商深度报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
