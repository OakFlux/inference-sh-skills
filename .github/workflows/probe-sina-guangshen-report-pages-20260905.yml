name: Probe Sina Guangshen report pages

on:
  push:
    branches:
      - chatgpt-china-gas-broker-reports-20260905
    paths:
      - '.github/workflows/probe-sina-guangshen-report-pages-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_sina_guangshen_report_pages_20260905.py
      - uses: actions/upload-artifact@v4
        with:
          name: sina-guangshen-report-probe-20260905
          path: |
            sina-guangshen-probe.json
            sina-guangshen-probe/
          if-no-files-found: error
          retention-days: 1
