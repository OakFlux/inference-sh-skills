name: Probe TransThera prospectus mirror links

on:
  push:
    paths:
      - '.github/workflows/transthera-mirror-link-probe-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe mirror pages
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls = [
            'https://www.sdyanbao.com/detail/894460',
            'https://www.microbell.com/repinfodetail_4209345.html',
          ]
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept':'text/html,*/*'}
          out=[]
          for u in urls:
            try:
              r=requests.get(u,headers=headers,timeout=30,allow_redirects=True)
              print('PAGE',u,r.status_code,len(r.content),r.url,flush=True)
              rec={'url':u,'status':r.status_code,'bytes':len(r.content),'final':r.url,'links':[],'regex':[],'scripts':[]}
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              for a in soup.find_all(['a','button'],href=True):
                href=urljoin(r.url,a.get('href'))
                label=' '.join(a.get_text(' ',strip=True).split())
                if any(x in (href+' '+label).lower() for x in ['pdf','download','894460','4209345','report']):
                  rec['links'].append({'label':label,'href':href})
                  print('LINK',repr(label),href,flush=True)
              for s in soup.find_all('script'):
                src=s.get('src')
                if src: rec['scripts'].append(urljoin(r.url,src))
              patterns=[r'https?://[^\"\'<> ]+',r'[\"\']([^\"\']*(?:pdf|download|894460|4209345)[^\"\']*)[\"\']']
              for pat in patterns:
                for m in re.finditer(pat,text,re.I):
                  val=m.group(1) if m.lastindex else m.group(0)
                  if len(val)<500:
                    rec['regex'].append(val)
              rec['regex']=list(dict.fromkeys(rec['regex']))[:500]
              out.append(rec)
            except Exception as e:
              print('ERROR',u,type(e).__name__,e,flush=True)
              out.append({'url':u,'error':repr(e)})
          print(json.dumps(out,ensure_ascii=False,indent=2),flush=True)
          open('transthera_mirror_probe.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: transthera-mirror-link-probe
          path: transthera_mirror_probe.json
          retention-days: 1
