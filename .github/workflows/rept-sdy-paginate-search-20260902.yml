name: Paginate Sdyanbao REPT BATTERO search

on:
  push:
    paths:
      - '.github/workflows/rept-sdy-paginate-search-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paginate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch result pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures,json,requests
          from pathlib import Path
          URL='https://api.sdyanbao.com/api/file/search'
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/json,text/plain,*/*','Content-Type':'application/json;charset=UTF-8','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report?keyword=%E7%91%9E%E6%B5%A6%E5%85%B0%E9%92%A7','X-Token':'','Device':'1'}
          def fetch(page):
            p={'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':page,'pageSize':200,'keyword':'瑞浦兰钧','pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','opFrom':1}
            try:
              r=requests.post(URL,headers=H,json=p,timeout=(10,55)); j=r.json(); d=j.get('data') if isinstance(j,dict) else None; fs=d.get('files') if isinstance(d,dict) else []
              return {'page':page,'http':r.status_code,'status':j.get('status') if isinstance(j,dict) else None,'total':d.get('total') if isinstance(d,dict) else None,'files':fs,'raw':j}
            except Exception as e:return {'page':page,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex: out=list(ex.map(fetch,[2,3,4,5,6]))
          for x in out:
            fs=x.get('files') or []
            dates=[f.get('time_text','') for f in fs if isinstance(f,dict)]
            print('PAGE',x['page'],'status',x.get('status'),'total',x.get('total'),'count',len(fs),'date_range',(dates[0] if dates else None,dates[-1] if dates else None),'error',x.get('error'),flush=True)
            for f in fs:
              if not isinstance(f,dict): continue
              org=(f.get('organization') or {}).get('name','') if isinstance(f.get('organization'),dict) else ''
              stock=(f.get('stock') or {}).get('name','') if isinstance(f.get('stock'),dict) else ''
              code=(f.get('stock') or {}).get('code','') if isinstance(f.get('stock'),dict) else ''
              name=f.get('name','')
              blob=json.dumps(f,ensure_ascii=False)
              relevant=(
                stock in ['瑞浦兰钧','瑞浦兰均','瑞浦蘭鈞'] or code in ['00666','0666.HK','00666.HK','666 HK'] or
                '瑞浦兰钧' in name or '瑞浦蘭鈞' in name or 'REPT BATTERO' in blob.upper() or
                any(t in name for t in ['规模效应下毛利率提升','1H25毛利率稳步提升','出货量高增，看好盈利改善趋势','储能业务驱动盈利加速修复']) or
                (org in ['交银国际证券','交银国际','兴证国际','兴业证券'] and f.get('time_text') in ['2025-03-27','2025-08-12','2025-09-15','2025-09-17','2026-02-03','2026-08-31'])
              )
              if relevant:
                print('RELEVANT',json.dumps({k:f.get(k) for k in ['id','name','time_text','page_count','file_size','data_source','data_source_uuid','original_id','online_url','page_url','share_url','organization','researcher','stock','type','industry','keyword','summary','content']},ensure_ascii=False),flush=True)
          Path('rept_sdy_pages_2_6.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rept-sdy-paginated-search
          path: rept_sdy_pages_2_6.json
          retention-days: 7
