name: Probe Hesai broker report sources

on:
  push:
    branches:
      - tmp/hesai-broker-reports-20260914
    paths:
      - '.github/workflows/hesai-report-probe-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Taipei

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/hesai-broker-reports-20260914
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Probe sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe_output
          mkdir -p probe_output/pages
          python - <<'PY'
          import json, os, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('probe_output')
          PAGES = OUT / 'pages'
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36'
          s = requests.Session()
          s.headers.update({'User-Agent': ua, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7'})
          results = {'pages': [], 'eastmoney': [], 'searches': [], 'urls': []}

          targets = [
            'https://www.fxbaogao.com/detail/4958732',
            'https://www.fxbaogao.com/view?id=4958732',
            'https://www.vzkoo.com/read/2025072393f91aa19d9f68d44e6c5489.html',
            'https://www.vzkoo.com/read/4650358727080153088.html',
            'https://www.hangyan.co/reports/3586373163543430735',
            'https://www.baogaobox.com/insights/250722000013392.html',
            'https://www.sdyanbao.com/search?keyword=%E7%A6%BE%E8%B5%9B',
            'https://r.jina.ai/http://www.fxbaogao.com/detail/4958732',
            'https://r.jina.ai/http://www.vzkoo.com/read/2025072393f91aa19d9f68d44e6c5489.html',
            'https://r.jina.ai/http://www.vzkoo.com/read/4650358727080153088.html',
          ]

          url_pat = re.compile(r'https?://[^\s\"\'<>\\]+', re.I)
          pdf_pat = re.compile(r'https?://[^\s\"\'<>\\]+?\.pdf(?:\?[^\s\"\'<>\\]*)?', re.I)

          def safe_name(i, url):
              host = urllib.parse.urlparse(url).netloc.replace(':','_')
              return f'{i:02d}_{host}.txt'

          def scan_text(text, base):
              found = set()
              for m in pdf_pat.findall(text):
                  found.add(m.replace('\\u002F','/').replace('\\/','/'))
              soup = BeautifulSoup(text, 'lxml')
              for tag in soup.find_all(['a','iframe','embed','source','script']):
                  for attr in ('href','src','data-src','data-url','data-file','data-pdf'):
                      v = tag.get(attr)
                      if v:
                          u = urllib.parse.urljoin(base, v)
                          if '.pdf' in u.lower() or any(k in u.lower() for k in ('download','view','report')):
                              found.add(u)
              for key in ('pdfUrl','pdf_url','downloadUrl','download_url','fileUrl','file_url','url'):
                  for m in re.finditer(rf'[\"\']{key}[\"\']\s*:\s*[\"\']([^\"\']+)', text, re.I):
                      u = m.group(1).replace('\\u002F','/').replace('\\/','/')
                      found.add(urllib.parse.urljoin(base, u))
              return sorted(found)

          for i, url in enumerate(targets, 1):
              item = {'url': url}
              try:
                  r = s.get(url, timeout=60, allow_redirects=True)
                  item.update({'status': r.status_code, 'final_url': r.url, 'content_type': r.headers.get('content-type'), 'size': len(r.content)})
                  text = r.text
                  (PAGES / safe_name(i, url)).write_text(text, encoding='utf-8', errors='ignore')
                  item['found'] = scan_text(text, r.url)
                  results['urls'].extend(item['found'])
              except Exception as e:
                  item['error'] = repr(e)
              results['pages'].append(item)

          # Search engines for exact report titles and related long-form reports.
          queries = [
            '"ADAS激光雷达龙头，庭院机器人等Robotics领域构筑第二成长曲线" pdf',
            '"禾赛科技" "首次覆盖" pdf',
            '"禾赛" "公司深度" pdf 证券',
            '"禾赛_H公司研究报告" pdf',
            '"智驾平权逐步落地，行业确定性强" 禾赛 pdf',
            'site:pdf.dfcfw.com 禾赛',
          ]
          for qi, q in enumerate(queries, 1):
              search_item = {'query': q, 'engines': []}
              for engine, tpl in [
                  ('bing', 'https://www.bing.com/search?q={}'),
                  ('duck', 'https://html.duckduckgo.com/html/?q={}'),
                  ('jina_bing', 'https://r.jina.ai/http://www.bing.com/search?q={}'),
              ]:
                  url = tpl.format(urllib.parse.quote(q))
                  ent = {'engine': engine, 'url': url}
                  try:
                      r = s.get(url, timeout=60, allow_redirects=True)
                      ent.update({'status': r.status_code, 'size': len(r.content), 'final_url': r.url})
                      text = r.text
                      (PAGES / f'search_{qi:02d}_{engine}.txt').write_text(text, encoding='utf-8', errors='ignore')
                      ent['found'] = scan_text(text, r.url)
                      ent['all_urls'] = sorted(set(url_pat.findall(text)))[:200]
                      results['urls'].extend(ent['found'])
                  except Exception as e:
                      ent['error'] = repr(e)
                  search_item['engines'].append(ent)
              results['searches'].append(search_item)

          # Eastmoney research report API probes.
          codes = ['HSAI','HSAI.O','HSAI.US','HSAI.N','02525','2525','02525.HK','2525.HK','A20721']
          for code in codes:
              params = {
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2023-01-01','endTime':'2026-09-14','pageNo':'1','fields':'','qType':'0',
                  'orgCode':'*','code':code,'rcode':'*','p':'1','pageNum':'1','pageNumber':'1','_':str(int(time.time()*1000))
              }
              item = {'code': code, 'get': None, 'post': None}
              try:
                  r = s.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=60, headers={'Referer':'https://data.eastmoney.com/'})
                  item['get'] = {'status':r.status_code,'size':len(r.content),'url':r.url,'text':r.text[:5000]}
                  (PAGES / f'eastmoney_get_{re.sub("[^A-Za-z0-9]","_",code)}.json').write_bytes(r.content)
              except Exception as e:
                  item['get'] = {'error':repr(e)}
              try:
                  body = {k:v for k,v in params.items() if k != '_'}
                  body.update({'rating':None,'ratingChange':None,'orgCode':None,'rcode':''})
                  r = s.post('https://reportapi.eastmoney.com/report/list2', json=body, timeout=60, headers={'Referer':'https://data.eastmoney.com/','Content-Type':'application/json'})
                  item['post'] = {'status':r.status_code,'size':len(r.content),'url':r.url,'text':r.text[:5000]}
                  (PAGES / f'eastmoney_post_{re.sub("[^A-Za-z0-9]","_",code)}.json').write_bytes(r.content)
              except Exception as e:
                  item['post'] = {'error':repr(e)}
              results['eastmoney'].append(item)

          # De-duplicate and test candidate URLs that look like PDFs.
          candidates = []
          for u in sorted(set(results['urls'])):
              clean = u.strip('.,);]')
              if '.pdf' not in clean.lower():
                  continue
              test = {'url': clean}
              try:
                  r = s.get(clean, timeout=90, allow_redirects=True, stream=False, headers={'Referer':'https://www.fxbaogao.com/'})
                  test.update({'status':r.status_code,'final_url':r.url,'type':r.headers.get('content-type'),'size':len(r.content),'prefix':r.content[:12].hex()})
              except Exception as e:
                  test['error'] = repr(e)
              candidates.append(test)
          results['pdf_candidates'] = candidates
          results['urls'] = sorted(set(results['urls']))
          (OUT / 'probe_results.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'pages':results['pages'],'pdf_candidates':candidates,'eastmoney':results['eastmoney']}, ensure_ascii=False, indent=2))
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: hesai-report-probe-20260914
          path: probe_output
          retention-days: 3
