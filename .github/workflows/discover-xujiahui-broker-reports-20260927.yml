name: Discover Xujiahui broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/discover-xujiahui-broker-reports-20260927.yml'
      - 'scripts/discover_xujiahui_broker_reports_20260927.py'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
