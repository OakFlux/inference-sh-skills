name: Package Tiantan broker reports 20261016

on:
  push:
    branches:
      - tiantan-broker-reports-20261016
    paths:
      - scripts/package_tiantan_broker_reports_20261016.py
      - .github/workflows/package-tiantan-broker-reports-20261016.yml
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf
      - name: Download, validate, and package reports
        run: python scripts/package_tiantan_broker_reports_20261016.py
      - name: Show package summary
        run: cat dist_tiantan_broker/package_summary.json
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tiantan-biological-600161-broker-reports-20261016
          path: |
            dist_tiantan_broker/*.zip
            dist_tiantan_broker/package_summary.json
          if-no-files-found: error
          retention-days: 30
