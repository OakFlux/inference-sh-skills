name: Inspect Fujian Cement target pages for PDF URLs 20260929

on:
  push:
    paths:
      - '.github/workflows/fujian-cement-target-pages-scrape-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          pages=[
            'https://www.sgpjbg.com/labels/shangfengshuinigongsi.html',
            'https://www.sgpjbg.com/labels/fengbimuxiandefangchao.html',
            'https://news.futunn.com/post/28982593/fujian-cement-600802-the-small-and-beautiful-closed-market',
            'https://news.futunn.com/post/28980609/fujian-cement-600802-first-coverage-report-high-elasticity-and-low',
            'https://news.futunn.com/post/28984237/in-depth-study-of-fujian-cement-600802-company-outstanding-advantages',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          patterns=[r'https?://[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?',r'[^"\'<>\s]{0,100}(?:pdf|download|attachment|fileurl|sourceurl|report)[^"\'<>\s]{0,200}']
          for url in pages:
            print('\n=== PAGE',url,'===',flush=True)
            try:
              r=s.get(url,timeout=(30,180),allow_redirects=True)
              print('HTTP',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),flush=True)
              print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False),flush=True)
              text=r.text
              print('TITLE_SNIP',text[:500].replace('\n',' '),flush=True)
              soup=BeautifulSoup(text,'html.parser')
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a.get('href'))
                label=' '.join(a.get_text(' ',strip=True).split())
                blob=(label+' '+href).lower()
                if any(k in blob for k in ['福建水泥','封闭市场','高弹性','下载','download','.pdf','report','baogao']):
                  print('LINK',json.dumps({'text':label,'href':href},ensure_ascii=False),flush=True)
              for tag in soup.find_all(['script','iframe','embed','object','source']):
                attrs={k:str(v) for k,v in tag.attrs.items()}
                blob=json.dumps(attrs,ensure_ascii=False)
                if any(k in blob.lower() for k in ['pdf','download','report','file','attachment']):
                  print('TAG',tag.name,blob[:2000],flush=True)
              for pat in patterns:
                matches=[]
                for m in re.finditer(pat,text,re.I):
                  v=m.group(0)
                  if v not in matches: matches.append(v)
                  if len(matches)>=100: break
                print('PATTERN',pat,'COUNT',len(matches),flush=True)
                for v in matches: print('MATCH',v[:1000],flush=True)
              for key in ['__NEXT_DATA__','__NUXT__','INITIAL_STATE','pageData','pdfUrl','fileUrl','downloadUrl','reportId','documentId']:
                if key.lower() in text.lower():
                  print('KEY_FOUND',key,flush=True)
            except Exception as e:
              print('ERROR',repr(e),flush=True)
          PY
