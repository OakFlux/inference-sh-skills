name: Probe Guangshen all research report types

on:
  push:
    branches:
      - chatgpt-china-gas-broker-reports-20260905
    paths:
      - '.github/workflows/probe-guangshen-all-report-types-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_guangshen_all_report_types_20260905.py
      - uses: actions/upload-artifact@v4
        with:
          name: guangshen-all-types-probe-20260905
          path: guangshen-all-types-probe.json
          if-no-files-found: error
          retention-days: 1
