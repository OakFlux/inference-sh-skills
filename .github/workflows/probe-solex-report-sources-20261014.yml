name: Probe Solex report sources 20261014

on:
  push:
    paths:
      - '.github/workflows/probe-solex-report-sources-20261014.yml'
      - 'scripts/probe_solex_report_sources_20261014.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Probe candidate sources
        run: python scripts/probe_solex_report_sources_20261014.py | tee solex_source_probe.log
      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: solex-report-source-probe-20261014
          path: |
            solex_source_probe/
            solex_source_probe.log
          if-no-files-found: error
          retention-days: 30
