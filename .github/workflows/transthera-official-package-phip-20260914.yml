name: Package TransThera reports with official PHIP 20260914

on:
  push:
    paths:
      - '.github/workflows/transthera-official-package-phip-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests beautifulsoup4 pymupdf

      - name: Download validate merge and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import pymupdf
          import requests
          from bs4 import BeautifulSoup

          AS_OF = '2026-09-14'
          COMPANY_ZH = '药捷安康（南京）科技股份有限公司'
          COMPANY_TRAD = '藥捷安康（南京）科技股份有限公司'
          COMPANY_EN = 'TransThera Sciences (Nanjing), Inc.'
          STOCK_CODE = '02617.HK'
          ROOT_NAME = '药捷安康_全部年报_招股说明书及最新定期报告_截至2026-09-14'
          ROOT = Path(ROOT_NAME)
          WORK = Path('_transthera_phip_work')
          PARTS = WORK / 'phip_parts'
          RENDERS = WORK / 'renders'
          OUTZIP = Path('TransThera_All_Annual_Reports_Prospectus_Latest_Report_2026-09-14.zip')
          for directory in (ROOT, PARTS, RENDERS):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'application/pdf,text/html,application/xhtml+xml,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,zh-TW;q=0.8,en;q=0.6',
              'Referer': 'https://www1.hkexnews.hk/',
              'Connection': 'close',
          }

          def compact(value: str) -> str:
              return re.sub(r'[^0-9A-Z\u3400-\u9FFF]+', '', str(value).upper())

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def variants(url: str) -> list[str]:
              values = [url]
              if 'www1.hkexnews.hk' in url:
                  values.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  values.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(values))

          def download(urls: list[str], *, min_bytes: int = 30000) -> tuple[bytes, str]:
              errors = []
              expanded = []
              for url in urls:
                  expanded.extend(variants(url))
              for candidate in list(dict.fromkeys(expanded)):
                  for attempt in range(1, 4):
                      try:
                          response = session.get(candidate, headers=headers, timeout=(30, 900), allow_redirects=True)
                          print('GET', attempt, response.status_code, len(response.content), response.headers.get('content-type'), candidate, flush=True)
                          if response.status_code == 200 and response.content.startswith(b'%PDF-') and len(response.content) >= min_bytes:
                              return response.content, str(response.url)
                          errors.append(f'{candidate}: HTTP {response.status_code}/{len(response.content)}')
                      except Exception as exc:
                          errors.append(f'{candidate}: {type(exc).__name__}: {exc}')
                      time.sleep(attempt)
              raise RuntimeError('PDF download failed: ' + ' | '.join(errors[-16:]))

          def qpdf_check(path: Path) -> int:
              result = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if result.returncode not in (0, 3):
                  raise RuntimeError(f'{path.name}: qpdf failed: {result.stderr[-1200:]}')
              return result.returncode

          def validate_pdf(path: Path, *, year: str, type_markers: tuple[str, ...], min_pages: int) -> dict:
              raw = path.read_bytes()
              if not raw.startswith(b'%PDF-'):
                  raise RuntimeError(f'{path.name}: invalid PDF signature')
              doc = pymupdf.open(str(path))
              pages = len(doc)
              if pages < min_pages:
                  doc.close()
                  raise RuntimeError(f'{path.name}: page count {pages} < {min_pages}')
              indices = sorted(set(list(range(min(45, pages))) + [pages // 2, pages - 1]))
              text = '\n'.join(doc.load_page(i).get_text('text') for i in indices)
              norm = compact(text)
              identities = (
                  COMPANY_ZH, COMPANY_TRAD, COMPANY_EN, 'TRANSTHERASCIENCES',
                  'STOCKCODE2617', '股份代號2617', '股份代码2617',
              )
              if not any(compact(marker) in norm for marker in identities):
                  doc.close()
                  raise RuntimeError(f'{path.name}: company identity marker missing')
              if compact(year) not in norm:
                  doc.close()
                  raise RuntimeError(f'{path.name}: report year marker missing')
              if not any(compact(marker) in norm for marker in type_markers):
                  doc.close()
                  raise RuntimeError(f'{path.name}: document type marker missing')
              rendered = []
              for page_no in sorted(set((0, pages // 2, pages - 1))):
                  pix = doc.load_page(page_no).get_pixmap(matrix=pymupdf.Matrix(0.9, 0.9), alpha=False)
                  render_path = RENDERS / f'{path.stem}_page_{page_no + 1:04d}.png'
                  pix.save(str(render_path))
                  if pix.width < 400 or pix.height < 400 or render_path.stat().st_size < 3000:
                      doc.close()
                      raise RuntimeError(f'{path.name}: render validation failed on page {page_no + 1}')
                  rendered.append({'page': page_no + 1, 'width': pix.width, 'height': pix.height, 'bytes': render_path.stat().st_size})
              doc.close()
              return {
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha256_bytes(raw),
                  'qpdf_return_code': qpdf_check(path),
                  'rendered_pages': rendered,
              }

          def build_phip() -> tuple[Path, dict]:
              parent = 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0623/2025060901183_c.htm'
              html_errors = []
              html_bytes = b''
              actual_parent = parent
              for candidate in variants(parent):
                  try:
                      response = session.get(candidate, headers=headers, timeout=(30, 180), allow_redirects=True)
                      print('PHIP_PARENT', response.status_code, len(response.content), candidate, flush=True)
                      if response.status_code == 200 and len(response.content) > 5000:
                          html_bytes = response.content
                          actual_parent = str(response.url)
                          break
                      html_errors.append(f'{candidate}: {response.status_code}/{len(response.content)}')
                  except Exception as exc:
                      html_errors.append(f'{candidate}: {type(exc).__name__}: {exc}')
              if not html_bytes:
                  raise RuntimeError('Unable to fetch PHIP parent: ' + ' | '.join(html_errors))

              soup = BeautifulSoup(html_bytes, 'html.parser')
              chapter_links = []
              for anchor in soup.find_all('a', href=True):
                  href = urljoin(actual_parent, anchor.get('href'))
                  label = ' '.join(anchor.get_text(' ', strip=True).split())
                  if '.pdf' in href.lower():
                      chapter_links.append({'label': label, 'url': href})
              deduped = []
              seen = set()
              for row in chapter_links:
                  if row['url'] not in seen:
                      seen.add(row['url'])
                      deduped.append(row)
              chapter_links = deduped
              print('PHIP_CHAPTER_COUNT', len(chapter_links), flush=True)
              for idx, row in enumerate(chapter_links, 1):
                  print('PHIP_CHAPTER', idx, row['label'], row['url'], flush=True)
              if len(chapter_links) < 30:
                  raise RuntimeError(f'Expected at least 30 PHIP chapter PDFs, found {len(chapter_links)}')

              part_records = []
              for idx, row in enumerate(chapter_links, 1):
                  data, actual_url = download([row['url']], min_bytes=1000)
                  part_path = PARTS / f'{idx:02d}.pdf'
                  part_path.write_bytes(data)
                  doc = pymupdf.open(str(part_path))
                  pages = len(doc)
                  doc.close()
                  if pages < 1:
                      raise RuntimeError(f'PHIP chapter {idx} has zero pages')
                  qcode = qpdf_check(part_path)
                  part_records.append({
                      'sequence': idx,
                      'label': row['label'],
                      'source_url': actual_url,
                      'pages': pages,
                      'bytes': len(data),
                      'sha256': sha256_bytes(data),
                      'qpdf_return_code': qcode,
                  })
                  print('PHIP_PART_VERIFIED', json.dumps(part_records[-1], ensure_ascii=False), flush=True)

              merged_path = ROOT / '02_药捷安康_2025年招股书_港交所官方聆讯后资料集合并完整版.pdf'
              merged = pymupdf.open()
              for record in part_records:
                  part = pymupdf.open(str(PARTS / f'{record["sequence"]:02d}.pdf'))
                  merged.insert_pdf(part)
                  part.close()
              merged.save(str(merged_path), garbage=4, deflate=True)
              merged.close()

              check = validate_pdf(
                  merged_path,
                  year='2025',
                  type_markers=('聆訊後資料集', '聆讯后资料集', 'POSTHEARINGINFORMATIONPACK', 'PHIP', '全球發售', '全球发售'),
                  min_pages=500,
              )
              check.update({
                  'parent_page': actual_parent,
                  'chapter_count': len(part_records),
                  'chapters': part_records,
                  'version_note': '香港交易所官方聆讯后资料集（PHIP），按港交所网页原顺序合并；并非2025年6月13日最终定价招股章程。',
              })
              print('PHIP_MERGED_VERIFIED', json.dumps({k: v for k, v in check.items() if k != 'chapters'}, ensure_ascii=False), flush=True)
              return merged_path, check

          records = []
          seen_hashes = set()

          standard_docs = [
              {
                  'filename': '01_药捷安康_2025年年度报告_完整版.pdf',
                  'document_type': '2025年年度报告',
                  'release_date': '2026-04-23',
                  'year': '2025',
                  'min_pages': 100,
                  'type_markers': ('ANNUALREPORT', '年度報告', '年度报告'),
                  'urls': [
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042303041_c.pdf',
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042303040.pdf',
                  ],
              },
              {
                  'filename': '03_药捷安康_2026年中期业绩公告_截至2026年6月30日.pdf',
                  'document_type': '2026年中期业绩公告（最新定期财务披露）',
                  'release_date': '2026-08-26',
                  'year': '2026',
                  'min_pages': 20,
                  'type_markers': ('INTERIMRESULTS', '中期業績', '中期业绩', 'SIXMONTHSENDED30JUNE2026'),
                  'urls': [
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0826/2026082600898_c.pdf',
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0826/2026082600897.pdf',
                  ],
              },
              {
                  'filename': '04_药捷安康_2025年中期报告_最新已刊发完整中期报告.pdf',
                  'document_type': '2025年中期报告（最新已刊发完整中期报告）',
                  'release_date': '2025-09-19',
                  'year': '2025',
                  'min_pages': 40,
                  'type_markers': ('INTERIMREPORT', '中期報告', '中期报告'),
                  'urls': [
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0919/2025091900589_c.pdf',
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0919/2025091900588.pdf',
                  ],
              },
          ]

          for cfg in standard_docs:
              data, actual_url = download(cfg['urls'])
              path = ROOT / cfg['filename']
              path.write_bytes(data)
              check = validate_pdf(path, year=cfg['year'], type_markers=cfg['type_markers'], min_pages=cfg['min_pages'])
              if check['sha256'] in seen_hashes:
                  raise RuntimeError(f'Duplicate PDF content: {path.name}')
              seen_hashes.add(check['sha256'])
              record = {
                  'relative_path': str(path.relative_to(ROOT)),
                  'document_type': cfg['document_type'],
                  'release_date': cfg['release_date'],
                  'official_url': actual_url,
                  'language': '繁体中文' if actual_url.lower().endswith('_c.pdf') else '英文',
                  **check,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          phip_path, phip_check = build_phip()
          if phip_check['sha256'] in seen_hashes:
              raise RuntimeError('Duplicate merged PHIP content')
          seen_hashes.add(phip_check['sha256'])
          phip_record = {
              'relative_path': str(phip_path.relative_to(ROOT)),
              'document_type': '2025年港交所官方聆讯后资料集（招股书申请版，合并完整版）',
              'release_date': '2025-06-09',
              'official_url': phip_check['parent_page'],
              'language': '繁体中文',
              **phip_check,
          }
          records.append(phip_record)
          records.sort(key=lambda r: r['relative_path'])

          if len(records) != 4:
              raise RuntimeError(f'Expected 4 PDFs, got {len(records)}')

          with (ROOT / '来源与校验清单.csv').open('w', encoding='utf-8-sig', newline='') as f:
              fields = ['序号','文件路径','文档类型','发布日期','语言','页数','文件大小_字节','SHA256','官方来源','备注']
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for idx, record in enumerate(records, 1):
                  writer.writerow({
                      '序号': idx,
                      '文件路径': record['relative_path'],
                      '文档类型': record['document_type'],
                      '发布日期': record['release_date'],
                      '语言': record['language'],
                      '页数': record['pages'],
                      '文件大小_字节': record['bytes'],
                      'SHA256': record['sha256'],
                      '官方来源': record['official_url'],
                      '备注': record.get('version_note', ''),
                  })

          manifest = {
              'company': COMPANY_ZH,
              'traditional_chinese_name': COMPANY_TRAD,
              'english_name': COMPANY_EN,
              'stock_code': STOCK_CODE,
              'listing_date': '2025-06-23',
              'as_of_date': AS_OF,
              'annual_report_years': [2025],
              'latest_periodic_financial_disclosure': '2026年中期业绩公告（截至2026年6月30日止六个月）',
              'latest_full_interim_report_published': '2025年中期报告',
              'prospectus_handling': {
                  'final_prospectus_date': '2025-06-13',
                  'verified_final_prospectus_metadata': {'pages': 674, 'file_size_bytes': 23613353},
                  'included_document': '香港交易所官方聆讯后资料集（PHIP），按章节合并为单一PDF',
                  'reason': '最终招股章程历史港交所入口目前无法直接下载，故收录港交所仍可访问的完整官方PHIP，并明确标注版本。',
              },
              'files': records,
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["relative_path"]}\n' for r in records), encoding='utf-8')

          readme = [
              f'{COMPANY_ZH}（{STOCK_CODE}）官方披露文件',
              f'资料核对日期：{AS_OF}',
              '',
              '收录内容：',
              '1. 2025年年度报告；',
              '2. 2025年香港交易所官方聆讯后资料集（PHIP），按港交所网页原章节顺序合并为单一PDF；',
              '3. 2026年中期业绩公告，作为截至核对日最新定期财务披露；',
              '4. 2025年中期报告，作为截至核对日最新已刊发的完整中期报告补充。',
              '',
              '年报口径：药捷安康于2025年6月23日在香港联交所上市，因此截至核对日，上市后独立年度报告只有2025年度一份。',
              '“最新季报”口径：香港主板公司通常不按A股制度发布第一季度及第三季度报告。截至2026年9月14日，最新定期财务披露为2026年中期业绩公告；2026年完整中期报告尚未刊发，因此另附最新已刊发的2025年完整中期报告。',
              '',
              '招股书版本说明：2025年6月13日最终招股章程的公开档案元数据显示为674页、23,613,353字节，但其历史港交所下载入口目前无法直接取得。为避免交付不完整预览，本包收录港交所仍可访问的完整官方聆讯后资料集（PHIP），共按原网页章节顺序合并为一个PDF。PHIP是正式上市申请文件，但其中部分最终发售条款仍以“[编纂]”标示，不能冒充最终定价招股章程。',
              '',
              '所有PDF均保持官方原始页面；合并操作仅针对PHIP章节，未删页、未重排、未加水印。',
              f'共{len(records)}份PDF，合计{sum(r["pages"] for r in records)}页，PDF总大小{sum(r["bytes"] for r in records)/1048576:.2f} MB。',
              '',
              '文件清单：',
          ]
          for idx, record in enumerate(records, 1):
              readme.extend([
                  f'{idx}. {record["relative_path"]}',
                  f'   {record["document_type"]}｜{record["release_date"]}｜{record["language"]}｜{record["pages"]}页｜{record["bytes"]/1048576:.2f} MB',
                  f'   官方来源：{record["official_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ])
          readme.append('核验项目：PDF文件头、公司名称/股份代码、报告年份、文档类型、页数、qpdf结构、首页/中间页/末页渲染、SHA-256及ZIP CRC。')
          (ROOT / 'README_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')

          with zipfile.ZipFile(OUTZIP, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path))
          with zipfile.ZipFile(OUTZIP, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdf_count = sum(name.lower().endswith('.pdf') for name in archive.namelist())
              if pdf_count != 4:
                  raise RuntimeError(f'Expected 4 PDFs in ZIP, got {pdf_count}')

          print('FINAL_ZIP', OUTZIP, OUTZIP.stat().st_size, sha256_file(OUTZIP), flush=True)
          print('TOTAL_PAGES', sum(r['pages'] for r in records), flush=True)
          print('PDF_COUNT', len(records), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: transthera-official-package-phip-20260914
          path: TransThera_All_Annual_Reports_Prospectus_Latest_Report_2026-09-14.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transthera-phip-validation-diagnostics
          path: _transthera_phip_work/
          if-no-files-found: ignore
          retention-days: 2
