name: Save Hibor 1818027 HTML
on:
  push:
    paths:
      - '.github/workflows/save_hibor_1818027_html.yml'
      - 'tools/save_hibor_1818027_html.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python tools/save_hibor_1818027_html.py
      - uses: actions/upload-artifact@v4
        with:
          name: hibor-1818027-html
          path: hibor_1818027_page.html
          if-no-files-found: error
          retention-days: 3
