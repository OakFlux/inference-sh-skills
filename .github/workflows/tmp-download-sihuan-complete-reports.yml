name: Download complete Sihuan research reports

on:
  push:
    branches:
      - tmp/sihuan-pharma-reports-20260902

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Scan, download, validate, and package
        run: python .github/scripts/download_sihuan_complete_reports.py
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sihuan-complete-reports
          path: /tmp/sihuan_complete_reports
          if-no-files-found: error
          retention-days: 3
