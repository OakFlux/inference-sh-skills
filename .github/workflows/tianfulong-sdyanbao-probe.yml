name: Probe Sdyanbao Tianfulong report

on:
  push:
    paths:
      - '.github/workflows/tianfulong-sdyanbao-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public pages and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from urllib.parse import urljoin
          import requests

          s=requests.Session()
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'}
          pages=['https://www.sdyanbao.com/report','https://www.sdyanbao.com/detail/379869','https://www.sdyanbao.com/detail/927526']
          scripts=[]
          for u in pages:
            print('\nPAGE',u,flush=True)
            r=s.get(u,headers=H,timeout=(30,180)); print('STATUS',r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True); r.raise_for_status()
            t=r.text.replace('\\/','/')
            print('HEAD',repr(t[:1200]),flush=True)
            for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',t,re.I): scripts.append(urljoin(r.url,html.unescape(src)))
            for needle in ['download','立即下载','api','search','report','detail','__NEXT_DATA__','/_next/','window.__','nuxt']:
              poss=[m.start() for m in re.finditer(re.escape(needle.lower()),t.lower())]
              if poss:
                print('NEEDLE',needle,'COUNT',len(poss),flush=True)
                for p in poss[:8]: print(t[max(0,p-400):p+1000],flush=True)
          scripts=list(dict.fromkeys(scripts)); print('\nSCRIPTS',len(scripts),flush=True)
          for u in scripts:
            try:
              r=s.get(u,headers=H,timeout=(30,180)); print('\nSCRIPT',r.status_code,len(r.content),u,flush=True); r.raise_for_status()
              js=r.text.replace('\\/','/')
              vals=[]
              for pat in [r'["\'](https?://[^"\']+)["\']',r'["\'](/[^"\']{1,220})["\']']:
                for v in re.findall(pat,js):
                  if any(k in v.lower() for k in ('api','report','download','search','detail','file','pdf','login','member')): vals.append(v)
              for v in list(dict.fromkeys(vals))[:400]: print('STRING',v,flush=True)
              for needle in ['download','report/detail','/detail/','report/search','searchReport','axios','fetch(','pdf','fileUrl','file_url','downloadUrl','download_url','token','login']:
                poss=[m.start() for m in re.finditer(re.escape(needle.lower()),js.lower())]
                if poss:
                  print('JS NEEDLE',needle,'COUNT',len(poss),flush=True)
                  for p in poss[:10]: print(js[max(0,p-600):p+1600],flush=True)
            except Exception as e: print('SCRIPT ERROR',repr(e),flush=True)
          PY
