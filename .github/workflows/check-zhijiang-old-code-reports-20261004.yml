name: Check Zhijiang old code reports 20261004

on:
  push:
    paths:
      - '.github/workflows/check-zhijiang-old-code-reports-20261004.yml'
      - 'scripts/check_zhijiang_old_code_reports.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/check_zhijiang_old_code_reports.py
