name: Package Ming Yuan Cloud broker reports

on:
  push:
    branches:
      - chatgpt-mingyuan-cloud-broker-reports-20260906
    paths:
      - '.github/workflows/package-mingyuan-cloud-reports-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download, validate and package
        run: python scripts/package_mingyuan_cloud_reports_short.py
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mingyuan-cloud-broker-reports-20260906
          path: |
            MYC_Broker_Reports.zip
            明源云_券商深度研究报告_3份.zip
            PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
