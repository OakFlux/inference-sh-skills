name: Package Harbin Pharmaceutical broker reports

on:
  push:
    branches:
      - chatgpt-hayao-broker-reports-20260906
    paths:
      - '.github/workflows/package-hayao-broker-reports-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download, validate and package reports
        run: python scripts/package_hayao_broker_reports_20260906.py
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: hayao-broker-deep-reports-20260906
          path: |
            Hayao_Broker_Deep_Reports_2_PDFs.zip
            哈药股份_券商深度报告_2份.zip
            PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
