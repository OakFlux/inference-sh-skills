name: Probe FXBaogao Shuangxiang API 20261014
on:
  push:
    branches: [shuangxiang-broker-reports-20261014]
    paths:
      - scripts/probe_fxbaogao_api_shuangxiang_20261014.py
      - .github/workflows/probe-fxbaogao-api-shuangxiang-20261014.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests
      - run: python scripts/probe_fxbaogao_api_shuangxiang_20261014.py
