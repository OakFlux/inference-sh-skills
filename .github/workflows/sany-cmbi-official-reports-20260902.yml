name: Package official CMBI SANY International research reports

on:
  push:
    paths:
      - '.github/workflows/sany-cmbi-official-reports-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf
          python -m pip install --quiet pypdf requests beautifulsoup4 curl_cffi

      - name: Download validate and package official reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests as std_requests
          from bs4 import BeautifulSoup
          from curl_cffi import requests as curl_requests
          from pypdf import PdfReader

          COMPANY = '三一国际'
          CODE = '00631.HK'
          PACKAGE = '三一国际_券商公司研究报告_3份_招银国际官方完整版'
          out = Path(PACKAGE)
          out.mkdir(parents=True, exist_ok=True)
          work = Path('_sany_cmbi_work')
          work.mkdir(exist_ok=True)
          previews = work / 'previews'
          previews.mkdir(exist_ok=True)

          targets = [
              {
                  'article_url': 'https://www.cmbi.com.hk/article/8349.html?lang=en',
                  'date': '2023-06-08',
                  'title': 'Firing on all cylinders',
                  'broker': '招银国际',
                  'fallback_pdf': '',
                  'min_pages': 8,
              },
              {
                  'article_url': 'https://www.cmbi.com.hk/article/10366.html?lang=en',
                  'date': '2024-08-30',
                  'title': 'Scale-down of solar power expansion plan a positive move',
                  'broker': '招银国际',
                  'fallback_pdf': '',
                  'min_pages': 5,
              },
              {
                  'article_url': 'https://www.cmbi.com.hk/article/11500.html?lang=en',
                  'date': '2025-06-09',
                  'title': 'Early stage of earnings recovery + attractive valuation offer good entry point',
                  'broker': '招银国际',
                  'fallback_pdf': 'https://hk-official.cmbi.info/upload/7978bced-93d4-43af-887e-c81907211e53.pdf',
                  'min_pages': 5,
              },
          ]

          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          std = std_requests.Session()
          std.trust_env = False

          def fetch_article(url: str) -> tuple[str, str]:
              errors = []
              for attempt in range(1, 6):
                  try:
                      response = curl_requests.get(
                          url,
                          impersonate='chrome',
                          timeout=120,
                          allow_redirects=True,
                          headers={'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7'},
                      )
                      print('ARTICLE_CURL', attempt, response.status_code, len(response.content), response.url, flush=True)
                      if response.status_code == 200 and len(response.content) > 1000:
                          return response.text, str(response.url)
                      errors.append(f'curl HTTP {response.status_code}')
                  except Exception as exc:
                      errors.append(f'curl {type(exc).__name__}: {exc}')
                  try:
                      response = std.get(
                          url,
                          headers={
                              'User-Agent': ua,
                              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
                          },
                          timeout=(30, 180),
                          allow_redirects=True,
                      )
                      print('ARTICLE_STD', attempt, response.status_code, len(response.content), response.url, flush=True)
                      if response.status_code == 200 and len(response.content) > 1000:
                          response.encoding = response.apparent_encoding or 'utf-8'
                          return response.text, response.url
                      errors.append(f'std HTTP {response.status_code}')
                  except Exception as exc:
                      errors.append(f'std {type(exc).__name__}: {exc}')
                  time.sleep(2 * attempt)
              raise RuntimeError(f'Unable to fetch article {url}: {errors[-8:]}')

          def extract_pdf_url(article_html: str, base_url: str) -> str:
              soup = BeautifulSoup(article_html, 'html.parser')
              candidates = []
              for tag in soup.find_all(True):
                  for attr in ('href', 'src', 'data-src', 'data-url'):
                      value = tag.get(attr)
                      if not isinstance(value, str) or not value.strip():
                          continue
                      full = urljoin(base_url, value.strip())
                      if 'hk-official.cmbi.info' in full and '.pdf' in full.lower():
                          candidates.append(full)
              patterns = [
                  r'https?://hk-official\.cmbi\.info/[^\"\'<>\s]+?\.pdf',
                  r'https?:\\/\\/hk-official\.cmbi\.info\\/[^\"\'<>\s]+?\.pdf',
              ]
              for pattern in patterns:
                  for match in re.findall(pattern, article_html, flags=re.I):
                      candidates.append(match.replace('\\/', '/'))
              unique = []
              for candidate in candidates:
                  candidate = candidate.replace('&amp;', '&')
                  if candidate not in unique:
                      unique.append(candidate)
              print('PDF_CANDIDATES', json.dumps(unique, ensure_ascii=False), flush=True)
              if not unique:
                  raise RuntimeError(f'No official CMBI PDF found in {base_url}')
              return unique[0]

          def fetch_pdf(url: str, referer: str) -> bytes:
              errors = []
              for attempt in range(1, 7):
                  try:
                      response = std.get(
                          url,
                          headers={
                              'User-Agent': ua,
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              'Referer': referer,
                          },
                          timeout=(30, 480),
                          allow_redirects=True,
                      )
                      print('PDF_GET', attempt, response.status_code, response.headers.get('content-type'), len(response.content), response.url, flush=True)
                      if response.status_code == 200 and response.content.startswith(b'%PDF-') and len(response.content) > 50_000:
                          return response.content
                      errors.append(f'HTTP {response.status_code}, {len(response.content)} bytes')
                  except Exception as exc:
                      errors.append(f'{type(exc).__name__}: {exc}')
                  time.sleep(min(2 * attempt, 10))
              raise RuntimeError(f'Unable to download PDF {url}: {errors[-6:]}')

          def safe(value: str) -> str:
              return re.sub(r'[\\/:*?"<>|\s]+', '_', value).strip('_')[:115]

          records = []
          seen_hashes = set()
          for index, target in enumerate(targets, 1):
              html = ''
              final_article_url = target['article_url']
              pdf_url = ''
              try:
                  html, final_article_url = fetch_article(target['article_url'])
                  (work / f'article_{index:02d}.html').write_text(html, encoding='utf-8')
                  pdf_url = extract_pdf_url(html, final_article_url)
              except Exception as exc:
                  print('ARTICLE_WARNING', target['article_url'], repr(exc), flush=True)
                  pdf_url = target['fallback_pdf']
              if not pdf_url:
                  raise RuntimeError(f'No PDF URL available for {target["title"]}')

              pdf_bytes = fetch_pdf(pdf_url, final_article_url)
              filename = f"{index:02d}_{target['broker']}_{COMPANY}_{safe(target['title'])}_{target['date']}.pdf"
              path = out / filename
              path.write_bytes(pdf_bytes)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < target['min_pages']:
                  raise RuntimeError(f'{filename} unexpectedly short: {pages} pages')
              texts = []
              for page in reader.pages[: min(pages, 6)]:
                  try:
                      texts.append(page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', '\n'.join(texts)).lower()
              if ('sanyinternational' not in compact and '631hk' not in compact and '三一国际' not in compact):
                  raise RuntimeError(f'Company identity validation failed for {filename}')
              title_words = [w.lower() for w in re.findall(r'[A-Za-z]{4,}', target['title'])]
              if title_words and sum(word in compact for word in title_words[:8]) < min(2, len(title_words)):
                  print('TITLE_WARNING', filename, title_words, flush=True)

              check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {filename}: {check.stderr[-1200:]}')
              if check.returncode == 3:
                  print('QPDF_WARNING', filename, check.stderr[-1200:], flush=True)

              first_prefix = previews / f'{index:02d}_first'
              last_prefix = previews / f'{index:02d}_last'
              subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '90', str(path), str(first_prefix)], check=True, capture_output=True)
              subprocess.run(['pdftoppm', '-f', str(pages), '-singlefile', '-png', '-r', '90', str(path), str(last_prefix)], check=True, capture_output=True)
              if not Path(str(first_prefix) + '.png').exists() or not Path(str(last_prefix) + '.png').exists():
                  raise RuntimeError(f'Render validation failed for {filename}')

              digest = hashlib.sha256(pdf_bytes).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'Duplicate PDF detected: {filename}')
              seen_hashes.add(digest)
              record = {
                  'broker': target['broker'],
                  'company': COMPANY,
                  'date': target['date'],
                  'title': target['title'],
                  'filename': filename,
                  'pages': pages,
                  'bytes': len(pdf_bytes),
                  'sha256': digest,
                  'article_url': final_article_url,
                  'pdf_url': pdf_url,
                  'source_format': '招银国际官方网站公开原始PDF',
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 3:
              raise RuntimeError(f'Expected 3 reports, got {len(records)}')

          lines = [
              '三一国际（00631.HK）券商公司研究报告包',
              '',
              '本包共3份招银国际官方网站公开发布的完整原始PDF。',
              '说明：三一国际近年的30—50页中文长篇公司深度报告多分布于会员资料平台；本包未采用登录墙、付费下载或截断预览，而选择可由券商官网直接公开获取、可完整核验的公司研究报告。',
              '',
          ]
          for i, record in enumerate(records, 1):
              lines.extend([
                  f"{i}. {record['broker']}：《{record['title']}》",
                  f"   日期：{record['date']}；页数：{record['pages']}页",
                  f"   文件：{record['filename']}",
                  f"   官方报告页面：{record['article_url']}",
                  f"   官方PDF：{record['pdf_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          lines.extend([
              '核验项目：PDF文件头、实际页数、公司名称/证券代码、qpdf结构检查、首页与末页渲染、文件哈希、ZIP CRC。',
              '报告中的评级、目标价和盈利预测均对应报告出具时点，不构成当前投资建议。',
          ])
          (out / '报告清单与核验说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(
              ''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8'
          )

          zip_path = Path(f'{PACKAGE}.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdfs = [n for n in archive.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'ZIP contains {len(pdfs)} PDFs instead of 3')
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: sany-international-cmbi-official-reports-final
          path: |
            三一国际_券商公司研究报告_3份_招银国际官方完整版/
            三一国际_券商公司研究报告_3份_招银国际官方完整版.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
