name: Inspect FXBaogao viewer fast 20261014
on:
  push:
    branches: [shuangxiang-broker-reports-20261014]
    paths:
      - scripts/inspect_fxbaogao_viewer_fast_20261014.py
      - .github/workflows/inspect-fxbaogao-viewer-fast-20261014.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - run: python scripts/inspect_fxbaogao_viewer_fast_20261014.py
