name: Check Xingdesheng FXBaogao public viewer 20261012

on:
  push:
    branches:
      - xingdesheng-broker-reports-20261012
    paths:
      - '.github/workflows/check-xingdesheng-fxbaogao-public-viewer-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Check public viewers
        run: python scripts/check_xingdesheng_fxbaogao_public_viewer_compact_20261012.py
