name: Discover Meon broker materials 20261014

on:
  push:
    branches:
      - meinong-broker-reports-20261014
    paths:
      - scripts/discover_meinong_broker_materials_20261014.py
      - .github/workflows/discover-meinong-broker-materials-20261014.yml
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests
      - run: python scripts/discover_meinong_broker_materials_20261014.py
