name: Probe Kerry Properties SGPJBG downloads

on:
  push:
    branches:
      - chatgpt-kerry-properties-broker-reports-20260906
    paths:
      - '.github/workflows/probe-kerry-sgpjbg-downloads-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_kerry_sgpjbg_downloads_20260906.py
      - uses: actions/upload-artifact@v4
        with:
          name: kerry-sgpjbg-download-probe-20260906
          path: |
            kerry-sgpjbg-download-results.json
            kerry-sgpjbg-download-probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
