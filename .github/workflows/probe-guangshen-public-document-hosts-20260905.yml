name: Probe Guangshen public document hosts

on:
  push:
    branches:
      - chatgpt-china-gas-broker-reports-20260905
    paths:
      - '.github/workflows/probe-guangshen-public-document-hosts-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_guangshen_public_document_hosts_20260905.py
      - uses: actions/upload-artifact@v4
        with:
          name: guangshen-public-host-probe-20260905
          path: |
            guangshen-public-host-results.json
            guangshen-public-host-probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
