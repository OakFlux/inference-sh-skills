name: Probe Berry Genomics Nxny report pages

on:
  push:
    paths:
      - '.github/workflows/probe-berrygenomics-nxny-20261005.yml'
      - 'scripts/probe_berrygenomics_nxny_20261005.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_berrygenomics_nxny_20261005.py
