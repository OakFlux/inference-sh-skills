name: Probe Harbin Pharmaceutical broker reports

on:
  push:
    branches:
      - chatgpt-hayao-broker-reports-20260906
    paths:
      - '.github/workflows/probe-hayao-broker-reports-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_hayao_broker_reports_20260906.py
      - uses: actions/upload-artifact@v4
        with:
          name: hayao-broker-report-probe-20260906
          path: |
            hayao-broker-report-probe.json
            hayao-probe-pdfs/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
