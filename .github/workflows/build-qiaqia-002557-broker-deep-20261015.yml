name: Build Qiaqia 002557 broker deep archive 20261015
on:
  push:
    paths:
      - '.github/workflows/build-qiaqia-002557-broker-deep-20261015.yml'
      - 'scripts/build_qiaqia_002557_broker_deep_archive_20261015.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Build archive
        shell: bash
        run: python scripts/build_qiaqia_002557_broker_deep_archive_20261015.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: qiaqia-002557-broker-deep-20261015
          path: qiaqia_food_002557_broker_deep_reports_3.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
