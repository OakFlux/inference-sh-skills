name: Discover WeRide broker deep reports

on:
  push:
    paths:
      - '.github/workflows/weride-broker-discovery-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Query report APIs and public pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import time
          from io import BytesIO
          from urllib.parse import quote_plus, urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          headers = {
              'User-Agent': ua,
              'Accept': 'application/json,text/plain,text/html,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml',
          }

          def compact(value):
              return re.sub(r'\s+', '', str(value or '')).lower()

          rows_by_key = {}
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          codes = ['00800', '0800', '800', '116.00800', '116.0800', 'HK00800', '00800.HK', 'WRD']
          for code in codes:
              for qtype in (0, 1):
                  for page in (1, 2, 3):
                      params = {
                          'pageNo': page,
                          'pageSize': 500,
                          'code': code,
                          'qType': qtype,
                          'beginTime': '2024-01-01',
                          'endTime': '2026-09-02',
                          'industryCode': '*',
                          'rating': '*',
                          'ratingChange': '*',
                      }
                      try:
                          response = session.get(endpoint, params=params, headers=headers, timeout=(30, 180))
                          print('QUERY', code, qtype, page, response.status_code, len(response.content), response.url, flush=True)
                          response.raise_for_status()
                          payload = response.json()
                          rows = payload.get('data') or []
                          print('META', code, qtype, page, len(rows), {k: payload.get(k) for k in ('hits','size','TotalPage','pageNo')}, flush=True)
                          for row in rows:
                              raw = json.dumps(row, ensure_ascii=False)
                              hay = compact(raw)
                              if not any(marker in hay for marker in ('文远知行', 'weride', '00800', '0800.hk', 'wrd.us', 'wrd')):
                                  continue
                              key = str(row.get('infoCode') or row.get('infocode') or row.get('id') or raw)
                              rows_by_key[key] = row
                      except Exception as exc:
                          print('QUERY_ERROR', code, qtype, page, repr(exc), flush=True)
                      time.sleep(0.2)

          # Also try a global API scan in narrow date windows around known reports.
          date_windows = [
              ('2025-12-20', '2026-01-15'),
              ('2026-03-15', '2026-05-31'),
              ('2025-01-01', '2025-06-30'),
              ('2026-06-01', '2026-09-02'),
          ]
          for begin, end in date_windows:
              for page in range(1, 8):
                  params = {
                      'pageNo': page, 'pageSize': 500, 'qType': 0,
                      'beginTime': begin, 'endTime': end,
                      'industryCode': '*', 'rating': '*', 'ratingChange': '*',
                  }
                  try:
                      response = session.get(endpoint, params=params, headers=headers, timeout=(30, 180))
                      print('GLOBAL_QUERY', begin, end, page, response.status_code, len(response.content), flush=True)
                      response.raise_for_status()
                      payload = response.json()
                      rows = payload.get('data') or []
                      for row in rows:
                          raw = json.dumps(row, ensure_ascii=False)
                          hay = compact(raw)
                          if any(marker in hay for marker in ('文远知行', 'weride', '00800', '0800.hk', 'wrd.us')):
                              key = str(row.get('infoCode') or row.get('infocode') or row.get('id') or raw)
                              rows_by_key[key] = row
                      if not rows or len(rows) < 100:
                          break
                  except Exception as exc:
                      print('GLOBAL_ERROR', begin, end, page, repr(exc), flush=True)
                      break

          print('UNIQUE_MATCHES', len(rows_by_key), flush=True)
          candidates = []
          for key, row in rows_by_key.items():
              keep = {k: row.get(k) for k in (
                  'infoCode','title','publishDate','orgSName','orgName','researcher','stockName','stockCode',
                  'attachPages','attachSize','emRatingName','reportType','encodeUrl'
              )}
              print('MATCH', json.dumps(keep, ensure_ascii=False), flush=True)
              candidates.append(row)

          # Probe complete Eastmoney PDFs where an infoCode is available.
          working = []
          for row in candidates:
              info_code = str(row.get('infoCode') or '')
              if not info_code.startswith('AP'):
                  continue
              for prefix in ('H3', 'H2'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info_code}_1.pdf'
                  try:
                      response = session.get(
                          url,
                          headers={
                              'User-Agent': ua,
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              'Referer': 'https://data.eastmoney.com/',
                          },
                          timeout=(30, 300),
                          allow_redirects=True,
                      )
                      print('PDF_GET', response.status_code, response.headers.get('content-type'), len(response.content), url, flush=True)
                      if response.status_code != 200 or not response.content.startswith(b'%PDF-') or len(response.content) < 100000:
                          continue
                      reader = PdfReader(BytesIO(response.content), strict=False)
                      pages = len(reader.pages)
                      front = []
                      for page in reader.pages[:min(10, pages)]:
                          try:
                              front.append(page.extract_text() or '')
                          except Exception:
                              pass
                      front_text = compact('\n'.join(front))
                      record = {
                          'infoCode': info_code,
                          'title': row.get('title'),
                          'publishDate': row.get('publishDate'),
                          'orgSName': row.get('orgSName'),
                          'researcher': row.get('researcher'),
                          'metadata_pages': row.get('attachPages'),
                          'actual_pages': pages,
                          'bytes': len(response.content),
                          'url': response.url,
                          'company_ok': any(x in front_text for x in ('文远知行', 'weride', '00800', '0800', 'wrd')),
                          'research_marker': any(x in front_text for x in ('证券研究报告','公司研究','公司深度','首次覆盖','equityresearch')),
                      }
                      working.append(record)
                      print('WORKING_PDF', json.dumps(record, ensure_ascii=False), flush=True)
                      break
                  except Exception as exc:
                      print('PDF_ERROR', info_code, prefix, repr(exc), flush=True)

          # Crawl known public report pages for direct or encoded PDF links.
          seeds = [
              'https://www.sdyanbao.com/detail/940420',
              'https://www.51pdf.cn/report/view_5781611.html',
              'https://www.nxny.com/report/view_6191969.html',
              'https://www.baogaobox.com/insights/260112000024754.html',
          ]
          for url in seeds:
              try:
                  response = session.get(url, headers=headers, timeout=(30, 180), allow_redirects=True)
                  print('CRAWL', response.status_code, len(response.content), url, response.url, flush=True)
                  text = html.unescape(response.text).replace('\\/', '/')
                  for pattern in (
                      r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',
                      r'(?:pdf|download|file|url)["\']?\s*[:=]\s*["\']([^"\']+)',
                  ):
                      for match in re.findall(pattern, text, flags=re.I):
                          candidate = match if isinstance(match, str) else match[0]
                          candidate = urljoin(response.url, candidate)
                          if '.pdf' in candidate.lower():
                              print('PAGE_PDF_CANDIDATE', candidate, flush=True)
              except Exception as exc:
                  print('CRAWL_ERROR', url, repr(exc), flush=True)

          print('WORKING_SUMMARY', json.dumps(working, ensure_ascii=False, indent=2), flush=True)
          if not working:
              raise SystemExit('No complete Eastmoney PDF candidates found')
          PY
