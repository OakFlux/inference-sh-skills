name: Temporary Marriott reports package

on:
  push:
    branches:
      - tmp-marriott-reports-20260828

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download, validate and package Marriott reports
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/package_marriott.py <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          ANNUAL_PAGE = "https://marriott.gcs-web.com/annual"
          QUARTERLY_PAGE = "https://marriott.gcs-web.com/quarterly"
          OUT = Path("dist")
          DOCS = OUT / "Marriott_International_MAR_2020-2025_Annual_Reports_2026_H1"
          DOCS.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate",
          })

          def normalize(text: str) -> str:
              return re.sub(r"\s+", " ", text or "").strip().lower()

          def collect_links(page_url: str) -> list[tuple[str, str]]:
              response = session.get(page_url, timeout=90)
              print("PAGE", response.status_code, len(response.content), response.url)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "html.parser")
              out: list[tuple[str, str]] = []
              seen: set[tuple[str, str]] = set()
              for anchor in soup.find_all("a", href=True):
                  title = " ".join(anchor.get_text(" ", strip=True).split())
                  href = urljoin(response.url, anchor["href"])
                  key = (normalize(title), href)
                  if title and key not in seen:
                      seen.add(key)
                      out.append((title, href))
              return out

          annual_links = collect_links(ANNUAL_PAGE)
          quarterly_links = collect_links(QUARTERLY_PAGE)

          def find_exact(links: list[tuple[str, str]], wanted: str) -> str:
              target = normalize(wanted)
              candidates = [(title, href) for title, href in links if normalize(title) == target]
              if not candidates:
                  raise RuntimeError(f"Could not find exact link {wanted!r}")
              # Prefer direct static-file/PDF links.
              candidates.sort(key=lambda item: ("static-files" in item[1], item[1].lower().endswith(".pdf")), reverse=True)
              print("SELECT LINK", wanted, candidates[0][1])
              return candidates[0][1]

          reports: list[tuple[str, str, str, int]] = []
          for year in range(2020, 2026):
              reports.append((
                  f"Marriott_International_MAR_{year}_Annual_Report.pdf",
                  find_exact(annual_links, f"{year} Annual Report"),
                  f"{year} Annual Report",
                  60,
              ))

          reports.append((
              "Marriott_International_MAR_2026_Q2_Form_10-Q_Six_Months.pdf",
              find_exact(quarterly_links, "Q2 2026 10-Q"),
              "Q2 2026 Form 10-Q (includes six months ended June 30, 2026)",
              25,
          ))

          def download_pdf(url: str, destination: Path, referer: str, minimum_pages: int) -> tuple[str, int, int, str]:
              errors: list[str] = []
              variants = [url]
              if "?" not in url:
                  variants.extend([url + "?download=1", url + "?inline"])
              for candidate in variants:
                  for attempt in range(4):
                      try:
                          headers = {
                              "Accept": "application/pdf,application/octet-stream,*/*",
                              "Referer": referer,
                              "Sec-Fetch-Dest": "document",
                              "Sec-Fetch-Mode": "navigate",
                              "Sec-Fetch-Site": "same-origin",
                          }
                          with session.get(candidate, headers=headers, timeout=300, stream=True, allow_redirects=True) as response:
                              print("DOWNLOAD", response.status_code, response.url, response.headers.get("content-type"))
                              response.raise_for_status()
                              with destination.open("wb") as output:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          output.write(chunk)
                              final_url = response.url
                          raw = destination.read_bytes()
                          if len(raw) < 100_000 or not raw.startswith(b"%PDF-"):
                              raise RuntimeError(f"Invalid PDF bytes={len(raw)} head={raw[:16]!r}")
                          reader = PdfReader(str(destination), strict=False)
                          pages = len(reader.pages)
                          if pages < minimum_pages:
                              raise RuntimeError(f"Unexpected page count: {pages}")
                          digest = hashlib.sha256(raw).hexdigest()
                          return final_url, len(raw), pages, digest
                      except Exception as exc:
                          destination.unlink(missing_ok=True)
                          errors.append(f"{candidate} attempt {attempt + 1}: {exc!r}")
                          if attempt < 3:
                              time.sleep(2 ** attempt)
              raise RuntimeError("; ".join(errors))

          manifest = [
              "Marriott International, Inc. (NASDAQ: MAR)",
              "Scope: 2020-2025 official Annual Reports and the latest half-year filing available as of 2026-08-28.",
              "Half-year convention: U.S. issuers do not publish a separate A-share-style half-year report; this package uses Marriott's Q2 2026 Form 10-Q, which contains financial statements for the six months ended June 30, 2026.",
              "Sources: Marriott International Investor Relations official PDF files; the Q2 2026 Form 10-Q is also filed with the U.S. SEC.",
              "",
          ]

          for filename, url, title, minimum_pages in reports:
              destination = DOCS / filename
              referer = ANNUAL_PAGE if "Annual_Report" in filename else QUARTERLY_PAGE
              used_url, size, pages, digest = download_pdf(url, destination, referer, minimum_pages)
              manifest.extend([
                  filename,
                  f"  Document: {title}",
                  f"  Pages: {pages}",
                  f"  Size: {size} bytes",
                  f"  SHA-256: {digest}",
                  f"  Official source: {used_url}",
                  "",
              ])
              print("OK", filename, pages, size, used_url)

          (DOCS / "File_List_and_Official_Sources.txt").write_text("\n".join(manifest), encoding="utf-8")

          final_zip = OUT / "Marriott_International_MAR_2020-2025_Annual_Reports_2026_Latest_Half-Year.zip"
          with zipfile.ZipFile(final_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(DOCS.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(final_zip, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != 7:
                  raise RuntimeError(f"Expected 7 PDFs, got {pdfs}")

          print(f"FINAL_ZIP={final_zip}")
          print(f"ZIP_SIZE={final_zip.stat().st_size}")
          print("CONTENTS")
          for path in sorted(DOCS.iterdir()):
              print(path.name, path.stat().st_size)
          PY
          python /tmp/package_marriott.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: marriott-reports-final-zip
          path: dist/Marriott_International_MAR_2020-2025_Annual_Reports_2026_Latest_Half-Year.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
