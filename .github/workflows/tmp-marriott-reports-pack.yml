name: Temporary Marriott reports package

on:
  push:
    branches:
      - tmp-marriott-reports-20260828

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf

      - name: Download, validate and package Marriott reports
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/package_marriott.py <<'PY'
          from __future__ import annotations

          import hashlib
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          ANNUAL_PAGE = "https://marriott.gcs-web.com/annual"
          QUARTERLY_PAGE = "https://marriott.gcs-web.com/quarterly"
          OUT = Path("dist")
          DOCS = OUT / "Marriott_International_MAR_2020-2025_Annual_Reports_2026_H1"
          DOCS.mkdir(parents=True, exist_ok=True)

          REPORTS = [
              ("Marriott_International_MAR_2020_Annual_Report.pdf", "https://marriott.gcs-web.com/static-files/c5e1faef-f1e5-40e3-bd70-5efbbb929a7f", "2020 Annual Report", 70, ANNUAL_PAGE),
              ("Marriott_International_MAR_2021_Annual_Report.pdf", "https://marriott.gcs-web.com/static-files/33ba0a19-8a68-4f3f-9f73-fef2c458c22e", "2021 Annual Report", 70, ANNUAL_PAGE),
              ("Marriott_International_MAR_2022_Annual_Report.pdf", "https://marriott.gcs-web.com/static-files/c0fb865c-15b1-4166-9846-49b548da1ce4", "2022 Annual Report", 70, ANNUAL_PAGE),
              ("Marriott_International_MAR_2023_Annual_Report.pdf", "https://marriott.gcs-web.com/static-files/ac930e85-f477-4fa8-b873-bf4d2e09ca33", "2023 Annual Report", 70, ANNUAL_PAGE),
              ("Marriott_International_MAR_2024_Annual_Report.pdf", "https://marriott.gcs-web.com/static-files/12c6f44d-6f02-4c9d-b781-7dae4c1e4df8", "2024 Annual Report", 70, ANNUAL_PAGE),
              ("Marriott_International_MAR_2025_Annual_Report.pdf", "https://marriott.gcs-web.com/static-files/90ac617a-ef5f-4438-97ec-2e7cf4f8a41e", "2025 Annual Report", 70, ANNUAL_PAGE),
              ("Marriott_International_MAR_2026_Q2_Form_10-Q_Six_Months.pdf", "https://marriott.gcs-web.com/static-files/ca3c7132-09d8-4261-bc39-e9b3093b9396", "Q2 2026 Form 10-Q (six months ended June 30, 2026)", 25, QUARTERLY_PAGE),
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate",
              "Connection": "keep-alive",
          })

          def validate(path: Path, minimum_pages: int) -> tuple[int, int, str]:
              raw = path.read_bytes()
              if len(raw) < 100_000 or not raw.startswith(b"%PDF-"):
                  raise RuntimeError(f"Invalid PDF {path.name}: bytes={len(raw)}, head={raw[:16]!r}")
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < minimum_pages:
                  raise RuntimeError(f"Unexpectedly short PDF {path.name}: {pages} pages")
              return len(raw), pages, hashlib.sha256(raw).hexdigest()

          def download(url: str, destination: Path, referer: str, minimum_pages: int) -> tuple[str, int, int, str]:
              errors: list[str] = []
              variants = [url, url + "?download=1", url + "?inline=1"]
              for candidate in variants:
                  for attempt in range(5):
                      try:
                          headers = {
                              "Accept": "application/pdf,application/octet-stream,*/*",
                              "Referer": referer,
                              "Origin": "https://marriott.gcs-web.com",
                              "Sec-Fetch-Dest": "document",
                              "Sec-Fetch-Mode": "navigate",
                              "Sec-Fetch-Site": "same-origin",
                          }
                          with session.get(candidate, headers=headers, timeout=(30, 600), stream=True, allow_redirects=True) as response:
                              print("GET", response.status_code, response.url, response.headers.get("content-type"), response.headers.get("content-length"))
                              response.raise_for_status()
                              with destination.open("wb") as output:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          output.write(chunk)
                              final_url = response.url
                          size, pages, digest = validate(destination, minimum_pages)
                          return final_url, size, pages, digest
                      except Exception as exc:
                          destination.unlink(missing_ok=True)
                          errors.append(f"{candidate} attempt {attempt + 1}: {exc!r}")
                          if attempt < 4:
                              time.sleep(min(2 ** attempt, 10))
              raise RuntimeError("; ".join(errors))

          manifest = [
              "Marriott International, Inc. (NASDAQ: MAR)",
              "Scope: official 2020-2025 Annual Reports plus the latest half-year filing available as of 2026-08-28.",
              "U.S. reporting convention: the latest half-year document is Marriott's Q2 2026 Form 10-Q, which includes statements for the six months ended June 30, 2026.",
              "Sources: Marriott International Investor Relations official PDF files; the Form 10-Q is also filed with the U.S. SEC.",
              "",
          ]

          for filename, url, title, minimum_pages, referer in REPORTS:
              destination = DOCS / filename
              final_url, size, pages, digest = download(url, destination, referer, minimum_pages)
              manifest.extend([
                  filename,
                  f"  Document: {title}",
                  f"  Pages: {pages}",
                  f"  Size: {size} bytes",
                  f"  SHA-256: {digest}",
                  f"  Official source: {final_url}",
                  "",
              ])
              print("OK", filename, pages, size, final_url)

          (DOCS / "File_List_and_Official_Sources.txt").write_text("\n".join(manifest), encoding="utf-8")

          final_zip = OUT / "Marriott_International_MAR_2020-2025_Annual_Reports_2026_Latest_Half-Year.zip"
          with zipfile.ZipFile(final_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(DOCS.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(final_zip, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != 7:
                  raise RuntimeError(f"Expected 7 PDFs, got {pdfs}")

          print(f"FINAL_ZIP={final_zip}")
          print(f"ZIP_SIZE={final_zip.stat().st_size}")
          print("CONTENTS")
          for path in sorted(DOCS.iterdir()):
              print(path.name, path.stat().st_size)
          PY
          python /tmp/package_marriott.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: marriott-reports-final-zip
          path: dist/Marriott_International_MAR_2020-2025_Annual_Reports_2026_Latest_Half-Year.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
