name: Query Eastmoney Shenzhen International reports

on:
  push:
    branches:
      - tmp/shenzhen-international-broker-reports-20260831

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python .github/scripts/query_eastmoney_shenzhen_international.py
