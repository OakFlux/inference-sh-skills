name: Find Joyson restructuring listing document

on:
  push:
    paths:
      - '.github/workflows/joyson-restructuring-document-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query CNINFO for restructuring report
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests
          session = requests.Session(); session.trust_env = False
          endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
          headers = {
              'User-Agent': 'Mozilla/5.0 Chrome/151',
              'Referer': 'https://www.cninfo.com.cn/new/disclosure/stock?stockCode=600699&orgId=gssh0600699',
              'Origin': 'https://www.cninfo.com.cn',
              'X-Requested-With': 'XMLHttpRequest',
              'Accept': 'application/json, text/plain, */*',
          }
          for keyword in ('重大资产置换', '发行股份购买资产', '重大资产置换及发行股份购买资产暨关联交易报告书', '重组报告书'):
              data = {
                  'pageNum': 1, 'pageSize': 100, 'column': 'sse', 'tabName': 'fulltext',
                  'plate': 'sh', 'stock': '600699,gssh0600699', 'searchkey': keyword,
                  'secid': '', 'category': '', 'trade': '', 'seDate': '2010-01-01~2012-12-31',
                  'sortName': '', 'sortType': '', 'isHLtitle': 'true',
              }
              r = session.post(endpoint, data=data, headers=headers, timeout=(30,240))
              print('\nKEYWORD', keyword, r.status_code, len(r.content), flush=True)
              r.raise_for_status(); payload = r.json()
              print('META', payload.get('totalAnnouncement'), payload.get('totalRecordNum'), flush=True)
              for item in payload.get('announcements') or []:
                  print('ROW', json.dumps(item, ensure_ascii=False), flush=True)
          PY
