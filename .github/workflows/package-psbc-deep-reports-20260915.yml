name: Package PSBC broker deep reports

on:
  push:
    branches:
      - tmp/psbc-broker-deep-reports-20260915

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/package build/previews
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          root = Path('build')
          package = root / 'package'
          previews = root / 'previews'
          output = root / '邮储银行_601658_01658_券商深度报告精选3份_截至2026-09-15.zip'

          documents = [
              {
                  'filename': '01_万联证券_邮储银行深度报告_聚焦稳健发展经营韧性不断增强_2024-11-28.pdf',
                  'title': '深度报告：聚焦稳健发展，经营韧性不断增强',
                  'institution': '万联证券',
                  'authors': '郭懿',
                  'publish_date': '2024-11-28',
                  'info_code': 'AP202411281641098402',
                  'pages': 19,
                  'title_terms': ['聚焦稳健发展', '经营韧性不断增强'],
              },
              {
                  'filename': '02_民生证券_邮储银行深度报告_挖潜零售禀赋乘风乡村振兴_2024-02-02.pdf',
                  'title': '深度报告：挖潜零售禀赋，乘风乡村振兴',
                  'institution': '民生证券',
                  'authors': '',
                  'publish_date': '2024-02-02',
                  'info_code': 'AP202402021620065043',
                  'pages': 40,
                  'title_terms': ['挖潜零售禀赋', '乘风乡村振兴'],
              },
              {
                  'filename': '03_万联证券_邮储银行首次覆盖_经营稳健关注结构优化和效率提升_2022-08-04.pdf',
                  'title': '首次覆盖：经营稳健，关注结构优化和效率提升',
                  'institution': '万联证券',
                  'authors': '',
                  'publish_date': '2022-08-04',
                  'info_code': 'AP202208041576895843',
                  'pages': 15,
                  'title_terms': ['经营稳健', '结构优化', '效率提升'],
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=5,
              connect=5,
              read=5,
              backoff_factor=1.0,
              status_forcelist=(429, 500, 502, 503, 504),
              allowed_methods=frozenset(['GET']),
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer': 'https://data.eastmoney.com/',
          })

          def normalize(value: str) -> str:
              return re.sub(r'\s+', '', value or '').lower()

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def download(document: dict, destination: Path) -> str:
              candidates = [
                  f'https://pdf.dfcfw.com/pdf/H3_{document["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{document["info_code"]}_1.pdf',
              ]
              errors = []
              for url in candidates:
                  try:
                      temporary = destination.with_suffix('.pdf.part')
                      with session.get(url, stream=True, timeout=240, allow_redirects=True) as response:
                          response.raise_for_status()
                          with temporary.open('wb') as handle:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      handle.write(chunk)
                          resolved_url = response.url
                      with temporary.open('rb') as handle:
                          header = handle.read(5)
                      if header != b'%PDF-' or temporary.stat().st_size < 100_000:
                          raise RuntimeError(
                              f'invalid payload: header={header!r}, size={temporary.stat().st_size}'
                          )
                      temporary.replace(destination)
                      return resolved_url
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              raise RuntimeError('All download candidates failed:\n' + '\n'.join(errors))

          manifest = []
          for document in documents:
              destination = package / document['filename']
              source_url = download(document, destination)

              reader = PdfReader(str(destination), strict=False)
              page_count = len(reader.pages)
              if page_count != document['pages']:
                  raise RuntimeError(
                      f'{destination.name}: page mismatch {page_count} != {document["pages"]}'
                  )

              sampled = ''
              indexes = sorted(set(list(range(min(10, page_count))) + [page_count // 2, page_count - 1]))
              for index in indexes:
                  try:
                      sampled += '\n' + (reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              text = normalize(sampled)
              company_terms = ['邮储银行', '中国邮政储蓄银行', 'postalsavingsbankofchina']
              if not any(normalize(term) in text for term in company_terms):
                  raise RuntimeError(f'{destination.name}: company identity not found')
              if not any(normalize(term) in text for term in document['title_terms']):
                  print('TITLE_TEXT_WARNING', destination.name)

              preview_base = previews / destination.stem
              subprocess.run(
                  [
                      'pdftoppm', '-f', '1', '-l', '1', '-singlefile',
                      '-png', '-r', '90', str(destination), str(preview_base),
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
              )
              preview = preview_base.with_suffix('.png')
              if not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f'{destination.name}: first-page rendering failed')

              record = {
                  'file': destination.name,
                  'title': document['title'],
                  'institution': document['institution'],
                  'authors': document['authors'],
                  'publish_date': document['publish_date'],
                  'info_code': document['info_code'],
                  'pages': page_count,
                  'bytes': destination.stat().st_size,
                  'sha256': sha256(destination),
                  'source_url': source_url,
              }
              manifest.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False))

          inventory = [
              '# 邮储银行（601658.SH / 01658.HK）券商深度报告精选',
              '',
              '整理截至：2026-09-15',
              '',
              '本资料包收录两份公司深度报告及一份首次覆盖报告，不使用普通季报或年报点评凑数。',
              '',
              '## 文件清单',
              '',
          ]
          for index, item in enumerate(manifest, start=1):
              inventory.extend([
                  f'{index}. {item["file"]}',
                  f'   - 标题：{item["title"]}',
                  f'   - 机构：{item["institution"]}',
                  f'   - 作者：{item["authors"] or "详见报告"}',
                  f'   - 日期：{item["publish_date"]}',
                  f'   - 页数：{item["pages"]}',
                  f'   - 大小：{item["bytes"] / 1024 / 1024:.2f} MiB',
                  f'   - SHA-256：{item["sha256"]}',
                  f'   - 公开PDF来源：{item["source_url"]}',
                  '',
              ])
          inventory.extend([
              '## 校验说明',
              '',
              '- 每份文件均通过PDF文件头、文件大小及pypdf完整解析检查。',
              '- 核对东方财富研报标识、标题、机构、发布日期和精确页数。',
              '- 抽样核对正文中的邮储银行公司身份。',
              '- 每份报告首页均使用Poppler成功渲染。',
              '- 最终ZIP通过CRC完整性检查。',
              '',
              '报告版权归原券商研究机构及作者所有。本资料包仅用于公开信息查阅，不构成投资建议。',
          ])
          (package / '00_文件清单与校验记录.md').write_text('\n'.join(inventory), encoding='utf-8')
          (package / 'checksums.json').write_text(
              json.dumps({
                  'generated_at_utc': datetime.now(timezone.utc).isoformat(),
                  'as_of_date': '2026-09-15',
                  'documents': manifest,
              }, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(package.iterdir(), key=lambda item: item.name):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(output, 'r') as archive:
              bad_member = archive.testzip()
              if bad_member:
                  raise RuntimeError(f'ZIP CRC failure: {bad_member}')
              pdf_count = sum(name.lower().endswith('.pdf') for name in archive.namelist())
              if pdf_count != 3:
                  raise RuntimeError(f'Expected 3 PDF files, found {pdf_count}')

          print(json.dumps({
              'final_zip': str(output),
              'zip_bytes': output.stat().st_size,
              'zip_sha256': sha256(output),
              'documents': manifest,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: psbc-broker-deep-reports-20260915
          path: build/邮储银行_601658_01658_券商深度报告精选3份_截至2026-09-15.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
