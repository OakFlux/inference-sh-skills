name: Build public Guowang Xintong reports 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guowang-xintong-public-reports-2-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build verified package
        run: python scripts/build_guowang_xintong_public_reports_2_20261004.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: guowang-xintong-600131-public-reports-2-20261004
          path: 国网信通_600131_券商研究报告_2份_20261004.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
