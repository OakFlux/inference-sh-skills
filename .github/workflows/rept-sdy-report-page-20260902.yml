name: Fetch Sdyanbao report search page for REPT BATTERO

on:
  push:
    paths:
      - '.github/workflows/rept-sdy-report-page-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch search page and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          import urllib.parse, urllib.request
          out=Path('sdy_report_page'); out.mkdir()
          url='https://www.sdyanbao.com/report?keyword='+urllib.parse.quote('瑞浦兰钧')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          with urllib.request.urlopen(req,timeout=30) as r:
              b=r.read(); final=r.geturl(); headers=dict(r.headers)
          text=b.decode('utf-8','replace')
          (out/'page.html').write_text(text,encoding='utf-8')
          matches={
            'ap_codes':sorted(set(re.findall(r'AP\d{18}',text))),
            'detail_ids':sorted(set(re.findall(r'(?:id|original_id):([0-9]{4,})',text))),
            'names':re.findall(r'name:"([^"]{1,180})"',text),
            'page_urls':re.findall(r'page_url:"([^"]+)"',text),
            'uuids':re.findall(r'data_source_uuid:"([^"]+)"',text),
          }
          result={'url':url,'final_url':final,'status':200,'bytes':len(b),'headers':headers,'contains_company':'瑞浦兰钧' in text,'matches':matches,'snippets':[]}
          for term in ['瑞浦兰钧','REPT BATTERO','00666','AP20']:
              start=0
              for _ in range(20):
                  i=text.find(term,start)
                  if i<0:break
                  result['snippets'].append({'term':term,'pos':i,'text':text[max(0,i-800):i+1800]})
                  start=i+len(term)
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rept-sdy-report-page
          path: sdy_report_page/
          if-no-files-found: error
          retention-days: 7
