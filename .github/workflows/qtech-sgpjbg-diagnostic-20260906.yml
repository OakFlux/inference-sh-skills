name: Inspect Q Technology report page assets 20260906

on:
  push:
    paths:
      - '.github/workflows/qtech-sgpjbg-diagnostic-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: python -m pip install --quiet requests beautifulsoup4 lxml playwright
      - name: Inspect pages and browser network
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, html, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          out=Path('qtech-sgpjbg-diagnostic'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          urls=['https://www.sgpjbg.com/baogao/616950.html','https://www.sgpjbg.com/bgdown/616950.html','https://m.sgpjbg.com/baogao/616950.html']
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              print('FETCH',u,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text; (out/f'page{i}.html').write_text(text,encoding='utf-8')
              raw=html.unescape(text).replace('\\/','/')
              candidates=[]
              for pat in [r'https?://[^"\'<>\s]+',r'(?:src|href|data-src|data-url|data-file|url|pdfurl|fileurl)\s*=\s*["\']([^"\']+)',r'["\']([^"\']*(?:616950|\.pdf|download|preview|upload|viewer)[^"\']*)["\']']:
                for x in re.findall(pat,raw,flags=re.I):
                  if isinstance(x,tuple): x=next((v for v in x if v),'')
                  if x and x not in candidates: candidates.append(x)
              interesting=[x for x in candidates if any(k in x.lower() for k in ('616950','.pdf','download','preview','upload','viewer','baogao'))]
              (out/f'page{i}_urls.json').write_text(json.dumps(interesting,ensure_ascii=False,indent=2),encoding='utf-8')
              print('INTERESTING',i,json.dumps(interesting[:200],ensure_ascii=False),flush=True)
              lines=[ln.strip() for ln in raw.splitlines() if any(k in ln.lower() for k in ('616950','pdfurl','fileurl','downloadurl','preview','pdf_path','pdfpath'))]
              (out/f'page{i}_lines.txt').write_text('\n'.join(lines[:1000]),encoding='utf-8')
              print('LINES',i,json.dumps(lines[:100],ensure_ascii=False),flush=True)
            except Exception as e:
              print('FETCH_FAIL',u,repr(e),flush=True)
          PY
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path('qtech-sgpjbg-diagnostic')
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              ctx=await b.new_context(viewport={'width':1440,'height':1000})
              page=await ctx.new_page()
              events=[]
              def rec(resp):
                u=resp.url
                if any(k in u.lower() for k in ('616950','.pdf','download','preview','upload','viewer','image')):
                  events.append({'url':u,'status':resp.status,'content_type':resp.headers.get('content-type','')})
              page.on('response',rec)
              for u in ['https://www.sgpjbg.com/baogao/616950.html','https://www.sgpjbg.com/bgdown/616950.html']:
                try:
                  await page.goto(u,wait_until='networkidle',timeout=120000)
                  await page.wait_for_timeout(5000)
                  print('BROWSER',u,await page.title(),page.url,flush=True)
                  print('BODY', (await page.locator('body').inner_text())[:1000],flush=True)
                except Exception as e: print('BROWSER_FAIL',u,repr(e),flush=True)
              await b.close()
              uniq=[]; seen=set()
              for x in events:
                if x['url'] not in seen: seen.add(x['url']); uniq.append(x)
              (out/'network.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
              print('NETWORK',json.dumps(uniq,ensure_ascii=False),flush=True)
          asyncio.run(main())
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: qtech-sgpjbg-diagnostic
          path: qtech-sgpjbg-diagnostic/
          retention-days: 7
