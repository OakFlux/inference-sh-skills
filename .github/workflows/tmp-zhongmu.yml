name: Zhongmu reports
on:
  push:
    branches: [tmp/zhongmu-reports-20260830]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf
      - run: python .github/scripts/package_zhongmu_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: zhongmu-reports
          path: 中牧股份_2020-2025年报_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
