name: Discover optical industry reports for Wufang 20260929

on:
  push:
    paths:
      - '.github/workflows/wufang-optoelectronics-industry-report-discovery-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Eastmoney industry research metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})
          params={'industryCode':'*','pageSize':'5000','industry':'*','rating':'*','ratingChange':'*','beginTime':'2019-01-01','endTime':'2022-12-31','pageNo':'1','fields':'','qType':'1','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(30,180)); print('HTTP',r.status_code,len(r.content),r.url,flush=True); r.raise_for_status()
          d=r.json(); rows=d.get('data') or d.get('Data') or d.get('list') or []
          if isinstance(rows,dict): rows=rows.get('list') or rows.get('data') or []
          print('TOTAL',len(rows),flush=True)
          keys=('光学','摄像头','滤光片','TOF','3D Sensing','3D感知','消费电子','手机摄像','影像')
          out=[]
          for x in rows:
              title=str(x.get('title') or x.get('reportTitle') or x.get('REPORT_TITLE') or '')
              if not any(k.lower() in title.lower() for k in keys): continue
              rec={'title':title,'infoCode':x.get('infoCode') or x.get('INFO_CODE'),'org':x.get('orgSName') or x.get('orgName') or x.get('ORG_SNAME'),'date':x.get('publishDate') or x.get('PUBLIC_DATE'),'researcher':x.get('researcher') or x.get('RESEARCHER'),'pages':x.get('attachPages') or x.get('ATTACH_PAGES'),'industry':x.get('industryName') or x.get('industry') or x.get('INDUSTRY_NAME')}
              out.append(rec)
          out.sort(key=lambda x:str(x.get('date') or ''),reverse=True)
          print('MATCHES',len(out),flush=True)
          for rec in out:
              print('REPORT',json.dumps(rec,ensure_ascii=False),flush=True)
          PY
