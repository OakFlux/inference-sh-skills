name: One-shot Eastmoney lookup for Mengtaigaoxin

on:
  push:
    paths:
      - '.github/workflows/mengtaigaoxin-eastmoney-one-shot-20260830.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Query exact dates with hard timeouts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          s=requests.Session()
          h={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Referer':'https://data.eastmoney.com/'}
          reqs=[
            ('2023-06-13','2023-06-13',0),('2023-06-15','2023-06-15',0),
            ('2023-08-21','2023-08-25',0),('2024-04-02','2024-04-15',0),
            ('2021-06-23','2021-06-23',0),('2021-08-10','2021-08-10',0)]
          found=[]
          for begin,end,qtype in reqs:
            p={'pageNo':1,'pageSize':500,'qType':qtype,'beginTime':begin,'endTime':end}
            try:
              r=s.get('https://reportapi.eastmoney.com/report/list',params=p,headers=h,timeout=(5,15))
              print('Q',begin,end,qtype,r.status_code,len(r.content),r.url,flush=True)
              print('HEAD',r.text[:200],flush=True)
              if r.status_code!=200: continue
              o=r.json()
            except Exception as e:
              print('ERR',begin,end,repr(e),flush=True); continue
            d=o.get('data') if isinstance(o,dict) else None
            rows=d if isinstance(d,list) else (d.get('data') or d.get('list') or d.get('items') or [] if isinstance(d,dict) else [])
            print('ROWS',len(rows) if isinstance(rows,list) else 'NA',flush=True)
            if not isinstance(rows,list): continue
            for x in rows:
              b=json.dumps(x,ensure_ascii=False,default=str)
              if '蒙泰高新' in b or '300876' in b:
                found.append(x); print('MATCH',b,flush=True)
          open('one_shot_matches.json','w',encoding='utf-8').write(json.dumps(found,ensure_ascii=False,indent=2))
          print('TOTAL',len(found),flush=True)
          PY
      - name: Upload matches
        uses: actions/upload-artifact@v4
        with:
          name: mengtaigaoxin-eastmoney-one-shot
          path: one_shot_matches.json
          if-no-files-found: error
          retention-days: 3
