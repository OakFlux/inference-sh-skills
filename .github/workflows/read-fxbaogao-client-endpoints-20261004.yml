name: Read Fxbaogao client endpoints 20261004

on:
  push:
    branches: [main]
    paths:
      - 'scripts/read_fxbaogao_client_endpoints_20261004.py'
      - '.github/workflows/read-fxbaogao-client-endpoints-20261004.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Read client endpoint references
        run: python scripts/read_fxbaogao_client_endpoints_20261004.py
