name: Fetch Lanfeng Fxbaogao pages 20261004

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_lanfeng_fxbaogao_pages_20261004.py'
      - '.github/workflows/fetch-lanfeng-fxbaogao-pages-20261004.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch pages
        run: python scripts/fetch_lanfeng_fxbaogao_pages_20261004.py
