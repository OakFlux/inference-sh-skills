name: Inspect Huaxin old Sina annual index 20260922
on:
  push:
    paths:
      - '.github/workflows/huaxin-sina-old-index-20260922.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'}
          urls=['https://finance.sina.com.cn/stock/company/sh/600801/9.shtml','https://finance.sina.com.cn/stock/company/sh/900933/9.shtml','https://biz.finance.sina.com.cn/stock/company/bulletin_list.php?code=600801']
          out={}
          for u in urls:
            try:
              r=s.get(u,headers=H,timeout=(8,25),allow_redirects=True); r.raise_for_status(); r.encoding=r.apparent_encoding or r.encoding
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                t=' '.join(a.get_text(' ',strip=True).split()); href=urljoin(r.url,a['href'])
                if re.search(r'/9(?:_\d+)?\.shtml',href) or any(k in t for k in ['年度报告','年报','1993','1994','1995','1996','1997','1998','1999','2000','2001']):
                  links.append({'text':t,'url':href}); print(t,href,flush=True)
              out[u]={'status':r.status_code,'final':r.url,'length':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links,'html':r.text}
              print('URL',u,'status',r.status_code,'len',len(r.content),'links',len(links),flush=True)
            except Exception as e:
              out[u]={'error':repr(e)}; print('ERROR',u,repr(e),flush=True)
          Path('old_index.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huaxin-sina-old-index
          path: old_index.json
          retention-days: 7
