name: Run exact CIDI report search 20260922
on:
  push:
    paths:
      - '.github/workflows/cidi-exact-search-20260922.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/find_cidi_exact_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: cidi-exact-search-results
          path: cidi_exact_search
          if-no-files-found: error
          retention-days: 7
