name: Temporary Jinmei historical report page-set discovery

on:
  push:
    branches:
      - tmp/download-jinmei-tech-reports-20260830
    paths:
      - .github/workflows/tmp-jinmei-old-title-sdy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Query exact historical report titles and verify public page images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests
          from concurrent.futures import ThreadPoolExecutor, as_completed

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          api='https://api.sdyanbao.com/api/file/search'
          s=requests.Session()
          s.headers.update({
              'User-Agent':UA,
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Content-Type':'application/json;charset=UTF-8',
              'Accept':'application/json,text/plain,*/*',
          })
          queries=[
              '拥有世界领先技术的煤化工龙头',
              '核心煤化工技术带来长期增长潜力',
              '醋酐和乙二醇两业并举',
              '煤制乙二醇揭开公司高增长的序幕',
              '先进煤化工生产技术的探索者',
              '碳一技术行业翘楚',
              '煤化工技术创新成就高速成长',
              '煤制乙二醇前景广阔静待技术瓶颈突破',
              '煤制乙二醇发展空间巨大建议关注丹化科技',
              '斯尔邦借壳登录资本市场产业链一体化定位高端',
              '产业链一体化布局打造中国版高端新材料企业',
              '丹化科技 公司深度',
              '丹化科技 首次覆盖',
              '600844 公司研究',
          ]
          seen={}
          for q in queries:
              for only_title in [1,0]:
                  for page in range(1,6):
                      payload={
                          'device':1,'hideTrader':0,'onlyTitle':only_title,'order':0,
                          'page':page,'pageSize':100,'keyword':q,'pageCount':0,
                          'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]
                      }
                      try:
                          r=s.post(api,json=payload,timeout=90)
                          print('QUERY',json.dumps({'q':q,'onlyTitle':only_title,'page':page},ensure_ascii=False),'HTTP',r.status_code,'LEN',len(r.content))
                          r.raise_for_status()
                          data=(r.json().get('data') or {})
                          files=data.get('files') or []
                          print('TOTAL',data.get('total'),'COUNT',len(files))
                      except Exception as e:
                          print('QUERY_ERR',q,only_title,page,repr(e))
                          break
                      if not files:
                          break
                      for f in files:
                          row={
                              'id':f.get('id'),
                              'name':f.get('name'),
                              'date':f.get('time_text'),
                              'pages':f.get('page_count'),
                              'size':f.get('file_size'),
                              'type':(f.get('type') or {}).get('name'),
                              'organization':(f.get('organization') or {}).get('name'),
                              'stock':f.get('stock'),
                              'uuid':f.get('data_source_uuid'),
                              'data_source':f.get('data_source'),
                              'original_id':f.get('original_id'),
                              'page_url':f.get('page_url'),
                              'share_url':f.get('share_url'),
                              'summary':str(f.get('summary') or '')[:800],
                              'content':str(f.get('content') or '')[:1000],
                          }
                          blob=' '.join(str(row.get(k) or '') for k in ['name','organization','stock','summary','content'])
                          exact=(
                              '丹化科技' in blob or '金煤科技' in blob or '600844' in blob or
                              any(t in blob.replace('，','').replace('、','').replace('“','').replace('”','') for t in [
                                  '拥有世界领先技术的煤化工龙头','核心煤化工技术带来长期增长潜力',
                                  '醋酐和乙二醇两业并举','煤制乙二醇揭开公司高增长的序幕',
                                  '先进煤化工生产技术的探索者','碳一技术行业翘楚',
                                  '煤化工技术创新成就高速成长','煤制乙二醇前景广阔静待技术瓶颈突破',
                                  '斯尔邦借壳登录资本市场','产业链一体化布局打造中国版高端新材料企业'
                              ])
                          )
                          if exact:
                              seen[str(row['id'])]=row
                              print('MATCH',json.dumps(row,ensure_ascii=False))
                      if page*100>=int(data.get('total') or 0):
                          break

          print('\nUNIQUE_MATCHES',len(seen))
          for row in seen.values():
              print('UNIQUE',json.dumps(row,ensure_ascii=False))

          def check_page_set(row):
              root=str(row.get('page_url') or '').rstrip('/')
              pages=int(row.get('pages') or 0)
              result={'id':row.get('id'),'name':row.get('name'),'declared_pages':pages,'root':root,'ok':0,'failures':[],'patterns':{}}
              if not root or pages<=0:
                  return result
              patterns=[
                  ('zero_png', lambda i: f'{root}/{i}.png'),
                  ('one_png', lambda i: f'{root}/{i+1}.png'),
                  ('zero_jpg', lambda i: f'{root}/{i}.jpg'),
                  ('one_jpg', lambda i: f'{root}/{i+1}.jpg'),
              ]
              for pname,builder in patterns:
                  ok=0; failures=[]
                  for i in range(pages):
                      u=builder(i)
                      try:
                          x=requests.get(u,headers={'User-Agent':UA,'Referer':'https://www.sdyanbao.com/'},timeout=35)
                          valid=(x.status_code==200 and len(x.content)>10000 and (x.content[:8]==b'\x89PNG\r\n\x1a\n' or x.content[:3]==b'\xff\xd8\xff'))
                          if valid:
                              ok+=1
                          else:
                              failures.append({'i':i,'status':x.status_code,'bytes':len(x.content),'head':x.content[:12].hex(),'url':u})
                      except Exception as e:
                          failures.append({'i':i,'error':repr(e),'url':u})
                  result['patterns'][pname]={'ok':ok,'failures':failures[:10]}
                  if ok>result['ok']:
                      result['ok']=ok
                      result['best_pattern']=pname
                      result['failures']=failures[:20]
              return result

          candidates=[r for r in seen.values() if int(r.get('pages') or 0)>0 and r.get('page_url')]
          with ThreadPoolExecutor(max_workers=min(8,max(1,len(candidates)))) as ex:
              futures=[ex.submit(check_page_set,r) for r in candidates]
              for fut in as_completed(futures):
                  print('PAGESET',json.dumps(fut.result(),ensure_ascii=False))
          PY
