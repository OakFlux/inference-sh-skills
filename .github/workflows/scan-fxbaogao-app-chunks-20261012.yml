name: Scan FXBaogao app chunks 20261012

on:
  push:
    branches:
      - xingdesheng-broker-reports-20261012
    paths:
      - '.github/workflows/scan-fxbaogao-app-chunks-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Scan chunks
        run: python scripts/scan_fxbaogao_app_chunks_for_viewer_api_20261012.py
