name: Probe more Baida Hibor report content

on:
  push:
    paths:
      - '.github/workflows/probe-baida-more-hibor-content-20261012.yml'
      - 'scripts/probe_baida_more_hibor_content_20261012.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_baida_more_hibor_content_20261012.py
