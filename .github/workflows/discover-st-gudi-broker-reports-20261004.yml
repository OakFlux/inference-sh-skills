name: Discover ST Gudi broker reports 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-st-gudi-broker-reports-20261004.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Discover reports
        run: python scripts/discover_st_gudi_broker_reports_20261004.py
