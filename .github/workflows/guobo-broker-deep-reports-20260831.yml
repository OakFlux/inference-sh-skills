name: Package Guobo broker deep reports

on:
  push:
    paths:
      - '.github/workflows/guobo-broker-deep-reports-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf
          python -m pip install --quiet pypdf

      - name: Discover, download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from datetime import datetime
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY = '国博电子'
          CODE = '688375'
          PACKAGE = '国博电子_券商深度报告_3份_公开完整版'
          out = Path(PACKAGE)
          out.mkdir(parents=True, exist_ok=True)
          previews = Path('_guobo_broker_previews')
          previews.mkdir(exist_ok=True)

          session = requests.Session()
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          api_headers = {
              'User-Agent': ua,
              'Accept': 'application/json,text/plain,*/*',
              'Referer': 'https://data.eastmoney.com/',
          }
          pdf_headers = {
              'User-Agent': ua,
              'Accept': 'application/pdf,*/*;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          }

          response = session.get(
              'https://reportapi.eastmoney.com/report/list',
              params={
                  'pageNo': 1,
                  'pageSize': 200,
                  'code': CODE,
                  'qType': 0,
                  'beginTime': '2022-01-01',
                  'endTime': '2026-08-31',
              },
              headers=api_headers,
              timeout=(20, 90),
          )
          print('REPORT_API', response.status_code, len(response.content), response.url, flush=True)
          response.raise_for_status()
          payload = response.json()
          rows = payload.get('data') if isinstance(payload, dict) else []
          if not isinstance(rows, list):
              raise RuntimeError('Unexpected Eastmoney report API response')

          candidates = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              title = str(row.get('title') or '').strip()
              organization = str(row.get('orgSName') or row.get('orgName') or '').strip()
              info_code = str(row.get('infoCode') or row.get('infocode') or '').strip()
              date_text = str(row.get('publishDate') or '')[:10]
              try:
                  pages = int(row.get('attachPages') or row.get('pageCount') or row.get('pages') or 0)
              except Exception:
                  pages = 0
              if not title or not info_code.startswith('AP') or pages < 15:
                  continue
              if any(term in title for term in ('点评', '中报', '季报', '年报及', '业绩快报')):
                  continue
              explicit = any(term in title for term in ('深度', '首次覆盖', '初次覆盖'))
              substantial = pages >= 20
              thematic = any(term in title for term in ('T/R组件', '相控阵', '商业航天', '射频', '新兴赛道'))
              if not explicit and not (substantial and thematic):
                  continue
              try:
                  date_score = int(datetime.strptime(date_text, '%Y-%m-%d').timestamp() // 86400)
              except Exception:
                  date_score = 0
              score = (1200 if explicit else 0) + (400 if pages >= 30 else 250 if pages >= 20 else 0) + (100 if thematic else 0) + date_score / 100000
              candidates.append({
                  'title': title,
                  'organization': organization or '券商',
                  'infoCode': info_code,
                  'date': date_text,
                  'pages_hint': pages,
                  'researcher': str(row.get('researcher') or ''),
                  'rating': str(row.get('emRatingName') or ''),
                  'score': score,
              })

          print('CANDIDATES', json.dumps(candidates, ensure_ascii=False, indent=2), flush=True)
          if len(candidates) < 3:
              raise RuntimeError(f'Only {len(candidates)} suitable deep-report candidates found')

          candidates.sort(key=lambda item: (item['score'], item['date'], item['pages_hint']), reverse=True)

          # Prioritize different institutions and retain the strongest explicit deep reports.
          selected = []
          seen_orgs = set()
          preferred_phrases = [
              'T/R组件龙头，商业航天及军品订单共同驱动增长',
              '有源相控阵T/R组件龙头企业',
              '产品结构优化，新兴赛道持续突破',
              'T/R组件核心供应商',
          ]
          for phrase in preferred_phrases:
              for item in candidates:
                  if phrase in item['title'] and item['organization'] not in seen_orgs and item not in selected:
                      selected.append(item)
                      seen_orgs.add(item['organization'])
                      break
              if len(selected) >= 3:
                  break
          for item in candidates:
              if len(selected) >= 3:
                  break
              if item in selected or item['organization'] in seen_orgs:
                  continue
              selected.append(item)
              seen_orgs.add(item['organization'])
          for item in candidates:
              if len(selected) >= 3:
                  break
              if item not in selected:
                  selected.append(item)

          if len(selected) != 3:
              raise RuntimeError(f'Unable to select three reports; selected {len(selected)}')

          print('SELECTED', json.dumps(selected, ensure_ascii=False, indent=2), flush=True)

          def safe(value: str) -> str:
              return re.sub(r'[\\/:*?"<>|\s]+', '_', value).strip('_')[:100]

          def fetch_pdf(item: dict) -> tuple[bytes, str]:
              last_error = None
              for prefix in ('H3', 'H2'):
                  url = f"https://pdf.dfcfw.com/pdf/{prefix}_{item['infoCode']}_1.pdf"
                  for attempt in range(6):
                      try:
                          response = session.get(url, headers=pdf_headers, timeout=(30, 300), allow_redirects=True)
                          print('PDF_GET', url, response.status_code, response.headers.get('content-type'), len(response.content), flush=True)
                          if response.status_code == 200 and response.content.startswith(b'%PDF-'):
                              return response.content, url
                          last_error = RuntimeError(f'HTTP {response.status_code}; {len(response.content)} bytes')
                      except Exception as exc:
                          last_error = exc
                      time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"Failed to download {item['title']}: {last_error}")

          records = []
          seen_hashes = set()
          for index, item in enumerate(selected, 1):
              pdf_bytes, source_url = fetch_pdf(item)
              filename = f"{index:02d}_{safe(item['organization'])}_{COMPANY}_{safe(item['title'])}_{item['date']}_{item['pages_hint']}页.pdf"
              path = out / filename
              path.write_bytes(pdf_bytes)

              reader = PdfReader(str(path))
              pages = len(reader.pages)
              if pages < 15:
                  raise RuntimeError(f'{filename} is too short: {pages} pages')
              if item['pages_hint'] and pages != item['pages_hint']:
                  raise RuntimeError(f"Page count mismatch for {filename}: actual {pages}, metadata {item['pages_hint']}")

              text = '\n'.join((page.extract_text() or '') for page in reader.pages[:10])
              compact = re.sub(r'\s+', '', text)
              if COMPANY not in compact and CODE not in compact:
                  raise RuntimeError(f'Company identity validation failed for {filename}')

              subprocess.run(['qpdf', '--check', str(path)], check=True, capture_output=True)
              first_prefix = previews / f'{index:02d}_first'
              last_prefix = previews / f'{index:02d}_last'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '90', str(path), str(first_prefix)],
                  check=True,
                  capture_output=True,
              )
              subprocess.run(
                  ['pdftoppm', '-f', str(pages), '-singlefile', '-png', '-r', '90', str(path), str(last_prefix)],
                  check=True,
                  capture_output=True,
              )
              if not Path(str(first_prefix) + '.png').exists() or not Path(str(last_prefix) + '.png').exists():
                  raise RuntimeError(f'Render verification failed for {filename}')

              digest = hashlib.sha256(pdf_bytes).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError('Duplicate PDF detected')
              seen_hashes.add(digest)
              record = {
                  **item,
                  'filename': filename,
                  'pages': pages,
                  'bytes': len(pdf_bytes),
                  'sha256': digest,
                  'source_url': source_url,
                  'source_format': '公开原始PDF',
              }
              records.append(record)
              print('VERIFIED', json.dumps({k: record[k] for k in ('organization', 'title', 'date', 'pages', 'filename')}, ensure_ascii=False), flush=True)

          lines = [
              f'{COMPANY}（{CODE}.SH）券商深度报告包',
              '',
              '本包共3份完整公司深度/首次覆盖研究报告，均为公开原始PDF。',
              '筛选原则：优先明确标注公司深度或首次覆盖、页数较多、机构不重复，并排除几页的财报点评。',
              '',
          ]
          for index, record in enumerate(records, 1):
              lines.extend([
                  f"{index}. {record['organization']}：《{record['title']}》",
                  f"   日期：{record['date']}；页数：{record['pages']}页；评级：{record['rating'] or '未标注'}",
                  f"   分析师：{record['researcher'] or '未标注'}",
                  f"   文件：{record['filename']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          lines.extend([
              '核验项目：PDF文件头和结构、实际页数、公司名称/证券代码、首页与末页渲染、文件哈希、ZIP CRC。',
              '资料仅供研究参考，版权归原研究机构及作者所有，不构成投资建议。',
          ])
          (out / '报告清单与核验说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(
              ''.join(f"{record['sha256']}  {record['filename']}\n" for record in records),
              encoding='utf-8',
          )

          zip_path = Path(f'{PACKAGE}.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'ZIP contains {len(pdfs)} PDFs instead of 3')
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: guobo-broker-deep-reports-final
          path: |
            国博电子_券商深度报告_3份_公开完整版/
            国博电子_券商深度报告_3份_公开完整版.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
