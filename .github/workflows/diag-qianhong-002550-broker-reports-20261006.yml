name: Inspect Qianhong Pharmaceutical broker reports 20261006

on:
  push:
    paths:
      - '.github/workflows/diag-qianhong-002550-broker-reports-20261006.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query Eastmoney report metadata
        run: |
          python - <<'PY'
          import json
          import requests

          s = requests.Session()
          s.trust_env = False
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/002550.html',
              'Accept-Language': 'zh-CN,zh;q=0.9',
          }
          all_rows = []
          for page in range(1, 6):
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2000-01-01', 'endTime': '2026-10-06',
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'code': '002550', 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              r = s.get('https://reportapi.eastmoney.com/report/list', params=params, headers=headers, timeout=90)
              print('STATUS', page, r.status_code, r.headers.get('content-type'), len(r.content), r.url, flush=True)
              r.raise_for_status()
              obj = r.json()
              rows = obj.get('data') or []
              print('PAGE', page, 'ROWS', len(rows), 'HITS', obj.get('hits'), flush=True)
              all_rows.extend(rows)
              if len(rows) < 100:
                  break

          seen = set()
          output = []
          for item in all_rows:
              info_code = item.get('infoCode')
              if not info_code or info_code in seen:
                  continue
              seen.add(info_code)
              output.append({
                  'infoCode': info_code,
                  'publishDate': item.get('publishDate'),
                  'title': item.get('title'),
                  'orgSName': item.get('orgSName'),
                  'researcher': item.get('researcher'),
                  'attachPages': item.get('attachPages'),
                  'attachSize': item.get('attachSize'),
                  'rating': item.get('emRatingName'),
                  'stockName': item.get('stockName'),
                  'stockCode': item.get('stockCode'),
              })
          output.sort(key=lambda x: (int(x.get('attachPages') or 0), str(x.get('publishDate') or '')), reverse=True)
          print('UNIQUE', len(output), flush=True)
          print(json.dumps(output, ensure_ascii=False, indent=2), flush=True)
          PY
