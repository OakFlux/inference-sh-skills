name: Build Kaichuang 600097 broker deep archive 20261014
on:
  push:
    paths:
      - '.github/workflows/build-kaichuang-600097-broker-deep-archive-20261014.yml'
      - 'scripts/build_kaichuang_600097_broker_deep_archive_20261014.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Build archive
        shell: bash
        run: |
          python scripts/build_kaichuang_600097_broker_deep_archive_20261014.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: kaichuang-600097-broker-deep-20261014
          path: 开创国际_600097_券商深度报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
