name: Probe Xingdesheng Sina report URLs 20261012

on:
  push:
    branches:
      - xingdesheng-broker-reports-20261012
    paths:
      - '.github/workflows/probe-xingdesheng-sina-url-endpoints-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Probe original URLs
        run: python scripts/probe_xingdesheng_sina_url_endpoints_20261012.py
