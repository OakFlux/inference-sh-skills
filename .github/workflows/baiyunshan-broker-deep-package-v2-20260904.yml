name: Package Baiyunshan broker deep reports v2 20260904

on:
  push:
    paths:
      - '.github/workflows/baiyunshan-broker-deep-package-v2-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf pymupdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import pymupdf, requests
          from pypdf import PdfReader

          PACKAGE='白云山_券商深度报告_3份_完整PDF'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)
          work=Path('_baiyunshan_v2_work'); work.mkdir(exist_ok=True)
          renders=work/'renders'; renders.mkdir(exist_ok=True)

          candidates=[
            {
              'priority':1,'info':'AP202406241636836962','date':'2024-06-25','broker':'信达证券',
              'authors':'唐爱金、吴欣','rating':'买入',
              'title':'公司深度报告：华南医药消费龙头稳健增长，盈利能力持续优化',
              'type':'公司深度报告','min_pages':20,
            },
            {
              'priority':2,'info':'AP202512111798334987','date':'2025-12-11','broker':'信达证券',
              'authors':'唐爱金、章钟涛','rating':'买入',
              'title':'公司首次覆盖报告：25Q3报表端已企稳修复，冲击圆满完成“十四五”，重点布局“十五五”',
              'type':'首次覆盖报告','min_pages':15,
            },
            {
              'priority':3,'info':'AP201703010371403233','date':'2017-03-01','broker':'东吴证券',
              'authors':'马浩博、全铭','rating':'买入',
              'title':'深度报告：凉茶行业和公司净利率双拐点+中国伟哥龙头+混改持股高激励',
              'type':'深度报告','min_pages':18,
            },
            {
              'priority':4,'info':'AP201808071175620675','date':'2018-08-07','broker':'新时代证券',
              'authors':'马浩博、袁雨曦','rating':'增持',
              'title':'王老吉盈利见拐点，大南药板块驱动业绩增长',
              'type':'长篇公司研究','min_pages':15,
            },
          ]

          session=requests.Session(); session.trust_env=False
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Referer':'https://data.eastmoney.com/report/600332.html',
          }

          def fetch_pdf(info):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?download=1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf?download=1.pdf',
            ]
            errors=[]
            for url in urls:
              for attempt in range(1,4):
                try:
                  r=session.get(url,headers=headers,timeout=(30,300),allow_redirects=True)
                  print('GET',info,attempt,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>150000:
                    return r.content,str(r.url)
                  errors.append(f'{url}: HTTP {r.status_code}/{len(r.content)}')
                except Exception as exc:
                  errors.append(f'{url}: {repr(exc)}')
                time.sleep(min(attempt*2,6))
            raise RuntimeError(' | '.join(errors[-8:]))

          def opening_text(reader,limit=12):
            parts=[]
            for page in reader.pages[:min(limit,len(reader.pages))]:
              try: parts.append(page.extract_text() or '')
              except Exception: pass
            return re.sub(r'\s+','', '\n'.join(parts)).lower()

          validated=[]; failures=[]; hashes=set()
          for idx,c in enumerate(candidates,1):
            try:
              data,source_url=fetch_pdf(c['info'])
              temp=work/f'candidate_{idx}.pdf'; temp.write_bytes(data)
              reader=PdfReader(str(temp),strict=False)
              pages=len(reader.pages)
              if pages<c['min_pages']:
                raise RuntimeError(f'only {pages} pages; minimum {c["min_pages"]}')
              text=opening_text(reader)
              if not any(x in text for x in ('白云山','白雲山','广州白云山','廣州白雲山','600332','00874','baiyunshan')):
                raise RuntimeError('company identity not found')
              q=subprocess.run(['qpdf','--check',str(temp)],capture_output=True,text=True)
              if q.returncode not in (0,3):
                raise RuntimeError('qpdf failed: '+q.stderr[-1000:])
              if q.returncode==3:
                print('QPDF_WARNING',c['info'],q.stderr[-800:],flush=True)
              doc=pymupdf.open(str(temp))
              sample=sorted(set([0,max(0,pages//2),pages-1]))
              rendered=[]
              for pno in sample:
                page=doc.load_page(pno)
                pix=page.get_pixmap(matrix=pymupdf.Matrix(1.0,1.0),alpha=False)
                rp=renders/f'{idx:02d}_{pno+1:03d}.png'; pix.save(str(rp))
                if not rp.exists() or rp.stat().st_size<6000 or pix.width<400 or pix.height<400:
                  raise RuntimeError(f'render failed page {pno+1}')
                rendered.append(pno+1)
              doc.close()
              digest=hashlib.sha256(data).hexdigest()
              if digest in hashes: raise RuntimeError('duplicate PDF')
              hashes.add(digest)
              validated.append({**c,'pages':pages,'bytes':len(data),'sha256':digest,'source_url':source_url,'temp':str(temp),'rendered_pages':rendered})
              print('VALIDATED',json.dumps({k:validated[-1][k] for k in ('priority','broker','title','date','type','pages','bytes','source_url')},ensure_ascii=False),flush=True)
            except Exception as exc:
              failures.append({**c,'error':repr(exc)})
              print('FAILED',json.dumps({k:failures[-1][k] for k in ('priority','broker','title','info','error')},ensure_ascii=False),flush=True)

          validated.sort(key=lambda x:x['priority'])
          selected=validated[:3]
          if len(selected)<3:
            raise RuntimeError('Only '+str(len(selected))+' valid reports: '+json.dumps(failures,ensure_ascii=False))

          def safe(text):
            return re.sub(r'[\\/:*?"<>|\s]+','_',text).strip('_')[:45]

          records=[]
          for order,item in enumerate(selected,1):
            filename=f'{order:02d}_{safe(item["broker"])}_{safe(item["title"])}_{item["date"].replace("-","")}.pdf'
            data=Path(item['temp']).read_bytes()
            (out/filename).write_bytes(data)
            records.append({
              'filename':filename,'broker':item['broker'],'title':item['title'],'report_type':item['type'],
              'date':item['date'],'authors':item['authors'],'rating':item['rating'],'pages':item['pages'],
              'bytes':item['bytes'],'sha256':item['sha256'],'source_url':item['source_url'],
              'eastmoney_info_code':item['info'],'source':'东方财富研究报告PDF镜像（保留原券商报告版式）',
              'rendered_pages':item['rendered_pages'],
            })

          lines=['白云山（600332.SH / 00874.HK）券商深度报告','',
                 '本包包含3份完整PDF。优先收入明确标注为公司深度、首次覆盖或深度报告的文件；未收入数页的财报及事件点评。','']
          for i,r in enumerate(records,1):
            lines += [f"{i}. {r['broker']}：《{r['title']}》",
                      f"   类型：{r['report_type']}；日期：{r['date']}；作者：{r['authors']}；评级：{r['rating']}",
                      f"   实际页数：{r['pages']}页；大小：{r['bytes']/1048576:.2f} MB",
                      f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          lines += ['核验项目：PDF文件头、公司名称或证券代码、实际页数、qpdf结构、首页/中间页/末页渲染、SHA-256及ZIP CRC。',
                    '报告中的评级、预测和目标价均为历史发布时点观点。']
          (out/'报告清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=True) as z:
            for p in sorted(out.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failed: '+bad)
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('PDF count mismatch')
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'PDFS',len(records),'PAGES',sum(r['pages'] for r in records),flush=True)
          print('MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: baiyunshan-broker-deep-reports-v2-final
          path: 白云山_券商深度报告_3份_完整PDF.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
