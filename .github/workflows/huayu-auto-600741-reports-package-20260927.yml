name: Build Huayu Auto 600741 reports package 20260927

on:
  push:
    paths:
      - '.github/workflows/huayu-auto-600741-reports-package-20260927.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Materialize downloader
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''''''
          Path('scripts/build_huayu_auto_600741_reports_20260927.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Download validate and package reports
        run: python scripts/build_huayu_auto_600741_reports_20260927.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: huayu-auto-600741-reports-2020-2026
          path: 华域汽车_600741_2020-2025年报_2026最新定期报告.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
