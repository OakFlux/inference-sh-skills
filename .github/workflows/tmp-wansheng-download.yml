name: Temporary Wansheng report downloader

on:
  push:
    branches:
      - tmp/download-wansheng-reports-20260830

permissions:
  contents: read

jobs:
  download-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf zip

      - name: Download, verify and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import subprocess
          import time
          import urllib.parse
          import zipfile
          from pathlib import Path

          import requests

          STOCK = "603010"
          PACKAGE = Path("万盛股份_2020-2025年报及最新季报")
          PACKAGE.mkdir(parents=True, exist_ok=True)
          PREVIEWS = Path("previews")
          PREVIEWS.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36",
              "Accept": "application/pdf,application/octet-stream;q=0.9,application/json;q=0.8,*/*;q=0.7",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
          })

          def sse_candidates(report_type: str, begin_date: str, end_date: str) -> list[str]:
              params = {
                  "isPagination": "false",
                  "productId": STOCK,
                  "keyWord": "",
                  "securityType": "0101",
                  "reportType2": "DQBG",
                  "reportType": report_type,
                  "beginDate": begin_date,
                  "endDate": end_date,
              }
              response = session.get(
                  "https://query.sse.com.cn/security/stock/queryCompanyBulletin.do",
                  params=params,
                  headers={
                      "Referer": "https://www.sse.com.cn/disclosure/listedinfo/announcement/",
                      "Accept": "application/json,text/javascript,*/*;q=0.8",
                  },
                  timeout=90,
              )
              response.raise_for_status()
              data = response.json()
              items = data.get("result") or []
              print(f"SSE query {report_type} {begin_date}~{end_date}: {len(items)} results")
              candidates: list[str] = []
              for item in items:
                  title = " ".join(
                      str(item.get(key, ""))
                      for key in ("TITLE", "BULLETIN_TITLE", "BULLETIN_TYPE", "BULLETIN_YEAR")
                  )
                  url_path = str(item.get("URL", ""))
                  print(f"SSE item: {title} | {url_path}")
                  if not url_path:
                      continue
                  if "摘要" in title or "英文" in title:
                      continue
                  candidates.append(urllib.parse.urljoin("https://static.sse.com.cn", url_path))
              if not candidates:
                  # If metadata field names changed, still try all URLs and validate content below.
                  for item in items:
                      url_path = str(item.get("URL", ""))
                      if url_path:
                          candidates.append(urllib.parse.urljoin("https://static.sse.com.cn", url_path))
              return candidates

          report_candidates: dict[int, list[str]] = {
              2020: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-3/2021-03-23/6964909.PDF"],
              2021: sse_candidates("YEARLY", "2022-04-29", "2022-05-01"),
              2022: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-28/8914181.PDF"],
              2023: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-3/2024-03-26/9894661.PDF"],
              2024: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-3/2025-03-25/10802825.PDF"],
              2025: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-3/2026-03-24/12011254.PDF"],
          }
          latest_candidates = sse_candidates("QUATER2", "2026-08-23", "2026-08-26")

          if not report_candidates[2021]:
              raise RuntimeError("SSE returned no 2021 annual-report candidates")
          if not latest_candidates:
              raise RuntimeError("SSE returned no 2026 half-year-report candidates")

          def page_count(path: Path) -> int:
              proc = subprocess.run(["pdfinfo", str(path)], check=True, text=True, capture_output=True)
              match = re.search(r"^Pages:\s+(\d+)", proc.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f"No page count for {path}")
              return int(match.group(1))

          def content_matches(path: Path, year: int, report_type: str, min_pages: int) -> tuple[bool, int, str]:
              try:
                  pages = page_count(path)
              except Exception as exc:
                  return False, 0, f"pdfinfo failed: {exc}"
              if pages < min_pages:
                  return False, pages, f"only {pages} pages"
              proc = subprocess.run(
                  ["pdftotext", "-f", "1", "-l", str(min(35, pages)), str(path), "-"],
                  text=True,
                  capture_output=True,
                  errors="ignore",
              )
              compact = re.sub(r"\s+", "", proc.stdout)
              if "万盛股份" not in compact and "浙江万盛股份有限公司" not in compact:
                  return False, pages, "company name not found"
              if f"{year}年" not in compact:
                  return False, pages, "report year not found"
              expected = "年度报告" if report_type == "annual" else "半年度报告"
              if expected not in compact:
                  return False, pages, f"{expected} not found"
              return True, pages, "ok"

          def download_validated(
              candidates: list[str],
              destination: Path,
              year: int,
              report_type: str,
              min_pages: int,
          ) -> tuple[str, int, int, str]:
              last_reason = "no candidate tried"
              for url in candidates:
                  for attempt in range(1, 4):
                      tmp = destination.with_suffix(".pdf.part")
                      tmp.unlink(missing_ok=True)
                      try:
                          print(f"Trying {destination.name}: {url}")
                          with session.get(
                              url,
                              headers={"Referer": "https://www.sse.com.cn/disclosure/listedinfo/announcement/"},
                              stream=True,
                              timeout=(30, 900),
                              allow_redirects=True,
                          ) as response:
                              response.raise_for_status()
                              with tmp.open("wb") as handle:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          if tmp.stat().st_size < 20_000 or tmp.read_bytes()[:4] != b"%PDF":
                              raise RuntimeError("response is not a valid PDF")
                          matched, pages, reason = content_matches(tmp, year, report_type, min_pages)
                          if not matched:
                              last_reason = reason
                              print(f"Rejected {url}: {reason}")
                              tmp.unlink(missing_ok=True)
                              break
                          qpdf = subprocess.run(["qpdf", "--check", str(tmp)], text=True, capture_output=True)
                          if qpdf.returncode not in (0, 3):
                              raise RuntimeError(f"qpdf failed: {qpdf.stdout} {qpdf.stderr}")
                          tmp.replace(destination)
                          data = destination.read_bytes()
                          digest = hashlib.sha256(data).hexdigest()
                          stem = destination.stem
                          subprocess.run(
                              ["pdftoppm", "-f", "1", "-singlefile", "-png", "-r", "80", str(destination), str(PREVIEWS / f"{stem}_first")],
                              check=True,
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                          )
                          subprocess.run(
                              ["pdftoppm", "-f", str(pages), "-singlefile", "-png", "-r", "80", str(destination), str(PREVIEWS / f"{stem}_last")],
                              check=True,
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                          )
                          return url, pages, len(data), digest
                      except Exception as exc:
                          last_reason = str(exc)
                          print(f"Attempt {attempt} failed for {url}: {exc}")
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f"All candidates failed for {destination.name}: {last_reason}")

          rows: list[tuple[str, int, int, str, str]] = []
          for year in range(2020, 2026):
              destination = PACKAGE / f"万盛股份_{year}年年度报告.pdf"
              source, pages, size, digest = download_validated(
                  report_candidates[year], destination, year, "annual", 120
              )
              rows.append((destination.name, pages, size, digest, source))
              print(f"Verified {destination.name}: {pages} pages")

          latest_destination = PACKAGE / "万盛股份_2026年半年度报告.pdf"
          source, pages, size, digest = download_validated(
              latest_candidates, latest_destination, 2026, "half", 60
          )
          rows.append((latest_destination.name, pages, size, digest, source))
          print(f"Verified {latest_destination.name}: {pages} pages")

          notes = [
              "万盛股份（603010.SH）定期报告包，共7份完整PDF。",
              "",
              "收录：2020—2025年年度报告，以及截至2026年8月30日最新的2026年半年度报告。",
              "所有年度报告均为全文版，不以摘要替代。",
              "",
          ]
          for name, pages, size, digest, source in rows:
              notes.append(f"{name} | {pages}页 | {size}字节 | SHA256 {digest}")
              notes.append(f"来源：{source}")
          notes.extend([
              "",
              "核验：PDF文件头、公司名称、报告年度和类型、最低页数、qpdf结构、首页与末页渲染、ZIP CRC。",
          ])
          (PACKAGE / "报告清单与核验说明.txt").write_text("\n".join(notes), encoding="utf-8")
          (PACKAGE / "SHA256SUMS.txt").write_text(
              "\n".join(f"{digest}  {name}" for name, _, _, digest, _ in rows) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("万盛股份_2020-2025年报及最新季报.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(PACKAGE.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != 7:
                  raise RuntimeError(f"Expected 7 PDFs, found {len(pdfs)}")
          print(f"Created {zip_path}: {zip_path.stat().st_size} bytes")
          PY

          unzip -t '万盛股份_2020-2025年报及最新季报.zip'
          ls -lh '万盛股份_2020-2025年报及最新季报.zip' '万盛股份_2020-2025年报及最新季报'

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wansheng-final-package
          path: 万盛股份_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
