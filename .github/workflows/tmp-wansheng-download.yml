name: Temporary Wansheng report downloader

on:
  push:
    branches:
      - tmp/download-wansheng-reports-20260830

permissions:
  contents: read

jobs:
  download-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf zip

      - name: Download, verify and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import re
          import subprocess
          import time
          import urllib.parse
          import zipfile
          from pathlib import Path

          import requests

          STOCK = "603010"
          PACKAGE = Path("万盛股份_2020-2025年报及最新季报")
          PACKAGE.mkdir(parents=True, exist_ok=True)
          PREVIEWS = Path("previews")
          PREVIEWS.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36",
              "Accept": "application/pdf,application/octet-stream;q=0.9,text/html;q=0.8,*/*;q=0.7",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
          })

          annual_urls = {
              2020: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-3/2021-03-23/6964909.PDF"],
              2021: [
                  "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-30/8162485.PDF",
                  "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-30/8162485.PDF",
              ],
              2022: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-28/8914181.PDF"],
              2023: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-3/2024-03-26/9894661.PDF"],
              2024: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-3/2025-03-25/10802825.PDF"],
              2025: ["http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-3/2026-03-24/12011254.PDF"],
          }

          def decode_html(raw: bytes) -> str:
              for enc in ("utf-8", "gb18030", "gbk"):
                  try:
                      text = raw.decode(enc)
                  except UnicodeDecodeError:
                      continue
                  if "万盛股份" in text or "半年度报告" in text:
                      return text
              return raw.decode("utf-8", errors="replace")

          def discover_latest_candidates() -> list[str]:
              list_url = f"https://money.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{STOCK}.phtml?ftype=zqbg"
              resp = session.get(list_url, headers={"Referer": "https://money.finance.sina.com.cn/"}, timeout=90)
              resp.raise_for_status()
              page = decode_html(resp.content)
              pattern = re.compile(
                  r'<a[^>]+href=["\']([^"\']*vCB_AllBulletinDetail\.php[^"\']+)["\'][^>]*>(.*?)</a>',
                  flags=re.I | re.S,
              )
              target_href = None
              target_title = None
              for href, title_html in pattern.findall(page):
                  title = html.unescape(re.sub(r"<[^>]+>", "", title_html, flags=re.S))
                  compact = re.sub(r"\s+", "", title)
                  if "2026年半年度报告" in compact and "摘要" not in compact:
                      target_href = html.unescape(href)
                      target_title = compact
                      break
              if not target_href:
                  raise RuntimeError("Sina list did not expose the 2026 half-year report")
              match = re.search(r"(?:\?|&)id=(\d+)", target_href)
              if not match:
                  raise RuntimeError(f"Cannot extract announcement id from {target_href}")
              announcement_id = match.group(1)
              print(f"Latest report listing: {target_title}; id={announcement_id}")
              candidates = []
              for date in ("2026-08-24", "2026-08-25"):
                  candidates.append(
                      f"http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/{date}/{announcement_id}.PDF"
                  )
                  candidates.append(
                      f"https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-8/{date}/{announcement_id}.PDF"
                  )
              return candidates

          def page_count(path: Path) -> int:
              proc = subprocess.run(["pdfinfo", str(path)], check=True, text=True, capture_output=True)
              match = re.search(r"^Pages:\s+(\d+)", proc.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f"No page count for {path}")
              return int(match.group(1))

          def download_one(candidates: list[str], destination: Path) -> str:
              last_error: Exception | None = None
              for url in candidates:
                  for attempt in range(1, 4):
                      tmp = destination.with_suffix(".pdf.part")
                      tmp.unlink(missing_ok=True)
                      try:
                          print(f"Trying {destination.name}: {url}")
                          with session.get(
                              url,
                              headers={"Referer": "https://money.finance.sina.com.cn/"},
                              stream=True,
                              timeout=(30, 600),
                              allow_redirects=True,
                          ) as resp:
                              resp.raise_for_status()
                              with tmp.open("wb") as handle:
                                  for chunk in resp.iter_content(1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          if tmp.stat().st_size < 20_000 or tmp.read_bytes()[:4] != b"%PDF":
                              raise RuntimeError("Response is not a valid PDF")
                          tmp.replace(destination)
                          return url
                      except Exception as exc:
                          last_error = exc
                          print(f"Attempt {attempt} failed: {exc}")
                          time.sleep(attempt * 2)
              raise RuntimeError(f"All sources failed for {destination}: {last_error}")

          def validate(path: Path, year: int, report_type: str, min_pages: int) -> tuple[int, int, str]:
              qpdf = subprocess.run(["qpdf", "--check", str(path)], text=True, capture_output=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f"qpdf failed for {path}: {qpdf.stdout}\n{qpdf.stderr}")
              pages = page_count(path)
              if pages < min_pages:
                  raise RuntimeError(f"Unexpectedly short report {path}: {pages} pages")
              text_proc = subprocess.run(
                  ["pdftotext", "-f", "1", "-l", str(min(30, pages)), str(path), "-"],
                  text=True,
                  capture_output=True,
                  errors="ignore",
              )
              compact = re.sub(r"\s+", "", text_proc.stdout)
              if "万盛股份" not in compact and "浙江万盛股份有限公司" not in compact:
                  raise RuntimeError(f"Company validation failed for {path}")
              if f"{year}年" not in compact:
                  raise RuntimeError(f"Year validation failed for {path}")
              expected = "年度报告" if report_type == "annual" else "半年度报告"
              if expected not in compact:
                  raise RuntimeError(f"Report-type validation failed for {path}")
              stem = path.stem
              subprocess.run(
                  ["pdftoppm", "-f", "1", "-singlefile", "-png", "-r", "80", str(path), str(PREVIEWS / f"{stem}_first")],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              subprocess.run(
                  ["pdftoppm", "-f", str(pages), "-singlefile", "-png", "-r", "80", str(path), str(PREVIEWS / f"{stem}_last")],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              data = path.read_bytes()
              return pages, len(data), hashlib.sha256(data).hexdigest()

          rows: list[tuple[str, int, int, str, str]] = []
          for year in range(2020, 2026):
              destination = PACKAGE / f"万盛股份_{year}年年度报告.pdf"
              source = download_one(annual_urls[year], destination)
              pages, size, digest = validate(destination, year, "annual", 120)
              rows.append((destination.name, pages, size, digest, source))
              print(f"Verified {destination.name}: {pages} pages")

          latest_destination = PACKAGE / "万盛股份_2026年半年度报告.pdf"
          latest_source = download_one(discover_latest_candidates(), latest_destination)
          pages, size, digest = validate(latest_destination, 2026, "half", 60)
          rows.append((latest_destination.name, pages, size, digest, latest_source))
          print(f"Verified {latest_destination.name}: {pages} pages")

          notes = [
              "万盛股份（603010.SH）定期报告包，共7份完整PDF。",
              "",
              "收录：2020—2025年年度报告，以及截至2026年8月30日最新的2026年半年度报告。",
              "所有年度报告均为全文版，不以摘要替代。",
              "",
          ]
          for name, pages, size, digest, source in rows:
              notes.append(f"{name} | {pages}页 | {size}字节 | SHA256 {digest}")
              notes.append(f"来源：{source}")
          notes.extend([
              "",
              "核验：PDF文件头、公司名称、报告年度和类型、最低页数、qpdf结构、首页与末页渲染、ZIP CRC。",
          ])
          (PACKAGE / "报告清单与核验说明.txt").write_text("\n".join(notes), encoding="utf-8")
          (PACKAGE / "SHA256SUMS.txt").write_text(
              "\n".join(f"{digest}  {name}" for name, _, _, digest, _ in rows) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("万盛股份_2020-2025年报及最新季报.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(PACKAGE.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != 7:
                  raise RuntimeError(f"Expected 7 PDFs, found {len(pdfs)}")
          print(f"Created {zip_path}: {zip_path.stat().st_size} bytes")
          PY

          unzip -t '万盛股份_2020-2025年报及最新季报.zip'
          ls -lh '万盛股份_2020-2025年报及最新季报.zip' '万盛股份_2020-2025年报及最新季报'

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wansheng-final-package
          path: 万盛股份_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
