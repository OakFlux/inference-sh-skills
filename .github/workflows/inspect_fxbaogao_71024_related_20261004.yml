name: Inspect FxBaogao Ren Zixing related
on:
  push:
    paths:
      - '.github/workflows/inspect_fxbaogao_71024_related_20261004.yml'
      - 'tools/inspect_fxbaogao_71024_related_20261004.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/inspect_fxbaogao_71024_related_20261004.py
      - uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-71024-related
          path: fxbaogao_71024_related.json
          if-no-files-found: error
          retention-days: 3
