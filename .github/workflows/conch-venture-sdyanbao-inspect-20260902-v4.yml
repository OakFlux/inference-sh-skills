name: Inspect SDYanbao for China Conch Venture public PDFs

on:
  push:
    paths:
      - '.github/workflows/conch-venture-sdyanbao-inspect-20260902-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect public report pages and downloadable files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin, quote, unquote
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          headers = {
              'User-Agent': ua,
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          }
          urls = [
              'https://www.sdyanbao.com/detail/894638',
              'https://www.sdyanbao.com/search?keyword=%E6%B5%B7%E8%9E%BA%E5%88%9B%E4%B8%9A',
              'https://www.sdyanbao.com/search?q=%E6%B5%B7%E8%9E%BA%E5%88%9B%E4%B8%9A',
              'https://www.sdyanbao.com/?s=%E6%B5%B7%E8%9E%BA%E5%88%9B%E4%B8%9A',
          ]
          for url in urls:
              try:
                  r = s.get(url, headers=headers, timeout=(20,120), allow_redirects=True)
                  print('\n=== PAGE', url, 'STATUS', r.status_code, 'TYPE', r.headers.get('content-type'), 'LEN', len(r.content), 'FINAL', r.url, '===', flush=True)
                  print('HEADERS', json.dumps(dict(r.headers), ensure_ascii=False), flush=True)
                  print(r.text[:120000], flush=True)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
                  print('VISIBLE', soup.get_text(' ', strip=True)[:30000], flush=True)
                  resources=[]
                  for tag in soup.find_all(['a','iframe','embed','object','script','source','img']):
                      for attr in ('href','src','data'):
                          val=tag.get(attr)
                          if not val: continue
                          full=urljoin(r.url,val)
                          label=' '.join(tag.get_text(' ',strip=True).split())
                          hay=unquote((label+' '+full).lower())
                          if any(k in hay for k in ('pdf','download','file','report','894638','海螺创业','00586')):
                              resources.append({'tag':tag.name,'attr':attr,'label':label[:300],'url':full})
                  print('RESOURCES', json.dumps(resources, ensure_ascii=False, indent=2), flush=True)
                  for full in sorted(set(re.findall(r'https?://[^"\'<>\s\\]+', r.text))):
                      if any(k in unquote(full.lower()) for k in ('pdf','download','file','report','894638')):
                          print('URLMATCH', full[:3000], flush=True)
                  for pat in [r'/[^"\'<>\s]{0,200}(?:download|pdf|file)[^"\'<>\s]{0,500}', r'api[^"\'<>\s]{0,1000}']:
                      for m in re.finditer(pat, r.text, re.I):
                          print('PATTERN', pat, repr(m.group(0)[:2000]), flush=True)
              except Exception as exc:
                  print('ERROR', url, repr(exc), flush=True)

          queries = [
              'site:sdyanbao.com/detail 海螺创业',
              'site:sdyanbao.com/detail "资金&效率双强"',
              'site:sdyanbao.com/detail "联营公司业绩见底"',
              'site:sdyanbao.com/detail "后手致胜，扬帆掘金新能源"',
              'site:sdyanbao.com/detail "利润及现金流迎来拐点"',
          ]
          for q in queries:
              url='https://www.bing.com/search?q='+quote(q)
              try:
                  r=s.get(url,headers=headers,timeout=(20,120))
                  print('\n=== BING',q,r.status_code,len(r.content),'===',flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  for li in soup.select('li.b_algo'):
                      a=li.select_one('h2 a')
                      if not a: continue
                      print('RESULT',a.get_text(' ',strip=True),a.get('href'),flush=True)
              except Exception as exc:
                  print('BING_ERROR',q,repr(exc),flush=True)
          PY
