name: Package verified Shenzhen International broker reports

on:
  push:
    branches:
      - tmp/shenzhen-international-broker-reports-20260831

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet requests pypdf pymupdf

      - name: Download, verify, and package reports
        run: python .github/scripts/package_shenzhen_international_broker_reports.py

      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shenzhen-international-broker-reports
          path: 深圳国际_券商深度报告_*份_完整PDF.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
