name: Inspect Sina HK public reports for Sany International

on:
  push:
    paths:
      - '.github/workflows/sina-hk-sany-report-inspect-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Fetch rating page and linked reports
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('sina_hk_sany'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Referer':'https://vip.stock.finance.sina.com.cn/hk/',
          }
          urls=[
            'https://vip.stock.finance.sina.com.cn/hk/view/rating.php?symbol=00631',
            'http://vip.stock.finance.sina.com.cn/hk/view/rating.php?symbol=00631',
          ]
          page=None
          for u in urls:
            try:
              r=s.get(u,headers=headers,timeout=(30,180),allow_redirects=True)
              print('RATING',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              if r.status_code==200 and len(r.content)>1000:
                page=r; break
            except Exception as e: print('RATING_ERR',u,repr(e))
          if page is None: raise RuntimeError('rating page unavailable')
          page.encoding=page.apparent_encoding or 'gbk'
          text=page.text
          (out/'rating.html').write_text(text,encoding='utf-8')
          soup=BeautifulSoup(text,'lxml')
          links=[]
          for a in soup.find_all('a',href=True):
            href=urljoin(page.url,html.unescape(a['href']))
            label=' '.join(a.get_text(' ',strip=True).split())
            if label=='查看' or any(k in href.lower() for k in ('report','rating','detail','show')):
              links.append({'label':label,'href':href})
          print('LINKS',json.dumps(links,ensure_ascii=False,indent=2))
          details=[]
          seen=set()
          for idx,item in enumerate(links,1):
            u=item['href']
            if u in seen: continue
            seen.add(u)
            try:
              r=s.get(u,headers={**headers,'Referer':page.url},timeout=(30,180),allow_redirects=True)
              print('DETAIL',idx,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              r.encoding=r.apparent_encoding or 'gbk'
              body=r.text
              (out/f'detail_{idx:03d}.html').write_text(body,encoding='utf-8')
              bs=BeautifulSoup(body,'lxml')
              title=' '.join((bs.title.get_text(' ',strip=True) if bs.title else '').split())
              plain='\n'.join(x.strip() for x in bs.get_text('\n').splitlines() if x.strip())
              (out/f'detail_{idx:03d}.txt').write_text(plain,encoding='utf-8')
              pdfs=[]
              for tag in bs.find_all(True):
                for attr in ('href','src','data-src','data-url','content'):
                  v=tag.get(attr)
                  if isinstance(v,str) and ('.pdf' in v.lower() or 'download' in v.lower()):
                    pdfs.append(urljoin(r.url,html.unescape(v)))
              details.append({'index':idx,'source_link':item,'url':r.url,'status':r.status_code,'length':len(r.content),'title':title,'text_len':len(plain),'pdfs':pdfs})
              print('DETAIL_META',json.dumps(details[-1],ensure_ascii=False,indent=2))
            except Exception as e:
              print('DETAIL_ERR',idx,u,repr(e))
          (out/'manifest.json').write_text(json.dumps({'rating_url':page.url,'links':links,'details':details},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: sina-hk-sany-report-inspection
          path: sina_hk_sany/
          if-no-files-found: error
          retention-days: 7
