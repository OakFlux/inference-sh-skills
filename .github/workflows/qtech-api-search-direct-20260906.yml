name: Inspect direct Q Technology report search API 20260906

on:
  push:
    paths:
      - '.github/workflows/qtech-api-search-direct-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://api.sdyanbao.com/api/file/search'
          allrows={}
          for keyword in ('丘钛科技','丘鈦科技'):
            for page in range(1,6):
              body={"device":1,"hideTrader":0,"onlyTitle":1,"order":0,"page":page,"pageSize":100,"keyword":keyword,"pageCount":"","dateRange":"","startTime":"","endTime":"","typeIds":[],"industryIds":[],"opFrom":1}
              data=json.dumps(body,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as r:
                payload=json.loads(r.read().decode('utf-8'))
              rows=(payload.get('data') or {}).get('files') or []
              print('PAGE',keyword,page,'COUNT',len(rows),'TOTAL',(payload.get('data') or {}).get('total'),flush=True)
              for x in rows:
                allrows[str(x.get('id'))]=x
              if not rows or page*100 >= int((payload.get('data') or {}).get('total') or 0): break
          compact=[]
          for x in allrows.values():
            compact.append({
              'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'pages':x.get('page_count'),
              'page_url':x.get('page_url'),'share_url':x.get('share_url'),'data_source':x.get('data_source'),
              'uuid':x.get('data_source_uuid'),'type':(x.get('type') or {}).get('name'),
              'org':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),
              'stock':x.get('stock')
            })
          compact.sort(key=lambda z:(z.get('date') or '',z.get('pages') or 0),reverse=True)
          print('RESULTS',json.dumps(compact,ensure_ascii=False,indent=2),flush=True)
          PY
