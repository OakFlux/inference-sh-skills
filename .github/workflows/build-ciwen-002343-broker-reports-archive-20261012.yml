name: Build Ciwen Media broker reports archive 20261012
on:
  push:
    paths:
      - '.github/workflows/build-ciwen-002343-broker-reports-archive-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from pypdf import PdfReader

          checked_as_of = '2026-10-12'
          package_name = '慈文传媒_002343_券商深度报告_3份'
          package_dir = Path(package_name)
          reports_dir = package_dir / '01_券商深度报告'
          verify_dir = Path('_verify_ciwen_reports')
          reports_dir.mkdir(parents=True, exist_ok=True)
          verify_dir.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/pdf,text/html,application/xhtml+xml,*/*;q=0.8',
          }

          api_url = 'https://reportapi.eastmoney.com/report/list'
          params = {
              'pageSize': '100', 'pageNo': '1', 'code': '002343', 'qType': '0',
              'industryCode': '*', 'industry': '*', 'rating': '*', 'ratingChange': '*',
              'beginTime': '2010-01-01', 'endTime': checked_as_of,
              'orgCode': '', 'rcode': '', 'fields': ''
          }
          r = session.get(api_url, params=params, headers={**headers, 'Referer': 'https://data.eastmoney.com/report/stock.jshtml'}, timeout=90)
          print('API', r.status_code, r.headers.get('content-type'), len(r.content), r.url, flush=True)
          r.raise_for_status()
          payload = r.json()
          rows = payload.get('data') or []
          if not rows:
              raise RuntimeError('Eastmoney report API returned no records')

          # Priority: one current first-coverage report plus two substantial historical deep/first-coverage reports.
          specs = [
              {
                  'key': '发布重要战略纲要',
                  'preferred_org': '民生证券',
                  'filename': '20240731_民生证券_首次覆盖_发布重要战略纲要先锋转型未来可期.pdf',
                  'classification': '首次覆盖报告',
              },
              {
                  'key': '长视频内容领军者',
                  'preferred_org': '民生证券',
                  'filename': '20180523_民生证券_深度报告_长视频内容领军者充分享受付费市场红利.pdf',
                  'classification': '公司深度报告',
              },
              {
                  'key': '头部剧龙头公司',
                  'preferred_org': '平安证券',
                  'filename': '20180327_平安证券_首次覆盖_头部剧龙头公司引领行业变革.pdf',
                  'classification': '公司首次覆盖报告',
              },
          ]
          fallbacks = [
              {'key': '业内顶级剧王', 'preferred_org': '国金证券', 'filename': '20170914_国金证券_深度研究_业内顶级剧王.pdf', 'classification': '公司深度研究'},
              {'key': '破茧化蝶', 'preferred_org': '西南证券', 'filename': '20170106_西南证券_深度报告_破茧化蝶老牌影视蜕变网生龙头.pdf', 'classification': '公司深度报告'},
              {'key': '领航内容制作精品化新时代', 'preferred_org': '中国国际金融', 'filename': '20161209_中金公司_首次覆盖_领航内容制作精品化新时代.pdf', 'classification': '首次覆盖报告'},
          ]

          def locate(spec):
              matches = [x for x in rows if spec['key'] in (x.get('title') or '')]
              if spec.get('preferred_org'):
                  preferred = [x for x in matches if spec['preferred_org'] in ((x.get('orgSName') or '') + (x.get('orgName') or ''))]
                  if preferred:
                      matches = preferred
              return matches[0] if matches else None

          selected = []
          used_info = set()
          for spec in specs:
              row = locate(spec)
              if row and row.get('infoCode') not in used_info:
                  selected.append((spec, row)); used_info.add(row.get('infoCode'))
              else:
                  print('PRIMARY_NOT_FOUND', spec, flush=True)

          for spec in fallbacks:
              if len(selected) >= 3:
                  break
              row = locate(spec)
              if row and row.get('infoCode') not in used_info:
                  selected.append((spec, row)); used_info.add(row.get('infoCode'))

          if len(selected) < 3:
              print('AVAILABLE_TITLES', json.dumps([{'title':x.get('title'),'org':x.get('orgSName'),'infoCode':x.get('infoCode'),'pages':x.get('attachPages')} for x in rows], ensure_ascii=False, indent=2), flush=True)
              raise RuntimeError(f'Only {len(selected)} target reports found; expected 3')

          def get_with_retries(url, referer, require_pdf=False):
              last = None
              for attempt in range(1, 5):
                  try:
                      rr = session.get(url, headers={**headers, 'Referer': referer}, timeout=180, allow_redirects=True)
                      print('HTTP', attempt, rr.status_code, rr.headers.get('content-type'), len(rr.content), rr.url, flush=True)
                      last = rr
                      if rr.status_code == 200 and (not require_pdf or rr.content.startswith(b'%PDF')):
                          return rr
                  except Exception as exc:
                      print('REQUEST_ERROR', attempt, url, repr(exc), flush=True)
                      last = exc
                  time.sleep(attempt * 2)
              if isinstance(last, Exception):
                  raise last
              return last

          def download_report(row, out_path):
              info = row['infoCode']
              detail = f'https://data.eastmoney.com/report/info/{info}.html'
              candidates = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time()*1000)}',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.PDF',
              ]
              errors = []
              for url in candidates:
                  try:
                      rr = get_with_retries(url, detail, require_pdf=True)
                      if rr.status_code == 200 and rr.content.startswith(b'%PDF') and len(rr.content) > 100_000:
                          out_path.write_bytes(rr.content)
                          return url, rr.url, detail
                      errors.append(f'{url}: status={getattr(rr,"status_code",None)} bytes={len(getattr(rr,"content",b""))}')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              raise RuntimeError('PDF download failed for ' + info + ': ' + ' | '.join(errors))

          output = []
          hashes = set()
          for idx, (spec, row) in enumerate(selected, 1):
              path = reports_dir / spec['filename']
              source_url, final_url, detail_url = download_report(row, path)
              raw = path.read_bytes()
              sha = hashlib.sha256(raw).hexdigest()
              if sha in hashes:
                  raise RuntimeError(f'Duplicate PDF detected: {path}')
              hashes.add(sha)

              qpdf = subprocess.run(['qpdf', '--check', str(path)], text=True, capture_output=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {path}: {qpdf.stdout}\n{qpdf.stderr}')

              reader = PdfReader(str(path))
              pages = len(reader.pages)
              expected_pages = int(row.get('attachPages') or 0)
              if pages < 10:
                  raise RuntimeError(f'Report unexpectedly short: {path}, pages={pages}')
              if expected_pages and pages != expected_pages:
                  raise RuntimeError(f'Page mismatch for {path}: got {pages}, API={expected_pages}')

              txt_path = verify_dir / f'{idx:02d}.txt'
              subprocess.run(['pdftotext', str(path), str(txt_path)], check=True)
              text = txt_path.read_text(encoding='utf-8', errors='ignore')
              normalized = re.sub(r'\s+', '', text)
              if not ('慈文传媒' in normalized or '002343' in normalized):
                  raise RuntimeError(f'Company identity check failed: {path}')
              org_short = row.get('orgSName') or ''
              org_full = row.get('orgName') or ''
              if org_short and org_short not in text and org_full not in text:
                  # Broker name can be rendered as a logo; log rather than reject when all other metadata matches.
                  print('BROKER_TEXT_NOT_EXTRACTED', path, org_short, flush=True)

              render_pages = sorted(set([1, max(1, (pages + 1)//2), pages]))
              render_files = []
              for pno in render_pages:
                  base = verify_dir / f'{idx:02d}_p{pno}'
                  cp = subprocess.run([
                      'pdftoppm', '-f', str(pno), '-l', str(pno), '-singlefile', '-png', '-r', '105',
                      str(path), str(base)
                  ], text=True, capture_output=True)
                  if cp.returncode != 0:
                      raise RuntimeError(f'Render failed {path} page {pno}: {cp.stderr}')
                  img = Path(str(base) + '.png')
                  if not img.exists() or img.stat().st_size < 10_000:
                      raise RuntimeError(f'Render output invalid: {img}')
                  render_files.append(str(img))

              rec = {
                  'date': (row.get('publishDate') or '')[:10],
                  'broker': row.get('orgSName') or row.get('orgName'),
                  'broker_full_name': row.get('orgName'),
                  'researchers': row.get('researcher'),
                  'title': row.get('title'),
                  'classification': spec['classification'],
                  'rating': row.get('emRatingName') or row.get('sRatingName') or '',
                  'infoCode': row.get('infoCode'),
                  'relative_path': str(path.relative_to(package_dir)),
                  'pages': pages,
                  'bytes': path.stat().st_size,
                  'sha256': sha,
                  'source_url': source_url,
                  'download_final_url': final_url,
                  'detail_url': detail_url,
                  'qpdf_return_code': qpdf.returncode,
                  'rendered_pages': render_pages,
                  'render_files': render_files,
                  'company_identity_verified': True,
              }
              output.append(rec)
              print('VALIDATED', json.dumps(rec, ensure_ascii=False), flush=True)

          readme = f'''慈文传媒（002343）券商深度报告资料包

核对日期：{checked_as_of}
收录数量：{len(output)}份

筛选口径
- 仅收录明确标注为首次覆盖、公司深度或公司首次覆盖的系统性研究报告。
- 未使用季报点评、年报点评、事件点评、新闻稿或网页摘要凑数。
- PDF来自东方财富研报附件镜像，保留券商原始排版。

文件概览
'''
          for i, x in enumerate(output, 1):
              readme += f"{i}. {x['date']}｜{x['broker']}｜{x['title']}｜{x['pages']}页｜{x['researchers']}\n"
          readme += '''
校验说明
- 每份PDF均检查PDF文件头、qpdf结构、实际页数、慈文传媒或股票代码身份。
- 每份PDF均渲染首页、中间页和末页，验证可正常显示。
- SHA-256见 SHA256SUMS.txt；完整来源与元数据见 文件清单.csv 和 manifest.json。
'''
          (package_dir/'README.txt').write_text(readme, encoding='utf-8')

          fields = ['date','broker','broker_full_name','researchers','title','classification','rating','infoCode','relative_path','pages','bytes','sha256','detail_url','source_url','download_final_url']
          with (package_dir/'文件清单.csv').open('w', encoding='utf-8-sig', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              for x in output:
                  w.writerow({k:x.get(k,'') for k in fields})

          with (package_dir/'SHA256SUMS.txt').open('w', encoding='utf-8') as f:
              for x in output:
                  f.write(f"{x['sha256']}  {x['relative_path']}\n")

          manifest = {
              'package_name': package_name,
              'company': '慈文传媒股份有限公司',
              'stock_code': '002343',
              'checked_as_of': checked_as_of,
              'document_count': len(output),
              'selection_policy': '首次覆盖/公司深度报告；排除短篇财报点评和网页摘要',
              'records': output,
          }
          (package_dir/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = Path(package_name + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for item in sorted(package_dir.rglob('*')):
                  if item.is_file():
                      zf.write(item, arcname=str(item))
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failed at {bad}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, 'bytes', zip_path.stat().st_size, 'sha256', zip_sha, flush=True)
          PY
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ciwen-002343-broker-reports-20261012
          path: 慈文传媒_002343_券商深度报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
