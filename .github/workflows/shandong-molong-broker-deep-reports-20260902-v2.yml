name: Package Shandong Molong broker deep reports v2

on:
  push:
    paths:
      - '.github/workflows/shandong-molong-broker-deep-reports-20260902-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf
          python -m pip install --quiet pypdf requests

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          import urllib3
          from pypdf import PdfReader

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          company = '山东墨龙'
          code = '002490'
          package = '山东墨龙_券商深度报告_3份_公开完整版'
          out = Path(package)
          out.mkdir(exist_ok=True)
          preview = Path('_preview')
          preview.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '中国中投证券',
                  'date': '2012-04-24',
                  'title': '专业石油钻采设备企业，产能进入释放期',
                  'pages': 9,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201204270005135326_1.pdf?1373303316000.pdf=',
              },
              {
                  'broker': '湘财证券',
                  'date': '2011-03-11',
                  'title': '行业景气复苏+产能稳步释放，估值业绩双提升',
                  'pages': 16,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AS201202260003937256_1.pdf?1601212946000.pdf=',
              },
              {
                  'broker': '日信证券',
                  'date': '2010-12-16',
                  'title': '拂去浮尘现真金，给予公司买入评级',
                  'pages': 18,
                  'url': 'https://www.p5w.net/stock/lzft/gsyj/201012/P020101223611424510121.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          def safe(text):
              return re.sub(r'[\\/:*?"<>|\s]+', '_', text).strip('_')[:120]

          def compact(text):
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', text or '').lower()

          records = []
          hashes = set()
          for index, report in enumerate(reports, 1):
              host = urlparse(report['url']).netloc.lower()
              headers = {
                  'User-Agent': ua,
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
                  'Referer': 'https://data.eastmoney.com/' if 'dfcfw.com' in host else 'https://www.p5w.net/',
              }
              response = session.get(
                  report['url'], headers=headers, timeout=(30, 300),
                  allow_redirects=True, verify=('p5w.net' not in host)
              )
              print('GET', index, response.status_code, len(response.content), response.url, flush=True)
              response.raise_for_status()
              if not response.content.startswith(b'%PDF-') or len(response.content) < 50000:
                  raise RuntimeError(f'Invalid PDF response for report {index}')

              filename = (
                  f"{index:02d}_{safe(report['broker'])}_{company}_"
                  f"{safe(report['title'])}_{report['date']}_{report['pages']}页.pdf"
              )
              path = out / filename
              path.write_bytes(response.content)

              reader = PdfReader(str(path), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != report['pages']:
                  raise RuntimeError(f'{filename}: expected {report["pages"]}, got {actual_pages}')

              text = compact('\n'.join((page.extract_text() or '') for page in reader.pages[:10]))
              if compact(company) not in text and code not in text:
                  raise RuntimeError(f'{filename}: company identity check failed')

              check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              # qpdf return code 3 means the file is readable but contains non-fatal warnings.
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'{filename}: qpdf failed: {check.stderr[-1500:]}')
              qpdf_status = 'clean' if check.returncode == 0 else 'readable_with_legacy_linearization_warnings'
              if check.returncode == 3:
                  print('QPDF_WARNING_ACCEPTED', filename, check.stderr[-1500:], flush=True)

              first = preview / f'{index:02d}_first'
              last = preview / f'{index:02d}_last'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '90', str(path), str(first)],
                  check=True, capture_output=True
              )
              subprocess.run(
                  ['pdftoppm', '-f', str(actual_pages), '-singlefile', '-png', '-r', '90', str(path), str(last)],
                  check=True, capture_output=True
              )
              if not Path(str(first) + '.png').exists() or not Path(str(last) + '.png').exists():
                  raise RuntimeError(f'{filename}: rendering check failed')

              digest = hashlib.sha256(response.content).hexdigest()
              if digest in hashes:
                  raise RuntimeError(f'{filename}: duplicate PDF')
              hashes.add(digest)
              record = {
                  **report,
                  'filename': filename,
                  'actual_pages': actual_pages,
                  'bytes': len(response.content),
                  'sha256': digest,
                  'qpdf_status': qpdf_status,
                  'resolved_url': response.url,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          lines = [
              '山东墨龙（002490.SZ / 00568.HK）券商深度报告包',
              '',
              '共3份公开可获取的完整原始PDF。因近年公开券商深度覆盖较少，',
              '可核验的完整深度报告主要集中在2010—2012年。',
              '',
          ]
          for index, r in enumerate(records, 1):
              lines += [
                  f"{index}. {r['broker']}：《{r['title']}》",
                  f"   日期：{r['date']}；页数：{r['actual_pages']}页；大小：{r['bytes']}字节",
                  f"   文件：{r['filename']}",
                  f"   SHA-256：{r['sha256']}",
                  f"   PDF结构状态：{r['qpdf_status']}",
                  f"   公开来源：{r['resolved_url']}",
                  '',
              ]
          lines += [
              '核验项目：PDF文件头、实际页数、公司名称/代码、PDF结构、首页与末页渲染、',
              '文件哈希、ZIP内PDF数量及CRC。第三份历史PDF带非致命线性化索引警告，',
              '但18页均可解析和渲染，原始内容未被改写。',
              '历史评级及盈利预测仅对应报告出具时点，不构成当前投资建议。',
          ]
          (out / '报告清单与核验说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(
              ''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8'
          )

          zip_path = Path(package + '.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as z:
              for path in sorted(out.iterdir()):
                  z.write(path, arcname=f'{package}/{path.name}')
          with zipfile.ZipFile(zip_path) as z:
              if z.testzip() is not None:
                  raise RuntimeError('ZIP CRC validation failed')
              if len([n for n in z.namelist() if n.lower().endswith('.pdf')]) != 3:
                  raise RuntimeError('ZIP does not contain exactly 3 PDFs')
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: shandong-molong-broker-deep-reports-final-v2
          path: |
            山东墨龙_券商深度报告_3份_公开完整版/
            山东墨龙_券商深度报告_3份_公开完整版.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
