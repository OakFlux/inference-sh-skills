name: Temporary Daan Gene 9FZT report inspector

on:
  push:
    branches:
      - tmp/download-daan-gene-reports-20260829
    paths:
      - .github/workflows/tmp-daan-gene-9fzt-inspect.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect public report pages and site APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/pages diagnostic/assets
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          urls=(
            'https://www.9fzt.com/detail/sz_002030_10_508957738559.html'
            'https://www.9fzt.com/detail/sz_002030_10_684425869377.html'
            'https://www.9fzt.com/detail/sz_002030_10_648229670402.html'
          )
          n=0
          for u in "${urls[@]}"; do
            n=$((n+1))
            curl -L --compressed --retry 5 --retry-all-errors --connect-timeout 30 --max-time 180 \
              -A "$UA" -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.8' \
              -D "diagnostic/pages/${n}.headers" "$u" -o "diagnostic/pages/${n}.html" || true
            echo "$u" > "diagnostic/pages/${n}.url"
          done

          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import html,json,re,urllib.request
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          assets=[]; hits=[]
          for p in Path('diagnostic/pages').glob('*.html'):
              t=p.read_text(errors='replace')
              base=Path(str(p).replace('.html','.url')).read_text().strip()
              for m in re.finditer(r'(?:src|href)=["\']([^"\']+)["\']',t,re.I):
                  u=urljoin(base,html.unescape(m.group(1)))
                  if ('.js' in u or '/api/' in u) and u.startswith('http'): assets.append(u)
              for pat in [r'https?://[^"\'<>\s]+',r'[^"\'<>\s]*(?:pdf|download|attachment|report|research|研报)[^"\'<>\s]*']:
                  for m in re.finditer(pat,t,re.I):
                      s=html.unescape(m.group(0))
                      if any(k in s.lower() for k in ['pdf','download','attachment','api','report']): hits.append({'file':str(p),'hit':s[:3000]})
              for needle in ['508957738559','684425869377','648229670402','__NEXT_DATA__','pdfUrl','downloadUrl','attachment','reportId','research']:
                  start=0
                  while True:
                      pos=t.find(needle,start)
                      if pos<0: break
                      hits.append({'file':str(p),'needle':needle,'context':t[max(0,pos-2500):pos+8000]})
                      start=pos+len(needle)
          assets=list(dict.fromkeys(assets))[:200]
          for i,u in enumerate(assets):
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':UA,'Referer':'https://www.9fzt.com/'})
                  raw=urllib.request.urlopen(req,timeout=90).read()
                  if len(raw)>15000000: raw=raw[:15000000]
                  Path(f'diagnostic/assets/{i:03d}.txt').write_bytes(raw)
                  Path(f'diagnostic/assets/{i:03d}.url').write_text(u)
              except Exception as e:
                  Path(f'diagnostic/assets/{i:03d}.error').write_text(repr(e))
          for p in Path('diagnostic/assets').glob('*.txt'):
              t=p.read_text(errors='replace')
              for needle in ['pdfUrl','downloadUrl','attachment','reportId','research','研报','detail/sz_','api/']:
                  start=0
                  while True:
                      pos=t.find(needle,start)
                      if pos<0:break
                      hits.append({'file':str(p),'needle':needle,'context':t[max(0,pos-1500):pos+5000]})
                      start=pos+len(needle)
                      if len(hits)>30000:break
          Path('diagnostic/assets.json').write_text(json.dumps(assets,ensure_ascii=False,indent=2))
          Path('diagnostic/hits.json').write_text(json.dumps(hits[:30000],ensure_ascii=False,indent=2))
          print('ASSETS',len(assets),'HITS',len(hits))
          print(json.dumps(hits[:500],ensure_ascii=False,indent=2)[:200000])
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: daan-gene-9fzt-diagnostic
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
