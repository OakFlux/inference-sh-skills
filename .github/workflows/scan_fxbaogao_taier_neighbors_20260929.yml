name: Scan FxBaogao Taier neighbors

on:
  push:
    paths:
      - '.github/workflows/scan_fxbaogao_taier_neighbors_20260929.yml'
      - 'tools/scan_fxbaogao_taier_neighbors_20260929.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/scan_fxbaogao_taier_neighbors_20260929.py
      - uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-taier-neighbor-matches
          path: fxbaogao_taier_neighbor_matches.json
          if-no-files-found: error
          retention-days: 3
