name: Probe sdyanbao API for TransThera prospectus

on:
  push:
    paths:
      - '.github/workflows/transthera-sdyanbao-api-probe-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect page and JS bundles
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'}
          u='https://www.sdyanbao.com/detail/894460'
          r=requests.get(u,headers=H,timeout=30)
          t=r.text
          print('PAGE',r.status_code,len(t),flush=True)
          for key in ['detail:{id:894460','894460','original_id:1203556','file_size:23613353','hash:','download']:
            pos=t.find(key)
            print('\nKEY',key,'POS',pos,flush=True)
            if pos>=0: print(t[max(0,pos-1500):pos+5000],flush=True)
          soup=BeautifulSoup(t,'html.parser')
          for s in soup.find_all('script',src=True):
            src=urljoin(u,s['src'])
            try:
              x=requests.get(src,headers=H,timeout=30).text
              print('\nSCRIPT',src,'LEN',len(x),flush=True)
              for pat in ['download','api/','894460','original_id','data_source_uuid','hash']:
                for m in list(re.finditer(pat,x,re.I))[:10]:
                  print('CTX',pat,x[max(0,m.start()-500):m.start()+1000],flush=True)
            except Exception as e: print('SCRIPTERR',src,repr(e),flush=True)
          PY
