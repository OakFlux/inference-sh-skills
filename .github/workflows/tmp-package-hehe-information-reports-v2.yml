name: Package verified Hehe Information reports v2

on:
  push:
    branches:
      - tmp/hehe-information-reports-20260829

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf

      - name: Download, verify, and package reports
        run: python .github/scripts/package_hehe_information_v2.py

      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hehe-information-reports-v2
          path: 合合信息_全部年报_招股说明书_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
