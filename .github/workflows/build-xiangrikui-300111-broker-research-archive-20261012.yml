name: Build Xiangrikui 300111 broker research archive 20261012

on:
  push:
    paths:
      - '.github/workflows/build-xiangrikui-300111-broker-research-archive-20261012.yml'
      - 'scripts/build_xiangrikui_300111_broker_research_archive_20261012.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 pypdf reportlab

      - name: Build validate and package research archive
        run: python scripts/build_xiangrikui_300111_broker_research_archive_20261012.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xiangrikui-300111-broker-research-archive-20261012
          path: 向日葵_300111_券商深度研究资料_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
