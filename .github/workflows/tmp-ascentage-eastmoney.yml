name: Temporary Ascentage Eastmoney retrieval

on:
  push:
    branches:
      - 'tmp/ascentage-reports-20260828'

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p reports diagnostics

      - name: Query exact dates and download matching PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          api='https://reportapi.eastmoney.com/report/list'
          ranges=[('2025-01-26','2025-01-28'),('2025-01-13','2025-01-15'),('2024-10-09','2024-10-11'),('2024-07-14','2024-07-16'),('2023-05-06','2023-05-09')]
          records=[]
          for begin,end in ranges:
              page=1
              while page<=20:
                  params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'*','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  url=api+'?'+urllib.parse.urlencode(params)
                  req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://data.eastmoney.com/report/'})
                  raw=urllib.request.urlopen(req,timeout=90).read().decode('utf-8','ignore').strip()
                  Path(f'diagnostics/api_{begin}_{end}_p{page}.txt').write_text(raw,encoding='utf-8')
                  if '(' in raw and raw.endswith(')'):
                      raw=raw[raw.find('(')+1:-1]
                  data=json.loads(raw)
                  batch=data.get('data') or []
                  records.extend(batch)
                  total=int(data.get('TotalPage') or 0)
                  if not batch or page>=total: break
                  page+=1
                  time.sleep(0.3)

          matches=[]
          for r in records:
              blob=' '.join(str(r.get(k,'')) for k in ('title','stockName','orgSName','author'))
              if '亚盛医药' in blob or '06855' in blob or '6855' in blob:
                  matches.append(r)
          Path('diagnostics/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          with open('diagnostics/matches.tsv','w',encoding='utf-8') as f:
              for r in matches:
                  f.write('\t'.join(str(r.get(k,'')) for k in ('publishDate','orgSName','title','stockName','stockCode','infoCode'))+'\n')

          prefs=[
              ('细胞凋亡赛道领军者','01_东吴证券_亚盛医药_细胞凋亡赛道领军者_加速迈向全球化_2025-01-27.pdf'),
              ('血液瘤创新药细分龙头','02_国海证券_亚盛医药_血液瘤创新药细分龙头_加速国际化布局_2025-01-14.pdf'),
              ('厚积薄发','03_海通国际_亚盛医药_厚积薄发_逐步迈向全球化Biopharma_2024-10-10.pdf'),
              ('国际化进程加速','04_广发证券_亚盛医药_国际化进程加速_全球临床顺利推进_2024-07-15.pdf'),
              ('小荷才露尖尖角','05_西南证券_亚盛医药_小荷才露尖尖角_细胞凋亡赛道大有可为_2023-05-07.pdf'),
          ]
          selected=[]; seen=set()
          for kw,out in prefs:
              hit=next((r for r in matches if kw in str(r.get('title',''))),None)
              if hit:
                  code=str(hit.get('infoCode') or '').strip()
                  if code and code not in seen:
                      selected.append((hit,out)); seen.add(code)
          if len(selected)<2:
              raise SystemExit(f'Only {len(selected)} preferred matches; inspect diagnostics/matches.tsv')

          for r,out in selected[:3]:
              code=str(r['infoCode']).strip()
              content=None; used=None
              for u in (f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}.pdf'):
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':UA,'Referer':'https://data.eastmoney.com/'})
                      b=urllib.request.urlopen(req,timeout=180).read()
                      if b.startswith(b'%PDF-') and len(b)>100000:
                          content=b; used=u; break
                  except Exception:
                      pass
              if content is None:
                  raise RuntimeError(f'Could not download {code} {r.get("title")}')
              Path('reports',out).write_bytes(content)
              with open('diagnostics/downloads.tsv','a',encoding='utf-8') as f:
                  f.write(f'{out}\t{code}\t{used}\t{len(content)}\n')
          PY

      - name: Verify PDFs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find reports -maxdepth 1 -type f -name '*.pdf' | wc -l)" -ge 2
          {
            echo '亚盛医药（06855.HK）券商深度报告来源与校验'
            echo
            for f in reports/*.pdf; do
              test "$(head -c 5 "$f")" = '%PDF-'
              pages="$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')"
              bytes="$(stat -c '%s' "$f")"
              pdftotext -f 1 -l 3 "$f" - | grep -Eiq '亚盛医药|Ascentage|06855|6855'
              echo "文件：$(basename "$f")"
              echo "页数：$pages"
              echo "大小：$bytes 字节"
              echo "SHA-256：$(sha256sum "$f" | awk '{print $1}')"
              echo
            done
          } > reports/来源与校验.txt

      - name: Upload verified PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ascentage-broker-deep-reports-eastmoney
          path: reports/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascentage-eastmoney-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
