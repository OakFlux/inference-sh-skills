name: Temporary Kingsignal deep report source probe

on:
  push:
    branches:
      - tmp/download-kingsignal-reports-20260829
    paths:
      - .github/workflows/tmp-kingsignal-deep-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe report pages, search engines and public assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html, json, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6',
          })

          pages=[
            ('sina_haitong','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/557851072134/index.phtml'),
            ('sina_ne','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/0/index.phtml'),
            ('f10','https://webf10.gw.com.cn/SZ/B16/SZ300252_B16.html'),
            ('sohu_ne','https://www.sohu.com/a/721969236_121123899'),
          ]
          patterns=[
            r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
            r'https?://[^\s"\'<>]+(?:download|file|attach|report|pdf)[^\s"\'<>]*',
            r'[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
            r'AP\d{18}',
          ]
          for name,url in pages:
            print('\n===== PAGE',name,url,'=====')
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('HTTP',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url)
              text=r.text
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for pat in patterns:
                hits=[]
                for m in re.findall(pat,text,re.I):
                  if m not in hits: hits.append(m)
                for hit in hits[:100]: print('MATCH',hit[:1500])
              for tag in soup.find_all(['a','iframe','embed','object','source','script']):
                for attr in ('href','src','data'):
                  val=tag.get(attr)
                  if val:
                    full=urllib.parse.urljoin(r.url,val)
                    blob=(str(tag)+' '+full).lower()
                    if any(k in blob for k in ['pdf','download','report','研报','报告','557851072134','300252']):
                      print('TAG',attr,full,str(tag)[:1000].replace('\n',' '))
              for needle in ['557851072134','打造信号互联解决方案供应商','download','pdf','report']:
                positions=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
                print('NEEDLE',needle,'COUNT',len(positions))
                for p in positions[:10]:
                  print('CTX',text[max(0,p-1200):p+3000].replace('\n',' ')[:4200])
            except Exception as e:
              print('ERROR',repr(e))

          queries=[
            '"金信诺" "打造信号互联解决方案供应商" pdf',
            '"金信诺" "股份回购彰显信心，卫星通信打造新曲线" pdf',
            '"金信诺" "首次覆盖" pdf',
            '"金信诺" "深度报告" pdf',
            '"金信诺" "海通证券" 2017 pdf',
            '"300252" "打造信号互联" pdf',
          ]
          search_urls=[]
          for q in queries:
            search_urls.extend([
              ('bing', 'https://www.bing.com/search?q='+urllib.parse.quote(q)+'&count=50'),
              ('baidu','https://www.baidu.com/s?wd='+urllib.parse.quote(q)),
              ('sogou','https://www.sogou.com/web?query='+urllib.parse.quote(q)),
              ('duck','https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q)),
            ])
          for engine,url in search_urls:
            print('\n===== SEARCH',engine,url,'=====')
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('HTTP',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url)
              text=html.unescape(r.text)
              soup=BeautifulSoup(text,'lxml')
              seen=[]
              for a in soup.find_all('a',href=True):
                href=a['href']
                label=a.get_text(' ',strip=True)
                full=urllib.parse.urljoin(r.url,href)
                if engine=='baidu' and href.startswith('/link?url='):
                  full=urllib.parse.urljoin('https://www.baidu.com',href)
                blob=(label+' '+full).lower()
                if any(k in blob for k in ['金信诺','300252','557851072134','报告','研报','pdf','report']):
                  item=(label,full)
                  if item not in seen:
                    seen.append(item)
                    print('RESULT',label[:500],full[:1500])
              for pat in patterns:
                for hit in list(dict.fromkeys(re.findall(pat,text,re.I)))[:100]:
                  print('RAW_MATCH',hit[:1500])
            except Exception as e:
              print('SEARCH_ERROR',repr(e))
          PY
