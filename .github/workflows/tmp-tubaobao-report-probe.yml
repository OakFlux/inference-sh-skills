name: Temporary Tubaobao brokerage report probe

on:
  push:
    branches:
      - tmp/download-tubaobao-reports-20260829
    paths:
      - .github/workflows/tmp-tubaobao-report-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Eastmoney metadata and test public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re, requests
          from datetime import datetime

          api = 'https://reportapi.eastmoney.com/report/list'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/002043.html',
          }

          rows = []
          for page in range(1, 11):
              params = {
                  'pageNo': str(page), 'pageSize': '100', 'code': '002043',
                  'industryCode': '*', 'industry': '*', 'rating': '*', 'ratingChange': '*',
                  'beginTime': '2018-01-01', 'endTime': '2026-08-29', 'fields': '',
                  'qType': '0', 'orgCode': '', 'rcode': '', 'p': str(page),
                  'pageNum': str(page), 'pageNumber': str(page),
              }
              r = requests.get(api, params=params, headers=headers, timeout=60)
              print('API', page, r.status_code, len(r.content), r.url)
              r.raise_for_status()
              obj = r.json()
              data = obj.get('data') or []
              rows.extend(data)
              total_pages = int(obj.get('TotalPage') or math.ceil(int(obj.get('hits') or 0)/100) or 1)
              if page >= total_pages:
                  break

          dedup = {}
          for row in rows:
              key = row.get('infoCode') or (row.get('title'), row.get('publishDate'), row.get('orgSName'))
              dedup[key] = row
          rows = list(dedup.values())
          rows.sort(key=lambda x: x.get('publishDate') or '', reverse=True)
          print('TOTAL_ROWS', len(rows))

          candidates = []
          for row in rows:
              title = str(row.get('title') or '')
              pages = int(row.get('attachPages') or 0)
              report_type = int(row.get('reportType') or 0)
              if report_type == 2 and (pages >= 12 or any(k in title for k in ['深度', '首次覆盖', '价值分析', '升级之路', '砥砺前行'])):
                  candidates.append(row)

          print('CANDIDATES', len(candidates))
          for row in candidates:
              info = row.get('infoCode') or ''
              title = row.get('title') or ''
              pages = row.get('attachPages') or 0
              org = row.get('orgSName') or row.get('orgName') or ''
              date = str(row.get('publishDate') or '')[:10]
              print('\nMETA', json.dumps({
                  'date': date, 'org': org, 'title': title, 'pages': pages,
                  'infoCode': info, 'encodeUrl': row.get('encodeUrl'),
                  'attachSize': row.get('attachSize'), 'rating': row.get('emRatingName'),
              }, ensure_ascii=False))
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(datetime.now().timestamp()*1000)}.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
              ]
              for url in urls:
                  try:
                      rr = requests.get(url, headers={**headers, 'Range':'bytes=0-4095'}, timeout=45, allow_redirects=True)
                      print('PDFTEST', rr.status_code, rr.headers.get('content-type'), rr.headers.get('content-range'), len(rr.content), rr.content[:8], rr.url)
                  except Exception as e:
                      print('PDFERR', repr(e), url)
          PY
