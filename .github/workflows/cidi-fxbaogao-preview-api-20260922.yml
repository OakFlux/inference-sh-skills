name: Inspect CIDI report preview API 20260922
on:
  push:
    paths:
      - '.github/workflows/cidi-fxbaogao-preview-api-20260922.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query preview APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview_api
          python - <<'PY'
          import json, requests
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          h={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Origin':'https://www.fxbaogao.com',
            'Referer':'https://www.fxbaogao.com/view?id=5228577',
          }
          for rid in ['5228577','5466816','5435964','5238998']:
              u=f'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId={rid}'
              r=s.get(u,headers=h,timeout=(10,60))
              print(rid,r.status_code,r.headers.get('content-type'),len(r.content),r.text[:500],flush=True)
              Path(f'preview_api/{rid}.json').write_bytes(r.content)
              Path(f'preview_api/{rid}_headers.json').write_text(json.dumps(dict(r.headers),ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cidi-fxbaogao-preview-api
          path: preview_api
          if-no-files-found: error
          retention-days: 7
