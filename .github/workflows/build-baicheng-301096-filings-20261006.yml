name: Build Baicheng Pharmaceutical 301096 filings 20261006

on:
  push:
    paths:
      - '.github/workflows/build-baicheng-301096-filings-20261006.yml'
      - 'scripts/build_baicheng_301096_filings_20261006.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        run: python scripts/build_baicheng_301096_filings_20261006.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: baicheng-301096-filings-20261006
          path: 百诚医药_301096_2020-2025年报_2026最新季报及半年报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
