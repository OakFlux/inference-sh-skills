name: Build Zhijiang Bio 688317 filings package 20261004

on:
  push:
    paths:
      - '.github/workflows/zhijiang-bio-688317-filings-package-20261004.yml'
      - 'scripts/build_zhijiang_bio_688317_filings_20261004.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        run: python scripts/build_zhijiang_bio_688317_filings_20261004.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zhijiang-bio-688317-all-filings
          path: 之江生物_688317_全部年报_招股说明书_2026最新季报及半年报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
