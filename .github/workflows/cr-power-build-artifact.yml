name: Build China Resources Power report archive

on:
  push:
    branches:
      - cr-power-artifact-20260904
    paths:
      - '.github/workflows/cr-power-build-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Taipei

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out artifact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cr-power-artifact-20260904
          persist-credentials: true

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pymupdf

      - name: Download, validate, package, and split
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public_artifacts _crp_work 华润电力_00836_2020-2025年报及最新半年报_完整PDF
          mkdir -p public_artifacts
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import pymupdf
          import requests
          from pypdf import PdfReader

          CODE = "00836"
          STOCK_ID = "6732"
          PREPARED = "2026-09-04"
          PACKAGE = "华润电力_00836_2020-2025年报及最新半年报_完整PDF"
          ZIP_NAME = PACKAGE + ".zip"

          ROOT = Path(PACKAGE)
          ANNUALS = ROOT / "01_年度报告_2020-2025"
          CURRENT = ROOT / "02_2026年最新半年度财务资料"
          COMPLETE = ROOT / "03_最新完整中期报告"
          WORK = Path("_crp_work")
          RENDERS = WORK / "renders"
          for directory in (ANNUALS, CURRENT, COMPLETE, WORK, RENDERS):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36"
          search_headers = {
              "User-Agent": ua,
              "Accept": "application/json,text/html,*/*",
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.7",
              "Referer": "https://www1.hkexnews.hk/search/titlesearch.xhtml",
              "X-Requested-With": "XMLHttpRequest",
          }
          pdf_headers = {
              "User-Agent": ua,
              "Accept": "application/pdf,application/octet-stream;q=0.9,*/*;q=0.8",
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.7",
              "Referer": "https://www1.hkexnews.hk/",
          }

          def compact(value: object) -> str:
              return re.sub(r"\s+", "", str(value or "")).lower()

          def sha256_path(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def normalized_codes(value: object) -> list[str]:
              return re.findall(r"\d{4,5}", re.sub(r"<[^>]+>", " ", str(value or "")))

          def hkex_search(from_date: str, to_date: str, *, lang: str = "zh") -> list[dict]:
              endpoint = "https://www1.hkexnews.hk/search/titleSearchServlet.do"
              params = {
                  "sortDir": "0",
                  "sortByOptions": "DateTime",
                  "category": "0",
                  "market": "SEHK",
                  "stockId": STOCK_ID,
                  "documentType": "-1",
                  "fromDate": from_date,
                  "toDate": to_date,
                  "title": "",
                  "searchType": "1",
                  "t1code": "-2",
                  "t2Gcode": "-2",
                  "t2code": "-2",
                  "rowRange": "500",
                  "lang": lang,
              }
              errors: list[str] = []
              for attempt in range(1, 7):
                  try:
                      response = session.get(
                          endpoint,
                          params=params,
                          headers=search_headers,
                          timeout=(30, 180),
                          allow_redirects=True,
                      )
                      print("SEARCH", from_date, to_date, lang, attempt, response.status_code, len(response.content), flush=True)
                      response.raise_for_status()
                      outer = response.json()
                      result = outer.get("result", "[]") if isinstance(outer, dict) else outer
                      rows = json.loads(result) if isinstance(result, str) else result
                      if not isinstance(rows, list):
                          raise RuntimeError(f"Unexpected HKEX result type: {type(rows)!r}")
                      filtered = []
                      for row in rows:
                          if not isinstance(row, dict):
                              continue
                          codes = normalized_codes(row.get("STOCK_CODE"))
                          if CODE not in codes:
                              continue
                          if str(row.get("FILE_TYPE", "")).upper() != "PDF":
                              continue
                          if not str(row.get("FILE_LINK", "")).lower().endswith(".pdf"):
                              continue
                          filtered.append(row)
                      print("FILTERED_ROWS", json.dumps(filtered, ensure_ascii=False, indent=2), flush=True)
                      return filtered
                  except Exception as exc:
                      errors.append(repr(exc))
                      time.sleep(min(2 * attempt, 10))
              raise RuntimeError(
                  f"HKEX search failed for {from_date}-{to_date}: " + " | ".join(errors[-8:])
              )

          year_markers = {
              2020: ("2020", "二零二零", "二〇二〇"),
              2021: ("2021", "二零二一", "二〇二一"),
              2022: ("2022", "二零二二", "二〇二二"),
              2023: ("2023", "二零二三", "二〇二三"),
              2024: ("2024", "二零二四", "二〇二四"),
              2025: ("2025", "二零二五", "二〇二五"),
              2026: ("2026", "二零二六", "二〇二六"),
          }

          def contains_year(value: object, year: int) -> bool:
              text = compact(value)
              return any(compact(marker) in text for marker in year_markers[year])

          def category_text(row: dict) -> str:
              return compact(
                  " ".join(
                      str(row.get(key, ""))
                      for key in ("TITLE", "SHORT_TEXT", "LONG_TEXT")
                  )
              )

          def official_url(row: dict) -> str:
              return urljoin("https://www1.hkexnews.hk/", str(row["FILE_LINK"]))

          def select_annual(year: int) -> dict:
              rows = hkex_search(f"{year + 1}0301", f"{year + 1}0630")
              selected = []
              for row in rows:
                  title = str(row.get("TITLE", ""))
                  category = category_text(row)
                  if not contains_year(title, year):
                      continue
                  annual_marker = any(
                      marker in category
                      for marker in ("[年報]", "年報", "年度報告", "年度报告", "annualreport")
                  )
                  if not annual_marker:
                      continue
                  excluded = any(
                      marker in compact(title)
                      for marker in (
                          "可持續發展", "可持续发展", "環境", "环境", "esg",
                          "全年業績", "全年业绩", "末期業績", "末期业绩",
                          "通知", "函件", "摘要", "海外監管", "海外监管",
                      )
                  )
                  if excluded:
                      continue
                  selected.append(row)
              if len(selected) != 1:
                  raise RuntimeError(
                      f"Annual report selection failed for {year}: "
                      + json.dumps(selected, ensure_ascii=False)
                  )
              return selected[0]

          def select_full_interim(year: int, to_date: str) -> dict | None:
              rows = hkex_search(f"{year}0801", to_date)
              selected = []
              for row in rows:
                  title = str(row.get("TITLE", ""))
                  category = category_text(row)
                  title_norm = compact(title)
                  if not contains_year(title, year):
                      continue
                  if not any(
                      marker in category
                      for marker in ("中期/半年度報告", "中期報告", "中期报告", "interimreport")
                  ):
                      continue
                  if any(
                      marker in title_norm
                      for marker in ("中期業績", "中期业绩", "interimresults", "通知", "函件")
                  ):
                      continue
                  selected.append(row)
              if len(selected) > 1:
                  # Prefer the latest full interim report where duplicated language or corrected files appear.
                  selected.sort(key=lambda row: str(row.get("DATE_TIME", "")), reverse=True)
                  unique_links = {str(row.get("FILE_LINK")) for row in selected}
                  if len(unique_links) > 1:
                      raise RuntimeError(
                          f"Multiple full interim reports for {year}: "
                          + json.dumps(selected, ensure_ascii=False)
                      )
              return selected[0] if selected else None

          def select_interim_results(year: int, to_date: str) -> dict:
              rows = hkex_search(f"{year}0801", to_date)
              selected = []
              for row in rows:
                  title = str(row.get("TITLE", ""))
                  category = category_text(row)
                  if not contains_year(title, year):
                      continue
                  if not any(
                      marker in category
                      for marker in ("中期業績", "中期业绩", "interimresults")
                  ):
                      continue
                  if any(
                      marker in compact(title)
                      for marker in ("附屬公司", "附属公司", "新能源", "盈利預告", "盈利预告")
                  ):
                      continue
                  selected.append(row)
              if len(selected) != 1:
                  raise RuntimeError(
                      f"Interim results selection failed for {year}: "
                      + json.dumps(selected, ensure_ascii=False)
                  )
              return selected[0]

          annual_rows = [select_annual(year) for year in range(2020, 2026)]
          full_2026 = select_full_interim(2026, PREPARED.replace("-", ""))
          result_2026 = None if full_2026 else select_interim_results(2026, PREPARED.replace("-", ""))
          full_latest = full_2026 or select_full_interim(2025, "20251130")
          if full_latest is None:
              raise RuntimeError("No latest full interim report found")

          targets: list[dict] = []
          for index, (year, row) in enumerate(zip(range(2020, 2026), annual_rows), 1):
              targets.append(
                  {
                      "index": index,
                      "year": year,
                      "category": "Annual Report",
                      "report_type": "年度报告",
                      "row": row,
                      "directory": ANNUALS,
                      "filename": f"{year}_华润电力_{year}年年度报告.pdf",
                      "min_pages": 90,
                  }
              )
          if result_2026 is not None:
              targets.append(
                  {
                      "index": 7,
                      "year": 2026,
                      "category": "Latest Half-Year Financial Results",
                      "report_type": "中期业绩公告",
                      "row": result_2026,
                      "directory": CURRENT,
                      "filename": "2026_华润电力_2026年中期业绩公告_截至2026年6月30日.pdf",
                      "min_pages": 8,
                  }
              )
          targets.append(
              {
                  "index": 8 if result_2026 is not None else 7,
                  "year": 2026 if full_2026 else 2025,
                  "category": "Latest Full Interim Report",
                  "report_type": "完整中期报告",
                  "row": full_latest,
                  "directory": COMPLETE,
                  "filename": (
                      "2026_华润电力_2026年完整中期报告.pdf"
                      if full_2026
                      else "2025_华润电力_2025年中期报告_截至当前最新完整中报.pdf"
                  ),
                  "min_pages": 55,
              }
          )

          print(
              "TARGETS",
              json.dumps(
                  [
                      {
                          **{key: value for key, value in target.items() if key not in ("row", "directory")},
                          "title": target["row"].get("TITLE"),
                          "date_time": target["row"].get("DATE_TIME"),
                          "url": official_url(target["row"]),
                      }
                      for target in targets
                  ],
                  ensure_ascii=False,
                  indent=2,
              ),
              flush=True,
          )

          def download_pdf(url: str) -> requests.Response:
              errors: list[str] = []
              for attempt in range(1, 7):
                  try:
                      response = session.get(
                          url,
                          headers=pdf_headers,
                          timeout=(30, 900),
                          allow_redirects=True,
                      )
                      print(
                          "PDF_GET", attempt, response.status_code,
                          response.headers.get("content-type"), len(response.content), response.url,
                          flush=True,
                      )
                      if (
                          response.status_code == 200
                          and response.content.startswith(b"%PDF-")
                          and len(response.content) > 50_000
                      ):
                          return response
                      errors.append(f"HTTP {response.status_code}/{len(response.content)}")
                  except Exception as exc:
                      errors.append(repr(exc))
                  time.sleep(min(2 * attempt, 10))
              raise RuntimeError("PDF download failed: " + " | ".join(errors[-8:]))

          records: list[dict] = []
          seen_hashes: set[str] = set()
          total_pages = 0
          total_bytes = 0

          for target in targets:
              source_url = official_url(target["row"])
              response = download_pdf(source_url)
              destination = target["directory"] / target["filename"]
              destination.write_bytes(response.content)

              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted and reader.decrypt("") == 0:
                  raise RuntimeError(f"Encrypted PDF cannot be opened: {destination.name}")
              pages = len(reader.pages)
              if pages < int(target["min_pages"]):
                  raise RuntimeError(f"Unexpectedly short PDF: {destination.name}, {pages} pages")

              sample_text: list[str] = []
              for page_index in sorted(set(list(range(min(55, pages))) + [pages // 2, pages - 1])):
                  try:
                      sample_text.append(reader.pages[page_index].extract_text() or "")
                  except Exception as exc:
                      print("TEXT_WARNING", destination.name, page_index + 1, repr(exc), flush=True)
              extracted = "\n".join(sample_text)
              extracted_norm = compact(extracted)
              company_text_ok = any(
                  compact(marker) in extracted_norm
                  for marker in ("华润电力", "華潤電力", "China Resources Power", CODE)
              )
              year_text_ok = contains_year(extracted, int(target["year"]))
              metadata_company_ok = (
                  CODE in normalized_codes(target["row"].get("STOCK_CODE"))
                  and any(
                      marker in compact(target["row"].get("STOCK_NAME"))
                      for marker in ("華潤電力", "华润电力", "chinarespower")
                  )
              )
              if not metadata_company_ok:
                  raise RuntimeError(f"HKEX metadata company mismatch: {destination.name}")
              if not contains_year(target["row"].get("TITLE"), int(target["year"])):
                  raise RuntimeError(f"HKEX metadata year mismatch: {destination.name}")
              if not company_text_ok:
                  print("TEXT_COMPANY_MARKER_WARNING", destination.name, flush=True)
              if not year_text_ok:
                  print("TEXT_YEAR_MARKER_WARNING", destination.name, flush=True)

              qpdf = subprocess.run(
                  ["qpdf", "--check", str(destination)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(
                      f"qpdf validation failed: {destination.name}; {qpdf.stderr[-1500:]}"
                  )

              document = pymupdf.open(destination)
              if document.page_count != pages:
                  raise RuntimeError(f"PDF parser page-count mismatch: {destination.name}")
              for label, page_index in (
                  ("first", 0),
                  ("middle", pages // 2),
                  ("last", pages - 1),
              ):
                  pixmap = document.load_page(page_index).get_pixmap(
                      matrix=pymupdf.Matrix(0.55, 0.55),
                      alpha=False,
                  )
                  render_path = RENDERS / f"{target['index']:02d}_{label}.png"
                  pixmap.save(render_path)
                  if pixmap.width < 150 or pixmap.height < 150 or render_path.stat().st_size < 3_000:
                      raise RuntimeError(f"Render failed: {destination.name} page {page_index + 1}")
              document.close()

              digest = sha256_path(destination)
              if digest in seen_hashes:
                  raise RuntimeError(f"Duplicate PDF detected: {destination.name}")
              seen_hashes.add(digest)

              record = {
                  "file": str(destination.relative_to(ROOT)),
                  "year": target["year"],
                  "category": target["category"],
                  "report_type": target["report_type"],
                  "title": target["row"].get("TITLE"),
                  "release_time": target["row"].get("DATE_TIME"),
                  "file_info": target["row"].get("FILE_INFO"),
                  "source_url": response.url,
                  "pages": pages,
                  "bytes": destination.stat().st_size,
                  "sha256": digest,
                  "text_company_marker_verified": company_text_ok,
                  "text_year_marker_verified": year_text_ok,
              }
              records.append(record)
              total_pages += pages
              total_bytes += destination.stat().st_size
              print("VERIFIED", json.dumps(record, ensure_ascii=False), flush=True)

          expected_count = 7 if full_2026 else 8
          if len(records) != expected_count or len(seen_hashes) != expected_count:
              raise RuntimeError(
                  f"Unexpected report count: {len(records)}, expected {expected_count}"
              )

          interim_note = (
              "截至2026-09-04，已披露2026年完整中期报告，本包已收录。"
              if full_2026
              else "截至2026-09-04，港交所尚未披露华润电力2026年完整中期报告；本包收录2026年中期业绩公告作为最新半年度财务资料，并附2025年最新完整中期报告。"
          )
          readme = [
              "华润电力控股有限公司（00836.HK）定期报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "收录内容：",
              "1. 2020—2025年完整年度报告，共6份。",
              f"2. {interim_note}",
              "3. 已排除全年业绩公告、可持续发展报告、通知函件、摘要和重复文件。",
              "",
              f"PDF数量：{len(records)}份",
              f"合计页数：{total_pages}页",
              f"PDF未压缩总大小：{total_bytes / 1024 / 1024:.2f} MiB",
              "",
              "文件清单：",
          ]
          for record in records:
              readme.extend(
                  [
                      f"- {record['file']}｜{record['pages']}页｜港交所披露时间：{record['release_time']}",
                      f"  原标题：{record['title']}",
                      f"  官方PDF：{record['source_url']}",
                      f"  SHA-256：{record['sha256']}",
                  ]
              )
          readme.extend(
              [
                  "",
                  "核验项目：港交所公司代码及标题元数据、PDF文件头、实际页数、qpdf结构检查、首页/中间页/末页渲染、文本公司与年份标识（可解析时）、重复文件、逐文件SHA-256及ZIP CRC。",
                  "资料仅供研究与学习使用，版权归华润电力及原信息披露平台所有。",
              ]
          )
          (ROOT / "报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")
          manifest = {
              "company": "华润电力控股有限公司",
              "ticker": "00836.HK",
              "prepared_date": PREPARED,
              "document_count": len(records),
              "latest_complete_interim_year": 2026 if full_2026 else 2025,
              "latest_current_period_document": "2026完整中期报告" if full_2026 else "2026中期业绩公告",
              "total_pages": total_pages,
              "total_bytes": total_bytes,
              "documents": records,
          }
          (ROOT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (ROOT / "SHA256SUMS.txt").write_text(
              "".join(f"{record['sha256']}  {record['file']}\n" for record in records),
              encoding="utf-8",
          )

          archive = Path(ZIP_NAME)
          with zipfile.ZipFile(
              archive,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=6,
              allowZip64=True,
          ) as bundle:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      bundle.write(path, arcname=str(path.relative_to(ROOT)))
          with zipfile.ZipFile(archive) as bundle:
              bad_member = bundle.testzip()
              if bad_member:
                  raise RuntimeError(f"ZIP CRC failure: {bad_member}")
              pdf_members = [name for name in bundle.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_members) != len(records):
                  raise RuntimeError(
                      f"ZIP PDF count mismatch: {len(pdf_members)} != {len(records)}"
                  )

          archive_sha = sha256_path(archive)
          part_size = 40 * 1024 * 1024
          part_names: list[str] = []
          with archive.open("rb") as source:
              index = 0
              while True:
                  chunk = source.read(part_size)
                  if not chunk:
                      break
                  name = f"cr_power_bundle.part{index:03d}"
                  path = Path("public_artifacts") / name
                  path.write_bytes(chunk)
                  part_names.append(name)
                  index += 1

          chunk_manifest = {
              "final_filename": ZIP_NAME,
              "archive_bytes": archive.stat().st_size,
              "archive_sha256": archive_sha,
              "part_size": part_size,
              "parts": [
                  {
                      "name": name,
                      "bytes": (Path("public_artifacts") / name).stat().st_size,
                      "sha256": sha256_path(Path("public_artifacts") / name),
                  }
                  for name in part_names
              ],
              "document_count": len(records),
              "total_pages": total_pages,
              "pdf_total_bytes": total_bytes,
              "latest_complete_interim_year": 2026 if full_2026 else 2025,
              "latest_current_period_document": "2026完整中期报告" if full_2026 else "2026中期业绩公告",
              "documents": records,
          }
          Path("public_artifacts/cr_power_bundle_manifest.json").write_text(
              json.dumps(chunk_manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("FINAL", json.dumps(chunk_manifest, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Commit archive chunks to artifact branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_artifacts
          if git diff --cached --quiet; then
            echo 'No artifact changes to commit.'
          else
            git commit -m 'Publish verified China Resources Power report archive chunks'
            git push origin HEAD:cr-power-artifact-20260904
          fi
