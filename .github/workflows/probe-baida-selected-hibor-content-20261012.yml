name: Probe selected Baida Hibor report content

on:
  push:
    paths:
      - '.github/workflows/probe-baida-selected-hibor-content-20261012.yml'
      - 'scripts/probe_baida_selected_hibor_content_20261012.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Probe selected reports
        run: python scripts/probe_baida_selected_hibor_content_20261012.py
