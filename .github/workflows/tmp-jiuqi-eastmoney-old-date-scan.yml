name: Temporary Jiuqi old Eastmoney date scan

on:
  push:
    branches:
      - tmp/download-jiuqi-software-reports-20260829
    paths:
      - .github/workflows/tmp-jiuqi-eastmoney-old-date-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan 2009 and 2011 report windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, requests
          api='https://reportapi.eastmoney.com/report/list'
          h={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'}
          windows=[('2009-07-20','2009-08-15'),('2011-08-20','2011-09-10')]
          keys=['久其软件','002279','产品客户与独特商业模式','国内领先的报表管理软件供应商','合理估值区间']
          for begin,end in windows:
            for q in ('0','1','2'):
              p={'pageNo':'1','pageSize':'100','code':'','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'fields':'','qType':q,'orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              r=requests.get(api,params=p,headers=h,timeout=90); r.raise_for_status(); o=r.json()
              pages=max(1,int(o.get('TotalPage') or math.ceil(int(o.get('hits') or 0)/100) or 1))
              print('SCAN',begin,end,q,'HITS',o.get('hits'),'PAGES',pages)
              for page in range(1,min(pages,50)+1):
                if page==1: rows=o.get('data') or []
                else:
                  pp=dict(p); pp.update({'pageNo':str(page),'p':str(page),'pageNum':str(page),'pageNumber':str(page)})
                  rr=requests.get(api,params=pp,headers=h,timeout=90); rr.raise_for_status(); rows=rr.json().get('data') or []
                for row in rows:
                  blob=' '.join(str(row.get(k) or '') for k in ['title','stockName','stockCode','orgSName','researcher'])
                  if any(k in blob for k in keys):
                    print('MATCH',json.dumps(row,ensure_ascii=False))
                    info=row.get('infoCode')
                    if info:
                      u=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
                      x=requests.get(u,headers={**h,'Range':'bytes=0-4095','Accept':'application/pdf,*/*'},timeout=60,allow_redirects=True)
                      print('PDF',info,x.status_code,x.headers.get('content-type'),x.headers.get('content-range'),len(x.content),x.content[:8],x.url)
          PY
