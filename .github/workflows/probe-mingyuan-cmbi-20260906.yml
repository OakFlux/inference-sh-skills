name: Probe Ming Yuan Cloud CMBI research archive

on:
  push:
    branches:
      - chatgpt-mingyuan-cloud-broker-reports-20260906
    paths:
      - '.github/workflows/probe-mingyuan-cmbi-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_mingyuan_cmbi_20260906.py
      - uses: actions/upload-artifact@v4
        with:
          name: mingyuan-cmbi-probe-20260906
          path: mingyuan-cmbi-probe.json
          if-no-files-found: error
          retention-days: 1
