name: Temporary Jiuqi Software brokerage report discovery

on:
  push:
    branches:
      - tmp/download-jiuqi-software-reports-20260829
    paths:
      - .github/workflows/tmp-jiuqi-report-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query public report catalogs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, requests

          CODE='002279'
          NAME='久其软件'
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/report/{CODE}.html',
              'Accept':'application/json,text/plain,*/*',
          })

          api='https://reportapi.eastmoney.com/report/list'
          rows=[]
          for qtype in ('0','1','2'):
              for page in range(1,20):
                  params={
                      'pageNo':str(page),'pageSize':'100','code':CODE,
                      'industryCode':'*','industry':'*','rating':'*','ratingChange':'*',
                      'beginTime':'2009-01-01','endTime':'2026-08-29','fields':'',
                      'qType':qtype,'orgCode':'','rcode':'','p':str(page),
                      'pageNum':str(page),'pageNumber':str(page),
                  }
                  r=s.get(api,params=params,timeout=90)
                  print('API',qtype,page,r.status_code,len(r.content),r.url)
                  r.raise_for_status(); obj=r.json(); data=obj.get('data') or []
                  rows.extend(data)
                  total=int(obj.get('TotalPage') or math.ceil(int(obj.get('hits') or 0)/100) or 1)
                  if page>=total: break

          dedup={}
          for row in rows:
              key=row.get('infoCode') or (row.get('title'),row.get('publishDate'),row.get('orgSName'))
              dedup[key]=row
          rows=list(dedup.values())
          rows.sort(key=lambda x:str(x.get('publishDate') or ''),reverse=True)
          print('\nEASTMONEY_TOTAL',len(rows))
          for row in rows:
              meta={
                  'date':str(row.get('publishDate') or '')[:10],
                  'broker':row.get('orgSName') or row.get('orgName'),
                  'title':row.get('title'),
                  'pages':row.get('attachPages'),
                  'size_kb':row.get('attachSize'),
                  'infoCode':row.get('infoCode'),
                  'reportType':row.get('reportType'),
                  'column':row.get('column'),
                  'rating':row.get('emRatingName') or row.get('sRatingName'),
                  'researcher':row.get('researcher'),
                  'stockCode':row.get('stockCode'),
              }
              print('EM_REPORT',json.dumps(meta,ensure_ascii=False))
              info=row.get('infoCode')
              if info:
                  url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
                  try:
                      rr=s.get(url,headers={'Range':'bytes=0-4095','Accept':'application/pdf,*/*'},timeout=60,allow_redirects=True)
                      print('PDF_TEST',info,rr.status_code,rr.headers.get('content-type'),rr.headers.get('content-range'),len(rr.content),rr.content[:8],rr.url)
                  except Exception as e:
                      print('PDF_ERR',info,repr(e))

          # Search Sdyanbao exact company/ticker results, including reports not indexed by Eastmoney.
          ss=requests.Session()
          ss.headers.update({
              'User-Agent':s.headers['User-Agent'],
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Content-Type':'application/json;charset=UTF-8',
              'Accept':'application/json,text/plain,*/*',
          })
          seen=set()
          for query in (NAME,CODE,'北京久其软件'):
              for page in range(1,10):
                  payload={
                      'device':1,'hideTrader':0,'onlyTitle':0,'order':0,
                      'page':page,'pageSize':100,'keyword':query,'pageCount':0,
                      'dateRange':0,'startTime':'','endTime':'','typeIds':[], 'industryIds':[]
                  }
                  r=ss.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=90)
                  print('\nSDY_API',query,page,r.status_code,len(r.content))
                  r.raise_for_status(); obj=r.json(); data=obj.get('data') or {}; files=data.get('files') or []
                  print('SDY_COUNT',len(files),'TOTAL',data.get('total'))
                  for f in files:
                      fid=f.get('id')
                      if fid in seen: continue
                      seen.add(fid)
                      stock=f.get('stock') or {}
                      name=str(f.get('name') or '')
                      content=str(f.get('content') or '')[:1000]
                      blob=' '.join([name,str(stock.get('name') or ''),str(stock.get('code') or ''),content])
                      if NAME in blob or CODE in blob:
                          print('SDY_REPORT',json.dumps({
                              'id':fid,'name':name,'date':f.get('time_text'),
                              'pages':f.get('page_count'),'size':f.get('file_size'),
                              'type':(f.get('type') or {}).get('name'),
                              'organization':(f.get('organization') or {}).get('name'),
                              'uuid':f.get('data_source_uuid'),'data_source':f.get('data_source'),
                              'original_id':f.get('original_id'),'page_url':f.get('page_url'),
                              'share_url':f.get('share_url'),'stock':stock,
                          },ensure_ascii=False))
                  if not files or page*100>=int(data.get('total') or 0): break
          PY
