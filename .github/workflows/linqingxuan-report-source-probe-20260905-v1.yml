name: Probe public sources for Lin Qingxuan broker PDFs

on:
  push:
    paths:
      - '.github/workflows/linqingxuan-report-source-probe-20260905-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect pages, scripts, network and download controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin,unquote
          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          urls=[
            'https://www.360why.com/bg/34b307000089491.html',
            'https://reportify.cn/companies/HK%3A02657/documents',
            'https://reportify.cn/reports/1242481900132634624',
            'https://www.vzkoo.com/read/4645282470067965952.html',
            'https://wap.hibor.com.cn/repinfodetail_5221624.html',
            'https://finance.sina.com.cn/wm/2026-03-10/doc-inhqneyu6359340.shtml',
            'https://finance.sina.com.cn/wm/2026-06-25/doc-inieqnch2558266.shtml',
          ]
          keys=('pdf','download','file','attachment','report','document','sourceurl','oss','cos','cdn','34b307','5209707','5302353','5404920','5221624','1242481900132634624')
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          out=Path('output')

          s=requests.Session();s.trust_env=False
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'},timeout=(20,120),allow_redirects=True)
              print('\nREQUESTS_PAGE',i,u,r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
              text=r.text
              (out/f'requests_{i}.html').write_text(text,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(text,'html.parser')
              for tag in soup.find_all(['a','iframe','embed','object','source','img','script','link']):
                for attr in ('href','src','data','onclick'):
                  val=tag.get(attr)
                  if val:
                    full=urljoin(r.url,val) if attr in ('href','src','data') else val
                    if any(k in unquote(full.lower()) for k in keys):
                      print('HTML_RESOURCE',i,tag.name,attr,repr(full[:3000]),flush=True)
              for k in keys:
                for m in list(re.finditer(re.escape(k),text,re.I))[:20]:
                  print('HTML_CTX',i,k,repr(text[max(0,m.start()-500):m.start()+1800]),flush=True)
            except Exception as e: print('REQUESTS_ERR',i,u,repr(e),flush=True)

          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            context=browser.new_context(user_agent=ua,accept_downloads=True,viewport={'width':1440,'height':1200})
            for i,u in enumerate(urls,1):
              page=context.new_page(); events=[]
              page.on('request',lambda req,ev=events: ev.append({'kind':'request','url':req.url,'method':req.method,'type':req.resource_type}))
              page.on('response',lambda resp,ev=events: ev.append({'kind':'response','url':resp.url,'status':resp.status,'ctype':resp.headers.get('content-type','')}))
              try:
                resp=page.goto(u,wait_until='domcontentloaded',timeout=120000)
                page.wait_for_timeout(5000)
                print('\nBROWSER_PAGE',i,u,resp.status if resp else None,page.url,page.title(),flush=True)
                html=page.content(); (out/f'browser_{i}.html').write_text(html,encoding='utf-8')
                print('BODY_TEXT',i,repr(page.locator('body').inner_text()[:12000]),flush=True)
                for ev in events:
                  if any(k in unquote(ev['url'].lower()) for k in keys): print('NETWORK',i,json.dumps(ev,ensure_ascii=False),flush=True)
                resources=page.locator('a,button,iframe,embed,object,source,img,script,link')
                for j in range(min(resources.count(),2000)):
                  el=resources.nth(j)
                  try:
                    txt=' '.join(el.inner_text(timeout=500).split())[:400]
                    vals=el.evaluate("e=>({tag:e.tagName,href:e.href||'',src:e.src||'',data:e.data||'',onclick:e.getAttribute('onclick')||'',outer:e.outerHTML.slice(0,1200)})")
                    hay=' '.join([txt]+[str(x) for x in vals.values()])
                    if any(k in unquote(hay.lower()) for k in keys) or any(x in txt for x in ('下载','完整报告','报告原文','获取报告')):
                      print('DOM_RESOURCE',i,j,txt,json.dumps(vals,ensure_ascii=False),flush=True)
                  except Exception: pass
                # Exercise visible public download/report controls only, observing resulting URLs/downloads.
                controls=page.get_by_text(re.compile(r'下载|完整报告|报告原文|获取报告|Download',re.I))
                print('CONTROL_COUNT',i,controls.count(),flush=True)
                for j in range(min(controls.count(),8)):
                  el=controls.nth(j)
                  try:
                    if not el.is_visible(): continue
                    print('CONTROL',i,j,repr(el.inner_text()),el.evaluate('e=>e.outerHTML'),flush=True)
                    before=set(p.url for p in context.pages)
                    try:
                      with page.expect_download(timeout=5000) as di:
                        el.click(force=True,timeout=5000)
                      dl=di.value; dest=out/f'download_{i}_{j}_{dl.suggested_filename or "file"}'; dl.save_as(str(dest))
                      print('DOWNLOAD_EVENT',i,j,str(dest),dest.stat().st_size,flush=True)
                    except PWTimeout:
                      try: el.click(force=True,timeout=5000)
                      except Exception: pass
                    page.wait_for_timeout(2500)
                    print('AFTER_CONTROL',i,j,page.url,[p.url for p in context.pages],flush=True)
                  except Exception as e: print('CONTROL_ERR',i,j,repr(e),flush=True)
              except Exception as e: print('BROWSER_ERR',i,u,repr(e),flush=True)
              (out/f'network_{i}.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
              page.close()
            browser.close()
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: linqingxuan-report-source-probe-20260905-v1
          path: output/
          if-no-files-found: error
          retention-days: 5
          compression-level: 6
