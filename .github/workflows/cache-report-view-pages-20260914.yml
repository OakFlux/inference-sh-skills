name: Cache public report view pages 20260914

on:
  push:
    paths:
      - '.github/workflows/cache-report-view-pages-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download pages and linked scripts
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          out=Path('report_view_assets'); out.mkdir()
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'})
          pages={
            'detail.html':'https://www.fxbaogao.com/detail/4897747',
            'view.html':'https://www.fxbaogao.com/view?id=4897747',
          }
          script_urls=[]
          for name,url in pages.items():
            r=session.get(url,timeout=60,allow_redirects=True)
            print('PAGE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
            (out/name).write_bytes(r.content)
            soup=BeautifulSoup(r.content,'html.parser')
            for s in soup.find_all('script',src=True):
              script_urls.append(urljoin(r.url,s['src']))
          for index,url in enumerate(dict.fromkeys(script_urls)):
            try:
              r=session.get(url,timeout=60)
              print('SCRIPT',index,r.status_code,len(r.content),url,flush=True)
              if r.status_code==200:
                (out/f'script_{index:03d}.js').write_bytes(r.content)
            except Exception as exc:
              print('SCRIPT_ERROR',url,repr(exc),flush=True)
          PY
      - name: Upload cached pages
        uses: actions/upload-artifact@v4
        with:
          name: report-view-assets-20260914
          path: report_view_assets/
          retention-days: 2
