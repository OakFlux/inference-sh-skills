name: Build Canadian Solar 688472 official filings ZIP v2 20260927

on:
  push:
    paths:
      - '.github/workflows/canadian-solar-688472-final-package-v2-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,re,subprocess,time,zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          STOCK='688472'
          PACKAGE='阿特斯_688472.SH_全部年报_招股说明书_最新季报'
          OUT=Path(PACKAGE); OUT.mkdir(exist_ok=True)
          VERIFY=Path('_verify'); VERIFY.mkdir(exist_ok=True)
          docs=[
            {'name':'01_阿特斯_2023年年度报告.pdf','path':'/disclosure/listedinfo/announcement/c/new/2024-04-27/688472_20240427_UD13.pdf','term':'2023年年度报告','min_pages':100,'date':'2024-04-27'},
            {'name':'02_阿特斯_2024年年度报告.pdf','path':'/disclosure/listedinfo/announcement/c/new/2025-04-29/688472_20250429_JCDA.pdf','term':'2024年年度报告','min_pages':100,'date':'2025-04-29'},
            {'name':'03_阿特斯_2025年年度报告.pdf','path':'/disclosure/listedinfo/announcement/c/new/2026-04-28/688472_20260428_28E3.pdf','term':'2025年年度报告','min_pages':100,'date':'2026-04-28'},
            {'name':'04_阿特斯_首次公开发行股票并在科创板上市招股说明书_2023-06-06.pdf','path':'/disclosure/listedinfo/announcement/c/new/2023-06-06/688472_20230606_HEGP.pdf','term':'招股说明书','min_pages':300,'date':'2023-06-06'},
            {'name':'05_阿特斯_2026年第一季度报告.pdf','path':'/disclosure/listedinfo/announcement/c/new/2026-04-28/688472_20260428_8CEA.pdf','term':'2026年第一季度报告','min_pages':8,'date':'2026-04-28'},
          ]

          s=requests.Session(); s.trust_env=False
          retry=Retry(total=5,connect=5,read=5,status=5,backoff_factor=1.2,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'])
          s.mount('https://',HTTPAdapter(max_retries=retry,pool_connections=5,pool_maxsize=5))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Accept-Encoding':'gzip, deflate'})

          # Establish an SSE query session before requesting static disclosure files.
          q='https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
          params={'isPagination':'true','productId':STOCK,'keyWord':'','securityType':'0101,120100,020100,020200,120200','reportType2':'DQBG','reportType':'','beginDate':'2023-01-01','endDate':'2026-09-27','pageHelp.pageSize':'100','pageHelp.pageCount':'50','pageHelp.pageNo':'1','pageHelp.beginPage':'1','pageHelp.cacheSize':'1','pageHelp.endPage':'5','_':str(int(time.time()*1000))}
          qr=s.get(q,params=params,headers={'Referer':f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK}','Accept':'application/json,text/javascript,*/*;q=0.8'},timeout=(30,90))
          print('SSE_SESSION',qr.status_code,len(qr.content),dict(s.cookies),flush=True); qr.raise_for_status()

          def download(doc,dest):
              variants=[
                  'https://www.sse.com.cn'+doc['path'],
                  'https://static.sse.com.cn'+doc['path'],
              ]
              errors=[]
              for url in variants:
                  for attempt in range(1,5):
                      tmp=dest.with_suffix('.pdf.part')
                      try:
                          with s.get(url,headers={'Referer':f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK}','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Accept-Encoding':'gzip, deflate'},stream=True,allow_redirects=True,timeout=(35,600)) as r:
                              print('DOWNLOAD',dest.name,attempt,r.status_code,r.headers.get('Content-Type'),r.headers.get('Content-Encoding'),url,'FINAL',r.url,flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as f:
                                  for chunk in r.iter_content(1024*1024):
                                      if chunk:f.write(chunk)
                          data=tmp.read_bytes(); print('RECEIVED',dest.name,len(data),data[:16],flush=True)
                          if len(data)<150000 or not data.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid body bytes={len(data)} head={data[:80]!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as e:
                          tmp.unlink(missing_ok=True); errors.append(f'{url} attempt {attempt}: {e!r}'); time.sleep(attempt)
              raise RuntimeError('; '.join(errors))

          records=[]; seen=set()
          for idx,doc in enumerate(docs):
              dest=OUT/doc['name']; source=download(doc,dest)
              check=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
              if check.returncode not in (0,3):raise RuntimeError(check.stderr[-1500:])
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages<doc['min_pages']:raise RuntimeError(f'{dest.name} page count {pages} < {doc["min_pages"]}')
              txt=VERIFY/f'{idx}.txt'
              subprocess.run(['pdftotext','-f','1','-l',str(min(25,pages)),str(dest),str(txt)],capture_output=True,text=True)
              compact=re.sub(r'\s+','',txt.read_text(encoding='utf-8',errors='ignore') if txt.exists() else '')
              if '阿特斯' not in compact or doc['term'] not in compact:
                  raise RuntimeError(f'text identity check failed for {dest.name}: company={"阿特斯" in compact}, term={doc["term"] in compact}')
              png=VERIFY/f'{idx}'
              rr=subprocess.run(['pdftoppm','-f','1','-l','1','-singlefile','-png','-r','90',str(dest),str(png)],capture_output=True,text=True)
              if rr.returncode or not Path(str(png)+'.png').exists() or Path(str(png)+'.png').stat().st_size<10000:raise RuntimeError(f'render failed {dest.name}')
              data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in seen:raise RuntimeError(f'duplicate {dest.name}')
              seen.add(sha)
              rec={'filename':dest.name,'announcement_date':doc['date'],'source_url':source,'pages':pages,'bytes':len(data),'sha256':sha}
              records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          readme=['阿特斯阳光电力集团股份有限公司（688472.SH）全部年报、正式招股说明书及最新季报','整理与核验日期：2026-09-27','','收录口径：上市以来全部完整年度报告（2023、2024、2025），2023-06-06正式招股说明书，以及截至整理日最新季度报告（2026年第一季度报告）。','排除文件：年度报告摘要、招股意向书、提示性公告、上市公告书和半年度报告。','来源：全部为上海证券交易所官方披露PDF原件。','核验：PDF文件头、页数、公司与期间文本、qpdf结构、首页渲染、SHA-256和ZIP CRC。','','文件清单：']
          for i,r in enumerate(records,1):
              readme += [f'{i}. {r["filename"]}',f'   公告日期：{r["announcement_date"]}',f'   页数：{r["pages"]}；大小：{r["bytes"]/1048576:.2f} MB',f'   官方来源：{r["source_url"]}',f'   SHA-256：{r["sha256"]}','']
          (OUT/'00_文件清单与官方来源.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')

          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as a:
              for p in sorted(OUT.iterdir()):a.write(p,arcname=p.name)
          with zipfile.ZipFile(z) as a:
              bad=a.testzip(); pdfs=[n for n in a.namelist() if n.lower().endswith('.pdf')]
              if bad:raise RuntimeError(f'ZIP CRC error {bad}')
              if len(pdfs)!=5:raise RuntimeError(f'ZIP PDF count {len(pdfs)}')
          print('FINAL_ZIP',z.name,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: canadian-solar-688472-official-filings-v2-20260927
          path: 阿特斯_688472.SH_全部年报_招股说明书_最新季报.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
