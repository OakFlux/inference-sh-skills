name: Package Henghe Precision filings 20261020

on:
  push:
    branches:
      - henghe-precision-filings-20261020
    paths:
      - .github/workflows/package-henghe-precision-filings-20261020.yml
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Prepare Henghe Precision packager
        run: |
          mkdir -p scripts
          curl -L --fail --retry 4 \
            https://raw.githubusercontent.com/OakFlux/inference-sh-skills/erdos-filings-20261016/scripts/package_erdos_filings_20261016.py \
            -o scripts/package_henghe_precision_filings_20261020.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/package_henghe_precision_filings_20261020.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('AS_OF = "2026-10-16"', 'AS_OF = "2026-10-20"'),
              ('FULL_COMPANY = "内蒙古鄂尔多斯资源股份有限公司"', 'FULL_COMPANY = "宁波横河精密工业股份有限公司"'),
              ('COMPANY = "鄂尔多斯"', 'COMPANY = "横河精密"'),
              ('STOCK_CODE = "600295"', 'STOCK_CODE = "300539"'),
              ('_erdos_600295_work', '_henghe_precision_300539_work'),
              ('for ann_type in ("SHA", "SH"):', 'for ann_type in ("SZSA", "SZ", "A"):'),
              (
                  'identity_ok = any(marker in normalized for marker in (COMPANY, FULL_COMPANY, STOCK_CODE, "900936"))',
                  'identity_ok = any(marker in normalized for marker in (COMPANY, FULL_COMPANY, STOCK_CODE, "横河模具", "宁波横河模具股份有限公司"))',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'Missing template token: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Download, validate, and package filings
        run: python scripts/package_henghe_precision_filings_20261020.py

      - name: Show package summary
        run: cat package_summary.json

      - name: Verify packaged PDF count
        run: |
          python - <<'PY'
          import glob, zipfile
          paths = glob.glob('横河精密_300539_2020-2025年报_最新季报_截至20261020.zip')
          assert len(paths) == 1, paths
          with zipfile.ZipFile(paths[0]) as zf:
              assert zf.testzip() is None
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              assert len(pdfs) == 7, pdfs
          print(paths[0], len(pdfs))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: henghe-precision-300539-filings-20261020
          path: |
            横河精密_300539_2020-2025年报_最新季报_截至20261020.zip
            package_summary.json
          if-no-files-found: error
          retention-days: 30
