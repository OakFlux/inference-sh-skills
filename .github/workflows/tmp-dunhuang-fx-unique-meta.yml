name: Temporary Dunhuang unique phrase metadata query

on:
  push:
    branches:
      - 'tmp/dunhuang-fx-unique-meta-20260829'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query unique title phrases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python -m pip install --disable-pip-version-check requests
          cat > /tmp/unique.py <<'PY'
          import json,re,time
          from pathlib import Path
          import requests
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/rp','Content-Type':'application/json;charset=UTF-8'})
          API='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          phrases=['先玉高增','敦煌先锋产销激增','敦煌先锋持续快速扩张','并购打开成长空间','政策春风','打消悲观预期','先锋系列继续扩张','借力政策','进一步聚焦种业','公司迎来快速发展','敦煌先锋业绩快速增长']
          out=[]
          for i,q in enumerate(phrases):
            obj=None
            for attempt in range(6):
              r=S.post(API,json={'keywords':q,'pageNum':1,'pageSize':20},timeout=60)
              try: obj=r.json()
              except: obj={'raw':r.text[:1000]}
              if obj.get('code')==1025:
                time.sleep(8+attempt*3);continue
              break
            rows=(obj.get('data') or {}).get('dataList') or []
            simp=[]
            for x in rows:
              title=re.sub('<[^>]+>','',x.get('title') or '')
              simp.append({k:x.get(k) for k in ('docId','pdfPath','pageNum','orgName','isDeep','isNotBroker','reportType','pubTime')} | {'title':title,'stocks':x.get('stocks')})
            out.append({'query':q,'code':obj.get('code'),'count':(obj.get('data') or {}).get('count'),'rows':simp})
            print('QUERY',q,'CODE',obj.get('code'),'COUNT',(obj.get('data') or {}).get('count'),'ROWS',len(simp))
            for x in simp: print(json.dumps(x,ensure_ascii=False))
            time.sleep(1.5)
          Path('diagnostics/unique.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/unique.py
      - uses: actions/upload-artifact@v4
        with:
          name: dunhuang-fx-unique-meta
          path: diagnostics/
          retention-days: 2
          compression-level: 9
