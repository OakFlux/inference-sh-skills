name: Temporary Jinmei Technology public report metadata discovery

on:
  push:
    branches:
      - tmp/download-jinmei-tech-reports-20260830
    paths:
      - .github/workflows/tmp-jinmei-tech-sdy-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Search Sdyanbao public report metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests

          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
              'Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'
          })
          queries=['丹化科技','600844','金煤科技','通辽金煤','煤制乙二醇 丹化科技']
          seen=set(); matches=[]
          for q in queries:
              for page in range(1,15):
                  payload={
                      'device':1,'hideTrader':0,'onlyTitle':0,'order':0,
                      'page':page,'pageSize':100,'keyword':q,'pageCount':0,
                      'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]
                  }
                  r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=90)
                  print('API',q,page,r.status_code,len(r.content))
                  r.raise_for_status(); data=(r.json().get('data') or {}); files=data.get('files') or []
                  print('COUNT',len(files),'TOTAL',data.get('total'))
                  if not files: break
                  for f in files:
                      fid=f.get('id')
                      if fid in seen: continue
                      seen.add(fid)
                      stock=f.get('stock') or {}
                      name=str(f.get('name') or '')
                      content=str(f.get('content') or '')[:2500]
                      blob=' '.join([name,str(stock.get('name') or ''),str(stock.get('code') or ''),content])
                      exact=('丹化科技' in blob or '金煤科技' in blob or '600844' in blob or '通辽金煤' in blob)
                      if exact:
                          row={
                              'id':fid,'name':name,'date':f.get('time_text'),'pages':f.get('page_count'),
                              'size':f.get('file_size'),'type':(f.get('type') or {}).get('name'),
                              'organization':(f.get('organization') or {}).get('name'),'stock':stock,
                              'uuid':f.get('data_source_uuid'),'data_source':f.get('data_source'),
                              'original_id':f.get('original_id'),'page_url':f.get('page_url'),
                              'share_url':f.get('share_url'),'summary':str(f.get('summary') or '')[:800]
                          }
                          matches.append(row)
                          print('MATCH',json.dumps(row,ensure_ascii=False))
                  if page*100>=int(data.get('total') or 0): break
          print('\nSORTED_MATCHES',len(matches))
          for row in sorted(matches,key=lambda x:(str(x.get('date') or ''),int(x.get('pages') or 0)),reverse=True):
              print('SORTED',json.dumps(row,ensure_ascii=False))
          PY
