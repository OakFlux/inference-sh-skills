name: Scan FxBaogao Ren Zixing Huajin
on:
  push:
    paths:
      - '.github/workflows/scan_fxbaogao_renzixing_huajin_20261004.yml'
      - 'tools/scan_fxbaogao_renzixing_huajin_20261004.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/scan_fxbaogao_renzixing_huajin_20261004.py
      - uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-renzixing-huajin-scan
          path: fxbaogao_renzixing_huajin_scan.json
          if-no-files-found: error
          retention-days: 3
