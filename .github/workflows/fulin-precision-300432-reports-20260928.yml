name: Build Fulin Precision 300432 reports ZIP 20260928

on:
  push:
    paths:
      - '.github/workflows/fulin-precision-300432-reports-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          STOCK = '300432'
          COMPANY = '富临精工'
          AS_OF = '2026-09-28'
          PACKAGE_NAME = '富临精工_300432.SZ_2020-2025年报及最新季报'
          OUT = Path(PACKAGE_NAME)
          OUT.mkdir(parents=True, exist_ok=True)
          VERIFY = Path('_verify')
          VERIFY.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=6,
              connect=6,
              read=6,
              status=6,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept-Encoding': 'identity',
              'Referer': f'https://data.eastmoney.com/notices/stock/{STOCK}.html',
          })

          def clean_title(value: str) -> str:
              value = re.sub(r'<[^>]+>', '', value or '')
              value = value.replace('&nbsp;', '').replace('&#32;', '')
              return re.sub(r'\s+', '', value)

          def get_page(page: int) -> list[dict]:
              endpoint = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
              params = {
                  'page_size': 100,
                  'page_index': page,
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': STOCK,
              }
              errors = []
              for attempt in range(1, 7):
                  try:
                      response = session.get(endpoint, params=params, timeout=(30, 150))
                      print('ANNOUNCEMENT_API', page, 'attempt', attempt, response.status_code, len(response.content), flush=True)
                      response.raise_for_status()
                      payload = response.json()
                      data = payload.get('data') or {}
                      return data.get('list') or data.get('data') or payload.get('list') or []
                  except Exception as exc:
                      errors.append(repr(exc))
                      time.sleep(attempt * 1.5)
              raise RuntimeError(f'公告接口第{page}页连续失败：{errors}')

          rows: list[dict] = []
          for page in range(1, 21):
              batch = get_page(page)
              if not batch:
                  break
              rows.extend(batch)
              if len(batch) < 100:
                  break
              time.sleep(0.2)

          print('TOTAL_ANNOUNCEMENTS', len(rows), flush=True)
          if not rows:
              raise RuntimeError('公告接口未返回数据')

          normalized = []
          seen_codes = set()
          for row in rows:
              title = clean_title(str(row.get('title') or row.get('notice_title') or row.get('announcement_title') or ''))
              art_code = str(row.get('art_code') or row.get('info_code') or row.get('infoCode') or row.get('announcement_id') or '')
              notice_date = str(row.get('notice_date') or row.get('display_time') or row.get('date') or '')
              if title and art_code and art_code not in seen_codes:
                  seen_codes.add(art_code)
                  normalized.append({'title': title, 'art_code': art_code, 'notice_date': notice_date})

          exclusions = (
              '摘要', '英文版', '英文', '审计报告', '鉴证报告', '内部控制', '社会责任',
              'ESG', '董事会工作', '监事会工作', '监管工作函', '问询函', '回复',
              '核查意见', '提示性公告', '取消', '业绩快报', '业绩预告', '更正公告',
              '财务决算报告', '专项说明', '募集资金', '董事会决议', '监事会决议',
          )

          def date_key(item: dict) -> str:
              return re.sub(r'\D', '', item.get('notice_date', ''))

          def full_report(title: str) -> bool:
              return not any(term in title for term in exclusions)

          selected_docs = []
          for year in range(2020, 2026):
              candidates = []
              for item in normalized:
                  title = item['title']
                  if f'{year}年年度报告' not in title and f'{year}年度报告' not in title:
                      continue
                  if not full_report(title):
                      continue
                  score = 0
                  if re.fullmatch(rf'.*{year}年年度报告', title) or re.fullmatch(rf'.*{year}年度报告', title):
                      score += 100
                  if any(x in title for x in ('修订版', '修订', '更新后', '更新')):
                      score += 25
                  candidates.append({**item, '_score': score})
              candidates.sort(key=lambda x: (x['_score'], date_key(x)), reverse=True)
              if not candidates:
                  related = [x['title'] for x in normalized if str(year) in x['title'] and '年度报告' in x['title']]
                  raise RuntimeError(f'未找到{year}年完整年度报告；相关标题：{related[:30]}')
              selected_docs.append({
                  'filename': f'{year - 2019:02d}_{COMPANY}_{STOCK}_{year}年年度报告.pdf',
                  'title': f'{COMPANY}{year}年年度报告',
                  'period': f'{year}年度',
                  'expected_terms': [COMPANY, str(year), '年度报告'],
                  'min_pages': 80,
                  'min_bytes': 500_000,
                  'announcement': candidates[0],
              })

          quarter_pattern = re.compile(r'2026年(?:第一|第三|一|三)季度报告')
          quarter_candidates = []
          for item in normalized:
              title = item['title']
              if not quarter_pattern.search(title) or not full_report(title):
                  continue
              if '半年度报告' in title or '中期报告' in title:
                  continue
              score = 100 if re.fullmatch(r'.*2026年(?:第一|第三|一|三)季度报告', title) else 0
              quarter_candidates.append({**item, '_score': score})
          quarter_candidates.sort(key=lambda x: (date_key(x), x['_score']), reverse=True)
          if not quarter_candidates:
              related = [x['title'] for x in normalized if '2026' in x['title'] and '季度报告' in x['title']]
              raise RuntimeError(f'未找到2026年正式季度报告；相关标题：{related[:30]}')

          quarter = quarter_candidates[0]
          qmatch = re.search(r'2026年(第一|第三|一|三)季度报告', quarter['title'])
          qword = qmatch.group(1)
          qcanonical = '第一' if qword in ('第一', '一') else '第三'
          selected_docs.append({
              'filename': f'07_{COMPANY}_{STOCK}_2026年{qcanonical}季度报告.pdf',
              'title': f'{COMPANY}2026年{qcanonical}季度报告',
              'period': f'2026年{qcanonical}季度',
              'expected_terms': [COMPANY, '2026', '季度报告'],
              'min_pages': 6,
              'min_bytes': 80_000,
              'announcement': quarter,
          })

          print('SELECTED', json.dumps([
              {'title': d['title'], 'announcement_title': d['announcement']['title'], 'art_code': d['announcement']['art_code'], 'date': d['announcement']['notice_date']}
              for d in selected_docs
          ], ensure_ascii=False, indent=2), flush=True)

          def mirror_urls(code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{code}_1.pdf',
              ]

          def download_pdf(doc: dict, dest: Path) -> str:
              errors = []
              for url in mirror_urls(doc['announcement']['art_code']):
                  for attempt in range(1, 6):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(
                              url,
                              headers={'Referer': 'https://data.eastmoney.com/', 'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 600),
                          ) as response:
                              print('DOWNLOAD', dest.name, attempt, response.status_code, response.headers.get('Content-Length'), url, flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as handle:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as handle:
                              header = handle.read(8)
                          if size < doc['min_bytes'] or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF size={size}, header={header!r}')
                          tmp.replace(dest)
                          return url
                      except Exception as exc:
                          tmp.unlink(missing_ok=True)
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt)
              raise RuntimeError(f'{dest.name}下载失败：{errors}')

          records = []
          seen_hashes = set()
          for index, doc in enumerate(selected_docs, start=1):
              dest = OUT / doc['filename']
              source_url = download_pdf(doc, dest)

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf结构检查失败：{dest.name}\n{check.stderr[-1500:]}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'页数异常：{dest.name}仅{pages}页')

              text_path = VERIFY / f'{index:02d}.txt'
              extraction = subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(30, pages)), str(dest), str(text_path)],
                  capture_output=True,
                  text=True,
              )
              sample = text_path.read_text(encoding='utf-8', errors='ignore') if text_path.exists() else ''
              compact = re.sub(r'\s+', '', sample)
              missing = [term for term in doc['expected_terms'] if term not in compact]
              if missing:
                  raise RuntimeError(f'文件身份文本检查失败：{dest.name}，缺少{missing}；pdftotext={extraction.returncode}')

              render_prefix = VERIFY / f'{index:02d}_page1'
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '90', str(dest), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              png = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not png.exists() or png.stat().st_size < 10_000:
                  raise RuntimeError(f'首页渲染失败：{dest.name}')

              data = dest.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'检测到重复PDF：{dest.name}')
              seen_hashes.add(digest)

              ann = doc['announcement']
              record = {
                  'filename': dest.name,
                  'title': doc['title'],
                  'period': doc['period'],
                  'announcement_title': ann['title'],
                  'announcement_date': ann['notice_date'],
                  'art_code': ann['art_code'],
                  'announcement_page': f'https://data.eastmoney.com/notices/detail/{STOCK}/{ann["art_code"]}.html',
                  'pdf_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 7:
              raise RuntimeError(f'应有7份PDF，实际为{len(records)}份')

          readme = [
              f'{COMPANY}（{STOCK}.SZ）2020-2025年年度报告及最新季报',
              f'整理与核验日期：{AS_OF}',
              '',
              '收录内容：2020—2025年度完整年度报告6份，以及截至整理日最新的正式季度报告1份。',
              f'最新季报：{records[-1]["title"]}。',
              '已排除年度报告摘要、英文版、单独审计附件、内部控制报告、业绩快报、问询回复和半年度报告。',
              '公告标题与日期通过公开公告接口核对，PDF为公告原件镜像。',
              '已执行PDF文件头、文件大小、页数、公司与报告期文本、qpdf结构、首页渲染、SHA-256和ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f'{i}. {rec["title"]}',
                  f'   文件：{rec["filename"]}',
                  f'   公告标题：{rec["announcement_title"]}',
                  f'   公告日期：{rec["announcement_date"]}',
                  f'   页数：{rec["pages"]}；大小：{rec["bytes"] / 1048576:.2f} MB',
                  f'   公告页面：{rec["announcement_page"]}',
                  f'   PDF地址：{rec["pdf_url"]}',
                  f'   SHA-256：{rec["sha256"]}',
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE_NAME + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC检查失败：{bad}')
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 7:
                  raise RuntimeError(f'ZIP内PDF数量异常：{len(pdf_names)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fulin-precision-300432-reports-20260928
          path: 富临精工_300432.SZ_2020-2025年报及最新季报.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
