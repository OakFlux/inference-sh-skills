name: Build Xiaoxiong 002959 reports package 20261004
on:
  push:
    paths:
      - '.github/workflows/xiaoxiong-002959-reports-package-20261004.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        run: python scripts/build_xiaoxiong_002959_reports_package_20261004.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxiong-002959-2020-2025-annual-and-2026-latest-reports
          path: 小熊电器_002959_2020-2025年报及2026最新定期报告.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
