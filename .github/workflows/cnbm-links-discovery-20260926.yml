name: Discover CNBM annual and periodic report PDF links 20260926
on:
  push:
    paths:
      - '.github/workflows/cnbm-links-discovery-20260926.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Discover report links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session(); s.trust_env = False
          H = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          }

          urls = {
              'annual_2025': 'https://www.cnbmltd.com/art/2026/3/31/art_1193_79450.html',
              'annual_2024': 'https://www.cnbmltd.com/art/2025/4/9/art_1356_78731.html',
              'annual_2023': 'https://www.cnbmltd.com/art/2024/3/28/art_1356_78357.html',
              'annual_2022': 'https://www.cnbmltd.com/art/2023/4/4/art_1356_77764.html',
              'annual_2021_en': 'https://www.cnbmltd.com/art/2023/1/30/art_1379_77616.html',
              'annual_2020': 'https://www.cnbmltd.com/art/2021/4/8/art_1193_74772.html',
              'annual_index': 'https://www.cnbmltd.com/col/col1355/index.html',
              'periodic_index': 'https://www.cnbmltd.com/col/col1193/index.html',
              'q1_2026_mirror': 'https://financialfilings.com/filings/china-national-building-material-company-limited/interim-quarterly-report/2026/38625591/',
              'interim_2026_mirror': 'https://financialfilings.com/filings/china-national-building-material-company-limited/interim-quarterly-report/2026/57766457/',
          }

          def fetch(label, url):
              errs=[]
              for attempt in range(1, 6):
                  try:
                      r=s.get(url,headers=H,timeout=(15,90),allow_redirects=True)
                      print('FETCH',label,attempt,r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
                      r.raise_for_status()
                      return r
                  except Exception as e:
                      errs.append(repr(e)); time.sleep(attempt*2)
              return None

          out={}
          for label,url in urls.items():
              r=fetch(label,url)
              if r is None:
                  out[label]={'url':url,'error':'fetch_failed'}
                  continue
              ctype=r.headers.get('content-type','')
              entry={'url':url,'final_url':r.url,'status':r.status_code,'content_type':ctype,'bytes':len(r.content),'links':[]}
              if 'html' in ctype or r.content[:100].lstrip().startswith(b'<'):
                  enc=r.apparent_encoding or r.encoding or 'utf-8'
                  text=r.content.decode(enc,errors='replace')
                  soup=BeautifulSoup(text,'html.parser')
                  seen=set()
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a.get('href'))
                      txt=' '.join(a.get_text(' ',strip=True).split())
                      if href in seen: continue
                      seen.add(href)
                      if any(k in href.lower() for k in ('.pdf','download','attach','upload','module')) or any(k in txt.lower() for k in ('年度报告','annual report','第一季度','quarter','中期报告','interim')):
                          entry['links'].append({'text':txt,'href':href})
                  entry['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                  entry['text_head']=' '.join(soup.get_text(' ',strip=True).split())[:1500]
              out[label]=entry
              print('RESULT',label,json.dumps(entry,ensure_ascii=False)[:12000],flush=True)

          # Crawl a few index pages to locate all annual-report article pages.
          crawled=[]
          for base_label,base in [('annual_index','https://www.cnbmltd.com/col/col1355/index.html'),('periodic_index','https://www.cnbmltd.com/col/col1193/index.html')]:
              for page in range(0,16):
                  candidates=[base if page==0 else base.replace('index.html',f'index_{page}.html'), base + ('' if page==0 else f'?pageNum={page}')]
                  got=None
                  for u in candidates:
                      r=fetch(f'{base_label}_{page}',u)
                      if r is not None and len(r.content)>500:
                          got=r; break
                  if got is None: continue
                  enc=got.apparent_encoding or got.encoding or 'utf-8'
                  soup=BeautifulSoup(got.content.decode(enc,errors='replace'),'html.parser')
                  rows=[]
                  for a in soup.find_all('a',href=True):
                      txt=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(got.url,a['href'])
                      if re.search(r'20(?:20|21|22|23|24|25|26)',txt) or any(k in txt for k in ('年度报告','第一季度报告','半年度报告','中期报告')):
                          rows.append({'text':txt,'href':href})
                  if rows:
                      crawled.append({'label':base_label,'page':page,'url':got.url,'rows':rows})
                      print('CRAWL',base_label,page,json.dumps(rows,ensure_ascii=False)[:10000],flush=True)
          out['crawled']=crawled
          Path('cnbm_link_discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cnbm-link-discovery-20260926
          path: cnbm_link_discovery.json
          retention-days: 7
