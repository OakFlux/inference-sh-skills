name: Temporary Mingyang Smart Energy broker report metadata discovery

on:
  push:
    branches:
      - 'tmp/mingyang-smart-meta-20260830'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch and rank broker report metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          for page in 1 2 3; do
            curl --http1.1 --location --fail --silent --show-error \
              --retry 7 --retry-all-errors --retry-delay 1 \
              --connect-timeout 20 --max-time 180 \
              --user-agent "$UA" \
              --referer 'https://data.eastmoney.com/report/601615.html' \
              --header 'Accept-Encoding: identity' \
              --get 'https://reportapi.eastmoney.com/report/list' \
              --data-urlencode 'industryCode=*' \
              --data-urlencode 'pageSize=100' \
              --data-urlencode 'industry=*' \
              --data-urlencode 'rating=*' \
              --data-urlencode 'ratingChange=*' \
              --data-urlencode 'beginTime=2018-01-01' \
              --data-urlencode 'endTime=2026-08-30' \
              --data-urlencode "pageNo=$page" \
              --data-urlencode 'fields=' \
              --data-urlencode 'qType=0' \
              --data-urlencode 'orgCode=' \
              --data-urlencode 'code=601615' \
              --data-urlencode 'rcode=' \
              --data-urlencode "p=$page" \
              --data-urlencode "pageNum=$page" \
              --data-urlencode "pageNumber=$page" \
              --output "diagnostics/raw_${page}.txt"
          done
          python - <<'PY'
          import json,re
          from pathlib import Path

          rows=[]; seen=set()
          for p in sorted(Path('diagnostics').glob('raw_*.txt')):
              text=p.read_text(encoding='utf-8',errors='ignore').strip()
              if text and text[0] not in '[{' and '(' in text and text.endswith(')'):
                  text=text[text.find('(')+1:text.rfind(')')]
              obj=json.loads(text)
              data=obj.get('data') or obj.get('result',{}).get('data') or []
              for r in data:
                  c=str(r.get('infoCode') or r.get('infocode') or r.get('info_code') or '')
                  if c and c not in seen:
                      seen.add(c); rows.append(r)
              if len(data)<100:
                  break

          def t(r): return str(r.get('title') or r.get('reportTitle') or '')
          def b(r): return str(r.get('orgSName') or r.get('orgName') or '')
          def d(r):
              x=str(r.get('publishDate') or r.get('publishTime') or '')
              m=re.search(r'20\d{2}-\d{2}-\d{2}',x); return m.group(0) if m else x[:10]
          def c(r): return str(r.get('infoCode') or r.get('infocode') or r.get('info_code') or '')

          pos=['深度','首次覆盖','公司深度','海上风电','风机龙头','风电龙头','风光储氢','大型化','漂浮式','海外','出海','新能源电站','滚动开发','风机制造','海风','成长空间','困境反转','全球龙头','海陆并进','双轮驱动','海上风机']
          neg=['一季报点评','中报点评','半年报点评','年报点评','三季报点评','季报点评','业绩点评','事件点评','公告点评','点评报告','业绩快报','公司信息更新','简评','业绩预告点评','定期报告点评']
          def sc(r):
              x=re.sub(r'\s+','',t(r)); v=0
              if '深度' in x:v+=500
              if '首次覆盖' in x:v+=500
              if '公司深度' in x:v+=180
              v+=sum(70 for k in pos if re.sub(r'\s+','',k) in x)
              v-=sum(300 for k in neg if re.sub(r'\s+','',k) in x)
              try:y=int(d(r)[:4])
              except:y=0
              v+={2026:110,2025:90,2024:75,2023:60,2022:50,2021:40,2020:30,2019:20,2018:10}.get(y,0)
              return v

          out=sorted([{'score':sc(r),'date':d(r),'broker':b(r),'title':t(r),'infoCode':c(r)} for r in rows],key=lambda x:(x['score'],x['date']),reverse=True)
          Path('diagnostics/candidates.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(rows))
          for x in out[:120]: print(json.dumps(x,ensure_ascii=False))
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: mingyang-smart-report-metadata
          path: diagnostics/candidates.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
