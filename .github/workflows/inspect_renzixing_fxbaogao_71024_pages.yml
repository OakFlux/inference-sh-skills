name: Inspect Renzixing FxBaogao pages
on:
  push:
    paths:
      - '.github/workflows/inspect_renzixing_fxbaogao_71024_pages.yml'
      - 'tools/inspect_renzixing_fxbaogao_71024_pages.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: python tools/inspect_renzixing_fxbaogao_71024_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: renzixing-fxbaogao-71024-pages
          path: renzixing_fxbaogao_71024_pages.json
          if-no-files-found: error
          retention-days: 3
