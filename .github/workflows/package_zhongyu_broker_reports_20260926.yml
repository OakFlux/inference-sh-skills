name: Package Zhongyu Energy broker research reports

on:
  push:
    paths:
      - '.github/workflows/package_zhongyu_broker_reports_20260926.yml'
      - 'tools/zhongyu_broker_package.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install browser and PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Capture validate and package public broker materials
        run: python tools/zhongyu_broker_package.py

      - name: Upload package and visual previews
        uses: actions/upload-artifact@v4
        with:
          name: zhongyu-energy-broker-reports-20260926
          path: |
            中裕能源_03633_券商深度报告_2份.zip
            _previews/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
