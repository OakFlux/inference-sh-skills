name: Temporary verified Roshow Technology broker report package

on:
  push:
    branches:
      - tmp/download-roshow-reports-20260829
    paths:
      - .github/workflows/tmp-roshow-download.yml

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download and verify original PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previews
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'

          download_pdf() {
            local url="$1"
            local dest="$2"
            local pages="$3"
            local expected="$4"
            local stem="$5"
            curl -L --fail --retry 6 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 --max-time 600 --compressed \
              -A "$UA" -e 'https://data.eastmoney.com/report/' \
              -H 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8' \
              "$url" -o "output/$dest"
            test -s "output/$dest"
            test "$(head -c 4 "output/$dest")" = '%PDF'
            actual=$(pdfinfo "output/$dest" | awk '/^Pages:/ {print $2}')
            test "$actual" -eq "$pages"
            pdftotext -f 1 -l 3 "output/$dest" "previews/${stem}_text.txt"
            grep -q "$expected" "previews/${stem}_text.txt"
            pdftoppm -f 1 -singlefile -png -r 110 "output/$dest" "previews/${stem}_first" >/dev/null 2>&1
            pdftoppm -f "$pages" -singlefile -png -r 110 "output/$dest" "previews/${stem}_last" >/dev/null 2>&1
            test -s "previews/${stem}_first.png"
            test -s "previews/${stem}_last.png"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202503121644304825_1.pdf' \
            '01_Minsheng_Securities_Roshow_Technology_Deep_Report_20250312_21p.pdf' \
            21 '跨界布局高成长的铜连接赛道' 'minsheng_20250312'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202505161673738476_1.pdf' \
            '02_Minsheng_Securities_Roshow_Technology_Update_20250516_14p.pdf' \
            14 '登高机驱动24年业绩高增' 'minsheng_20250516'

          cat > output/报告清单与核验说明.txt <<'EOF'
          露笑科技（002617.SZ）券商研究报告，共2份

          1. 民生证券，2025-03-12，21页
             《公司动态报告：跨界布局高成长的铜连接赛道，搭上AI发展快车》
             类型：深度研究/首次评级；系统梳理漆包线、光伏发电、登高机、碳化硅和铜连接业务。

          2. 民生证券，2025-05-16，14页
             《登高机驱动24年业绩高增，铜连接订单取得新突破》
             类型：公司动态跟踪；更新2024年年报、2025年一季报和铜连接业务进展。

          两份均为原始、完整、可检索PDF，不是网页正文、摘要或预览页重制文件。
          已核验PDF文件头、实际页数、首页标题文字，并成功渲染首页与末页。
          仅供研究资料整理，不构成投资建议。
          EOF

          (cd output && sha256sum ./*.pdf > SHA256SUMS.txt)
          ls -lh output previews

      - name: Upload verified original reports
        uses: actions/upload-artifact@v4
        with:
          name: roshow-technology-broker-reports-2
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
