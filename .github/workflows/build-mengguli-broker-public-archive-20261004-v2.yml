name: Build Mengguli archive and probe Longban reports

on:
  push:
    paths:
      - '.github/workflows/build-mengguli-broker-public-archive-20261004-v2.yml'
      - 'scripts/probe_longban_605577_reports_20261004.py'
  workflow_dispatch:

jobs:
  probe-longban:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Probe public research-report sources
        run: python scripts/probe_longban_605577_reports_20261004.py
