name: Build targeted Longban Media research archive v2

on:
  push:
    paths:
      - '.github/workflows/build-mengguli-broker-public-archive-20261004-v2.yml'
      - 'scripts/build_longban_broker_archive_targeted_v2_20261004.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf img2pdf reportlab
      - name: Download archive validate and package reports
        run: python scripts/build_longban_broker_archive_targeted_v2_20261004.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: longban-605577-research-archive-20261004-v2
          path: 龙版传媒_605577_券商研究报告_3份_公开资料存档版_2026-10-04.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
