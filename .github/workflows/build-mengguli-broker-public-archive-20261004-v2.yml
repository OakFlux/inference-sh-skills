name: Build Longban Media broker report package

on:
  push:
    paths:
      - '.github/workflows/build-mengguli-broker-public-archive-20261004-v2.yml'
      - 'scripts/build_longban_605577_broker_reports_20261004.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        run: python scripts/build_longban_605577_broker_reports_20261004.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: longban-605577-broker-reports-20261004
          path: 龙版传媒_605577_券商深度报告_公开原始PDF_截至2026-10-04.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
