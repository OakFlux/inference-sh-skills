name: Discover Longban Media broker reports

on:
  push:
    paths:
      - '.github/workflows/build-mengguli-broker-public-archive-20261004-v2.yml'
      - 'scripts/discover_longban_reports_20261004.py'
  workflow_dispatch:

jobs:
  discover-longban:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Discover reports and public page sources
        run: python scripts/discover_longban_reports_20261004.py
