name: Enumerate and test Zhongsheng broker report PDFs

on:
  push:
    paths:
      - '.github/workflows/zhongsheng-candidate-enumeration-20260904-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Enumerate metadata and test direct PDF paths
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          from __future__ import annotations
          import json,re,time
          from datetime import datetime,timezone
          from io import BytesIO
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          API='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          S=requests.Session(); S.trust_env=False
          H={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Content-Type':'application/json;charset=UTF-8','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','x-fp':'','x-bot':''}

          def post(payload):
            last=None
            for a in range(4):
              try:
                r=S.post(API,headers=H,json=payload,timeout=(15,60)); print('POST',payload,r.status_code,len(r.content),flush=True)
                r.raise_for_status(); return r.json()
              except Exception as e: last=e; time.sleep(a+1)
            raise last

          allrows=[]; seen=set()
          # First try targeted phrases, then paginate the broad company search.
          targeted=['汽车经销商龙头基本面或见底反转','中升控股 首次覆盖','中升控股 公司深度','发力汽车后市场的汽车经销商龙头','中升控股 海通证券']
          for kw in targeted:
            for payload in [
              {'keywords':kw,'pageNum':1,'pageSize':100,'order':0},
              {'keywords':kw,'page':1,'limit':100,'order':0},
            ]:
              try:
                obj=post(payload); data=obj.get('data') or {}; rows=data.get('dataList') if isinstance(data,dict) else data
                for row in rows or []:
                  k=str(row.get('docId') or row.get('id') or json.dumps(row,sort_keys=True,ensure_ascii=False))
                  if k not in seen: seen.add(k); allrows.append(row)
              except Exception as e: print('TARGET_ERROR',kw,repr(e),flush=True)

          # Determine a pagination shape that actually changes pages.
          pagination_shapes=[
            lambda p:{'keywords':'中升控股','pageNum':p,'pageSize':20,'order':0},
            lambda p:{'keywords':'中升控股','currPage':p,'limit':20,'order':0},
            lambda p:{'keywords':'中升控股','page':p,'limit':20,'order':0},
            lambda p:{'keywords':'中升控股','pageIndex':p,'pageSize':20,'order':0},
          ]
          chosen=None
          for idx,shape in enumerate(pagination_shapes):
            try:
              o1=post(shape(1)); o2=post(shape(2))
              d1=o1.get('data') or {}; d2=o2.get('data') or {}
              r1=d1.get('dataList') if isinstance(d1,dict) else d1; r2=d2.get('dataList') if isinstance(d2,dict) else d2
              ids1=[x.get('docId') for x in (r1 or [])[:5]]; ids2=[x.get('docId') for x in (r2 or [])[:5]]
              print('PAGINATION_TEST',idx,ids1,ids2,flush=True)
              if ids1 and ids2 and ids1!=ids2: chosen=shape; break
            except Exception as e: print('PAGINATION_ERROR',idx,repr(e),flush=True)
          if chosen:
            first=post(chosen(1)); data=first.get('data') or {}; total=int(data.get('pageCount') or 35)
            for p in range(1,min(total,60)+1):
              try:
                obj=post(chosen(p)); d=obj.get('data') or {}; rows=d.get('dataList') if isinstance(d,dict) else d
                print('PAGE',p,'/',total,'ROWS',len(rows or []),'FIRST',[x.get('docId') for x in (rows or [])[:3]],flush=True)
                for row in rows or []:
                  k=str(row.get('docId') or row.get('id') or json.dumps(row,sort_keys=True,ensure_ascii=False))
                  if k not in seen: seen.add(k); allrows.append(row)
              except Exception as e: print('PAGE_ERROR',p,repr(e),flush=True)
          else:
            print('NO_WORKING_PAGINATION',flush=True)

          candidates=[]
          for row in allrows:
            title=re.sub(r'</?em>','',str(row.get('title') or ''),flags=re.I)
            pages=int(row.get('pageNum') or 0)
            stocks=json.dumps(row.get('stocks') or [],ensure_ascii=False)
            doc_type=int(row.get('docType') if row.get('docType') is not None else -1)
            report_type=int(row.get('reportType') if row.get('reportType') is not None else -1)
            org=str(row.get('orgName') or '')
            ts=int(row.get('pubTime') or 0)
            date=datetime.fromtimestamp(ts,tz=timezone.utc).strftime('%Y-%m-%d') if ts else ''
            company=('00881' in stocks or '中升控股' in title or '中升控股' in re.sub(r'<[^>]+>','',stocks))
            broker=(doc_type==1 or report_type==11) and org not in ('港股财报','财报','未知机构','')
            deep=(pages>=15 or bool(row.get('isDeep')) or any(x in title for x in ('深度','首次覆盖','交接覆盖'))
            if company and broker and deep:
              candidates.append({'docId':str(row.get('docId')),'title':title,'org':org,'date':date,'pages':pages,'pdfPath':row.get('pdfPath'),'docType':doc_type,'reportType':report_type,'isDeep':row.get('isDeep'),'authors':row.get('authors')})
          candidates.sort(key=lambda x:(x['pages'],x['date']),reverse=True)
          print('\nCANDIDATES',len(candidates),json.dumps(candidates,ensure_ascii=False,indent=2),flush=True)

          accessible=[]
          for c in candidates:
            path=str(c.get('pdfPath') or '').strip()
            if not path: continue
            urls=[]
            if path.startswith('http'): urls.append(path)
            else:
              rel=path.lstrip('/')
              for host in ('https://public.fxbaogao.com/','https://report.fxbaogao.com/','https://oss-buy.hufangde.com/','https://dr.fxbaogao.com/'):
                urls.append(host+rel)
            for u in urls:
              try:
                r=S.get(u,headers={'User-Agent':UA,'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Referer':f"https://www.fxbaogao.com/detail/{c['docId']}"},timeout=(15,60),allow_redirects=True)
                print('PDF_TEST',c['docId'],u,r.status_code,r.headers.get('content-type'),len(r.content),r.url,r.content[:8],flush=True)
                if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100000:
                  rd=PdfReader(BytesIO(r.content),strict=False); actual=len(rd.pages)
                  print('PDF_VALID',c['docId'],actual,len(r.content),r.url,flush=True)
                  accessible.append({**c,'actualPages':actual,'bytes':len(r.content),'url':r.url})
                  break
              except Exception as e: print('PDF_ERROR',c['docId'],u,repr(e),flush=True)
          result={'row_count':len(allrows),'candidates':candidates,'accessible':accessible}
          Path('zhongsheng_candidates.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT',json.dumps(result,ensure_ascii=False),flush=True)
          PY

      - name: Upload candidate inventory
        uses: actions/upload-artifact@v4
        with:
          name: zhongsheng-candidate-inventory-20260904
          path: zhongsheng_candidates.json
          if-no-files-found: error
          retention-days: 7
