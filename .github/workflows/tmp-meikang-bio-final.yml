name: Temporary Meikang Biotech final broker reports package

on:
  push:
    branches:
      - 'tmp/meikang-bio-final-20260829'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Download, validate and package two original reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reports diagnostics
          cat > /tmp/package_meikang.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          from pypdf import PdfReader

          DIST = Path('dist')
          REPORTS = DIST / 'reports'
          DIAG = Path('diagnostics')
          REPORTS.mkdir(parents=True, exist_ok=True)
          DIAG.mkdir(parents=True, exist_ok=True)
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'

          items = [
              {
                  'infoCode': 'AP201804261130680967',
                  'date': '2018-04-26',
                  'broker': '国金证券',
                  'title': '具备产品和服务双线竞争力的优秀体外诊断企业',
                  'expected_pages': 16,
                  'type': '长篇公司深度报告',
              },
              {
                  'infoCode': 'AP201804201127028078',
                  'date': '2018-04-20',
                  'broker': '西南证券',
                  'title': '渠道扩张+区域检验中心，驱动公司高速增长',
                  'expected_pages': 6,
                  'type': '完整公司研究报告',
              },
          ]

          def safe(value: str, limit: int = 72) -> str:
              value = re.sub(r'[\\/:*?"<>|\r\n]+', '_', value)
              value = re.sub(r'\s+', '', value).strip(' ._')
              return (value or '报告')[:limit]

          def fetch_pdf(url: str, dest: Path, referer: str) -> tuple[bool, str]:
              dest.unlink(missing_ok=True)
              proc = subprocess.run([
                  'curl', '--http1.1', '--location', '--fail', '--silent', '--show-error',
                  '--retry', '6', '--retry-all-errors', '--retry-delay', '1',
                  '--connect-timeout', '20', '--max-time', '240',
                  '--user-agent', UA, '--referer', referer,
                  '--header', 'Accept-Encoding: identity',
                  '--header', 'Accept: application/pdf,application/octet-stream,*/*',
                  '--output', str(dest), url,
              ], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              return proc.returncode == 0, proc.stderr[-1500:]

          results = []
          temp = DIST / '_candidate.pdf'
          for item in items:
              code = item['infoCode']
              stamp = int(time.time() * 1000)
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{stamp}.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{code}.pdf',
              ]
              errors = []
              accepted = False
              for url in urls:
                  ok, err = fetch_pdf(url, temp, f'https://data.eastmoney.com/report/info/{code}.html')
                  if not ok:
                      errors.append(f'{url}: {err}')
                      continue
                  try:
                      raw = temp.read_bytes()
                      if len(raw) < 100_000 or not raw.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF: {len(raw)} bytes')
                      reader = PdfReader(str(temp), strict=False)
                      pages = len(reader.pages)
                      if pages != item['expected_pages']:
                          raise RuntimeError(f'page mismatch: {pages} != {item["expected_pages"]}')
                      sample = ''
                      for page in reader.pages[:min(6, pages)]:
                          try:
                              sample += ' ' + (page.extract_text() or '')
                          except Exception:
                              pass
                      compact = re.sub(r'\s+', '', sample)
                      if '美康生物' not in compact and '300439' not in compact:
                          raise RuntimeError('company identity not found')
                      digest = hashlib.sha256(raw).hexdigest()
                      filename = f'{item["date"]}_{safe(item["broker"],18)}_{safe(item["title"])}_{pages}页.pdf'
                      destination = REPORTS / filename
                      destination.write_bytes(raw)
                      results.append({**item, 'filename': filename, 'pages': pages, 'size': len(raw), 'sha256': digest, 'url': url})
                      print('OK', json.dumps(results[-1], ensure_ascii=False))
                      accepted = True
                      break
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
                  finally:
                      temp.unlink(missing_ok=True)
              if not accepted:
                  raise RuntimeError(f'failed {item["title"]}: {errors}')

          manifest = [
              '美康生物（300439）券商公司研究报告资料包',
              '公开渠道能够直接取得并核验的原始PDF共两份。',
              '其中一份为16页长篇公司深度报告，另一份为6页完整公司研究报告。',
              '未加入网页重制版、内容摘要或无法验证的文件。',
              '资料仅供研究参考，请遵守原报告版权声明和使用限制。',
              '',
          ]
          for idx, item in enumerate(results, 1):
              manifest += [
                  f'{idx}. {item["title"]}',
                  f'   类型：{item["type"]}',
                  f'   券商：{item["broker"]}',
                  f'   日期：{item["date"]}',
                  f'   页数：{item["pages"]}',
                  f'   文件大小：{item["size"]} bytes',
                  f'   SHA-256：{item["sha256"]}',
                  f'   公开来源：{item["url"]}',
                  '',
              ]
          (REPORTS / '资料清单与校验信息.txt').write_text('\n'.join(manifest), encoding='utf-8')
          DIAG.joinpath('results.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')

          final_zip = DIST / '美康生物_券商公司研究报告_2份_完整原始PDF.zip'
          with zipfile.ZipFile(final_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(REPORTS.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(final_zip, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity error: {bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'PDF count mismatch: {pdfs}')
          print('FINAL_ZIP', final_zip, final_zip.stat().st_size)
          PY
          python /tmp/package_meikang.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: meikang-biotech-final-original-reports
          path: dist/美康生物_券商公司研究报告_2份_完整原始PDF.zip
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meikang-biotech-final-results
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
