name: Inspect Huajin Capital report assets 20261012
on:
  push:
    paths:
      - '.github/workflows/inspect-huajin-report-assets-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect pages and search results
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re
          from urllib.parse import quote, urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          urls=[
            'https://www.sdyanbao.com/detail/817305?cid=10',
            'https://www.fxbaogao.com/detail/4478831',
            'https://reportify.ai/reports/1027659375868776448',
            'https://bbs.pinggu.org/a-4219548.html',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/523277190294/index.phtml',
          ]
          for u in urls:
            try:
              r=s.get(u,headers=h,timeout=90,allow_redirects=True); r.encoding=r.apparent_encoding or 'utf-8'; t=r.text
              print('\nPAGE',r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
              tm=re.search(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)
              print('TITLE',re.sub(r'<[^>]+>','',html.unescape(tm.group(1))).strip() if tm else '',flush=True)
              links=[]
              for m in re.finditer(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']',t,re.I):
                full=urljoin(r.url,html.unescape(m.group(1)))
                if any(k in full.lower() for k in ['.pdf','download','attach','report','file','oss','cos','static','preview']): links.append(full)
              print('LINKS',json.dumps(list(dict.fromkeys(links))[:200],ensure_ascii=False),flush=True)
              patterns=['.pdf','pdfUrl','downloadUrl','fileUrl','oss','817305','4478831','4219548','1027659375868776448','__NEXT_DATA__','preview','attachment']
              for pat in patterns:
                positions=[m.start() for m in re.finditer(re.escape(pat),t,re.I)]
                for pos in positions[:5]:
                  snip=re.sub(r'\s+',' ',t[max(0,pos-500):pos+1500])
                  print('SNIP',pat,snip[:2000],flush=True)
              # Extract literal URLs from scripts and JSON.
              url_candidates=re.findall(r'https?:\\?/\\?/[A-Za-z0-9._~:/?#\[\]@!$&\'()*+,;=%-]+',t)
              cleaned=[]
              for x in url_candidates:
                x=x.replace('\\/','/').replace('\\u0026','&')
                if any(k in x.lower() for k in ['pdf','download','attach','report','file','oss','cos','static']): cleaned.append(x)
              print('SCRIPT_URLS',json.dumps(list(dict.fromkeys(cleaned))[:300],ensure_ascii=False),flush=True)
            except Exception as e:
              print('PAGE_ERROR',u,repr(e),flush=True)

          queries=[
            '"借国企改革之力 转创投发展之路" PDF',
            '"力合股份" "借国企改革之力" 研报',
            '"自动驾驶风头正盛 耐心资本伏线千里" PDF',
            '"实业和投资双轮驱动" "力合股份" PDF',
          ]
          for q in queries:
            try:
              u='https://www.bing.com/search?q='+quote(q)
              r=s.get(u,headers=h,timeout=90); r.encoding=r.apparent_encoding or 'utf-8'; t=r.text
              print('\nBING',q,r.status_code,len(r.content),r.url,flush=True)
              items=[]
              for m in re.finditer(r'<a[^>]+href="(https?://[^"]+)"[^>]*>(.*?)</a>',t,re.I|re.S):
                href=html.unescape(m.group(1)); title=re.sub(r'<[^>]+>','',html.unescape(m.group(2))); title=re.sub(r'\s+',' ',title).strip()
                if any(k in (href+' '+title).lower() for k in ['华金','力合','000532','研报','report','pdf']): items.append({'title':title,'url':href})
              print('BING_ITEMS',json.dumps(items[:100],ensure_ascii=False),flush=True)
            except Exception as e:
              print('BING_ERROR',q,repr(e),flush=True)
          PY
