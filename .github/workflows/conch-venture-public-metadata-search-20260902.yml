name: Search public metadata for China Conch Venture broker reports

on:
  push:
    paths:
      - '.github/workflows/conch-venture-public-metadata-search-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query public no-auth report search
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import requests

          url = 'https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          headers = {
              'User-Agent': ua,
              'Accept': 'application/json,text/plain,*/*',
              'Content-Type': 'application/json; charset=UTF-8',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/search?keywords=%E6%B5%B7%E8%9E%BA%E5%88%9B%E4%B8%9A',
              'x-fp': '',
              'x-bot': '',
          }
          payloads = [
              {'keywords':'海螺创业','page':1,'limit':100,'order':0},
              {'keywords':'海螺创业','pageIndex':1,'pageSize':100,'order':0},
              {'keywords':'海螺创业','page':1,'pageSize':100,'order':'date'},
              {'keywords':'00586','page':1,'limit':100,'order':0},
              {'keywords':'海螺创业','pageIndex':1,'limit':100,'filterDatatype':[],'filterDoctype':[],'filterV2':[],'filterIndustries':[],'filterDate':[],'orderBy':0},
          ]
          for payload in payloads:
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=(20,120))
                  print('\nPAYLOAD', json.dumps(payload, ensure_ascii=False), flush=True)
                  print('STATUS', r.status_code, r.headers.get('content-type'), len(r.content), r.url, flush=True)
                  print(r.text[:120000], flush=True)
              except Exception as exc:
                  print('ERROR', json.dumps(payload, ensure_ascii=False), repr(exc), flush=True)
          PY
