name: Retry clean Dell FY2022 and FY2025 PDFs

on:
  push:
    paths:
      - '.github/workflows/dell-clean-v3-retry-fy2022-fy2025-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: fy2022
            order: 3
            kind: 10-K
            fiscal_year: 2022
            period_end: '2022-01-28'
            filing_date: '2022-03-24'
            accession: '0001571996-22-000009'
            raw_url: 'https://www.sec.gov/Archives/edgar/data/1571996/000157199622000009/dell-20220128.htm'
            filename: '03_戴尔科技_FY2022年报_10-K_截至2022-01-28.pdf'
            min_pages: 90
          - id: fy2025
            order: 6
            kind: 10-K
            fiscal_year: 2025
            period_end: '2025-01-31'
            filing_date: '2025-03-25'
            accession: '0001571996-25-000034'
            raw_url: 'https://www.sec.gov/Archives/edgar/data/1571996/000157199625000034/dell-20250131.htm'
            filename: '06_戴尔科技_FY2025年报_10-K_截至2025-01-31.pdf'
            min_pages: 90
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf pymupdf
          google-chrome --version || google-chrome-stable --version

      - name: Fetch raw SEC filing and render clean PDF
        shell: bash
        env:
          SPEC_ID: ${{ matrix.id }}
          ORDER: ${{ matrix.order }}
          KIND: ${{ matrix.kind }}
          FISCAL_YEAR: ${{ matrix.fiscal_year }}
          PERIOD_END: ${{ matrix.period_end }}
          FILING_DATE: ${{ matrix.filing_date }}
          ACCESSION: ${{ matrix.accession }}
          RAW_URL: ${{ matrix.raw_url }}
          FILENAME: ${{ matrix.filename }}
          MIN_PAGES: ${{ matrix.min_pages }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, os, re, shutil, subprocess, time
          from pathlib import Path
          from urllib.parse import urljoin
          import pymupdf, requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          spec={
            'id':os.environ['SPEC_ID'],'order':int(os.environ['ORDER']),'kind':os.environ['KIND'],
            'fiscal_year':int(os.environ['FISCAL_YEAR']),'quarter':None,'period_end':os.environ['PERIOD_END'],
            'filing_date':os.environ['FILING_DATE'],'accession':os.environ['ACCESSION'],
            'raw_url':os.environ['RAW_URL'],'filename':os.environ['FILENAME'],'min_pages':int(os.environ['MIN_PAGES'])
          }
          out=Path('piece'); out.mkdir(exist_ok=True)
          work=Path('work'); work.mkdir(exist_ok=True)
          renders=work/'renders'; renders.mkdir(exist_ok=True)
          session=requests.Session(); session.trust_env=False
          session.headers.update({'User-Agent':'OpenAI Research Assistant research-contact@example.com Dell filing archival task','Accept-Encoding':'gzip, deflate','Accept-Language':'en-US,en;q=0.9'})

          def get(url, attempts=8, timeout=(20,180)):
            last=None
            for attempt in range(1,attempts+1):
              try:
                r=session.get(url,timeout=timeout,allow_redirects=True)
                print('GET',attempt,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                if r.status_code==200:return r
                last=RuntimeError(f'HTTP {r.status_code}')
              except Exception as exc:
                last=exc; print('GET_ERROR',attempt,url,repr(exc),flush=True)
              time.sleep(min(4*attempt,24))
            raise RuntimeError(f'Unable to retrieve {url}: {last}')

          response=get(spec['raw_url'])
          if len(response.content)<100000:raise RuntimeError(f'Primary filing too small: {len(response.content)}')
          html_text=response.content.decode('utf-8',errors='replace')
          soup=BeautifulSoup(html_text,'lxml')
          for tag in soup.find_all(['script','iframe','object','embed','noscript']):tag.decompose()
          for tag in soup.find_all('link',href=True):tag.decompose()
          image_count=0
          for image in soup.find_all('img',src=True):
            src=str(image.get('src') or '').strip()
            if not src or src.startswith('data:'):continue
            image_url=urljoin(spec['raw_url'],src)
            try:
              ir=get(image_url,attempts=3,timeout=(10,60))
              ctype=ir.headers.get('content-type') or 'image/png'
              image['src']=f'data:{ctype};base64,{base64.b64encode(ir.content).decode("ascii")}'
              image_count+=1
            except Exception as exc:
              print('IMAGE_WARNING',image_url,repr(exc),flush=True); image.decompose()
          print('IMAGES_INLINED',image_count,flush=True)
          if soup.head is None:
            head=soup.new_tag('head')
            if soup.html:soup.html.insert(0,head)
            else:soup.insert(0,head)
          for old in soup.head.find_all('meta',attrs={'charset':True}):old.decompose()
          meta=soup.new_tag('meta'); meta['charset']='utf-8'; soup.head.insert(0,meta)
          style=soup.new_tag('style'); style.string='''
            @page { size: Letter; margin: 0.45in; }
            html,body { background:white!important; color:black!important; }
            ix\\:header,ix-header,#ixvHeader,.ixv-header,.navbar,.modal-backdrop { display:none!important; }
            img { max-width:100%!important; height:auto!important; }
            table { max-width:100%!important; break-inside:auto; }
            tr { break-inside:avoid; }
          '''; soup.head.append(style)
          local=work/'filing.html'; local.write_text(str(soup),encoding='utf-8')
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not chrome:raise RuntimeError('Chrome unavailable')
          pdf=out/spec['filename']; profile=work/'profile'; profile.mkdir(exist_ok=True)
          cmd=[chrome,'--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--disable-extensions','--disable-background-networking','--disable-component-update','--disable-sync','--disable-default-apps','--no-first-run','--allow-file-access-from-files','--run-all-compositor-stages-before-draw','--virtual-time-budget=2500','--no-pdf-header-footer',f'--user-data-dir={profile.resolve()}',f'--print-to-pdf={pdf.resolve()}',local.resolve().as_uri()]
          result=subprocess.run(cmd,capture_output=True,text=True,timeout=180)
          print('CHROME_EXIT',result.returncode,result.stdout[-1000:],result.stderr[-3000:],flush=True)
          if result.returncode!=0 or not pdf.exists() or pdf.stat().st_size<100000:raise RuntimeError('Chrome PDF generation failed')
          reader=PdfReader(str(pdf),strict=False); pages=len(reader.pages)
          if pages<spec['min_pages']:raise RuntimeError(f'Only {pages} pages')
          text=[]
          for page in reader.pages[:min(24,pages)]:
            try:text.append(page.extract_text() or '')
            except Exception:pass
          joined='\n'.join(text); compact=re.sub(r'\s+','',joined).lower()
          if not any(x in compact for x in ('delltechnologiesinc','delltechnologies')):raise RuntimeError('Dell identity not found')
          if spec['kind'].lower() not in compact:raise RuntimeError('Form type not found')
          if 'â' in joined or 'Â' in joined:raise RuntimeError('Character-encoding mojibake detected')
          q=subprocess.run(['qpdf','--check',str(pdf)],capture_output=True,text=True)
          if q.returncode not in (0,3):raise RuntimeError('qpdf failed: '+q.stderr[-1200:])
          doc=pymupdf.open(str(pdf)); sample=sorted(set([0,max(0,pages//2),pages-1])); rendered=[]
          for pno in sample:
            pix=doc.load_page(pno).get_pixmap(matrix=pymupdf.Matrix(1,1),alpha=False)
            rp=renders/f'{pno+1:04d}.png'; pix.save(str(rp))
            if not rp.exists() or rp.stat().st_size<5000 or pix.width<400 or pix.height<400:raise RuntimeError(f'Render failed page {pno+1}')
            rendered.append(pno+1)
          doc.close()
          data=pdf.read_bytes()
          metadata={'id':spec['id'],'order':spec['order'],'filename':spec['filename'],'document_type':spec['kind'],'fiscal_year':spec['fiscal_year'],'quarter':None,'period_end':spec['period_end'],'filing_date':spec['filing_date'],'accession_number':spec['accession'],'primary_document':spec['raw_url'].rsplit('/',1)[-1],'primary_document_url':spec['raw_url'],'filing_index_url':f'https://www.sec.gov/Archives/edgar/data/1571996/{spec["accession"].replace("-","")}/{spec["accession"]}-index.html','pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source':'U.S. SEC EDGAR official filing, rendered to clean PDF without textual alteration','rendered_pages':rendered}
          (out/f'{spec["id"]}.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          print('VERIFIED',json.dumps(metadata,ensure_ascii=False),flush=True)
          PY

      - name: Upload retry piece
        uses: actions/upload-artifact@v4
        with:
          name: dell-clean-v3-retry-${{ matrix.id }}
          path: piece/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
