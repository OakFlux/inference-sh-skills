name: Trace public Yingli report download popup 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-yingli-popup-trace-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium
      - name: Trace popup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeout

          LANDING='https://www.valuelist.cn/871327.html'
          async def main():
            out=Path('output'); events=[]
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context(locale='zh-CN',accept_downloads=True,user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36')
              def attach(pg,label):
                pg.on('request',lambda req: events.append({'kind':'request','page':label,'method':req.method,'url':req.url}) if any(k in req.url.lower() for k in ['goto','down','pdf','file','report','pan.baidu','lanzou','aliyundrive']) else None)
                pg.on('response',lambda resp: events.append({'kind':'response','page':label,'status':resp.status,'content_type':resp.headers.get('content-type',''),'url':resp.url}) if any(k in resp.url.lower() for k in ['goto','down','pdf','file','report','pan.baidu','lanzou','aliyundrive']) else None)
              page=await ctx.new_page();attach(page,'landing')
              await page.goto(LANDING,wait_until='domcontentloaded',timeout=90000);await page.wait_for_timeout(4000)
              link=page.locator('a[href*="goto?down="]').first
              href=await link.get_attribute('href');print('HREF',href)
              popup=None
              try:
                async with ctx.expect_page(timeout=30000) as pi:
                  await link.click()
                popup=await pi.value;attach(popup,'popup')
                print('POPUP_CREATED',popup.url)
              except PlaywrightTimeout:
                print('NO_POPUP; OPENING HREF DIRECTLY')
                popup=await ctx.new_page();attach(popup,'popup')
                await popup.goto(href,wait_until='domcontentloaded',timeout=90000)
              for sec in [2,5,10,20]:
                await popup.wait_for_timeout(sec*1000 if sec==2 else (sec-([2,5,10][[2,5,10].index(sec)-1] if sec in [5,10] else 10))*1000)
                print('AT',sec,'URL',popup.url,'TITLE',await popup.title())
              try:
                html=await popup.content();text=(await popup.locator('body').inner_text())[:100000]
              except Exception as exc:
                html='';text='ERROR '+repr(exc)
              (out/'popup.html').write_text(html,encoding='utf-8',errors='ignore')
              (out/'popup.txt').write_text(text,encoding='utf-8',errors='ignore')
              try:
                links=await popup.locator('a').evaluate_all("els=>els.map(a=>({text:(a.innerText||'').trim(),href:a.href,target:a.target,download:a.download})).filter(x=>x.href)")
                iframes=await popup.locator('iframe').evaluate_all("els=>els.map(x=>({src:x.src,name:x.name}))")
                metas=await popup.locator('meta[http-equiv]').evaluate_all("els=>els.map(x=>({equiv:x.httpEquiv,content:x.content}))")
              except Exception:
                links=[];iframes=[];metas=[]
              result={'landing':LANDING,'href':href,'final_url':popup.url,'title':await popup.title(),'text':text,'links':links,'iframes':iframes,'metas':metas,'events':events}
              (out/'trace.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              await popup.screenshot(path=str(out/'popup.png'),full_page=True)
              print(json.dumps(result,ensure_ascii=False)[:30000])
              await browser.close()
          asyncio.run(main())
          PY
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-yingli-popup-trace-20260919
          path: output
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
