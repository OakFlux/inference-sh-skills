name: Package Guoxin Health filings

on:
  push:
    paths:
      - '.github/workflows/package_guoxin_health_filings_20260929.yml'
      - 'tools/package_guoxin_health_filings_20260929.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download validate and package filings
        run: python tools/package_guoxin_health_filings_20260929.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: guoxin-health-000503-2020-2025-annual-latest-quarter
          path: |
            国新健康_000503_2020-2025年报及最新季报.zip
            guoxin_health_filings_result.json
            _previews_guoxin_health_filings/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
