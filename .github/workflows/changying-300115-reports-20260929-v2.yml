name: Build Changying Precision 300115 reports package 20260929 v2

on:
  push:
    paths:
      - '.github/workflows/changying-300115-reports-20260929-v2.yml'
      - 'scripts/build_changying_300115_reports_20260929_v2.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        run: python scripts/build_changying_300115_reports_20260929_v2.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: changying-300115-reports-20260929-v2
          path: 长盈精密_300115_2020-2025年报及2026年最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
