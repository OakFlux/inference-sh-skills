name: Package Dell SEC filings from raw EDGAR documents v2

on:
  push:
    paths:
      - '.github/workflows/dell-sec-edgar-parallel-raw-v2-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - id: fy2020
            order: 1
            kind: 10-K
            fiscal_year: 2020
            quarter: ''
            period_end: '2020-01-31'
            filing_date: '2020-03-27'
            accession: '0001571996-20-000017'
            filename: '01_戴尔科技_FY2020年报_10-K_截至2020-01-31.pdf'
            min_pages: 90
          - id: fy2021
            order: 2
            kind: 10-K
            fiscal_year: 2021
            quarter: ''
            period_end: '2021-01-29'
            filing_date: '2021-03-26'
            accession: '0001571996-21-000007'
            filename: '02_戴尔科技_FY2021年报_10-K_截至2021-01-29.pdf'
            min_pages: 90
          - id: fy2022
            order: 3
            kind: 10-K
            fiscal_year: 2022
            quarter: ''
            period_end: '2022-01-28'
            filing_date: '2022-03-24'
            accession: '0001571996-22-000009'
            filename: '03_戴尔科技_FY2022年报_10-K_截至2022-01-28.pdf'
            min_pages: 90
          - id: fy2023
            order: 4
            kind: 10-K
            fiscal_year: 2023
            quarter: ''
            period_end: '2023-02-03'
            filing_date: '2023-03-30'
            accession: '0001571996-23-000007'
            filename: '04_戴尔科技_FY2023年报_10-K_截至2023-02-03.pdf'
            min_pages: 90
          - id: fy2024
            order: 5
            kind: 10-K
            fiscal_year: 2024
            quarter: ''
            period_end: '2024-02-02'
            filing_date: '2024-03-25'
            accession: '0001571996-24-000036'
            filename: '05_戴尔科技_FY2024年报_10-K_截至2024-02-02.pdf'
            min_pages: 90
          - id: fy2025
            order: 6
            kind: 10-K
            fiscal_year: 2025
            quarter: ''
            period_end: '2025-01-31'
            filing_date: '2025-03-25'
            accession: '0001571996-25-000034'
            filename: '06_戴尔科技_FY2025年报_10-K_截至2025-01-31.pdf'
            min_pages: 90
          - id: fy2027q1
            order: 7
            kind: 10-Q
            fiscal_year: 2027
            quarter: Q1
            period_end: '2026-05-01'
            filing_date: '2026-06-09'
            accession: '0001571996-26-000030'
            filename: '07_最新正式季报_戴尔科技_FY2027_Q1_10-Q_截至2026-05-01.pdf'
            min_pages: 35

    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf pymupdf
          google-chrome --version || google-chrome-stable --version

      - name: Fetch raw SEC filing render and validate
        shell: bash
        env:
          SPEC_ID: ${{ matrix.id }}
          ORDER: ${{ matrix.order }}
          KIND: ${{ matrix.kind }}
          FISCAL_YEAR: ${{ matrix.fiscal_year }}
          QUARTER: ${{ matrix.quarter }}
          PERIOD_END: ${{ matrix.period_end }}
          FILING_DATE: ${{ matrix.filing_date }}
          ACCESSION: ${{ matrix.accession }}
          FILENAME: ${{ matrix.filename }}
          MIN_PAGES: ${{ matrix.min_pages }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import parse_qs, urljoin, urlparse

          import pymupdf
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          spec = {
              'id': os.environ['SPEC_ID'],
              'order': int(os.environ['ORDER']),
              'kind': os.environ['KIND'],
              'fiscal_year': int(os.environ['FISCAL_YEAR']),
              'quarter': os.environ.get('QUARTER') or None,
              'period_end': os.environ['PERIOD_END'],
              'filing_date': os.environ['FILING_DATE'],
              'accession': os.environ['ACCESSION'],
              'filename': os.environ['FILENAME'],
              'min_pages': int(os.environ['MIN_PAGES']),
          }

          out = Path('piece')
          out.mkdir(exist_ok=True)
          work = Path('work')
          work.mkdir(exist_ok=True)
          renders = work / 'renders'
          renders.mkdir(exist_ok=True)

          accession_compact = spec['accession'].replace('-', '')
          index_url = f'https://www.sec.gov/Archives/edgar/data/1571996/{accession_compact}/{spec["accession"]}-index.html'
          sec_user_agent = 'OpenAI Research Assistant research-contact@example.com Dell filing archival task'

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': sec_user_agent,
              'Accept-Encoding': 'gzip, deflate',
              'Accept-Language': 'en-US,en;q=0.9',
          })

          def get(url: str, attempts: int = 5, timeout=(15, 150)) -> requests.Response:
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      response = session.get(url, timeout=timeout, allow_redirects=True)
                      print('GET', attempt, response.status_code, len(response.content), response.url, response.headers.get('content-type'), flush=True)
                      if response.status_code == 200:
                          return response
                      last = RuntimeError(f'HTTP {response.status_code}')
                  except Exception as exc:
                      last = exc
                      print('GET_ERROR', attempt, url, repr(exc), flush=True)
                  time.sleep(min(attempt, 5))
              raise RuntimeError(f'Unable to retrieve {url}: {last}')

          def raw_edgar_url(href: str, base_url: str) -> str:
              absolute = urljoin(base_url, href)
              parsed = urlparse(absolute)
              if parsed.path.rstrip('/').endswith('/ix'):
                  doc = parse_qs(parsed.query).get('doc', [None])[0]
                  if doc:
                      return urljoin('https://www.sec.gov', doc)
              return absolute

          index_response = get(index_url)
          index_soup = BeautifulSoup(index_response.content, 'lxml')
          matches = []
          for row in index_soup.select('table.tableFile tr'):
              cells = row.find_all('td')
              if len(cells) < 4:
                  continue
              document_type = ' '.join(cells[3].get_text(' ', strip=True).split()).upper()
              anchor = cells[2].find('a', href=True)
              if anchor is None or document_type != spec['kind'].upper():
                  continue
              document_url = raw_edgar_url(anchor['href'], str(index_response.url))
              document_name = ' '.join(anchor.get_text(' ', strip=True).split())
              matches.append((document_url, document_name))

          if not matches:
              raise RuntimeError(f'No {spec["kind"]} primary document found on {index_url}')

          document_url, document_name = matches[0]
          print('PRIMARY_RAW', document_url, document_name, flush=True)
          document_response = get(document_url, attempts=5, timeout=(15, 180))
          if len(document_response.content) < 100_000:
              raise RuntimeError(f'Raw primary filing unexpectedly small: {len(document_response.content)} bytes')

          soup = BeautifulSoup(document_response.content, 'lxml')

          # Remove only interactive or remote-resource elements; preserve filing text, tables, and inline styles.
          for tag in soup.find_all(['script', 'iframe', 'object', 'embed', 'noscript']):
              tag.decompose()
          for tag in soup.find_all('link', href=True):
              tag.decompose()

          # Inline images from SEC so Chrome prints a self-contained local document without waiting on the network.
          image_count = 0
          for image in soup.find_all('img', src=True):
              src = str(image.get('src') or '').strip()
              if not src or src.startswith('data:'):
                  continue
              image_url = urljoin(document_url, src)
              try:
                  image_response = get(image_url, attempts=3, timeout=(10, 45))
                  content_type = image_response.headers.get('content-type') or 'image/png'
                  encoded = base64.b64encode(image_response.content).decode('ascii')
                  image['src'] = f'data:{content_type};base64,{encoded}'
                  image_count += 1
              except Exception as exc:
                  print('IMAGE_WARNING', image_url, repr(exc), flush=True)
                  image.decompose()
          print('IMAGES_INLINED', image_count, flush=True)

          if soup.head is None:
              head = soup.new_tag('head')
              if soup.html:
                  soup.html.insert(0, head)
              else:
                  soup.insert(0, head)
          style = soup.new_tag('style')
          style.string = '''
            @page { size: Letter; margin: 0.45in; }
            html, body { background: white !important; color: black !important; }
            ix\\:header, ix-header, #ixvHeader, .ixv-header, .navbar, .modal-backdrop { display: none !important; }
            img { max-width: 100% !important; height: auto !important; }
            table { max-width: 100% !important; break-inside: auto; }
            tr { break-inside: avoid; }
          '''
          soup.head.append(style)

          local_html = work / 'filing.html'
          local_html.write_text(str(soup), encoding='utf-8')
          print('LOCAL_HTML_BYTES', local_html.stat().st_size, flush=True)

          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not chrome:
              raise RuntimeError('Google Chrome is unavailable')

          pdf_path = out / spec['filename']
          profile = work / 'chrome-profile'
          profile.mkdir(exist_ok=True)
          command = [
              chrome,
              '--headless=new',
              '--no-sandbox',
              '--disable-gpu',
              '--disable-dev-shm-usage',
              '--disable-extensions',
              '--disable-background-networking',
              '--disable-component-update',
              '--disable-sync',
              '--disable-default-apps',
              '--no-first-run',
              '--allow-file-access-from-files',
              '--run-all-compositor-stages-before-draw',
              '--virtual-time-budget=2500',
              '--print-to-pdf-no-header',
              f'--user-data-dir={profile.resolve()}',
              f'--print-to-pdf={pdf_path.resolve()}',
              local_html.resolve().as_uri(),
          ]
          result = subprocess.run(command, capture_output=True, text=True, timeout=180)
          print('CHROME_EXIT', result.returncode, result.stdout[-1000:], result.stderr[-3000:], flush=True)
          if result.returncode != 0 or not pdf_path.exists() or pdf_path.stat().st_size < 100_000:
              raise RuntimeError(f'Chrome PDF generation failed: returncode={result.returncode}')

          reader = PdfReader(str(pdf_path), strict=False)
          pages = len(reader.pages)
          if pages < spec['min_pages']:
              raise RuntimeError(f'Only {pages} pages; minimum {spec["min_pages"]}')

          extracted = []
          for page in reader.pages[:min(24, pages)]:
              try:
                  extracted.append(page.extract_text() or '')
              except Exception:
                  pass
          compact = re.sub(r'\s+', '', '\n'.join(extracted)).lower()
          if not any(token in compact for token in ('delltechnologiesinc', 'delltechnologies')):
              raise RuntimeError('Dell Technologies identity not found in generated PDF')
          if spec['kind'].lower() not in compact:
              raise RuntimeError(f'Form type {spec["kind"]} not found in generated PDF')

          qcheck = subprocess.run(['qpdf', '--check', str(pdf_path)], capture_output=True, text=True)
          if qcheck.returncode not in (0, 3):
              raise RuntimeError(f'qpdf failed: {qcheck.stderr[-1200:]}')
          if qcheck.returncode == 3:
              print('QPDF_WARNING', qcheck.stderr[-1000:], flush=True)

          doc = pymupdf.open(str(pdf_path))
          sample_pages = sorted(set([0, max(0, pages // 2), pages - 1]))
          rendered_pages = []
          for page_no in sample_pages:
              pix = doc.load_page(page_no).get_pixmap(matrix=pymupdf.Matrix(1, 1), alpha=False)
              render_path = renders / f'{page_no+1:04d}.png'
              pix.save(str(render_path))
              if not render_path.exists() or render_path.stat().st_size < 5_000 or pix.width < 400 or pix.height < 400:
                  raise RuntimeError(f'Render verification failed on page {page_no+1}')
              rendered_pages.append(page_no + 1)
          doc.close()

          data = pdf_path.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          metadata = {
              'id': spec['id'],
              'order': spec['order'],
              'filename': spec['filename'],
              'document_type': spec['kind'],
              'fiscal_year': spec['fiscal_year'],
              'quarter': spec['quarter'],
              'period_end': spec['period_end'],
              'filing_date': spec['filing_date'],
              'accession_number': spec['accession'],
              'primary_document': document_name,
              'primary_document_url': document_url,
              'filing_index_url': index_url,
              'pages': pages,
              'bytes': len(data),
              'sha256': digest,
              'source': 'U.S. SEC EDGAR official filing, rendered to PDF without textual alteration',
              'rendered_pages': rendered_pages,
          }
          (out / f'{spec["id"]}.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          print('VERIFIED', json.dumps(metadata, ensure_ascii=False), flush=True)
          PY

      - name: Upload filing piece
        uses: actions/upload-artifact@v4
        with:
          name: dell-raw-v2-piece-${{ matrix.id }}
          path: piece/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download all filing pieces
        uses: actions/download-artifact@v4
        with:
          pattern: dell-raw-v2-piece-*
          path: pieces
          merge-multiple: true

      - name: Build final ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import shutil
          import zipfile
          from pathlib import Path

          PACKAGE = '戴尔科技_2020-2025财年年报及最新季报'
          pieces = Path('pieces')
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          records = [json.loads(path.read_text(encoding='utf-8')) for path in pieces.glob('*.json')]
          records.sort(key=lambda item: item['order'])
          if len(records) != 7:
              raise RuntimeError(f'Expected 7 reports, found {len(records)}')
          annual_years = {item['fiscal_year'] for item in records if item['document_type'] == '10-K'}
          if annual_years != {2020, 2021, 2022, 2023, 2024, 2025}:
              raise RuntimeError(f'Annual coverage mismatch: {annual_years}')
          if len([item for item in records if item['document_type'] == '10-Q']) != 1:
              raise RuntimeError('Latest formal 10-Q missing')
          if len({item['sha256'] for item in records}) != 7:
              raise RuntimeError('Duplicate PDF hash detected')

          for item in records:
              source = pieces / item['filename']
              if not source.exists():
                  raise RuntimeError(f'Missing PDF: {source}')
              shutil.copy2(source, out / item['filename'])

          lines = [
              '戴尔科技（Dell Technologies Inc., NYSE: DELL）',
              'FY2020-FY2025年度报告及最新正式季度报告',
              '',
              '年度口径：按戴尔正式Fiscal Year标签收录FY2020至FY2025六份Form 10-K，而不是按文件披露年份命名。',
              '截至2026年9月5日，最新向SEC提交的正式季度报告为FY2027 Q1 Form 10-Q，报告期截至2026年5月1日，提交日期为2026年6月9日。',
              '戴尔已于2026年9月1日发布FY2027 Q2业绩资料，但截至本包制作时Q2 Form 10-Q尚未提交，因此未把新闻稿、8-K附件或演示材料冒充正式季报。',
              '戴尔投资者关系网站的预生成PDF端点连接异常，本包改用美国SEC EDGAR官方申报文件原样渲染为PDF；正文文字、表格和数值未翻译、删节或改写。',
              '',
          ]
          for number, item in enumerate(records, 1):
              lines.extend([
                  f"{number}. {item['filename']}",
                  f"   类型：{item['document_type']}；财年：FY{item['fiscal_year']}；季度：{item.get('quarter') or '-'}；报告期末：{item['period_end']}",
                  f"   提交日期：{item['filing_date']}；实际页数：{item['pages']}页；大小：{item['bytes']/1048576:.2f} MB",
                  f"   SEC来源：{item['primary_document_url']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ])
          lines.extend([
              '核验项目：SEC accession与Form类型、Dell Technologies名称、实际页数、qpdf结构、首页/中间页/末页渲染、SHA-256及ZIP CRC。',
              '文件均为英文原始申报内容。',
          ])
          (out / '报告清单与口径说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{item['sha256']}  {item['filename']}\n" for item in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdf_count = len([name for name in archive.namelist() if name.lower().endswith('.pdf')])
              if pdf_count != 7:
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count}')
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDFS', len(records), 'PAGES', sum(item['pages'] for item in records), flush=True)
          print('MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: dell-sec-raw-v2-fy2020-fy2025-latest-10q-final
          path: 戴尔科技_2020-2025财年年报及最新季报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
