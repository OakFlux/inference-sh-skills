name: Search REPT BATTERO report aliases

on:
  push:
    paths:
      - '.github/workflows/rept-sdy-alias-search-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python -m pip install --quiet requests
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures,json
          from pathlib import Path
          import requests
          qs=['瑞浦兰均','0666.HK','00666.HK','666 HK','REPT BATTERO','REPT','瑞浦兰钧能源']
          h={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Content-Type':'application/json;charset=UTF-8','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report','Device':'1','X-Token':''}
          def one(args):
            q,only=args; b={'device':1,'hideTrader':0,'onlyTitle':only,'order':1,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','opFrom':1}
            try:
              r=requests.post('https://api.sdyanbao.com/api/file/search',headers=h,json=b,timeout=(5,30)); obj=r.json(); data=obj.get('data',{}) if isinstance(obj,dict) else {}; return {'query':q,'onlyTitle':only,'status':r.status_code,'bytes':len(r.content),'total':data.get('total'),'rows':data.get('files',[])}
            except Exception as e:return {'query':q,'onlyTitle':only,'error':repr(e),'rows':[]}
          tasks=[(q,o) for q in qs for o in (1,0)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:res=list(ex.map(one,tasks))
          Path('alias').mkdir(); Path('alias/result.json').write_text(json.dumps(res,ensure_ascii=False,indent=2),encoding='utf-8')
          for x in res: print('Q',x['query'],x['onlyTitle'],x.get('total'),len(x.get('rows',[])),x.get('error'),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rept-sdy-alias-search
          path: alias/
          retention-days: 7
          if-no-files-found: error
