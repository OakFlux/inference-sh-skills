name: Temporary Vipshop broker report catalog

on:
  push:
    branches:
      - tmp/download-vipshop-reports-20260828
    paths:
      - .github/workflows/tmp-vipshop-catalog.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Query public report catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/eastmoney diagnostic/fxbaogao diagnostic/reportify diagnostic/search
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib, datetime, time, re
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'

          def get(url, headers=None, timeout=60):
              h={'User-Agent':UA}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              return urllib.request.urlopen(req,timeout=timeout).read()

          # Eastmoney
          base='https://reportapi.eastmoney.com/report/list'
          variants=[
              ('code_VIPS','VIPS','0'),('code_USVIPS','USVIPS','0'),('code_VIPS_q1','VIPS','1'),
              ('name_q0','唯品会','0'),('name_q1','唯品会','1'),('name_full','唯品会（VIPS）','1')]
          em_items={}
          for name,code,qtype in variants:
              params={'industryCode':'*','pageSize':'200','industry':'*','rating':'*','ratingChange':'*',
                      'beginTime':'2015-01-01','endTime':'2030-12-31','pageNo':'1','fields':'',
                      'qType':qtype,'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              url=base+'?'+urllib.parse.urlencode(params)
              try: raw=get(url,{'Referer':'https://data.eastmoney.com/report/'})
              except Exception as e: raw=json.dumps({'error':repr(e),'url':url},ensure_ascii=False).encode()
              pathlib.Path(f'diagnostic/eastmoney/{name}.txt').write_bytes(raw)
              text=raw.decode('utf-8','replace').strip()
              if text.startswith('datatable(') and text.endswith(')'): text=text[len('datatable('):-1]
              try: obj=json.loads(text)
              except Exception: continue
              for x in obj.get('data') or []:
                  key=x.get('infoCode') or json.dumps(x,sort_keys=True,ensure_ascii=False)
                  em_items[key]=x
          em_rel=[]
          for x in em_items.values():
              blob=' '.join(str(x.get(k,'')) for k in ['stockName','stockCode','title'])
              if '唯品会' in blob or 'VIPS' in blob.upper(): em_rel.append(x)
          em_rel.sort(key=lambda x:(x.get('publishDate') or '',x.get('attachPages') or 0),reverse=True)
          pathlib.Path('diagnostic/eastmoney/relevant.json').write_text(json.dumps(em_rel,ensure_ascii=False,indent=2),encoding='utf-8')
          with open('diagnostic/eastmoney/summary.tsv','w',encoding='utf-8') as f:
              f.write('publishDate\tstockCode\tstockName\torgSName\tattachPages\treportType\tinfoCode\ttitle\n')
              for x in em_rel:
                  f.write('\t'.join(str(x.get(k,'')) for k in ['publishDate','stockCode','stockName','orgSName','attachPages','reportType','infoCode','title'])+'\n')

          # Fxbaogao public search
          fx_url='https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          keywords=['唯品会','VIPS','唯品会 深度','唯品会 首次覆盖','唯品会 公司深度']
          fx_all={}
          for kw in keywords:
              payload=json.dumps({'keywords':kw,'pageIndex':1,'pageSize':20,'order':2,'nop':-1},ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(fx_url,data=payload,headers={'Content-Type':'application/json','User-Agent':UA},method='POST')
              try: raw=urllib.request.urlopen(req,timeout=60).read()
              except Exception as e: raw=json.dumps({'error':repr(e),'keyword':kw},ensure_ascii=False).encode()
              safe=re.sub(r'\W+','_',kw)
              pathlib.Path(f'diagnostic/fxbaogao/{safe}.json').write_bytes(raw)
              try: obj=json.loads(raw.decode('utf-8','replace'))
              except Exception: continue
              for x in ((obj.get('data') or {}).get('dataList') or []):
                  key=str(x.get('docId') or json.dumps(x,sort_keys=True,ensure_ascii=False))
                  fx_all[key]=x
          fx_rows=list(fx_all.values())
          fx_rows.sort(key=lambda x:x.get('pubTime') or 0,reverse=True)
          pathlib.Path('diagnostic/fxbaogao/relevant.json').write_text(json.dumps(fx_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          with open('diagnostic/fxbaogao/summary.tsv','w',encoding='utf-8') as f:
              f.write('date\tdocId\torgName\tpageNum\tindustryName\ttitle\n')
              for x in fx_rows:
                  ts=x.get('pubTime') or 0
                  date=datetime.datetime.utcfromtimestamp(ts).strftime('%Y-%m-%d') if ts else ''
                  f.write('\t'.join(map(str,[date,x.get('docId',''),x.get('orgName',''),x.get('pageNum',''),x.get('industryName',''),x.get('title','')]))+'\n')

          # Reportify company docs
          symbols=['US%3AVIPS','US:VIPS','VIPS']
          rp_rows={}
          for sym in symbols:
              for page in range(1,5):
                  url=f'https://api.reportify.cn/companies/{sym}/docs?page_num={page}&page_size=100'
                  try: raw=get(url,{'Referer':'https://reportify.cn/'})
                  except Exception as e: raw=json.dumps({'error':repr(e),'url':url},ensure_ascii=False).encode()
                  safe=re.sub(r'\W+','_',sym)
                  pathlib.Path(f'diagnostic/reportify/{safe}_p{page}.json').write_bytes(raw)
                  try: obj=json.loads(raw.decode('utf-8','replace'))
                  except Exception: continue
                  def walk(v):
                      if isinstance(v,dict):
                          if v.get('report_id'): rp_rows[str(v.get('report_id'))]=v
                          for vv in v.values(): walk(vv)
                      elif isinstance(v,list):
                          for vv in v: walk(vv)
                  walk(obj)
          rp=list(rp_rows.values())
          rp.sort(key=lambda x:x.get('publish_at') or 0,reverse=True)
          pathlib.Path('diagnostic/reportify/relevant.json').write_text(json.dumps(rp,ensure_ascii=False,indent=2),encoding='utf-8')
          with open('diagnostic/reportify/summary.tsv','w',encoding='utf-8') as f:
              f.write('date\treport_id\treport_type\tinstitution\tauthors\tpages\tdocument_id\ttitle\n')
              for x in rp:
                  ts=x.get('publish_at') or 0
                  date=datetime.datetime.utcfromtimestamp(ts/1000).strftime('%Y-%m-%d') if ts else ''
                  meta=x.get('meta_data') if isinstance(x.get('meta_data'),dict) else {}
                  f.write('\t'.join(map(str,[date,x.get('report_id',''),x.get('report_type',''),x.get('institution_name',''),x.get('author_names',''),meta.get('document_total_page',''),x.get('document_id',''),x.get('report_title') or x.get('title','')]))+'\n')

          # DuckDuckGo HTML results for additional public PDF sources
          queries=['唯品会 券商 深度报告 pdf','唯品会 首次覆盖 pdf','Vipshop initiation report pdf','VIPS equity research initiation pdf']
          all_links=[]
          for i,q in enumerate(queries):
              url='https://html.duckduckgo.com/html/?'+urllib.parse.urlencode({'q':q})
              try: raw=get(url,{'Referer':'https://duckduckgo.com/'})
              except Exception as e: raw=str(e).encode()
              pathlib.Path(f'diagnostic/search/q{i}.html').write_bytes(raw)
              text=raw.decode('utf-8','replace')
              for m in re.finditer(r'nuddg=([^&"<>]+)',text):
                  try: link=urllib.parse.unquote(m.group(1))
                  except Exception: continue
                  if link not in all_links: all_links.append(link)
              for m in re.finditer(r'https?://[^\s"<>]+',text):
                  link=m.group(0).replace('&amp;','&')
                  if link not in all_links: all_links.append(link)
          pathlib.Path('diagnostic/search/links.txt').write_text('\n'.join(all_links),encoding='utf-8')

          print('EASTMONEY',len(em_rel)); print(pathlib.Path('diagnostic/eastmoney/summary.tsv').read_text(encoding='utf-8'))
          print('FXBAOGAO',len(fx_rows)); print(pathlib.Path('diagnostic/fxbaogao/summary.tsv').read_text(encoding='utf-8'))
          print('REPORTIFY',len(rp)); print(pathlib.Path('diagnostic/reportify/summary.tsv').read_text(encoding='utf-8'))
          print('SEARCH LINKS',len(all_links)); print('\n'.join(all_links[:100]))
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: vipshop-report-catalog
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
