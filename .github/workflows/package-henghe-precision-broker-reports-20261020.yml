name: Package Henghe Precision broker reports 20261020

on:
  push:
    branches:
      - henghe-precision-broker-reports-20261020
    paths:
      - .github/workflows/package-henghe-precision-broker-reports-20261020.yml
      - scripts/probe_henghe_broker_sources_20261020.py
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Probe public report sources
        run: python scripts/probe_henghe_broker_sources_20261020.py | tee probe.log

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henghe-precision-public-source-probe-20261020
          path: |
            probe.log
            source_probe/**
          if-no-files-found: error
          retention-days: 30
