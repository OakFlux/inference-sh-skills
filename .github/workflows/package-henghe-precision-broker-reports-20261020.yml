name: Package Henghe Precision broker reports 20261020

on:
  push:
    branches:
      - henghe-precision-broker-reports-20261020
    paths:
      - .github/workflows/package-henghe-precision-broker-reports-20261020.yml
      - scripts/build_henghe_precision_broker_reports_20261020.py
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Download validate and package reports
        run: python scripts/build_henghe_precision_broker_reports_20261020.py

      - name: Show package summary
        run: cat package_summary.json

      - name: Verify final archive
        run: |
          python - <<'PY'
          import glob
          import json
          import zipfile

          paths = glob.glob('横河精密_300539_券商研究报告_3份_截至20261020.zip')
          assert len(paths) == 1, paths
          with zipfile.ZipFile(paths[0]) as archive:
              assert archive.testzip() is None
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              assert len(pdfs) == 3, pdfs
          summary = json.load(open('package_summary.json', encoding='utf-8'))
          assert summary['pdf_count'] == 3, summary
          print(paths[0], pdfs)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: henghe-precision-300539-broker-reports-20261020
          path: |
            横河精密_300539_券商研究报告_3份_截至20261020.zip
            package_summary.json
            report_catalog.json
          if-no-files-found: error
          retention-days: 30
