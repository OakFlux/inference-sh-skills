name: Extract Super Hi annual reports older links 20260927
on:
  push:
    paths:
      - '.github/workflows/superhi-page1-links-fast-20260927.yml'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fetch page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.links=[]; self.href=None; self.txt=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a': self.href=dict(attrs).get('href'); self.txt=[]
            def handle_data(self,d):
              if self.href is not None: self.txt.append(d)
            def handle_endtag(self,tag):
              if tag=='a' and self.href is not None:
                self.links.append({'text':' '.join(''.join(self.txt).split()),'href':urljoin('https://ir.superhiinternational.com/financial-information/annual-reports?page=1',self.href)})
                self.href=None; self.txt=[]
          url='https://ir.superhiinternational.com/financial-information/annual-reports?page=1'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
          with urllib.request.urlopen(req,timeout=20) as r: raw=r.read(); final=r.geturl()
          print('FETCHED',len(raw),final,flush=True)
          p=P(); p.feed(raw.decode('utf-8','replace'))
          for x in p.links:
            if any(k in x['text'].lower() for k in ('annual report','interim report')) or any(k in x['text'] for k in ('年度報告','年度报告','中期報告','中期报告')):
              print('LINK',json.dumps(x,ensure_ascii=False),flush=True)
          open('superhi_older_links.json','w',encoding='utf-8').write(json.dumps({'final':final,'links':p.links},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: superhi-page1-links-fast-20260927
          path: superhi_older_links.json
          retention-days: 7
