name: Build Berun 000683 broker deep archive 20261016
on:
  push:
    paths:
      - '.github/workflows/build-berun-000683-broker-deep-20261016.yml'
      - 'scripts/build_berun_000683_broker_deep_archive_20261016.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Build archive
        shell: bash
        run: |
          python scripts/build_berun_000683_broker_deep_archive_20261016.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: berun-000683-broker-deep-20261016
          path: berun_chemical_000683_broker_deep_reports_3.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
