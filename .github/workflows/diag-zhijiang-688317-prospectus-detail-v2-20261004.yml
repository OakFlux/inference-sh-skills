name: Inspect Zhijiang Bio prospectus detail page v2 20261004

on:
  push:
    paths:
      - '.github/workflows/diag-zhijiang-688317-prospectus-detail-v2-20261004.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect formal prospectus detail links
        run: |
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests

          s = requests.Session(); s.trust_env = False
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9',
              'Referer': 'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688317.phtml',
          }
          url = 'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=688317&id=6842954'
          r = s.get(url, headers=headers, timeout=90, allow_redirects=True)
          r.encoding = r.apparent_encoding or r.encoding or 'gbk'
          text = r.text
          print('STATUS', r.status_code, r.headers.get('content-type'), len(r.content), r.url, r.encoding, flush=True)
          print('HISTORY', [(x.status_code, x.url, x.headers.get('location')) for x in r.history], flush=True)
          title = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
          print('TITLE', re.sub(r'<[^>]+>', '', title.group(1)).strip() if title else '', flush=True)
          links = []
          for m in re.finditer(r'''(?:href|src|data-url|data-href)\s*=\s*["']([^"']+)["']''', text, re.I):
              links.append(urljoin(r.url, html.unescape(m.group(1))))
          for m in re.finditer(r'https?://[^"\'<> ]+', text, re.I):
              links.append(html.unescape(m.group(0)))
          unique = list(dict.fromkeys(links))
          print('LINKS', json.dumps(unique, ensure_ascii=False, indent=2), flush=True)
          for pat in ['file.finance', '.PDF', '.pdf', '下载', '查看原文', '附件', '6842954', 'iframe', 'window.location']:
              for m in re.finditer(re.escape(pat), text, re.I):
                  print('AROUND', pat, re.sub(r'\s+', ' ', text[max(0,m.start()-2000):m.start()+6000]), flush=True)
          PY
