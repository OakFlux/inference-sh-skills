name: Package Wolong Electric Drive filings 20261022

on:
  push:
    branches:
      - wolong-electric-drive-filings-20261022
    paths:
      - scripts/build_wolong_electric_drive_600580_filings_20261022.py
      - .github/workflows/package-wolong-electric-drive-filings-20261022.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf

      - name: Download validate and package filings
        run: python scripts/build_wolong_electric_drive_600580_filings_20261022.py

      - name: Show package summary
        run: cat dist/package_summary.json

      - name: Verify packaged PDF count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('dist/package_summary.json').read_text(encoding='utf-8'))
          assert summary['pdf_count'] == 7, summary
          print('Verified PDF count:', summary['pdf_count'])
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wolong-electric-drive-600580-filings-20261022
          path: |
            dist/*.zip
            dist/package_summary.json
          if-no-files-found: error
          retention-days: 30
