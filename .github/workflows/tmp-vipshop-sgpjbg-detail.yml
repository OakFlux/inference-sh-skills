name: Temporary Vipshop SGPJBG report inspector

on:
  push:
    branches:
      - tmp/download-vipshop-reports-20260828
    paths:
      - .github/workflows/tmp-vipshop-sgpjbg-detail.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch detail page, download actions, and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/scripts diagnostic/probes
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          urls=(
            'https://bg.sgpjbg.com/baogao/150349.html'
            'https://bg.sgpjbg.com/bgdown/150349.html'
            'https://bg.sgpjbg.com/bgdown/150349.html?dtype=0'
            'https://bg.sgpjbg.com/bgdown/150349.html?dtype=1'
            'https://www.sgpjbg.com/baogao/150349.html'
            'https://www.sgpjbg.com/bgdown/150349.html?dtype=0'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            curl -L --compressed --retry 4 --retry-all-errors --connect-timeout 30 --max-time 240 \
              -A "$UA" -e 'https://bg.sgpjbg.com/baogao/150349.html' -D "diagnostic/probes/${i}.headers" "$url" -o "diagnostic/probes/${i}.bin" || true
            { echo "$url"; file "diagnostic/probes/${i}.bin"; wc -c "diagnostic/probes/${i}.bin"; head -c 30 "diagnostic/probes/${i}.bin" | xxd; } > "diagnostic/probes/${i}.txt"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re,urllib.parse,subprocess,json
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          urls=[]
          for p in Path('diagnostic/probes').glob('*.bin'):
              raw=p.read_bytes()
              if raw.startswith(b'%PDF'): continue
              text=raw.decode('utf-8','replace')
              print('\n===',p,p.stat().st_size,'===')
              print(text[:50000])
              for pat in [r'(?:src|href|data-src|data-original)=["\']([^"\']+)',r'https?://[^\s"\'<>]+']:
                  for m in re.finditer(pat,text,re.I):
                      u=m.group(1) if m.lastindex else m.group(0)
                      u=urllib.parse.urljoin('https://bg.sgpjbg.com/',u.replace('&amp;','&').replace('\\/','/'))
                      if u not in urls: urls.append(u)
          Path('diagnostic/urls.txt').write_text('\n'.join(urls),encoding='utf-8')
          scripts=[u for u in urls if re.search(r'\.js(?:\?|$)',u,re.I)]
          for i,u in enumerate(scripts[:100]):
              out=Path(f'diagnostic/scripts/{i:03d}.js')
              subprocess.run(['curl','-L','--compressed','--retry','3','--retry-all-errors','--connect-timeout','20','--max-time','150','-A',UA,u,'-o',str(out)],check=False)
              Path(str(out)+'.url.txt').write_text(u,encoding='utf-8')
          pats=re.compile(r'150349|download|bgdown|\.pdf|pdfUrl|fileUrl|file_url|pageUrl|page_url|preview|image|imgUrl|img_url|oss|cos|cdn|viewer|bookConfig|pageList|page_count',re.I)
          hits=[]
          for p in [*Path('diagnostic/probes').glob('*.bin'),*Path('diagnostic/scripts').glob('*.js')]:
              t=p.read_bytes().decode('utf-8','replace')
              for m in pats.finditer(t):
                  a=max(0,m.start()-1200); b=min(len(t),m.end()+3500)
                  hits.append(f'--- {p} @{m.start()} ---\n{t[a:b]}')
          Path('diagnostic/hits.txt').write_text('\n\n'.join(hits[:2000]),encoding='utf-8')
          print('\nALL URLS')
          print('\n'.join(urls))
          print('\nHITS',len(hits))
          print('\n\n'.join(hits[:150]))
          PY
          cat diagnostic/probes/*.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: vipshop-sgpjbg-detail
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
