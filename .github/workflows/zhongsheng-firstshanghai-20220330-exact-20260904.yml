name: Resolve First Shanghai Zhongsheng 20220330 PDF

on:
  push:
    paths:
      - '.github/workflows/zhongsheng-firstshanghai-20220330-exact-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Extract the exact PDF anchor and validate document
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          page='https://www.mystockhk.com/category.aspx?NodeID=81&page=125'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*','Accept-Language':'zh-TW,zh;q=0.9,en;q=0.8'}
          r=s.get(page,headers=h,timeout=(20,120),allow_redirects=True)
          if not r.encoding or r.encoding.lower()=='iso-8859-1': r.encoding=r.apparent_encoding or 'utf-8'
          print('PAGE',r.status_code,len(r.content),r.url,r.encoding,flush=True)
          text=r.text
          idx=max(text.find('中升控股'),text.find('中升集團'))
          print('TARGET_INDEX',idx,flush=True)
          if idx<0:
            Path('raw_page.html').write_text(text,encoding='utf-8')
            raise RuntimeError('target not found in page HTML')
          chunk=text[max(0,idx-12000):idx+16000]
          print('RAW_CHUNK_START\n'+chunk+'\nRAW_CHUNK_END',flush=True)
          Path('target_chunk.html').write_text(chunk,encoding='utf-8')
          soup=BeautifulSoup(text,'html.parser')
          target=None
          for node in soup.find_all(string=re.compile('中升控股|中升集團')):
            if '收購仁孚' in node.parent.get_text(' ',strip=True) or '二手車業務蓄勢待發' in node.parent.get_text(' ',strip=True):
              target=node.parent; break
          if target is None:
            for node in soup.find_all(string=re.compile('中升控股|中升集團')):
              target=node.parent; break
          print('TARGET_TAG',target.name if target else None,str(target)[:2000] if target else None,flush=True)
          # Walk ancestors/siblings and collect every href/onclick/data.
          roots=[]
          cur=target
          while cur is not None and len(roots)<8:
            roots.append(cur); cur=cur.parent
          urls=[]
          for root in roots:
            print('ANCESTOR',root.name,dict(root.attrs),str(root)[:6000],flush=True)
            for tag in root.find_all(True):
              vals=[]
              for attr in ('href','src','data','onclick','data-url','data-href','value'):
                v=tag.get(attr)
                if v: vals.append((attr,str(v)))
              for attr,v in vals:
                print('ATTR',tag.name,attr,repr(v),flush=True)
                for cand in re.findall(r"https?://[^'\"\s<>]+|[^'\"\s<>]+\.pdf(?:\?[^'\"\s<>]*)?|(?:detail|download|view|show|info)[^'\"\s<>]*",v,re.I):
                  urls.append(urljoin(r.url,cand))
          # Also locate the nearest download icon and its parent anchor.
          for img in soup.find_all('img'):
            src=str(img.get('src') or '')
            if 'download_icon' in src.lower():
              parent=img.find_parent('a')
              if parent:
                href=parent.get('href') or parent.get('onclick') or parent.get('data-url')
                nearby=parent.parent.get_text(' ',strip=True) if parent.parent else ''
                if '中升控股' in nearby or '中升集團' in nearby:
                  print('EXACT_DOWNLOAD_PARENT',str(parent),repr(nearby[:3000]),flush=True)
                  if href: urls.append(urljoin(r.url,str(href)))
          # extract URLs in chunk
          for cand in re.findall(r"https?://[^'\"\s<>]+|[^'\"\s<>]+\.pdf(?:\?[^'\"\s<>]*)?",chunk,re.I):
            urls.append(urljoin(r.url,cand))
          # de-dupe and show
          ded=[]; seen=set()
          for u in urls:
            u=u.replace('&amp;','&')
            if u not in seen:
              seen.add(u); ded.append(u)
          print('CANDIDATES',json.dumps(ded,ensure_ascii=False,indent=2),flush=True)
          out=Path('verified'); out.mkdir(exist_ok=True)
          verified=[]
          for u in ded:
            try:
              rr=s.get(u,headers={'User-Agent':ua,'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Referer':r.url},timeout=(15,120),allow_redirects=True)
              print('TRY',u,rr.status_code,rr.headers.get('content-type'),len(rr.content),rr.url,rr.content[:8],flush=True)
              if rr.status_code!=200 or not rr.content.startswith(b'%PDF-') or len(rr.content)<50000: continue
              rd=PdfReader(BytesIO(rr.content),strict=False); pages=len(rd.pages)
              texts=[]
              for i in range(pages):
                try: texts.append(rd.pages[i].extract_text() or '')
                except Exception: texts.append('')
              full=re.sub(r'\s+',' ','\n'.join(texts))
              identity=('中升控股' in full or '中升集團' in full or 'Zhongsheng Group' in full)
              focused=('收購仁孚' in full or '收购仁孚' in full) and ('二手車' in full or '二手车' in full)
              print('PDF_TEXT_CHECK',pages,identity,focused,full[:4000],flush=True)
              if not identity or not focused: continue
              digest=hashlib.sha256(rr.content).hexdigest()
              fn=f'第一上海_中升控股_收购仁孚巩固行业地位_二手车业务蓄势待发_2022-03-30_{pages}页.pdf'
              p=out/fn; p.write_bytes(rr.content)
              q=subprocess.run(['qpdf','--check',str(p)],capture_output=True,text=True)
              if q.returncode not in (0,3): raise RuntimeError(q.stderr)
              verified.append({'filename':fn,'url':rr.url,'pages':pages,'bytes':len(rr.content),'sha256':digest,'sample':full[:8000]})
            except Exception as e:
              print('TRY_ERROR',u,repr(e),flush=True)
          Path('manifest.json').write_text(json.dumps(verified,ensure_ascii=False,indent=2),encoding='utf-8')
          print('VERIFIED_COUNT',len(verified),flush=True)
          PY
      - name: Upload exact result
        uses: actions/upload-artifact@v4
        with:
          name: zhongsheng-firstshanghai-20220330-exact
          path: |
            verified/
            manifest.json
            target_chunk.html
            raw_page.html
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
