name: Temporary Nike report image single test

on:
  push:
    branches:
      - tmp/download-nike-reports-20260830
    paths:
      - .github/workflows/tmp-nike-image-single-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Test image URL variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          base='https://public.fxbaogao.com/report-image/2025/03/23/4742006-1.png'
          i=0
          for url in \
            "$base" \
            "$base?x-oss-process=image/format,webp" \
            "$base?x-oss-process=image/format,png" \
            "$base?x-oss-process=image/resize,w_2000" \
            "$base?x-oss-process=image/quality,q_100"; do
            i=$((i+1))
            curl --http1.1 -L -sS -D "out/$i.headers" -o "out/$i.bin" \
              --connect-timeout 20 --max-time 180 -A "$UA" \
              -e 'https://www.fxbaogao.com/detail/4742006' -H 'Accept: image/avif,image/webp,image/png,image/*,*/*;q=0.8' \
              -H 'Accept-Encoding: identity' "$url" || true
            echo === $i $url ===
            cat "out/$i.headers" || true
            echo SIZE $(stat -c%s "out/$i.bin" 2>/dev/null || echo 0) MAGIC $(head -c 32 "out/$i.bin" 2>/dev/null | xxd -p || true) TYPE $(file -b "out/$i.bin" 2>/dev/null || true)
            strings -n 5 "out/$i.bin" 2>/dev/null | head -20 || true
          done
          ls -lh out

      - name: Upload tests
        uses: actions/upload-artifact@v4
        with:
          name: nike-image-single-test
          path: out/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
