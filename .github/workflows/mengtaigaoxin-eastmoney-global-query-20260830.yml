name: Find Eastmoney info codes for Mengtaigaoxin reports

on:
  push:
    paths:
      - '.github/workflows/mengtaigaoxin-eastmoney-global-query-20260830.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Query narrow date windows globally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import requests

          s = requests.Session()
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Accept': 'application/json,text/plain,*/*',
              'Referer': 'https://data.eastmoney.com/',
          }
          windows = [
              ('2021-06-01','2021-06-30'),
              ('2021-08-01','2021-08-31'),
              ('2023-06-01','2023-06-30'),
              ('2023-08-01','2023-08-31'),
              ('2024-04-01','2024-04-30'),
          ]
          results = []
          seen = set()
          for begin, end in windows:
              for qtype in range(0, 6):
                  for page in range(1, 31):
                      params = {
                          'pageNo': page,
                          'pageSize': 100,
                          'qType': qtype,
                          'beginTime': begin,
                          'endTime': end,
                      }
                      try:
                          r = s.get('https://reportapi.eastmoney.com/report/list', params=params, headers=headers, timeout=90)
                          if r.status_code != 200:
                              print('HTTP', begin, end, qtype, page, r.status_code, len(r.content), flush=True)
                              break
                          obj = r.json()
                      except Exception as exc:
                          print('ERR', begin, end, qtype, page, repr(exc), flush=True)
                          time.sleep(1)
                          continue
                      data = obj.get('data') if isinstance(obj, dict) else None
                      rows = data if isinstance(data, list) else []
                      if isinstance(data, dict):
                          rows = data.get('data') or data.get('list') or data.get('items') or []
                      if not isinstance(rows, list) or not rows:
                          break
                      for item in rows:
                          text = json.dumps(item, ensure_ascii=False, default=str)
                          if '蒙泰高新' not in text and '300876' not in text:
                              continue
                          info = str(item.get('infoCode') or item.get('infocode') or item.get('id') or '')
                          key = info or text
                          if key in seen:
                              continue
                          seen.add(key)
                          results.append(item)
                          print('MATCH', json.dumps(item, ensure_ascii=False), flush=True)
                      if len(rows) < 100:
                          break
          with open('eastmoney_matches.json','w',encoding='utf-8') as f:
              json.dump(results,f,ensure_ascii=False,indent=2)
          print('TOTAL',len(results),flush=True)
          PY
      - name: Upload matches
        uses: actions/upload-artifact@v4
        with:
          name: mengtaigaoxin-eastmoney-global-query
          path: eastmoney_matches.json
          if-no-files-found: error
          retention-days: 3
