name: Scan Chuanyi Eastmoney date windows 20261004

on:
  push:
    paths:
      - '.github/workflows/diag-chuanyi-eastmoney-date-scan-20261004.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Scan report date windows
        run: |
          python - <<'PY'
          import json, requests
          windows=[
            ('2017-08-01','2017-09-10'),
            ('2022-06-20','2022-07-05'),
            ('2022-10-20','2022-10-31'),
            ('2023-03-25','2023-04-05'),
          ]
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*','Content-Type':'application/json'}
          found={}
          for begin,end in windows:
            print('\nWINDOW',begin,end,flush=True)
            for page in range(1,80):
              body={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':begin,'endTime':end,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers=h,timeout=90)
              print('PAGE',page,r.status_code,len(r.content),flush=True)
              r.raise_for_status(); obj=r.json(); rows=obj.get('data') or []; total=int(obj.get('TotalPage') or 0)
              print('META',obj.get('hits'),total,len(rows),flush=True)
              for row in rows:
                blob=' '.join(str(row.get(k) or '') for k in ['title','stockName','stockCode','orgSName','researcher'])
                if row.get('stockCode')=='002866' or '传艺科技' in blob or '传艺' in blob:
                  key=str(row.get('infoCode') or blob)
                  found[key]=row
                  print('MATCH',json.dumps(row,ensure_ascii=False,default=str),flush=True)
              if not rows or page>=total: break
          print('\nFOUND',len(found),flush=True)
          for key,row in found.items():
            print('RESULT',key,json.dumps(row,ensure_ascii=False,default=str),flush=True)
          PY
