name: Temporary final Zhongmu deep report package

on:
  push:
    branches:
      - tmp/download-zhongmu-reports-20260830
    paths:
      - .github/workflows/tmp-zhongmu-final-package.yml

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip

      - name: Download and verify selected original PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output package previews diagnostic
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import datetime as dt
          import hashlib
          import json
          import re
          import subprocess

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          OUTPUT=Path('output'); PACKAGE=Path('package'); PRE=Path('previews'); DIAG=Path('diagnostic')

          reports=[
              {
                  'infoCode':'AP202310251603470880',
                  'broker':'西南证券',
                  'date':'2023-10-25',
                  'title':'动保龙头多维布局，行业复苏蓄势待发',
                  'filename':'01_Zhongmu_Southwest_20231025_18p.pdf',
                  'pages':18,
                  'needles':['中牧股份','动保龙头多维布局'],
              },
              {
                  'infoCode':'AP202207261576546360',
                  'broker':'民生证券',
                  'date':'2022-07-26',
                  'title':'深度报告：养殖后周期全覆盖，迈出市场化改革新步伐',
                  'filename':'02_Zhongmu_Minsheng_20220726_26p.pdf',
                  'pages':26,
                  'needles':['中牧股份','养殖后周期全覆盖'],
              },
              {
                  'infoCode':'AP202204211560626717',
                  'broker':'国信证券',
                  'date':'2022-04-21',
                  'title':'国企改革受益标的，市场化转型再起航',
                  'filename':'03_Zhongmu_Guosen_20220421_34p.pdf',
                  'pages':34,
                  'needles':['中牧股份','国企改革受益标的'],
              },
          ]

          verified=[]
          for i,r in enumerate(reports,1):
              code=r['infoCode']
              url=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf'
              temp=OUTPUT/f'temp_{i}.pdf'
              cmd=[
                  'curl','--http1.1','-L','--fail','--silent','--show-error',
                  '--retry','10','--retry-all-errors','--retry-delay','2',
                  '--connect-timeout','30','--max-time','900','--compressed',
                  '-A',UA,'-e','https://data.eastmoney.com/report/',
                  '-H','Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  url,'-o',str(temp),
              ]
              proc=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              print('DOWNLOAD',code,'RC',proc.returncode,'SIZE',temp.stat().st_size if temp.exists() else 0,'ERR',proc.stderr[-300:])
              if proc.returncode or not temp.exists() or temp.stat().st_size<25000 or temp.read_bytes()[:4]!=b'%PDF':
                  raise RuntimeError(f'Download failed: {code}')

              info=subprocess.check_output(['pdfinfo',str(temp)],text=True,errors='replace')
              m=re.search(r'^Pages:\s*(\d+)',info,re.M)
              pages=int(m.group(1)) if m else 0
              if pages!=r['pages']:
                  raise RuntimeError(f'{code}: actual {pages} pages, expected {r["pages"]}')

              txt=DIAG/f'{code}.txt'
              subprocess.run(['pdftotext','-f','1','-l',str(min(12,pages)),str(temp),str(txt)],check=True)
              compact=''.join(txt.read_text(encoding='utf-8',errors='replace').split())
              for needle in r['needles']:
                  if ''.join(needle.split()) not in compact:
                      raise RuntimeError(f'{code}: verification text missing: {needle}')

              final=OUTPUT/r['filename']
              temp.replace(final)
              for page_no,tag in [(1,'first'),(pages,'last')]:
                  target=PRE/f'{i:02d}_{tag}'
                  subprocess.run(['pdftoppm','-f',str(page_no),'-singlefile','-png','-r','100',str(final),str(target)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  png=Path(str(target)+'.png')
                  if not png.exists() or png.stat().st_size<8000:
                      raise RuntimeError(f'{final.name}: {tag} render failed')

              item=dict(r)
              item.update({
                  'sourceUrl':url,
                  'sizeBytes':final.stat().st_size,
                  'sha256':hashlib.sha256(final.read_bytes()).hexdigest(),
              })
              verified.append(item)
              print('VERIFIED',json.dumps(item,ensure_ascii=False))

          manifest={
              'company':'中牧股份','stockCode':'600195.SH',
              'generatedAtUtc':dt.datetime.now(dt.timezone.utc).isoformat(),
              'count':len(verified),'reports':verified,
          }
          (PACKAGE/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=['中牧股份（600195.SH）券商深度研究报告','',
                 '共3份原始PDF；优先选择较新、篇幅较长且来自不同券商的公司研究。','']
          for i,r in enumerate(verified,1):
              lines += [f'{i}. {r["broker"]}，{r["date"]}，{r["pages"]}页',f'   《{r["title"]}》',f'   文件名：{r["filename"]}','']
          lines += ['核验：PDF文件头、实际页数、公司名称/标题文字、首页与末页渲染均通过。','仅供研究资料整理，不构成投资建议。']
          (PACKAGE/'报告清单与核验说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (PACKAGE/'SHA256SUMS.txt').write_text('\n'.join(f'{r["sha256"]}  {r["filename"]}' for r in verified)+'\n',encoding='utf-8')
          for r in verified:
              (PACKAGE/r['filename']).write_bytes((OUTPUT/r['filename']).read_bytes())
          PY

          (cd package && zip -q -9 ../Zhongmu_Broker_Deep_Reports_3_Verified.zip ./*)
          unzip -t Zhongmu_Broker_Deep_Reports_3_Verified.zip
          ls -lh output package previews Zhongmu_Broker_Deep_Reports_3_Verified.zip

      - name: Upload final verified package
        uses: actions/upload-artifact@v4
        with:
          name: zhongmu-final-deep-reports
          path: |
            Zhongmu_Broker_Deep_Reports_3_Verified.zip
            output/*.pdf
            package/manifest.json
            package/报告清单与核验说明.txt
            package/SHA256SUMS.txt
            previews/*.png
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
