name: Build Kaichuang 600097 filings archive 20261014
on:
  push:
    paths:
      - '.github/workflows/build-kaichuang-600097-filings-20261014.yml'
      - 'scripts/build_kaichuang_600097_filings_20261014.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Build archive
        shell: bash
        run: |
          python scripts/build_kaichuang_600097_filings_20261014.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: kaichuang-600097-filings-20261014
          path: 开创国际_600097_2020-2025年报及最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
