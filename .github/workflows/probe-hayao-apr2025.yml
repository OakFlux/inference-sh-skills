name: Probe Hayao April 2025 reports
on:
  push:
    branches: [chatgpt-hayao-broker-reports-20260906]
    paths: ['.github/workflows/probe-hayao-apr2025.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_hayao_apr2025.py
      - uses: actions/upload-artifact@v4
        with:
          name: hayao-apr2025-probe
          path: |
            hayao-apr2025.json
            hayao-apr2025-pdfs/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
