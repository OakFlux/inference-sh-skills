name: Temporary Hualan Vaccine Sdyanbao probe

on:
  push:
    branches:
      - tmp/download-hualan-vaccine-reports-20260829
    paths:
      - .github/workflows/tmp-hualan-vaccine-sdyanbao-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect report pages, scripts and public download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
            'Accept':'text/html,application/json,application/pdf,*/*;q=0.8',
            'Referer':'https://www.sdyanbao.com/'
          })
          pages=[
            ('hualan_huatai','https://www.sdyanbao.com/detail/255826'),
            ('neighbor','https://www.sdyanbao.com/detail/255827'),
            ('search','https://www.sdyanbao.com/search?keyword=%E5%8D%8E%E5%85%B0%E7%96%AB%E8%8B%97'),
            ('search_q','https://www.sdyanbao.com/search?q=%E5%8D%8E%E5%85%B0%E7%96%AB%E8%8B%97'),
          ]
          patterns=[
            r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
            r'https?://[^\s"\'<>]+(?:download|file|attach|oss|cos|cdn|report)[^\s"\'<>]*',
            r'[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
            r'(?i)(?:downloadUrl|fileUrl|pdfUrl|sourceUrl|ossUrl|url)["\']?\s*[:=]\s*["\']([^"\']+)',
          ]
          script_urls=[]
          for name,url in pages:
            print('\n===== PAGE',name,url,'=====')
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('HTTP',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url)
              r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
              text=r.text
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              visible=' '.join(soup.get_text(' ',strip=True).split())
              print('VISIBLE',visible[:16000])
              for form in soup.find_all('form'):
                print('FORM',form.get('method'),urllib.parse.urljoin(r.url,form.get('action') or ''),str(form)[:5000].replace('\n',' '))
              for pat in patterns:
                for hit in list(dict.fromkeys(re.findall(pat,text,re.I)))[:300]:
                  print('MATCH',hit if isinstance(hit,str) else repr(hit))
              for tag in soup.find_all(['a','button','iframe','embed','object','source','script']):
                for attr in ('href','src','data','data-url','data-id','onclick'):
                  val=tag.get(attr)
                  if not val: continue
                  full=urllib.parse.urljoin(r.url,val) if attr not in ('onclick','data-id') else val
                  blob=(str(tag)+' '+str(full)).lower()
                  if any(k in blob for k in ['pdf','download','report','文件','下载','255826','华兰疫苗']):
                    print('TAG',attr,str(full)[:3000],str(tag)[:3000].replace('\n',' '))
              for sc in soup.find_all('script',src=True):
                u=urllib.parse.urljoin(r.url,sc['src'])
                if u not in script_urls: script_urls.append(u)
            except Exception as e:
              print('PAGE_ERROR',repr(e))

          print('\n===== SCRIPTS',len(script_urls),'=====')
          for u in script_urls:
            try:
              r=s.get(u,timeout=60)
              text=r.text
              if any(k in text.lower() for k in ['download','pdf','fileurl','reporturl','255826','/api/']):
                print('\nSCRIPT',u,'HTTP',r.status_code,'BYTES',len(r.content))
                for pat in patterns:
                  for hit in list(dict.fromkeys(re.findall(pat,text,re.I)))[:300]:
                    print('SCRIPT_MATCH',hit if isinstance(hit,str) else repr(hit))
                for needle in ['download','pdf','fileUrl','reportUrl','255826','detail']:
                  for m in list(re.finditer(needle,text,re.I))[:15]:
                    print('SCRIPT_CTX',needle,text[max(0,m.start()-1200):m.start()+3500].replace('\n',' ')[:4700])
            except Exception as e:
              print('SCRIPT_ERROR',u,repr(e))

          candidates=[
            'https://www.sdyanbao.com/download/255826',
            'https://www.sdyanbao.com/api/download/255826',
            'https://www.sdyanbao.com/api/report/download?id=255826',
            'https://www.sdyanbao.com/api/report/detail/255826',
            'https://www.sdyanbao.com/api/detail/255826',
            'https://www.sdyanbao.com/detail/255826/download',
            'https://www.sdyanbao.com/report/download/255826',
          ]
          for u in candidates:
            try:
              r=s.get(u,timeout=60,allow_redirects=False)
              print('\nCANDIDATE',u,'HTTP',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'LOC',r.headers.get('location'),'HEAD',r.content[:30])
              print(r.text[:3000] if 'text' in str(r.headers.get('content-type')).lower() or 'json' in str(r.headers.get('content-type')).lower() else '')
            except Exception as e:
              print('CANDIDATE_ERROR',u,repr(e))
          PY
