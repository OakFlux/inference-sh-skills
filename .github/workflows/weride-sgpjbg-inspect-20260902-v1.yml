name: Inspect SGPJBG WeRide report download

on:
  push:
    paths:
      - '.github/workflows/weride-sgpjbg-inspect-20260902-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect pages, scripts and download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin,unquote
          import requests
          from bs4 import BeautifulSoup

          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          urls=[
              'https://www.sgpjbg.com/bgdown/1010236.html',
              'https://m.sgpjbg.com.cn/bgdown/1010236.html',
              'https://www.sgpjbg.com.cn/bgdown/1010236.html',
              'https://www.sgpjbg.com/baogao/1010236.html',
          ]
          scripts=[]
          for u in urls:
              try:
                  r=s.get(u,headers=h,timeout=(20,120),allow_redirects=True)
                  print('\nPAGE',u,r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
                  print('COOKIES',s.cookies.get_dict(),flush=True)
                  print(r.text[:120000],flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
                  for tag in soup.find_all('script',src=True):
                      src=urljoin(r.url,tag['src']); scripts.append(src); print('SCRIPT',src,flush=True)
                  for tag in soup.find_all(['a','iframe','embed','object','source','img']):
                      for attr in ('href','src','data','onclick'):
                          val=tag.get(attr)
                          if val and any(k in unquote(val.lower()) for k in ('1010236','pdf','download','down','file','doc')):
                              print('RESOURCE',tag.name,attr,repr(val),flush=True)
                  for key in ['1010236','pdf','download','downurl','fileurl','filepath','oss','cos','cdn','vip']:
                      for m in re.finditer(key,r.text,re.I):
                          print('MATCH',key,repr(r.text[max(0,m.start()-700):m.start()+1800]),flush=True)
              except Exception as e:
                  print('PAGEERR',u,repr(e),flush=True)

          for src in sorted(set(scripts)):
              try:
                  r=s.get(src,headers={**h,'Accept':'*/*','Referer':'https://www.sgpjbg.com/bgdown/1010236.html'},timeout=(20,120))
                  print('\nJS',src,r.status_code,r.headers.get('content-type'),len(r.content),flush=True)
                  text=r.text
                  for key in ['download','downurl','fileurl','filepath','pdfurl','1010236','getFile','getDown','bgdown','vip']:
                      for m in re.finditer(key,text,re.I):
                          print('JSMATCH',key,repr(text[max(0,m.start()-700):m.start()+1800]),flush=True)
              except Exception as e:
                  print('JSERR',src,repr(e),flush=True)

          guesses=[
              'https://pdf.sgpjbg.com/baogao/2025/1229/1010236.pdf',
              'https://pdf.sgpjbg.com/baogao/2025/1226/1010236.pdf',
              'https://pdf.sgpjbg.com/baogao/1010236.pdf',
              'https://www.sgpjbg.com/pdf/1010236.pdf',
              'https://m.sgpjbg.com.cn/pdf/1010236.pdf',
              'https://down.sgpjbg.com/1010236.pdf',
              'https://file.sgpjbg.com/1010236.pdf',
          ]
          for u in guesses:
              try:
                  r=s.get(u,headers={'User-Agent':ua,'Accept':'application/pdf,*/*','Referer':'https://www.sgpjbg.com/bgdown/1010236.html','Range':'bytes=0-4095'},timeout=(15,60),allow_redirects=True)
                  print('FILE',u,r.status_code,r.headers.get('content-type'),r.headers.get('content-length'),len(r.content),r.url,r.content[:16],flush=True)
              except Exception as e:
                  print('FILEERR',u,repr(e),flush=True)
          PY
