name: Package Air China Cargo broker reports

on:
  push:
    paths:
      - '.github/workflows/package_air_china_cargo_broker_reports_20260927.yml'
      - 'tools/package_air_china_cargo_broker_reports_20260927.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf reportlab
      - name: Build and validate package
        run: python tools/package_air_china_cargo_broker_reports_20260927.py
      - uses: actions/upload-artifact@v4
        with:
          name: air-china-cargo-broker-reports-2
          path: |
            国货航_001391_券商深度报告_2份.zip
            air_china_cargo_broker_reports_result.json
            _previews_air_china_cargo_broker_reports/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
