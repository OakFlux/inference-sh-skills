name: Inspect Tianpu Sina endpoints 20261004

on:
  push:
    paths:
      - '.github/workflows/inspect-tianpu-sina-endpoints-20261004.yml'
      - 'scripts/inspect_tianpu_sina_endpoints_20261004.py'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/inspect_tianpu_sina_endpoints_20261004.py
