name: Inspect Air China Cargo broker reports

on:
  push:
    paths:
      - '.github/workflows/inspect_air_china_cargo_reports_20260927.yml'
      - 'tools/inspect_air_china_cargo_reports_20260927.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Inspect report APIs
        run: python tools/inspect_air_china_cargo_reports_20260927.py
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: air-china-cargo-report-inventory
          path: air_china_cargo_report_inventory.json
          if-no-files-found: error
          retention-days: 3
