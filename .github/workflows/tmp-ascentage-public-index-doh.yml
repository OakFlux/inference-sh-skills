name: Temporary Ascentage public index retrieval via DoH

on:
  push:
    branches:
      - 'tmp/ascentage-reports-20260828'

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p reports diagnostics

      - name: Resolve public directory with DNS-over-HTTPS and download matching PDFs
        shell: bash
        run: |
          set -euo pipefail
          HOST='aigc.idigital.com.cn'
          BASE='https://aigc.idigital.com.cn/djyanbao/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'

          curl -L --fail --show-error --silent --compressed \
            --connect-timeout 15 --max-time 60 --retry 2 \
            -H 'accept: application/dns-json' \
            'https://dns.google/resolve?name=aigc.idigital.com.cn&type=A' \
            -o diagnostics/dns_google.json
          curl -L --fail --show-error --silent --compressed \
            --connect-timeout 15 --max-time 60 --retry 2 \
            -H 'accept: application/dns-json' \
            'https://cloudflare-dns.com/dns-query?name=aigc.idigital.com.cn&type=A' \
            -o diagnostics/dns_cloudflare.json || true

          python - <<'PY'
          import json
          from pathlib import Path
          ips=[]
          for p in Path('diagnostics').glob('dns_*.json'):
              try:
                  d=json.loads(p.read_text())
              except Exception:
                  continue
              for a in d.get('Answer') or []:
                  value=str(a.get('data',''))
                  if a.get('type')==1 and value.count('.')==3 and value not in ips:
                      ips.append(value)
          Path('diagnostics/ips.txt').write_text('\n'.join(ips),encoding='utf-8')
          if not ips:
              raise SystemExit('No A records returned by DoH')
          print('Resolved IPs:', ips)
          PY

          : > diagnostics/index_attempts.txt
          fetched=0
          while IFS= read -r ip; do
            [ -n "$ip" ] || continue
            echo "Trying $ip" | tee -a diagnostics/index_attempts.txt
            if curl -L --fail --show-error --silent --compressed \
              --connect-timeout 20 --max-time 180 --retry 1 \
              --user-agent "$UA" --resolve "$HOST:443:$ip" \
              "$BASE" -o diagnostics/index.html; then
              if grep -q '<a ' diagnostics/index.html; then
                echo "Success $ip" | tee -a diagnostics/index_attempts.txt
                printf '%s' "$ip" > diagnostics/working_ip.txt
                fetched=1
                break
              fi
            fi
          done < diagnostics/ips.txt
          test "$fetched" -eq 1

          python - <<'PY'
          import html
          import re
          import urllib.parse
          from pathlib import Path
          text=Path('diagnostics/index.html').read_text(encoding='utf-8',errors='ignore')
          entries=[]
          for href,label in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
              decoded_href=html.unescape(urllib.parse.unquote(href))
              clean=html.unescape(re.sub(r'<[^>]+>',' ',label))
              clean=re.sub(r'\s+',' ',clean).strip()
              decoded=decoded_href+' '+clean
              if '亚盛医药' in decoded and '.pdf' in decoded.lower():
                  entries.append((href,decoded_href,clean))
          with open('diagnostics/ascentage_entries.tsv','w',encoding='utf-8') as f:
              for href,decoded_href,clean in entries:
                  f.write(f'{href}\t{decoded_href}\t{clean}\n')
          if not entries:
              raise SystemExit('No Ascentage PDF entries found in public index')

          priorities=[
              ('细胞凋亡赛道领军者','01_东吴证券_亚盛医药_细胞凋亡赛道领军者_加速迈向全球化_2025-01-27.pdf'),
              ('血液瘤创新药细分龙头','02_国海证券_亚盛医药_血液瘤创新药细分龙头_加速国际化布局_2025-01-14.pdf'),
              ('厚积薄发','03_海通国际_亚盛医药_厚积薄发_逐步迈向全球化Biopharma_2024-10-10.pdf'),
              ('国际化进程加速','04_广发证券_亚盛医药_国际化进程加速_全球临床顺利推进_2024-07-15.pdf'),
              ('小荷才露尖尖角','05_西南证券_亚盛医药_小荷才露尖尖角_细胞凋亡赛道大有可为_2023-05-07.pdf'),
          ]
          chosen=[]; used=set()
          for kw,out in priorities:
              hit=next((e for e in entries if kw in (e[1]+' '+e[2])),None)
              if hit and hit[0] not in used:
                  chosen.append((hit[0],out,hit[1],hit[2])); used.add(hit[0])
              if len(chosen)>=3: break
          # If the directory has other Ascentage broker PDFs, use the most recent remaining entries.
          if len(chosen)<3:
              for e in entries:
                  if e[0] in used: continue
                  chosen.append((e[0],f'{len(chosen)+1:02d}_亚盛医药_券商研究报告.pdf',e[1],e[2])); used.add(e[0])
                  if len(chosen)>=3: break
          with open('diagnostics/chosen.tsv','w',encoding='utf-8') as f:
              for row in chosen: f.write('\t'.join(row)+'\n')
          if len(chosen)<2:
              raise SystemExit(f'Only {len(chosen)} Ascentage reports in index')
          PY

          ip="$(cat diagnostics/working_ip.txt)"
          while IFS=$'\t' read -r href out decoded label; do
            [ -n "$href" ] || continue
            # The href is already HTML-provided and URL-safe; resolve it against the public directory.
            url="${BASE}${href#./}"
            echo -e "$out\t$url" >> diagnostics/download_urls.tsv
            curl -L --fail --show-error --silent --compressed \
              --connect-timeout 20 --max-time 300 --retry 3 --retry-delay 2 \
              --user-agent "$UA" --referer "$BASE" --resolve "$HOST:443:$ip" \
              -H 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8' \
              "$url" -o "reports/$out"
            test "$(head -c 5 "reports/$out")" = '%PDF-'
            test "$(stat -c '%s' "reports/$out")" -gt 100000
          done < diagnostics/chosen.tsv

      - name: Verify PDFs and create manifest
        shell: bash
        run: |
          set -euo pipefail
          count="$(find reports -maxdepth 1 -type f -name '*.pdf' | wc -l)"
          test "$count" -ge 2
          {
            echo '亚盛医药（06855.HK）券商深度报告来源与校验'
            echo
            for f in reports/*.pdf; do
              test "$(head -c 5 "$f")" = '%PDF-'
              pages="$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')"
              bytes="$(stat -c '%s' "$f")"
              pdftotext -f 1 -l 3 "$f" - | grep -Eiq '亚盛医药|Ascentage|06855|6855'
              echo "文件：$(basename "$f")"
              echo "页数：$pages"
              echo "大小：$bytes 字节"
              echo "SHA-256：$(sha256sum "$f" | awk '{print $1}')"
              echo
            done
          } > reports/来源与校验.txt

      - name: Upload verified report package
        uses: actions/upload-artifact@v4
        with:
          name: ascentage-public-index-reports
          path: reports/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascentage-public-index-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
