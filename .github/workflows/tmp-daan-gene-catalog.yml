name: Temporary Daan Gene broker report catalog

on:
  push:
    branches:
      - tmp/download-daan-gene-reports-20260829
    paths:
      - .github/workflows/tmp-daan-gene-catalog.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Query public report catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib, datetime

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          headers = {'User-Agent': UA, 'Referer': 'https://data.eastmoney.com/report/'}

          base = 'https://reportapi.eastmoney.com/report/list'
          items = {}
          variants = [
              ('code_002030', '0', '002030'),
              ('name_q0', '0', '达安基因'),
              ('name_q1', '1', '达安基因'),
          ]
          for variant_name, qtype, code in variants:
              for page in range(1, 11):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*', 'beginTime': '2015-01-01',
                      'endTime': '2030-12-31', 'pageNo': str(page), 'fields': '',
                      'qType': qtype, 'orgCode': '', 'code': code, 'rcode': '',
                      'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                  }
                  url = base + '?' + urllib.parse.urlencode(params)
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      raw = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
                  except Exception as exc:
                      pathlib.Path(f'diagnostic/{variant_name}_page_{page}_error.txt').write_text(repr(exc), encoding='utf-8')
                      break
                  pathlib.Path(f'diagnostic/{variant_name}_page_{page}.json').write_text(raw, encoding='utf-8')
                  text = raw.strip()
                  if text.startswith('datatable(') and text.endswith(')'):
                      text = text[len('datatable('):-1]
                  try:
                      obj = json.loads(text)
                  except Exception:
                      break
                  data = obj.get('data') or []
                  for x in data:
                      title = x.get('title') or ''
                      if x.get('stockCode') == '002030' or x.get('stockName') == '达安基因' or '达安基因' in title:
                          key = x.get('infoCode') or json.dumps(x, sort_keys=True, ensure_ascii=False)
                          items[key] = x
                  if len(data) < 100:
                      break

          rows = list(items.values())
          rows.sort(key=lambda x: (x.get('publishDate') or '', int(x.get('attachPages') or 0)), reverse=True)
          pathlib.Path('diagnostic/eastmoney_relevant.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          with open('diagnostic/eastmoney_summary.tsv', 'w', encoding='utf-8') as f:
              f.write('publishDate\torgSName\tattachPages\treportType\tratingName\tinfoCode\ttitle\tpdf_url\n')
              for x in rows:
                  code = x.get('infoCode', '')
                  pdf = f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf' if code else ''
                  vals = [x.get('publishDate',''), x.get('orgSName',''), x.get('attachPages',''), x.get('reportType',''), x.get('ratingName',''), code, x.get('title',''), pdf]
                  f.write('\t'.join(str(v).replace('\t',' ') for v in vals) + '\n')

          # Cross-check via public Fxbaogao metadata search.
          api = 'https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          all_fx = {}
          for page in range(1, 6):
              payload = {'keywords': '达安基因', 'pageIndex': page, 'pageSize': 100, 'order': 2, 'nop': -1}
              req = urllib.request.Request(api, data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), headers={'User-Agent': UA, 'Content-Type': 'application/json'}, method='POST')
              try:
                  raw = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
              except Exception as exc:
                  pathlib.Path(f'diagnostic/fxbaogao_page_{page}_error.txt').write_text(repr(exc), encoding='utf-8')
                  break
              pathlib.Path(f'diagnostic/fxbaogao_page_{page}.json').write_text(raw, encoding='utf-8')
              try:
                  obj = json.loads(raw)
              except Exception:
                  break
              data = (obj.get('data') or {}).get('dataList') or []
              for r in data:
                  blob = ' '.join(str(r.get(k,'')) for k in ['title','stockName','orgName'])
                  if '达安基因' in blob:
                      all_fx[str(r.get('docId') or len(all_fx))] = r
              if len(data) < 100:
                  break
          fx_rows = list(all_fx.values())
          fx_rows.sort(key=lambda r: r.get('pubTime') or 0, reverse=True)
          pathlib.Path('diagnostic/fxbaogao_relevant.json').write_text(json.dumps(fx_rows, ensure_ascii=False, indent=2), encoding='utf-8')
          with open('diagnostic/fxbaogao_summary.tsv', 'w', encoding='utf-8') as f:
              f.write('pubDate\torgName\tpageNum\tdocId\ttitle\n')
              for r in fx_rows:
                  ts = r.get('pubTime') or 0
                  date = datetime.datetime.utcfromtimestamp(ts).strftime('%Y-%m-%d') if ts else ''
                  vals = [date, r.get('orgName',''), r.get('pageNum',''), r.get('docId',''), r.get('title','')]
                  f.write('\t'.join(str(v).replace('\t',' ') for v in vals) + '\n')

          deep = []
          for x in rows:
              title = x.get('title') or ''
              pages = int(x.get('attachPages') or 0)
              if pages >= 15 or any(k in title for k in ['深度','首次覆盖','首次评级','公司研究']):
                  deep.append(x)
          pathlib.Path('diagnostic/deep_candidates.json').write_text(json.dumps(deep, ensure_ascii=False, indent=2), encoding='utf-8')
          print('EASTMONEY RELEVANT', len(rows), 'DEEP CANDIDATES', len(deep))
          print(pathlib.Path('diagnostic/eastmoney_summary.tsv').read_text(encoding='utf-8')[:50000])
          print('\nFXBAOGAO')
          print(pathlib.Path('diagnostic/fxbaogao_summary.tsv').read_text(encoding='utf-8')[:30000])
          PY

      - name: Upload catalog diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: daan-gene-report-catalog
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
