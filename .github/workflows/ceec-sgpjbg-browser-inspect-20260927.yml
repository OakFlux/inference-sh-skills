name: Inspect public China Energy Engineering reports with browser 20260927
on:
  push:
    paths:
      - '.github/workflows/ceec-sgpjbg-browser-inspect-20260927.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect public report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium beautifulsoup4
          python - <<'PY'
          import json, os, shutil, time
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          print('CHROME',chrome,flush=True)
          if not chrome:
              raise RuntimeError('system Chrome not found')
          opts=Options()
          opts.binary_location=chrome
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1440,2000')
          opts.add_argument('--lang=zh-CN')
          opts.add_argument('--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          urls=[
            'https://www.sgpjbg.com/baogao/106562.html',
            'https://www.sgpjbg.com/zhuanti/chuqingguan.html',
          ]
          out=[]
          try:
            for i,url in enumerate(urls):
              print('OPEN',url,flush=True)
              driver.get(url)
              time.sleep(10)
              title=driver.title
              current=driver.current_url
              source=driver.page_source
              Path(f'page_{i}.html').write_text(source,encoding='utf-8')
              driver.save_screenshot(f'page_{i}.png')
              soup=BeautifulSoup(source,'html.parser')
              links=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data-src','data-url','data-file','data-pdf','onclick'):
                  val=tag.get(attr)
                  if not val: continue
                  text=' '.join(tag.get_text(' ',strip=True).split())[:250]
                  low=(str(val)+' '+text).lower()
                  if any(k in low for k in ('pdf','download','baogao','upload','file','view','中国能建','火然泉达','风光火氢储')):
                    full=urljoin(current,str(val)) if attr not in ('onclick',) else ''
                    links.append({'tag':tag.name,'attr':attr,'value':str(val)[:3000],'full':full,'text':text})
              logs=[]
              for entry in driver.get_log('performance'):
                try:
                  msg=json.loads(entry['message'])['message']
                  if msg.get('method') in ('Network.responseReceived','Network.requestWillBeSent'):
                    params=msg.get('params',{})
                    item=params.get('response') or params.get('request') or {}
                    u=item.get('url','')
                    if any(k in u.lower() for k in ('pdf','download','upload','file','view','106562')):
                      logs.append({'method':msg.get('method'),'url':u,'mimeType':item.get('mimeType'),'status':item.get('status')})
                except Exception:
                  pass
              rec={'url':url,'title':title,'current_url':current,'source_bytes':len(source.encode()),'links':links[:1000],'network':logs[:2000]}
              out.append(rec)
              print('RESULT',json.dumps(rec,ensure_ascii=False)[:30000],flush=True)
          finally:
            driver.quit()
          Path('ceec_sgpjbg_browser_inspection.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ceec-sgpjbg-browser-inspection
          path: |
            ceec_sgpjbg_browser_inspection.json
            page_*.html
            page_*.png
          retention-days: 7
