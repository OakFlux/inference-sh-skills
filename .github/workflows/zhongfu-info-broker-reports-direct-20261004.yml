name: Build direct Zhongfu Information report package 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zhongfu-info-broker-reports-direct-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build and validate package files
        run: python scripts/build_zhongfu_info_broker_reports_20261004.py
      - name: Upload package contents directly
        uses: actions/upload-artifact@v4
        with:
          name: zhongfu-information-300659-broker-reports-direct-20261004
          path: 中孚信息_300659_券商研究报告_2份_20261004/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
