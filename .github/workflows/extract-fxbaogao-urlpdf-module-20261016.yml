      - '.github/workflows/extract-fxbaogao-urlpdf-module-20261016.yml'
      - 'scripts/extract_fxbaogao_urlpdf_module_20261016.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
