name: Find FXBaogao viewer API compact 20261012

on:
  push:
    branches:
      - xingdesheng-broker-reports-20261012
    paths:
      - '.github/workflows/find-fxbaogao-viewer-api-compact-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Find API routes
        run: python scripts/find_fxbaogao_viewer_api_compact_20261012.py
