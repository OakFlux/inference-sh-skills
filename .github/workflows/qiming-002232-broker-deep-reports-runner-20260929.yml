name: Run Qiming Information 002232 broker deep reports packager 20260929

on:
  push:
    paths:
      - '.github/workflows/qiming-002232-broker-deep-reports-runner-20260929.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/qiming-broker-reports-20260929

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        run: python scripts/build_qiming_002232_broker_deep_reports_20260929.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qiming-002232-broker-deep-reports
          path: 启明信息_002232_券商深度报告_*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
