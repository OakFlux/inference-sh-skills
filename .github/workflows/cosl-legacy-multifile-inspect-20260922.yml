name: Inspect COSL legacy multifile filings 20260922
on:
  push:
    paths:
      - '.github/workflows/cosl-legacy-multifile-inspect-20260922.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect pages
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False; s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Accept-Language':'zh-HK,zh;q=0.9,en;q=0.8'})
          paths=['/listedco/listconews/sehk/2007/0425/ltn20070425244_c.htm','/listedco/listconews/sehk/2006/0419/ltn20060419258_c.htm','/listedco/listconews/sehk/2005/0505/ltn20050505106_c.htm','/listedco/listconews/sehk/2005/0414/ltn20050414103_c.htm','/listedco/listconews/sehk/2004/0414/ltn20040414101_c.htm','/listedco/listconews/sehk/2003/0425/ltn20030425110_c.htm','/listedco/listconews/sehk/2002/1111/ltn20021111060_c.htm']
          for path in paths:
              u=urljoin('https://www1.hkexnews.hk',path); r=s.get(u,timeout=120); print('\n===',u,r.status_code,len(r.content),r.headers.get('content-type')); r.raise_for_status()
              soup=BeautifulSoup(r.content,'html.parser')
              print('TEXT',' '.join(soup.get_text(' ',strip=True).split())[:3000])
              for i,a in enumerate(soup.find_all('a',href=True),1):
                  label=' '.join(a.get_text(' ',strip=True).split()); href=urljoin(r.url,a['href'])
                  print('LINK',i,repr(label),href)
          PY