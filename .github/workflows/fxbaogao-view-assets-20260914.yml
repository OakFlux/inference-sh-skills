name: Cache fxbaogao view application assets 20260914

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-view-assets-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download selected application assets
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          from pathlib import Path
          import requests
          urls={
            'production.js':'https://static.fxbaogao.com/pub/js/config/production.js',
            'runtime.js':'https://www.fxbaogao.com/_fxbg/2609031714/js/runtime.f87a2ed9ca0214da6c96.js',
            'vendors.js':'https://www.fxbaogao.com/_fxbg/2609031714/js/vendors~app-pages-fxbg-main-js.dabdfdee4aa31d0d4b4a.chunk.js',
            'app.js':'https://www.fxbaogao.com/_fxbg/2609031714/js/app-pages-fxbg-main-js.71ff9d5297a4e28fc829.chunk.js',
          }
          out=Path('fxassets');out.mkdir()
          for name,url in urls.items():
            r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=(15,90))
            print(name,r.status_code,len(r.content),r.headers.get('content-type'),flush=True)
            r.raise_for_status();(out/name).write_bytes(r.content)
          PY
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-view-assets
          path: fxassets/
          retention-days: 2
