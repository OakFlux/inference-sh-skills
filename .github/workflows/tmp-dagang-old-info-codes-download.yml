name: Temporary Dagang legacy report PDF recovery

on:
  push:
    branches:
      - tmp/download-dagang-reports-20260830
    paths:
      - .github/workflows/tmp-dagang-old-info-codes-download.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip

      - name: Download and inspect legacy report PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered diagnostics previews
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import hashlib, json, re, subprocess

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          reports=[
            ('2013-04-22','AP201304220003195512','业务多元化保障业绩平稳增长'),
            ('2013-03-15','AP201303150003132660','硅片开工率下降，看好系统业务'),
            ('2012-08-27','AP201208270005464468','多元化经营显成效，业绩平稳增长'),
            ('2012-03-26','AP201203260005065522','安置房超预期，光伏等待行业反转'),
            ('2011-08-23','AP201203070005021237','单晶需求更旺 产能陆续释放'),
            ('2011-05-30','AS201202270004008194','大港股份：盈利空间趋于稳定 基本面不变'),
            ('2011-03-24','AS201202260003964718','大港股份：业绩符合预期 光伏新锐迅速扩张'),
            ('2011-02-22','AS201202260003897761','大港股份：业绩符合预期 关注硅片扩产'),
            ('2011-01-31','AS201202260003874062','大港股份：未来以新能源为主 两年有望业绩翻番'),
            ('2010-12-24','AS201202260003819329','大港股份：扩张中的光伏企业'),
          ]
          results=[]
          for date,info,title in reports:
              urls=[
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{date.replace("-","")}.pdf=',
                f'https://pdf.dfcfw.com/pdf/{info}.pdf',
              ]
              dest=Path('recovered')/f'{date}_{info}.pdf'
              ok=False; used=''
              for url in urls:
                  tmp=Path('diagnostics')/f'{info}_{len(results)}.bin'
                  cmd=['curl','--http1.1','-L','--fail','--silent','--show-error','--retry','6','--retry-all-errors','--retry-delay','2','--connect-timeout','25','--max-time','600','--compressed','-A',UA,'-e','https://data.eastmoney.com/report/','-H','Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',url,'-o',str(tmp)]
                  p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  print('TRY',info,url,'RC',p.returncode,'SIZE',tmp.stat().st_size if tmp.exists() else 0,'MAGIC',tmp.read_bytes()[:8] if tmp.exists() else b'','ERR',p.stderr[-300:])
                  if p.returncode==0 and tmp.exists() and tmp.stat().st_size>20000 and tmp.read_bytes()[:4]==b'%PDF':
                      tmp.replace(dest); ok=True; used=url; break
                  tmp.unlink(missing_ok=True)
              rec={'date':date,'infoCode':info,'catalog_title':title,'downloaded':ok,'url':used}
              if ok:
                  try:
                      inf=subprocess.check_output(['pdfinfo',str(dest)],text=True,errors='replace')
                      m=re.search(r'^Pages:\s*(\d+)',inf,re.M); pages=int(m.group(1)) if m else 0
                      txt=Path('diagnostics')/f'{info}.txt'
                      subprocess.run(['pdftotext','-f','1','-l',str(min(5,pages)),str(dest),str(txt)],check=False)
                      text=txt.read_text(errors='replace') if txt.exists() else ''
                      compact=''.join(text.split())
                      rec.update({'pages':pages,'size_bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'first_text':text[:4000],'has_company':('大港股份' in compact or '002077' in compact)})
                      if pages:
                          subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','90',str(dest),str(Path('previews')/f'{info}_first')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                          subprocess.run(['pdftoppm','-f',str(pages),'-singlefile','-png','-r','90',str(dest),str(Path('previews')/f'{info}_last')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      print('RECOVERED',json.dumps({k:v for k,v in rec.items() if k!='first_text'},ensure_ascii=False))
                  except Exception as e:
                      rec['inspect_error']=repr(e)
                      print('INSPECT_ERR',info,repr(e))
              results.append(rec)
          Path('diagnostics/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY')
          for r in sorted([x for x in results if x.get('downloaded')],key=lambda x:(x.get('pages',0),x['date']),reverse=True):
              print(json.dumps({k:v for k,v in r.items() if k!='first_text'},ensure_ascii=False))
          PY
          ls -lh recovered diagnostics previews

      - name: Upload recovered PDFs and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: dagang-legacy-report-recovery
          path: |
            recovered/
            diagnostics/
            previews/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
