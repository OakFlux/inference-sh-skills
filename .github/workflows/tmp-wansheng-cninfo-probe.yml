name: Temporary Wansheng CFI probe

on:
  push:
    branches:
      - tmp/download-wansheng-reports-20260830

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe CFI article range
        shell: bash
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import html
          import re
          import requests

          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          }

          def decode(raw: bytes) -> str:
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      text = raw.decode(enc)
                  except UnicodeDecodeError:
                      continue
                  if '中财网' in text or '万盛股份' in text:
                      return text
              return raw.decode('utf-8', errors='replace')

          def fetch(seq: int):
              url = f'https://www.cfi.net.cn/p20260824{seq:06d}.html'
              try:
                  r = requests.get(url, headers=headers, timeout=25)
                  text = decode(r.content)
                  if r.status_code == 200 and ('万盛股份' in text or '603010' in text):
                      return seq, url, text
              except Exception:
                  return None
              return None

          matches = []
          with ThreadPoolExecutor(max_workers=20) as executor:
              futures = [executor.submit(fetch, seq) for seq in range(4900, 5251)]
              for future in as_completed(futures):
                  item = future.result()
                  if item:
                      matches.append(item)

          print('MATCH COUNT', len(matches), flush=True)
          for seq, url, text in sorted(matches):
              title_match = re.search(r'<title[^>]*>(.*?)</title>', text, flags=re.I|re.S)
              title = html.unescape(re.sub(r'<[^>]+>', '', title_match.group(1))) if title_match else ''
              compact = re.sub(r'\s+', '', re.sub(r'<[^>]+>', '', text))
              print('\nMATCH', seq, url, 'LEN', len(text), 'TITLE', title, flush=True)
              print('HAS FULL TITLE', '2026年半年度报告' in compact, 'HAS SUMMARY', '2026年半年度报告摘要' in compact, flush=True)
              urls = []
              for pattern in [
                  r'https?://[^"\'<>\s]+',
                  r'//[^"\'<>\s]+',
                  r'href=["\']([^"\']+)["\']',
              ]:
                  for value in re.findall(pattern, text, flags=re.I):
                      if isinstance(value, tuple):
                          value = value[0]
                      value = html.unescape(value).replace('\\/', '/')
                      if any(k in value.lower() for k in ('pdf', 'cninfo', 'sse.com.cn', 'disclosure')):
                          urls.append(value)
              for value in dict.fromkeys(urls):
                  print('URL', value, flush=True)
              for marker in ('static.cninfo', '.PDF', '2026年半年度报告'):
                  pos = text.find(marker)
                  if pos >= 0:
                      print('CONTEXT', marker, text[max(0,pos-500):pos+1200].replace('\n',' ')[:1700], flush=True)
          PY
