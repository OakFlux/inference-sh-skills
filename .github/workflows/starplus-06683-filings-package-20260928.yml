name: Build Star Plus Legend 06683 filings package 20260928

on:
  push:
    paths:
      - '.github/workflows/starplus-06683-filings-package-20260928.yml'
      - 'scripts/build_starplus_06683_filings_20260928.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        run: python scripts/build_starplus_06683_filings_20260928.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: starplus-06683-filings-20260928
          path: 巨星传奇_06683_全部年报_招股说明书_2026最新定期报告.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
