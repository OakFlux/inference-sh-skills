name: Temporary Dunhuang Seed Fxbaogao API search

on:
  push:
    branches:
      - 'tmp/dunhuang-seed-fx-api-search-20260829'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe public Fxbaogao search endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cat > /tmp/probe_fx.py <<'PY'
          from __future__ import annotations
          import json, os, subprocess, urllib.parse
          from pathlib import Path

          OUT=Path('diagnostics')
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          BASE='https://api.fxbaogao.com'
          probes=[]

          param_sets=[
            {},
            {'keyword':'敦煌种业'},
            {'key':'敦煌种业'},
            {'query':'敦煌种业'},
            {'searchKey':'敦煌种业'},
            {'keywords':'敦煌种业'},
            {'text':'敦煌种业'},
            {'keyword':'600354'},
            {'key':'600354'},
            {'keyword':'敦煌种业','pageNum':1,'pageSize':50},
            {'key':'敦煌种业','pageNum':1,'pageSize':50},
            {'query':'敦煌种业','page':1,'size':50},
            {'keyword':'敦煌种业','current':1,'size':50},
            {'searchContent':'敦煌种业','pageNum':1,'pageSize':50},
          ]
          endpoints=[
            '/mofoun/report/searchReport',
            '/mofoun/report/searchReportData/facet',
            '/mofoun/report/reportStock/search',
            '/mofoun/report/reportStock/searchAll',
            '/mofoun/report/hotReport/list',
          ]

          def call(method,url,params=None,body=None,index=0):
            path=OUT/f'{index:03d}.body'
            hdr=OUT/f'{index:03d}.headers'
            full=url
            if params:
              full += ('&' if '?' in full else '?') + urllib.parse.urlencode(params)
            cmd=['curl','--http1.1','-L','--silent','--show-error','--retry','2','--retry-all-errors','--connect-timeout','15','--max-time','90','--user-agent',UA,'--referer','https://www.fxbaogao.com/','--header','Origin: https://www.fxbaogao.com','--header','Accept: application/json, text/plain, */*','--header','Accept-Encoding: identity','--dump-header',str(hdr),'--write-out','%{url_effective}\n%{http_code}\n%{content_type}']
            if method=='POST':
              cmd += ['--request','POST','--header','Content-Type: application/json','--data',json.dumps(body or {},ensure_ascii=False)]
            cmd += [full,'--output',str(path)]
            p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
            raw=path.read_bytes() if path.exists() else b''
            text=raw.decode('utf-8','ignore')
            rec={'index':index,'method':method,'url':full,'params':params,'body':body,'returncode':p.returncode,'meta':p.stdout,'stderr':p.stderr[-800:],'bytes':len(raw),'prefix':text[:2500]}
            try: rec['json']=json.loads(text)
            except Exception: pass
            probes.append(rec)

          i=0
          for ep in endpoints:
            for params in param_sets:
              call('GET',BASE+ep,params=params,index=i); i+=1
            for body in param_sets:
              call('POST',BASE+ep,body=body,index=i); i+=1

          OUT.joinpath('probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PROBES',len(probes))
          for r in probes:
            if r.get('json') or r['bytes']>0:
              print(json.dumps({k:r.get(k) for k in ('index','method','url','body','meta','bytes','prefix')},ensure_ascii=False))
          PY
          python /tmp/probe_fx.py

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunhuang-seed-fxbaogao-api-probe
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
