name: Inspect Fxbaogao Xiangrikui report assets 20261012

on:
  push:
    paths:
      - '.github/workflows/inspect-fxbaogao-xiangrikui-20261012.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Inspect detail page and assets
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'}
          urls=['https://www.fxbaogao.com/detail/71264','https://fxbaogao.com/detail/71264']
          for url in urls:
            print('\n===PAGE===',url,flush=True)
            try:
              r=s.get(url,headers=h,timeout=60,allow_redirects=True)
              r.encoding=r.apparent_encoding or 'utf-8'
              text=r.text
              print('STATUS',r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
              print('HEAD',re.sub(r'\s+',' ',text[:3000]),flush=True)
              links=[]
              for m in re.finditer(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',text,re.I):
                full=urljoin(r.url,html.unescape(m.group(1)))
                if any(k in full.lower() for k in ['pdf','report','download','api','71264','image','static','assets']): links.append(full)
              print('LINKS',json.dumps(list(dict.fromkeys(links))[:500],ensure_ascii=False,indent=2),flush=True)
              for pat in ['__NEXT_DATA__','71264','pdf','download','完整报告','pageCount','pages','fileUrl','reportUrl','oss','cos']:
                positions=[m.start() for m in re.finditer(pat,text,re.I)]
                for pos in positions[:10]:
                  print('AROUND',pat,re.sub(r'\s+',' ',text[max(0,pos-800):pos+2500]),flush=True)
            except Exception as e: print('ERROR',repr(e),flush=True)

          tests=[
            'https://www.fxbaogao.com/api/detail/71264',
            'https://www.fxbaogao.com/api/report/71264',
            'https://www.fxbaogao.com/api/report/detail/71264',
            'https://www.fxbaogao.com/api/reports/71264',
            'https://www.fxbaogao.com/download/71264',
            'https://www.fxbaogao.com/pdf/71264',
          ]
          for url in tests:
            try:
              r=s.get(url,headers={**h,'Referer':'https://www.fxbaogao.com/detail/71264'},timeout=40,allow_redirects=True)
              print('\nTEST',url,r.status_code,r.headers.get('content-type'),len(r.content),r.url,repr(r.content[:40]),flush=True)
              if len(r.content)<10000: print(re.sub(r'\s+',' ',r.text)[:3000],flush=True)
            except Exception as e: print('TEST_ERROR',url,repr(e),flush=True)
          PY
