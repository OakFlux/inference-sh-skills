name: Find Wuhan Fingu Eastmoney AP IDs 20261022

on:
  push:
    branches:
      - wuhan-fingu-broker-reports-20261022
    paths:
      - scripts/find_wuhan_fingu_eastmoney_apids_20261022.py
      - .github/workflows/find-wuhan-fingu-eastmoney-apids-20261022.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet requests
      - run: python scripts/find_wuhan_fingu_eastmoney_apids_20261022.py
      - uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-eastmoney-apid-discovery
          path: find_wuhan_fingu_apids
          if-no-files-found: error
          retention-days: 7
