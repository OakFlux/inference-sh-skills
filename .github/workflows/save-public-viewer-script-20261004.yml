name: Save public report viewer script 20261004

on:
  push:
    paths:
      - '.github/workflows/save-public-viewer-script-20261004.yml'
      - 'scripts/query_public_report_catalog_20261004.py'
  workflow_dispatch:

jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Query public catalog
        run: python scripts/query_public_report_catalog_20261004.py
