name: Build Daye 603278 reports ZIP 20260929

on:
  push:
    paths:
      - '.github/workflows/daye-603278-reports-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          STOCK = '603278'
          COMPANY = '大业股份'
          FULL_COMPANY = '山东大业股份有限公司'
          AS_OF = '2026-09-29'
          PACKAGE_NAME = '大业股份_603278.SH_2020-2025年报及最新季报'
          OUT = Path(PACKAGE_NAME)
          OUT.mkdir(parents=True, exist_ok=True)
          VERIFY = Path('_verify')
          VERIFY.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=5,
              connect=5,
              read=5,
              status=5,
              backoff_factor=1.1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept-Encoding': 'identity',
              'Referer': f'https://data.eastmoney.com/notices/stock/{STOCK}.html',
          })

          def clean_title(value: str) -> str:
              text = re.sub(r'<[^>]+>', '', value or '')
              text = text.replace('&nbsp;', '').replace('&#32;', '')
              return re.sub(r'\s+', '', text)

          def fetch_json(url: str, *, params: dict, attempts: int = 6) -> dict:
              errors = []
              for attempt in range(1, attempts + 1):
                  try:
                      with session.get(url, params=params, timeout=(30, 150), stream=True) as response:
                          print('API', params.get('page_index'), 'attempt', attempt, response.status_code, response.url, flush=True)
                          response.raise_for_status()
                          chunks = []
                          for chunk in response.iter_content(64 * 1024):
                              if chunk:
                                  chunks.append(chunk)
                          raw = b''.join(chunks)
                      return json.loads(raw.decode('utf-8'))
                  except Exception as exc:
                      errors.append(repr(exc))
                      time.sleep(attempt * 1.5)
              raise RuntimeError(f'公告接口读取失败：{errors}')

          endpoint = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          rows: list[dict] = []
          found_years: set[int] = set()
          found_quarter = False

          for page in range(1, 21):
              payload = fetch_json(endpoint, params={
                  'page_size': 100,
                  'page_index': page,
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': STOCK,
              })
              data = payload.get('data') or {}
              batch = data.get('list') or data.get('data') or payload.get('list') or []
              print('BATCH', page, len(batch), flush=True)
              if not batch:
                  break
              rows.extend(batch)

              for row in batch:
                  title = clean_title(str(row.get('title') or row.get('notice_title') or row.get('announcement_title') or ''))
                  for year in range(2020, 2026):
                      if f'{year}年年度报告' in title or f'{year}年度报告' in title:
                          found_years.add(year)
                  if re.search(r'2026年(?:第一|第三|一|三)季度报告', title):
                      found_quarter = True
              print('FOUND', sorted(found_years), 'QUARTER', found_quarter, flush=True)
              if found_years == set(range(2020, 2026)) and found_quarter:
                  break
              if len(batch) < 100:
                  break
              time.sleep(0.25)

          if not rows:
              raise RuntimeError('公告接口未返回数据')

          normalized: list[dict] = []
          seen_codes: set[str] = set()
          for row in rows:
              title = clean_title(str(row.get('title') or row.get('notice_title') or row.get('announcement_title') or ''))
              art_code = str(row.get('art_code') or row.get('info_code') or row.get('infoCode') or row.get('announcement_id') or '')
              notice_date = str(row.get('notice_date') or row.get('display_time') or row.get('date') or '')
              if title and art_code and art_code not in seen_codes:
                  seen_codes.add(art_code)
                  normalized.append({'title': title, 'art_code': art_code, 'notice_date': notice_date})

          exclusions = (
              '摘要', '英文版', '英文', '审计报告', '鉴证报告', '内部控制', '社会责任',
              'ESG', '董事会工作', '监事会工作', '监管工作函', '问询函', '回复',
              '核查意见', '提示性公告', '取消', '业绩快报', '业绩预告',
              '财务报表', '专项说明', '募集资金', '更正公告',
          )

          def date_key(item: dict) -> int:
              digits = re.sub(r'\D', '', item.get('notice_date', ''))
              return int(digits[:14] or 0)

          def annual_candidates(year: int) -> list[dict]:
              result = []
              for item in normalized:
                  title = item['title']
                  if f'{year}年年度报告' not in title and f'{year}年度报告' not in title:
                      continue
                  if any(term in title for term in exclusions):
                      continue
                  score = 0
                  if re.fullmatch(rf'(?:{COMPANY}|{FULL_COMPANY})?[:：]?(?:{year}年年度报告|{year}年度报告)(?:\(更正后\)|（更正后）|更正后|修订版|修订)?', title):
                      score += 100
                  if any(term in title for term in ('更正后', '修订版', '修订', '更新后', '更新')):
                      score += 200
                  result.append({**item, '_score': score})
              result.sort(key=lambda x: (x['_score'], date_key(x)), reverse=True)
              return result

          selected_docs: list[dict] = []
          for year in range(2020, 2026):
              candidates = annual_candidates(year)
              if not candidates:
                  related = [x['title'] for x in normalized if str(year) in x['title'] and '年度报告' in x['title']]
                  raise RuntimeError(f'未找到{year}年完整年度报告；相关标题：{related[:40]}')
              chosen = candidates[0]
              selected_docs.append({
                  'filename': f'{year - 2019:02d}_{COMPANY}_{STOCK}_{year}年年度报告.pdf',
                  'display_title': f'{COMPANY}{year}年年度报告',
                  'period': f'{year}年度',
                  'expected_terms': [COMPANY, str(year), '年度报告'],
                  'min_pages': 70,
                  'min_bytes': 500_000,
                  'announcement': chosen,
              })

          quarter_candidates: list[dict] = []
          qre = re.compile(r'2026年(第一|第三|一|三)季度报告')
          for item in normalized:
              title = item['title']
              match = qre.search(title)
              if not match or any(term in title for term in exclusions + ('半年度报告', '中期报告')):
                  continue
              qword = match.group(1)
              qnum = 3 if qword in ('第三', '三') else 1
              score = 100 if re.fullmatch(rf'(?:{COMPANY}|{FULL_COMPANY})?[:：]?2026年(?:第一|第三|一|三)季度报告', title) else 0
              quarter_candidates.append({**item, '_score': score, '_qnum': qnum})

          if not quarter_candidates:
              related = [x['title'] for x in normalized if '2026' in x['title'] and '季度报告' in x['title']]
              raise RuntimeError(f'未找到2026年正式季度报告；相关标题：{related[:40]}')
          quarter_candidates.sort(key=lambda x: (x['_qnum'], date_key(x), x['_score']), reverse=True)
          quarter = quarter_candidates[0]
          qcanonical = '第三' if quarter['_qnum'] == 3 else '第一'
          selected_docs.append({
              'filename': f'07_{COMPANY}_{STOCK}_2026年{qcanonical}季度报告.pdf',
              'display_title': f'{COMPANY}2026年{qcanonical}季度报告',
              'period': f'2026年{qcanonical}季度',
              'expected_terms': [COMPANY, '2026', '季度报告'],
              'min_pages': 6,
              'min_bytes': 70_000,
              'announcement': quarter,
          })

          print('SELECTED', json.dumps([
              {
                  'filename': doc['filename'],
                  'title': doc['announcement']['title'],
                  'art_code': doc['announcement']['art_code'],
                  'date': doc['announcement']['notice_date'],
              }
              for doc in selected_docs
          ], ensure_ascii=False, indent=2), flush=True)

          def mirror_urls(art_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{art_code}_1.pdf',
              ]

          def download_pdf(doc: dict, dest: Path) -> str:
              errors: list[str] = []
              for url in mirror_urls(doc['announcement']['art_code']):
                  for attempt in range(1, 6):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                                  'Accept-Encoding': 'identity',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 600),
                          ) as response:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, response.status_code, url, flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as handle:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          size = tmp.stat().st_size
                          header = tmp.read_bytes()[:8]
                          if size < doc['min_bytes'] or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'无效PDF：size={size}, header={header!r}')
                          tmp.replace(dest)
                          return url
                      except Exception as exc:
                          tmp.unlink(missing_ok=True)
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt * 1.3)
              raise RuntimeError(f'{dest.name}下载失败：{errors}')

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for index, doc in enumerate(selected_docs, start=1):
              dest = OUT / doc['filename']
              source_url = download_pdf(doc, dest)

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf结构检查失败：{dest.name}\n{check.stderr[-2000:]}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'页数异常：{dest.name}仅{pages}页，小于{doc["min_pages"]}页')

              text_path = VERIFY / f'{index:02d}.txt'
              extraction = subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(30, pages)), str(dest), str(text_path)],
                  capture_output=True,
                  text=True,
              )
              sample = text_path.read_text(encoding='utf-8', errors='ignore') if text_path.exists() else ''
              compact = re.sub(r'\s+', '', sample)
              missing_terms = [term for term in doc['expected_terms'] if term not in compact]
              if missing_terms:
                  raise RuntimeError(f'文件身份检查失败：{dest.name}，缺少{missing_terms}；pdftotext={extraction.returncode}')

              render_prefix = VERIFY / f'{index:02d}_page1'
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '90', str(dest), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              png = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not png.exists() or png.stat().st_size < 10_000:
                  raise RuntimeError(f'首页渲染失败：{dest.name}\n{render.stderr[-1000:]}')

              data = dest.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in seen_hashes:
                  raise RuntimeError(f'检测到重复PDF：{dest.name}')
              seen_hashes.add(sha256)

              announcement = doc['announcement']
              record = {
                  'filename': dest.name,
                  'title': doc['display_title'],
                  'period': doc['period'],
                  'announcement_title': announcement['title'],
                  'announcement_date': announcement['notice_date'],
                  'art_code': announcement['art_code'],
                  'announcement_page': f'https://data.eastmoney.com/notices/detail/{STOCK}/{announcement["art_code"]}.html',
                  'pdf_mirror_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 7:
              raise RuntimeError(f'应有7份PDF，实际为{len(records)}份')

          readme = [
              f'{FULL_COMPANY}（{STOCK}.SH）2020-2025年年度报告及最新季报',
              f'整理与核验日期：{AS_OF}',
              '',
              '收录内容：',
              '1. 2020、2021、2022、2023、2024和2025年度完整年度报告，共6份。',
              f'2. 截至{AS_OF}已披露的最新正式季报：{records[-1]["title"]}。',
              '',
              '口径说明：',
              '1. 如同一年度存在更正后或修订版完整年报，优先收录最新版本。',
              '2. 已排除年度报告摘要、英文版、单独审计附件、业绩快报、问询回复、内部控制报告和半年度报告。',
              '3. 公告标题和日期通过公开公告接口检索；PDF为公告文件镜像。',
              '4. 已执行PDF文件头、大小、页数、公司与报告期文本、qpdf结构、首页渲染、SHA-256和ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for number, record in enumerate(records, start=1):
              readme.extend([
                  f'{number}. {record["title"]}',
                  f'   文件：{record["filename"]}',
                  f'   公告标题：{record["announcement_title"]}',
                  f'   公告日期：{record["announcement_date"]}',
                  f'   页数：{record["pages"]}；大小：{record["bytes"] / 1048576:.2f} MB',
                  f'   公告页面：{record["announcement_page"]}',
                  f'   PDF镜像：{record["pdf_mirror_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE_NAME + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC检查失败：{bad}')
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 7:
                  raise RuntimeError(f'ZIP内PDF数量异常：{len(pdf_names)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daye-603278-reports-20260929
          path: 大业股份_603278.SH_2020-2025年报及最新季报.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
