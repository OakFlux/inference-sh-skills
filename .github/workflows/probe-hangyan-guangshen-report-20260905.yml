name: Probe Hangyan Guangshen deep report

on:
  push:
    branches:
      - chatgpt-china-gas-broker-reports-20260905
    paths:
      - '.github/workflows/probe-hangyan-guangshen-report-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_hangyan_guangshen_report_20260905.py
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-guangshen-report-probe-20260905
          path: |
            hangyan-guangshen-results.json
            hangyan-guangshen-probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
