name: Probe Eastmoney by Sany International report titles

on:
  push:
    paths:
      - '.github/workflows/eastmoney-sany-title-probe-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Query report API across narrow date windows
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          s=requests.Session(); s.trust_env=False
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Referer':'https://data.eastmoney.com/',
            'Origin':'https://data.eastmoney.com',
          }
          windows=[
            ('2025-08-12','2025-09-05'),
            ('2023-07-15','2023-07-22'),
            ('2023-05-30','2023-06-07'),
            ('2025-07-20','2025-07-30'),
          ]
          all_rows=[]
          matches=[]
          endpoint='https://reportapi.eastmoney.com/report/list'
          for begin,end in windows:
            for qtype in (0,1):
              for page in range(1,51):
                params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':str(qtype),
                  'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                }
                r=s.get(endpoint,params=params,headers=headers,timeout=(30,180))
                print('GET',begin,end,qtype,page,r.status_code,len(r.content),r.url)
                r.raise_for_status()
                obj=r.json()
                rows=obj.get('data') if isinstance(obj,dict) else []
                if not isinstance(rows,list) or not rows: break
                all_rows.extend(rows)
                for row in rows:
                  txt=' '.join(str(row.get(k) or '') for k in ('title','stockName','indvInduName','orgSName','orgName','authorName','researcher'))
                  if '三一国际' in txt or 'SANY HEAVY' in txt.upper():
                    hit={'window':[begin,end],'qType':qtype,**row}
                    matches.append(hit)
                    print('MATCH',json.dumps(hit,ensure_ascii=False,indent=2))
                total_page=int(obj.get('TotalPage') or obj.get('totalPage') or 0)
                total=int(obj.get('Total') or obj.get('total') or 0)
                if (total_page and page>=total_page) or len(rows)<100 or (total and page*100>=total): break
                time.sleep(.4)
          Path('eastmoney_sany_all_rows.json').write_text(json.dumps(all_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('eastmoney_sany_matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL',len(all_rows),len(matches))
          PY

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: eastmoney-sany-title-probe
          path: |
            eastmoney_sany_all_rows.json
            eastmoney_sany_matches.json
          if-no-files-found: error
          retention-days: 7
