name: Probe Vzkoo China Conch Venture report

on:
  push:
    paths:
      - '.github/workflows/conch-venture-vzkoo-probe-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect Vzkoo page and public reader
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          urls=[
              'https://www.vzkoo.com/read/20230328e73630148250f23e20658b73.html',
              'https://r.jina.ai/http://www.vzkoo.com/read/20230328e73630148250f23e20658b73.html',
              'https://r.jina.ai/https://www.vzkoo.com/read/20230328e73630148250f23e20658b73.html',
          ]
          for url in urls:
              try:
                  r=requests.get(url,headers={'User-Agent':ua,'Accept':'text/html,application/json,*/*'},timeout=(20,180),allow_redirects=True)
                  print('\n=== PAGE',url,r.status_code,r.headers.get('content-type'),len(r.content),r.url,'===',flush=True)
                  print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False),flush=True)
                  print(r.text[:100000],flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  for tag in soup.find_all(['a','iframe','embed','object','script','source','img']):
                      for attr in ('href','src','data'):
                          val=tag.get(attr)
                          if val:
                              full=urljoin(r.url,val)
                              hay=full.lower()
                              if any(k in hay for k in ['pdf','download','file','report','reader','20230328e736','oss','cos','cdn']):
                                  print('RESOURCE',tag.name,attr,repr(full),flush=True)
                  for match in sorted(set(re.findall(r'https?://[^"\'<>\s\\]+',r.text))):
                      if any(k in match.lower() for k in ['pdf','download','file','report','oss','cos','cdn']):
                          print('URLMATCH',match[:2000],flush=True)
              except Exception as exc:
                  print('ERROR',url,repr(exc),flush=True)
          PY
