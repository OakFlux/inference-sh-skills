name: Search FXBaogao for Quantgroup reports 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-fxbaogao-fast-search-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect app and query APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json,re,html
          from urllib.parse import urljoin,quote
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          pages=['https://www.fxbaogao.com/','https://www.fxbaogao.com/search?keyword='+quote('量化派'),'https://www.fxbaogao.com/search?keyword=02685','https://www.fxbaogao.com/search?keyword=Quantgroup']
          scripts=[]
          for u in pages:
            try:
              r=s.get(u,timeout=(15,40),allow_redirects=True)
              print('\nPAGE',u,r.status_code,r.url,len(r.content),r.headers.get('content-type'))
              soup=BeautifulSoup(r.text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              txt=' '.join(soup.get_text(' ',strip=True).split())
              print('TEXT',txt[:1500])
              for sc in soup.find_all('script',src=True): scripts.append(urljoin(r.url,sc['src']))
              for m in re.findall(r'https?://[^\s"\'<>]+',r.text):
                if any(k in m for k in ['api.','searchReport','mofoun']): print('INLINEURL',html.unescape(m)[:1200])
            except Exception as e: print('PAGEERR',u,repr(e))
          print('SCRIPT_COUNT',len(set(scripts)))
          bodies=[]
          for i,u in enumerate(sorted(set(scripts))[:80]):
            try:
              r=s.get(u,timeout=(15,45))
              if r.status_code!=200 or len(r.content)>12_000_000: continue
              text=r.text
              if any(k in text for k in ['searchReport','getReportPreviewImages','mofoun/report']):
                print('\nSCRIPT',i,u,'LEN',len(text))
                for key in ['searchReport','getReportPreviewImages','reportList','keyword','pageSize']:
                  pos=0;c=0
                  while True:
                    pos=text.find(key,pos)
                    if pos<0 or c>=20:break
                    print('CTX',key,text[max(0,pos-500):pos+900].replace('\n',' ')[:1400])
                    pos+=len(key);c+=1
            except Exception as e: print('SCRIPTERR',u,repr(e))

          base='https://api.fxbaogao.com'
          endpoints=[
            '/mofoun/report/searchReport/list',
            '/mofoun/report/searchReport/search',
            '/mofoun/report/searchReport/page',
            '/mofoun/report/searchReport',
            '/mofoun/report/report/search',
            '/mofoun/report/report/list',
            '/mofoun/report/searchReport/searchReport',
          ]
          payloads=[
            {'keyword':'量化派','pageNum':1,'pageSize':50},
            {'keyWord':'量化派','pageNum':1,'pageSize':50},
            {'searchValue':'量化派','pageNum':1,'pageSize':50},
            {'title':'量化派','pageNum':1,'pageSize':50},
            {'keyword':'02685','pageNum':1,'pageSize':50},
            {'keyword':'Quantgroup','pageNum':1,'pageSize':50},
          ]
          hdr={'Accept':'application/json,text/plain,*/*','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'}
          for ep in endpoints:
            for p in payloads:
              for method in ['GET','POST']:
                try:
                  if method=='GET': r=s.get(base+ep,params=p,headers=hdr,timeout=(10,30))
                  else: r=s.post(base+ep,json=p,headers=hdr,timeout=(10,30))
                  t=r.text
                  if r.status_code!=404 or len(t)>100:
                    print('\nAPI',method,ep,p,'STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'),'BODY',t[:5000])
                except Exception as e: print('APIERR',method,ep,p,repr(e))
          PY
