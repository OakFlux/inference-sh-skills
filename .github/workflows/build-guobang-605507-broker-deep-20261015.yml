name: Build Guobang 605507 broker deep archive 20261015
on:
  push:
    paths:
      - '.github/workflows/build-guobang-605507-broker-deep-20261015.yml'
      - 'scripts/build_guobang_605507_broker_deep_archive_20261015.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Patch broker metadata validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_guobang_605507_broker_deep_archive_20261015.py')
          text = path.read_text(encoding='utf-8')
          old = 'broker_text = str(metadata.get("orgSName") or metadata.get("orgName") or "")\n        if report["broker"] not in broker_text:'
          new = 'broker_text = str(metadata.get("orgSName") or "") + " " + str(metadata.get("orgName") or "")\n        if report["broker"] not in broker_text and report["broker_full"] not in broker_text:'
          if old not in text:
              raise RuntimeError('Expected broker validation block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build archive
        shell: bash
        run: |
          python scripts/build_guobang_605507_broker_deep_archive_20261015.py
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: guobang-605507-broker-deep-20261015
          path: 国邦医药_605507_券商深度报告_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
