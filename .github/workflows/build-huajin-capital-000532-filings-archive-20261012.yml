name: Build Solex 603992 filings via registered workflow

on:
  push:
    paths:
      - '.github/workflows/build-huajin-capital-000532-filings-archive-20261012.yml'
      - 'scripts/build_solex_603992_filings_20261014.py'
      - 'scripts/build_solex_603992_filings_20261014_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        run: python scripts/build_solex_603992_filings_20261014.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: solex-603992-filings-20261014
          path: 松霖科技_603992_2020-2025年报_2026最新季报及半年报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
