name: Build ST Lianguang 600363 filings via registered workflow
# Revision 2: accept 2020年度报告全文 title
on:
  push:
    paths:
      - '.github/workflows/build-huajin-capital-000532-filings-archive-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Patch historical annual-report title format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_st_lianguang_600363_filings_20261014.py')
          text = path.read_text(encoding='utf-8')
          old = 're.search(r"(20\\d{2})年年度报告", title)'
          new = 're.search(r"(20\\d{2})年?年度报告", title)'
          count = text.count(old)
          if count < 2:
              raise RuntimeError(f'Expected at least 2 annual-title patterns, found {count}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build ST Lianguang archive
        shell: bash
        run: |
          python scripts/build_st_lianguang_600363_filings_20261014.py
      - name: Upload ST Lianguang archive
        uses: actions/upload-artifact@v4
        with:
          name: st-lianguang-600363-filings-20261014
          path: ST联光_600363_2020-2025年报及最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
