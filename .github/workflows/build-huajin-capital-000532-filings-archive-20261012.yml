name: Build Huajin Capital filings archive 20261012
on:
  push:
    paths:
      - '.github/workflows/build-huajin-capital-000532-filings-archive-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Download validate and package filings
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          COMPANY = '华金资本'
          FULL_COMPANY = '珠海华金资本股份有限公司'
          CODE = '000532'
          CHECKED_AS_OF = '2026-10-12'
          PACKAGE_NAME = '华金资本_000532_2020-2025年报及最新季报'
          PACKAGE_DIR = Path(PACKAGE_NAME)
          ANNUAL_DIR = PACKAGE_DIR / '01_年度报告'
          QUARTER_DIR = PACKAGE_DIR / '02_最新季报'
          VERIFY_DIR = Path('_verify_huajin_000532')
          for d in (ANNUAL_DIR, QUARTER_DIR, VERIFY_DIR):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8',
          }

          def get(url, referer=None, require_pdf=False):
              last = None
              for attempt in range(1, 5):
                  h = dict(headers)
                  if referer:
                      h['Referer'] = referer
                  try:
                      r = session.get(url, headers=h, timeout=180, allow_redirects=True)
                      print('HTTP', attempt, r.status_code, r.headers.get('content-type'), len(r.content), r.url, flush=True)
                      last = r
                      if r.status_code == 200 and (not require_pdf or r.content.startswith(b'%PDF')):
                          return r
                  except Exception as exc:
                      print('REQUEST_ERROR', attempt, url, repr(exc), flush=True)
                      last = exc
                  time.sleep(attempt * 2)
              if isinstance(last, Exception):
                  raise last
              return last

          def collect_entries(page_type):
              url = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{CODE}/page_type/{page_type}.phtml'
              r = get(url)
              r.encoding = r.apparent_encoding or 'gb18030'
              soup = BeautifulSoup(r.text, 'html.parser')
              out = []
              for a in soup.find_all('a', href=True):
                  title = re.sub(r'\s+', ' ', a.get_text(' ', strip=True)).strip()
                  href = a.get('href', '').strip()
                  if not title or 'vCB_AllBulletinDetail.php' not in href:
                      continue
                  parent_text = re.sub(r'\s+', ' ', a.parent.get_text(' ', strip=True)) if a.parent else title
                  date_match = re.search(r'(20\d{2}-\d{2}-\d{2})', parent_text)
                  out.append({
                      'title': title,
                      'detail_url': urljoin(r.url, href),
                      'announcement_date': date_match.group(1) if date_match else '',
                      'list_url': url,
                  })
              # De-duplicate by detail URL.
              dedup = []
              seen = set()
              for x in out:
                  if x['detail_url'] not in seen:
                      seen.add(x['detail_url'])
                      dedup.append(x)
              print('ENTRIES', page_type, len(dedup), json.dumps(dedup[:20], ensure_ascii=False), flush=True)
              return dedup

          annual_entries = collect_entries('ndbg')
          quarter_entries = collect_entries('yjdbg') + collect_entries('sjdbg')

          selected = []
          for year in range(2020, 2026):
              candidates = [
                  x for x in annual_entries
                  if f'{year}年年度报告' in x['title']
                  and '摘要' not in x['title']
                  and '英文' not in x['title']
              ]
              if not candidates:
                  raise RuntimeError(f'No annual report found for {year}')
              candidates.sort(key=lambda x: (
                  int(any(k in x['title'] for k in ['更新后', '修订版', '更正后'])),
                  x['announcement_date'],
                  len(x['title'])
              ), reverse=True)
              chosen = dict(candidates[0])
              chosen.update({
                  'period': f'{year}年度',
                  'type': '年度报告',
                  'year': year,
                  'quarter': 0,
                  'filename': f'华金资本_{year}年年度报告.pdf',
                  'destination_dir': ANNUAL_DIR,
              })
              selected.append(chosen)

          q_candidates = []
          for x in quarter_entries:
              title = x['title']
              if '摘要' in title or '英文' in title:
                  continue
              ym = re.search(r'(20\d{2})年', title)
              if not ym:
                  continue
              year = int(ym.group(1))
              if '第三季度报告' in title or '三季度报告' in title:
                  quarter = 3
              elif '第一季度报告' in title or '一季度报告' in title:
                  quarter = 1
              else:
                  continue
              q_candidates.append((year, quarter, x))
          if not q_candidates:
              raise RuntimeError('No quarterly report found')
          q_candidates.sort(key=lambda t: (t[0], t[1], t[2]['announcement_date']), reverse=True)
          q_year, q_quarter, q_entry = q_candidates[0]
          q_chosen = dict(q_entry)
          q_cn = '第一季度' if q_quarter == 1 else '第三季度'
          q_chosen.update({
              'period': f'{q_year}年{q_cn}',
              'type': '季度报告',
              'year': q_year,
              'quarter': q_quarter,
              'filename': f'华金资本_{q_year}年{q_cn}报告.pdf',
              'destination_dir': QUARTER_DIR,
          })
          selected.append(q_chosen)

          print('SELECTED', json.dumps([{k:v for k,v in x.items() if k != 'destination_dir'} for x in selected], ensure_ascii=False, indent=2), flush=True)

          def resolve_pdf_url(entry):
              r = get(entry['detail_url'], referer=entry['list_url'])
              r.encoding = r.apparent_encoding or 'gb18030'
              soup = BeautifulSoup(r.text, 'html.parser')
              links = []
              for a in soup.find_all('a', href=True):
                  text = re.sub(r'\s+', ' ', a.get_text(' ', strip=True))
                  full = urljoin(r.url, a['href'].strip())
                  if ('下载公告' in text or full.lower().endswith('.pdf')) and 'file.finance.sina.com.cn' in full:
                      links.append(full)
              if not links:
                  for m in re.finditer(r'https?://file\.finance\.sina\.com\.cn/[^\"\'<>\s]+?\.PDF', r.text, re.I):
                      links.append(m.group(0))
              if not links:
                  raise RuntimeError(f'No PDF link resolved from {entry["detail_url"]}')
              return links[0]

          records = []
          seen_hashes = set()
          for idx, entry in enumerate(selected, 1):
              pdf_url = resolve_pdf_url(entry)
              r = get(pdf_url, referer=entry['detail_url'], require_pdf=True)
              if not r.content.startswith(b'%PDF') or len(r.content) < 50_000:
                  raise RuntimeError(f'Invalid PDF response for {entry["title"]}: {len(r.content)} bytes')
              path = entry['destination_dir'] / entry['filename']
              path.write_bytes(r.content)

              raw = path.read_bytes()
              sha = hashlib.sha256(raw).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'Duplicate PDF detected: {path}')
              seen_hashes.add(sha)

              qpdf = subprocess.run(['qpdf', '--check', str(path)], text=True, capture_output=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {path}: {qpdf.stdout}\n{qpdf.stderr}')

              reader = PdfReader(str(path))
              pages = len(reader.pages)
              if pages < 5:
                  raise RuntimeError(f'Unexpectedly short report: {path}, pages={pages}')

              text_path = VERIFY_DIR / f'{idx:02d}.txt'
              subprocess.run(['pdftotext', '-f', '1', '-l', str(min(10, pages)), str(path), str(text_path)], check=True)
              text = text_path.read_text(encoding='utf-8', errors='ignore')
              compact = re.sub(r'\s+', '', text)
              if COMPANY not in compact and FULL_COMPANY not in compact and CODE not in compact:
                  raise RuntimeError(f'Company identity check failed for {path}')
              if str(entry['year']) not in compact:
                  raise RuntimeError(f'Report year check failed for {path}')

              render_pages = sorted(set([1, max(1, (pages + 1)//2), pages]))
              rendered = []
              for pno in render_pages:
                  base = VERIFY_DIR / f'{idx:02d}_p{pno}'
                  cp = subprocess.run([
                      'pdftoppm', '-f', str(pno), '-l', str(pno), '-singlefile', '-png', '-r', '100',
                      str(path), str(base)
                  ], text=True, capture_output=True)
                  if cp.returncode != 0:
                      raise RuntimeError(f'PDF render failed for {path}, page {pno}: {cp.stderr}')
                  img = Path(str(base) + '.png')
                  if not img.exists() or img.stat().st_size < 10_000:
                      raise RuntimeError(f'Invalid render output: {img}')
                  rendered.append(str(img))

              record = {
                  'period': entry['period'],
                  'type': entry['type'],
                  'announcement_date': entry['announcement_date'],
                  'source_title': entry['title'],
                  'relative_path': str(path.relative_to(PACKAGE_DIR)),
                  'pages': pages,
                  'bytes': path.stat().st_size,
                  'sha256': sha,
                  'list_url': entry['list_url'],
                  'detail_url': entry['detail_url'],
                  'source_url': pdf_url,
                  'download_final_url': r.url,
                  'qpdf_return_code': qpdf.returncode,
                  'rendered_pages': render_pages,
                  'render_files': rendered,
                  'company_identity_verified': True,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          latest = records[-1]
          readme = f'''华金资本（000532）2020—2025年年度报告及最新季报

核对日期：{CHECKED_AS_OF}

收录范围
- 2020—2025年年度报告全文，共6份。
- 最新已披露季报：{latest['period']}报告，公告日期：{latest['announcement_date'] or '见来源清单'}。
- 半年度报告属于中期报告，不按“季报”口径收录。

来源及筛选
- 文件来自新浪财经公司公告PDF镜像，内容为上市公司披露的原始PDF。
- 已排除年度报告摘要、英文版及其他非全文文件；若同一年度存在更新后版本，优先采用更新后版本。

校验
- 每份PDF均检查文件头、qpdf结构、实际页数、公司名称或股票代码、报告年份。
- 每份PDF均渲染首页、中间页和末页验证可正常显示。
- 文件来源和页数见“文件清单.csv”与“manifest.json”；逐文件SHA-256见“SHA256SUMS.txt”。
'''
          (PACKAGE_DIR / 'README.txt').write_text(readme, encoding='utf-8')

          fields = ['period','type','announcement_date','source_title','relative_path','pages','bytes','sha256','detail_url','source_url','download_final_url','qpdf_return_code','company_identity_verified']
          with (PACKAGE_DIR / '文件清单.csv').open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for rec in records:
                  writer.writerow({k: rec.get(k, '') for k in fields})

          with (PACKAGE_DIR / 'SHA256SUMS.txt').open('w', encoding='utf-8') as f:
              for rec in records:
                  f.write(f"{rec['sha256']}  {rec['relative_path']}\n")

          manifest = {
              'package_name': PACKAGE_NAME,
              'company': FULL_COMPANY,
              'short_name': COMPANY,
              'stock_code': CODE,
              'checked_as_of': CHECKED_AS_OF,
              'annual_report_years': list(range(2020, 2026)),
              'latest_quarterly_report': latest['period'] + '报告',
              'document_count': len(records),
              'records': records,
          }
          (PACKAGE_DIR / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = Path(PACKAGE_NAME + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for item in sorted(PACKAGE_DIR.rglob('*')):
                  if item.is_file():
                      zf.write(item, arcname=str(item))
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure at {bad}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, 'bytes', zip_path.stat().st_size, 'sha256', zip_sha, flush=True)
          PY
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: huajin-capital-000532-filings-20261012
          path: 华金资本_000532_2020-2025年报及最新季报.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
