name: Temporary Wansheng final packager

on:
  push:
    branches:
      - tmp/download-wansheng-reports-20260830

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf zip

      - name: Download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests

          OUTPUT_DIR = Path("万盛股份_2020-2025年报及最新季报")
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
          })

          annual_urls = {
              2020: "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-3/2021-03-23/6964909.PDF",
              2021: "https://static.cninfo.com.cn/finalpage/2022-04-30/1213266702.PDF",
              2022: "https://static.cninfo.com.cn/finalpage/2023-03-28/1216233681.PDF",
              2023: "https://static.cninfo.com.cn/finalpage/2024-03-26/1219401525.PDF",
              2024: "https://static.cninfo.com.cn/finalpage/2025-03-25/1222880125.PDF",
              2025: "https://static.cninfo.com.cn/finalpage/2026-03-24/1225025123.PDF",
          }

          def discover_latest_pdf() -> tuple[str, str]:
              endpoint = "https://np-anotice-stock.eastmoney.com/api/security/ann"
              variants = [
                  {
                      "sr": "-1",
                      "page_size": "100",
                      "page_index": "1",
                      "ann_type": "A",
                      "client_source": "web",
                      "stock_list": "603010",
                      "f_node": "0",
                      "s_node": "0",
                      "begin_time": "2026-08-20",
                      "end_time": "2026-08-30",
                  },
                  {
                      "sr": "-1",
                      "page_size": "100",
                      "page_index": "1",
                      "ann_type": "SHA",
                      "client_source": "web",
                      "stock_list": "603010",
                      "f_node": "0",
                      "s_node": "0",
                      "begin_time": "2026-08-20",
                      "end_time": "2026-08-30",
                  },
                  {
                      "sr": "-1",
                      "page_size": "100",
                      "page_index": "1",
                      "ann_type": "A",
                      "client_source": "web",
                      "stock_list": "603010",
                      "f_node": "1",
                      "s_node": "0",
                  },
              ]
              errors = []
              for params in variants:
                  try:
                      response = session.get(
                          endpoint,
                          params=params,
                          headers={
                              "Referer": "https://data.eastmoney.com/notices/stock/603010.html",
                              "Accept": "application/json,text/plain,*/*",
                          },
                          timeout=90,
                      )
                      print("Eastmoney query", response.url, response.status_code, flush=True)
                      response.raise_for_status()
                      payload = response.json()
                      print("Eastmoney success", payload.get("success"), "error", payload.get("error"), flush=True)
                      items = ((payload.get("data") or {}).get("list") or [])
                      print("Eastmoney items", len(items), flush=True)
                      for item in items:
                          title = str(item.get("title_ch") or item.get("title") or "")
                          art_code = str(item.get("art_code") or "")
                          notice_date = str(item.get("notice_date") or item.get("display_time") or "")
                          print("Eastmoney item", notice_date, art_code, title, flush=True)
                          compact = re.sub(r"\s+", "", title)
                          if (
                              "2026年半年度报告" in compact
                              and "摘要" not in compact
                              and art_code
                          ):
                              return (
                                  f"https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf",
                                  art_code,
                              )
                  except Exception as exc:
                      errors.append(str(exc))
                      print("Eastmoney attempt failed", repr(exc), flush=True)
              raise RuntimeError("Eastmoney did not return the full 2026 half-year report: " + " | ".join(errors))

          def get_pages(path: Path) -> int:
              result = subprocess.run(
                  ["pdfinfo", str(path)],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              match = re.search(r"^Pages:\s+(\d+)", result.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f"Cannot read page count: {path}")
              return int(match.group(1))

          def validate(path: Path, year: int, report_type: str, minimum_pages: int) -> int:
              if path.stat().st_size < 20_000 or path.read_bytes()[:4] != b"%PDF":
                  raise RuntimeError(f"Not a PDF: {path}")
              pages = get_pages(path)
              if pages < minimum_pages:
                  raise RuntimeError(f"Too few pages for {path}: {pages}")
              text = subprocess.run(
                  ["pdftotext", "-f", "1", "-l", str(min(35, pages)), str(path), "-"],
                  text=True,
                  capture_output=True,
                  errors="ignore",
              ).stdout
              compact = re.sub(r"\s+", "", text)
              if "万盛股份" not in compact and "浙江万盛股份有限公司" not in compact:
                  raise RuntimeError(f"Company-name validation failed: {path}")
              if f"{year}年" not in compact:
                  raise RuntimeError(f"Year validation failed: {path}")
              expected = "年度报告" if report_type == "annual" else "半年度报告"
              if expected not in compact:
                  raise RuntimeError(f"Report-type validation failed: {path}")
              if "摘要" in compact[:500]:
                  raise RuntimeError(f"Summary selected instead of full report: {path}")
              qpdf = subprocess.run(["qpdf", "--check", str(path)], text=True, capture_output=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f"qpdf failed: {path}\n{qpdf.stdout}\n{qpdf.stderr}")
              return pages

          def download(urls: list[str], destination: Path, year: int, report_type: str, minimum_pages: int):
              last_error = None
              for url in urls:
                  for attempt in range(1, 5):
                      temporary = destination.with_suffix(".pdf.part")
                      temporary.unlink(missing_ok=True)
                      try:
                          print("Downloading", destination.name, url, flush=True)
                          referer = (
                              "https://data.eastmoney.com/"
                              if "dfcfw.com" in url
                              else "https://www.cninfo.com.cn/"
                              if "cninfo" in url
                              else "https://money.finance.sina.com.cn/"
                          )
                          with session.get(
                              url,
                              headers={
                                  "Referer": referer,
                                  "Accept": "application/pdf,application/octet-stream;q=0.9,*/*;q=0.8",
                              },
                              stream=True,
                              timeout=(30, 900),
                          ) as response:
                              response.raise_for_status()
                              with temporary.open("wb") as handle:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          pages = validate(temporary, year, report_type, minimum_pages)
                          temporary.replace(destination)
                          data = destination.read_bytes()
                          return url, pages, len(data), hashlib.sha256(data).hexdigest()
                      except Exception as exc:
                          last_error = exc
                          temporary.unlink(missing_ok=True)
                          print("Attempt failed", attempt, url, repr(exc), flush=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f"All sources failed for {destination}: {last_error}")

          records = []
          for year in range(2020, 2026):
              path = OUTPUT_DIR / f"万盛股份_{year}年年度报告.pdf"
              source, pages, size, digest = download(
                  [annual_urls[year]], path, year, "annual", 120
              )
              records.append((path.name, pages, size, digest, source))
              print("Verified", path.name, pages, "pages", flush=True)

          latest_url, art_code = discover_latest_pdf()
          latest_path = OUTPUT_DIR / "万盛股份_2026年半年度报告.pdf"
          source, pages, size, digest = download(
              [
                  latest_url,
                  latest_url.replace("https://pdf.dfcfw.com", "http://pdf.dfcfw.com"),
              ],
              latest_path,
              2026,
              "half",
              60,
          )
          records.append((latest_path.name, pages, size, digest, source))
          print("Verified", latest_path.name, pages, "pages", "art_code", art_code, flush=True)

          notes = [
              "万盛股份（603010.SH）定期报告包，共7份完整PDF。",
              "",
              "收录范围：2020—2025年年度报告，以及截至2026年8月30日最新的2026年半年度报告。",
              "全部年报与半年报均为全文版，不以摘要替代。",
              "",
          ]
          for name, pages, size, digest, source in records:
              notes.append(f"{name} | {pages}页 | {size}字节 | SHA256 {digest}")
              notes.append(f"来源：{source}")
          notes.extend([
              "",
              "核验项目：PDF文件头、公司名称、报告年度和类型、最低页数、qpdf结构检查及ZIP CRC。",
          ])
          (OUTPUT_DIR / "报告清单与核验说明.txt").write_text("\n".join(notes), encoding="utf-8")
          (OUTPUT_DIR / "SHA256SUMS.txt").write_text(
              "\n".join(f"{digest}  {name}" for name, _, _, digest, _ in records) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("万盛股份_2020-2025年报及最新季报.zip")
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for file_path in sorted(OUTPUT_DIR.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(file_path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != 7:
                  raise RuntimeError(f"Expected 7 PDFs, found {len(pdfs)}")
          print("Created", zip_path, zip_path.stat().st_size, "bytes", flush=True)
          PY

          unzip -t '万盛股份_2020-2025年报及最新季报.zip'
          ls -lh '万盛股份_2020-2025年报及最新季报.zip' '万盛股份_2020-2025年报及最新季报'

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wansheng-final-package
          path: 万盛股份_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
