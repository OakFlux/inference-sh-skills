name: Discover Xinhua Winshare broker reports

on:
  push:
    branches:
      - tmp/xinhua-winshare-broker-20260904

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Query public research report APIs and validate PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from io import BytesIO

          import requests
          from pypdf import PdfReader

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          api_headers = {
              'User-Agent': ua,
              'Accept': 'application/json,text/plain,*/*',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml',
          }
          pdf_headers = {
              'User-Agent': ua,
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          }

          def compact(value: object) -> str:
              return re.sub(r'\s+', '', str(value or '')).lower()

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          all_rows: dict[str, dict] = {}
          codes = ('601811', '1.601811', 'SH601811', '00811', '0811', '116.00811')
          for code in codes:
              for qtype in (0, 1):
                  for page in range(1, 8):
                      params = {
                          'pageNo': page,
                          'pageSize': 500,
                          'code': code,
                          'qType': qtype,
                          'beginTime': '2016-01-01',
                          'endTime': '2026-09-04',
                          'industryCode': '*',
                          'rating': '*',
                          'ratingChange': '*',
                      }
                      try:
                          response = session.get(endpoint, params=params, headers=api_headers, timeout=(20, 150))
                          print('QUERY', code, qtype, page, response.status_code, len(response.content), response.url, flush=True)
                          response.raise_for_status()
                          payload = response.json()
                          rows = payload.get('data') or []
                          print('META', code, qtype, page, len(rows), {k: payload.get(k) for k in ('hits','size','TotalPage','pageNo')}, flush=True)
                          for row in rows:
                              raw = json.dumps(row, ensure_ascii=False)
                              n = compact(raw)
                              if not any(marker in n for marker in ('新华文轩', '601811', '00811', 'xinhua winshare', 'xinhuawinshare')):
                                  continue
                              key = str(row.get('infoCode') or row.get('infocode') or row.get('id') or raw)
                              all_rows[key] = row
                          if not rows or len(rows) < 500:
                              break
                      except Exception as exc:
                          print('QUERY_ERROR', code, qtype, page, repr(exc), flush=True)
                          break
                  time.sleep(0.2)

          print('MATCH_COUNT', len(all_rows), flush=True)
          candidates = []
          for key, row in sorted(all_rows.items(), key=lambda kv: str(kv[1].get('publishDate') or ''), reverse=True):
              keep = {k: row.get(k) for k in (
                  'infoCode', 'title', 'publishDate', 'orgSName', 'orgName', 'researcher',
                  'stockName', 'stockCode', 'attachPages', 'attachSize', 'emRatingName',
                  'ratingName', 'reportType', 'encodeUrl'
              )}
              print('ROW', json.dumps(keep, ensure_ascii=False), flush=True)
              candidates.append(row)

          working = []
          for row in candidates:
              info = str(row.get('infoCode') or '')
              if not info.startswith('AP'):
                  continue
              for prefix in ('H3', 'H2'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  try:
                      response = session.get(url, headers=pdf_headers, timeout=(20, 240), allow_redirects=True)
                      print('PDF_GET', info, prefix, response.status_code, len(response.content), response.headers.get('content-type'), response.url, flush=True)
                      if response.status_code != 200 or not response.content.startswith(b'%PDF-') or len(response.content) < 80_000:
                          continue
                      reader = PdfReader(BytesIO(response.content), strict=False)
                      pages = len(reader.pages)
                      chunks = []
                      for page in reader.pages[:min(12, pages)]:
                          try:
                              chunks.append(page.extract_text() or '')
                          except Exception as exc:
                              print('TEXT_WARNING', info, repr(exc), flush=True)
                      front = '\n'.join(chunks)
                      n = compact(front)
                      company_ok = any(marker in n for marker in ('新华文轩', '601811', '00811', 'xinhuawinshare'))
                      report_ok = any(marker in n for marker in ('证券研究报告', '公司研究', '公司深度', '首次覆盖', '研究报告', 'equityresearch'))
                      record = {
                          'infoCode': info,
                          'title': row.get('title'),
                          'publishDate': str(row.get('publishDate') or '')[:10],
                          'broker': row.get('orgSName') or row.get('orgName'),
                          'researcher': row.get('researcher'),
                          'metadata_pages': row.get('attachPages'),
                          'actual_pages': pages,
                          'bytes': len(response.content),
                          'sha256': hashlib.sha256(response.content).hexdigest(),
                          'url': response.url,
                          'company_ok': company_ok,
                          'report_ok': report_ok,
                          'front': re.sub(r'\s+', ' ', front)[:1600],
                      }
                      working.append(record)
                      print('WORKING', json.dumps(record, ensure_ascii=False), flush=True)
                      break
                  except Exception as exc:
                      print('PDF_ERROR', info, prefix, repr(exc), flush=True)

          print('WORKING_COUNT', len(working), flush=True)
          print('WORKING_SUMMARY', json.dumps(working, ensure_ascii=False, indent=2), flush=True)
          if not working:
              raise SystemExit('No working PDFs discovered')
          PY
