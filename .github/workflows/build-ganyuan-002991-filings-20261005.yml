name: Inspect Ganyuan Foods prospectus sources 20261005

on:
  push:
    paths:
      - '.github/workflows/build-ganyuan-002991-filings-20261005.yml'
      - 'scripts/inspect_ganyuan_prospectus_sources_20261005.py'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Inspect prospectus sources
        run: python scripts/inspect_ganyuan_prospectus_sources_20261005.py
