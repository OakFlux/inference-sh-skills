name: Probe Guangshen 2023 Eastmoney report

on:
  push:
    branches:
      - chatgpt-china-gas-broker-reports-20260905
    paths:
      - '.github/workflows/probe-guangshen-2023-eastmoney-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_guangshen_2023_eastmoney_20260905.py
      - uses: actions/upload-artifact@v4
        with:
          name: guangshen-2023-eastmoney-probe-20260905
          path: |
            guangshen-2023-eastmoney-probe.json
            eastmoney-*.pdf
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
