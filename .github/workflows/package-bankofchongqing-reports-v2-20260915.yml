name: Package Bank of Chongqing reports v2

on:
  push:
    branches:
      - tmp/bankofchongqing-reports-20260915

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/bankofchongqing-reports-20260915

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip
          python -m pip install --quiet requests beautifulsoup4 pypdf fonttools

      - name: Run corrected packager
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/package build/previews
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/package-bankofchongqing-reports-20260915.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Upload final archive"
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())

          replacements = {
              "if '重庆银行' not in compact and 'bankofchongqing' not in compact:":
                  "if '重庆银行' not in compact and '重慶銀行' not in compact and 'bankofchongqing' not in compact:",
              "if '招股说明书' not in compact and 'prospectus' not in compact:":
                  "if '招股说明书' not in compact and '招股說明書' not in compact and 'prospectus' not in compact:",
              "if '第一季度报告' not in compact:":
                  "if '第一季度报告' not in compact and '第一季度報告' not in compact:",
              "if '半年度报告' not in compact:":
                  "if '半年度报告' not in compact and '半年度報告' not in compact and '中期报告' not in compact and '中期報告' not in compact:",
              "if '年度报告' not in compact:":
                  "if '年度报告' not in compact and '年度報告' not in compact and 'annualreport' not in compact:",
          }
          for old, new in replacements.items():
              if old not in script:
                  raise RuntimeError(f'Expected validation expression not found: {old}')
              script = script.replace(old, new)

          exec(compile(script, 'bankofchongqing_packager.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Upload final archive
        uses: actions/upload-artifact@v4
        with:
          name: bank-of-chongqing-official-reports-v2-20260915
          path: build/重庆银行_601963_01963_2020-2025年报_招股说明书_最新季报及中报_截至2026-09-15.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
