name: Package Meon Biological filings 20261014

on:
  push:
    branches:
      - meinong-filings-20261014
    paths:
      - scripts/package_meinong_filings_20261014.py
      - .github/workflows/package-meinong-filings-20261014.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf

      - name: Download, validate, and package filings
        run: python scripts/package_meinong_filings_20261014.py

      - name: Show package summary
        run: cat dist/package_summary.json

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: meinong-301156-filings-20261014
          path: |
            dist/*.zip
            dist/package_summary.json
          if-no-files-found: error
          retention-days: 30
