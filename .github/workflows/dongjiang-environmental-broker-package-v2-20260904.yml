name: Package Dongjiang Environmental broker deep reports v2

on:
  push:
    paths:
      - '.github/workflows/dongjiang-environmental-broker-package-v2-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf pymupdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import pymupdf, requests
          from pypdf import PdfReader

          PACKAGE='东江环保_券商深度报告_3份_完整PDF'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)
          work=Path('_dongjiang_broker_v2_work'); work.mkdir(exist_ok=True)
          renders=work/'renders'; renders.mkdir(exist_ok=True)

          candidates=[
            {
              'priority':1,'info':'AP202005291380571305','date':'2020-05-29','broker':'万联证券',
              'authors':'周春林','rating':'增持','type':'深度报告',
              'title':'政策发力行业回暖，危废龙头迎来整合窗口','min_pages':18,
            },
            {
              'priority':2,'info':'AP201901021281250255','date':'2019-01-02','broker':'东莞证券',
              'authors':'黄秀瑜','rating':'增持','type':'深度报告',
              'title':'行业景气，国资助力，业绩稳增长可期','min_pages':12,
            },
            {
              'priority':3,'info':'AP201807251169890065','date':'2018-07-25','broker':'新时代证券',
              'authors':'邱懿峰、黄红卫、赵腾辉','rating':'增持','type':'首次覆盖报告',
              'title':'危废产能进入快速投放期，市占率有望持续提升','min_pages':18,
            },
          ]

          session=requests.Session(); session.trust_env=False
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Referer':'https://data.eastmoney.com/report/002672.html',
          }

          def fetch_pdf(info):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?download=1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf?download=1.pdf',
            ]
            errors=[]
            for url in urls:
              for attempt in range(1,4):
                try:
                  r=session.get(url,headers=headers,timeout=(30,360),allow_redirects=True)
                  print('GET',info,attempt,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>150000:
                    return r.content,str(r.url)
                  errors.append(f'{url}: HTTP {r.status_code}/{len(r.content)}')
                except Exception as exc:
                  errors.append(f'{url}: {repr(exc)}')
                time.sleep(min(attempt*2,6))
            raise RuntimeError(' | '.join(errors[-8:]))

          def opening_text(reader,limit=12):
            parts=[]
            for page in reader.pages[:min(limit,len(reader.pages))]:
              try: parts.append(page.extract_text() or '')
              except Exception: pass
            return re.sub(r'\s+','', '\n'.join(parts)).lower()

          records=[]; hashes=set()
          for idx,c in enumerate(candidates,1):
            data,source_url=fetch_pdf(c['info'])
            temp=work/f'candidate_{idx}.pdf'; temp.write_bytes(data)
            reader=PdfReader(str(temp),strict=False)
            pages=len(reader.pages)
            if pages<c['min_pages']:
              raise RuntimeError(f'{c["title"]}: only {pages} pages; minimum {c["min_pages"]}')
            text=opening_text(reader)
            if not any(x in text for x in ('东江环保','東江環保','dongjiang environmental','002672','00895')):
              raise RuntimeError(f'{c["title"]}: company identity not found')
            q=subprocess.run(['qpdf','--check',str(temp)],capture_output=True,text=True)
            if q.returncode not in (0,3):
              raise RuntimeError(f'{c["title"]}: qpdf failed: '+q.stderr[-1000:])
            if q.returncode==3:
              print('QPDF_WARNING',c['info'],q.stderr[-800:],flush=True)
            doc=pymupdf.open(str(temp))
            sample=sorted(set([0,max(0,pages//2),pages-1]))
            rendered=[]
            for pno in sample:
              page=doc.load_page(pno)
              pix=page.get_pixmap(matrix=pymupdf.Matrix(1.0,1.0),alpha=False)
              rp=renders/f'{idx:02d}_{pno+1:03d}.png'; pix.save(str(rp))
              if not rp.exists() or rp.stat().st_size<6000 or pix.width<400 or pix.height<400:
                raise RuntimeError(f'{c["title"]}: render failed page {pno+1}')
              rendered.append(pno+1)
            doc.close()
            digest=hashlib.sha256(data).hexdigest()
            if digest in hashes: raise RuntimeError('duplicate PDF')
            hashes.add(digest)
            safe_broker=re.sub(r'[\\/:*?"<>|\s]+','_',c['broker']).strip('_')
            safe_title=re.sub(r'[\\/:*?"<>|\s]+','_',c['title']).strip('_')[:48]
            filename=f'{idx:02d}_{safe_broker}_{safe_title}_{c["date"].replace("-","")}.pdf'
            (out/filename).write_bytes(data)
            rec={
              'filename':filename,'broker':c['broker'],'title':c['title'],'report_type':c['type'],
              'date':c['date'],'authors':c['authors'],'rating':c['rating'],'pages':pages,
              'bytes':len(data),'sha256':digest,'source_url':source_url,
              'eastmoney_info_code':c['info'],'source':'东方财富研究报告PDF镜像（保留原券商报告版式）',
              'rendered_pages':rendered,
            }
            records.append(rec)
            print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          lines=['东江环保（002672.SZ / 00895.HK）券商深度报告','',
                 '本包包含3份完整PDF，均明确标注为深度报告或首次覆盖报告；未收入财报、公告和事件点评。','']
          for i,r in enumerate(records,1):
            lines += [f"{i}. {r['broker']}：《{r['title']}》",
                      f"   类型：{r['report_type']}；日期：{r['date']}；作者：{r['authors']}；评级：{r['rating']}",
                      f"   实际页数：{r['pages']}页；大小：{r['bytes']/1048576:.2f} MB",
                      f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          lines += ['核验项目：PDF文件头、公司名称或证券代码、实际页数、qpdf结构、首页/中间页/末页渲染、SHA-256及ZIP CRC。',
                    '报告中的评级、盈利预测和目标价均为历史发布时点观点。']
          (out/'报告清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=True) as z:
            for p in sorted(out.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failed: '+bad)
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('PDF count mismatch')
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'PDFS',len(records),'PAGES',sum(r['pages'] for r in records),flush=True)
          print('MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: dongjiang-environmental-broker-deep-reports-v2-final
          path: 东江环保_券商深度报告_3份_完整PDF.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
