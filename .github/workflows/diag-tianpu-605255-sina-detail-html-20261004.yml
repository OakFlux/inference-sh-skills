name: Inspect Tianpu Sina report detail HTML 20261004

on:
  push:
    paths:
      - '.github/workflows/diag-tianpu-605255-sina-detail-html-20261004.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect report HTML
        run: |
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'}
          for rid in ['650127406222','649960495322','649940413902']:
            for suffix in ['index.phtml','url']:
              url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/{suffix}'
              print('\n========',rid,suffix,'========',flush=True)
              r=s.get(url,headers=h,timeout=90,allow_redirects=True)
              r.encoding=r.apparent_encoding or r.encoding or 'gbk'
              text=r.text
              print('STATUS',r.status_code,r.headers.get('content-type'),len(r.content),r.url,r.encoding,flush=True)
              title=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
              print('TITLE',html.unescape(re.sub('<[^>]+>','',title.group(1)).strip()) if title else '',flush=True)
              urls=[]
              for pattern in [
                r'''(?:href|src|action|data-url|data-href)\s*=\s*["']([^"']+)["']''',
                r'''https?://[^\s"'<>]+''',
              ]:
                for m in re.finditer(pattern,text,re.I):
                  value=m.group(1) if m.lastindex else m.group(0)
                  urls.append(urljoin(r.url,html.unescape(value)))
              print('ALL_URLS',json.dumps(list(dict.fromkeys(urls)),ensure_ascii=False,indent=2),flush=True)
              for pat in ['报告原文','查看原文','下载','pdf','PDF','rptid','url','file.finance','iframe','location','content','报告摘要','研究员','机构']:
                matches=list(re.finditer(re.escape(pat),text,re.I))
                if matches:
                  print('\nPATTERN',pat,'COUNT',len(matches),flush=True)
                  for m in matches[:10]:
                    print(re.sub(r'\s+',' ',text[max(0,m.start()-1000):m.start()+3000]),flush=True)
              clean=re.sub(r'<script.*?</script>|<style.*?</style>',' ',text,flags=re.I|re.S)
              clean=html.unescape(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',clean)))
              print('CLEAN_TEXT',clean[:20000],flush=True)
          PY
