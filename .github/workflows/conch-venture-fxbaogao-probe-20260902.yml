name: Probe China Conch Venture report viewer

on:
  push:
    paths:
      - '.github/workflows/conch-venture-fxbaogao-probe-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect report viewer endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36'
          urls=[
              'https://www.fxbaogao.com/detail/4894193',
              'https://www.fxbaogao.com/view?id=4894193',
              'https://www.fxbaogao.com/view/4894193',
          ]
          for url in urls:
              try:
                  r=s.get(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*','Referer':'https://www.fxbaogao.com/detail/4894193'},timeout=(20,120),allow_redirects=True)
                  print('\n=== PAGE',url,r.status_code,r.headers.get('content-type'),len(r.content),r.url,'===',flush=True)
                  print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False),flush=True)
                  text=r.text
                  print(text[:50000],flush=True)
                  soup=BeautifulSoup(text,'html.parser')
                  for tag in soup.find_all(['a','script','iframe','embed','object','img','source']):
                      for attr in ('href','src','data','content'):
                          val=tag.get(attr)
                          if val:
                              full=urljoin(r.url,val)
                              if any(k in full.lower() for k in ['pdf','4894193','download','view','api','file','static','oss','cos']):
                                  print('RESOURCE',tag.name,attr,repr(full),flush=True)
                  for match in re.findall(r'https?://[^"\'<>\s\\]+',text):
                      if any(k in match.lower() for k in ['pdf','4894193','download','api','file','oss','cos']):
                          print('URLMATCH',repr(match[:2000]),flush=True)
              except Exception as exc:
                  print('PAGE_ERROR',url,repr(exc),flush=True)
          PY
