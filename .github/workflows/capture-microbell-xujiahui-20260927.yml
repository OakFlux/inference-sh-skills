name: Capture Microbell Xujiahui report 20260927

on:
  push:
    paths:
      - '.github/workflows/capture-microbell-xujiahui-20260927.yml'
      - 'scripts/capture_microbell_xujiahui_report_20260927.py'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          playwright install chromium --with-deps
      - name: Capture page
        run: python scripts/capture_microbell_xujiahui_report_20260927.py
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: microbell-xujiahui-capture
          path: microbell_xujiahui_capture
          if-no-files-found: error
          retention-days: 7
