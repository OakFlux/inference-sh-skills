name: Temporary Roshow Technology broker report catalog

on:
  push:
    branches:
      - tmp/download-roshow-reports-20260829
    paths:
      - .github/workflows/tmp-roshow-catalog.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Query public report catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib, datetime

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          headers={'User-Agent':UA,'Referer':'https://data.eastmoney.com/report/'}

          # Eastmoney company-research catalog.
          base='https://reportapi.eastmoney.com/report/list'
          all_items={}
          for page in range(1,8):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2015-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'',
                  'qType':'0','orgCode':'','code':'002617','rcode':'','p':str(page),
                  'pageNum':str(page),'pageNumber':str(page)
              }
              url=base+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers)
              raw=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
              pathlib.Path(f'diagnostic/eastmoney_page_{page}.json').write_text(raw,encoding='utf-8')
              text=raw.strip()
              if text.startswith('datatable(') and text.endswith(')'):
                  text=text[len('datatable('):-1]
              obj=json.loads(text)
              data=obj.get('data') or []
              for x in data:
                  if x.get('stockCode')=='002617' or x.get('stockName')=='露笑科技' or '露笑科技' in (x.get('title') or ''):
                      all_items[x.get('infoCode') or json.dumps(x,sort_keys=True,ensure_ascii=False)]=x
              if len(data)<100:
                  break

          items=list(all_items.values())
          items.sort(key=lambda x:(x.get('publishDate') or '',x.get('attachPages') or 0),reverse=True)
          pathlib.Path('diagnostic/eastmoney_relevant.json').write_text(json.dumps(items,ensure_ascii=False,indent=2),encoding='utf-8')
          with open('diagnostic/eastmoney_summary.tsv','w',encoding='utf-8') as f:
              f.write('publishDate\torgSName\tattachPages\treportType\tratingName\tratingChange\tinfoCode\ttitle\tpdf_url\n')
              for x in items:
                  code=x.get('infoCode','')
                  pdf=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf' if code else ''
                  row=[x.get('publishDate',''),x.get('orgSName',''),x.get('attachPages',''),x.get('reportType',''),x.get('ratingName',''),x.get('ratingChange',''),code,x.get('title',''),pdf]
                  f.write('\t'.join(str(v).replace('\t',' ') for v in row)+'\n')

          # Public Fxbaogao metadata search to cross-check non-Eastmoney reports.
          api='https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          fx_rows=[]
          for keyword in ['露笑科技','002617','碳化硅 露笑科技']:
              body=json.dumps({'keywords':keyword,'pageIndex':1,'pageSize':100,'order':2,'nop':-1},ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(api,data=body,headers={'User-Agent':UA,'Content-Type':'application/json'},method='POST')
              try:
                  raw=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
              except Exception as exc:
                  raw=json.dumps({'error':repr(exc)},ensure_ascii=False)
              safe=urllib.parse.quote(keyword,safe='')
              pathlib.Path(f'diagnostic/fxbaogao_{safe}.json').write_text(raw,encoding='utf-8')
              try:
                  obj=json.loads(raw)
              except Exception:
                  continue
              rows=(obj.get('data') or {}).get('dataList') or []
              for r in rows:
                  blob=' '.join(str(r.get(k,'')) for k in ['title','stockName','name'])
                  if '露笑科技' in blob or '002617' in blob:
                      fx_rows.append(r)
          # dedupe by docId
          uniq={str(r.get('docId') or json.dumps(r,sort_keys=True,ensure_ascii=False)):r for r in fx_rows}
          fx=list(uniq.values())
          fx.sort(key=lambda r:r.get('pubTime') or 0,reverse=True)
          pathlib.Path('diagnostic/fxbaogao_relevant.json').write_text(json.dumps(fx,ensure_ascii=False,indent=2),encoding='utf-8')
          with open('diagnostic/fxbaogao_summary.tsv','w',encoding='utf-8') as f:
              f.write('pubDate\torgName\tpageNum\tdocId\ttitle\n')
              for r in fx:
                  ts=r.get('pubTime') or 0
                  date=datetime.datetime.utcfromtimestamp(ts).strftime('%Y-%m-%d') if ts else ''
                  f.write('\t'.join(str(v).replace('\t',' ') for v in [date,r.get('orgName',''),r.get('pageNum',''),r.get('docId',''),r.get('title','')])+'\n')

          deep=[]
          for x in items:
              title=x.get('title') or ''
              pages=int(x.get('attachPages') or 0)
              if pages>=12 or any(k in title for k in ['深度','首次覆盖','公司研究','碳化硅','第三代半导体','铜连接']):
                  deep.append(x)
          pathlib.Path('diagnostic/deep_candidates.json').write_text(json.dumps(deep,ensure_ascii=False,indent=2),encoding='utf-8')

          print('EASTMONEY RELEVANT',len(items),'DEEP CANDIDATES',len(deep))
          print(pathlib.Path('diagnostic/eastmoney_summary.tsv').read_text(encoding='utf-8')[:50000])
          print('\nFXBAOGAO RELEVANT',len(fx))
          print(pathlib.Path('diagnostic/fxbaogao_summary.tsv').read_text(encoding='utf-8')[:30000])
          PY

      - name: Upload catalog diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: roshow-report-catalog
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
