name: List FxBaogao AI scripts
on:
  push:
    paths:
      - '.github/workflows/list_fxbaogao_ai_scripts_20260929.yml'
      - 'tools/list_fxbaogao_ai_scripts_20260929.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python tools/list_fxbaogao_ai_scripts_20260929.py
      - uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-ai-script-urls
          path: fxbaogao_ai_script_urls.json
          if-no-files-found: error
          retention-days: 3
