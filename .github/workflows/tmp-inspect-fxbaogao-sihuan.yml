name: Inspect Sihuan report pages

on:
  push:
    branches:
      - tmp/sihuan-pharma-reports-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python .github/scripts/inspect_fxbaogao_sihuan.py
