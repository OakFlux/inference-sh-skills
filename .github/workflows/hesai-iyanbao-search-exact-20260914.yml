name: Search iYanbao for exact Hesai reports

on:
  push:
    branches:
      - tmp/hesai-broker-reports-20260914
    paths:
      - '.github/workflows/hesai-iyanbao-search-exact-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/hesai-broker-reports-20260914
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Search exact keywords
        shell: bash
        run: |
          set -euo pipefail
          rm -rf iyanbao_exact
          mkdir -p iyanbao_exact
          python - <<'PY'
          from pathlib import Path
          import json, urllib.parse, time
          import requests
          from bs4 import BeautifulSoup

          kws=['禾赛-W','02525','HSAI','ADAS激光雷达龙头','全球激光雷达引领者','智驾之眼','物理AI通用感官','乘具身智能之东风','激光雷达由上车走向泛机器人','机器人产品为新增长动力','禾赛科技 首次覆盖']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          out=[]
          for idx,kw in enumerate(kws,1):
              url='https://www.iyanbao.com/search?keyword='+urllib.parse.quote(kw)
              item={'keyword':kw,'url':url}
              try:
                  r=s.get(url,timeout=60,allow_redirects=True)
                  item.update({'status':r.status_code,'size':len(r.content),'final_url':r.url})
                  text=r.content.decode(r.apparent_encoding or 'utf-8',errors='ignore')
                  Path(f'iyanbao_exact/{idx:02d}.html').write_text(text,encoding='utf-8')
                  soup=BeautifulSoup(text,'html.parser'); tag=soup.find('script',id='__NEXT_DATA__')
                  rows=[]
                  if tag and tag.string:
                      data=json.loads(tag.string); pp=data.get('props',{}).get('pageProps',{})
                      item['searchTotal']=pp.get('searchTotal'); rows=pp.get('searchList') or []
                  slim=[]
                  for x in rows:
                      if not isinstance(x,dict): continue
                      inst=x.get('institution')
                      if isinstance(inst,dict): inst=inst.get('value') or inst.get('key')
                      slim.append({'id':x.get('id'),'title':x.get('title'),'institution':inst,'pages':x.get('pages'),'publishTimestamp':x.get('publishTimestamp'),'pdfUrl':x.get('pdfUrl'),'reportType':x.get('reportType')})
                  item['results']=slim
              except Exception as e: item['error']=repr(e)
              out.append(item)
              print('\nQUERY',kw,'status',item.get('status'),'total',item.get('searchTotal'))
              for x in item.get('results',[]): print(x)
              time.sleep(.5)
          Path('iyanbao_exact/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hesai-iyanbao-exact-search-20260914
          path: iyanbao_exact
          retention-days: 3
