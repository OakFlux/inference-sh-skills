name: Target exact Eastmoney dates for Mengtaigaoxin

on:
  push:
    paths:
      - '.github/workflows/mengtaigaoxin-eastmoney-targeted-query-20260830.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Query exact date windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          s=requests.Session()
          h={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Referer':'https://data.eastmoney.com/'}
          windows=[
            ('2021-06-22','2021-06-25'),('2021-08-09','2021-08-12'),
            ('2023-06-12','2023-06-16'),('2023-08-20','2023-08-26'),
            ('2024-04-01','2024-04-16')]
          found=[]; seen=set()
          for begin,end in windows:
            for qtype in (0,1,2):
              for page in range(1,8):
                p={'pageNo':page,'pageSize':100,'qType':qtype,'beginTime':begin,'endTime':end}
                try:
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=p,headers=h,timeout=60)
                  print('Q',begin,end,qtype,page,r.status_code,len(r.content),flush=True)
                  if r.status_code!=200: break
                  o=r.json()
                except Exception as e:
                  print('ERR',repr(e),flush=True); continue
                d=o.get('data') if isinstance(o,dict) else None
                rows=d if isinstance(d,list) else (d.get('data') or d.get('list') or d.get('items') or [] if isinstance(d,dict) else [])
                if not isinstance(rows,list) or not rows: break
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False,default=str)
                  if '蒙泰高新' in blob or '300876' in blob:
                    k=str(x.get('infoCode') or x.get('infocode') or x.get('id') or blob)
                    if k not in seen:
                      seen.add(k); found.append(x); print('MATCH',blob,flush=True)
                if len(rows)<100: break
          open('targeted_matches.json','w',encoding='utf-8').write(json.dumps(found,ensure_ascii=False,indent=2))
          print('TOTAL',len(found),flush=True)
          PY
      - name: Upload matches
        uses: actions/upload-artifact@v4
        with:
          name: mengtaigaoxin-eastmoney-targeted-query
          path: targeted_matches.json
          if-no-files-found: error
          retention-days: 3
