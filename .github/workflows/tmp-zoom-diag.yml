name: Temporary Zoom filing diagnostics

on:
  push:
    branches:
      - tmp-zoom-diag-20260827

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect Zoom GCS static file delivery
        shell: bash
        run: |
          python - <<'PY'
          import requests
          urls=[
            'https://zoom.gcs-web.com/static-files/a6b3b254-94ff-415f-bb3b-8c3146b061d4',
            'https://zoom.gcs-web.com/static-files/f5b92b93-5af9-42cb-ab0d-931c309417a9',
          ]
          for u in urls:
            try:
              r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*','Range':'bytes=0-1023','Referer':'https://zoom.gcs-web.com/financial-information/annual-reports'},timeout=20,allow_redirects=True)
              print('URL',u,'STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'HEAD',repr(r.content[:20]))
            except Exception as e:
              print('ERROR',u,repr(e))
          PY
