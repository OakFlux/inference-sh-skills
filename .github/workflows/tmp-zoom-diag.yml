name: Temporary Zoom filing diagnostics

on:
  push:
    branches:
      - tmp-zoom-diag-20260827

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test GCS static and SEC fair-access download
        shell: bash
        run: |
          python - <<'PY'
          import requests

          tests = [
            ('GCS2020','https://zoom.gcs-web.com/static-files/a6b3b254-94ff-415f-bb3b-8c3146b061d4', {'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*','Range':'bytes=0-1023','Referer':'https://zoom.gcs-web.com/financial-information/annual-reports'}),
            ('SEC_SUBMISSIONS','https://data.sec.gov/submissions/CIK0001585521.json', {'User-Agent':'OpenAI Research Assistant research@openai.com','Accept-Encoding':'gzip, deflate','Accept':'application/json'}),
            ('SEC_10Q','https://www.sec.gov/Archives/edgar/data/1585521/000158552126000121/zm-20260731.htm', {'User-Agent':'OpenAI Research Assistant research@openai.com','Accept-Encoding':'gzip, deflate','Accept':'text/html,application/xhtml+xml'}),
          ]
          for name,u,h in tests:
            try:
              r=requests.get(u,headers=h,timeout=30,allow_redirects=True)
              print(name,'STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'HEAD',repr(r.content[:40]))
            except Exception as e:
              print(name,'ERROR',repr(e))
          PY
