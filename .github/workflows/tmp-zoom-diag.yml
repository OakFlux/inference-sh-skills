name: Temporary Zoom filing diagnostics

on:
  push:
    branches:
      - tmp-zoom-diag-20260827

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Inspect Zoom GCS filing link
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          u='https://zoom.gcs-web.com/sec-filings/sec-filing/10-q/0001585521-26-000121'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          try:
              r=s.get(u,timeout=25,allow_redirects=True)
              print('FILING',u,'STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
              print('HEAD',repr(r.content[:200]))
              soup=BeautifulSoup(r.text,'html.parser')
              for a in soup.find_all('a',href=True):
                  t=' '.join(a.get_text(' ',strip=True).split())
                  href=urljoin(r.url,a['href'])
                  if 'pdf' in t.lower() or 'static-files' in href or href.lower().endswith('.pdf') or 'download' in t.lower():
                      print('LINK',repr(t),href)
          except Exception as e:
              print('FILING ERROR',repr(e))
          PY
