name: Build Qiming Information 002232 reports package 20260929

on:
  push:
    paths:
      - '.github/workflows/qiming-002232-reports-package-20260929.yml'
      - 'scripts/build_qiming_002232_reports_20260929.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        run: python scripts/build_qiming_002232_reports_20260929.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qiming-002232-reports-2020-2026
          path: 启明信息_002232_2020-2025年报_2026最新定期报告.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
