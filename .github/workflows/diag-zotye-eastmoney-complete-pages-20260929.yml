name: Scan all Eastmoney pages for legacy Zotye reports 20260929

on:
  push:
    paths:
      - '.github/workflows/diag-zotye-eastmoney-complete-pages-20260929.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Scan complete nearby-date result sets
        run: |
          python - <<'PY'
          import json
          import requests

          ranges = [
              ('2016-03-01','2016-12-31'),
              ('2017-02-15','2017-04-15'),
              ('2017-10-01','2017-11-15'),
          ]
          needles = [
              '众泰汽车','金马股份','000980','从模仿到原创',
              '传统汽车和新能源汽车','自主品牌后起之秀',
              '收购剑走偏锋','诺曼底','汽车中的战斗机'
          ]
          s = requests.Session(); s.trust_env = False
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept': 'application/json,text/plain,*/*',
              'Content-Type': 'application/json',
          }
          found = {}
          for begin, end in ranges:
              print('\nRANGE', begin, end, flush=True)
              page = 1
              while page <= 60:
                  body = {
                      'pageSize': 100,
                      'pageNo': page,
                      'p': page,
                      'pageNum': page,
                      'pageNumber': page,
                      'beginTime': begin,
                      'endTime': end,
                      'industryCode': '*',
                      'rating': None,
                      'ratingChange': None,
                      'orgCode': None,
                      'rcode': '',
                  }
                  r = s.post('https://reportapi.eastmoney.com/report/list2', json=body, headers=headers, timeout=90)
                  print('PAGE', page, r.status_code, len(r.content), flush=True)
                  r.raise_for_status()
                  data = r.json()
                  rows = data.get('data') or []
                  total_pages = int(data.get('TotalPage') or 0)
                  print('META', data.get('hits'), total_pages, len(rows), flush=True)
                  for row in rows:
                      blob = ' '.join(str(row.get(k) or '') for k in (
                          'title','stockName','stockCode','orgName','orgSName','researcher'
                      ))
                      if row.get('stockCode') == '000980' or any(n in blob for n in needles):
                          info = str(row.get('infoCode') or '')
                          found[info or blob] = row
                          print('MATCH', json.dumps(row, ensure_ascii=False, default=str), flush=True)
                  if not rows or page >= total_pages:
                      break
                  page += 1

          print('\nFOUND_COUNT', len(found), flush=True)
          for info, row in found.items():
              print('RESULT', info, json.dumps(row, ensure_ascii=False, default=str), flush=True)
              if not info.startswith('AP'):
                  continue
              url = f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              p = s.get(url, headers={
                  'User-Agent': headers['User-Agent'],
                  'Referer': 'https://data.eastmoney.com/',
                  'Accept': 'application/pdf,*/*',
              }, timeout=180, stream=True, allow_redirects=True)
              head = next(p.iter_content(64), b'')
              print('PDF_PROBE', info, p.status_code, p.headers.get('content-type'), p.headers.get('content-length'), p.url, repr(head[:20]), flush=True)
              p.close()
          PY
