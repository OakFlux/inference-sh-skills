name: Temporary Xinri brokerage report probe

on:
  push:
    branches:
      - tmp/download-xinri-reports-20260829
    paths:
      - .github/workflows/tmp-xinri-report-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public report catalog and test PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, requests, time

          api='https://reportapi.eastmoney.com/report/list'
          headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/603787.html',
          }
          rows=[]
          for page in range(1, 11):
              params={
                  'pageNo':str(page),'pageSize':'100','code':'603787',
                  'industryCode':'*','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2015-01-01','endTime':'2026-08-29','fields':'',
                  'qType':'0','orgCode':'','rcode':'','p':str(page),
                  'pageNum':str(page),'pageNumber':str(page),
              }
              r=requests.get(api,params=params,headers=headers,timeout=60)
              print('API',page,r.status_code,len(r.content),r.url)
              r.raise_for_status()
              obj=r.json()
              data=obj.get('data') or []
              rows.extend(data)
              total=int(obj.get('TotalPage') or math.ceil(int(obj.get('hits') or 0)/100) or 1)
              if page>=total: break
          dedup={}
          for row in rows:
              dedup[row.get('infoCode') or (row.get('title'),row.get('publishDate'),row.get('orgSName'))]=row
          rows=list(dedup.values())
          rows.sort(key=lambda x:x.get('publishDate') or '',reverse=True)
          print('TOTAL_ROWS',len(rows))
          for row in rows:
              info=row.get('infoCode') or ''
              meta={
                  'date':str(row.get('publishDate') or '')[:10],
                  'broker':row.get('orgSName') or row.get('orgName'),
                  'title':row.get('title'),
                  'pages':row.get('attachPages'),
                  'size_kb':row.get('attachSize'),
                  'infoCode':info,
                  'reportType':row.get('reportType'),
                  'rating':row.get('emRatingName') or row.get('sRatingName'),
                  'researcher':row.get('researcher'),
                  'column':row.get('column'),
              }
              print('\nMETA',json.dumps(meta,ensure_ascii=False))
              if info:
                  url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
                  try:
                      rr=requests.get(url,headers={**headers,'Range':'bytes=0-4095'},timeout=45,allow_redirects=True)
                      print('PDF',rr.status_code,rr.headers.get('content-type'),rr.headers.get('content-range'),len(rr.content),rr.content[:8],rr.url)
                  except Exception as e:
                      print('PDFERR',repr(e),url)
          PY
