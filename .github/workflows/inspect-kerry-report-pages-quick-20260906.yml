name: Inspect Kerry Properties report pages quickly

on:
  push:
    branches:
      - chatgpt-kerry-properties-broker-reports-20260906
    paths:
      - '.github/workflows/inspect-kerry-report-pages-quick-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/inspect_kerry_report_pages_quick_20260906.py
