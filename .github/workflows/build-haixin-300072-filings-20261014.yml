name: Build Haixin Energy 300072 filings package 20261014

on:
  push:
    paths:
      - '.github/workflows/build-haixin-300072-filings-20261014.yml'
      - 'scripts/build_haixin_300072_filings_20261014.py'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Patch ChiNext market category candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_haixin_300072_filings_20261014.py')
          text = path.read_text(encoding='utf-8')
          old = 'for ann_type in ("SZA", "SZSA", "SZ"):'
          new = 'for ann_type in ("CYB", "SZCY", "SZCYB", "", "SZA", "SZSA", "SZ"):'
          if old not in text:
              raise SystemExit('market category loop not found')
          text = text.replace(old, new, 1)
          marker = '            response = request("GET", API, params=params)'
          replacement = '            if not ann_type:\n                params.pop("ann_type", None)\n            response = request("GET", API, params=params)'
          if marker not in text:
              raise SystemExit('request marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Discover download validate and package reports
        run: python scripts/build_haixin_300072_filings_20261014.py

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: haixin-300072-filings-20261014
          path: 海新能科_300072_2020-2025年报及最新季报_截至2026-10-14.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
