    paths:
      - '.github/workflows/probe-hbis-eastmoney-by-date-20261016.yml'
      - 'scripts/probe_hbis_eastmoney_by_date_20261016.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe Eastmoney reports
        shell: bash
        run: python scripts/probe_hbis_eastmoney_by_date_20261016.py
