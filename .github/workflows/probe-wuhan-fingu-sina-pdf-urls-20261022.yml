name: Probe Wuhan Fingu Sina PDF URLs 20261022

on:
  push:
    branches:
      - wuhan-fingu-broker-reports-20261022
    paths:
      - scripts/probe_wuhan_fingu_sina_pdf_urls_20261022.py
      - .github/workflows/probe-wuhan-fingu-sina-pdf-urls-20261022.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet requests
      - run: python scripts/probe_wuhan_fingu_sina_pdf_urls_20261022.py
      - uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-sina-pdf-url-probe
          path: probe_wuhan_fingu_sina_pdf_urls
          if-no-files-found: error
          retention-days: 7
