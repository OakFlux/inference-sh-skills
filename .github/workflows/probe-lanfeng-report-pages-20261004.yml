name: Probe Lanfeng report pages 20261004

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_lanfeng_report_pages_20261004.py'
      - '.github/workflows/probe-lanfeng-report-pages-20261004.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect report pages
        run: python scripts/probe_lanfeng_report_pages_20261004.py
