name: Probe Guobang 605507 broker reports 20261015
on:
  push:
    paths:
      - '.github/workflows/probe-guobang-605507-broker-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney report metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          h={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Referer':'https://data.eastmoney.com/report/stock.jshtml',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          }
          p={
            'pageSize':'200','pageNo':'1','code':'605507','qType':'0','industryCode':'*','industry':'*',
            'rating':'*','ratingChange':'*','beginTime':'2021-01-01','endTime':'2026-10-15',
            'orgCode':'','rcode':'','fields':''
          }
          r=s.get('https://reportapi.eastmoney.com/report/list',params=p,headers=h,timeout=90)
          print('STATUS',r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
          r.raise_for_status()
          rows=r.json().get('data') or []
          print('COUNT',len(rows),flush=True)
          for x in rows:
            out={k:x.get(k) for k in ['title','stockName','stockCode','orgName','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','sRatingName']}
            print('ROW',json.dumps(out,ensure_ascii=False),flush=True)
          PY
