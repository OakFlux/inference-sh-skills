name: Inspect Fujian Cement report archives v2 20260929
on:
  push:
    paths:
      - '.github/workflows/fujian-cement-rar-inspect-v2-20260929.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unar file
      - name: Download archives with retries
        run: |
          set -u
          python - <<'PY'
          import time
          from pathlib import Path
          import requests
          Path('archives').mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sgpjbg.com/'})
          for rid in ('4582','4580'):
              page='https://www.sgpjbg.com/baogao/'+rid+'.html'
              ok=False
              for generation in range(1,5):
                  r=s.get(page,timeout=(30,120)); r.raise_for_status()
                  rr=s.post('https://www.sgpjbg.com/sgpjbg/View.aspx/DownLoad',json={'id':rid},headers={'Content-Type':'application/json; charset=utf-8','X-Requested-With':'XMLHttpRequest','Referer':page},timeout=(30,120)); rr.raise_for_status()
                  url=rr.json()['d']; print('ARCHIVE_URL',rid,generation,url,flush=True)
                  for attempt in range(1,13):
                      try:
                          with s.get(url,headers={'Referer':page},stream=True,timeout=(30,300)) as f:
                              print('ARCHIVE_GET',rid,generation,attempt,f.status_code,f.url,f.headers.get('content-type'),f.headers.get('content-length'),flush=True)
                              if f.status_code != 200:
                                  time.sleep(2); continue
                              dest=Path('archives')/(rid+'.rar')
                              with dest.open('wb') as out:
                                  for chunk in f.iter_content(1024*1024):
                                      if chunk: out.write(chunk)
                              data=dest.read_bytes()
                              if data.startswith(b'Rar!') and len(data)>100000:
                                  print('ARCHIVE_SAVED',rid,len(data),repr(data[:16]),flush=True)
                                  ok=True; break
                              print('BAD_ARCHIVE',rid,len(data),repr(data[:80]),flush=True)
                      except Exception as e:
                          print('GET_ERROR',rid,generation,attempt,repr(e),flush=True)
                      time.sleep(2)
                  if ok: break
                  time.sleep(2)
              if not ok:
                  raise RuntimeError('archive download failed for '+rid)
          PY
          for f in archives/*.rar; do
            echo "==== LIST $f ===="
            file "$f" || true
            7z l -slt "$f" || true
            out="${f%.rar}_out"
            mkdir -p "$out"
            7z x -y -o"$out" "$f" || unar -f -o "$out" "$f" || true
            echo "==== EXTRACTED $out ===="
            find "$out" -type f -printf '%p %s bytes\n' | sort
            while IFS= read -r p; do file "$p"; done < <(find "$out" -type f)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fujian-cement-rar-inspection-v2-20260929
          path: archives
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
