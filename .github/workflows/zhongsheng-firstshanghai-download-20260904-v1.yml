name: Retrieve Zhongsheng research from First Shanghai archive

on:
  push:
    paths:
      - '.github/workflows/zhongsheng-firstshanghai-download-20260904-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search archive, inspect detail pages and verify PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 pypdf
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import parse_qs, urlencode, urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          BASE='https://www.mystockhk.com/'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          S=requests.Session(); S.trust_env=False
          H={'User-Agent':UA,'Accept-Language':'zh-TW,zh;q=0.9,en;q=0.7','Accept':'text/html,application/xhtml+xml,*/*'}
          out=Path('firstshanghai_zhongsheng'); out.mkdir(exist_ok=True)
          page_records=[]; candidate_pages={}; pdf_candidates={}; verified=[]

          def get(url, **kw):
            last=None
            for a in range(4):
              try:
                r=S.get(url,headers=kw.pop('headers',H),timeout=kw.pop('timeout',(15,90)),allow_redirects=True,**kw)
                if not r.encoding or r.encoding.lower()=='iso-8859-1':
                  r.encoding=r.apparent_encoding or 'utf-8'
                return r
              except Exception as e:
                last=e; time.sleep(a+1)
            raise last

          def add_page(url, source, label=''):
            if not url: return
            url=urljoin(BASE,url)
            if not url.startswith(('http://','https://')): return
            rec=candidate_pages.setdefault(url,{'url':url,'sources':[],'labels':[]})
            if source not in rec['sources']: rec['sources'].append(source)
            label=re.sub(r'\s+',' ',label).strip()
            if label and label not in rec['labels']: rec['labels'].append(label[:500])

          def add_pdf(url, source):
            if not url: return
            url=urljoin(BASE,url)
            rec=pdf_candidates.setdefault(url,{'url':url,'sources':[]})
            if source not in rec['sources']: rec['sources'].append(source)

          variants=[]
          for node in ('85','81'):
            for code in ('00881','0881','881'):
              for start,end in [('',''),('2022-03-01','2022-04-15'),('2021-01-01','2022-12-31'),('2016-01-01','2026-12-31')]:
                params={'NodeId':node,'stockCode':code,'StartDate':start,'EndDate':end,'strIndustry':'','page':'1'}
                variants.append(('GET',BASE+'searchInfo.aspx?'+urlencode(params)))
            # known listing pages and dated archive pages
            variants += [('GET',BASE+f'category.aspx?NodeID={node}&page={p}') for p in (1,120,125,130,279,449)]

          seen_urls=set()
          for method,url in variants:
            if url in seen_urls: continue
            seen_urls.add(url)
            try:
              r=get(url)
              text=r.text
              has_target=any(k in text for k in ('中升控股','中升集團','Zhongsheng','00881','(881'))
              page_records.append({'url':url,'status':r.status_code,'bytes':len(r.content),'final':r.url,'encoding':r.encoding,'target':has_target,'title':BeautifulSoup(text,'html.parser').title.get_text(' ',strip=True)[:300] if '<html' in text.lower() and BeautifulSoup(text,'html.parser').title else ''})
              if not has_target and 'searchInfo.aspx' in url:
                print('NO_TARGET',url,len(r.content),flush=True)
              soup=BeautifulSoup(text,'html.parser')
              # Find target containers and every likely detail/download link.
              for tag in soup.find_all(True):
                raw=' '.join([tag.get_text(' ',strip=True)] + [str(tag.get(a) or '') for a in ('href','src','onclick','data-url','data-href','data-id','value')])
                low=raw.lower()
                attrs={a:tag.get(a) for a in ('href','src','onclick','data-url','data-href','data-id','value') if tag.get(a)}
                if any(k.lower() in low for k in ('中升控股','中升集團','zhongsheng','00881','收購仁孚','豪華車比重加大','管道擴張完善')):
                  print('TARGET_TAG',url,tag.name,json.dumps(attrs,ensure_ascii=False),repr(tag.get_text(' ',strip=True)[:1000]),flush=True)
                  parent=tag
                  for _ in range(4):
                    if parent.parent: parent=parent.parent
                  for a in parent.find_all(['a','iframe','embed','object','source','script','img']):
                    for attr in ('href','src','data','onclick','data-url','data-href'):
                      val=a.get(attr)
                      if val:
                        if '.pdf' in val.lower(): add_pdf(val,'target-container:'+url)
                        else: add_page(val,'target-container:'+url,a.get_text(' ',strip=True))
                for attr in ('href','src','data','data-url','data-href'):
                  val=tag.get(attr)
                  if not val: continue
                  lowv=str(val).lower()
                  if '.pdf' in lowv: add_pdf(str(val),'page:'+url)
                  elif any(k in lowv for k in ('detail','info','news','research','download','view','show')):
                    add_page(str(val),'page:'+url,tag.get_text(' ',strip=True))
                onclick=tag.get('onclick') or ''
                for val in re.findall(r"['\"]([^'\"]+)['\"]",onclick):
                  if '.pdf' in val.lower(): add_pdf(val,'onclick:'+url)
                  elif any(k in val.lower() for k in ('detail','info','news','research','download','view','show')) or re.fullmatch(r'\d{3,}',val):
                    add_page(val,'onclick:'+url,tag.get_text(' ',strip=True))
              # Pull URLs and IDs from source around target text.
              for m in re.finditer(r'(中升控股|中升集團|Zhongsheng|00881)',text,re.I):
                chunk=text[max(0,m.start()-5000):m.start()+7000]
                print('TARGET_CHUNK',url,repr(chunk[:12000]),flush=True)
                for val in re.findall(r'https?://[^\s"\'<>]+|(?:[A-Za-z0-9_./-]+\.pdf(?:\?[^\s"\'<>]*)?)|(?:[A-Za-z]+(?:Detail|Info|View|Show)[^"\'<>\s]*)',chunk,re.I):
                  if '.pdf' in val.lower(): add_pdf(val,'chunk:'+url)
                  else: add_page(val,'chunk:'+url)
            except Exception as e:
              page_records.append({'url':url,'error':repr(e)})

          # Follow likely detail pages and extract attachments.
          for rec in list(candidate_pages.values())[:600]:
            url=rec['url']
            host=urlparse(url).netloc.lower()
            if host and not host.endswith('mystockhk.com'): continue
            try:
              r=get(url,timeout=(10,45))
              if len(r.content)>3_000_000: continue
              text=r.text
              target=any(k in text for k in ('中升控股','中升集團','Zhongsheng','00881','收購仁孚','豪華車比重加大','管道擴張完善'))
              if target:
                print('DETAIL_TARGET',url,r.status_code,len(r.content),r.url,flush=True)
              soup=BeautifulSoup(text,'html.parser')
              for tag in soup.find_all(['a','iframe','embed','object','source','script']):
                for attr in ('href','src','data','data-url','onclick'):
                  val=tag.get(attr)
                  if val and '.pdf' in str(val).lower(): add_pdf(str(val),'detail:'+r.url)
              for val in re.findall(r'https?://[^\s"\'<>]+|[A-Za-z0-9_./-]+\.pdf(?:\?[^\s"\'<>]*)?',text,re.I):
                if '.pdf' in val.lower(): add_pdf(val,'detail-regex:'+r.url)
            except Exception: pass

          # Validate direct PDFs and retain only Zhongsheng reports.
          for i,rec in enumerate(list(pdf_candidates.values()),1):
            u=rec['url']
            try:
              r=get(u,headers={**H,'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Referer':BASE},timeout=(15,120))
              print('PDF_TRY',i,u,r.status_code,r.headers.get('content-type'),len(r.content),r.url,r.content[:8],flush=True)
              if r.status_code!=200 or not r.content.startswith(b'%PDF-') or len(r.content)<50000: continue
              rd=PdfReader(BytesIO(r.content),strict=False); pages=len(rd.pages)
              text=''
              for p in list(range(min(8,pages)))+([pages-1] if pages>8 else []):
                try: text+=(rd.pages[p].extract_text() or '')+'\n'
                except Exception: pass
              identity=any(k.lower() in text.lower() for k in ('中升控股','中升集團','zhongsheng group','00881','881'))
              if not identity: continue
              digest=hashlib.sha256(r.content).hexdigest()
              filename=f'{len(verified)+1:02d}_第一上海_中升控股_{pages}页_{digest[:8]}.pdf'
              (out/filename).write_bytes(r.content)
              verified.append({'url':r.url,'source_url':u,'filename':filename,'pages':pages,'bytes':len(r.content),'sha256':digest,'sample':re.sub(r'\s+',' ',text)[:4000],'sources':rec['sources']})
              print('VERIFIED',json.dumps(verified[-1],ensure_ascii=False),flush=True)
            except Exception as e:
              print('PDF_ERROR',u,repr(e),flush=True)

          result={'pages':page_records,'candidate_pages':list(candidate_pages.values()),'pdf_candidates':list(pdf_candidates.values()),'verified':verified}
          Path('firstshanghai_result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('summary.txt').write_text(f"pages={len(page_records)}\ncandidate_pages={len(candidate_pages)}\npdf_candidates={len(pdf_candidates)}\nverified={len(verified)}\n",encoding='utf-8')
          print('FINAL',json.dumps({'pages':len(page_records),'candidate_pages':len(candidate_pages),'pdf_candidates':len(pdf_candidates),'verified':len(verified)},ensure_ascii=False),flush=True)
          PY
      - name: Upload results and any verified PDFs
        uses: actions/upload-artifact@v4
        with:
          name: zhongsheng-firstshanghai-20260904-v1
          path: |
            firstshanghai_result.json
            summary.txt
            firstshanghai_zhongsheng/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
