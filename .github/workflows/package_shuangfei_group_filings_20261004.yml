name: Package Shuangfei Group filings

on:
  push:
    paths:
      - '.github/workflows/package_shuangfei_group_filings_20261004.yml'
      - 'tools/package_shuangfei_group_filings_20261004.py'
      - 'tools/patch_shuangfei_group_query_20261004.py'
      - 'tools/patch_shuangfei_prospectus_20261004.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Patch historical-name and pagination queries
        run: python tools/patch_shuangfei_group_query_20261004.py
      - name: Use verified final prospectus attachment
        run: python tools/patch_shuangfei_prospectus_20261004.py
      - name: Download validate and package filings
        run: python tools/package_shuangfei_group_filings_20261004.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: shuangfei-group-300817-all-annual-prospectus-latest-quarter
          path: |
            双飞集团_300817_所有年报_招股说明书及最新季报.zip
            shuangfei_group_filings_result.json
            _previews_shuangfei_group_filings/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
