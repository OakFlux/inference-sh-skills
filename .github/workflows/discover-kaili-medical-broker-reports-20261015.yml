name: Discover Kaili Medical broker reports 20261015

on:
  push:
    branches:
      - kaili-medical-broker-reports-20261015
    paths:
      - scripts/discover_kaili_medical_broker_reports_20261015.py
      - .github/workflows/discover-kaili-medical-broker-reports-20261015.yml
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Query Eastmoney report archive
        run: python scripts/discover_kaili_medical_broker_reports_20261015.py
